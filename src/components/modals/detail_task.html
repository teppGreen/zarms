<!-- タスク詳細モーダル -->
<dialog id="modal-detail-task" class="modal large">
  <div class="row no-space align-center">
    <div class="max">
      <h5 class="bold mb-0">タスク詳細</h5>
    </div>
    <button class="border round small-margin">
      <i>link</i>
      <span id="task-display-id" style="font-family: 'Roboto Mono', monospace; font-weight: 500;"
        class="large-text"></span>
    </button>
    <button class="circle transparent" onclick="App.modals.taskDetail.close()">
      <i>close</i>
    </button>
  </div>

  <div class="padding">
    <div class="grid no-space">
      <!-- Left Column: Main Info -->
      <div class="s12 m8 small-padding">
        <!-- Task Name -->
        <div class="field label border">
          <input type="text" id="task-name-input" onchange="App.modals.taskDetail.updateField('name', this.value)">
          <label>タスク名</label>
        </div>

        <!-- Description -->
        <div class="field label border textarea">
          <textarea id="task-description-input" rows="5"
            onchange="App.modals.taskDetail.updateField('description', this.value)"></textarea>
          <label>説明</label>
        </div>
      </div>

      <!-- Right Column: Metadata -->
      <div class="s12 m4 small-padding">
        <!-- Status -->
        <div class="field label border">
          <select id="task-status-select" onchange="App.modals.taskDetail.updateField('task_status_key', this.value)">
            <option value="DRAFT">下書き</option>
            <option value="TODO">未着手</option>
            <option value="IN_PROGRESS">進行中</option>
            <option value="IN_REVIEW">確認中</option>
            <option value="DONE">完了</option>
          </select>
          <label>ステータス</label>
        </div>

        <!-- Board -->
        <div class="field label border">
          <select id="task-board-select" onchange="App.modals.taskDetail.updateField('board_id', this.value)">
            <!-- 動的に生成 -->
          </select>
          <label>ボード</label>
        </div>

        <!-- Due Date -->
        <div class="field label border">
          <input type="datetime-local" id="task-ends-at-input"
            onchange="App.modals.taskDetail.updateField('ends_at', this.value)">
          <label>期限</label>
        </div>

        <!-- Start Date -->
        <div class="field label border">
          <input type="datetime-local" id="task-starts-at-input"
            onchange="App.modals.taskDetail.updateField('starts_at', this.value)">
          <label>開始日</label>
        </div>
      </div>
    </div>
  </div>
</dialog>

<script>
  (function () {
    App.modals.taskDetail = {
      currentId: null,
      currentItem: null,

      /**
       * タスク詳細モーダルを開く
       * @param {string} taskId - タスクID
       */
      open: function (taskId) {
        console.log('[TaskDetail] open called with id:', taskId);

        if (!taskId) {
          console.error('[TaskDetail] Invalid task ID');
          return;
        }

        this.currentId = taskId;
        showLoading();

        // tasks データから取得（App.state.data.tasksに既にロード済み）
        const tasks = App.state.data.tasks || [];
        const task = tasks.find(t => t.id === taskId);

        if (!task) {
          console.error('[TaskDetail] Task not found:', taskId);
          hideLoading();
          alert('タスクが見つかりません');
          return;
        }

        this.currentItem = task;
        this.render(task);
        hideLoading();
        ui('#modal-detail-task');
      },

      /**
       * モーダルを閉じる
       */
      close: function () {
        ui('#modal-detail-task');
        this.reset();
      },

      /**
       * モーダルをリセット
       */
      reset: function () {
        this.currentId = null;
        this.currentItem = null;

        // 入力フィールドをクリア
        const fields = ['task-name-input', 'task-description-input', 'task-assignee-display', 'task-ends-at-input', 'task-starts-at-input'];
        fields.forEach(id => {
          const el = document.getElementById(id);
          if (el) el.value = '';
        });

        const displayId = document.getElementById('task-display-id');
        if (displayId) displayId.textContent = '';
      },

      /**
       * タスクデータをフォームに描画
       * @param {Object} task - タスクオブジェクト
       */
      render: function (task) {
        console.log('[TaskDetail] Rendering task:', task);

        // Display ID
        const displayIdEl = document.getElementById('task-display-id');
        if (displayIdEl) {
          displayIdEl.textContent = task.display_id || '';
        }

        // Name
        const nameInput = document.getElementById('task-name-input');
        if (nameInput) nameInput.value = task.name || '';

        // Description
        const descInput = document.getElementById('task-description-input');
        if (descInput) descInput.value = task.description || '';

        // Status
        const statusSelect = document.getElementById('task-status-select');
        if (statusSelect) statusSelect.value = task.task_status_key || 'TODO';

        // Board
        this.renderBoardOptions(task.board_id);

        // Assignee
        this.renderAssignee(task.assignee_id);

        // Dates
        const endsAtInput = document.getElementById('task-ends-at-input');
        if (endsAtInput) endsAtInput.value = formatDateTimeForInput(task.ends_at) || '';

        const startsAtInput = document.getElementById('task-starts-at-input');
        if (startsAtInput) startsAtInput.value = formatDateTimeForInput(task.starts_at) || '';
      },

      /**
       * ボード選択オプションを生成
       * @param {string} selectedBoardId - 選択中のボードID
       */
      renderBoardOptions: function (selectedBoardId) {
        const boardSelect = document.getElementById('task-board-select');
        if (!boardSelect) return;

        const boards = App.state.data.boards || [];
        boardSelect.innerHTML = boards.map(board =>
          `<option value="${escapeHtml(board.id)}" ${board.id === selectedBoardId ? 'selected' : ''}>${escapeHtml(board.name || '')}</option>`
        ).join('');
      },

      /**
       * 担当者表示を更新
       * @param {string} assigneeId - 担当者ID
       */
      renderAssignee: function (assigneeId) {
        const assigneeDisplay = document.getElementById('task-assignee-display');
        if (!assigneeDisplay) return;

        if (!assigneeId) {
          assigneeDisplay.value = '未割り当て';
          return;
        }

        const members = App.state.data.members || [];
        const member = members.find(m => m.id === assigneeId);
        assigneeDisplay.value = member ? (member.display_name || member.email || '不明') : '未割り当て';
      },

      /**
       * 担当者選択モーダルを開く
       */
      selectAssignee: function () {
        if (!App.modals.selectMembers) {
          console.error('[TaskDetail] selectMembers modal not available');
          return;
        }

        const currentAssignee = this.currentItem ? this.currentItem.assignee_id : null;

        App.modals.selectMembers.open({
          multiSelect: false,
          preSelected: currentAssignee ? [currentAssignee] : [],
          callback: (selectedIds) => {
            if (selectedIds && selectedIds.length > 0) {
              this.updateField('assignee_id', selectedIds[0]);
              this.renderAssignee(selectedIds[0]);
            }
          }
        });
      },

      /**
       * フィールドを更新
       * @param {string} field - フィールド名
       * @param {*} value - 新しい値
       */
      updateField: function (field, value) {
        const id = this.currentId;
        console.log(`[TaskDetail] Update requested - Field: ${field}, Value: ${value}, ID: ${id}`);

        if (!id) {
          console.error('[TaskDetail] Cannot update: No ID');
          return;
        }

        let finalValue = value;

        // 日付フィールドの処理
        if (field === 'ends_at' || field === 'starts_at') {
          if (value) {
            try {
              const d = new Date(value);
              if (isNaN(d.getTime())) {
                throw new Error('Invalid date');
              }
              finalValue = d.toISOString();
            } catch (e) {
              console.warn('[TaskDetail] Invalid date format:', value);
              return;
            }
          } else {
            finalValue = null;
          }
        }

        const oldItem = { ...this.currentItem };
        this.currentItem[field] = finalValue;

        // Optimistic UI update
        updateLocalData(TABLE_NAMES.TASKS, id, { [field]: finalValue });

        // DB更新
        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'update', {
          where: { id: ["=", id] },
          set: { [field]: finalValue }
        }, `タスクの${field}を更新`)
          .then(result => {
            if (!result || (Array.isArray(result) && result.length === 0)) {
              console.error('[TaskDetail] Update returned failure');
              alert('更新に失敗しました');
              // Rollback
              this.currentItem[field] = oldItem[field];
              rollbackLocalData(TABLE_NAMES.TASKS, id, oldItem);
              this.render(this.currentItem);
            } else {
              console.log('[TaskDetail] Update successful');
              // カンバンを再描画（ステータス変更時など）
              if (field === 'task_status_key' || field === 'board_id' || field === 'name' || field === 'assignee_id') {
                const boardId = this.currentItem.board_id;
                if (boardId && App.pages.boards && App.pages.boards.renderKanban) {
                  App.pages.boards.renderKanban(boardId);
                }
              }
            }
          })
          .catch(error => {
            console.error('[TaskDetail] Update exception:', error);
            App.utils.error.handle(error);
            // Rollback
            this.currentItem[field] = oldItem[field];
            rollbackLocalData(TABLE_NAMES.TASKS, id, oldItem);
            this.render(this.currentItem);
          });
      }
    };
  })();
</script>
