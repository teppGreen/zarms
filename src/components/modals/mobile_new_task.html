<!-- モバイル版タスク作成モーダル -->
<dialog id="modal-mobile-new-task" class="modal max">
  <div class="surface-container padding">
    <!-- ヘッダー -->
    <nav class="row">
      <button class="circle transparent" onclick="App.modals.mobileNewTask.close()">
        <i>close</i>
      </button>
      <h6 class="max">新しいタスク</h6>
      <button class="circle transparent" onclick="App.modals.mobileNewTask.create()">
        <i>check</i>
      </button>
    </nav>

    <!-- タスク作成フォーム -->
    <div id="mobile-new-task-form" class="top-margin">
      <!-- タスク名 -->
      <div class="field label border">
        <input type="text" id="mobile-new-task-name" placeholder=" ">
        <label>タスク名</label>
      </div>

      <!-- ボード選択 -->
      <div class="field label border top-margin">
        <select id="mobile-new-task-board">
          <!-- JavaScriptで動的に生成 -->
        </select>
        <label>ボード</label>
      </div>

      <!-- 優先度 -->
      <div class="field label border top-margin">
        <select id="mobile-new-task-priority">
          <option value="LOW">低</option>
          <option value="MEDIUM" selected>中</option>
          <option value="HIGH">高</option>
        </select>
        <label>優先度</label>
      </div>

      <!-- 開始日時 -->
      <div class="field label border top-margin">
        <input type="datetime-local" id="mobile-new-task-starts-at" placeholder=" ">
        <label>開始日時</label>
      </div>

      <!-- 終了日時 -->
      <div class="field label border top-margin">
        <input type="datetime-local" id="mobile-new-task-ends-at" placeholder=" ">
        <label>終了日時</label>
      </div>

      <!-- 作成ボタン -->
      <div class="top-margin">
        <button class="responsive primary extra" onclick="App.modals.mobileNewTask.create()">
          <i>add</i>
          <span>作成</span>
        </button>
      </div>
    </div>
  </div>
</dialog>

<script>
  (function () {
    App.modals.mobileNewTask = {
      /**
       * タスク作成モーダルを開く
       */
      open: function () {
        console.log('[MobileNewTask] Opening modal');

        const dialog = document.getElementById('modal-mobile-new-task');
        if (!dialog) {
          console.error('[MobileNewTask] Dialog not found');
          return;
        }

        // ボード一覧を読み込み
        this.loadBoards();

        dialog.classList.add('active');

        // フォームをクリア
        this.clearForm();
      },

      /**
       * ボード一覧を読み込み
       */
      loadBoards: async function () {
        const select = document.getElementById('mobile-new-task-board');
        if (!select) return;

        try {
          // ボード一覧を取得（キャッシュから）
          let boards = App.state.data.boards || [];

          if (boards.length === 0) {
            // キャッシュがない場合は取得
            const result = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'select', {
              where: { is_active: ['=', true] }
            }, null, false);
            boards = result?.data || result || [];
            App.state.data.boards = boards;
          }

          // アクティブなボードのみ
          const activeBoards = boards.filter(b => b.is_active);

          // selectを更新
          select.innerHTML = '';
          activeBoards.forEach(board => {
            const option = document.createElement('option');
            option.value = board.id;
            option.textContent = board.name;
            select.appendChild(option);
          });

          // デフォルトで最初のボードを選択
          if (activeBoards.length > 0) {
            select.value = activeBoards[0].id;
          }

        } catch (error) {
          console.error('[MobileNewTask] Error loading boards:', error);
        }
      },

      /**
       * フォームをクリア
       */
      clearForm: function () {
        const nameInput = document.getElementById('mobile-new-task-name');
        const startsAtInput = document.getElementById('mobile-new-task-starts-at');
        const endsAtInput = document.getElementById('mobile-new-task-ends-at');
        const prioritySelect = document.getElementById('mobile-new-task-priority');

        if (nameInput) nameInput.value = '';
        if (startsAtInput) startsAtInput.value = '';
        if (endsAtInput) endsAtInput.value = '';
        if (prioritySelect) prioritySelect.value = 'MEDIUM';
      },

      /**
       * タスクを作成
       */
      create: async function () {
        const name = document.getElementById('mobile-new-task-name')?.value;
        const boardId = document.getElementById('mobile-new-task-board')?.value;
        const priority = document.getElementById('mobile-new-task-priority')?.value;
        const startsAt = document.getElementById('mobile-new-task-starts-at')?.value || null;
        const endsAt = document.getElementById('mobile-new-task-ends-at')?.value || null;

        // バリデーション
        if (!name || !name.trim()) {
          showSnackbar('タスク名を入力してください');
          return;
        }

        if (!boardId) {
          showSnackbar('ボードを選択してください');
          return;
        }

        try {
          // タスクを作成
          const result = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'insert', {
            values: {
              name: name,
              board_id: boardId,
              priority_key: priority,
              task_status_key: 'TODO',
              processed_by: App.state.userId,
              starts_at: startsAt,
              ends_at: endsAt,
              description: ''
            }
          }, `タスク「${name}」を作成しました`);

          showSnackbar('タスクを作成しました');

          // モーダルを閉じる
          this.close();

          // データを再読み込み
          await App.pages.mobileBoard.loadData(true);

        } catch (error) {
          console.error('[MobileNewTask] Create error:', error);
          showSnackbar('タスクの作成に失敗しました: ' + error.message);
        }
      },

      /**
       * モーダルを閉じる
       */
      close: function () {
        const dialog = document.getElementById('modal-mobile-new-task');
        if (dialog) {
          dialog.classList.remove('active');
        }
        return true;
      }
    };
  })();
</script>
