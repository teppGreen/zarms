<nav id="left-nav" class="m l left no-wrap small-padding small-width max no-scroll surface-container">
    <header class="row padding no-margin">
        <h1 class="font-title" style="font-size: 1.5rem;">ZEN Boards</h1>
    </header>

    <a id="home-nav" onclick="App.utils.navigation.switchTab('home')">
        <i>home</i>
        <span>ホーム</span>
    </a>
    <a id="members-nav" onclick="App.utils.navigation.switchTab('members')">
        <i>groups</i>
        <span>メンバー</span>
    </a>
    <a id="my-board-nav" onclick="App.utils.navigation.switchTab('')">
        <i>assignment</i>
        <span>マイボード</span>
    </a>

    <!-- 動的ボードリスト -->
    <nav id="boards-nav" class="scroll surface-container no-padding left max">
    </nav>
</nav>

<script>
    (function () {
        App.utils.navigation = {
            /**
             * タブを切り替える
             * @param {string} tabName - タブID（例: 'home', 'members', 'board-UUID'）
             * @param {boolean} skipUrlUpdate - trueの場合、URL更新をスキップ（履歴操作時に使用）
             */
            switchTab: async function (tabName, skipUrlUpdate = false) {
                console.log(`switchTab called with: ${tabName}, skipUrlUpdate: ${skipUrlUpdate}`);
                const isBoardTab = tabName.startsWith('board-');

                // 現在のタブを取得して処理（必要なら）
                const currentTab = Array.from(document.querySelectorAll('main > div')).find(el => el.style.display !== 'none');
                console.log(`Current tab:`, currentTab);

                // Overlayが開いている場合はリセット (汎用化)
                if (currentTab && typeof currentTab.id === 'string' && currentTab.id.startsWith('detail-')) {
                    // モーダルやオーバーレイのリセット処理があればここで
                    // 現状はHTML構造が変わったため（overlays -> modals）、一旦スキップまたは必要に応じて実装
                }

                // 左navのアクティブ状態管理
                const sidebarLinks = document.querySelectorAll('nav.left a');
                sidebarLinks.forEach(item => item.classList.remove('active'));

                let activeLink;
                if (isBoardTab) {
                    const boardId = tabName.replace('board-', '');
                    activeLink = document.querySelector(`a[data-board-id="${boardId}"]`);
                } else {
                    activeLink = document.getElementById(tabName + '-nav');
                }

                if (activeLink) activeLink.classList.add('active');

                // ページ表示切り替え
                document.querySelectorAll('main > div').forEach(el => el.style.display = 'none');

                if (isBoardTab) {
                    // ボードタブの場合、ボードコンテナを表示し、その中の特定ボードを表示する
                    const boardId = tabName.replace('board-', '');
                    const boardContainer = document.getElementById('tab-board');
                    if (boardContainer) {
                        boardContainer.style.display = 'block';
                        // 全ての個別ボードを一旦非表示
                        Array.from(boardContainer.children).forEach(child => {
                            if (child.id && child.id.startsWith('tab-board-')) {
                                child.style.display = 'none';
                            }
                        });

                        const targetBoardPageId = 'tab-board-' + boardId;
                        const targetBoardPage = document.getElementById(targetBoardPageId);
                        if (targetBoardPage) {
                            targetBoardPage.style.display = 'block';
                            if (App.pages.boards && App.pages.boards.loadData) {
                                // 既に描画済み（キャンバスにコンテンツがある）場合はtrueを渡してローディング表示をスキップ
                                const canvas = document.getElementById('kanban-canvas-' + boardId);
                                const isRendered = canvas && canvas.children.length > 0;
                                await App.pages.boards.loadData(boardId, isRendered);
                            }
                        } else {
                            console.error('Target board page not found:', targetBoardPageId);
                        }
                    }
                } else {
                    let targetPageId = 'tab-' + tabName;
                    let targetPage = document.getElementById(targetPageId);
                    console.log(`Target page ID: ${targetPageId}, Found:`, !!targetPage);

                    if (targetPage) {
                        targetPage.style.display = 'block';
                        await this.loadTabData(tabName);
                    } else {
                        alert(`開こうとしたページが見つかりません。削除された可能性があります。\nページID: ${targetPageId}`);
                        // フォールバック: Homeへ
                        if (tabName !== 'home') {
                            await this.switchTab('home');
                        }
                    }
                }

                // URLパラメータを更新（skipUrlUpdateがfalseの場合のみ）
                if (!skipUrlUpdate && App.utils.url && App.utils.url.updateParams) {
                    const params = App.utils.url.getParamsFromTabId(tabName);
                    App.utils.url.updateParams(params, false);
                }
            },

            /**
             * 詳細画面から戻る
             */
            goBack: function (targetId) {
                if (!targetId) targetId = 'home';

                if (targetId.startsWith('tab-')) {
                    this.switchTab(targetId.replace('tab-', ''));
                } else {
                    this.switchTab(targetId);
                }
            },

            /**
             * 通常タブデータを読み込む
             */
            loadTabData: async function (tabName) {
                console.log(`loadTabData called for: ${tabName}`);
                showLoading();

                if (App.pages[tabName] && App.pages[tabName].loadData) {
                    await App.pages[tabName].loadData();
                } else {
                    hideLoading();
                }
            },

            /**
             * 動的にボードリストを生成
             */
            renderBoardsNavigation: function () {
                console.log('[renderBoardsNavigation] Start. UserProperties:', App.state.userProperties);

                // 現在のアクティブなボードIDを保存
                const activeLink = document.querySelector('#boards-nav a.active');
                const activeBoardId = activeLink ? activeLink.dataset.boardId : null;
                console.log('[renderBoardsNavigation] Current active board ID:', activeBoardId);

                const boards = App.state.data.boards || [];
                console.log('[renderBoardsNavigation] Total boards:', boards.length);
                let starredBoardIndex = [];
                let activeBoardIndex = [];
                let archiveBoardIndex = [];
                const boardsNavigation = document.getElementById('boards-nav');

                let html = '<hr class="small-margin">';

                // ユーザープロパティからstarred_boardsを取得してパース
                // 共通の getUserProperty を使用
                const starredBoards = App.state.getUserProperty('starred_boards', []);
                console.log('[renderBoardsNavigation] Starred boards:', JSON.stringify(starredBoards));
                console.log('[renderBoardsNavigation] Starred boards type:', typeof starredBoards, 'isArray:', Array.isArray(starredBoards));

                // 1. Starred Boards (Active only)
                if (Array.isArray(starredBoards) && starredBoards.length > 0) {
                    console.log('[renderBoardsNavigation] Rendering starred boards section...');
                    let hasRenderedStarred = false;
                    starredBoards.forEach(starredId => {
                        console.log('[renderBoardsNavigation] Processing starred board ID:', starredId);
                        const boardIndex = boards.findIndex(b => b.id === starredId);
                        if (boardIndex !== -1) {
                            const board = boards[boardIndex];
                            console.log('[renderBoardsNavigation] Found board:', board.name, 'is_active:', board.is_active);
                            // is_activeがTRUEの場合のみ描画
                            if (board.is_active) {
                                html += this.createBoardLink(board, true);
                                starredBoardIndex.push(boardIndex);
                                hasRenderedStarred = true;
                                console.log('[renderBoardsNavigation] Rendered starred board:', board.name);
                            }
                        } else {
                            console.warn('[renderBoardsNavigation] Starred board not found in boards array:', starredId);
                        }
                    });
                    console.log('[renderBoardsNavigation] Starred boards rendered count:', starredBoardIndex.length);

                }
                
                if(!starredBoardIndex.length){
                    console.log('[renderBoardsNavigation] No starred boards, showing placeholder');
                    html += `<p class="left-padding top-margin bottom-margin secondary-text left-align middle-align row tiny-space">
                        <i class="medium">folder_special</i>
                        <span class="small-text no-line">スターを付けたボードは<br>ここに表示されます</span>
                    </p>`;
                }

                html += `<hr class="small-margin">`;

                // 2. Active Boards (Non-starred)
                console.log('[renderBoardsNavigation] Rendering active boards section...');
                boards.forEach((board, index) => {
                    // 既に描画済みのindexはスキップ
                    if (starredBoardIndex.includes(index)) return;

                    if (board.is_active) {
                        html += this.createBoardLink(board, false);
                        activeBoardIndex.push(index);
                    }
                });
                console.log('[renderBoardsNavigation] Active boards rendered count:', activeBoardIndex.length);

                if (!activeBoardIndex.length) {
                    html += `<p class="left-padding top-margin bottom-margin secondary-text left-align middle-align row tiny-space">
                        <i class="medium">folder</i>
                        <span class="small-text no-line">アクティブなボードは<br>ここに表示されます</span>
                    </p>`;
                }


                html += `<hr class="small-margin">`;

                // 3. Inactive Boards (Archive)
                console.log('[renderBoardsNavigation] Rendering archived boards section...');
                boards.forEach((board, index) => {
                    if (!board.is_active) {
                        html += this.createBoardLink(board, false);
                        archiveBoardIndex.push(index);
                    }
                });
                console.log('[renderBoardsNavigation] Archived boards rendered count:', archiveBoardIndex.length);

                if (!archiveBoardIndex.length) {
                    html += `<p class="left-padding top-margin bottom-margin secondary-text left-align middle-align row tiny-space">
                        <i class="medium">folder_off</i>
                        <span class="small-text no-line">アーカイブしたボードは<br>ここに表示されます</span>
                    </p>`;
                }

                boardsNavigation.innerHTML = html;
                console.log('[renderBoardsNavigation] Navigation HTML updated');

                // アクティブ状態を復元
                if (activeBoardId) {
                    const newActiveLink = boardsNavigation.querySelector(`a[data-board-id="${activeBoardId}"]`);
                    if (newActiveLink) {
                        newActiveLink.classList.add('active');
                        console.log('[renderBoardsNavigation] Restored active class to:', activeBoardId);
                    } else {
                        console.warn('[renderBoardsNavigation] Could not find link to restore active class for:', activeBoardId);
                    }
                }
                console.log('[renderBoardsNavigation] End.');
            },

            createBoardLink: function (board, isStarred) {
                const boardTabName = 'board-' + board.id;
                // アイコン: Inactiveならfolder_off, Activeならstarred状態に合わせて変更
                const icon = !board.is_active ? 'folder_off' : (isStarred ? 'folder_special' : 'folder');
                // text class: Inactiveなら薄くするなどのスタイルがあれば適用(ここではopacity-textを使用してみる)
                const textClass = !board.is_active ? 'secondary-text' : '';

                return `
                        <a onclick="App.utils.navigation.switchTab('${boardTabName}')" data-board-id="${board.id}">
                            <i class="${textClass}">${icon}</i>
                            <span class="${textClass}">${escapeHtml(board.name || '')}</span>
                        </a>
                    `;
            },

            /**
             * 初期ロード時のシマーエフェクトを描画
             */
            renderLoadingPlaceholders: function () {
                const nav = document.getElementById('boards-nav');
                if (!nav) return;

                let html = '<hr class="small-margin">';
                for (let i = 0; i < 9; i++) {
                    const delay = i * 0.1;
                    html += `
                        <a class="shimmer-loading" style="animation-delay: ${delay}s">
                            <i></i>
                            <span>　　　　　　　　</span>
                        </a>
                    `;
                    if (i === 2 || i === 5) html += `<hr class="small-margin">`;
                }
                nav.innerHTML = html;
            }
        };

        // 初期表示時にプレースホルダーを描画
        App.utils.navigation.renderLoadingPlaceholders();
    })();
</script>
