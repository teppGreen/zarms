<nav id="left-nav" class="m l left no-wrap small-padding no-scroll small-width max surface-container">
    <header class="padding no-margin">
        <h1 style="font-family: 'Google Sans Flex', sans-serif; font-weight: 600; font-size: 1.5rem;">ZEN Boards</h1>
    </header>

    <a id="home-nav" onclick="App.utils.navigation.switchTab('home')">
        <i>home</i>
        <span>ホーム</span>
    </a>
    <a id="members-nav" onclick="App.utils.navigation.switchTab('members')">
        <i>groups</i>
        <span>メンバー</span>
    </a>
    <a id="my-boards-nav" onclick="App.utils.navigation.switchTab('home')">
        <i>assignment</i>
        <span>マイボード</span>
    </a>
    <hr class="small-margin">

    <!-- 動的ボードリスト -->
    <nav id="boards-navigation" class="scroll no-padding left max">
        <!-- is_activeがTRUEかつユーザープロパティのstarredBoards配列に含まれているボードを動的にここに入れ込む。 -->
        <div id="starred-boards"></div>
        <hr class="small-margin" id="starred-divider" style="display: none;">

        <!-- is_activeがTRUEかつユーザープロパティのstarredBoards配列に含まれていないボードを動的にここに入れ込む。 -->
        <div id="active-boards"></div>
        <hr class="small-margin" id="active-divider" style="display: none;">

        <!-- is_activeがFALSEのボードを動的にここに入れ込む。 -->
        <div id="inactive-boards"></div>
    </nav>
</nav>

<script>
    (function () {
        App.utils.navigation = {
            /**
             * タブを切り替える
             */
            switchTab: function (tabName) {
                // 他のタブに切り替える前にhomeタブの処理を停止
                const currentTab = Array.from(document.querySelectorAll('main > div')).find(el => el.style.display !== 'none');
                if (currentTab && currentTab.id === 'tab-home') {
                    // stopRemainingTimeUpdatesが存在する場合のみ呼び出し
                    if (typeof stopRemainingTimeUpdates === 'function') {
                        stopRemainingTimeUpdates();
                    }
                }

                // Overlayが開いている場合はリセット
                if (currentTab && currentTab.id.startsWith('detail-')) {
                    const overlayMap = {
                        'detail-creative': 'creativeDetail',
                        'detail-member': 'memberDetail',
                        'detail-plan': 'planDetail',
                        'detail-task': 'taskDetail'
                    };
                    const overlayName = overlayMap[currentTab.id];
                    if (overlayName && App.overlays[overlayName] && typeof App.overlays[overlayName].reset === 'function') {
                        App.overlays[overlayName].reset();
                    }
                }

                // 右navから開いているページを閉じる
                if (App.utils.navigation.closeRightNavOverlay) {
                    App.utils.navigation.closeRightNavOverlay();
                }

                // 左navのアクティブ状態管理
                const sidebarLinks = document.querySelectorAll('nav.left a');
                if (sidebarLinks.length > 0) {
                    sidebarLinks.forEach(item => item.classList.remove('active'));
                    const activeLink = document.getElementById(tabName + '-nav');
                    if (activeLink) activeLink.classList.add('active');
                }

                // homeボタンのアクティブ状態管理
                const homeNav = document.getElementById('home-nav');
                if (homeNav) {
                    if (tabName === 'home') {
                        homeNav.classList.add('active');
                    } else {
                        homeNav.classList.remove('active');
                    }
                }

                document.querySelectorAll('main > div').forEach(el => el.style.display = 'none');
                document.getElementById('tab-' + tabName).style.display = 'block';
                this.loadTabData(tabName);
            },

            /**
             * 詳細画面から戻る
             * @param {string} tabName - 戻り先のタブ名
             * @param {Object} detailPageObj - 詳細ページオブジェクト (resetメソッドを持つ)
             */
            goBack: function (targetId, detailPageObj) {
                if (!targetId) targetId = 'home';

                if (targetId.startsWith('tab-')) {
                    // タブIDの場合
                    this.switchTab(targetId.replace('tab-', ''));
                } else if (targetId.startsWith('detail-')) {
                    // 詳細画面IDの場合
                    document.querySelectorAll('main > div').forEach(el => el.style.display = 'none');
                    const targetEl = document.getElementById(targetId);
                    if (targetEl) targetEl.style.display = 'block';
                } else {
                    // 単なるタブ名の場合
                    this.switchTab(targetId);
                }

                if (detailPageObj && typeof detailPageObj.reset === 'function') {
                    detailPageObj.reset();
                }
            },

            /**
             * タブデータを読み込む
             */
            loadTabData: function (tabName) {
                console.log(`loadTabData called for: ${tabName}`);
                showLoading();
                let loader = null;

                if (App.pages[tabName] && App.pages[tabName].loadData) {
                    loader = App.pages[tabName].loadData;
                }

                if (loader) {
                    loader();
                } else {
                    console.warn(`No loader found for tab: ${tabName}`);
                    hideLoading();
                }
            },

            /**
             * 動的にボードリストを生成
             */
            renderBoardsNavigation: function () {
                const boards = App.state.data.boards || [];

                // TODO: ユーザープロパティからstarredBoardsを取得
                // 今は全ボードを通常表示
                const starredBoards = [];

                const starredContainer = document.getElementById('starred-boards');
                const activeContainer = document.getElementById('active-boards');
                const inactiveContainer = document.getElementById('inactive-boards');
                const starredDivider = document.getElementById('starred-divider');
                const activeDivider = document.getElementById('active-divider');

                let starredHtml = '';
                let activeHtml = '';
                let inactiveHtml = '';

                boards.forEach(board => {
                    const isStarred = starredBoards.includes(board.id);

                    const boardLink = `
                        <a onclick="loadBoardPage('${board.id}')">
                            <i>${board.is_active ? (isStarred ? 'folder_special' : 'folder') : 'folder_off'}</i>
                            <span>${escapeHtml(board.name || '')}</span>
                        </a>
                    `;

                    if (board.is_active) {
                        if (isStarred) {
                            starredHtml += boardLink;
                        } else {
                            activeHtml += boardLink;
                        }
                    } else {
                        inactiveHtml += boardLink;
                    }
                });

                starredContainer.innerHTML = starredHtml;
                activeContainer.innerHTML = activeHtml;
                inactiveContainer.innerHTML = inactiveHtml;

                // 区切り線の表示制御
                starredDivider.style.display = starredHtml ? 'block' : 'none';
                activeDivider.style.display = activeHtml ? 'block' : 'none';
            }
        };

        // ページロード時にボードナビゲーションを初期化
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (App.utils.navigation.renderBoardsNavigation) {
                    App.utils.navigation.renderBoardsNavigation();
                }
            }, 200);
        });
    })();
</script>
