<script>
    (function () {
        document.addEventListener('DOMContentLoaded', function () {
            const helpLink = document.getElementById('help-link');
            if (helpLink) {
                helpLink.href = EXTERNAL_URLS.HELP_SITE;
            }
            const termsLink = document.getElementById('terms-link');
            if (termsLink) {
                termsLink.href = EXTERNAL_URLS.TERMS_SITE;
            }
        });

        App.utils.header = {
            /**
             * appsテーブルのデータからアプリリンクを動的に生成します
             */
            renderApps: function () {
                const appsGrid = document.getElementById('apps-grid');
                if (!appsGrid) {
                    console.warn('apps-grid element not found');
                    return;
                }

                // App.state.data.appsからデータを取得
                const apps = App.state.data.apps || [];

                if (apps.length === 0) {
                    appsGrid.innerHTML = '<div class="padding center-align row"><p>リンクがありません</p></div>';
                    return;
                }

                // リンクボタンを生成
                const appsHtml = apps.map(app => {

                    return `
                        <article class="background no-elevate small-round small-margin row" onclick="window.open('${app.url}', '_blank', 'noopener noreferrer')" style="cursor: pointer;">
                            <img class="square tiny small-round" src="https:\/\/t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${app.url}&size=128"
                                alt="${app.name}">
                            <span class="no-wrap">${app.name}</span>
                        </article>
                    `;
                }).join('');

                appsGrid.innerHTML = appsHtml;
            },

            /**
             * 「+ 新規作成」ボタンのドロップダウンの表示/非表示を切り替えます。
             */
            toggleNewButtonDropdown: function (event) {
                event.stopPropagation(); // bodyのクリックイベントへの伝播を防ぐ
                const dropdown = document.getElementById('new-button-dropdown');
                if (dropdown) {
                    dropdown.classList.toggle('show');
                }
            },

            /**
             * 新規作成ボタンのドロップダウンを閉じます
             */
            closeNewButtonDropdown: function () {
                const dropdown = document.getElementById('new-button-dropdown');
                if (dropdown) {
                    dropdown.classList.remove('show');
                }
            },

            // ============================================
            // コメント通知機能
            // ============================================
            comments: {
                /** キャッシュされたコメントデータ */
                cachedComments: null,
                /** 最終更新日時 */
                lastUpdatedAt: null,
                /** 初回ロード済みフラグ */
                isLoaded: false,
                /** ロード中フラグ（重複呼び出し防止） */
                isLoading: false,

                /**
                 * コメントメニューの表示切替とデータロード
                 */
                toggle: function () {
                    const container = document.getElementById('comments-list');
                    if (!container) return;

                    if (this.isLoaded && this.cachedComments) {
                        // ロード済み: キャッシュデータを即時描画し、バックグラウンドで最新データを取得
                        this.render(this.cachedComments);
                        this.loadData(true);
                    } else {
                        // 未ロード: シマーを表示してデータ取得
                        this.showShimmer(container);
                        this.loadData(false);
                    }
                },

                /**
                 * シマーエフェクトを表示
                 */
                showShimmer: function (container) {
                    container.innerHTML = `
                        <div class="center padding center-align row small-space">
                            <progress class="circle indeterminate small"></progress>
                            <span>読み込み中...</span>
                        </div>
                    `
                },

                /**
                 * データを取得して描画
                 * @param {boolean} forceRefresh - キャッシュを無視して強制再取得するか
                 * @returns {Promise}
                 */
                loadData: async function (forceRefresh = false) {
                    if (this.isLoading && !forceRefresh) return;
                    this.isLoading = true;

                    try {
                        console.log('[Comments] Loading data... forceRefresh:', forceRefresh);
                        const result = await callGAS('getCommentNavData', App.state.userId, forceRefresh);

                        const comments = result?.comments || [];
                        this.cachedComments = comments;
                        this.isLoaded = true;
                        this.lastUpdatedAt = new Date();

                        // 描画
                        this.render(comments);

                        // キャッシュデータだった場合、バックグラウンドで最新データを取得して再描画
                        if (!forceRefresh && result?.isCached === true) {
                            console.log('[Comments] Cache detected. Fetching fresh data in background...');
                            setTimeout(() => this.loadData(true), 100);
                        }
                    } catch (error) {
                        console.error('[Comments] Error loading data:', error);
                        const container = document.getElementById('comments-list');
                        if (container && !this.cachedComments) {
                            container.innerHTML = '<div class="padding center-align error-text"><i>error_outline</i><span>コメントの読み込みに失敗しました</span></div>';
                        }
                    } finally {
                        this.isLoading = false;
                    }
                },

                /**
                 * 未読チェックとボタンバッジの更新
                 * @param {Array} comments - コメントデータ
                 */
                checkAndUpdateBadge: function (comments, statusOverride = null) {
                    // 現在の既読状態を取得
                    const oldStatus = statusOverride || App.state.getUserProperty('comment_read_status', {});
                    // 1. 保存前に一旦プロパティ内を空にする（新しいオブジェクトとして作成）
                    const newStatus = {};

                    // 2. 描画しているコメントを改めて取得して、格納する
                    // 引数のcomments、またはキャッシュされているコメントを使用
                    const targetComments = comments || this.cachedComments || [];
                    targetComments.forEach(comment => {
                        // 以前の状態があれば引き継ぎ、なければ未読(false)
                        newStatus[comment.id] = (comment.id in oldStatus) ? oldStatus[comment.id] : false;
                    });

                    // 3. 格納（保存）
                    App.state.saveUserProperty('comment_read_status', newStatus);

                    // 未読数（badge用）の計算
                    const totalUnreadCount = Object.values(newStatus).filter(v => v === false).length;

                    const badge = document.getElementById('comments-badge');
                    if (badge) {
                        badge.textContent = totalUnreadCount;
                        badge.style.display = totalUnreadCount > 0 ? '' : 'none';
                    }
                },

                /**
                 * コメント一覧を描画
                 * @param {Array} comments - コメントデータ
                 */
                render: function (comments) {
                    const container = document.getElementById('comments-list');
                    if (!container) return;

                    // バッジ更新とデータのクリーンアップを先に実行
                    this.checkAndUpdateBadge(comments);

                    if (!comments || comments.length === 0) {
                        container.innerHTML = '<div class="padding center-align secondary-text"><i>info</i><span>コメントはありません</span></div>';
                        return;
                    }

                    const savedData = App.state.getUserProperty('comment_read_status', {});
                    let html = '<div class="padding center-align secondary-text small-text"><span>あなたが担当者 かつ ステータスが「完了」以外のタスクに作成されたコメント（新着順）</span></div>';
                    html += comments.map(comment => {
                        const isRead = savedData[comment.id] === true;
                        const readClass = isRead ? 'background' : 'error-container';
                        const readIcon = isRead ? 'mark_email_read' : 'mark_email_unread';

                        // プロフィール写真
                        const avatarHtml = comment.profile_photo_url
                            ? `<img class="responsive" src="${comment.profile_photo_url}" alt="${escapeHtml(comment.display_name)}">`
                            : `account_circle`;

                        // 更新日時のフォーマット
                        const updatedAt = comment.updated_at
                            ? formatDateTimeForDisplay(comment.updated_at, 'MM/dd HH:mm')
                            : '';

                        // コメント内容（HTMLタグを除去して表示）
                        const plainContent = comment.content ? comment.content.substring(0, 80) : '';

                        return `
                            <article class="no-elevate padding top-align row small-margin small-round ${readClass}" style="cursor: pointer;"
                               onclick="App.utils.header.comments.openComment('${comment.id}', '${comment.task_id}', '${comment.task_board_id}')">
                                <div><i class="circle extra">${avatarHtml}</i></div>
                                <div class="max">
                                    <div class="row">
                                        <span class="bold small-text">${escapeHtml(comment.display_name)}</span>
                                        <span class="small-text secondary-text font-number">${updatedAt}</span>
                                    </div>
                                    <div class="small-text secondary-text">${escapeHtml(comment.task_name)} <span class="font-number secondary-text">#${comment.task_display_id}</span></div>
                                    <div class="tiny-space"></div>
                                    <div class="small-text">${escapeHtml(plainContent)}</div>
                                </div>
                                <div>
                                    <button class="transparent circle small no-margin"
                                        onclick="event.stopPropagation(); App.utils.header.comments.toggleReadStatus('${comment.id}')"
                                        title="${isRead ? '未読にする' : '既読にする'}">
                                    <i class="small">${readIcon}</i>
                                    </button>
                                </div>
                            </article>
                        `;
                    }).join('');

                    // 最終更新日時の追加
                    if (this.lastUpdatedAt) {
                        const timeStr = formatDateTimeForDisplay(this.lastUpdatedAt, 'yyyy/MM/dd(E) HH:mm');
                        html += `<div class="row padding no-margin center-align secondary-text small-text tiny-space"><i class="small">update</i><span>最終更新: ${timeStr}</span></div>`;
                    }

                    container.innerHTML = html;
                },

                /**
                 * コメントをクリックしてタスクを開く
                 * @param {string} commentId - コメントID
                 * @param {string} taskId - タスクID
                 * @param {string} boardId - ボードID
                 */
                openComment: function (commentId, taskId, boardId) {
                    ui('#comments-menu');

                    // 既読にマーク
                    this.markAsRead(commentId);

                    // タスクを開く（home.htmlのopenTaskFromHomeを再利用）
                    if (App.pages.home && App.pages.home.openTaskFromHome) {
                        App.pages.home.openTaskFromHome(taskId, boardId);
                    }
                },

                /**
                 * コメントの既読/未読状態をトグル
                 * @param {string} commentId - コメントID
                 */
                toggleReadStatus: function (commentId) {
                    const savedData = App.state.getUserProperty('comment_read_status', {});
                    savedData[commentId] = !savedData[commentId]; // true ↔ false をトグル

                    // 更新後の状態を渡してクリーンアップと保存を実行
                    this.checkAndUpdateBadge(this.cachedComments, savedData);

                    // 描画を更新
                    if (this.cachedComments) {
                        this.render(this.cachedComments);
                    }
                },

                /**
                 * コメントを既読にマーク（openComment用）
                 * @param {string} commentId - コメントID
                 */
                markAsRead: function (commentId) {
                    const savedData = App.state.getUserProperty('comment_read_status', {});
                    savedData[commentId] = true;

                    // 更新後の状態を渡してクリーンアップと保存を実行
                    this.checkAndUpdateBadge(this.cachedComments, savedData);
                }
            }
        };
    })();

    (function () {
        // 検索機能用の名前空間を初期化
        if (!App.utils) App.utils = {};

        App.utils.search = {
            showIdSearchLoading: function () {
                const container = document.getElementById('id-search-container');
                if (container) {
                    container.classList.add('id-search-loading');
                }
            },

            hideIdSearchLoading: function () {
                const container = document.getElementById('id-search-container');
                if (container) {
                    container.classList.remove('id-search-loading');
                }
            },

            clearIdSearchInput: function () {
                const input = document.getElementById('id-search-input');
                if (!input) return;

                input.value = '';
                input.placeholder = 'ID検索';
            },

            // ID検索の共通処理
            executeIdSearch: function (searchValue) {
                if (!searchValue) return;

                // 1. "P0001-W0001" 形式の対応 (最後のIDをターゲットにする)
                const parts = searchValue.split('-');
                const targetCode = parts[parts.length - 1];

                // 検索実行
                App.utils.search.showIdSearchLoading();
                callGAS('searchByCode', targetCode)
                    .then(result => {
                        App.utils.search.hideIdSearchLoading();

                        // 検索ボックスからフォーカスを外す
                        const input = document.getElementById('id-search-input');
                        if (input) {
                            input.blur();
                            input.value = searchValue; // 入力値はそのまま保持
                        }

                        if (!result) {
                            alert('該当するデータが見つかりません');
                            return;
                        }

                        const { item, tableName } = result;

                        // テーブル名に応じた処理
                        if (tableName === TABLE_NAMES.TASKS) {
                            App.pages.taskDetail.openDetailModal(item.id);
                        } else if (tableName === TABLE_NAMES.CREATIVES) {
                            App.overlays.creativeDetail.openDetailModal(item.id);
                        } else if (tableName === TABLE_NAMES.PLANS) {
                            App.pages.planDetail.openDetailModal(item.id);
                        } else if (tableName === TABLE_NAMES.KNOWLEDGES) {
                            App.pages.knowledgeDetail.openDetailModal(item.id);
                        } else {
                            console.log('Unknown table for search result:', tableName);
                            alert('このIDタイプの詳細は表示できません: ' + tableName);
                        }
                    })
                    .catch(error => {
                        App.utils.search.hideIdSearchLoading();
                        App.utils.error.handle(error);
                    });
            },

            handleIdSearchClick: function () {
                const input = document.getElementById('id-search-input');
                if (!input) return;

                const searchValue = input.value.trim();
                App.utils.search.executeIdSearch(searchValue);
            },

            handleIdSearchFocus: function (event) {
                const input = event.target;
                console.log('[DEBUG] handleIdSearchFocus triggered');
            },

            handleIdSearchBlur: function (event) {
                const input = event.target;
                console.log('[DEBUG] handleIdSearchBlur triggered', {
                    value: input.value,
                    activeElement: document.activeElement,
                    isInputFocused: document.activeElement === input
                });
            },

            handleIdSearchInput: function (event) {
                const input = event.target;
                let value = input.value;

                // 全角英数字を半角に変換
                value = value.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function (s) {
                    return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
                });

                // 小文字を大文字に変換
                value = value.toUpperCase();

                // 許可された文字以外を削除 (ハイフンは許可)
                value = value.replace(/[^A-Z0-9-]/g, '');

                if (input.value !== value) {
                    input.value = value;
                }
            },

            handleIdSearchKeydown: function (event) {
                if (event.key === 'Enter' && !event.isComposing) {
                    event.preventDefault();
                    const input = event.target;
                    const searchValue = input.value.trim();
                    App.utils.search.executeIdSearch(searchValue);
                }
            },

            /**
             * 検索入力時のハンドラー（リアルタイム候補表示）
             * 現在は無効化（マイボード検索のみ使用）
             */
            handleSearchInput: function (event) {
                // 何もしない（旧システムの検索結果表示を無効化）
            },

            /**
             * キーダウンハンドラー（Enter検索）
             */
            handleSearchKeydown: function (event) {
                if (event.key === 'Enter' && !event.isComposing) {
                    event.preventDefault();
                    App.utils.search.handleSearchClick();
                }
            },

            /**
             * フォーカスハンドラー
             * 現在は無効化（マイボード検索のみ使用）
             */
            handleSearchFocus: function (event) {
                // 何もしない（旧システムの検索結果表示を無効化）
            },

            /**
             * ブラーハンドラー（少し遅延してメニューを閉じる）
             */
            handleSearchBlur: function (event) {
                setTimeout(() => {
                    const resultsMenu = document.getElementById('search-results-menu');
                    if (resultsMenu) {
                        resultsMenu.style.display = 'none';
                    }
                }, 200);
            },

            /**
             * 検索ボタンクリック / Enterキー押下時の検索実行
             */
            handleSearchClick: async function () {
                const input = document.getElementById('search-input');
                const searchValue = input.value.trim();
                input.blur();

                if (!searchValue) return;

                // 1. マイボードタブに移動（既に移動している場合は無視）
                if (App.utils.navigation && App.utils.navigation.switchTab) {
                    await App.utils.navigation.switchTab('board-my-board', false, false, true);
                }

                // 2. 検索バーに入力されたタイトルを「含む」タスクとしてフィルタ
                if (App.pages.boards) {
                    App.pages.boards.initializeMyBoardFilters(false);
                    App.pages.boards.myBoardFilters.title = searchValue;
                    App.pages.boards.myBoardFilters.titleMatchMode = 'contains';

                    // 3. 検索（データ再読み込み）
                    await App.pages.boards.loadData('my-board', false);
                }
            },

            /**
             * ID検索の実行
             */
            performIdSearch: function (searchValue) {
                const parts = searchValue.split('-');
                const targetCode = parts[parts.length - 1];

                showLoading();
                callGAS('searchByCode', targetCode)
                    .then(result => {
                        hideLoading();

                        if (!result) {
                            alert('該当するデータが見つかりません');
                            return;
                        }

                        const { item, tableName } = result;
                        App.utils.search.openDetailModal({ item, tableName, id: item.id });
                    })
                    .catch(error => {
                        hideLoading();
                        App.utils.error.handle(error);
                    });
            },

            /**
             * テキスト検索の実行（フロントエンドデータから検索）
             */
            performTextSearch: function (searchValue, searchTarget) {
                const results = [];
                const searchLower = searchValue.toLowerCase();

                // 検索対象のテーブルとフィールドを定義
                const searchConfigs = [
                    { data: App.state.data.creatives, tableName: TABLE_NAMES.CREATIVES, fields: ['title', 'display_id'] },
                    { data: App.state.data.plans, tableName: TABLE_NAMES.PLANS, fields: ['title', 'display_id'] },
                    { data: App.state.data.tasks, tableName: TABLE_NAMES.TASKS, fields: ['title', 'display_id'] },
                    { data: App.state.data.members, tableName: TABLE_NAMES.MEMBERS, fields: ['display_name', 'email'] }
                ];

                searchConfigs.forEach(config => {
                    if (!config.data) return;

                    config.data.forEach(item => {
                        let matches = false;

                        if (searchTarget === 'all') {
                            // すべてのフィールドを検索
                            matches = config.fields.some(field => {
                                const value = item[field];
                                return value && value.toString().toLowerCase().includes(searchLower);
                            });
                        } else if (searchTarget === 'title') {
                            // タイトルのみ検索
                            const titleField = config.fields.find(f => f.includes('title') || f.includes('display_name'));
                            if (titleField) {
                                const value = item[titleField];
                                matches = value && value.toString().toLowerCase().includes(searchLower);
                            }
                        }

                        if (matches) {
                            results.push({
                                item: item,
                                tableName: config.tableName,
                                id: item.id,
                                displayText: `[${config.tableName}] ${item.display_id || item.id}: ${item.title || item.display_name || item.email || ''}`
                            });
                        }
                    });
                });

                return results.slice(0, 20); // 最大20件
            },

            /**
             * 検索結果をドロップダウンに表示
             */
            displaySearchResults: function (results) {
                const resultsMenu = document.getElementById('search-results-menu');
                if (!resultsMenu) return;

                // 既存の結果（入力項目以外）を削除
                // 最初のliは入力フィールドなので残す
                const listItems = resultsMenu.querySelectorAll('li');
                for (let i = 1; i < listItems.length; i++) {
                    resultsMenu.removeChild(listItems[i]);
                }

                if (results.length === 0) {
                    resultsMenu.classList.add('active');
                    return;
                }

                // 新しい結果を追加
                const newResultsHtml = results.map(result => {
                    return `
                                <li><i>open_in_new</i><a style="cursor: pointer;" onclick='App.utils.search.openDetailModalFromSearch(${JSON.stringify(result).replace(/'/g, "\\'")}); event.stopPropagation();'>
                                    <span class="small-text">${escapeHtml(result.displayText)}</span>
                                </a></li>
                    `;
                }).join('');

                resultsMenu.insertAdjacentHTML('beforeend', newResultsHtml);

                resultsMenu.style.display = 'block';
            },

            /**
             * 検索結果から詳細モーダルを開く（グローバル関数）
             */
            openDetailModalFromSearch: function (result) {
                App.utils.search.openDetailModal(result);
                const resultsMenu = document.getElementById('search-results-menu');
                if (resultsMenu) resultsMenu.style.display = 'none';
                const input = document.getElementById('search-input');
                if (input) input.value = '';
            },

            /**
             * テーブル名に応じた詳細モーダルを開く
             */
            openDetailModal: function (result) {
                const { tableName, id } = result;

                if (tableName === TABLE_NAMES.CREATIVES && App.overlays.creativeDetail) {
                    App.overlays.creativeDetail.open(id);
                } else if (tableName === TABLE_NAMES.PLANS && App.overlays.planDetail) {
                    App.overlays.planDetail.open(id);
                } else if (tableName === TABLE_NAMES.TASKS && App.overlays.taskDetail) {
                    App.overlays.taskDetail.open(id);
                } else if (tableName === TABLE_NAMES.MEMBERS && App.overlays.memberDetail) {
                    App.overlays.memberDetail.open(id);
                } else {
                    console.log('Unknown table for search result:', tableName);
                    alert('このテーブルの詳細は表示できません: ' + tableName);
                }
            }
        };
    })();
</script>
