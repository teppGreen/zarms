<style>
    :root,
    body.light {
        --primary: #2d3eff;
        --on-primary: #ffffff;
        --primary-container: #e0e0ff;
        --on-primary-container: #000668;
        --secondary: #5c5d72;
        --on-secondary: #ffffff;
        --secondary-container: #e1e0f9;
        --on-secondary-container: #191a2c;
        --tertiary: #78536b;
        --on-tertiary: #ffffff;
        --tertiary-container: #ffd7ef;
        --on-tertiary-container: #2e1126;
        --error: #ba1a1a;
        --on-error: #ffffff;
        --error-container: #ffdad6;
        --on-error-container: #410002;
        --background: #fffbff;
        --on-background: #1b1b1f;
        --surface: #fcf8fd;
        --on-surface: #1b1b1f;
        --surface-variant: #e3e1ec;
        --on-surface-variant: #46464f;
        --outline: #777680;
        --outline-variant: #c7c5d0;
        --shadow: #000000;
        --scrim: #000000;
        --inverse-surface: #303034;
        --inverse-on-surface: #f3f0f4;
        --inverse-primary: #bdc2ff;
        --surface-dim: #dcd9de;
        --surface-bright: #fcf8fd;
        --surface-container-lowest: #ffffff;
        --surface-container-low: #f6f2f7;
        --surface-container: #f0edf1;
        --surface-container-high: #eae7ec;
        --surface-container-highest: #e4e1e6;
    }

    body.dark {
        --primary: #bdc2ff;
        --on-primary: #000fa3;
        --primary-container: #0019e3;
        --on-primary-container: #e0e0ff;
        --secondary: #c4c4dd;
        --on-secondary: #2d2f42;
        --secondary-container: #444559;
        --on-secondary-container: #e1e0f9;
        --tertiary: #e7b9d5;
        --on-tertiary: #45263c;
        --tertiary-container: #5e3c53;
        --on-tertiary-container: #ffd7ef;
        --error: #ffb4ab;
        --on-error: #690005;
        --error-container: #93000a;
        --on-error-container: #ffb4ab;
        --background: #1b1b1f;
        --on-background: #e4e1e6;
        --surface: #131316;
        --on-surface: #e4e1e6;
        --surface-variant: #46464f;
        --on-surface-variant: #c7c5d0;
        --outline: #91909a;
        --outline-variant: #46464f;
        --shadow: #000000;
        --scrim: #000000;
        --inverse-surface: #e4e1e6;
        --inverse-on-surface: #303034;
        --inverse-primary: #2d3eff;
        --surface-dim: #131316;
        --surface-bright: #39393c;
        --surface-container-lowest: #0e0e11;
        --surface-container-low: #1b1b1f;
        --surface-container: #1f1f23;
        --surface-container-high: #2a2a2d;
        --surface-container-highest: #353438;
    }

    :root {
        --font: "Noto Sans JP";
        --font-title: "Google Sans", sans-serif;
        --font-number: "Roboto Mono", monospace;
    }

    .font-title {
        font-family: var(--font-title);
    }

    .font-number {
        font-family: var(--font-number);
    }

    /* Loading Shimmer */
    .shimmer-loading {
        background: linear-gradient(90deg,
                var(--surface-variant) 25%,
                var(--surface) 50%,
                var(--surface-variant) 75%);
        background-size: 200% 100%;
        animation: shimmerMove 1.5s infinite linear;
    }

    @keyframes shimmer {
        from {
            transform: translateX(-200%);
        }

        to {
            transform: translateX(200%);
        }
    }

    @keyframes shimmerMove {
        0% {
            background-position: 200% 0;
        }

        100% {
            background-position: -200% 0;
        }
    }

    /* ============================================
     * Google Picker Protection
     * BeerCSSの影響を受けないようにする
     * ============================================ */
    
    /* Google Pickerのコンテナを保護 */
    .picker-dialog,
    .picker-dialog-bg,
    div[role="dialog"][aria-label*="picker"],
    iframe[name^="picker"] {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 10001 !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        transform: none !important;
        overflow: visible !important;
    }

    /* Pickerの背景オーバーレイ */
    .picker-dialog-bg {
        background-color:  rgba(0, 0, 0, 0.5) !important;
        z-index: 10000 ! important;
    }

    /* Pickerのメインダイアログ */
    .picker-dialog {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        z-index: 10001 !important;
    }

    /* BeerCSSのbodyスタイルをリセット（Picker表示時のみ） */
    body:has(.picker-dialog) {
        overflow: hidden !important;
    }

    /* Pickerのiframeを正しく配置 */
    body > div[aria-hidden="true"] + div:not([class]) {
        position: fixed !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        z-index: 10010 !important;
        max-width: 90vw !important;
        max-height: 90vh !important;
    }
</style>

<script>
    (function () {
        function applyTheme() {
            if (!document.body) return; // bodyがまだ存在しない場合はスキップ
            var theme = 'light'; // Default
            // 端末の設定状況を取得できるか確認し、ダークモードが有効かチェック
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                theme = 'dark';
            }
            document.body.classList.remove('light', 'dark');
            document.body.classList.add(theme);
        }

        // 初回適用
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyTheme);
        } else {
            applyTheme();
        }

        // 設定変更を監視
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
        }
    })();
</script>
