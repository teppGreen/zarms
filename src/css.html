<style>
    :root,
    body.light {

        --on-primary:#ffffff;
        --primary-container:#d3e3ff;
        --on-primary-container:#001c39;
        --secondary:#545f71;
        --on-secondary:#ffffff;
        --secondary-container:#d8e3f8;
        --on-secondary-container:#111c2b;
        --tertiary:#6d5677;
        --on-tertiary:#ffffff;
        --tertiary-container:#f6d9ff;
        --on-tertiary-container:#261430;
        --error:#ba1a1a;
        --on-error:#ffffff;
        --error-container:#ffdad6;
        --on-error-container:#410002;
        --background:#fdfcff;
        --on-background:#1a1c1e;
        --surface:#faf9fd;
        --on-surface:#1a1c1e;
        --surface-variant:#dfe2eb;
        --on-surface-variant:#43474e;
        --outline:#73777f;
        --outline-variant:#c3c6cf;
        --shadow:#000000;
        --scrim:#000000;
        --inverse-surface:#2f3033;
        --inverse-on-surface:#f1f0f4;
        --inverse-primary:#a3c9ff;
        --surface-dim:#dad9dd;
        --surface-bright:#faf9fd;
        --surface-container-lowest:#ffffff;
        --surface-container-low:#f4f3f7;
        --surface-container:#eeedf1;
        --surface-container-high:#e8e8eb;
        --surface-container-highest:#e3e2e6;
    }

    body.dark {
        --primary:#a3c9ff;
        --on-primary:#00315d;
        --primary-container:#004883;
        --on-primary-container:#d3e3ff;
        --secondary:#bcc7db;
        --on-secondary:#263141;
        --secondary-container:#3c4758;
        --on-secondary-container:#d8e3f8;
        --tertiary:#d9bde3;
        --on-tertiary:#3d2946;
        --tertiary-container:#543f5e;
        --on-tertiary-container:#f6d9ff;
        --error:#ffb4ab;
        --on-error:#690005;
        --error-container:#93000a;
        --on-error-container:#ffb4ab;
        --background:#1a1c1e;
        --on-background:#e3e2e6;
        --surface:#121316;
        --on-surface:#e3e2e6;
        --surface-variant:#43474e;
        --on-surface-variant:#c3c6cf;
        --outline:#8d9199;
        --outline-variant:#43474e;
        --shadow:#000000;
        --scrim:#000000;
        --inverse-surface:#e3e2e6;
        --inverse-on-surface:#2f3033;
        --inverse-primary:#0060ab;
        --surface-dim:#121316;
        --surface-bright:#38393c;
        --surface-container-lowest:#0d0e11;

        --surface-container:#1e2022;
        --surface-container-high:#292a2d;
        --surface-container-highest:#333538;
    }

    :root {
        --font: "Noto Sans JP";
    }
</style>

<script>
    (function () {
        function applyTheme() {
            if (!document.body) return; // bodyがまだ存在しない場合はスキップ
            var theme = 'light'; // Default
            // 端末の設定状況を取得できるか確認し、ダークモードが有効かチェック
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                theme = 'dark';
            }
            document.body.classList.remove('light', 'dark');
            document.body.classList.add(theme);
        }

        // 初回適用
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyTheme);
        } else {
            applyTheme();
        }

        // 設定変更を監視
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
        }
    })();
</script>
