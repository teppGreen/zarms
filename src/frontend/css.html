<style>
    /* Shimmer Loading Effect */
    .shimmer-loading {
        background: linear-gradient(90deg,
                #ffffff,
                #eeeeee,
                #dddddd);
        background-size: 200% 100%;
        animation: shimmerMove 1.5s infinite linear;
    }

    @keyframes shimmerMove {
        0% {
            background-position: 200% 0;
        }

        100% {
            background-position: -200% 0;
        }
    }

    @keyframes shimmer {
        from {
            transform: translateX(-200%);
        }

        to {
            transform: translateX(200%);
        }
    }
</style>
