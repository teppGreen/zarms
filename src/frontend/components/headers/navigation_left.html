<script>
    (function () {
        // ナビゲーション用の名前空間を初期化
        if (!App.utils) App.utils = {};
        if (!App.utils.navigation) App.utils.navigation = {};

        /**
         * タブを切り替える
         */
        App.utils.navigation.switchTab = function (tabName) {
            // 他のタブに切り替える前にhomeタブの処理を停止
            const currentTab = document.querySelector('.tab-content:not([style*="display: none"])');
            if (currentTab && currentTab.id === 'tab-home') {
                // stopRemainingTimeUpdatesが存在する場合のみ呼び出し
                if (typeof stopRemainingTimeUpdates === 'function') {
                    stopRemainingTimeUpdates();
                }
            }
            const sidebarLinks = document.querySelectorAll('nav.left a');
            if (sidebarLinks.length > 0) {
                sidebarLinks.forEach(item => item.classList.remove('active'));
                const activeLink = document.getElementById(tabName + '-nav');
                if (activeLink) activeLink.classList.add('active');
            } else {
                // Fallback for old structure if needed or during transition
                document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
                const oldLink = document.querySelector(`.nav-item[onclick="switchTab('${tabName}')"]`);
                if (oldLink) oldLink.classList.add('active');
            }
            document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
            document.getElementById('tab-' + tabName).style.display = 'block';
            App.utils.navigation.loadTabData(tabName);
        };

        /**
         * タブデータを読み込む
         */
        App.utils.navigation.loadTabData = function (tabName) {
            console.log(`loadTabData called for: ${tabName}`);
            console.log('App.pages state:', App.pages);
            if (App.pages && App.pages[tabName]) {
                console.log(`App.pages.${tabName} state:`, App.pages[tabName]);
            } else {
                console.warn(`App.pages.${tabName} is undefined`);
            }

            showLoading();
            let loader = null;

            if (App.pages[tabName] && App.pages[tabName].loadData) {
                loader = App.pages[tabName].loadData;
            }

            if (loader) {
                loader();
            } else {
                console.warn(`No loader found for tab: ${tabName}`);
                hideLoading();
            }
        };

    })();
</script>
