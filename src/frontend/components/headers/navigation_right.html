<script>
    (function () {
        // ナビゲーション用の名前空間を初期化
        if (!App.utils) App.utils = {};
        if (!App.utils.navigation) App.utils.navigation = {};

        // 現在開いている右navページを追跡
        let currentRightNavPage = null;

        /**
         * 右navからページをオーバーレイ表示する（BeerCSS Dialog使用）
         */
        App.utils.navigation.openRightNavPage = function (pageName) {
            // 既に同じページが開いている場合は何もしない
            if (currentRightNavPage === pageName) {
                return;
            }

            // 既に別のページが開いている場合は先に閉じる
            if (currentRightNavPage) {
                App.utils.navigation.closeRightNavOverlay();
            }

            // dialog要素を取得
            const dialogElement = document.getElementById('overlay-tab-' + pageName);
            if (!dialogElement) {
                console.error('Dialog not found:', pageName);
                return;
            }

            // overlay要素を取得
            const overlay = document.getElementById('overlay');
            if (!overlay) {
                console.error('Overlay element not found');
                return;
            }

            // overlayにactiveクラスを追加
            overlay.classList.add('active');

            // dialogにactiveクラスを追加
            dialogElement.classList.add('active');

            // データを読み込み
            if (App.utils.navigation.loadTabData) {
                App.utils.navigation.loadTabData(pageName);
            }

            // 右navのアクティブ状態を更新
            document.querySelectorAll('nav.right button[id$="-nav-right"]').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeButton = document.getElementById(pageName + '-nav-right');
            if (activeButton) {
                activeButton.classList.add('active');
            }

            // overlayをクリックした際に閉じる処理
            overlay.onclick = function () {
                App.utils.navigation.closeRightNavOverlay();
            };

            // 現在のページを記録
            currentRightNavPage = pageName;
        };

        /**
         * 右navオーバーレイを閉じる（BeerCSS Dialog使用）
         */
        App.utils.navigation.closeRightNavOverlay = function () {
            if (!currentRightNavPage) {
                return;
            }

            // dialog要素を取得
            const dialogElement = document.getElementById('overlay-tab-' + currentRightNavPage);
            if (dialogElement) {
                // dialogからactiveクラスを削除
                dialogElement.classList.remove('active');
            }

            // overlay要素を取得して閉じる
            const overlay = document.getElementById('overlay');
            if (overlay) {
                overlay.classList.remove('active');
                overlay.onclick = null;
            }

            // 右navのアクティブ状態を解除
            document.querySelectorAll('nav.right button[id$="-nav-right"]').forEach(btn => {
                btn.classList.remove('active');
            });

            currentRightNavPage = null;
        };
    })();
</script>
