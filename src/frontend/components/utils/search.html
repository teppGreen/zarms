<script>
    (function () {
        // 検索機能用の名前空間を初期化
        if (!window.App.utils) window.App.utils = {};
        if (!window.App.utils.search) window.App.utils.search = {};

        // ============================================
        // ID検索バー
        // ============================================

        window.App.utils.search.showIdSearchLoading = function () {
            const container = document.getElementById('id-search-container');
            if (container) {
                container.classList.add('id-search-loading');
            }
        };

        window.App.utils.search.hideIdSearchLoading = function () {
            const container = document.getElementById('id-search-container');
            if (container) {
                container.classList.remove('id-search-loading');
            }
        };

        window.App.utils.search.clearIdSearchInput = function () {
            const input = document.getElementById('id-search-input');
            if (!input) return;

            input.value = '';
            input.placeholder = 'ID検索';
        };

        // ID検索の共通処理
        window.App.utils.search.executeIdSearch = function (searchValue) {
            if (!searchValue) return;

            // 1. "P0001-W0001" 形式の対応 (最後のIDをターゲットにする)
            const parts = searchValue.split('-');
            const targetCode = parts[parts.length - 1];

            if (typeof handleHeaderCloseClick === 'function') {
                handleHeaderCloseClick();
            }

            // 検索実行
            window.App.utils.search.showIdSearchLoading();
            callGAS('searchByCode', targetCode)
                .then(result => {
                    window.App.utils.search.hideIdSearchLoading();

                    // 検索ボックスからフォーカスを外す
                    const input = document.getElementById('id-search-input');
                    if (input) {
                        input.blur();
                        input.value = searchValue; // 入力値はそのまま保持
                    }

                    if (!result) {
                        alert('該当するデータが見つかりません');
                        return;
                    }

                    const { item, tableName } = result;

                    // テーブル名に応じた処理
                    if (tableName === SHEET_NAMES.TASKS) {
                        App.pages.taskDetail.openDetailModal(item.id);
                    } else if (tableName === SHEET_NAMES.CREATIVES) {
                        App.pages.creativeDetail.openDetailModal(item.id);
                    } else if (tableName === SHEET_NAMES.PLANS) {
                        App.pages.planDetail.openDetailModal(item.id);
                    } else if (tableName === SHEET_NAMES.KNOWLEDGES) {
                        App.pages.knowledgeDetail.openDetailModal(item.id);
                    } else {
                        console.log('Unknown table for search result:', tableName);
                        alert('このIDタイプの詳細は表示できません: ' + tableName);
                    }
                })
                .catch(error => {
                    window.App.utils.search.hideIdSearchLoading();
                    handleError(error);
                });
        };

        window.App.utils.search.handleIdSearchClick = function () {
            const input = document.getElementById('id-search-input');
            if (!input) return;

            const searchValue = input.value.trim();
            window.App.utils.search.executeIdSearch(searchValue);
        };

        window.App.utils.search.handleIdSearchFocus = function (event) {
            const input = event.target;
            console.log('[DEBUG] handleIdSearchFocus triggered');
        };

        window.App.utils.search.handleIdSearchBlur = function (event) {
            const input = event.target;
            console.log('[DEBUG] handleIdSearchBlur triggered', {
                value: input.value,
                activeElement: document.activeElement,
                isInputFocused: document.activeElement === input
            });
        };

        window.App.utils.search.handleIdSearchInput = function (event) {
            const input = event.target;
            let value = input.value;

            // 全角英数字を半角に変換
            value = value.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function (s) {
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
            });

            // 小文字を大文字に変換
            value = value.toUpperCase();

            // 許可された文字以外を削除 (ハイフンは許可)
            value = value.replace(/[^A-Z0-9-]/g, '');

            if (input.value !== value) {
                input.value = value;
            }
        };

        window.App.utils.search.handleIdSearchKeydown = function (event) {
            if (event.key === 'Enter' && !event.isComposing) {
                event.preventDefault();
                const input = event.target;
                const searchValue = input.value.trim();
                window.App.utils.search.executeIdSearch(searchValue);
            }
        };

        // ============================================
        // 強化された検索機能
        // ============================================

        /**
         * 検索入力時のハンドラー（リアルタイム候補表示）
         */
        window.App.utils.search.handleSearchInput = function (event) {
            const input = event.target;
            const searchValue = input.value.trim();
            const searchTarget = document.getElementById('search-target').value;
            const resultsMenu = document.getElementById('search-results-menu');

            if (!searchValue) {
                resultsMenu.style.display = 'none';
                return;
            }

            // ID検索の場合
            if (searchTarget === 'id') {
                // リアルタイム検索はせず、Enterキー押下時に実行
                resultsMenu.style.display = 'none';
                return;
            }

            // テキスト検索の場合
            const results = window.App.utils.search.performTextSearch(searchValue, searchTarget);
            window.App.utils.search.displaySearchResults(results);
        };

        /**
         * キーダウンハンドラー（Enter検索）
         */
        window.App.utils.search.handleSearchKeydown = function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                window.App.utils.search.handleSearchClick();
            }
        };

        /**
         * フォーカスハンドラー
         */
        window.App.utils.search.handleSearchFocus = function (event) {
            // 既に入力値がある場合は候補を再表示
            const input = event.target;
            if (input.value.trim()) {
                window.App.utils.search.handleSearchInput(event);
            }
        };

        /**
         * ブラーハンドラー（少し遅延してメニューを閉じる）
         */
        window.App.utils.search.handleSearchBlur = function (event) {
            setTimeout(() => {
                const resultsMenu = document.getElementById('search-results-menu');
                if (resultsMenu) {
                    resultsMenu.style.display = 'none';
                }
            }, 200);
        };

        /**
         * 検索ボタンクリック / Enterキー押下時の検索実行
         */
        window.App.utils.search.handleSearchClick = function () {
            const input = document.getElementById('search-input');
            const searchValue = input.value.trim();
            const searchTarget = document.getElementById('search-target').value;

            if (!searchValue) return;

            const resultsMenu = document.getElementById('search-results-menu');
            resultsMenu.style.display = 'none';

            // ID検索の場合
            if (searchTarget === 'id') {
                window.App.utils.search.performIdSearch(searchValue);
            } else {
                // テキスト検索の場合は候補を表示
                const results = window.App.utils.search.performTextSearch(searchValue, searchTarget);
                if (results.length === 1) {
                    // 結果が1件のみの場合は直接開く
                    window.App.utils.search.openDetailModal(results[0]);
                } else if (results.length > 0) {
                    // 複数の場合はドロップダウン表示
                    window.App.utils.search.displaySearchResults(results);
                } else {
                    alert('該当するデータが見つかりません');
                }
            }
        };

        /**
         * ID検索の実行
         */
        window.App.utils.search.performIdSearch = function (searchValue) {
            const parts = searchValue.split('-');
            const targetCode = parts[parts.length - 1];

            showLoading();
            callGAS('searchByCode', targetCode)
                .then(result => {
                    hideLoading();

                    if (!result) {
                        alert('該当するデータが見つかりません');
                        return;
                    }

                    const { item, tableName } = result;
                    window.App.utils.search.openDetailModal({ item, tableName, id: item.id });
                })
                .catch(error => {
                    hideLoading();
                    handleError(error);
                });
        };

        /**
         * テキスト検索の実行（フロントエンドデータから検索）
         */
        window.App.utils.search.performTextSearch = function (searchValue, searchTarget) {
            const results = [];
            const searchLower = searchValue.toLowerCase();

            // 検索対象のテーブルとフィールドを定義
            const searchConfigs = [
                { data: creativesData, tableName: SHEET_NAMES.CREATIVES, fields: ['title', 'display_id'] },
                { data: plansData, tableName: SHEET_NAMES.PLANS, fields: ['title', 'display_id'] },
                { data: tasksData, tableName: SHEET_NAMES.TASKS, fields: ['title', 'display_id'] },
                { data: membersData, tableName: SHEET_NAMES.MEMBERS, fields: ['nickname', 'email'] }
            ];

            searchConfigs.forEach(config => {
                if (!config.data) return;

                config.data.forEach(item => {
                    let matches = false;

                    if (searchTarget === 'all') {
                        // すべてのフィールドを検索
                        matches = config.fields.some(field => {
                            const value = item[field];
                            return value && value.toString().toLowerCase().includes(searchLower);
                        });
                    } else if (searchTarget === 'title') {
                        // タイトルのみ検索
                        const titleField = config.fields.find(f => f.includes('title') || f.includes('nickname'));
                        if (titleField) {
                            const value = item[titleField];
                            matches = value && value.toString().toLowerCase().includes(searchLower);
                        }
                    }

                    if (matches) {
                        results.push({
                            item: item,
                            tableName: config.tableName,
                            id: item.id,
                            displayText: `[${config.tableName}] ${item.display_id || item.id}: ${item.title || item.nickname || item.email || ''}`
                        });
                    }
                });
            });

            return results.slice(0, 20); // 最大20件
        };

        /**
         * 検索結果をドロップダウンに表示
         */
        window.App.utils.search.displaySearchResults = function (results) {
            const resultsMenu = document.getElementById('search-results-menu');
            if (!resultsMenu) return;

            if (results.length === 0) {
                resultsMenu.style.display = 'none';
                return;
            }

            resultsMenu.innerHTML = results.map(result => {
                return `
          <a class="row" style="padding: 8px 16px; cursor: pointer;" onclick='window.App.utils.search.openDetailModalFromSearch(${JSON.stringify(result).replace(/'/g, "\\'")}); event.stopPropagation();'>
            <span class="small-text">${escapeHtml(result.displayText)}</span>
          </a>
        `;
            }).join('');

            resultsMenu.style.display = 'block';
        };

        /**
         * 検索結果から詳細モーダルを開く（グローバル関数）
         */
        window.App.utils.search.openDetailModalFromSearch = function (result) {
            window.App.utils.search.openDetailModal(result);
            const resultsMenu = document.getElementById('search-results-menu');
            if (resultsMenu) resultsMenu.style.display = 'none';
            const input = document.getElementById('search-input');
            if (input) input.value = '';
        };

        /**
         * テーブル名に応じた詳細モーダルを開く
         */
        window.App.utils.search.openDetailModal = function (result) {
            const { tableName, id } = result;

            if (tableName === SHEET_NAMES.CREATIVES && App.overlays.creativeDetail) {
                App.overlays.creativeDetail.open(id);
            } else if (tableName === SHEET_NAMES.PLANS && App.overlays.planDetail) {
                App.overlays.planDetail.open(id);
            } else if (tableName === SHEET_NAMES.TASKS && App.overlays.taskDetail) {
                App.overlays.taskDetail.open(id);
            } else if (tableName === SHEET_NAMES.MEMBERS && App.overlays.memberDetail) {
                App.overlays.memberDetail.open(id);
            } else {
                console.log('Unknown table for search result:', tableName);
                alert('このテーブルの詳細は表示できません: ' + tableName);
            }
        };

        // 下位互換性のためのグローバル関数
        window.openDetailModalFromSearch = window.App.utils.search.openDetailModalFromSearch;

    })();
</script>
