<div class="app-header">
    <div class="header-content">
        <h1 class="header-title" id="header-title-default">ZARMS 2026</h1>
        <h1 class="header-title" id="header-title-work-detail-header" style="display: none;"></h1>
        <div id="id-search-container"
            style="position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 0;">
            <input type="text" id="id-search-input" placeholder="ID検索"
                style="padding: 8px 24px; border: 1px solid #6b7280; border-right: none; border-radius: 50px 0 0 50px; font-size: 1.5rem; width: 600px; text-transform: uppercase; height: 48px; box-sizing: border-box;"
                onkeydown="handleIdSearchKeydown(event)" oninput="handleIdSearchInput(event)"
                onfocus="handleIdSearchFocus(event)" onblur="handleIdSearchBlur(event)">
            <button id="id-search-button" type="button" onclick="handleIdSearchClick()"
                style="padding: 8px 16px; border: 1px solid #6b7280; border-radius: 0 50px 50px 0; background-color: #f9fafb; cursor: pointer; height: 48px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; position: relative;">
                <span class="material-icons" style="font-size: 1.5rem; color: #6b7280;">search</span>
            </button>
        </div>
    </div>
    <div class="new-button-container">
        <div id="new-button" class="new-button">
            <span id="new-button-main">+</span>
        </div>
        <div id="new-button-dropdown" class="new-button-dropdown">
            <a onclick="openNewCreativeModal(); closeNewButtonDropdown();">制作物</a>
            <a onclick="openNewPlanModal(); closeNewButtonDropdown();">企画</a>
            <a id="new-member-dropdown-item" style="display: none;"
                onclick="openNewMemberModal(); closeNewButtonDropdown();">メンバー</a>
            <a onclick="openNewKnowledgeModal(); closeNewButtonDropdown();">ナレッジ</a>
        </div>
    </div>
    <button id="header-close-btn" class="header-close-btn" onclick="handleHeaderCloseClick()"
        style="display: none;"></button>
</div>
