<dialog id="modal-new-plan" class="modal">
    <h5 class="bold">新規企画作成</h5>
    <form id="new-plan-form" onsubmit="App.modals.new_plan.submit(event)">
        <div class="modal-content">
            <div class="field label border">
                <input type="text" name="title" required>
                <label>企画タイトル</label>
            </div>
        </div>
        <nav class="right-align">
            <button class="border" type="button" onclick="closeModal('modal-new-plan')">キャンセル</button>
            <button type="submit">作成</button>
        </nav>
        <div class="modal-result-content" style="display: none;"></div>
    </form>
</dialog>

<script>
    (function () {
        App.modals.new_plan = App.modals.new_plan || {};

        App.modals.new_plan.open = function () {
            const form = document.getElementById('new-plan-form');
            form.reset();
            // IME変換確定時のEnterキーを無視する処理を追加
            const textInputs = form.querySelectorAll('input[type="text"], textarea');
            textInputs.forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && e.isComposing) {
                        e.stopPropagation();
                    }
                });
            });
            openModal('modal-new-plan');
        };

        App.modals.new_plan.submit = function (event) {
            event.preventDefault();
            const title = event.target.elements.title.value;
            showModalLoading('modal-new-plan', '新規企画を作成しています');
            callGAS('createItem', SHEET_NAMES.PLANS, { title: title }).then(() => {
                showModalSuccess('modal-new-plan', '企画を作成しました', () => {
                    loadTabData(SHEET_NAMES.PLANS);
                });
            }).catch(error => {
                App.error.handleError(error);
                resetModalState('modal-new-plan');
            });
        };
    })();
</script>
