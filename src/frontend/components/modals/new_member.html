<dialog id="modal-new-member" class="modal">
    <h5 class="bold">新規メンバー登録</h5>
    <form id="new-member-form" onsubmit="App.modals.new_member.submit(event)">
        <div class="modal-content">
            <div class="field label border">
                <input type="email" name="member_email" required>
                <label>メールアドレス <span class="error-text">*</span></label>
            </div>
            <div class="field label border">
                <input type="text" name="member_name" required>
                <label>名前 <span class="error-text">*</span></label>
            </div>
            <div class="field label border">
                <input type="text" name="slack_member_id">
                <label>SlackメンバーID</label>
            </div>
            <div class="field label border">
                <input type="url" name="member_icon">
                <label>アイコンURL</label>
            </div>
            <div class="field label border">
                <select name="member_team_key" required></select>
                <label>チーム <span class="error-text">*</span></label>
                <i>arrow_drop_down</i>
            </div>
            <div class="field label border">
                <select name="role_key" required></select>
                <label>権限 <span class="error-text">*</span></label>
                <i>arrow_drop_down</i>
            </div>
            <div class="field label border">
                <textarea name="member_notes" rows="4"></textarea>
                <label>備考</label>
            </div>
        </div>
        <nav class="right-align">
            <button class="border" type="button" onclick="closeModal('modal-new-member')">キャンセル</button>
            <button type="submit">登録</button>
        </nav>
        <div class="modal-result-content" style="display: none;"></div>
    </form>
</dialog>

<script>
    (function () {
        App.modals.new_member = App.modals.new_member || {};

        App.modals.new_member.open = function () {
            const form = document.getElementById('new-member-form');
            form.reset();

            // チーム選択肢を設定
            const teamSelect = form.elements.member_team_key;
            teamSelect.innerHTML = '<option value="">選択してください</option>';
            const teams = configData['TEAM'] || [];
            teams.forEach(team => {
                const option = document.createElement('option');
                option.value = team.config_key;
                option.textContent = team.config_value;
                teamSelect.appendChild(option);
            });

            // 権限選択肢を設定
            const roleSelect = form.elements.role_key;
            roleSelect.innerHTML = '<option value="">選択してください</option>';
            const roles = configData['ROLE'] || [];
            roles.forEach(role => {
                const option = document.createElement('option');
                option.value = role.config_key;
                option.textContent = role.config_value;
                if (role.config_key === 'VIEWER') {
                    option.selected = true;
                }
                roleSelect.appendChild(option);
            });

            openModal('modal-new-member');
        };

        App.modals.new_member.submit = function (event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const memberData = Object.fromEntries(formData.entries());

            showModalLoading('modal-new-member', '新規メンバーを登録しています');
            callGAS('createItem', SHEET_NAMES.MEMBERS, memberData)
                .then(() => {
                    showModalSuccess('modal-new-member', '新規メンバーを登録しました', () => {
                        if (document.getElementById('tab-members').style.display === 'block') {
                            loadTabData(SHEET_NAMES.MEMBERS);
                        }
                    });
                })
                .catch(error => {
                    App.popups.error.handleError(error);
                    resetModalState('modal-new-member');
                });
        };
    })();
</script>
