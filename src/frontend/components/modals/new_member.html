<div id="modal-new-member" class="modal">
    <div class="modal-content">
        <div class="modal-form-content">
            <h2 class="modal-title">新規メンバー登録</h2>
            <form id="new-member-form" onsubmit="submitNewMember(event)">
                <div class="form-group">
                    <label class="form-label">メールアドレス <span style="color: red;">*</span></label>
                    <input type="email" name="member_email" class="input-field" required>
                </div>
                <div class="form-group">
                    <label class="form-label">名前 <span style="color: red;">*</span></label>
                    <input type="text" name="member_name" class="input-field" required>
                </div>
                <div class="form-group">
                    <label class="form-label">SlackメンバーID</label>
                    <input type="text" name="slack_member_id" class="input-field">
                </div>
                <div class="form-group">
                    <label class="form-label">アイコンURL</label>
                    <input type="url" name="member_icon" class="input-field">
                </div>
                <div class="form-group">
                    <label class="form-label">チーム <span style="color: red;">*</span></label>
                    <select name="member_team_key" class="input-field" required></select>
                </div>
                <div class="form-group">
                    <label class="form-label">権限 <span style="color: red;">*</span></label>
                    <select name="role_key" class="input-field" required></select>
                </div>
                <div class="form-group">
                    <label class="form-label">備考</label>
                    <textarea name="member_notes" class="input-field" rows="4"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-cancel"
                        onclick="closeModal('modal-new-member')">キャンセル</button>
                    <button type="submit" class="btn btn-primary">登録</button>
                </div>
            </form>
        </div>
        <div class="modal-result-content" style="display: none;">
        </div>
    </div>
</div>
