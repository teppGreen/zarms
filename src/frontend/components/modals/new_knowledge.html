<div id="modal-new-knowledge" class="modal">
    <div class="modal-content">
        <div class="modal-form-content">
            <h2 class="modal-title">新規ナレッジ作成</h2>
            <form id="new-knowledge-form" onsubmit="submitNewKnowledge(event)">
                <div class="form-group">
                    <label class="form-label">ナレッジタイプ <span style="color: red;">*</span></label>
                    <select name="knowledge_type_key" class="input-field" required></select>
                </div>
                <div class="form-group">
                    <label class="form-label">紐づける制作物 <span style="color: red;">*</span></label>
                    <div class="combobox-container">
                        <input type="text" name="work_search" class="input-field" placeholder="制作物を検索..."
                            oninput="searchWorksForKnowledge(this.value)" autocomplete="off">
                        <input type="hidden" name="work_id">
                        <div id="work-suggestions-knowledge" class="combobox-suggestions"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">内容 <span style="color: red;">*</span></label>
                    <div class="rich-text-editor-wrapper">
                        <div class="rich-text-toolbar" data-editor="knowledge-content-editor">
                            <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="h1"
                                title="見出し1">H1</button>
                            <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="h2"
                                title="見出し2">H2</button>
                            <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="h3"
                                title="見出し3">H3</button>
                            <span class="toolbar-separator"></span>
                            <button type="button" class="toolbar-btn" data-command="bold" title="太字"><b>B</b></button>
                            <button type="button" class="toolbar-btn" data-command="italic" title="斜体"><i>I</i></button>
                            <button type="button" class="toolbar-btn" data-command="strikeThrough"
                                title="打ち消し線"><s>S</s></button>
                            <button type="button" class="toolbar-btn" data-command="underline"
                                title="下線"><u>U</u></button>
                            <span class="toolbar-separator"></span>
                            <button type="button" class="toolbar-btn color-btn" data-color="#000000" title="黒"
                                style="background: #000000;"></button>
                            <button type="button" class="toolbar-btn color-btn" data-color="#FF0000" title="赤"
                                style="background: #FF0000;"></button>
                            <button type="button" class="toolbar-btn color-btn" data-color="#0000FF" title="青"
                                style="background: #0000FF;"></button>
                            <button type="button" class="toolbar-btn color-btn" data-color="#008000" title="緑"
                                style="background: #008000;"></button>
                        </div>
                        <div id="knowledge-content-editor" class="rich-text-editor" contenteditable="true"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-cancel"
                        onclick="closeModal('modal-new-knowledge')">キャンセル</button>
                    <button type="submit" class="btn btn-primary">作成</button>
                </div>
            </form>
        </div>
        <div class="modal-result-content" style="display: none;">
        </div>
    </div>
</div>
