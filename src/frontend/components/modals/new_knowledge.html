<dialog id="modal-new-knowledge" class="modal large">
    <h5 class="bold">新規ナレッジ作成</h5>
    <form id="new-knowledge-form" onsubmit="submitNewKnowledge(event)">
        <div class="modal-content">
            <div class="field label border">
                <select name="knowledge_type_key" required></select>
                <label>ナレッジタイプ <span class="error-text">*</span></label>
                <i>arrow_drop_down</i>
            </div>
            <div class="field label border">
                <!-- combobox logic needs custom handling or beer css autocomplete. 
                      BeerCSS has details > summary > input for autocomplete. 
                      For now, keep custom structure inside field but style it. -->
                <input type="text" name="creative_search" placeholder=" "
                    oninput="searchCreativesForKnowledge(this.value)" autocomplete="off">
                <label>紐づける制作物 <span class="error-text">*</span></label>
                <!-- Suggestions container needs absolute positioning usually -->
                <input type="hidden" name="creative_id">
                <div id="creative-suggestions-knowledge" class="menu"></div>
            </div>
            <div class="field textarea border">
                <!-- Rich text editor wrapper. BeerCSS textarea field expects textarea but we have div. 
                     We can just use a div with custom styling or put the rich editor below a label. -->
                <div class="rich-text-editor-wrapper">
                    <!-- Toolbar and Editor -->
                    <div class="rich-text-toolbar" data-editor="knowledge-content-editor">
                        <button type="button" class="circle small" data-command="formatBlock" data-value="h1"
                            title="見出し1">H1</button>
                        <button type="button" class="circle small" data-command="formatBlock" data-value="h2"
                            title="見出し2">H2</button>
                        <button type="button" class="circle small" data-command="formatBlock" data-value="h3"
                            title="見出し3">H3</button>
                        <div class="divider"></div>
                        <button type="button" class="circle small" data-command="bold"
                            title="太字"><i>format_bold</i></button>
                        <button type="button" class="circle small" data-command="italic"
                            title="斜体"><i>format_italic</i></button>
                        <button type="button" class="circle small" data-command="strikeThrough"
                            title="打ち消し線"><i>format_strikethrough</i></button>
                        <button type="button" class="circle small" data-command="underline"
                            title="下線"><i>format_underlined</i></button>
                        <!-- Colors might need custom buttons still -->
                    </div>
                    <div id="knowledge-content-editor" class="rich-text-editor" contenteditable="true"
                        style="min-height: 200px; padding: 10px; border: 1px solid var(--outline);"></div>
                </div>
            </div>
        </div>
        <nav class="right-align">
            <button class="border" type="button" onclick="closeModal('modal-new-knowledge')">キャンセル</button>
            <button type="submit">作成</button>
        </nav>
        <div class="modal-result-content" style="display: none;"></div>
    </form>
</dialog>
