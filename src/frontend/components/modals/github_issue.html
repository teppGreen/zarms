<div id="modal-github-issue" class="modal">
    <div class="modal-content">
        <div class="modal-form-content">
            <h2 class="modal-title">GitHubイシュー登録</h2>
            <form id="github-issue-form" onsubmit="submitGithubIssue(event)">
                <div class="form-group">
                    <label class="form-label">タイトル <span style="color: red;">*</span></label>
                    <input type="text" name="issue_title" class="input-field" required>
                </div>
                <div class="form-group">
                    <label class="form-label">詳細 <span style="color: red;">*</span></label>
                    <textarea name="issue_body" class="input-field" rows="6" required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">ラベル</label>
                    <select name="issue_labels" class="input-field" multiple size="4">
                        <option value="bug">🐛 bug</option>
                        <option value="enhancement">✨ enhancement</option>
                        <option value="documentation">📚 documentation</option>
                        <option value="question">❓ question</option>
                    </select>
                    <small style="color: #6b7280; font-size: 0.75rem;">複数選択可（Ctrl/Cmdキーを押しながらクリック）</small>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-cancel"
                        onclick="closeModal('modal-github-issue')">キャンセル</button>
                    <button type="submit" class="btn btn-primary">登録</button>
                </div>
            </form>
        </div>
        <div class="modal-result-content" style="display: none;">
        </div>
    </div>
</div>
