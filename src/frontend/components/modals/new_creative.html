<dialog id="modal-new-creative" class="modal large">
    <h5 class="bold">新規制作物作成</h5>
    <div id="new-creative-form"></div>
    <div class="modal-result-content" style="display: none;"></div>
</dialog>

<script>
    (function () {
        App.modals.new_creative = App.modals.new_creative || {};

        App.modals.new_creative.open = function () {
            const promises = [];
            const plansData = App.state.data.plans;
            if (!plansData || plansData.length === 0) {
                promises.push(callGAS('getItems', SHEET_NAMES.PLANS));
            } else {
                promises.push(Promise.resolve(plansData));
            }
            const directoriesData = App.state.data.directories;
            if (!directoriesData || directoriesData.length === 0) {
                promises.push(callGAS('getItems', SHEET_NAMES.DIRECTORIES));
            } else {
                promises.push(Promise.resolve(directoriesData));
            }

            if (promises.length > 0) {
                showLoading();
                Promise.all(promises).then(([plans, directories]) => {
                    if (!App.state.data.plans || App.state.data.plans.length === 0) App.state.data.plans = plans;
                    if (!App.state.data.directories || App.state.data.directories.length === 0) App.state.data.directories = directories;
                    hideLoading();
                    buildNewCreativeForm();
                    openModal('modal-new-creative');
                }).catch(App.utils.error.handle);
            } else {
                buildNewCreativeForm();
                openModal('modal-new-creative');
            }
        };

        function buildNewCreativeForm() {
            const formContainer = document.getElementById('new-creative-form');
            const enumData = App.state.data.enum;
            const plansData = App.state.data.plans;
            const directoriesData = App.state.data.directories;
            const creativeTypes = enumData['CREATIVE_TYPE'] || [];
            const creativeTypeOptions = creativeTypes.map(wt => `<option value="${wt.enum_key}">${wt.enum_value}</option>`).join('');

            // ディレクトリ（依頼元組織）の選択肢を作成
            const directoryOptions = (directoriesData || [])
                .sort((a, b) => (a.name || '').localeCompare(b.name || ''))
                .map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`)
                .join('');

            formContainer.innerHTML = `<form id="new-creative-form-element" onsubmit="App.modals.new_creative.submit(event)">
      <div class="field label border">
        <input type="text" name="plan_title" required placeholder=" " oninput="App.modals.new_creative.searchPlans(this.value)" autocomplete="off">
        <label>企画タイトル</label>
        <input type="hidden" name="plan_id">
        <div id="plan-suggestions" class="menu"></div>
      </div>
      <div class="field label border">
        <input type="text" name="title" required>
        <label>制作タイトル</label>
      </div>
      <div class="field label border">
        <select name="client_directory_id">
          <option value="">選択してください</option>
          ${directoryOptions}
        </select>
        <label>依頼元組織</label>
        <i>arrow_drop_down</i>
      </div>
      <div class="field label border">
        <select name="creative_type_key" onchange="App.modals.new_creative.updateRegulationPreset(this.value)">
          <option value="">選択してください</option>
          ${creativeTypeOptions}
        </select>
        <label>制作種別</label>
        <i>arrow_drop_down</i>
      </div>
      <div class="field label border">
        <input type="datetime-local" name="deadline_at" id="new-creative-deadline-at">
        <label>納品期限</label>
      </div>
      <div class="field textarea border">
        <textarea name="description" rows="4"></textarea>
        <label>制作物の概要</label>
      </div>
      <nav class="right-align">
        <button class="border" type="button" onclick="closeModal('modal-new-creative')">キャンセル</button>
        <button type="submit">作成</button>
      </nav>
    </form>`;

            // IME変換確定時のEnterキーを無視する処理を追加
            const form = document.getElementById('new-creative-form-element');
            if (form) {
                const textInputs = form.querySelectorAll('input[type="text"], textarea');
                textInputs.forEach(input => {
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && e.isComposing) {
                            e.stopPropagation();
                        }
                    });
                });

            }
        }

        App.modals.new_creative.updateRegulationPreset = function (creativeTypeKey) {
            if (!creativeTypeKey) return;
            const enumData = App.state.data.enum;
            const creativeType = (enumData['CREATIVE_TYPE'] || []).find(wt => wt.enum_key === creativeTypeKey);
            if (creativeType && creativeType.enum_preset_value) {
                document.querySelector('textarea[name="creative_detail_regulation"]').value = creativeType.enum_preset_value;
            }
        };

        App.modals.new_creative.searchPlans = function (query) {
            const suggestionsContainer = document.getElementById('plan-suggestions');
            const planIdInput = document.querySelector('#new-creative-form-element input[name="plan_id"]');
            if (!query) {
                suggestionsContainer.style.display = 'none';
                return;
            }
            const lowerCaseQuery = query.toLowerCase();
            const plansData = App.state.data.plans;
            const filteredPlans = plansData.filter(p => p.title.toLowerCase().includes(lowerCaseQuery));
            suggestionsContainer.innerHTML = '';
            filteredPlans.forEach(p => {
                const item = document.createElement('div');
                item.className = 'combobox-item';
                item.textContent = p.title;
                item.onclick = () => {
                    document.querySelector('#new-creative-form-element input[name="plan_title"]').value = p.title;
                    planIdInput.value = p.id;
                    suggestionsContainer.style.display = 'none';
                };
                suggestionsContainer.appendChild(item);
            });
            const newItem = document.createElement('div');
            newItem.className = 'combobox-item';
            newItem.innerHTML = `+ 新規作成: <strong>${escapeHtml(query)}</strong>`;
            newItem.onclick = () => {
                document.querySelector('#new-creative-form-element input[name="plan_title"]').value = query;
                planIdInput.value = '';
                suggestionsContainer.style.display = 'none';
            };
            suggestionsContainer.appendChild(newItem);
            suggestionsContainer.style.display = 'block';
        };

        document.addEventListener('click', function (event) {
            const container = document.getElementById('plan-combobox');
            if (container && !container.contains(event.target)) {
                const suggestions = document.getElementById('plan-suggestions');
                if (suggestions) {
                    suggestions.style.display = 'none';
                }
            }
        });

        App.modals.new_creative.submit = function (event) {
            event.preventDefault();
            const form = event.target;

            // カスタム日時入力フィールドの値を確実に更新
            const datetimeContainer = document.getElementById('new-creative-datetime-container');
            const hiddenInput = document.getElementById('new-creative-deadline-at');
            if (datetimeContainer && hiddenInput) {
                const inputs = datetimeContainer.querySelectorAll('.datetime-segment');
                if (typeof updateNewCreativeDateTimeValue === 'function') {
                    updateNewCreativeDateTimeValue(inputs, hiddenInput);
                }
            }

            const formData = new FormData(form);
            const creativeData = Object.fromEntries(formData.entries());
            showModalLoading('modal-new-creative', `新規制作物を作成しています`);
            callGAS('createItem', SHEET_NAMES.CREATIVES, creativeData)
                .then(id => {
                    showModalSuccess('modal-new-creative', '新規制作物を作成しました', () => {
                        if (document.getElementById('tab-creatives').style.display === 'block') {
                            loadTabData(SHEET_NAMES.CREATIVES);
                        }
                    });
                })
                .catch(error => {
                    App.utils.error.handle(error);
                    resetModalState('modal-new-creative');
                });
        };
    })();
</script>
