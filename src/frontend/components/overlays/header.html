<header class="fixed">
    <nav>
        <h5 class="max" id="header-title-default">ZARMS 2026</h5>
        <h5 class="max" id="header-title-detail-header" style="display: none;"></h5>

        <!-- 強化された検索バー -->
        <div class="field round border prefix" id="search-container" style="min-width: 300px;">
            <select id="search-target" style="border: none; background: transparent; padding: 4px;">
                <option value="all">すべて</option>
                <option value="id">ID</option>
                <option value="title">タイトル</option>
            </select>
            <input type="text" id="search-input" placeholder="検索..." onkeydown="handleSearchKeydown(event)"
                oninput="handleSearchInput(event)" onfocus="handleSearchFocus(event)" onblur="handleSearchBlur(event)">

            <!-- 検索結果ドロップダウン -->
            <menu id="search-results-menu" class="min"
                style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--outline); border-radius: 8px; max-height: 300px; overflow-y: auto; z-index: 1000;">
            </menu>

            <button class="transparent circle" onclick="handleSearchClick()">
                <i>search</i>
            </button>
        </div>

        <!-- 勤怠ボタン -->
        <button class="circle" id="timetrack-button" onclick="handleTimetrackClick()" title="打刻">
            <i>schedule</i>
        </button>

        <!-- ユーザーアイコンメニュー -->
        <button class="circle">
            <i>account_circle</i>
            <menu class="right">
                <a onclick="handleUserProfile()">
                    <i>person</i>
                    <span>プロフィール</span>
                </a>
                <div class="divider"></div>
                <a onclick="handleLogout()">
                    <i>logout</i>
                    <span>ログアウト</span>
                </a>
            </menu>
        </button>
    </nav>
</header>
