<header class="fixed">
    <nav>
        <button class="circle transparent l" id="menu-btn" data-ui="#menu">
            <!-- Assuming we might want a menu toggle for small screens, but sidebar is fixed left by default -->
            <i>menu</i>
        </button>

        <h5 class="max" id="header-title-default">ZARMS 2026</h5>
        <h5 class="max" id="header-title-detail-header" style="display: none;"></h5>

        <div class="field round border prefix min" id="id-search-container">
            <i class="front">search</i>
            <input type="text" id="id-search-input" placeholder="ID検索" onkeydown="handleIdSearchKeydown(event)"
                oninput="handleIdSearchInput(event)" onfocus="handleIdSearchFocus(event)"
                onblur="handleIdSearchBlur(event)">
            <menu id="id-search-menu" class="min"></menu> <!-- Placeholder if we need autocomplete dropdown later -->
            <button class="transparent circle" id="id-search-button" onclick="handleIdSearchClick()">
                <i>arrow_forward</i>
            </button>
        </div>

        <button id="new-button" class="circle">
            <i>add</i>
            <menu id="new-button-dropdown" class="no-wrap left">
                <a onclick="openNewCreativeModal();">制作物</a>
                <a onclick="openNewPlanModal();">企画</a>
                <a id="new-member-dropdown-item" style="display: none;" onclick="openNewMemberModal();">メンバー</a>
                <a onclick="openNewKnowledgeModal();">ナレッジ</a>
            </menu>
        </button>

        <button id="header-close-btn" class="circle transparent" onclick="handleHeaderCloseClick()"
            style="display: none;">
            <i>close</i>
        </button>
    </nav>
</header>
