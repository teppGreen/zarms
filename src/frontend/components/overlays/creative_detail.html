        if (isNaN(yearNum) || yearNum < 1900 || yearNum > 2100 ||
            isNaN(monthNum) || monthNum < 1 || monthNum > 12 ||
            isNaN(dayNum) || dayNum < 1 || dayNum > 31 ||
            isNaN(hourNum) || hourNum < 0 || hourNum > 23 ||
            isNaN(minuteNum) || minuteNum < 0 || minuteNum > 59) {
            alert('無効な日時です');
            cancelWorkDetailDateTime(editorDiv, container);
            return;
        }

        const newDateStr = `${yyyy.padStart(4, '0')}-${mm.padStart(2, '0')}-${dd.padStart(2, '0')}T${hh.padStart(2, '0')}:${min.padStart(2, '0')}:00`;
        const newDate = new Date(newDateStr);

        if (isNaN(newDate.getTime())) {
            alert('無効な日時です');
            cancelWorkDetailDateTime(editorDiv, container);
            return;
        }

        const newValueAsISO = newDate.toISOString();

        // テキストとボタンを再表示（先に表示を戻す）
        const textSpan = container.querySelector('.editable-text');
        if (textSpan) {
            textSpan.style.display = '';
        }
        const toggleBtn = container.querySelector('.editable-toggle-btn');
        if (toggleBtn) {
            toggleBtn.style.display = '';
        }

        // ピッカーを削除
        editorDiv.remove();

        if (newValueAsISO !== originalValue) {
            showLoading();
            callGAS('updateItem', SHEET_NAMES.CREATIVES, workId, { [field]: newValueAsISO })
                .then(() => {
                    const textSpanHeader = document.getElementById('work-detail-due-text-header');
                    const textSpan = document.getElementById('work-detail-due-text');
                    const formattedDate = formatDateTimeForDisplay(newValueAsISO);
                    if (textSpanHeader) {
                        textSpanHeader.textContent = formattedDate;
                    }
                    if (textSpan) {
                        textSpan.textContent = formattedDate;
                    }
                    // 残り日数も更新
                    if (field === 'due_datetime') {
                        const daysRemainingHeader = document.getElementById('work-detail-days-remaining-header');
                        if (daysRemainingHeader) {
                            daysRemainingHeader.textContent = calculateDaysRemaining(newValueAsISO);
                        }
                    }
                    hideLoading();
                })
                .catch(handleError);
        }
    }

    function cancelWorkDetailDateTime(editorDiv, container) {
        editorDiv.remove();

        // テキストとボタンを再表示
        const textSpan = container.querySelector('.editable-text');
        if (textSpan) {
            textSpan.style.display = '';
        }
        const toggleBtn = container.querySelector('.editable-toggle-btn');
        if (toggleBtn) {
            toggleBtn.style.display = '';
        }
    }

    function renderWorkTasks(tasks) {
        const container = document.getElementById('work-tasks-container');
        container.innerHTML = '';
        if (!tasks || tasks.length === 0) {
            container.innerHTML = '<p class="text-sm text-gray-500">タスクはありません。</p>';
            return;
        }

        // カード形式で表示
        tasks.forEach(task => {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.dataset.taskId = task.task_id;

            // ステータスに応じた色を取得
            const statusColor = getTaskStatusColor(task.status_key);

            // 担当者の情報を取得
            const assignee = task.assign_to ? membersData.find(m => m.member_email === task.assign_to) : null;
            const assigneeName = assignee ? assignee.member_name : '';
            const assigneeTeam = assignee ? getConfigLabel(assignee.member_team_key, 'TEAM') : '';
            const assigneeIcon = assignee ? (assignee.member_icon || 'https://via.placeholder.com/32') : 'https://via.placeholder.com/32';

            card.innerHTML = `
        <div class="task-card-content">
          <div class="task-card-header">
            <div class="task-card-id">${escapeHtml(task.task_id)}</div>
            <div class="task-card-status-indicator" style="border-color: ${statusColor};">
              <div class="task-card-status-icon" style="background-color: ${statusColor};"></div>
            </div>
          </div>
          <div class="task-card-title">
            ${escapeHtml(task.task_title)}
          </div>
          <div class="task-card-footer">
            <div class="task-card-assignee">
              ${task.assign_to ? `
                <img src="${assigneeIcon}" class="task-card-avatar" alt="${escapeHtml(assigneeName)}" title="${escapeHtml(assigneeName)}/${escapeHtml(assigneeTeam)}">
              ` : '<div class="task-card-avatar-placeholder">未設定</div>'}
            </div>
            <div class="task-card-date">
              ${formatDateTimeForDisplay(task.planned_end_datetime)}
            </div>
          </div>
        </div>
      `;

            // カード全体をクリックでモーダルを開く
            card.addEventListener('click', () => {
                openEditTaskModal(task);
            });

            container.appendChild(card);
        });
    }

    function getTaskStatusColor(statusKey) {
        switch (statusKey) {
            case 'TODO':
                return '#BA1A1A'; // 赤色
            case 'IN_PROGRESS':
                return '#FFC107'; // 黄色
            case 'DONE':
                return '#4CAF50'; // 緑色
            default:
                return '#74777F'; // グレー（デフォルト）
        }
    }

    function editTaskField(event, taskId, field, currentValue, configType) {
        event.stopPropagation();
        const container = event.currentTarget;

        if (configType === 'TEXT') {
            // テキスト編集
            const inputContainer = document.createElement('div');
            inputContainer.className = 'popup-editor';
            inputContainer.style.position = 'absolute';
            inputContainer.style.zIndex = '1000';
            inputContainer.style.backgroundColor = 'var(--md-sys-color-surface)';
            inputContainer.style.border = '1px solid var(--md-sys-color-outline)';
            inputContainer.style.borderRadius = '8px';
            inputContainer.style.padding = '8px';
            inputContainer.style.minWidth = '200px';

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'popup-editor-input';
            input.value = currentValue || '';
            input.style.width = '100%';
            input.style.padding = '8px';
            input.style.border = 'none';
            input.style.outline = 'none';
            input.style.fontSize = '0.875rem';
            input.style.fontFamily = 'inherit';

            const handleSubmit = () => {
                const newValue = input.value.trim();
                if (newValue !== currentValue) {
                    updateTaskField(taskId, field, newValue, currentValue);
                }
                closeAllPopups();
            };

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSubmit();
                } else if (e.key === 'Escape') {
                    closeAllPopups();
                }
            });

            input.addEventListener('blur', () => {
                setTimeout(handleSubmit, 200);
            });

            inputContainer.appendChild(input);
            createPopup(container, inputContainer);
            input.focus();
            input.select();
        } else if (configType === 'MEMBER') {
            // メンバー選択
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'popup-editor';
            optionsContainer.style.position = 'absolute';
            optionsContainer.style.zIndex = '1000';
            optionsContainer.style.backgroundColor = 'var(--md-sys-color-surface)';
            optionsContainer.style.border = '1px solid var(--md-sys-color-outline)';
            optionsContainer.style.borderRadius = '8px';
            optionsContainer.style.padding = '8px';
            optionsContainer.style.maxHeight = '200px';
            optionsContainer.style.overflowY = 'auto';

            const members = membersData || [];
            members.forEach(member => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'popup-editor-option';
                optionDiv.textContent = member.member_name;
                optionDiv.dataset.value = member.member_email;
                if (member.member_email === currentValue) {
                    optionDiv.classList.add('selected');
                }
                optionDiv.addEventListener('click', () => {
                    updateTaskField(taskId, field, member.member_email, currentValue);
                    closeAllPopups();
                });
                optionsContainer.appendChild(optionDiv);
            });

            createPopup(container, optionsContainer);
        } else {
            // ステータス選択
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'popup-editor';
            optionsContainer.style.position = 'absolute';
            optionsContainer.style.zIndex = '1000';
            optionsContainer.style.backgroundColor = 'var(--md-sys-color-surface)';
            optionsContainer.style.border = '1px solid var(--md-sys-color-outline)';
            optionsContainer.style.borderRadius = '8px';
            optionsContainer.style.padding = '8px';

            const options = configData[configType] || [];
            options.forEach(opt => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'popup-editor-option';
                optionDiv.textContent = opt.config_value;
                optionDiv.dataset.value = opt.config_key;
                if (opt.config_key === currentValue) {
                    optionDiv.classList.add('selected');
                }
                optionDiv.addEventListener('click', () => {
                    updateTaskField(taskId, field, opt.config_key, currentValue);
                    closeAllPopups();
                });
                optionsContainer.appendChild(optionDiv);
            });

            createPopup(container, optionsContainer);
        }
    }

    function updateTaskField(taskId, field, newValue, oldValue) {
        if (String(newValue) === String(oldValue)) return;

        showLoading();
        callGAS('updateItem', SHEET_NAMES.TASKS, taskId, { [field]: newValue })
            .then(() => {
                hideLoading();
                // Work詳細を再読み込み
                if (currentWorkId) {
                    openCreativeDetailOverlay(currentWorkId);
                }
            })
            .catch(error => {
                handleError(error);
            });
    }

    function openEditTaskModal(task) {
        // タスク編集モーダルを開く（簡易版：新規作成モーダルを再利用）
        const form = document.getElementById('new-task-form');
        const modalTitle = form.closest('.modal-content').querySelector('.modal-title');

        // モーダルタイトルを変更
        if (modalTitle) {
            modalTitle.textContent = 'タスク編集';
        }

        // フォームをリセット
        form.reset();

        // タスクデータを設定
        form.elements.work_id.value = task.work_id;
        form.elements.task_title.value = task.task_title || '';
        if (form.elements.task_detail) {
            form.elements.task_detail.value = task.task_detail || '';
        }

        // メンバー選択肢を設定
        const assignToSelect = form.elements.assign_to;
        assignToSelect.innerHTML = '<option value="">選択してください</option>';
        if (membersData && membersData.length > 0) {
            membersData.forEach(member => {
                const option = document.createElement('option');
                option.value = member.member_email;
                option.textContent = member.member_name;
                if (member.member_email === task.assign_to) {
                    option.selected = true;
                }
                assignToSelect.appendChild(option);
            });
        }

        // ステータス選択肢を設定
        const statusSelect = form.elements.status_key;
        statusSelect.innerHTML = '<option value="">選択してください</option>';
        const taskStatuses = configData['TASK_STATUS'] || [];
        taskStatuses.forEach(status => {
            const option = document.createElement('option');
            option.value = status.config_key;
            option.textContent = status.config_value;
            if (status.config_key === task.status_key) {
                option.selected = true;
            }
            statusSelect.appendChild(option);
        });

        // 優先度選択肢を設定
        const prioritySelect = form.elements.priority_key;
        if (prioritySelect) {
            prioritySelect.innerHTML = '<option value="">選択してください</option>';
            const priorities = configData['TASK_PRIORITY'] || [];
            priorities.forEach(priority => {
                const option = document.createElement('option');
                option.value = priority.config_key;
                option.textContent = priority.config_value;
                if (priority.config_key === task.priority_key) {
                    option.selected = true;
                }
                prioritySelect.appendChild(option);
            });
        }

        // 日時を設定
        if (task.planned_end_datetime && form.elements.planned_end_datetime) {
            form.elements.planned_end_datetime.value = formatDateTimeForInput(task.planned_end_datetime);
        }

        // 送信ボタンのテキストを変更
        const submitButton = form.querySelector('button[type="submit"]');
        if (submitButton) {
            submitButton.textContent = '更新';
        }

        // フォームの送信ハンドラを一時的に変更
        const originalOnsubmit = form.onsubmit;
        form.onsubmit = (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const taskData = Object.fromEntries(formData.entries());
            taskData.task_id = task.task_id;

            showModalLoading('modal-new-task', 'タスクを更新しています');
            callGAS('updateTask', task.task_id, taskData)
                .then(() => {
                    showModalSuccess('modal-new-task', 'タスクを更新しました', () => {
                        if (currentWorkId) {
                            openCreativeDetailOverlay(currentWorkId);
                        }
                    });
                    // 元のハンドラに戻す
                    form.onsubmit = originalOnsubmit;
                    if (modalTitle) {
                        modalTitle.textContent = '新規タスク作成';
                    }
                    if (submitButton) {
                        submitButton.textContent = '作成';
                    }
                })
                .catch(error => {
                    handleError(error);
                    resetModalState('modal-new-task');
                });
        };

        openModal('modal-new-task');
    }

    function getMemberNameById(email) {
        if (!email || !membersData) return '';
        const member = membersData.find(m => m.member_email === email);
        return member ? member.member_name : email;
    }

    function openAddAssigneeDropdown(buttonElement, workId, currentAssignees) {
        // 既に割り当てられているメンバーを取得
        const assignedEmails = (currentAssignees || []).map(a => a.member_email);
        const availableMembers = (membersData || []).filter(m => !assignedEmails.includes(m.member_email));

        if (availableMembers.length === 0) {
            alert('追加できるメンバーがいません');
            return;
        }

        // 既存のドロップダウンを閉じる
        const existingDropdown = document.getElementById('assignee-dropdown');
        if (existingDropdown) {
            existingDropdown.remove();
        }

        // メンバーをソートする関数
        const sortMembers = (members) => {
            if (!currentUser) return members;

            const currentUserEmail = currentUser.member_email;
            const currentUserTeam = currentUser.member_team_key;

            // 自分、同じTEAM、その他の順に分類
            const myself = [];
            const sameTeam = [];
            const others = [];

            members.forEach(member => {
                if (member.member_email === currentUserEmail) {
                    myself.push(member);
                } else if (member.member_team_key === currentUserTeam) {
                    sameTeam.push(member);
                } else {
                    others.push(member);
                }
            });

            // その他は名前降順でソート
            others.sort((a, b) => {
                const nameA = (a.member_name || '').toLowerCase();
                const nameB = (b.member_name || '').toLowerCase();
                return nameB.localeCompare(nameA, 'ja');
            });

            // 順番に結合
            return [...myself, ...sameTeam, ...others];
        };

        // ドロップダウンを作成
        const dropdown = document.createElement('div');
        dropdown.id = 'assignee-dropdown';
        dropdown.className = 'assignee-dropdown';
        dropdown.style.position = 'absolute';
        dropdown.style.zIndex = '2000';
        dropdown.style.backgroundColor = 'var(--md-sys-color-surface)';
        dropdown.style.border = '1px solid var(--md-sys-color-outline)';
        dropdown.style.borderRadius = '8px';
        dropdown.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
        dropdown.style.minWidth = '250px';
        dropdown.style.maxWidth = '400px';
        dropdown.style.display = 'flex';
        dropdown.style.flexDirection = 'column';

        // 検索入力欄
        const searchInput = document.createElement('input');
        searchInput.type = 'text';
        searchInput.placeholder = 'メンバーを検索...';
        searchInput.className = 'input-field';
        searchInput.style.margin = '8px';
        searchInput.style.width = 'calc(100% - 16px)';
        searchInput.style.boxSizing = 'border-box';
        searchInput.style.flexShrink = '0';
        dropdown.appendChild(searchInput);

        // メンバーリストコンテナ（スクロール可能）
        const membersList = document.createElement('div');
        membersList.id = 'assignee-members-list';
        membersList.style.maxHeight = '300px';
        membersList.style.overflowY = 'auto';
        membersList.style.overflowX = 'hidden';
        dropdown.appendChild(membersList);

        // メンバーを表示する関数
        const renderMembers = (members) => {
            membersList.innerHTML = '';
            if (members.length === 0) {
                const noResult = document.createElement('div');
                noResult.textContent = '該当するメンバーがいません';
                noResult.style.padding = '12px';
                noResult.style.color = 'var(--md-sys-color-on-surface-variant)';
                noResult.style.textAlign = 'center';
                membersList.appendChild(noResult);
                return;
            }

            // ソートを適用
            const sortedMembers = sortMembers(members);

            sortedMembers.forEach(member => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'popup-editor-option';
                optionDiv.style.display = 'flex';
                optionDiv.style.alignItems = 'center';
                optionDiv.style.gap = '8px';
                optionDiv.style.padding = '8px 12px';
                optionDiv.style.cursor = 'pointer';

                const icon = document.createElement('img');
                icon.src = member.member_icon || 'https://via.placeholder.com/24';
                icon.className = 'avatar';
                icon.style.width = '24px';
                icon.style.height = '24px';

                const nameDiv = document.createElement('div');
                nameDiv.textContent = member.member_name;

                const teamDiv = document.createElement('div');
                teamDiv.textContent = getConfigLabel(member.member_team_key, 'TEAM');
                teamDiv.style.fontSize = '0.75rem';
                teamDiv.style.color = 'var(--md-sys-color-on-surface-variant)';

                const infoDiv = document.createElement('div');
                infoDiv.style.display = 'flex';
                infoDiv.style.flexDirection = 'column';
                infoDiv.appendChild(nameDiv);
                infoDiv.appendChild(teamDiv);

                optionDiv.appendChild(icon);
                optionDiv.appendChild(infoDiv);

                optionDiv.addEventListener('click', () => {
                    addWorkAssignee(workId, member.member_email);
                    dropdown.remove();
                });

                membersList.appendChild(optionDiv);
            });
        };

        // 初期表示（ソート済み）
        const sortedAvailableMembers = sortMembers(availableMembers);
        renderMembers(sortedAvailableMembers);

        // 検索機能
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = availableMembers.filter(m =>
                m.member_name.toLowerCase().includes(query) ||
                (m.member_email && m.member_email.toLowerCase().includes(query))
            );
            renderMembers(filtered);
        });

        // 位置を設定
        const rect = buttonElement.getBoundingClientRect();
        dropdown.style.left = `${rect.right}px`;
        dropdown.style.top = `${rect.top}px`;

        document.body.appendChild(dropdown);

        // 外側をクリックしたら閉じる
        const closeOnOutsideClick = (e) => {
            if (!dropdown.contains(e.target) && e.target !== buttonElement) {
                dropdown.remove();
                document.removeEventListener('click', closeOnOutsideClick);
            }
        };
        setTimeout(() => {
            document.addEventListener('click', closeOnOutsideClick);
        }, 0);

        // 検索入力にフォーカス
        searchInput.focus();
    }

    function addWorkAssignee(workId, memberEmail) {
        showLoading();
        const member = membersData.find(m => m.member_email === memberEmail);
        const memberId = member ? member.id : null;

        if (!memberId) {
            alert('Member not found');
            hideLoading();
            return;
        }

        callGAS('createItem', SHEET_NAMES.MEMBER_ASSIGNMENTS, { creative_id: workId, member_id: memberId })
            .then(() => {
                hideLoading();
                if (currentWorkId) {
                    // 担当者表示を更新
                    callGAS('getItemById', SHEET_NAMES.CREATIVES, currentWorkId).then(work => {
                        const assigneesContainer = document.getElementById('work-detail-assignees-header-info');
                        if (assigneesContainer) {
                            assigneesContainer.innerHTML = '';
                            assigneesContainer.style.display = 'inline-flex';
                            assigneesContainer.style.alignItems = 'center';
                            if (work.assignees && work.assignees.length > 0) {
                                work.assignees.forEach(assignee => {
                                    const icon = document.createElement('img');
                                    icon.src = assignee.member_icon || 'https://via.placeholder.com/32';
                                    icon.className = 'avatar';
                                    icon.style.width = '24px';
                                    icon.style.height = '24px';
                                    icon.style.marginRight = '4px';
                                    icon.style.verticalAlign = 'middle';
                                    icon.title = `${assignee.member_name} / ${assignee.member_team_value}`;
                                    assigneesContainer.appendChild(icon);
                                });
                            }
                            // ＋アイコンを追加
                            const addIcon = document.createElement('button');
                            addIcon.innerHTML = '+';
                            addIcon.className = 'btn-icon-add-assignee';
                            addIcon.style.width = '24px';
                            addIcon.style.height = '24px';
                            addIcon.style.borderRadius = '50%';
                            addIcon.style.border = 'none';
                            addIcon.style.backgroundColor = 'var(--md-sys-color-primary)';
                            addIcon.style.color = 'var(--md-sys-color-on-primary)';
                            addIcon.style.cursor = 'pointer';
                            addIcon.style.marginLeft = '4px';
                            addIcon.style.display = 'inline-flex';
                            addIcon.style.alignItems = 'center';
                            addIcon.style.justifyContent = 'center';
                            addIcon.style.fontSize = '1rem';
                            addIcon.style.fontWeight = 'bold';
                            addIcon.style.verticalAlign = 'middle';
                            addIcon.onclick = (e) => {
                                e.stopPropagation();
                                openAddAssigneeDropdown(e.target, work.work_id, work.assignees || []);
                            };
                            assigneesContainer.appendChild(addIcon);
                        }
                    });
                    openCreativeDetailOverlay(currentWorkId);
                }
            })
            .catch(error => {
                handleError(error);
            });
    }

    function removeWorkAssignee(workId, memberEmail) {
        if (!confirm('この担当者を削除しますか？')) return;

        showLoading();
        const member = membersData.find(m => m.member_email === memberEmail);
        const memberId = member ? member.id : null;

        if (!memberId) {
            alert('Member not found');
            hideLoading();
            return;
        }

        callGAS('deleteItem', SHEET_NAMES.MEMBER_ASSIGNMENTS, { related_table: SHEET_NAMES.CREATIVES, related_id: workId, member_id: memberId })
            .then(() => {
                hideLoading();
                if (currentWorkId) {
                    openCreativeDetailOverlay(currentWorkId);
                }
            })
            .catch(error => {
                handleError(error);
            });
    }
    // Expose functions to global App namespace
    Object.assign(App.overlays.creativeDetail, {
        open: openCreativeDetailOverlay,
        close: closeCreativeDetailOverlay,
        copyUrl: copyCreativeDetailUrl,
        searchPlans: searchPlansForCreativeDetail,
        performPlanSearch: performPlanSearch,
        searchProjectsForTitle: searchProjectsForOverlayProjectTitle,
        performProjectTitleSearchImmediate: performOverlayProjectTitleSearchImmediate,
        performProjectTitleSearchUpdate: performOverlayProjectTitleSearchUpdate,
        showSelectEditor: showSelectEditorForWorkDetail,
        showSelectEditorHeader: showSelectEditorForWorkDetailHeader,
        openDateTimePicker: openDateTimePickerForWorkDetail,
        openDateTimePickerHeader: openDateTimePickerForWorkDetailHeader,
        saveDateTime: saveWorkDetailDateTime,
        saveDateTimeHeader: saveWorkDetailDateTimeHeader,
        cancelDateTime: cancelWorkDetailDateTime,
        renderTasks: renderWorkTasks,
        getTaskStatusColor: getTaskStatusColor,
        editTaskField: editTaskField,
        updateTaskField: updateTaskField,
        openEditTaskModal: openEditTaskModal,
        getMemberNameById: getMemberNameById,
        openAddAssigneeDropdown: openAddAssigneeDropdown,
        addAssignee: addWorkAssignee,
        removeAssignee: removeWorkAssignee
    });
</script>
