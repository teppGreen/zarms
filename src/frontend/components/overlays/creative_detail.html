<div id="creative-detail-overlay" class="overlay">
    <div class="overlay-content">
        <div class="workflow-status-bar" id="workflow-status-bar" style="display: none;">
            <div class="workflow-status-item">
                <select id="workflow-status-dropdown" class="workflow-status-dropdown">
                    <option value="承認中">承認中</option>
                </select>
            </div>
            <div class="workflow-status-item" id="workflow-status-request">
                <span class="workflow-status-icon-wrapper">
                    <span class="workflow-status-icon"></span>
                </span>
                <span class="workflow-status-label">依頼:</span>
                <span class="workflow-status-date" id="workflow-date-request"></span>
            </div>
            <div class="workflow-status-item" id="workflow-status-production">
                <span class="workflow-status-icon-wrapper">
                    <span class="workflow-status-icon"></span>
                </span>
                <span class="workflow-status-label">制作:</span>
                <span class="workflow-status-date" id="workflow-date-production"></span>
            </div>
            <div class="workflow-status-item" id="workflow-status-approval">
                <span class="workflow-status-icon-wrapper">
                    <span class="workflow-status-icon"></span>
                </span>
                <span class="workflow-status-label">承認:</span>
                <span class="workflow-status-date" id="workflow-date-approval"></span>
            </div>
            <div class="workflow-status-item" id="workflow-status-delivery">
                <span class="workflow-status-icon-wrapper">
                    <span class="workflow-status-icon"></span>
                </span>
                <span class="workflow-status-label">納品:</span>
                <span class="workflow-status-date" id="workflow-date-delivery"></span>
            </div>
            <div class="workflow-status-item" id="workflow-status-days-remaining" style="display: none;">
                <span class="workflow-status-days-text" id="workflow-days-remaining-text"></span>
            </div>
        </div>
        <div class="overlay-body">
            <!-- 列1: 企画情報など（1/5幅） -->
            <div class="overlay-column-plan">
                <div class="plan-info-section">
                    <div class="plan-info-field">
                        <label>企画タイトル</label>
                        <div id="overlay-plan-title" class="plan-info-value"></div>
                    </div>
                    <div class="plan-info-field">
                        <label>制作タイトル</label>
                        <div id="overlay-work-title" class="plan-info-value"></div>
                    </div>
                    <div class="plan-info-field">
                        <label>制作物種別</label>
                        <div id="overlay-work-type" class="plan-info-value"></div>
                    </div>
                    <div class="plan-info-field">
                        <label>依頼受付優先度</label>
                        <div id="overlay-priority" class="plan-info-value"></div>
                    </div>
                    <div class="plan-info-separator"></div>
                    <div class="plan-info-field">
                        <label>依頼者</label>
                        <div id="overlay-client" class="plan-info-value"></div>
                    </div>
                    <div class="plan-info-field">
                        <label>担当者</label>
                        <button id="overlay-add-assignee-btn" class="plan-info-add-btn">+追加</button>
                        <div id="overlay-assignees" class="plan-info-assignees"></div>
                    </div>
                </div>
            </div>
            <!-- 列2-3: ドキュメントの埋め込み（2/5幅） -->
            <div class="overlay-column-document">
                <div id="work-detail-document-container" style="width: 100%; height: 100%;">
                </div>
            </div>
            <!-- 列4: タスク（1/5幅） -->
            <div class="overlay-column-task">
                <div class="detail-section">
                    <div
                        style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                        <h3 style="margin: 0;">タスク</h3>
                        <button class="btn btn-sm" style="font-size: 0.75rem;">▼フィルタ</button>
                    </div>
                    <div id="work-tasks-container"></div>
                    <button id="new-task-button" class="btn btn-sm">+追加</button>
                </div>
            </div>
            <!-- 列5: レビュー（1/5幅） -->
            <div class="overlay-column-review">
                <div class="detail-section">
                    <div
                        style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                        <h3 style="margin: 0;">レビュー</h3>
                    </div>
                    <div id="work-review-requests-container" class="home-scroll-container"></div>
                    <button id="new-review-request-button" class="btn btn-sm" style="margin-top: 12px;">+追加</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    App.overlays.creativeDetail = {};

    let currentWorkId = null;
    let currentWork = null;
    let currentProjectId = null;

    function openCreativeDetailOverlay(workId) {
        // JavaScript関数呼び出しを記録（HTTP 429エラー時の再試行用）
        recordJSInvocation('openCreativeDetailOverlay', workId);

        showLoading();
        currentWorkId = workId;
        const promises = [
            callGAS('getItemById', SHEET_NAMES.CREATIVES, workId),
            callGAS('getWorkflowTimestamps', workId)
        ];
        if (!membersData || membersData.length === 0) {
            promises.push(callGAS('getMembers'));
        } else {
            promises.push(Promise.resolve(membersData));
        }
        Promise.all(promises).then(([work, timestamps, members]) => {
            if (!membersData || membersData.length === 0) {
                membersData = members;
            }

            // 現在のworkデータを保持
            currentWork = work;

            // メインヘッダーを更新
            const headerTitleDefault = document.getElementById('header-title-default');
            const headerTitleWorkDetailHeader = document.getElementById('header-title-work-detail-header');
            const headerCloseBtn = document.getElementById('header-close-btn');
            const newButton = document.getElementById('new-button');

            if (headerTitleDefault) headerTitleDefault.style.display = 'none';
            if (headerTitleWorkDetailHeader) {
                headerTitleWorkDetailHeader.style.display = 'flex';
                headerTitleWorkDetailHeader.textContent = 'CTMS v3.0';
            }
            if (headerCloseBtn) headerCloseBtn.style.display = 'flex';
            if (newButton) newButton.style.display = 'none';

            // ID検索バーにIDを表示
            const workIdForSearch = `${work.plan_id || ''}-${work.display_id || work.id || ''}`;
            updateIdSearchInput(workIdForSearch);

            // ワークフローステータスバーを表示
            const workflowStatusBar = document.getElementById('workflow-status-bar');
            if (workflowStatusBar && timestamps) {
                workflowStatusBar.style.display = 'flex';

                // workflow-status-dropdownに全てのCREATIVE_STATUSを表示
                const workflowStatusDropdown = document.getElementById('workflow-status-dropdown');
                if (workflowStatusDropdown && configData.CREATIVE_STATUS) {
                    workflowStatusDropdown.innerHTML = '';
                    const activeStatuses = configData.CREATIVE_STATUS.filter(status => status.is_active !== false);
                    activeStatuses.forEach(status => {
                        const option = document.createElement('option');
                        option.value = status.config_key;
                        option.textContent = status.config_value;
                        if (status.config_key === work.creative_status_key) {
                            option.selected = true;
                        }
                        workflowStatusDropdown.appendChild(option);
                    });

                    // ドロップダウン変更イベントを追加
                    workflowStatusDropdown.onchange = function () {
                        const newStatusKey = this.value;
                        if (newStatusKey && newStatusKey !== work.creative_status_key) {
                            showLoading();
                            callGAS('updateItem', SHEET_NAMES.CREATIVES, work.id, { creative_status_key: newStatusKey })
                                .then(() => {
                                    hideLoading();
                                    // 画面を再読み込みしてステータスの日時を更新
                                    openCreativeDetailOverlay(work.id);
                                })
                                .catch(handleError);
                        }
                    };
                }

                // 日時をフォーマットする関数（yyyy/mm/dd(曜日) hh:mm形式）
                const formatWorkflowDate = (dateStr) => {
                    if (!dateStr) return '';
                    const date = new Date(dateStr);
                    const days = ['日', '月', '火', '水', '木', '金', '土'];
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    const dayOfWeek = days[date.getDay()];
                    const hours = String(date.getHours()).padStart(2, '0');
                    const minutes = String(date.getMinutes()).padStart(2, '0');
                    return `${year}/${month}/${day}(${dayOfWeek}) ${hours}:${minutes}`;
                };

                // ステータス表示を更新する関数
                function updateWorkflowStatusDisplay(work, timestamps) {
                    const currentStatus = work.creative_status_key;

                    // CANCELEDの場合は全ての背景色をgrayに
                    const isCanceled = currentStatus === 'CANCELED';
                    const canceledColor = '#9E9E9E'; // gray

                    // アイコンの表示を背景色に応じて変更する関数
                    function updateIcon(iconElement, color) {
                        if (!iconElement) return;
                        if (isCanceled) {
                            // CANCELEDの場合はアイコンを非表示
                            iconElement.textContent = '';
                        } else if (color === '#4CAF50') {
                            // 緑: ✓
                            iconElement.textContent = '✓';
                        } else if (color === '#FF9800') {
                            // オレンジ: ＞
                            iconElement.textContent = '＞';
                        } else {
                            // 赤: 何もなし
                            iconElement.textContent = '';
                        }
                    }

                    // 依頼: 常に緑、形式: yyyy/mm/dd(曜日) hh:mm
                    const requestItem = document.getElementById('workflow-status-request');
                    const requestIconWrapper = requestItem ? requestItem.querySelector('.workflow-status-icon-wrapper') : null;
                    const requestIcon = requestItem ? requestItem.querySelector('.workflow-status-icon') : null;
                    const requestDate = document.getElementById('workflow-date-request');
                    if (requestItem && requestIconWrapper && requestIcon) {
                        const requestColor = isCanceled ? canceledColor : '#4CAF50'; // CANCELEDの場合はgray、それ以外は緑
                        requestIconWrapper.style.backgroundColor = requestColor;
                        updateIcon(requestIcon, requestColor);
                        // ブレード型の背景色も設定
                        requestItem.style.setProperty('--blade-color', requestColor);
                    }
                    if (requestDate) {
                        const requestDateValue = timestamps.request || work.created_at;
                        if (requestDateValue) {
                            requestDate.textContent = formatWorkflowDate(requestDateValue);
                        }
                    }

                    // 制作: creative_status_key が TO-DO の場合は赤、CREATEの場合はオレンジ、それ以外の場合は緑
                    // 形式: yyyy/mm/dd(曜日) hh:mm ~
                    const productionItem = document.getElementById('workflow-status-production');
                    const productionIconWrapper = productionItem ? productionItem.querySelector('.workflow-status-icon-wrapper') : null;
                    const productionIcon = productionItem ? productionItem.querySelector('.workflow-status-icon') : null;
                    const productionDate = document.getElementById('workflow-date-production');
                    if (productionItem && productionIconWrapper && productionIcon) {
                        let productionColor;
                        if (isCanceled) {
                            productionColor = canceledColor; // CANCELEDの場合はgray
                        } else if (currentStatus === 'TO-DO') {
                            productionColor = '#F44336'; // TO-DOの場合は赤
                        } else if (currentStatus === 'CREATE') {
                            productionColor = '#FF9800'; // CREATEの場合はオレンジ
                        } else {
                            productionColor = '#4CAF50'; // それ以外の場合は緑
                        }
                        productionIconWrapper.style.backgroundColor = productionColor;
                        updateIcon(productionIcon, productionColor);
                        // ブレード型の背景色も設定
                        productionItem.style.setProperty('--blade-color', productionColor);
                    }
                    if (productionDate && timestamps.production) {
                        productionDate.textContent = formatWorkflowDate(timestamps.production) + ' ~';
                    }

                    // 承認: creative_status_key が REVIEW または REVISIONの場合はオレンジ、APPROVEDの場合は緑、それ以外の場合は赤
                    // 形式: 色がオレンジの場合は yyyy/mm/dd(曜日) hh:mm ~, 色が赤の場合は ~ yyyy/mm/dd(曜日) hh:mm
                    const approvalItem = document.getElementById('workflow-status-approval');
                    const approvalIconWrapper = approvalItem ? approvalItem.querySelector('.workflow-status-icon-wrapper') : null;
                    const approvalIcon = approvalItem ? approvalItem.querySelector('.workflow-status-icon') : null;
                    const approvalDate = document.getElementById('workflow-date-approval');
                    if (approvalItem && approvalIconWrapper && approvalIcon) {
                        let approvalColor = isCanceled ? canceledColor : '#F44336'; // CANCELEDの場合はgray、デフォルト: 赤
                        if (!isCanceled) {
                            if (currentStatus === 'REVIEW' || currentStatus === 'REVISION') {
                                approvalColor = '#FF9800'; // オレンジ
                            } else if (currentStatus === 'APPROVED') {
                                approvalColor = '#4CAF50'; // 緑
                            }
                        }
                        approvalIconWrapper.style.backgroundColor = approvalColor;
                        updateIcon(approvalIcon, approvalColor);
                        // ブレード型の背景色も設定
                        approvalItem.style.setProperty('--blade-color', approvalColor);
                    }
                    if (approvalDate && timestamps.approval) {
                        let approvalColor = '#F44336';
                        if (currentStatus === 'REVIEW' || currentStatus === 'REVISION') {
                            approvalColor = '#FF9800';
                        } else if (currentStatus === 'APPROVED') {
                            approvalColor = '#4CAF50';
                        }
                        if (approvalColor === '#FF9800') {
                            // オレンジの場合
                            approvalDate.textContent = formatWorkflowDate(timestamps.approval) + ' ~';
                        } else {
                            // 赤の場合
                            approvalDate.textContent = '~ ' + formatWorkflowDate(timestamps.approval);
                        }
                    }

                    // 納品: creative_status_key が DELIVERED の場合は緑、APPROVED の場合はオレンジ、それ以外の場合は赤
                    // 形式: 色が緑の場合は yyyy/mm/dd(曜日) hh:mm, 色が赤またはオレンジの場合は ~ yyyy/mm/dd(曜日) hh:mm
                    // 日時の後ろに、deadline_atまでの残り日数を表示
                    const deliveryItem = document.getElementById('workflow-status-delivery');
                    const deliveryIconWrapper = deliveryItem ? deliveryItem.querySelector('.workflow-status-icon-wrapper') : null;
                    const deliveryIcon = deliveryItem ? deliveryItem.querySelector('.workflow-status-icon') : null;
                    const deliveryDate = document.getElementById('workflow-date-delivery');

                    // 残り日数を計算する関数
                    function calculateDaysRemaining(dueDatetime) {
                        if (!dueDatetime) return null;
                        const now = new Date();
                        const due = new Date(dueDatetime);
                        // 日付のみを比較（時刻を無視）
                        const nowDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                        const dueDate = new Date(due.getFullYear(), due.getMonth(), due.getDate());
                        const diffTime = dueDate - nowDate;
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        return diffDays;
                    }

                    if (deliveryItem && deliveryIconWrapper && deliveryIcon) {
                        let deliveryColor = isCanceled ? canceledColor : '#F44336'; // CANCELEDの場合はgray、デフォルト: 赤
                        if (!isCanceled) {
                            if (currentStatus === 'DELIVERED') {
                                deliveryColor = '#4CAF50'; // 緑
                            } else if (currentStatus === 'APPROVED') {
                                deliveryColor = '#FF9800'; // オレンジ
                            }
                        }

                        // 期限超過のチェック（CANCELEDの場合は無視）
                        if (!isCanceled) {
                            const daysRemaining = calculateDaysRemaining(work.deadline_at);
                            const isOverdue = daysRemaining !== null && daysRemaining < 0;

                            if (isOverdue) {
                                // 期限超過の場合: 透明度を反転＆文字色をwhiteに変更
                                deliveryItem.classList.add('overdue');
                                deliveryIconWrapper.style.opacity = '1';
                            } else {
                                deliveryItem.classList.remove('overdue');
                                deliveryIconWrapper.style.opacity = '1';
                            }
                        } else {
                            deliveryItem.classList.remove('overdue');
                            deliveryIconWrapper.style.opacity = '1';
                        }

                        deliveryIconWrapper.style.backgroundColor = deliveryColor;
                        updateIcon(deliveryIcon, deliveryColor);
                        // ブレード型の背景色も設定
                        deliveryItem.style.setProperty('--blade-color', deliveryColor);
                    }
                    if (deliveryDate && timestamps.delivery) {
                        let deliveryColor = '#F44336';
                        if (currentStatus === 'DELIVERED') {
                            deliveryColor = '#4CAF50';
                        } else if (currentStatus === 'APPROVED') {
                            deliveryColor = '#FF9800';
                        }

                        let dateText = '';
                        if (deliveryColor === '#4CAF50') {
                            // 緑の場合
                            dateText = formatWorkflowDate(timestamps.delivery);
                        } else {
                            // 赤またはオレンジの場合
                            dateText = '~ ' + formatWorkflowDate(timestamps.delivery);
                        }

                        deliveryDate.textContent = dateText;

                        // DELIVEREDでない場合のみ、日時部分をクリック可能にする
                        if (currentStatus !== 'DELIVERED') {
                            deliveryDate.style.cursor = 'pointer';
                            deliveryDate.classList.add('editable-datetime');
                            deliveryDate.onclick = (e) => {
                                e.stopPropagation();
                                openDeliveryDateTimePicker(deliveryDate, work.id, timestamps.delivery || work.deadline_at);
                            };
                        } else {
                            deliveryDate.style.cursor = 'default';
                            deliveryDate.classList.remove('editable-datetime');
                            deliveryDate.onclick = null;
                        }
                    }

                    // 残り日数を新しい要素に表示
                    const daysRemainingItem = document.getElementById('workflow-status-days-remaining');
                    const daysRemainingText = document.getElementById('workflow-days-remaining-text');
                    if (daysRemainingItem && daysRemainingText) {
                        // DELIVEREDまたはCANCELEDの場合は非表示
                        if (currentStatus === 'DELIVERED' || currentStatus === 'CANCELED') {
                            daysRemainingItem.style.display = 'none';
                        } else {
                            const daysRemaining = calculateDaysRemaining(work.deadline_at);
                            if (daysRemaining !== null) {
                                let daysText = '';
                                if (daysRemaining === 0) {
                                    daysText = '本日';
                                } else if (daysRemaining < 0) {
                                    daysText = Math.abs(daysRemaining) + '日前(超過)';
                                } else {
                                    daysText = daysRemaining + '日後';
                                }
                                daysRemainingText.textContent = daysText;

                                // 納品と同じ背景色を設定
                                let deliveryColor = '#F44336';
                                if (currentStatus === 'DELIVERED') {
                                    deliveryColor = '#4CAF50';
                                } else if (currentStatus === 'APPROVED') {
                                    deliveryColor = '#FF9800';
                                }

                                // 期限超過のチェック
                                const isOverdue = daysRemaining < 0;
                                if (isOverdue) {
                                    daysRemainingItem.classList.add('overdue');
                                } else {
                                    daysRemainingItem.classList.remove('overdue');
                                }

                                // ブレード型の背景色も設定
                                daysRemainingItem.style.setProperty('--blade-color', deliveryColor);
                                daysRemainingItem.style.display = 'flex';
                            } else {
                                daysRemainingItem.style.display = 'none';
                            }
                        }
                    }
                }

                // ステータス表示を更新
                updateWorkflowStatusDisplay(work, timestamps);
            }

            // 納品日時の日時選択ピッカーを開く関数
            function openDeliveryDateTimePicker(dateElement, workId, originalValue) {
                if (!dateElement || !workId) return;

                // 既に編集中なら何もしない
                if (dateElement.classList.contains('editing-delivery-datetime')) return;

                // 編集中の状態にする
                dateElement.classList.add('editing-delivery-datetime');

                // 現在の日時を取得してパース
                let dateObj;
                if (originalValue) {
                    dateObj = new Date(originalValue);
                } else {
                    dateObj = new Date();
                }

                const yyyy = dateObj.getFullYear().toString().padStart(4, '0');
                const mm = (dateObj.getMonth() + 1).toString().padStart(2, '0');
                const dd = dateObj.getDate().toString().padStart(2, '0');
                const hh = dateObj.getHours().toString().padStart(2, '0');
                const min = dateObj.getMinutes().toString().padStart(2, '0');

                // 元のテキストを保存
                const originalText = dateElement.textContent;

                // カスタム日時入力フィールドを作成
                const editorDiv = document.createElement('div');
                editorDiv.className = 'datetime-custom-editor';
                editorDiv.style.position = 'absolute';
                editorDiv.style.zIndex = '1000';
                editorDiv.style.backgroundColor = 'var(--md-sys-color-surface)';
                editorDiv.style.border = '2px solid var(--md-sys-color-primary)';
                editorDiv.style.borderRadius = '8px';
                editorDiv.style.padding = '8px';
                editorDiv.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
                editorDiv.innerHTML = `
          <input type="text" class="datetime-segment" data-segment="yyyy" maxlength="4" value="${yyyy}" placeholder="yyyy" />
          <span class="datetime-separator">/</span>
          <input type="text" class="datetime-segment" data-segment="mm" maxlength="2" value="${mm}" placeholder="mm" />
          <span class="datetime-separator">/</span>
          <input type="text" class="datetime-segment" data-segment="dd" maxlength="2" value="${dd}" placeholder="dd" />
          <span class="datetime-separator"> </span>
          <input type="text" class="datetime-segment" data-segment="hh" maxlength="2" value="${hh}" placeholder="hh" />
          <span class="datetime-separator">:</span>
          <input type="text" class="datetime-segment" data-segment="min" maxlength="2" value="${min}" placeholder="mm" />
        `;

                // 位置を計算（dateElementの位置に合わせる）
                const rect = dateElement.getBoundingClientRect();
                const deliveryItem = document.getElementById('workflow-status-delivery');
                if (!deliveryItem) return;

                // deliveryItemにposition: relativeを設定
                const originalPosition = deliveryItem.style.position;
                if (!deliveryItem.style.position || deliveryItem.style.position === 'static') {
                    deliveryItem.style.position = 'relative';
                }

                // 一時的にテキストを非表示（opacityで非表示にしてレイアウトを維持）
                dateElement.style.opacity = '0';

                // エディタを追加（deliveryItem内に配置）
                deliveryItem.appendChild(editorDiv);

                // 位置を計算（dateElementの相対位置）
                const itemRect = deliveryItem.getBoundingClientRect();
                const dateRect = dateElement.getBoundingClientRect();
                editorDiv.style.position = 'absolute';
                editorDiv.style.top = (dateRect.top - itemRect.top + dateRect.height + 4) + 'px';
                editorDiv.style.left = (dateRect.left - itemRect.left) + 'px';

                const inputs = editorDiv.querySelectorAll('.datetime-segment');

                // 各inputにイベントリスナーを設定
                inputs.forEach((input, index) => {
                    // 数字のみ入力可能
                    input.addEventListener('input', (e) => {
                        let value = e.target.value.replace(/[^0-9]/g, '');
                        const maxLength = parseInt(e.target.getAttribute('maxlength'));

                        if (value.length > maxLength) {
                            value = value.substring(0, maxLength);
                        }

                        e.target.value = value;

                        // 最大桁数に達したら次のフィールドへ
                        if (value.length >= maxLength && index < inputs.length - 1) {
                            inputs[index + 1].focus();
                            inputs[index + 1].select();
                        }
                    });

                    // キーボード操作
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.isComposing) {
                            e.preventDefault();
                            saveDeliveryDateTime(editorDiv, dateElement, workId, originalValue, inputs);
                        } else if (e.key === 'Escape') {
                            e.preventDefault();
                            cancelDeliveryDateTime(editorDiv, dateElement, originalText);
                        } else if (e.key === 'Tab') {
                            // Tabキーは自然な動作を許可
                            if (!e.shiftKey && index === inputs.length - 1) {
                                // 最後のフィールドでTabを押したら保存
                                e.preventDefault();
                                saveDeliveryDateTime(editorDiv, dateElement, workId, originalValue, inputs);
                            }
                        } else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) {
                            // カーソルが末尾にある場合は次のフィールドへ
                            if (index < inputs.length - 1) {
                                e.preventDefault();
                                inputs[index + 1].focus();
                                inputs[index + 1].setSelectionRange(0, 0);
                            }
                        } else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) {
                            // カーソルが先頭にある場合は前のフィールドへ
                            if (index > 0) {
                                e.preventDefault();
                                const prevInput = inputs[index - 1];
                                prevInput.focus();
                                prevInput.setSelectionRange(prevInput.value.length, prevInput.value.length);
                            }
                        }
                    });

                    // フォーカスアウト時の処理
                    input.addEventListener('blur', (e) => {
                        setTimeout(() => {
                            // 次のフォーカスがdatetime-segment内かチェック
                            const focusedElement = document.activeElement;
                            if (!focusedElement || !focusedElement.classList.contains('datetime-segment') || !editorDiv.contains(focusedElement)) {
                                saveDeliveryDateTime(editorDiv, dateElement, workId, originalValue, inputs);
                            }
                        }, 100);
                    });
                });

                // クリックアウトサイドで閉じる
                const clickOutsideHandler = (e) => {
                    if (!editorDiv.contains(e.target) && e.target !== dateElement) {
                        saveDeliveryDateTime(editorDiv, dateElement, workId, originalValue, inputs);
                        document.removeEventListener('click', clickOutsideHandler);
                    }
                };
                setTimeout(() => {
                    document.addEventListener('click', clickOutsideHandler);
                }, 100);

                // 最初のフィールドにフォーカス
                setTimeout(() => {
                    inputs[0].focus();
                    inputs[0].select();
                }, 50);
            }

            function saveDeliveryDateTime(editorDiv, dateElement, workId, originalValue, inputs) {
                const values = Array.from(inputs).map(input => input.value);
                const [yyyy, mm, dd, hh, min] = values;

                // バリデーション
                const yearNum = parseInt(yyyy);
                const monthNum = parseInt(mm);
                const dayNum = parseInt(dd);
                const hourNum = parseInt(hh);
                const minuteNum = parseInt(min);

                if (isNaN(yearNum) || yearNum < 1900 || yearNum > 2100 ||
                    isNaN(monthNum) || monthNum < 1 || monthNum > 12 ||
                    isNaN(dayNum) || dayNum < 1 || dayNum > 31 ||
                    isNaN(hourNum) || hourNum < 0 || hourNum > 23 ||
                    isNaN(minuteNum) || minuteNum < 0 || minuteNum > 59) {
                    alert('無効な日時です');
                    cancelDeliveryDateTime(editorDiv, dateElement, dateElement.textContent);
                    return;
                }

                // ISO形式の日時文字列を作成（秒は00固定）
                const paddedYyyy = yyyy.padStart(4, '0');
                const paddedMm = mm.padStart(2, '0');
                const paddedDd = dd.padStart(2, '0');
                const paddedHh = hh.padStart(2, '0');
                const paddedMin = min.padStart(2, '0');

                const newDateStr = `${paddedYyyy}-${paddedMm}-${paddedDd}T${paddedHh}:${paddedMin}:00`;
                const newDate = new Date(newDateStr);

                if (isNaN(newDate.getTime())) {
                    alert('無効な日時です');
                    cancelDeliveryDateTime(editorDiv, dateElement, dateElement.textContent);
                    return;
                }

                const newValueAsISO = newDate.toISOString();

                // エディタを削除
                if (editorDiv && editorDiv.parentNode) {
                    editorDiv.parentNode.removeChild(editorDiv);
                }

                // テキストを再表示
                dateElement.style.opacity = '1';
                dateElement.classList.remove('editing-delivery-datetime');

                // deliveryItemのpositionを元に戻す
                const deliveryItem = document.getElementById('workflow-status-delivery');
                if (deliveryItem) {
                    deliveryItem.style.position = '';
                }

                // データを保存（変更があった場合のみ）
                if (newValueAsISO !== originalValue) {
                    showLoading();
                    callGAS('updateItem', SHEET_NAMES.CREATIVES, workId, { due_datetime: newValueAsISO })
                        .then(() => {
                            hideLoading();
                            // 画面を再読み込みしてステータスの日時を更新
                            openWorkDetailOverlay(workId);
                        })
                        .catch(handleError);
                }
            }

            function cancelDeliveryDateTime(editorDiv, dateElement, originalText) {

                }

                dateElement.style.opacity = '1';

            // overlay-body内の案件情報列にデータを表示

                    }

                    const currentValue = e.target.value.trim();

                    }

                    // 少し遅延させて、ドロップダウンのクリックイベントが先に処理されるようにする
                    blurTimeoutId = setTimeout(() => {

                            activeElement: document.activeElement,
                            isInputFocused: document.activeElement === projectTitleInput,
                            dropdownSelected: projectTitleInput.dataset.dropdownSelected
                        });

                        // フォーカスが再度当たっている場合は処理をスキップ
                        if (document.activeElement === projectTitleInput) {

                        const dropdownContainer = overlayProjectTitle.querySelector('.overlay-project-title-dropdown');

                            dropdownSelected: projectTitleInput.dataset.dropdownSelected,
                            dropdownDisplay: dropdownDisplay,
                            isDropdownVisible: isDropdownVisible,
                            currentValue: currentValue,
                            originalProjectTitle: originalProjectTitle,
                            shouldReset: projectTitleInput.dataset.dropdownSelected !== 'true' &&
                                !isDropdownVisible &&
                                currentValue !== originalProjectTitle
                        });

                        // ドロップダウンが選択されていない場合、かつドロップダウンが非表示で、かつ値が変更されている場合は元の値に戻す
                        if (projectTitleInput.dataset.dropdownSelected !== 'true' &&

                        }
                        // フラグをリセット

                        blurTimeoutId = null;
                    }, 200);

                // キーボード操作のサポート

                    const options = dropdownContainer.querySelectorAll('.popup-editor-option');
                    if (options.length === 0) return;

                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        selectedIndex = Math.min(selectedIndex + 1, options.length - 1);
                        options[selectedIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                        options.forEach((opt, idx) => {
                            opt.classList.toggle('selected', idx === selectedIndex);
                        });
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        selectedIndex = Math.max(selectedIndex - 1, -1);
                        options.forEach((opt, idx) => {
                            opt.classList.toggle('selected', idx === selectedIndex);
                        });
                        if (selectedIndex >= 0) {
                            options[selectedIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                        }
                    } else if (e.key === 'Enter' && selectedIndex >= 0) {
                        e.preventDefault();
                        options[selectedIndex].click();
                    } else if (e.key === 'Escape') {
                        dropdownContainer.style.display = 'none';
                        selectedIndex = -1;
                    }

                overlayProjectTitle.appendChild(projectTitleInput);

                // ドロップダウンコンテナを作成（既存のものを削除してから作成）

            // Googleドキュメントを埋め込む
            const docContainer = document.getElementById('work-detail-document-container');
            let currentDocumentClickHandler = null;
            let containerClickHandler = null;
            let observer = null;

            // 既存のイベントリスナーをクリーンアップ
            if (docContainer._iframeActive !== undefined) {
                if (docContainer._containerClickHandler) {
                    docContainer.removeEventListener('click', docContainer._containerClickHandler);
                }
                if (docContainer._documentClickHandler) {
                    document.removeEventListener('click', docContainer._documentClickHandler, true);
                }
                if (docContainer._observer) {
                    docContainer._observer.disconnect();
                }
            }

            if (work.work_document_id) {
                // Googleドキュメントを編集可能な状態で埋め込む（rm=minimalパラメータ追加）
                const embedUrl = `https://docs.google.com/document/d/${work.work_document_id}/edit?rm=minimal&tab=${work.work_document_tab_id}`;
                const iframe = document.createElement('iframe');
                iframe.src = embedUrl;
                iframe.style.cssText = 'width: 100%; height: 100%; max-width: 100%; border: none; overflow-x: hidden; border-radius: 8px; pointer-events: none;';
                docContainer.innerHTML = '';
                docContainer.appendChild(iframe);

                // iframeを無効化する関数
                const deactivateIframe = function () {
                    iframe.style.pointerEvents = 'none';
                    if (currentDocumentClickHandler) {
                        document.removeEventListener('click', currentDocumentClickHandler, true);
                        currentDocumentClickHandler = null;
                    }
                    docContainer._iframeActive = false;
                };

                // コンテナをクリックしたときにiframeを有効化
                let isIframeActive = false;
                containerClickHandler = function (e) {
                    // iframe内のクリックは無視（iframe自身が処理）
                    if (e.target === iframe) return;

                    // コンテナをクリックした場合、iframeを有効化
                    if (!isIframeActive) {
                        iframe.style.pointerEvents = 'auto';
                        isIframeActive = true;
                        docContainer._iframeActive = true;

                        // ドキュメント外をクリックしたときにiframeを無効化
                        currentDocumentClickHandler = function (e) {
                            // オーバーレイ内のクリックをチェック
                            const overlay = document.getElementById('work-detail-overlay');
                            if (overlay && overlay.contains(e.target)) {
                                // work-detail-document-container外のクリックの場合のみ無効化
                                if (!docContainer.contains(e.target) && e.target !== iframe) {
                                    isIframeActive = false;
                                    deactivateIframe();
                                }
                            } else {
                                // オーバーレイ外のクリックの場合は無効化
                                isIframeActive = false;
                                deactivateIframe();
                            }
                        };

                        // 少し遅延させてからイベントリスナーを追加（iframe内のクリックイベントが先に処理されるように）
                        setTimeout(() => {
                            document.addEventListener('click', currentDocumentClickHandler, true);
                            docContainer._documentClickHandler = currentDocumentClickHandler;
                        }, 100);
                    }
                };

                docContainer.addEventListener('click', containerClickHandler);
                docContainer._containerClickHandler = containerClickHandler;

                // オーバーレイが閉じられたときにiframeを無効化
                const overlay = document.getElementById('work-detail-overlay');
                observer = new MutationObserver(function (mutations) {
                    mutations.forEach(function (mutation) {
                        if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                            if (!overlay.classList.contains('show')) {
                                isIframeActive = false;
                                deactivateIframe();
                            }
                        }
                    });
                });
                observer.observe(overlay, { attributes: true });
                docContainer._observer = observer;
            } else {
                docContainer.innerHTML = '';
            }

            renderWorkTasks(work.tasks);
            renderWorkAssignees(work.assignees);
            // renderWorkApps(work.apps);
            // renderWorkReviewRequests(work.review_requests || []);
            document.getElementById('new-task-button').onclick = () => openNewTaskModal(work.work_id);
            document.getElementById('new-review-request-button').onclick = () => openNewReviewRequestModal(work.work_id);
            document.getElementById('work-detail-overlay').classList.add('show');
            hideLoading();
        }).catch(handleError);
    }

    function initRichTextEditors() {
        // すべてのリッチテキストエディタのツールバーを初期化
        document.querySelectorAll('.rich-text-toolbar').forEach(toolbar => {
            const editorId = toolbar.dataset.editor;
            const editor = document.getElementById(editorId);
            if (!editor) return;

            // ツールバーボタンのイベントリスナーを設定
            toolbar.querySelectorAll('.toolbar-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const command = btn.dataset.command;
                    const value = btn.dataset.value;
                    const color = btn.dataset.color;

                    editor.focus();

                    if (color) {
                        // 色選択
                        document.execCommand('foreColor', false, color);
                    } else if (command === 'formatBlock' && value) {
                        // 見出し
                        document.execCommand('formatBlock', false, value);
                    } else {
                        // その他のコマンド（bold, italic, strikeThrough, underline）
                        document.execCommand(command, false, null);
                    }

                    updateToolbarState(toolbar, editor);
                });
            });

            // エディタの変更を監視して自動保存
            let saveTimeout = null;
            editor.addEventListener('input', () => {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    saveRichTextEditor(editor);
                }, 2000); // 2秒後に自動保存
            });

            // エディタのフォーカス時にツールバーの状態を更新
            editor.addEventListener('focus', () => {
                updateToolbarState(toolbar, editor);
            });

            editor.addEventListener('keyup', () => {
                updateToolbarState(toolbar, editor);
            });
        });
    }

    function updateToolbarState(toolbar, editor) {
        // ツールバーボタンのアクティブ状態を更新
        toolbar.querySelectorAll('.toolbar-btn').forEach(btn => {
            const command = btn.dataset.command;
            const value = btn.dataset.value;

            btn.classList.remove('active');

            if (command === 'formatBlock' && value) {
                // 見出しの状態をチェック
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    const node = range.commonAncestorContainer;
                    const parent = node.nodeType === 1 ? node : node.parentElement;
                    if (parent && parent.tagName && parent.tagName.toLowerCase() === value) {
                        btn.classList.add('active');
                    }
                }
            } else if (command && !btn.dataset.color) {
                // その他のコマンドの状態をチェック
                if (document.queryCommandState(command)) {
                    btn.classList.add('active');
                }
            }
        });
    }

    function searchPlansForCreativeDetail(query, workId) {
        const planTitleHeader = document.getElementById('creative-detail-plan-title-header');
        const suggestionsContainer = document.getElementById('creative-detail-plan-suggestions');
        const planTitleInput = planTitleHeader.querySelector('input');

        if (!query) {
            suggestionsContainer.style.display = 'none';
            return;
        }

        // plansDataが取得されていない場合は取得

    function performPlanSearch(query, workId, suggestionsContainer, planTitleInput) {
        const lowerCaseQuery = query.toLowerCase();
        const filteredPlans = (plansData || []).filter(p =>
            p.title.toLowerCase().includes(lowerCaseQuery)
        );

        suggestionsContainer.innerHTML = '';

        // 入力フィールドの位置を取得
        const inputRect = planTitleInput.getBoundingClientRect();

        filteredPlans.forEach(p => {
            const item = document.createElement('div');
            item.className = 'combobox-item';
            item.textContent = p.title;
            item.onclick = () => {
                planTitleInput.value = p.title;
                const oldPlanId = planTitleInput.dataset.planId;
                planTitleInput.dataset.planId = p.id;
                suggestionsContainer.style.display = 'none';
                // 企画IDを更新
                if (p.id !== oldPlanId) {
                    showLoading();
                    callGAS('updateItem', SHEET_NAMES.CREATIVES, workId, { plan_id: p.id })
                        .then(() => {
                            document.getElementById('creative-detail-plan-id-header').textContent = p.id;
                            hideLoading();
                        })
                        .catch(handleError);
                }
            };
            suggestionsContainer.appendChild(item);
        });

        const newItem = document.createElement('div');
        newItem.className = 'combobox-item';
        newItem.innerHTML = `+ 新規作成: <strong>${escapeHtml(query)}</strong>`;
        newItem.onclick = () => {
            showLoading();
            callGAS('createItem', SHEET_NAMES.PLANS, { title: query }).then(planId => {
                planTitleInput.value = query;
                planTitleInput.dataset.planId = planId;
                suggestionsContainer.style.display = 'none';
                document.getElementById('creative-detail-plan-id-header').textContent = planId;
                // 企画IDを更新
                callGAS('updateItem', SHEET_NAMES.CREATIVES, workId, { plan_id: planId })
                    .then(() => {
                        // plansDataを更新
                        if (plansData) {
                            plansData.push({ id: planId, title: query });
                        }
                        hideLoading();
                    })
                    .catch(handleError);
            }).catch(handleError);
        };
        suggestionsContainer.appendChild(newItem);

        // 位置を設定
        suggestionsContainer.style.left = `${inputRect.left}px`;
        suggestionsContainer.style.top = `${inputRect.bottom + window.scrollY}px`;
        suggestionsContainer.style.width = `${inputRect.width}px`;
        suggestionsContainer.style.display = 'block';
    }

      <input type="text" class="datetime-segment" data-segment="hh" maxlength="2" value="${hh}" placeholder="hh" />
      <span class="datetime-separator">:</span>
      <input type="text" class="datetime-segment" data-segment="min" maxlength="2" value="${min}" placeholder="mm" />
    `;

        const rect = container.getBoundingClientRect();
        editorDiv.style.left = `${rect.left + window.scrollX}px`;
        editorDiv.style.top = `${rect.bottom + window.scrollY}px`;
        editorDiv.style.zIndex = '99999';
        document.body.appendChild(editorDiv);

        const inputs = editorDiv.querySelectorAll('.datetime-segment');

        // 各inputにイベントリスナーを設定
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                let value = e.target.value.replace(/[^0-9]/g, '');
                const maxLength = parseInt(e.target.getAttribute('maxlength'));
                if (value.length > maxLength) {
                    value = value.substring(0, maxLength);
                }
                e.target.value = value;
                if (value.length >= maxLength && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                    inputs[index + 1].select();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.isComposing) {

                    cancelWorkDetailDateTime(editorDiv, container);

                setTimeout(() => {
                    const focusedElement = document.activeElement;
                    if (!focusedElement || !focusedElement.classList.contains('datetime-segment')) {
                        saveWorkDetailDateTime(editorDiv, container, workId, field, originalValue, inputs);
                    }
                }, 100);
            });
        });

        setTimeout(() => {
            inputs[0].focus();
            inputs[0].select();
        }, 50);
    }

    function saveWorkDetailDateTime(editorDiv, container, workId, field, originalValue, inputs) {
        const values = Array.from(inputs).map(input => input.value);
        const [yyyy, mm, dd, hh, min] = values;

        const yearNum = parseInt(yyyy);
        const monthNum = parseInt(mm);
        const dayNum = parseInt(dd);
        const hourNum = parseInt(hh);
        const minuteNum = parseInt(min);

        if (isNaN(yearNum) || yearNum < 1900 || yearNum > 2100 ||
            isNaN(monthNum) || monthNum < 1 || monthNum > 12 ||
            isNaN(dayNum) || dayNum < 1 || dayNum > 31 ||
            isNaN(hourNum) || hourNum < 0 || hourNum > 23 ||
            isNaN(minuteNum) || minuteNum < 0 || minuteNum > 59) {
            alert('無効な日時です');
            cancelWorkDetailDateTime(editorDiv, container);
            return;
        }

        const newDateStr = `${yyyy.padStart(4, '0')}-${mm.padStart(2, '0')}-${dd.padStart(2, '0')}T${hh.padStart(2, '0')}:${min.padStart(2, '0')}:00`;
        const newDate = new Date(newDateStr);

        if (isNaN(newDate.getTime())) {
            alert('無効な日時です');
            cancelWorkDetailDateTime(editorDiv, container);
            return;
        }

        const newValueAsISO = newDate.toISOString();

        editorDiv.remove();
        container.style.display = 'inline-flex';

        if (newValueAsISO !== originalValue) {
            showLoading();
            callGAS('updateItem', SHEET_NAMES.CREATIVES, workId, { [field]: newValueAsISO })
                .then(() => {
                    const textSpan = container.querySelector('.editable-text');
                    if (textSpan) {
                        textSpan.textContent = formatDateTimeForDisplay(newValueAsISO);
                    }
                    hideLoading();
                })
                .catch(handleError);
        }
    }
