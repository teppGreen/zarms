<!-- 詳細画面: 制作物 -->
<div id="detail-creative" style="display: none; height: 100%;">
  <nav class="small-margin row align-center">
    <button class="circle transparent" onclick="App.pages.creativeDetail.goBack()">
      <i>arrow_back</i>
    </button>
    <h5 class="bold max" id="creative-detail-title">制作物詳細</h5>
    <div class="max"></div>
    <button class="border round">
      <i>link</i>
      <span id="display-id" style="font-family: 'Roboto Mono', monospace; font-weight: 500;" class="large-text"></span>
    </button>
  </nav>

  <div class="small-space"></div>

  <div id="creative-detail-content" class="" style="flex: 1;">
    <div class="grid no-space" style="height: 100%;">
      <!-- Left Column (s12 m3): Basic Info -->
      <div class="s12 m3 small-margin" style="height: 100%;">
        <!-- Title -->
        <div class="field label border">
          <input type="text" id="creative-title-input"
            onchange="App.pages.creativeDetail.updateField('title', this.value)">
          <label>タイトル</label>
        </div>

        <!-- Status -->
        <div class="field label border">
          <select id="creative-status-select"
            onchange="App.pages.creativeDetail.updateField('creative_status_key', this.value)">
          </select>
          <label>ステータス</label>
        </div>

        <!-- Type -->
        <div class="field label border">
          <select id="creative-type-select"
            onchange="App.pages.creativeDetail.updateField('creative_type_key', this.value)">
          </select>
          <label>タイプ</label>
        </div>

        <!-- Priority -->
        <div class="field label border">
          <select id="creative-priority-select"
            onchange="App.pages.creativeDetail.updateField('priority_key', this.value)">
          </select>
          <label>優先度</label>
        </div>

        <!-- Deadline -->
        <div class="field label border">
          <input type="datetime-local" id="creative-deadline-input"
            onchange="App.pages.creativeDetail.updateField('deadline_at', this.value)">
          <label>納品期限</label>
        </div>

        <!-- Client -->
        <div class="field label border suffix">
          <input type="text" id="creative-client-display" readonly>
          <label>依頼元</label>
          <i onclick="App.pages.creativeDetail.selectDirectory('client_directory_id')">edit</i>
        </div>

        <!-- Contractor -->
        <div class="field label border suffix">
          <input type="text" id="creative-contractor-display" readonly>
          <label>依頼先</label>
          <i onclick="App.pages.creativeDetail.selectDirectory('contractor_directory_id')">edit</i>
        </div>

        <div class="small-space"></div>

        <!-- Members -->
        <div class="row">
          <button class="small" onclick="App.pages.creativeDetail.addMembers()">
            <i>add</i>
            <span>担当者を追加</span>
          </button>
        </div>
        <div id="creative-members-container" class="chips">
          読み込み中...
        </div>
      </div>

      <!-- Center Column (s12 m6): Content -->
      <div class="s12 m6 small-margin" style="position: relative; height: 100%;">
        <div id="creative-main-content-area" style="width: 100%; height: 100%; background-color: white;"
          class="small-round no-padding border"></div>

        <!-- Tabs -->
        <div style="position: absolute; width: 90%; bottom: 0;" class="m l center bottom-margin">
          <nav class="tabbed small" id="detail-center-column-nav">
            <a onclick="App.pages.creativeDetail.switchTab(event, 'documents')"><span>ドキュメント</span></a>
            <a onclick="App.pages.creativeDetail.switchTab(event, 'folder')"><span>フォルダ</span></a>
            <a onclick="App.pages.creativeDetail.switchTab(event, 'relations')"><span>リレーション</span></a>
            <a onclick="App.pages.creativeDetail.switchTab(event, 'tasks')"><span>タスク</span></a>
          </nav>
        </div>
      </div>

      <!-- Right Column (s12 m3): Notes -->
      <div class="s12 m3 small-padding"
        style="position: relative; height: 100%; display: flex; flex-direction: column;">
        <div id="creative-notes-list" style="flex: 1; overflow-y: scroll;"></div>
        <div style="flex: 1; position: absolute; bottom: 0; width: 100%;" class="m l center">
          <div class="field textarea round fill suffix">
            <textarea id="creative-note-input" rows="2" placeholder="コメントやメモを入力"
              onkeydown="if((event.ctrlKey || event.metaKey) && event.key === 'Enter'){ event.preventDefault(); App.pages.creativeDetail.postNote(); }"></textarea>
            <i onclick="App.pages.creativeDetail.postNote()">send</i>
          </div>
          <span class="small-text">Ctrl+Enter または Cmd+Enter で送信</span>
        </div>
      </div>
    </div>
  </div>
  <div class="small-space"></div>
</div>

<script>
  App.pages.creativeDetail = {
    currentId: null,
    isLoading: false,
    currentItem: null,

    openDetailModal: function (id) {
      App.pages.creativeDetail.open(id);
    },

    open: function (id) {
      console.log(`[CreativeDetail] open called with id: ${id}`);

      if (!id || typeof id !== 'string') {
        console.error('[CreativeDetail] Invalid ID provided:', id);
        App.utils.error.handle({ message: '無効なIDが指定されました: ' + id });
        return;
      }

      if (typeof SHEET_NAMES === 'undefined') {
        console.error('[CreativeDetail] SHEET_NAMES is not defined');
        App.utils.error.handle({ message: 'システムエラー: テーブル定義が見つかりません' });
        return;
      }

      App.pages.creativeDetail.currentId = id;
      App.pages.creativeDetail.isLoading = true;
      showLoading();

      // View switching
      document.querySelectorAll('main > div').forEach(el => el.style.display = 'none');
      const view = document.getElementById('detail-creative');
      if (view) {
        view.style.display = 'flex';
        view.style.flexDirection = 'column';
      } else {
        console.error('[CreativeDetail] View element #detail-creative not found');
        return;
      }

      // Prepare promises for data loading
      const promises = [
        callGAS('getItemById', SHEET_NAMES.CREATIVES, id)
          .catch(err => {
            console.error('[CreativeDetail] Failed to load creative:', err);
            throw new Error(`制作物データの取得に失敗しました: ${err.message}`);
          })
      ];

      // Defensively load master data if missing
      if (typeof directoriesData === 'undefined' || directoriesData.length === 0) {
        promises.push(callGAS('getItems', SHEET_NAMES.DIRECTORIES).then(d => { directoriesData = d; return d; }));
      } else {
        promises.push(Promise.resolve(directoriesData));
      }

      if (typeof plansData === 'undefined' || plansData.length === 0) {
        promises.push(callGAS('getItems', SHEET_NAMES.PLANS).then(d => { plansData = d; return d; }));
      } else {
        promises.push(Promise.resolve(plansData));
      }

      if (typeof membersData === 'undefined' || membersData.length === 0) {
        promises.push(callGAS('getItems', SHEET_NAMES.MEMBERS).then(d => { membersData = d; return d; }));
      } else {
        promises.push(Promise.resolve(membersData));
      }

      if (typeof configData === 'undefined' || Object.keys(configData).length === 0) {
        promises.push(callGAS('getItems', SHEET_NAMES.CONFIG).then(d => { configData = groupConfigByType(d); return d; }));
      } else {
        promises.push(Promise.resolve(configData));
      }

      Promise.all(promises)
        .then(([creative]) => {
          console.log('[CreativeDetail] Data loaded successfully', creative);

          if (!creative) {
            console.warn('[CreativeDetail] Creative not found for id:', id);
            alert('制作物が見つかりません');
            App.utils.navigation.switchTab('creatives');
            return;
          }

          App.pages.creativeDetail.currentItem = creative;
          App.pages.creativeDetail.render(creative);
        })
        .catch(error => {
          console.error('[CreativeDetail] Fatal error during loading:', error);
          App.utils.error.handle(error);
          App.utils.navigation.switchTab('creatives');
        })
        .finally(() => {
          App.pages.creativeDetail.isLoading = false;
          hideLoading();
        });
    },

    render: function (creative) {
      console.log('[CreativeDetail] Rendering creative:', creative);
      const container = document.getElementById('detail-creative');
      if (!container) return;

      const displayIdEl = document.getElementById('display-id');
      const displayIdStr = creative.display_id ? `C${String(creative.display_id).padStart(4, '0')}` : '-'; // Handle missing display_id

      if (displayIdEl) displayIdEl.textContent = displayIdStr;

      const titleInput = document.getElementById('creative-title-input');
      if (titleInput) titleInput.value = creative.title || '';

      const statusSelect = document.getElementById('creative-status-select');
      if (statusSelect) statusSelect.innerHTML = App.pages.creativeDetail.renderEnumOptions('CREATIVE_STATUS', creative.creative_status_key);

      const typeSelect = document.getElementById('creative-type-select');
      if (typeSelect) typeSelect.innerHTML = App.pages.creativeDetail.renderEnumOptions('CREATIVE_TYPE', creative.creative_type_key);

      const prioritySelect = document.getElementById('creative-priority-select');
      if (prioritySelect) prioritySelect.innerHTML = App.pages.creativeDetail.renderEnumOptions('PRIORITY', creative.priority_key);

      const deadlineInput = document.getElementById('creative-deadline-input');
      if (deadlineInput) deadlineInput.value = formatDateTimeForInput(creative.deadline_at);

      const clientInput = document.getElementById('creative-client-display');
      if (clientInput) clientInput.value = App.pages.creativeDetail.getDirectoryFullName(creative.client_directory_id);

      const contractorInput = document.getElementById('creative-contractor-display');
      if (contractorInput) contractorInput.value = App.pages.creativeDetail.getDirectoryFullName(creative.contractor_directory_id);


      App.pages.creativeDetail.loadMembers(creative.id);
      App.pages.creativeDetail.loadNotes(creative.id);
      App.pages.creativeDetail.switchTab(null, 'documents');
    },

    goBack: function () {
      App.utils.navigation.switchTab('creatives');
    },

    switchTab: function (event, tab) {
      const contentArea = document.getElementById('creative-main-content-area');
      if (!contentArea) return;

      const creative = App.pages.creativeDetail.currentItem;
      console.log(`[CreativeDetail] Switching tab to ${tab}`);

      switch (tab) {
        case 'documents':
          contentArea.innerHTML = creative.document_gfile_id ?
            `<iframe src="https:/\/docs.google.com/document/d/${creative.document_gfile_id}/edit?rm=minimal" style="width: 100%; height: 100%; border: 0;"></iframe>` :
            '<p>ドキュメントが設定されていません</p>';
          break;
        case 'folder':
          contentArea.innerHTML = creative.gfolder_id ?
            `<iframe src="https:/\/drive.google.com/embeddedfolderview?id=${creative.gfolder_id}#list" style="width: 100%; height: 100%; border: 0;"></iframe>` :
            '<p>フォルダが設定されていません</p>';
          break;
        case 'relations':
          contentArea.innerHTML = '<h5>関連アイテム</h5><p>リレーション機能は実装予定です</p>';
          break;
        case 'tasks':
          contentArea.innerHTML = '<h5>タスク一覧</h5><p>タスク機能は実装予定です</p>';
          break;
      }

      // Tab activation logic
      const container = document.getElementById('detail-center-column-nav');
      if (container) {
        container.querySelectorAll('a').forEach(a => a.classList.remove('active'));
        if (event && event.currentTarget) {
          event.currentTarget.classList.add('active');
        }
      }
    },

    renderEnumOptions: function (enumType, selectedValue) {
      if (!enumsData || !enumsData[enumType]) {
        console.warn(`[CreativeDetail] Enum options not found for ${enumType}`);
        return '';
      }
      const options = enumsData[enumType] || [];
      return options.map(opt =>
        `<option value="${escapeHtml(opt.key)}" ${opt.key === selectedValue ? 'selected' : ''}>${escapeHtml(opt.value)}</option>`
      ).join('');
    },

    getDirectoryFullName: function (directoryId) {
      if (!directoryId || !directoriesData) return '';
      const dir = directoriesData.find(d => d.id === directoryId);
      if (!dir) return '';
      if (!dir.parent_directory_id) return dir.name || '';

      const parent = directoriesData.find(d => d.id === dir.parent_directory_id);
      if (!parent) return dir.name || '';

      // Recursive call with safety check to avoid infinite loops (basic depth check implied by data structure, but beware circular refs)
      return App.pages.creativeDetail.getDirectoryFullName(dir.parent_directory_id) + ' / ' + (dir.name || '');
    },

    selectDirectory: function (field) {
      App.modals.selectDirectories.open({
        multiSelect: false,
        preSelected: App.pages.creativeDetail.currentItem[field] ? [App.pages.creativeDetail.currentItem[field]] : [],
        callback: (selectedIds) => {
          if (selectedIds && selectedIds.length > 0) {
            console.log(`[CreativeDetail] Validating directory selection for ${field}:`, selectedIds[0]);
            App.pages.creativeDetail.updateField(field, selectedIds[0]);

            // Optimistic UI update for the input field
            const displayField = field === 'client_directory_id' ? 'creative-client-display' : 'creative-contractor-display';
            const input = document.getElementById(displayField);
            if (input) {
              input.value = App.pages.creativeDetail.getDirectoryFullName(selectedIds[0]);
            }
          }
        }
      });
    },

    addMembers: function () {
      App.modals.selectMembers.open({
        multiSelect: true,
        preSelected: [],
        callback: (selectedIds) => {
          if (selectedIds && selectedIds.length > 0) {
            selectedIds.forEach(memberId => {
              const assignmentData = {
                related_table: SHEET_NAMES.CREATIVES,
                related_id: App.pages.creativeDetail.currentId,
                member_id: memberId,
                role_key: 'MEMBER'
              };
              callGAS('createItem', 'member_assignments', assignmentData)
                .then(() => App.pages.creativeDetail.loadMembers(App.pages.creativeDetail.currentId))
                .catch(err => {
                  console.error('[CreativeDetail] Failed to add member:', err);
                  App.utils.error.handle(err);
                });
            });
          }
        }
      });
    },

    updateField: function (field, value) {
      const id = App.pages.creativeDetail.currentId;
      console.log(`[CreativeDetail] Update requested - Field: ${field}, Value: ${value}, ID: ${id}`);

      if (!id) {
        console.error('[CreativeDetail] Cannot update: No ID');
        return;
      }

      let finalValue = value;
      // Date handling
      if (field === 'deadline_at') {
        if (value) {
          try {
            const d = new Date(value);
            // Ensure valid date before conversion
            if (isNaN(d.getTime())) {
              throw new Error('Invalid date');
            }
            finalValue = d.toISOString();
          } catch (e) {
            console.warn('[CreativeDetail] Invalid date format for deadline input', value);
            // Revert UI? For now let's just not update if invalid.
            return;
          }
        } else {
          finalValue = null; // Handle clear
        }
      }

      const oldItem = { ...App.pages.creativeDetail.currentItem };
      App.pages.creativeDetail.currentItem[field] = finalValue;

      // Optimistic update
      updateLocalData(SHEET_NAMES.CREATIVES, id, { [field]: finalValue });

      callGAS('updateItem', SHEET_NAMES.CREATIVES, id, { [field]: finalValue })
        .then(success => {
          if (!success) {
            console.error('[CreativeDetail] Update returned failure (false)');
            alert('更新に失敗しました');
            // Rollback
            App.pages.creativeDetail.currentItem[field] = oldItem[field];
            rollbackLocalData(SHEET_NAMES.CREATIVES, id, oldItem);
            App.pages.creativeDetail.render(App.pages.creativeDetail.currentItem);
          } else {
            console.log('[CreativeDetail] Update successful');
          }
        })
        .catch(error => {
          console.error('[CreativeDetail] Update exception:', error);
          App.utils.error.handle(error);
          // Rollback
          App.pages.creativeDetail.currentItem[field] = oldItem[field];
          rollbackLocalData(SHEET_NAMES.CREATIVES, id, oldItem);
          App.pages.creativeDetail.render(App.pages.creativeDetail.currentItem);
        });
    },

    loadMembers: function (creativeId) {
      callGAS('getItems', 'member_assignments')
        .then(assignments => {
          const creativeAssignments = assignments.filter(a => a.related_table === SHEET_NAMES.CREATIVES && a.related_id === creativeId);
          const container = document.getElementById('creative-members-container');
          if (!container) return;

          if (creativeAssignments.length === 0) {
            container.innerHTML = '<p class="small-text">担当者が割り当てられていません</p>';
            return;
          }

          container.innerHTML = creativeAssignments.map(assignment => {
            const member = membersData.find(m => m.id === assignment.member_id);
            if (!member) return '';
            const iconUrl = member.icon_gfile_id ? `https:/\/drive.google.com/thumbnail?id=${member.icon_gfile_id}&sz=w32` : '';
            return `
              <div class="chip">
                ${iconUrl ? `<img src="${escapeHtml(iconUrl)}" alt="">` : ''}
                <span>${escapeHtml(member.nickname || member.email || '不明')}</span>
                <i onclick="App.pages.creativeDetail.removeMember('${assignment.id}')">close</i>
              </div>
            `;
          }).join('');
        })
        .catch(err => {
          console.error('[CreativeDetail] Failed to load members:', err);
          // Non-critical, just log
        });
    },

    loadNotes: function (creativeId) {
      callGAS('getItems', 'notes')
        .then(allNotes => {
          if (!allNotes) return;
          const notes = allNotes.filter(n => n.related_table === SHEET_NAMES.CREATIVES && n.related_id === creativeId && !n.is_deleted);
          const container = document.getElementById('creative-notes-list');
          if (!container) return;

          if (notes.length === 0) {
            container.innerHTML = '<p class="small-text">コメントはありません</p>';
            return;
          }

          notes.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

          container.innerHTML = notes.map(note => {
            const author = membersData.find(m => m.email === note.created_by);
            const authorName = author ? (author.nickname || author.email) : '不明';
            const iconUrl = author && author.icon_gfile_id ? `https:/\/drive.google.com/thumbnail?id=${author.icon_gfile_id}&sz=w32` : '';
            return `
              <div class="row bottom-margin top-align tiny-space">
                ${iconUrl ? `<img src="${escapeHtml(iconUrl)}" class="avatar small circle" alt="">` : ''}
                <div class="max">
                  <div class="row tiny-space">
                    <strong class="small-text">${escapeHtml(authorName)}</strong>
                    <span class="small-text">${formatDateTimeForDisplay(note.created_at)}</span>
                  </div>
                  <div class="small-text no-line" style="white-space: pre-wrap; word-break: break-word;">${escapeHtml(note.content)}</div>
                </div>
              </div>
            `;
          }).join('');
        })
        .catch(err => {
          console.error('[CreativeDetail] Failed to load notes:', err);
        });
    },

    postNote: function () {
      const input = document.getElementById('creative-note-input');
      if (!input || !input.value.trim()) return;
      const content = input.value.trim();
      const creativeId = App.pages.creativeDetail.currentId;

      // Optimistic append
      const container = document.getElementById('creative-notes-list');
      if (container) {
        // Clear "no comments" message if it exists
        if (container.querySelector('p.small-text')?.textContent === 'コメントはありません') {
          container.innerHTML = '';
        }

        const tempHtml = `
          <div class="row no-space bottom-margin" style="opacity: 0.6;">
            <div class="max">
              <div class="row no-space">
                <strong class="small-text">送信中...</strong>
              </div>
              <div class="small-text" style="white-space: pre-wrap; word-break: break-word;">${escapeHtml(content)}</div>
            </div>
          </div>
        `;
        container.innerHTML += tempHtml;
        container.scrollTop = container.scrollHeight;
      }

      input.value = '';

      const noteData = { content: content, related_table: SHEET_NAMES.CREATIVES, related_id: creativeId };
      callGAS('createItem', 'notes', noteData)
        .then(() => App.pages.creativeDetail.loadNotes(creativeId))
        .catch(error => {
          App.utils.error.handle(error);
          App.pages.creativeDetail.loadNotes(creativeId); // Reload to clear optimistic/error state
        });
    },

    removeMember: function (assignmentId) {
      if (!confirm('この担当者を削除しますか？')) return;
      callGAS('deleteItem', 'member_assignments', { id: assignmentId })
        .then(() => App.pages.creativeDetail.loadMembers(App.pages.creativeDetail.currentId))
        .catch(App.utils.error.handle);
    }
  };

  // Maintain alias for other components if they use App.overlays.creativeDetail
  App.overlays.creativeDetail = App.pages.creativeDetail;
</script>
