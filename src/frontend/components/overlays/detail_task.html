<!-- 詳細画面: タスク -->
<div id="detail-task" class="page-content detail-view" style="display: none;">
    <nav class="padding row no-space align-center">
        <button class="circle transparent" onclick="App.utils.navigation.switchTab('tasks')">
            <i>arrow_back</i>
        </button>
        <h5 class="bold max">タスク詳細</h5>
    </nav>
    <div id="task-detail-content" class="padding">
        <!-- Dynamic Content -->
    </div>
</div>

<script>
    App.pages.taskDetail = {
        currentId: null,
        isLoading: false,

        openDetailModal: function (id) {
            this.open(id);
        },

        open: function (id) {
            if (!id || typeof id !== 'string') {
                console.warn('App.pages.taskDetail.open called with invalid ID:', id);
                return;
            }
            if (this.isLoading) return;

            console.log('App.pages.taskDetail.open called with:', id);
            this.currentId = id;
            this.isLoading = true;
            showLoading();

            // 画面切り替え
            document.querySelectorAll('main > div').forEach(el => el.style.display = 'none');
            const view = document.getElementById('detail-task');
            if (view) view.style.display = 'block';

            callGAS('getItemById', SHEET_NAMES.TASKS, id)
                .then(task => {
                    if (!task) {
                        alert('タスクが見つかりません');
                        App.utils.navigation.switchTab('tasks');
                        this.isLoading = false;
                        hideLoading();
                        return;
                    }

                    this.render(task);
                    this.isLoading = false;
                    hideLoading();
                })
                .catch(error => {
                    this.isLoading = false;
                    App.utils.error.handle(error);
                    App.utils.navigation.switchTab('tasks');
                });
        },

        render: function (task) {
            const container = document.getElementById('task-detail-content');
            if (!container) return;

            const statusLabel = getConfigLabel(task.task_status_value, 'TASK_STATUS');
            const displayId = task.display_id || task.id;

            container.innerHTML = `
                <div class="row">
                    <div class="col s12">
                        <div class="chip small">${escapeHtml(statusLabel)}</div>
                        <h4 class="bold no-margin">${escapeHtml(displayId)} ${escapeHtml(task.title)}</h4>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="grid">
                     <div class="s12 m6">
                        <div class="field label border">
                            <input type="text" value="${escapeHtml(task.title || '')}" readonly>
                            <label>タイトル</label>
                        </div>
                        <div class="field label border">
                            <input type="text" value="${escapeHtml(formatDateTimeForDisplay(task.starts_at))}" readonly>
                            <label>開始日時</label>
                        </div>
                        <div class="field label border">
                             <input type="text" value="${escapeHtml(formatDateTimeForDisplay(task.ends_at))}" readonly>
                             <label>終了日時</label>
                        </div>
                     </div>
                     <div class="s12 m6">
                        <div class="field label border">
                            <textarea readonly>${escapeHtml(task.description || '')}</textarea>
                            <label>詳細</label>
                        </div>
                     </div>
                </div>
            `;
        }
    };

    // Alias
    App.overlays.taskDetail = App.pages.taskDetail;
</script>
