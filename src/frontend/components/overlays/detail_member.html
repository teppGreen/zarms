<dialog id="modal-member-detail" class="modal large">
    <h5 class="bold">メンバー詳細</h5>
    <div id="member-detail-content"></div>
    <nav class="right-align">
        <button class="border" onclick="closeModal('modal-member-detail')">閉じる</button>
    </nav>
</dialog>

<script>
    (function () {
        window.App.modals.detail_member = window.App.modals.detail_member || {};

        window.App.modals.detail_member.open = function (memberEmail) {
            // JavaScript関数呼び出しを記録
            if (typeof recordJSInvocation === 'function') {
                recordJSInvocation('window.App.modals.detail_member.open', memberEmail);
            }

            showLoading();
            callGAS('getItemById', SHEET_NAMES.MEMBERS, memberEmail).then(member => {
                if (!member) {
                    alert('メンバーが見つかりません');
                    hideLoading();
                    return;
                }

                // 担当しているCreativesを取得
                const assignedCreatives = (creativesData || []).filter(creative => {
                    return creative.assignees && creative.assignees.some(a => a.member_email === memberEmail);
                });

                const content = document.getElementById('member-detail-content');
                content.innerHTML = `
        <div style="margin-bottom: 24px;">
          <img src="${escapeHtml(member.member_icon || 'https://via.placeholder.com/64')}" class="avatar" style="width: 64px; height: 64px; margin-bottom: 16px;" alt="">
          <h3 style="margin: 0 0 8px 0;">${escapeHtml(member.member_name)}</h3>
          <p style="margin: 0 0 4px 0; color: #6b7280;"><strong>メール:</strong> ${escapeHtml(member.member_email)}</p>
          <p style="margin: 0 0 4px 0; color: #6b7280;"><strong>チーム:</strong> ${escapeHtml(getConfigLabel(member.member_team_key, 'TEAM'))}</p>
          <p style="margin: 0 0 4px 0; color: #6b7280;"><strong>権限:</strong> ${escapeHtml(getConfigLabel(member.role_key, 'ROLE'))}</p>
          ${member.slack_member_id ? `<p style="margin: 0 0 4px 0; color: #6b7280;"><strong>Slack ID:</strong> ${escapeHtml(member.slack_member_id)}</p>` : ''}
        </div>
        <div class="detail-section">
          <h3>備考</h3>
          <div class="rich-text-editor-wrapper">
            <div class="rich-text-toolbar" data-editor="member-notes-editor">
              <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="h1" title="見出し1">H1</button>
              <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="h2" title="見出し2">H2</button>
              <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="h3" title="見出し3">H3</button>
              <span class="toolbar-separator"></span>
              <button type="button" class="toolbar-btn" data-command="bold" title="太字"><b>B</b></button>
              <button type="button" class="toolbar-btn" data-command="italic" title="斜体"><i>I</i></button>
              <button type="button" class="toolbar-btn" data-command="strikeThrough" title="打ち消し線"><s>S</s></button>
              <button type="button" class="toolbar-btn" data-command="underline" title="下線"><u>U</u></button>
              <span class="toolbar-separator"></span>
              <button type="button" class="toolbar-btn color-btn" data-color="#000000" title="黒" style="background: #000000;"></button>
              <button type="button" class="toolbar-btn color-btn" data-color="#FF0000" title="赤" style="background: #FF0000;"></button>
              <button type="button" class="toolbar-btn color-btn" data-color="#0000FF" title="青" style="background: #0000FF;"></button>
              <button type="button" class="toolbar-btn color-btn" data-color="#008000" title="緑" style="background: #008000;"></button>
            </div>
            <div id="member-notes-editor" class="rich-text-editor" contenteditable="true" data-field="member_notes" data-member-email="${memberEmail}"></div>
          </div>
        </div>
        <div class="detail-section">
          <h3>担当している制作物</h3>
          ${assignedCreatives.length === 0 ? '<p style="color: #6b7280;">担当している制作物はありません</p>' : `
            <table class="table-full" style="margin-top: 12px;">
              <thead>
                <tr>
                  <th>案件</th>
                  <th>制作物</th>
                  <th>ステータス</th>
                </tr>
              </thead>
              <tbody>
                ${assignedCreatives.map(creative => `
                  <tr>
                    <td>${escapeHtml(creative.project_title)}</td>
                    <td><button class="btn-link" onclick="App.overlays.creativeDetail.open('${creative.id}'); closeModal('modal-member-detail');">${escapeHtml(creative.title)}</button></td>
                    <td>${escapeHtml(getConfigLabel(creative.creative_status_key, 'CREATIVE_STATUS'))}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `}
        </div>
      `;

                // リッチテキストエディタにデータを設定
                const notesEditor = document.getElementById('member-notes-editor');
                if (notesEditor) {
                    notesEditor.innerHTML = member.member_notes || '';
                    // リッチテキストエディタの初期化
                    initRichTextEditors();

                    // エディタの変更を監視して自動保存
                    let saveTimeout = null;
                    notesEditor.addEventListener('input', () => {
                        clearTimeout(saveTimeout);
                        saveTimeout = setTimeout(() => {
                            saveMemberNotes(memberEmail, notesEditor.innerHTML);
                        }, 2000);
                    });
                }

                hideLoading();
                openModal('modal-member-detail');
            }).catch(handleError);
        };

        function saveMemberNotes(memberEmail, content) {
            callGAS('updateItem', SHEET_NAMES.MEMBERS, memberEmail, { member_notes: content })
                .then(() => {
                    // 保存成功
                })
                .catch(error => {
                    console.error('メンバー備考保存エラー:', error);
                });
        }
    })();
</script>
