<!-- 詳細画面: 企画 -->
<div id="detail-plan" class="page-content detail-view" style="display: none;">
    <nav class="padding row no-space align-center">
        <button class="circle transparent" onclick="App.utils.navigation.switchTab('plans')">
            <i>arrow_back</i>
        </button>
        <h5 class="bold max">企画詳細</h5>
    </nav>
    <div id="plan-detail-content" class="padding">
        <!-- Dynamic Content -->
    </div>
</div>

<script>
    App.pages.planDetail = {
        currentId: null,
        isLoading: false,

        openDetailModal: function (id) {
            this.open(id);
        },

        open: function (id) {
            if (!id || typeof id !== 'string') {
                console.warn('App.pages.planDetail.open called with invalid ID:', id);
                return;
            }
            if (this.isLoading) return;

            console.log('App.pages.planDetail.open called with:', id);
            this.currentId = id;
            this.isLoading = true;
            showLoading();

            // 画面切り替え
            document.querySelectorAll('main > div').forEach(el => el.style.display = 'none');
            const view = document.getElementById('detail-plan');
            if (view) view.style.display = 'block';

            callGAS('getItemById', SHEET_NAMES.PLANS, id)
                .then(plan => {
                    if (!plan) {
                        alert('企画が見つかりません');
                        App.utils.navigation.switchTab('plans');
                        this.isLoading = false;
                        hideLoading();
                        return;
                    }

                    this.render(plan);
                    this.isLoading = false;
                    hideLoading();
                })
                .catch(error => {
                    this.isLoading = false;
                    App.utils.error.handle(error);
                    App.utils.navigation.switchTab('plans');
                });
        },

        render: function (plan) {
            const container = document.getElementById('plan-detail-content');
            if (!container) return;

            const statusLabel = getConfigLabel(plan.plan_status_key, 'PLAN_STATUS');
            const displayId = plan.display_id || plan.id;

            container.innerHTML = `
                <div class="row">
                    <div class="col s12">
                        <div class="chip small">${escapeHtml(statusLabel)}</div>
                        <h4 class="bold no-margin">${escapeHtml(displayId)} ${escapeHtml(plan.title)}</h4>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="row">
                     <div class="col s12">
                        <label class="active">概要</label>
                        <div class="markdown-body">${escapeHtml(plan.description || '概要なし').replace(/\n/g, '<br>')}</div>
                     </div>
                </div>
            `;
        }
    };

    App.overlays.planDetail = App.pages.planDetail;
</script>
