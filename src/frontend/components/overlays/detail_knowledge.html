<!-- 詳細画面: ナレッジ -->
<div id="detail-knowledge" class="page-content detail-view" style="display: none;">
  <nav class="padding row no-space align-center">
    <button class="circle transparent" onclick="App.utils.navigation.switchTab('knowledges')">
      <i>arrow_back</i>
    </button>
    <h5 class="bold max">ナレッジ詳細</h5>
  </nav>
  <div id="knowledge-detail-content" class="padding"></div>
</div>

<script>
  (function () {
    App.pages.knowledgeDetail = {
      openDetailModal: function (id) {
        this.open(id);
      },
      open: function (knowledgeId) {
        showLoading();
        // 画面切り替え
        document.querySelectorAll('main > div').forEach(el => el.style.display = 'none');
        const view = document.getElementById('detail-knowledge');
        if (view) view.style.display = 'block';

        callGAS('getItems', SHEET_NAMES.KNOWLEDGES).then(knowledgeList => {
          const knowledge = knowledgeList.find(k => k.knowledge_id === knowledgeId);
          if (!knowledge) {
            alert('ナレッジが見つかりません');
            App.utils.navigation.switchTab('knowledges');
            hideLoading();
            return;
          }

          const container = document.getElementById('knowledge-detail-content');
          container.innerHTML = `
        <div style="margin-bottom: 24px;">
          <div style="margin-bottom: 12px;">
            <span class="badge" style="background: #fef3c7; color: #92400e;">${escapeHtml(getConfigLabel(knowledge.knowledge_type_key, 'KNOWLEDGE_TYPE'))}</span>
          </div>
          <p style="margin: 0; color: #6b7280; font-size: 0.875rem;">${formatDate(knowledge.created_at)} - ${escapeHtml(knowledge.creator_name)}</p>
        </div>
        <div style="margin-bottom: 24px;">
          <h4 style="margin: 0 0 12px 0; font-size: 1rem; font-weight: 600;">内容</h4>
          <div style="line-height: 1.6; color: var(--md-sys-color-on-surface);">${knowledge.knowledge_content || ''}</div>
        </div>
      `;
          hideLoading();
        }).catch(error => {
          App.utils.error.handle(error);
          App.utils.navigation.switchTab('knowledges');
        });
      }
    };
    // Compatibility
    App.modals.detail_knowledge = App.pages.knowledgeDetail;
  })();
</script>
