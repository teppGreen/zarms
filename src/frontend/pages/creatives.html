<div id="tab-creatives" style="display: none;">
    <article class="no-padding">
        <div class="small-height scroll">
            <table id="creatives-table" class="">
                <thead class="fixed">
                    <!-- ヘッダーは App.utils.tables.render() で動的生成 -->
                </thead>
                <tbody>
                    <!-- ボディは App.utils.tables.render() で動的生成 -->
                </tbody>
            </table>
        </div>
    </article>
</div>

<script>
    // Namespace initialization
    App.pages.creatives = {
        loadData: function () {
            showLoading();

            // Phase 1: メインテーブル（creatives）を取得・即時描画
            callGAS('getItems', SHEET_NAMES.CREATIVES)
                .then(creatives => {
                    App.state.data.creatives = creatives;

                    // 外部キー情報なしでまず描画（IDのみ表示、ユーザーへの応答性を優先）
                    App.utils.tables.render(
                        SHEET_NAMES.CREATIVES,
                        App.utils.tables.applyFiltersAndSort(SHEET_NAMES.CREATIVES, App.state.data.creatives),
                        creativesTableHeaders
                    );

                    // Phase 2: 外部テーブルを順次取得
                    return App.pages.creatives.loadRelatedData();
                })
                .then(() => {
                    // 外部キー情報を含めて再描画
                    App.utils.tables.render(
                        SHEET_NAMES.CREATIVES,
                        App.utils.tables.applyFiltersAndSort(SHEET_NAMES.CREATIVES, App.state.data.creatives),
                        creativesTableHeaders
                    );
                    hideLoading();
                })
                .catch(App.utils.error.handle);
        },

        /**
         * 関連データを順次取得
         */
        loadRelatedData: function () {
            const loadPromises = [];

            // plans がまだ読み込まれていない場合のみ取得
            if (!App.state.data.plans || App.state.data.plans.length === 0) {
                loadPromises.push(
                    callGAS('getItems', SHEET_NAMES.PLANS).then(data => { App.state.data.plans = data || []; })
                );
            }

            // members がまだ読み込まれていない場合のみ取得
            if (!App.state.data.members || App.state.data.members.length === 0) {
                loadPromises.push(
                    callGAS('getItems', SHEET_NAMES.MEMBERS).then(data => { App.state.data.members = data || []; })
                );
            }

            // directories がまだ読み込まれていない場合のみ取得
            if (!App.state.data.directories || App.state.data.directories.length === 0) {
                loadPromises.push(
                    callGAS('getItems', SHEET_NAMES.DIRECTORIES).then(data => { App.state.data.directories = data || []; })
                );
            }

            return Promise.all(loadPromises);
        }
    };
</script>
