<div id="tab-creatives" class="tab-content" style="display: none;">
    <article class="no-padding">
        <div class="scroll">
            <table id="creatives-table" class="stripes">
                <thead>
                    <!-- ヘッダーは App.utils.tables.render() で動的生成 -->
                </thead>
                <tbody>
                    <!-- ボディは App.utils.tables.render() で動的生成 -->
                </tbody>
            </table>
        </div>
    </article>
</div>

<script>
    // Namespace initialization
    App.pages.creatives = {};

    App.pages.creatives.loadData = function () {
        const promises = [callGAS('getItems', SHEET_NAMES.CREATIVES)];
        promises.push(callGAS('getItems', SHEET_NAMES.PLANS));
        promises.push(callGAS('getItems', SHEET_NAMES.MEMBERS));
        promises.push(callGAS('getItems', SHEET_NAMES.DIRECTORIES));

        Promise.all(promises).then(results => {
            creativesData = results[0];
            plansData = results[1] || [];
            membersData = results[2] || [];
            directoriesData = results[3] || [];

            // ReadOnlyテーブルをレンダリング（行クリックで詳細モーダルを開く）
            App.utils.tables.render(SHEET_NAMES.CREATIVES, App.utils.tables.applyFiltersAndSort(SHEET_NAMES.CREATIVES, creativesData), creativesTableHeaders);
            hideLoading();
        }).catch(App.error.handle);
    };
</script>
