<div id="tab-members" class="tab-content" style="display: none;">
    <article class="no-padding">
        <div class="scroll">
            <table id="members-table" class="stripes">
                <thead>
                    <tr>
                        <th></th>
                        <th>名前</th>
                        <th>メール</th>
                        <th>チーム</th>
                        <th>権限</th>
                        <th>担当制作物数</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="members-table-body">
                </tbody>
            </table>
        </div>
    </article>
</div>

<script>
    // Namespace initialization
    App.pages.members = {};

    App.pages.members.loadData = function () {
        callGAS('getAllData', SHEET_NAMES.MEMBERS).then(data => { membersData = data; renderTable(SHEET_NAMES.MEMBERS, applyFiltersAndSort(SHEET_NAMES.MEMBERS, membersData), membersTableHeaders); hideLoading(); }).catch(handleError);
    };
</script>
