<!-- membersテーブルを表示するページ -->

<div id="tab-members" class="tab-content" style="display: none;">
    <article class="no-padding">
        <div class="scroll">
            <table id="members-table" class="stripes">
                <thead>
                    <!-- ヘッダーは App.renderTables.render() で動的生成 -->
                </thead>
                <tbody>
                    <!-- ボディは App.renderTables.render() で動的生成 -->
                </tbody>
            </table>
        </div>
    </article>
</div>

<script>
    // Namespace initialization
    App.pages.members = {};

    App.pages.members.loadData = function () {
        callGAS('getItems', SHEET_NAMES.MEMBERS)
            .then(data => {
                membersData = data;

                // ReadOnlyテーブルをレンダリング（行クリックで詳細モーダルを開く）
                App.renderTables.render(SHEET_NAMES.MEMBERS, App.renderTables.applyFiltersAndSort(SHEET_NAMES.MEMBERS, membersData), membersTableHeaders);
                hideLoading();
            })
            .catch(App.popups.error.handle);
    };
</script>
