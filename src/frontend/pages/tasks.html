<div id="tab-tasks" class="tab-content" style="display: none;">
    <article class="no-padding">
        <div class="scroll">
            <table id="tasks-table" class="stripes">
                <thead>
                    <!-- ヘッダーは App.renderTables.render() で動的生成 -->
                </thead>
                <tbody>
                    <!-- ボディは App.renderTables.render() で動的生成 -->
                </tbody>
            </table>
        </div>
    </article>
</div>

<script>
    // Namespace initialization
    App.pages.tasks = {};

    App.pages.tasks.loadData = function () {
        const promises = [callGAS('getItems', SHEET_NAMES.TASKS)];
        promises.push(callGAS('getItems', SHEET_NAMES.CREATIVES));
        promises.push(callGAS('getItems', SHEET_NAMES.MEMBERS));

        Promise.all(promises).then(results => {
            tasksData = results[0];
            creativesData = results[1] || [];
            membersData = results[2] || [];

            // ReadOnlyテーブルをレンダリング（行クリックで詳細モーダルを開く）
            App.renderTables.render(SHEET_NAMES.TASKS, App.renderTables.applyFiltersAndSort(SHEET_NAMES.TASKS, tasksData), tasksTableHeaders);
            hideLoading();
        }).catch(App.popups.error.handle);
    };
</script>
