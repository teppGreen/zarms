<div id="tab-tasks" class="tab-content" style="display: none;">

    <div class="card">
        <div class="table-container">
            <table id="tasks-table" class="table-full">
                <thead>
                    <tr>
                        <th>タスクID</th>
                        <th>案件タイトル</th>
                        <th>制作タイトル</th>
                        <th>タスクタイトル</th>
                        <th>ステータス</th>
                        <th>優先度</th>
                        <th>担当者</th>
                        <th>予定終了日時</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tasks-table-body">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Namespace initialization
    App.pages.tasks = {};

    App.pages.tasks.loadData = function () {
        const promises = [callGAS('getItems', SHEET_NAMES.TASKS)];
        promises.push(callGAS('getItems', SHEET_NAMES.CREATIVES));
        promises.push(callGAS('getItems', SHEET_NAMES.MEMBERS));

        Promise.all(promises).then(results => {
            tasksData = results[0];
            creativesData = results[1] || [];
            membersData = results[2] || [];
            renderTable(SHEET_NAMES.TASKS, applyFiltersAndSort(SHEET_NAMES.TASKS, tasksData), tasksTableHeaders);
            hideLoading();
        }).catch(handleError);
    };
</script>
