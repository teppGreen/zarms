<!-- plansテーブルを表示するページ -->

<div id="tab-plans" style="display: none;">
    <article class="no-padding">
        <div class="scroll">
            <table id="plans-table" class="stripes">
                <thead>
                    <!-- ヘッダーは App.utils.tables.render() で動的生成 -->
                </thead>
                <tbody>
                    <!-- ボディは App.utils.tables.render() で動的生成 -->
                </tbody>
            </table>
        </div>
    </article>
</div>

<script>
    // Namespace initialization
    App.pages.plans = {};

    App.pages.plans.loadData = function () {
        showLoading();

        // Phase 1: メインテーブル（plans）を取得・即時描画
        callGAS('getItems', SHEET_NAMES.PLANS)
            .then(plans => {
                App.state.data.plans = plans;

                // 外部キー情報なしでまず描画
                App.utils.tables.render(
                    SHEET_NAMES.PLANS,
                    App.utils.tables.applyFiltersAndSort(SHEET_NAMES.PLANS, App.state.data.plans),
                    plansTableHeaders
                );

                // Phase 2: 外部テーブルを順次取得
                return App.pages.plans.loadRelatedData();
            })
            .then(() => {
                // 外部キー情報を含めて再描画
                App.utils.tables.render(
                    SHEET_NAMES.PLANS,
                    App.utils.tables.applyFiltersAndSort(SHEET_NAMES.PLANS, App.state.data.plans),
                    plansTableHeaders
                );
                hideLoading();
            })
            .catch(App.utils.error.handle);
    };

    /**
     * 関連データを順次取得
     */
    App.pages.plans.loadRelatedData = function () {
        const loadPromises = [];

        // members がまだ読み込まれていない場合のみ取得
        if (!App.state.data.members || App.state.data.members.length === 0) {
            loadPromises.push(
                callGAS('getItems', SHEET_NAMES.MEMBERS).then(data => { App.state.data.members = data || []; })
            );
        }

        return Promise.all(loadPromises);
    };
</script>
