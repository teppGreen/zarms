<!-- plansテーブルとmerchandisesテーブルを表示するページ -->

<div id="tab-plans" class="tab-content" style="display: none;">
    <article class="no-padding">
        <div class="scroll">
            <table id="plans-table" class="stripes">
                <thead>
                    <tr>
                        <th>企画タイトル</th>
                        <th>作成日</th>
                        <th>作成者</th>
                        <th>関連制作物</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="plans-table-body">
                </tbody>
            </table>
        </div>
    </article>
</div>

<script>
    // Namespace initialization
    App.pages.plans = {};

    App.pages.plans.loadData = function () {
        callGAS('getAllData', SHEET_NAMES.PLANS).then(data => { plansData = data; renderTable(SHEET_NAMES.PLANS, applyFiltersAndSort(SHEET_NAMES.PLANS, plansData), plansTableHeaders); hideLoading(); }).catch(handleError);
    };
</script>
