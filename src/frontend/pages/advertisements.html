<!-- advertisementsテーブルを表示するページ -->

<div id="tab-advertisements" style="display: none;">
    <article class="no-padding">
        <div class="small-height scroll">
            <table id="advertisements-table" class="border">
                <thead class="fixed">
                    <!-- ヘッダーは App.utils.tables.render() で動的生成 -->
                </thead>
                <tbody>
                    <!-- ボディは App.utils.tables.render() で動的生成 -->
                </tbody>
            </table>
        </div>
    </article>
</div>

<script>
    // Namespace initialization
    App.pages.advertisements = {
        loadData: function () {
            const promises = [callGAS('getItems', SHEET_NAMES.ADVERTISEMENTS)];

            // 必要に応じて関連データも取得
            if (!App.state.data.plans || App.state.data.plans.length === 0) {
                promises.push(callGAS('getItems', SHEET_NAMES.PLANS));
            } else {
                promises.push(Promise.resolve(null));
            }

            Promise.all(promises).then(results => {
                App.state.data.advertisements = results[0];
                if (results[1]) App.state.data.plans = results[1];

                // ReadOnlyテーブルをレンダリング
                App.utils.tables.render(SHEET_NAMES.ADVERTISEMENTS, App.utils.tables.applyFiltersAndSort(SHEET_NAMES.ADVERTISEMENTS, App.state.data.advertisements), advertisementsTableHeaders);
                hideLoading();
            }).catch(App.utils.error.handle);
        }
    };
</script>
