<!-- advertisementsテーブルを表示するページ -->

<div id="tab-advertisements" class="tab-content" style="display: none;">
    <article class="no-padding">
        <div class="scroll">
            <table id="advertisements-table" class="stripes">
                <thead>
                    <!-- ヘッダーは App.renderTables.render() で動的生成 -->
                </thead>
                <tbody>
                    <!-- ボディは App.renderTables.render() で動的生成 -->
                </tbody>
            </table>
        </div>
    </article>
</div>

<script>
    // Namespace initialization
    App.pages.advertisements = {};

    App.pages.advertisements.loadData = function () {
        const promises = [callGAS('getItems', SHEET_NAMES.ADVERTISEMENTS)];

        // 必要に応じて関連データも取得
        if (!plansData || plansData.length === 0) {
            promises.push(callGAS('getItems', SHEET_NAMES.PLANS));
        } else {
            promises.push(Promise.resolve(null));
        }

        Promise.all(promises).then(results => {
            advertisementsData = results[0];
            if (results[1]) plansData = results[1];

            // ReadOnlyテーブルをレンダリング
            App.renderTables.render(SHEET_NAMES.ADVERTISEMENTS, App.renderTables.applyFiltersAndSort(SHEET_NAMES.ADVERTISEMENTS, advertisementsData), advertisementsTableHeaders);
            hideLoading();
        }).catch(App.popups.error.handle);
    };
</script>
