<div id="tab-home" class="tab-content">
    <!-- ヘッダー（挨拶）-->
    <article>
        <div class="row">
            <div class="max">
                <h4 id="home-greeting">こんにちは</h4>
                <p>今日も良い一日を！</p>
            </div>
        </div>
    </article>

    <!-- 4カラムレイアウト -->
    <div class="grid">
        <!-- Column 1: 新規依頼 (s12 m6 l3) -->
        <div class="s12 m6 l3">
            <h6>新規依頼</h6>
            <div id="home-new-requests-container">
                <!-- 動的に生成 -->
            </div>
        </div>

        <!-- Column 2: タスク (s12 m6 l3) -->
        <div class="s12 m6 l3">
            <h6>マイタスク</h6>
            <div id="home-tasks-container">
                <!-- 動的に生成 -->
            </div>
        </div>

        <!-- Column 3: リレーション (s12 m6 l3) -->
        <div class="s12 m6 l3">
            <div class="row no-space align-center">
                <h6 class="max">リレーション</h6>
                <div class="field suffix border round small">
                    <select id="relation-type-select" onchange="App.pages.home.loadRelations()">
                        <option value="creatives">制作物</option>
                        <option value="advertisements">広告</option>
                        <option value="plans">企画</option>
                    </select>
                </div>
            </div>
            <div id="home-relations-container">
                <!-- 動的に生成 -->
            </div>
        </div>

        <!-- Column 4: Reserved (s12 m6 l3) -->
        <div class="s12 m6 l3">
            <h6>その他</h6>
            <div id="home-reserved-container">
                <!-- 将来の拡張用 -->
                <article class="transparent">
                    <i>info</i>
                    <p class="small-text">今後の機能拡張用スペース</p>
                </article>
            </div>
        </div>
    </div>
</div>

<script>
    // Namespace initialization
    App.pages.home = {};

    App.pages.home.loadData = function () {
        const promises = [callGAS('getItems', SHEET_NAMES.CREATIVES)];
        promises.push(callGAS('getItems', SHEET_NAMES.TASKS));

        if (!membersData || membersData.length === 0) {
            promises.push(callGAS('getItems', SHEET_NAMES.MEMBERS));
        } else {
            promises.push(Promise.resolve(null));
        }

        if (!plansData || plansData.length === 0) {
            promises.push(callGAS('getItems', SHEET_NAMES.PLANS));
        } else {
            promises.push(Promise.resolve(null));
        }

        Promise.all(promises).then(([creatives, tasks, members, plans]) => {
            if (members) membersData = members;
            if (plans) plansData = plans;
            creativesData = creatives;
            tasksData = tasks;

            // 挨拶を更新
            const greetingEl = document.getElementById('home-greeting');
            if (greetingEl) {
                const hour = new Date().getHours();
                let greeting = 'こんにちは';
                if (hour < 12) greeting = 'おはようございます';
                else if (hour >= 18) greeting = 'こんばんは';

                greetingEl.textContent = greeting;
            }

            // Column 1: 新規依頼（未着手のcreatives, forms, questions）
            App.pages.home.renderNewRequests(creatives);

            // Column 2: マイタスク（自分が担当で未完了）
            App.pages.home.renderMyTasks(tasks);

            // Column 3: リレーション（初期表示は制作物）
            App.pages.home.loadRelations();

            hideLoading();
        }).catch(App.utils.error.handleError);
    };

    /**
     * Column 1: 新規依頼
     * ステータスが未着手（creative_status_key === 'TODO'）の制作物を表示
     */
    App.pages.home.renderNewRequests = function (creatives) {
        const container = document.getElementById('home-new-requests-container');
        if (!container) return;

        const newRequests = creatives.filter(c =>
            c.creative_status_key === 'TODO' ||
            c.creative_status_key === 'APPROVED'
        ).slice(0, 10); // 最新10件

        if (newRequests.length === 0) {
            container.innerHTML = '<article class="transparent"><i>info</i><p>新規依頼はありません</p></article>';
            return;
        }

        container.innerHTML = newRequests.map(creative => {
            const statusLabel = getConfigLabel(creative.creative_status_key, 'CREATIVE_STATUS');
            const priorityLabel = getConfigLabel(creative.priority_key, 'PRIORITY');

            return `
                <article class="no-padding small-padding border" style="cursor: pointer; margin-bottom: 8px;" onclick="App.overlays.creativeDetail.open('${creative.id}')">
                    <div class="small-text"><strong>${escapeHtml(creative.display_id || creative.id)}</strong></div>
                    <div class="small-text">${escapeHtml(creative.title || '')}</div>
                    <div class="row no-space" style="margin-top: 4px;">
                        <span class="chip small">${escapeHtml(statusLabel)}</span>
                        ${priorityLabel ? `<span class="chip small">${escapeHtml(priorityLabel)}</span>` : ''}
                    </div>
                    ${creative.deadline_at ? `<div class="small-text" style="margin-top: 4px;">納期: ${formatDate(creative.deadline_at)}</div>` : ''}
                </article>
            `;
        }).join('');
    };

    /**
     * Column 2: マイタスク
     * 自分が担当者で、ステータスが未完了（task_status_key !== 'DONE'）のタスクを表示
     */
    App.pages.home.renderMyTasks = function (tasks) {
        const container = document.getElementById('home-tasks-container');
        if (!container) return;

        // 現在のユーザーを取得（仮）
        const currentUserEmail = templateVariables?.email;
        const currentUser = membersData.find(m => m.email === currentUserEmail);

        const myTasks = tasks.filter(t =>
            t.assign_to === currentUser?.id &&
            t.task_status_key !== 'DONE'
        ).sort((a, b) => {
            // ends_at昇順でソート
            const aDate = a.ends_at ? new Date(a.ends_at) : new Date('9999-12-31');
            const bDate = b.ends_at ? new Date(b.ends_at) : new Date('9999-12-31');
            return aDate - bDate;
        }).slice(0, 10);

        if (myTasks.length === 0) {
            container.innerHTML = '<article class="transparent"><i>info</i><p>タスクはありません</p></article>';
            return;
        }

        container.innerHTML = myTasks.map(task => {
            const statusLabel = getConfigLabel(task.task_status_key, 'TASK_STATUS');
            const priorityLabel = getConfigLabel(task.priority_key, 'PRIORITY');

            return `
                <article class="no-padding small-padding border" style="cursor: pointer; margin-bottom: 8px;" onclick="if(App.overlays.taskDetail) App.overlays.taskDetail.open('${task.id}')">
                    <div class="small-text"><strong>${escapeHtml(task.display_id || task.id)}</strong></div>
                    <div class="small-text">${escapeHtml(task.title || '')}</div>
                    <div class="row no-space" style="margin-top: 4px;">
                        <span class="chip small">${escapeHtml(statusLabel)}</span>
                        ${priorityLabel ? `<span class="chip small">${escapeHtml(priorityLabel)}</span>` : ''}
                    </div>
                    ${task.ends_at ? `<div class="small-text" style="margin-top: 4px;">期限: ${formatDate(task.ends_at)}</div>` : ''}
                </article>
            `;
        }).join('');
    };

    /**
     * Column 3: リレーション
     * ドロップダウンで選択されたタイプに応じてassignmentsテーブルから関連アイテムを表示
     */
    App.pages.home.loadRelations = function () {
        const container = document.getElementById('home-relations-container');
        const typeSelect = document.getElementById('relation-type-select');

        if (!container || !typeSelect) return;

        const selectedType = typeSelect.value;

        // 現在は簡易実装：creativesDataから表示
        let items = [];

        switch (selectedType) {
            case 'creatives':
                items = creativesData.slice(0, 10);
                break;
            case 'advertisements':
                items = advertisementsData ? advertisementsData.slice(0, 10) : [];
                break;
            case 'plans':
                items = plansData.slice(0, 10);
                break;
        }

        if (items.length === 0) {
            container.innerHTML = '<article class="transparent"><i>info</i><p>関連アイテムはありません</p></article>';
            return;
        }

        container.innerHTML = items.map(item => {
            const displayId = item.display_id || item.id;
            const title = item.title || item.name || '';

            return `
                <article class="no-padding small-padding border" style="cursor: pointer; margin-bottom: 8px;" onclick="if(App.overlays.${selectedType === 'creatives' ? 'creativeDetail' : selectedType === 'plans' ? 'planDetail' : 'advertisementDetail'}) App.overlays.${selectedType === 'creatives' ? 'creativeDetail' : selectedType === 'plans' ? 'planDetail' : 'advertisementDetail'}.open('${item.id}')">
                    <div class="small-text"><strong>${escapeHtml(displayId)}</strong></div>
                    <div class="small-text">${escapeHtml(title)}</div>
                </article>
            `;
        }).join('');
    };
</script>
