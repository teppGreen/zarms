<div id="tab-home" class="tab-content">
    <div class="card">
        <h1 id="home-greeting" class="main-title">こんにちは</h1>
        <p class="main-subtitle">今日も良い一日を！</p>
    </div>

    <div class="home-body">
        <!-- 列1: 最新の制作依頼（1/5幅） -->
        <div class="home-column-new-requests">
            <h2 class="section-title">最新の制作依頼</h2>
            <div id="home-new-requests-container" class="home-scroll-container">
            </div>
        </div>
        <!-- 列2-3: 担当中の制作物（1/5幅） -->
        <div class="home-column-assigned-works">
            <h2 class="section-title">担当中の制作物</h2>
            <div id="home-works-container" class="home-scroll-container">
            </div>
        </div>
        <!-- スペース（1/5幅） -->
        <div class="home-column-spacer"></div>
        <!-- 列4: 受付中のレビュー（1/5幅） -->
        <div class="home-column-review-requests">
            <h2 class="section-title">受付中のレビュー</h2>
            <div id="home-review-requests-container" class="home-scroll-container">
            </div>
        </div>
        <!-- 列5: 最近のナレッジ（1/5幅） -->
        <div class="home-column-knowledge">
            <h2 class="section-title">最近のナレッジ</h2>
            <div id="home-knowledge-container" class="home-scroll-container">
            </div>
        </div>
    </div>
</div>

<script>
    // セッション中に非表示にするwork_idを管理
    let hiddenWorkIds = new Set();

    // Namespace initialization
    console.log('Initializing App.pages.home');
    App.pages.home = {};

    App.pages.home.loadData = function () {
        // membersDataが取得されていない場合は取得
        const promises = [callGAS('getHomeData')];
        if (!membersData || membersData.length === 0) {
            promises.push(callGAS('getMembers'));
        } else {
            promises.push(Promise.resolve(membersData));
        }

        Promise.all(promises).then(([data, members]) => {
            if (!membersData || membersData.length === 0) {
                membersData = members;
            }

            document.getElementById('home-greeting').textContent = `${data.greeting}、${data.memberName}さん。`;

            // 最新の制作依頼を表示
            renderNewRequests(data.new_requests || []);

            // 担当中の制作物を表示
            renderAssignedWorks(data.works || []);

            // 受付中のレビューを表示
            renderReviewRequests(data.review_requests || []);

            // 最近のナレッジを表示
            renderKnowledge(data.knowledge || []);

            // 残り時間のリアルタイム更新を開始
            startRemainingTimeUpdates();

            hideLoading();
        }).catch(handleError);
    };

    function renderNewRequests(newRequests) {
        const container = document.getElementById('home-new-requests-container');
        container.innerHTML = '';

        // 非表示にするwork_idをフィルタ
        const visibleRequests = newRequests.filter(work => !hiddenWorkIds.has(work.id));

        if (visibleRequests.length === 0) {
            container.innerHTML = '<p style="color: #6b7280;">最新の制作依頼はありません</p>';
            return;
        }

        visibleRequests.forEach(work => {
            const card = document.createElement('div');
            card.className = 'home-card';
            card.dataset.workId = work.id;

            // 優先度、制作物種別、依頼者の所属チームを取得
            const priorityLabel = work.priority_key ? getConfigLabel(work.priority_key, 'PRIORITY') : '';
            const workTypeLabel = work.creative_type_key ? getConfigLabel(work.creative_type_key, 'CREATIVE_TYPE') : '';
            const clientTeamLabel = work.client_member_id ? (() => {
                const client = membersData?.find(m => m.id === work.client_member_id);
                return client ? getConfigLabel(client.member_team_key, 'TEAM') : '';
            })() : '';

            const infoParts = [priorityLabel, workTypeLabel, clientTeamLabel].filter(Boolean);
            const infoText = infoParts.length > 0 ? infoParts.join('|') : '';

            card.innerHTML = `
        <div style="font-size: 0.875rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 4px; font-family: 'Roboto Mono', monospace; font-weight: 500;">
          ${work.plan_id ? `${escapeHtml(work.plan_id)} ` : ''}${escapeHtml(work.plan_title || '')}
        </div>
        <div style="font-size: 0.875rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 8px; font-family: 'Roboto Mono', monospace; font-weight: 500;">
          ${escapeHtml(work.display_id || work.id)} ${escapeHtml(work.title || '')}
        </div>
        ${infoText ? `<div style="font-size: 0.75rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 8px;">${escapeHtml(infoText)}</div>` : ''}
        <div class="card-meta" style="margin-bottom: 12px;">
          <span>納期: <span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">${formatDateTimeForHome(work.deadline_at)}</span></span>
        </div>
        <div class="work-accept-decline-buttons">
          <button class="btn-accept" data-work-id="${escapeHtml(work.id)}" data-remaining-ms="${work.remaining_time_ms || 0}">
            承諾
            <div class="remaining-time" data-remaining-ms="${work.remaining_time_ms || 0}"></div>
          </button>
          <button class="btn-decline" data-work-id="${escapeHtml(work.id)}">保留・辞退</button>
        </div>
      `;

            // 承諾ボタンのイベントリスナー
            const acceptButton = card.querySelector('.btn-accept');
            if (acceptButton) {
                acceptButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const workId = acceptButton.dataset.workId;
                    if (workId) {
                        handleAcceptWork(workId);
                    }
                });
            }

            // 辞退ボタンのイベントリスナー
            const declineButton = card.querySelector('.btn-decline');
            if (declineButton) {
                declineButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const workId = declineButton.dataset.workId;
                    if (workId) {
                        handleDeclineWork(workId);
                    }
                });
            }

            // カードクリックでwork_detail_overlayを開く（ボタン以外の領域）
            card.addEventListener('click', (e) => {
                if (!e.target.closest('.work-accept-decline-buttons')) {
                    openCreativeDetailOverlay(work.id);
                }
            });

            container.appendChild(card);
        });
    }

    function renderAssignedWorks(works) {
        const container = document.getElementById('home-works-container');
        container.innerHTML = '';

        if (works.length === 0) {
            container.innerHTML = '<p style="color: #6b7280;">担当中の制作物はありません</p>';
            return;
        }

        works.forEach(work => {
            const card = document.createElement('div');
            card.className = 'home-card';

            // ステータス色を取得
            const statusColor = getWorkStatusColor(work.creative_status_key);
            const statusLabel = getConfigLabel(work.creative_status_key, 'CREATIVE_STATUS');

            // 納期表示
            const dueDate = formatDateTimeForHome(work.deadline_at);

            card.innerHTML = `
        <div class="home-card-row">
          <span class="home-card-id">${work.plan_id ? escapeHtml(work.plan_id) : ''}</span>
          <span class="home-card-title" title="${escapeHtml(work.plan_title || '')}">${escapeHtml(work.plan_title || '')}</span>
        </div>
        <div class="home-card-row">
          <span class="home-card-id">${escapeHtml(work.display_id || work.id)}</span>
          <span class="home-card-title" title="${escapeHtml(work.title || '')}">${escapeHtml(work.title || '')}</span>
        </div>
        <div class="home-card-meta-row">
          <div class="work-status-badge ${statusColor}">${escapeHtml(statusLabel)}</div>
          <span class="home-card-due-date">納期: ${dueDate}</span>
        </div>
      `;

            card.onclick = () => openCreativeDetailOverlay(work.id);
            container.appendChild(card);
        });
    }

    function renderReviewRequests(reviewRequests) {
        const container = document.getElementById('home-review-requests-container');
        container.innerHTML = '';

        if (reviewRequests.length === 0) {
            container.innerHTML = '<p style="color: #6b7280;">受付中のレビューはありません</p>';
            return;
        }

        reviewRequests.forEach(reviewRequest => {
            const card = document.createElement('div');
            card.className = 'home-card';

            // due_datetimeを「~10/24(水) 15:00」形式で表示
            const dueDateHtml = reviewRequest.due_datetime
                ? formatDateForReview(reviewRequest.due_datetime)
                : '';

            // 作成者情報
            const creatorIcon = reviewRequest.creator_icon || '';
            const creatorName = reviewRequest.creator_name || '不明';

            // 最初に登録されたファイルを取得（created_atでソート）
            let firstFile = null;
            if (reviewRequest.files && reviewRequest.files.length > 0) {
                const sortedFiles = [...reviewRequest.files].sort((a, b) => {
                    const dateA = new Date(a.created_at || 0);
                    const dateB = new Date(b.created_at || 0);
                    return dateA - dateB;
                });
                firstFile = sortedFiles[0];
            }

            // サムネイル用のプレースホルダー
            const thumbnailHtml = firstFile && firstFile.file_id
                ? `<div class="review-thumbnail-container" data-file-id="${escapeHtml(firstFile.file_id)}">
             <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background-color: var(--md-sys-color-surface-variant);">
               <span style="color: var(--md-sys-color-on-surface-variant); font-size: 0.75rem;">読み込み中...</span>
             </div>
           </div>`
                : '';

            card.innerHTML = `
        ${thumbnailHtml}
        <div style="font-size: 0.875rem; color: var(--md-sys-color-on-surface-variant); font-family: 'Roboto Mono', monospace; font-weight: 500; word-wrap: break-word;">
          ${escapeHtml(reviewRequest.review_request_id || '')} ${escapeHtml(reviewRequest.review_title || '')}
        </div>
        <div class="card-meta">
          <span class="review-creator">
            <img src="${escapeHtml(creatorIcon)}" class="review-creator-icon" alt="${escapeHtml(creatorName)}">
            <span>${escapeHtml(creatorName)}</span>
          </span>  
          <span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">
            ${dueDateHtml || ''}
          </span>
        </div>
      `;

            card.onclick = () => openReviewRequestDetailModal(reviewRequest.review_request_id);
            container.appendChild(card);

            // サムネイルを非同期で読み込む（タブの読み込み完了後）
            if (firstFile && firstFile.file_id) {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        loadReviewThumbnail(card.querySelector('.review-thumbnail-container'), firstFile.file_id);
                    });
                });
            }
        });
    }

    function loadReviewThumbnail(container, fileId) {
        if (!container) return;

        // Google DriveのサムネイルURLを生成
        const thumbnailUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=w800-h450`;

        const img = document.createElement('img');
        img.className = 'review-thumbnail';
        img.src = thumbnailUrl;
        img.alt = 'サムネイル';
        img.onerror = () => {
            // サムネイルの読み込みに失敗した場合はプレースホルダーを表示
            container.innerHTML = '<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background-color: var(--md-sys-color-surface-variant);"><span style="color: var(--md-sys-color-on-surface-variant); font-size: 0.75rem;">サムネイルなし</span></div>';
        };
        img.onload = () => {
            container.innerHTML = '';
            container.appendChild(img);
        };
    }

    function renderKnowledge(knowledgeList) {
        const container = document.getElementById('home-knowledge-container');
        container.innerHTML = '';

        if (knowledgeList.length === 0) {
            container.innerHTML = '<p style="color: #6b7280;">最近のナレッジはありません</p>';
            return;
        }

        // 縦スクロールが必要ない数だけ表示するため、まず全て表示してから調整
        const cards = [];
        let totalHeight = 0;
        const containerHeight = container.clientHeight || 600; // デフォルト高さ

        knowledgeList.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'knowledge-card';
            card.dataset.knowledgeId = item.knowledge_id;

            // knowledge_contentを原則全文表示
            const contentHtml = item.knowledge_content || '';

            // 作成者情報
            const creatorIcon = item.creator_icon || 'https://via.placeholder.com/24';
            const creatorName = item.creator_name || '';

            card.innerHTML = `
        <div class="knowledge-content">${contentHtml}</div>
        <div class="card-meta">
          <span class="review-creator">
            <img src="${escapeHtml(creatorIcon)}" class="review-creator-icon" alt="${escapeHtml(creatorName)}">
            <span>${escapeHtml(creatorName)}</span>
          </span>  
          <span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">
            ${formatDateTimeForHome(item.created_at)}
          </span>
        </div>
      `;

            card.onclick = () => openKnowledgeDetailModal(item.knowledge_id);
            cards.push(card);
        });

        // 全てのカードを追加
        cards.forEach(card => container.appendChild(card));

        // 1つのナレッジだけで縦スクロールが必要な場合は省略
        if (cards.length > 0) {
            const firstCard = cards[0];
            const firstCardHeight = firstCard.scrollHeight;
            if (firstCardHeight > containerHeight * 0.8) {
                // はみ出た部分を...で省略
                const contentDiv = firstCard.querySelector('.knowledge-content');
                if (contentDiv) {
                    contentDiv.classList.add('knowledge-content-truncated');
                }
            }
        }
    }

    function calculateRemainingTime(ms) {
        if (!ms || ms <= 0) return '';

        const totalSeconds = ms / 1000; // ミリ秒を秒に変換（小数点以下も保持）
        const hours = Math.floor(totalSeconds / 3600); // 時間部分の取得（小数切り捨て）
        const minutes = Math.floor((totalSeconds % 3600) / 60); // 分部分の取得（小数切り捨て）
        const seconds = Math.floor(totalSeconds % 60); // ミリ秒部分は切り捨て（整数部分のみ）

        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    // 残り時間をリアルタイムで更新するためのinterval ID
    let remainingTimeIntervalId = null;

    function updateRemainingTimes() {
        const acceptButtons = document.querySelectorAll('.btn-accept[data-remaining-ms]');
        const now = new Date().getTime();

        acceptButtons.forEach(button => {
            const initialRemainingMs = parseInt(button.dataset.remainingMs) || 0;
            if (initialRemainingMs <= 0) return;

            // 初期時刻を取得（データ属性から）
            const initialTimeAttr = button.dataset.initialTime;
            if (!initialTimeAttr) {
                // 初回のみ、現在時刻を記録
                button.dataset.initialTime = now.toString();
                return;
            }

            const initialTime = parseInt(initialTimeAttr);
            const elapsed = now - initialTime;
            const remainingMs = initialRemainingMs - elapsed;

            const remainingTimeElement = button.querySelector('.remaining-time');
            if (remainingTimeElement) {
                if (remainingMs > 0) {
                    const remainingTime = calculateRemainingTime(remainingMs);
                    remainingTimeElement.textContent = `${remainingTime}`;
                }
            }
        });
    }

    function startRemainingTimeUpdates() {
        // 既存のintervalをクリア
        if (remainingTimeIntervalId) {
            clearInterval(remainingTimeIntervalId);
        }

        // 1秒ごとに更新
        remainingTimeIntervalId = setInterval(updateRemainingTimes, 1000);
        // 即座に1回実行
        updateRemainingTimes();
    }

    function stopRemainingTimeUpdates() {
        if (remainingTimeIntervalId) {
            clearInterval(remainingTimeIntervalId);
            remainingTimeIntervalId = null;
        }
    }

    function getWorkStatusColor(statusKey) {
        if (statusKey === 'TODO' || statusKey === 'APPROVED') {
            return 'status-red';
        } else if (statusKey === 'CREATE' || statusKey === 'REVIEW' || statusKey === 'REVISION') {
            return 'status-orange';
        } else if (statusKey === 'DELIVERED') {
            return 'status-green';
        }
        return 'status-red';
    }

    function formatDateForReview(dueDatetime) {
        if (!dueDatetime) return '';
        try {
            const date = new Date(dueDatetime);
            const year = String(date.getFullYear()).padStart(4, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
            const weekday = weekdays[date.getDay()];
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `~ ${year}/${month}/${day}(${weekday}) ${hours}:${minutes}`;
        } catch (e) {
            return '';
        }
    }

    function handleAcceptWork(workId) {
        showLoading();
        callGAS('acceptWork', workId).then(result => {
            hideLoading();
            // セッション中は非表示にする
            hiddenWorkIds.add(workId);
            // 最新の制作依頼セクションを再描画
            callGAS('getHomeData').then(data => {
                renderNewRequests(data.new_requests || []);
            }).catch(handleError);
        }).catch(handleError);
    }

    function handleDeclineWork(workId) {
        // セッション中は非表示にする（フロントエンドで管理）
        hiddenWorkIds.add(workId);
        // 最新の制作依頼セクションを再描画
        callGAS('getHomeData').then(data => {
            renderNewRequests(data.new_requests || []);
        }).catch(handleError);
    }

    function formatDateTimeForHome(dateString) {
        if (!dateString) return 'yyyy/mm/dd(曜日) hh:mm';
        try {
            const dt = new Date(dateString);
            const year = dt.getFullYear();
            const month = String(dt.getMonth() + 1).padStart(2, '0');
            const day = String(dt.getDate()).padStart(2, '0');
            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
            const weekday = weekdays[dt.getDay()];
            const hours = String(dt.getHours()).padStart(2, '0');
            const minutes = String(dt.getMinutes()).padStart(2, '0');
            return `${year}/${month}/${day}(${weekday}) ${hours}:${minutes}`;
        } catch (e) {
            return 'yyyy/mm/dd(曜日) hh:mm';
        }
    }
</script>
