<!-- eventsテーブルを表示するページ -->

<div id="overlay-contents-events" style="display: none;">
    <article class="no-padding">
        <div class="auto-height scroll">
            <table id="events-table" class="">
                <thead class="fixed">
                    <!-- ヘッダーは App.utils.tables.render() で動的生成 -->
                </thead>
                <tbody>
                    <!-- ボディは App.utils.tables.render() で動的生成 -->
                </tbody>
                <tfoot class="fixed">
                    <!-- フッターは App.utils.tables.render() で動的生成 -->
                </tfoot>
            </table>
        </div>
    </article>
</div>

<script>
    // Namespace initialization
    App.pages.events = {};

    App.pages.events.loadData = function () {
        callGAS('getItems', SHEET_NAMES.EVENTS)
            .then(data => {
                eventsData = data;

                // ReadOnlyテーブルをレンダリング
                App.utils.tables.render(SHEET_NAMES.EVENTS, App.utils.tables.applyFiltersAndSort(SHEET_NAMES.EVENTS, eventsData), eventsTableHeaders);
                hideLoading();
            })
            .catch(App.utils.error.handle);
    };
</script>
