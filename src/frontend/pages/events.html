<!-- eventsテーブルを表示するページ -->

<article id="overlay-contents-events" class="no-padding" style="display: none;">
    <div class="scroll">
        <table id="events-table" class="stripes">
            <thead>
                <!-- ヘッダーは App.utils.tables.render() で動的生成 -->
            </thead>
            <tbody>
                <!-- ボディは App.utils.tables.render() で動的生成 -->
            </tbody>
        </table>
    </div>
</article>

<script>
    // Namespace initialization
    App.pages.events = {};

    App.pages.events.loadData = function () {
        callGAS('getItems', SHEET_NAMES.EVENTS)
            .then(data => {
                eventsData = data;

                // ReadOnlyテーブルをレンダリング
                App.utils.tables.render(SHEET_NAMES.EVENTS, App.utils.tables.applyFiltersAndSort(SHEET_NAMES.EVENTS, eventsData), eventsTableHeaders);
                hideLoading();
            })
            .catch(App.utils.error.handle);
    };
</script>
