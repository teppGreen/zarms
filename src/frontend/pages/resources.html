<!-- resourcesテーブルを表示するページ -->

<div id="tab-resources" style="display: none;">
    <article class="no-padding">
        <div class="scroll">
            <table id="resources-table" class="stripes">
                <thead>
                    <!-- ヘッダーは App.utils.tables.render() で動的生成 -->
                </thead>
                <tbody>
                    <!-- ボディは App.utils.tables.render() で動的生成 -->
                </tbody>
            </table>
        </div>
    </article>
</div>

<script>
    // Namespace initialization
    App.pages.resources = {};

    App.pages.resources.loadData = function () {
        callGAS('getItems', SHEET_NAMES.RESOURCES)
            .then(data => {
                App.state.data.resources = data;

                // ReadOnlyテーブルをレンダリング
                App.utils.tables.render(SHEET_NAMES.RESOURCES, App.utils.tables.applyFiltersAndSort(SHEET_NAMES.RESOURCES, App.state.data.resources), resourcesTableHeaders);
                hideLoading();
            })
            .catch(App.utils.error.handle);
    };
</script>
