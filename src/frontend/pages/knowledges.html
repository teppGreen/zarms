<!-- knowledgesテーブルを表示するページ -->

<div id="overlay-contents-knowledges" style="display: none;">
    <article class="no-padding">
        <div class="scroll">
            <table id="knowledges-table" class="stripes">
                <thead>
                    <!-- ヘッダーは App.utils.tables.render() で動的生成 -->
                </thead>
                <tbody>
                    <!-- ボディは App.utils.tables.render() で動的生成 -->
                </tbody>
                <tfoot>
                    <!-- フッターは App.utils.tables.render() で動的生成 -->
                </tfoot>
            </table>
        </div>
    </article>
</div>

<script>
    // Namespace initialization
    App.pages.knowledges = {};

    App.pages.knowledges.loadData = function () {
        const promises = [callGAS('getItems', SHEET_NAMES.KNOWLEDGES)];

        // 必要に応じて関連データも取得
        if (!App.state.data.members || App.state.data.members.length === 0) {
            promises.push(callGAS('getItems', SHEET_NAMES.MEMBERS));
        } else {
            promises.push(Promise.resolve(null));
        }

        Promise.all(promises).then(results => {
            App.state.data.knowledges = results[0];
            if (results[1]) App.state.data.members = results[1];

            // ReadOnlyテーブルをレンダリング
            App.utils.tables.render(SHEET_NAMES.KNOWLEDGES, App.utils.tables.applyFiltersAndSort(SHEET_NAMES.KNOWLEDGES, App.state.data.knowledges), knowledgesTableHeaders);
            hideLoading();
        }).catch(App.utils.error.handle);
    };
</script>
