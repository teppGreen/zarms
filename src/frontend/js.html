<script>
  const SHEET_NAMES = templateVariables.SHEET_NAMES;
  const activeUser = templateVariables.activeUser;

  // グローバル変数
  let configData = {};
  let prefixData = {};
  let enumData = {};
  let advertisementsData = [];
  let budgetsData = [];
  let creativesData = [];
  let directoriesData = [];
  let eventsData = [];
  let expensesData = [];
  let formsData = [];
  let hardwaresData = [];
  let jobsData = [];
  let knowledgesData = [];
  let licensesData = [];
  let mediumsData = [];
  let membersData = [];
  let merchandisesData = [];
  let musicsData = [];
  let plansData = [];
  let questionsData = [];
  let resourcesData = [];
  let shiftsData = [];
  let skillsData = [];
  let tasksData = [];
  // let timetracksData = [];
  let wikisData = [];

  // 初期化
  async function initializeApp() {
    try {
      // データ読み込みを待つ
      await loadInitialData();
    } catch (error) {
      console.error('loadInitialData でエラーが発生しました:', error);
    }

    // グローバルショートカットキーの設定
    setupGlobalShortcuts();
  }

  /**
   * グローバルショートカットキーの設定
   */
  function setupGlobalShortcuts() {
    document.addEventListener('keydown', (e) => {
      // Cmd/Ctrl + K: 検索フォーカス
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          searchInput.focus();
          searchInput.select();
        }
      }

      // Cmd/Ctrl + N: 新規作成メニュー
      if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
        e.preventDefault();
        const newButton = document.getElementById('main-button');
        if (newButton && typeof handleMainButtonClick === 'function') {
          handleMainButtonClick({ target: newButton });
        }
      }

      // Esc: モーダルを閉じる
      if (e.key === 'Escape') {
        // detail_creativeのオーバーレイを閉じる
        const creativeDetailOverlay = document.getElementById('overlay-creative-detail');
        if (creativeDetailOverlay && creativeDetailOverlay.style.display !== 'none') {
          if (App.overlays.creativeDetail && typeof App.overlays.creativeDetail.close === 'function') {
            App.overlays.creativeDetail.close();
          }
          return;
        }

        // その他の開いているモーダルを閉じる
        const openModals = document.querySelectorAll('dialog[open]');
        if (openModals.length > 0) {
          openModals.forEach(modal => {
            if (typeof ui === 'function') {
              ui(`#${modal.id}`);
            } else {
              modal.close();
            }
          });
        }
      }
    });
  }

  // // 複数の方法で初期化を試みる
  // if (document.readyState === 'loading') {
  //   document.addEventListener('DOMContentLoaded', initializeApp);
  // } else {
  //   console.log('DOMContentLoaded は既に発火済み。即座に実行します');
  //   // DOMContentLoaded が既に発火している場合
  //   initializeApp();
  // }

  // // window.onload も念のため設定
  window.onload = initializeApp;

  function loadInitialData(shouldSwitchTab = true) {
    showLoading();

    return Promise.all([
      callGAS('getItems', SHEET_NAMES.CONFIG),
      callGAS('getItems', SHEET_NAMES.ENUM),
      callGAS('getItems', SHEET_NAMES.PREFIX),
    ]).then(([configs, enums, prefixes]) => {
      configData = groupConfigByType(configs);
      enumData = groupEnumByType(enums);
      prefixData = groupPrefix(prefixes);
      hideLoading();
      if (shouldSwitchTab) {
        App.utils.navigation.switchTab('home');
      }
    }).catch(App.utils.error.handle);
  }

  // 直前のcallGAS呼び出しを記録（HTTP 429エラー時の再試行用）
  let lastCallGASInvocation = null;
  // 直前のJavaScript関数呼び出しを記録（HTTP 429エラー時の再試行用）
  let lastJSInvocation = null;

  // JavaScript関数呼び出しを記録するヘルパー関数
  function recordJSInvocation(functionName, ...args) {
    lastJSInvocation = {
      functionName: functionName,
      args: args
    };
  }

  function callGAS(functionName, ...args) {
    // 呼び出し履歴を記録
    lastCallGASInvocation = {
      functionName: functionName,
      args: args
    };

    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
      [functionName](...args);
    });
  }

  function groupConfigByType(configs) {
    const grouped = {};
    if (!configs || !Array.isArray(configs)) return grouped;

    // is_active でフィルタリング
    const activeConfigs = configs.filter(config =>
      config.is_active === true || config.is_active === 'TRUE' || config.is_active === 'true'
    );

    // sort_order でソート
    activeConfigs.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

    // type ごとにグループ化
    activeConfigs.forEach(config => {
      if (!grouped[config.type]) {
        grouped[config.type] = [];
      }
      grouped[config.type].push(config);
    });
    return grouped;
  }

  function groupEnumByType(enums) {
    const grouped = {};
    if (!enums || !Array.isArray(enums)) return grouped;

    // is_active でフィルタリング
    const activeEnums = enums.filter(enuma =>
      enuma.is_active === true || enuma.is_active === 'TRUE' || enuma.is_active === 'true'
    );

    // sort_order でソート
    activeEnums.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

    // type ごとにグループ化
    activeEnums.forEach(enuma => {
      if (!grouped[enuma.type]) {
        grouped[enuma.type] = [];
      }
      grouped[enuma.type].push(enuma);
    });
    return grouped;
  }

  function groupPrefix(prefixes) {
    // PREFIX データを table_name をキー、prefix_value を値として格納
    if (prefixes && Array.isArray(prefixes)) {
      prefixes.forEach(prefix => {
        if (prefix.table_name && prefix.prefix_value) {
          prefixData[prefix.table_name] = prefix.prefix_value;
        }
      });
    }
    return prefixData;
  }

  let loadingTimeout = null;

  function showLoading() {
    if (loadingTimeout) clearTimeout(loadingTimeout);

    // app-headerにシマーエフェクトをON（スパイラルアニメーションの代わり）
    const appHeader = document.querySelector('.app-header');
    if (appHeader) {
      appHeader.classList.add('shimmer-loading');
    }

    // bodyタグにcursor: waitを適用
    document.body.style.cursor = 'wait';
  }

  function hideLoading() {
    // app-headerからシマーエフェクトをOFF（チェックマーク表示の代わり）
    const appHeader = document.querySelector('.app-header');
    if (appHeader) {
      appHeader.classList.remove('shimmer-loading');
    }

    // bodyタグからcursor: waitを削除
    document.body.style.cursor = '';
  }

  function openModal(id) {
    const modal = document.getElementById(id);
    if (modal) {
      modal.classList.add('active');
    }
    const overlay = document.getElementById('overlay');
    if (overlay) {
      overlay.classList.add('active');
    }
  }

  function closeModal(id) {
    const modal = document.getElementById(id);
    if (modal) {
      modal.classList.remove('active');
    }
    const overlay = document.getElementById('overlay');
    if (overlay) {
      overlay.classList.remove('active');
    }
  }

  // ============================================
  // ヘルパー関数
  // ============================================
  function getConfigLabel(key, type) {
    if (!key || !configData[type]) return key;
    const config = configData[type].find(c => c.config_key === key);
    return config ? config.config_value : key;
  }
  function formatDate(dateString) {
    if (!dateString) return '-';
    try {
      const dt = new Date(dateString);
      const offset = dt.getTimezoneOffset() * 60000;
      const localDate = new Date(dt.getTime() - offset);
      return localDate.toISOString().slice(0, 10);
    } catch (e) { return dateString; }
  }
  function formatDateTimeForDisplay(dateString, includeSeconds = false) {
    if (!dateString) return '-';
    try {
      const dt = new Date(dateString);
      const year = String(dt.getFullYear()).padStart(4, '0');
      const month = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const weekday = weekdays[dt.getDay()];
      const hours = String(dt.getHours()).padStart(2, '0');
      const minutes = String(dt.getMinutes()).padStart(2, '0');
      const seconds = String(dt.getSeconds()).padStart(2, '0');
      return `${month}/${day}(${weekday}) ${hours}:${minutes}`;
    } catch (e) {
      return '-';
    }
  }


  function formatDateTimeForInput(dateString) {
    if (!dateString) return '';
    try {
      const dt = new Date(dateString);
      const offset = dt.getTimezoneOffset() * 60000;
      const localDate = new Date(dt.getTime() - offset);
      return localDate.toISOString().slice(0, 16);
    } catch (e) { return ''; }
  }
  function calculateDaysRemaining(dueDateString) {
    if (!dueDateString) return '-';
    try {
      const dueDate = new Date(dueDateString);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      dueDate.setHours(0, 0, 0, 0);
      const diffTime = dueDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      if (diffDays < 0) {
        return `${Math.abs(diffDays)}日超過`;
      } else if (diffDays === 0) {
        return '今日';
      } else {
        return `${diffDays}日`;
      }
    } catch (e) {
      return '-';
    }
  }
  function escapeHtml(text) {
    if (text === null || typeof text === 'undefined') return '';
    return String(text).replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[match]);
  }

  /**
   * display_id をフォーマットして返す
   * @param {string} table_name - テーブル名
   * @param {number|string} display_id - display_id
   * @returns {string} フォーマットされた display_id
   */
  function formatDisplayId(table_name, display_id) {
    if (!display_id) return '-';

    // prefixData から prefix_value を取得
    const prefix_value = prefixData[table_name] || '';

    // display_id を4桁固定で0パディング
    const paddedId = String(display_id).padStart(4, '0');

    // prefix_value と display_id を結合
    return prefix_value + paddedId;
  }

  /**
   * メンバーアイコンのHTMLを生成する
   * @param {string|Object} memberOrId - メンバーIDまたはメンバーオブジェクト
   * @returns {string} 生成されたHTML
   */
  function renderMemberIcon(memberOrId) {
    let member = memberOrId;
    if (typeof memberOrId === 'string') {
      member = membersData.find(m => m.id === memberOrId) || membersData.find(m => m.email === memberOrId);
    }

    if (!member) return '';

    const iconUrl = member.icon_gfile_id ? `https:/\/drive.google.com/thumbnail?id=${member.icon_gfile_id}` : '';
    const nickname = member.nickname || member.email || '不明';

    // User requested specific format:
    // const iconContent = iconUrl
    //   ? `<img class="responsive" src="${escapeHtml(iconUrl)}" alt="${escapeHtml(nickname)}" title="${escapeHtml(nickname)}">`
    //   : `<i>account_circle</i>`;

    // However, the user's snippet had some syntax errors. I will generate valid HTML that matches the intent.
    const iconContent = iconUrl
      ? `<img class="responsive" src="${escapeHtml(iconUrl)}" alt="${escapeHtml(nickname)}" title="${escapeHtml(nickname)}">`
      : `<i>account_circle</i>`;

    return `
      <button class="transparent circle small" onclick="event.stopPropagation(); App.pages.memberDetail.open('${escapeHtml(member.id)}')">
        ${iconContent}
      </button>
    `;
  }


  // ============================================
  // インライン編集 & ポップアップ
  // ============================================

  function closeAllPopups() {
    const popups = document.querySelectorAll('.popup-editor');
    popups.forEach(p => p.remove());
  }

  function createPopup(referenceElement, editorElement) {
    closeAllPopups();
    const popup = document.createElement('div');
    popup.className = 'popup-editor';
    popup.appendChild(editorElement);
    document.body.appendChild(popup);

    const rect = referenceElement.getBoundingClientRect();
    popup.style.left = `${rect.left}px`;
    popup.style.top = `${rect.bottom}px`;
    popup.style.width = `${rect.width}px`;

    popup.addEventListener('click', e => e.stopPropagation());
    return popup;
  }

  function saveChange(tableName, id, field, newValue, oldValue) {
    if (String(newValue) === String(oldValue)) return;

    showLoading();

    // まずデータ配列を更新する
    const data = tableName === SHEET_NAMES.CREATIVES ? creativesData : tableName === SHEET_NAMES.PLANS ? plansData : tableName === SHEET_NAMES.TASKS ? tasksData : membersData;
    const idKey = tableName === SHEET_NAMES.MEMBERS ? 'member_email' : (tableName === SHEET_NAMES.CREATIVES ? 'id' : (tableName === SHEET_NAMES.TASKS ? 'id' : 'id'));
    const item = data.find(d => String(d[idKey]) === String(id));
    if (item) {
      item[field] = newValue;
    }

    // 次に表示を更新する
    const table = document.getElementById(`${tableName}-table`);
    const row = table.querySelector(`tr[data-id="${id}"]`);
    if (row) {
      const cell = row.querySelector(`td[data-field="${field}"]`);
      if (cell) {
        const header = getHeaderDef(tableName, field);
        let displayValue = newValue;
        if (header && header.configType) {
          displayValue = getConfigLabel(newValue, header.configType);
        } else if (header && header.editType === 'datetime') {
          displayValue = formatDateTimeForDisplay(newValue);
        }
        // editable-container の中の span.editable-text を更新する
        const editableTextSpan = cell.querySelector('.editable-text');
        if (editableTextSpan) {
          editableTextSpan.textContent = displayValue;
        } else {
          // editable-container がない場合（テキストフィールドなど）
          cell.textContent = displayValue;
        }
      }
    }

    // 最後にサーバーに保存する
    callGAS('updateItem', tableName, id, { [field]: newValue })
      .then(success => {
        hideLoading();
        if (!success) {
          App.utils.error.handle({ message: '更新に失敗しました。' });
          // 失敗時はデータを再読み込み
          if (tableName) {
            loadTabData(tableName);
          }
        }
      })
      .catch(err => {
        App.utils.error.handle(err);
        // エラー時はデータを再読み込み
        if (tableName) {
          loadTabData(tableName);
        }
      });
  }

  // ---- テキスト編集 ----
  function switchToEditMode(cell, header, tableName) {
    cell.classList.add('editing');
    const originalValue = cell.textContent;
    cell.innerHTML = '';
    const input = document.createElement('input');
    input.type = 'text';
    input.value = originalValue;
    input.className = 'inline-edit-input';
    cell.appendChild(input);
    input.focus();

    const onSave = () => {
      cell.innerHTML = escapeHtml(input.value);
      cell.classList.remove('editing');
      saveChange(tableName, cell.parentElement.dataset.id, header.key, input.value, originalValue);
    };
    input.addEventListener('blur', onSave);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) input.blur();
      if (e.key === 'Escape') {
        cell.innerHTML = escapeHtml(originalValue);
        cell.classList.remove('editing');
      }
    });
  }

  // ---- セレクト（ドロップダウン）編集 ----
  function showSelectEditor(event, tableName, id, field) {
    event.stopPropagation();
    // Stop propagation to prevent immediate closing if clicking the button triggers document click

    // Find or create global menu
    let menu = document.getElementById('global-select-menu');
    if (!menu) {
      menu = document.createElement('menu');
      menu.id = 'global-select-menu';
      document.body.appendChild(menu);
    }

    // Clear menu
    menu.innerHTML = '';

    const header = getHeaderDef(tableName, field);
    const options = configData[header.configType] || [];
    if (options.length === 0) return;

    const data = (tableName === SHEET_NAMES.TASKS ? tasksData : tableName === SHEET_NAMES.CREATIVES ? creativesData : tableName === SHEET_NAMES.PLANS ? plansData : membersData);
    const idKey = tableName === SHEET_NAMES.MEMBERS ? 'member_email' : 'id';
    const item = data.find(d => String(d[idKey]) === String(id));
    const currentValue = item ? item[field] : '';

    options.forEach(opt => {
      const a = document.createElement('a');
      a.textContent = opt.config_value;
      if (opt.config_key === currentValue) {
        a.classList.add('active'); // BeerCSS active state for menu item? or just bold
        a.style.fontWeight = 'bold';
      }
      a.onclick = () => {
        saveChange(tableName, id, field, opt.config_key, currentValue);
        // Menu closes automatically or we can force it? 
        // BeerCSS menus close on click usually.
      };
      menu.appendChild(a);
    });

    // Open menu relative to trigger
    const trigger = event.currentTarget; // The container (button + text) or button
    ui(menu, trigger);
  }

  // ---- タスク日時編集（ネイティブ） ----
  function openDateTimePickerForTask(taskId, field, originalValue) {
    const container = document.getElementById('creative-tasks-container');
    if (!container) return;
    const row = container.querySelector(`tr[data-task-id="${taskId}"]`);
    if (!row) return;
    // Assuming 4th column is ends_at based on previous code reading
    const cell = row.querySelector(`td:nth-child(4)`);
    if (!cell) return;

    if (cell.classList.contains('editing')) return;
    cell.classList.add('editing');

    cell.innerHTML = '';
    const input = document.createElement('input');
    input.type = 'datetime-local';
    if (originalValue) {
      input.value = originalValue.slice(0, 16);
    }
    input.style.width = '100%';
    cell.appendChild(input);
    input.focus();

    const onSave = () => {
      let newValue = input.value;
      if (newValue && newValue.length === 16) newValue += ':00';
      if (newValue) {
        const d = new Date(newValue);
        newValue = d.toISOString();
      } else {
        newValue = '';
      }

      // UI restore
      cell.innerHTML = '';
      cell.classList.remove('editing');

      const datetimeContainer = document.createElement('div');
      datetimeContainer.className = 'row no-space align-center';
      const datetimeText = document.createElement('span');
      datetimeText.className = 'editable-text max';
      datetimeText.textContent = formatDateTimeForDisplay(newValue);
      const datetimeBtn = document.createElement('button');
      datetimeBtn.className = 'circle transparent small';
      datetimeBtn.innerHTML = '<i>edit</i>';
      datetimeContainer.appendChild(datetimeText);
      datetimeContainer.appendChild(datetimeBtn);
      datetimeContainer.addEventListener('click', () => {
        openDateTimePickerForTask(taskId, field, newValue);
      });
      cell.appendChild(datetimeContainer);

      if (newValue !== originalValue) {
        App.pages.taskDetail.updateTaskField(taskId, field, newValue, originalValue);
      }
    };

    input.addEventListener('blur', onSave);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') {
        input.removeEventListener('blur', onSave);
        cell.classList.remove('editing');
        cell.innerHTML = '';
        // Restore
        const datetimeContainer = document.createElement('div');
        datetimeContainer.className = 'row no-space align-center';
        const datetimeText = document.createElement('span');
        datetimeText.className = 'editable-text max';
        datetimeText.textContent = formatDateTimeForDisplay(originalValue);
        const datetimeBtn = document.createElement('button');
        datetimeBtn.className = 'circle transparent small';
        datetimeBtn.innerHTML = '<i>edit</i>';
        datetimeContainer.appendChild(datetimeText);
        datetimeContainer.appendChild(datetimeBtn);
        datetimeContainer.addEventListener('click', () => {
          openDateTimePickerForTask(taskId, field, originalValue);
        });
        cell.appendChild(datetimeContainer);
      }
    });
  }
  // ID検索、テキスト検索、勤怠、ユーザーメニュー関連の関数は
  // components/utils/search.html と components/utils/header.html に移動しました
  // (App.utils.search.xxx, App.utils.header.xxx)


  // ============================================
  // Optimistic UI: データ同期ロジック
  // ============================================

  /**
   * グローバル変数内の該当オブジェクトを直接更新します (Optimistic UI)
   * @param {string} tableName - テーブル名
   */
  function getDataArray(tableName) {
    const dataArrayMap = {
      [SHEET_NAMES.ADVERTISEMENTS]: advertisementsData,
      [SHEET_NAMES.BUDGETS]: budgetsData,
      [SHEET_NAMES.CREATIVES]: creativesData,
      [SHEET_NAMES.DIRECTORIES]: directoriesData,
      [SHEET_NAMES.EVENTS]: eventsData,
      [SHEET_NAMES.EXPENSES]: expensesData,
      [SHEET_NAMES.FORMS]: formsData,
      [SHEET_NAMES.HARDWARES]: hardwaresData,
      [SHEET_NAMES.JOBS]: jobsData,
      [SHEET_NAMES.KNOWLEDGES]: knowledgesData,
      [SHEET_NAMES.LICENSES]: licensesData,
      [SHEET_NAMES.MEDIUMS]: mediumsData,
      [SHEET_NAMES.MEMBERS]: membersData,
      [SHEET_NAMES.MERCHANDISES]: merchandisesData,
      [SHEET_NAMES.MUSICS]: musicsData,
      [SHEET_NAMES.PLANS]: plansData,
      [SHEET_NAMES.QUESTIONS]: questionsData,
      [SHEET_NAMES.RESOURCES]: resourcesData,
      [SHEET_NAMES.SHIFTS]: shiftsData,
      [SHEET_NAMES.SKILLS]: skillsData,
      [SHEET_NAMES.TASKS]: tasksData,
      [SHEET_NAMES.WIKIS]: wikisData
    };
    return dataArrayMap[tableName];
  }

  /**
   * グローバル変数内の該当オブジェクトを直接更新します (Optimistic UI)
   * @param {string} tableName - テーブル名
   * @param {string} id - レコードID
   * @param {Object} updates - 更新する値のオブジェクト
   * @returns {Object|null} 更新されたアイテム、または見つからない場合はnull
   */
  function updateLocalData(tableName, id, updates) {
    const dataArray = getDataArray(tableName);
    if (!dataArray) {
      console.warn(`updateLocalData: テーブル ${tableName} が見つかりません`);
      return null;
    }

    const item = dataArray.find(d => d.id === id);
    if (!item) {
      console.warn(`updateLocalData: ID ${id} が ${tableName} に見つかりません`);
      return null;
    }

    // オブジェクトを直接更新
    Object.keys(updates).forEach(key => {
      item[key] = updates[key];
    });

    return item;
  }

  /**
   * データをロールバックします (エラー時)
   * @param {string} tableName - テーブル名
   * @param {string} id - レコードID
   * @param {Object} oldData - 以前のデータ
   */
  function rollbackLocalData(tableName, id, oldData) {
    const dataArray = getDataArray(tableName);
    if (!dataArray) {
      console.warn(`rollbackLocalData: テーブル ${tableName} が見つかりません`);
      return;
    }

    const item = dataArray.find(d => d.id === id);
    if (!item) {
      console.warn(`rollbackLocalData: ID ${id} が ${tableName} に見つかりません`);
      return;
    }

    // 古いデータで上書き
    Object.keys(oldData).forEach(key => {
      item[key] = oldData[key];
    });

    // 行を再描画
    App.utils.tables.reRenderTableRow(tableName, id);
  }
</script>
