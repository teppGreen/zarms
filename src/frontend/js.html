  // 直前のcallGAS呼び出しを記録（HTTP 429エラー時の再試行用）
  let lastCallGASInvocation = null;
  // 直前のJavaScript関数呼び出しを記録（HTTP 429エラー時の再試行用）
  let lastJSInvocation = null;

  // JavaScript関数呼び出しを記録するヘルパー関数
  function recordJSInvocation(functionName, ...args) {
    lastJSInvocation = {
      functionName: functionName,
      args: args
    };
  }

  function callGAS(functionName, ...args) {
    // 呼び出し履歴を記録
    lastCallGASInvocation = {
      functionName: functionName,
      args: args
    };

    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
      [functionName](...args);
    });
  }

  function groupConfigByType(configs) {
    const grouped = {};
    if (!configs || !Array.isArray(configs)) return grouped;

    configs.forEach(config => {
      if (!grouped[config.config_type]) {
        grouped[config.config_type] = [];
      }
      grouped[config.config_type].push(config);
    });
    return grouped;
  }

  let loadingTimeout = null;

  function showLoading() {
    if (loadingTimeout) clearTimeout(loadingTimeout);

    // app-headerにシマーエフェクトをON（スパイラルアニメーションの代わり）
    const appHeader = document.querySelector('.app-header');
    if (appHeader) {
      appHeader.classList.add('shimmer-loading');
    }

    // bodyタグにcursor: waitを適用
    document.body.style.cursor = 'wait';
  }

  function hideLoading() {
    // app-headerからシマーエフェクトをOFF（チェックマーク表示の代わり）
    const appHeader = document.querySelector('.app-header');
    if (appHeader) {
      appHeader.classList.remove('shimmer-loading');
    }

    // bodyタグからcursor: waitを削除
    document.body.style.cursor = '';
  }

  function handleError(error) {
    hideLoading();
    console.error('GAS Error:', error);

    // HTTP 429エラーを検出（エラーメッセージに"429"が含まれているか、エラーコードが429か）
    const is429Error = error.toString().includes('HTTP 429');

    if (is429Error && lastCallGASInvocation) {
      // HTTP 429エラーの場合、アラートを表示せずに再試行
      retryLastOperation();
      return;
    }

    // その他のエラーは通常通りアラートを表示
    alert('エラーが発生しました: ' + error.message);
  }

  // HTTP 429エラー時の再試行処理
  let retryPopup = null;
  let retryProgressInterval = null;

  function retryLastOperation() {
    if (!lastCallGASInvocation) {
      return;
    }

    // 再試行ポップアップを表示
    showRetryPopup();

    // 10秒待機してから再試行
    let progress = 0;
    const duration = 10000; // 10秒
    const interval = 100; // 100msごとに更新
    const increment = (interval / duration) * 100;

    retryProgressInterval = setInterval(() => {
      progress += increment;
      if (progress >= 100) {
        progress = 100;
        clearInterval(retryProgressInterval);
        retryProgressInterval = null;
      }
      updateRetryProgress(progress);
    }, interval);

    // 10秒後に再試行
    setTimeout(() => {
      if (retryProgressInterval) {
        clearInterval(retryProgressInterval);
        retryProgressInterval = null;
      }

      console.log('lastCallGASInvocation:', lastCallGASInvocation);
      console.log('lastJSInvocation:', lastJSInvocation);

      // 直前のGAS操作を再試行
      const { functionName, args } = lastCallGASInvocation;
      callGAS(functionName, ...args)
        .then(() => {
          // GASの再試行が成功したら、記録されたJavaScript関数も実行
          if (lastJSInvocation && lastJSInvocation.functionName && lastJSInvocation.args) {
            const jsFunctionName = lastJSInvocation.functionName;
            const jsArgs = lastJSInvocation.args;

            // 関数を取得して実行
            let jsFunction = null;
            if (typeof window[jsFunctionName] === 'function') {
              jsFunction = window[jsFunctionName];
            } else if (typeof this[jsFunctionName] === 'function') {
              jsFunction = this[jsFunctionName];
            } else {
              // 関数名から直接関数を取得を試みる
              try {
                jsFunction = eval(jsFunctionName);
                if (typeof jsFunction !== 'function') {
                  jsFunction = null;
                }
              } catch (e) {
                console.warn(`Failed to get function ${jsFunctionName}:`, e);
              }
            }

            if (jsFunction && typeof jsFunction === 'function') {
              try {
                jsFunction(...jsArgs);
              } catch (e) {
                console.error(`Failed to execute ${jsFunctionName}:`, e);
              }
            } else {
              console.warn(`Function ${jsFunctionName} not found`);
            }
          }

          // 成功時はポップアップを閉じる
          lastCallGASInvocation = null;
          lastJSInvocation = null;
          hideRetryPopup();
        })
        .catch((error) => {
          // 再試行時もHTTP 429エラーの場合は再度再試行
          const is429Error = error.toString().includes('429');

          if (is429Error) {
            // 再度再試行
            retryLastOperation();
          } else {
            // その他のエラーはポップアップを閉じて通常のエラー処理
            lastCallGASInvocation = null;
            lastJSInvocation = null;
            hideRetryPopup();
            handleError(error);
          }
        });
    }, duration);
  }

  function showRetryPopup() {
    // 既存のポップアップがあれば削除
    if (retryPopup) {
      retryPopup.remove();
    }

    // ポップアップ要素を作成
    retryPopup = document.createElement('div');
    retryPopup.id = 'retry-popup';
    retryPopup.className = 'retry-popup';
    retryPopup.innerHTML = `
      <div class="retry-popup-content">
        <div class="retry-popup-text">ネットワークエラーが発生したため復旧します<br>少々お待ちください</div>
        <div class="retry-progress-container">
          <div class="retry-progress-bar">
            <div class="retry-progress-fill" style="width: 0%"></div>
          </div>
        </div>
      </div>
    `;

    document.body.appendChild(retryPopup);
  }

  function updateRetryProgress(progress) {
    if (retryPopup) {
      const progressFill = retryPopup.querySelector('.retry-progress-fill');
      if (progressFill) {
        progressFill.style.width = `${progress}%`;
      }
    }
  }

  function hideRetryPopup() {
    if (retryPopup) {
      retryPopup.remove();
      retryPopup = null;
    }
    if (retryProgressInterval) {
      clearInterval(retryProgressInterval);
      retryProgressInterval = null;
    }
  }

    } else if (tabName === SHEET_NAMES.MEMBERS) {

    } else if (tabName === SHEET_NAMES.KNOWLEDGES) {

    } else if (tabName === 'summary') {

    }

    if (loader) {
      loader();
    } else {
      console.warn(`No loader found for tab: ${tabName}`);

  }

  function renderTable(name, data, headers) {
    const table = document.getElementById(`${name}-table`);
    if (!table) return;
    const thead = table.querySelector('thead');
    const tbody = table.querySelector('tbody');
    const state = tableState[name];

    // ヘッダーの生成
    thead.innerHTML = '';
    const headerRow = thead.insertRow();
    headers.forEach(header => {
      const th = document.createElement('th');
      const labelSpan = document.createElement('span');
      labelSpan.className = 'header-label';
      labelSpan.textContent = header.label;
      th.appendChild(labelSpan);
      if (header.sortable || header.filterable) {
        const iconsDiv = document.createElement('div');
        iconsDiv.className = 'header-icons';
        if (header.sortable) {
          const sortIcon = document.createElement('span');
          sortIcon.className = 'sort-icon';
          sortIcon.textContent = state.sortKey === header.key ? (state.sortOrder === 'asc' ? '↑' : '↓') : '↕';
          th.addEventListener('click', () => sortTable(name, header.key));
          iconsDiv.appendChild(sortIcon);
        }
        if (header.filterable) {
          const filterIcon = document.createElement('span');
          filterIcon.className = 'filter-icon';
          filterIcon.textContent = '▼';
          filterIcon.addEventListener('click', (e) => showFilterMenu(e, name, header.key));
          iconsDiv.appendChild(filterIcon);
        }
        th.appendChild(iconsDiv);
      }
      headerRow.appendChild(th);
    });

    // ボディの生成
    tbody.innerHTML = '';
    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${headers.length}" style="text-align: center; color: #6b7280;">データがありません</td></tr>`;
      return;
    }

    const idKey = 'id'; // New schema uses 'id' for all tables

    data.forEach(item => {
      const row = tbody.insertRow();
      row.dataset.id = item[idKey];
      headers.forEach(header => {
        const cell = row.insertCell();
        cell.dataset.field = header.key;
        const currentValue = item[header.key];
        let content = '';

        if (header.editable) {
          switch (header.editType) {
            case 'select':
              const selectContainer = document.createElement('div');
              selectContainer.className = 'editable-container';
              const selectText = document.createElement('span');
              selectText.className = 'editable-text';
              selectText.textContent = getConfigLabel(currentValue, header.configType);
              const selectToggle = document.createElement('span');
              selectToggle.className = 'editable-toggle-btn';
              selectToggle.textContent = '✎';
              selectContainer.appendChild(selectText);
              selectContainer.appendChild(selectToggle);
              selectContainer.addEventListener('click', (e) => {
                showSelectEditor(e, name, item[idKey], header.key);
              });
              cell.appendChild(selectContainer);
              break;
            case 'datetime':
              const datetimeContainer = document.createElement('div');
              datetimeContainer.className = 'editable-container datetime-editable';
              const datetimeText = document.createElement('span');
              datetimeText.className = 'editable-text';
              datetimeText.textContent = formatDateTimeForDisplay(currentValue);
              const datetimeToggle = document.createElement('span');
              datetimeToggle.className = 'editable-toggle-btn';
              datetimeToggle.textContent = '✎';
              datetimeContainer.appendChild(datetimeText);
              datetimeContainer.appendChild(datetimeToggle);
              datetimeContainer.addEventListener('click', (e) => {
                openDateTimePicker(e, name, item[idKey], header.key);
              });
              cell.appendChild(datetimeContainer);
              break;
            default: // text
              cell.textContent = currentValue;
              cell.classList.add('editable');
              cell.addEventListener('click', (e) => {
                if (cell.classList.contains('editing')) return;
                switchToEditMode(cell, header, name);
              });
              break;
          }
        } else {
          switch (header.key) {
            case 'display_id':
              if (name === SHEET_NAMES.CREATIVES) {
                content = `<button class="btn-link" style="font-family: 'Roboto Mono', monospace; font-weight: 500;" onclick="App.overlays.creativeDetail.open('${item.id}')">${escapeHtml(item.display_id || item.id)}</button>`;
              } else if (name === SHEET_NAMES.PLANS) {

              } else {
                content = `<span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">${escapeHtml(item.display_id || item.id)}</span>`;
              }
              break;
            case 'plan_title':
              if (item.plan_title) content = escapeHtml(item.plan_title);
              else if (item.plan_id && plansData) {
                const plan = plansData.find(p => p.id === item.plan_id);
                content = plan ? escapeHtml(plan.title) : '';
              }
              break;
            case 'client_name':
              if (item.client_name) content = escapeHtml(item.client_name);
              else if (item.client_member_id && membersData) {
                const member = membersData.find(m => m.id === item.client_member_id);
                content = member ? escapeHtml(member.nickname || member.member_name) : '';
              }
              break;
            case 'assign_to_name':
              if (item.assign_to_name) content = escapeHtml(item.assign_to_name);
              else if (item.assign_to && membersData) {
                const member = membersData.find(m => m.id === item.assign_to);
                content = member ? escapeHtml(member.nickname || member.member_name) : '';
              }
              break;
            case 'created_by_name':
              if (item.created_by_name) content = escapeHtml(item.created_by_name);
              else if (item.created_by && membersData) {
                const member = membersData.find(m => m.id === item.created_by);
                content = member ? escapeHtml(member.nickname || member.member_name) : '';
              }
              break;
            case 'detail': content = `<button class="btn-link" onclick="openMemberDetail('${item.id}')">詳細</button>`; break;
            case 'assignees': content = renderAssignees(item.assignees); break; // assignees needs to be populated in loadData or backend
            case 'icon_gfile_id': content = `<img src="${escapeHtml(item.icon_gfile_id ? 'https://drive.google.com/thumbnail?id=' + item.icon_gfile_id : 'https://via.placeholder.com/32')}" class="avatar" alt="">`; break;
            case 'deadline_at': content = `<span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">${escapeHtml(formatDateTimeForDisplay(currentValue, true))}</span>`; break;
            case 'ends_at': content = `<span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">${escapeHtml(formatDateTimeForDisplay(currentValue))}</span>`; break;
            case 'created_at': content = escapeHtml(formatDate(currentValue)); break;
            default:
              if (typeof currentValue === 'string' && currentValue.length > 10) {
                content = escapeHtml(currentValue.substring(0, 10)) + '...';
              } else {
                content = escapeHtml(currentValue);
              }
              break;
          }
          cell.innerHTML = content;
        }
      });
    });
  }

  function buildNewCreativeForm() {

: center; border: none; outline: none; background: transparent;"> <span class="datetime-separator">:</span> <input type="text" class="datetime-segment" data-segment="min" maxlength="2" value="" placeholder="mm" style="width: 40px; text-align: center; border: none; outline: none; background: transparent;"> </div> <input type="hidden" name="deadline_at" id="new-creative-deadline-at"> </div> <div class="form-group"> <label class="form-label">制作物の概要</label> <textarea name="description" class="input-field" rows="4"></textarea> </div> <div class="modal-footer"> <button type="button" class="btn btn-secondary btn-cancel" onclick="closeModal('modal-new-creative')">キャンセル</button> <button type="submit" class="btn btn-primary">作成</button> </div> </form>`;

    // IME変換確定時のEnterキーを無視する処理を追加
    const form = document.getElementById('new-creative-form-element');
    if (form) {
      const textInputs = form.querySelectorAll('input[type="text"], textarea');
      textInputs.forEach(input => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && e.isComposing) {
            e.stopPropagation();
          }
        });
      });

      // カスタム日時入力フィールドの設定
      const datetimeContainer = document.getElementById('new-creative-datetime-container');
      const hiddenInput = document.getElementById('new-creative-deadline-at');
      if (datetimeContainer && hiddenInput) {
        const inputs = datetimeContainer.querySelectorAll('.datetime-segment');

        inputs.forEach((input, index) => {
          // 数字のみ入力可能
          input.addEventListener('input', (e) => {
            let value = e.target.value.replace(/[^0-9]/g, '');
            const maxLength = parseInt(e.target.getAttribute('maxlength'));

            if (value.length > maxLength) {
              value = value.substring(0, maxLength);
            }

            e.target.value = value;

            // 最大桁数に達したら次のフィールドへ
            if (value.length >= maxLength && index < inputs.length - 1) {
              inputs[index + 1].focus();
              inputs[index + 1].select();
            }

            // 隠しフィールドに値を更新
            updateNewCreativeDateTimeValue(inputs, hiddenInput);
          });

          // キーボード操作
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) {
              e.preventDefault();
              // Enterキーで日時を確定（最後のフィールドの場合、またはすべてのフィールドが入力されている場合）
              if (index === inputs.length - 1) {
                // 最後のフィールドでEnterキーを押した場合、フォーカスを外して確定
                input.blur();
              } else {
                // 次のフィールドに移動
                if (index < inputs.length - 1) {
                  inputs[index + 1].focus();
                  inputs[index + 1].select();
                }
              }
            } else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) {
              // カーソルが末尾にある場合は次のフィールドへ
              if (index < inputs.length - 1) {
                e.preventDefault();
                inputs[index + 1].focus();
                inputs[index + 1].setSelectionRange(0, 0);
              }
            } else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) {
              // カーソルが先頭にある場合は前のフィールドへ
              if (index > 0) {
                e.preventDefault();
                const prevInput = inputs[index - 1];
                prevInput.focus();
                prevInput.setSelectionRange(prevInput.value.length, prevInput.value.length);
              }
            }
          });
        });
      }
    }
  }

  function updateNewCreativeDateTimeValue(inputs, hiddenInput) {
    const values = Array.from(inputs).map(input => input.value);
    const [yyyy, mm, dd, hh, min] = values;

    // すべての値が入力されている場合のみ、隠しフィールドに値を設定
    if (yyyy && yyyy.length === 4 && mm && mm.length === 2 && dd && dd.length === 2 && hh && hh.length === 2 && min && min.length === 2) {
      const paddedYyyy = yyyy.padStart(4, '0');
      const paddedMm = mm.padStart(2, '0');
      const paddedDd = dd.padStart(2, '0');
      const paddedHh = hh.padStart(2, '0');
      const paddedMin = min.padStart(2, '0');
      hiddenInput.value = `${paddedYyyy}-${paddedMm}-${paddedDd}T${paddedHh}:${paddedMin}:00`;
    } else {
      hiddenInput.value = '';
    }
  }

  function searchPlans(query) {
    const suggestionsContainer = document.getElementById('plan-suggestions');
    const planIdInput = document.querySelector('#new-creative-form-element input[name="plan_id"]');
    if (!query) {
      suggestionsContainer.style.display = 'none';
      return;
    }
    const lowerCaseQuery = query.toLowerCase();
    const filteredPlans = plansData.filter(p => p.title.toLowerCase().includes(lowerCaseQuery));
    suggestionsContainer.innerHTML = '';
    filteredPlans.forEach(p => {
      const item = document.createElement('div');
      item.className = 'combobox-item';
      item.textContent = p.title;
      item.onclick = () => {
        document.querySelector('#new-creative-form-element input[name="plan_title"]').value = p.title;
        planIdInput.value = p.id;
        suggestionsContainer.style.display = 'none';
      };
      suggestionsContainer.appendChild(item);
    });
    const newItem = document.createElement('div');
    newItem.className = 'combobox-item';
    newItem.innerHTML = `+ 新規作成: <strong>${escapeHtml(query)}</strong>`;
    newItem.onclick = () => {
      document.querySelector('#new-creative-form-element input[name="plan_title"]').value = query;
      planIdInput.value = '';
      suggestionsContainer.style.display = 'none';
    };
    suggestionsContainer.appendChild(newItem);
    suggestionsContainer.style.display = 'block';
  }

  function updateNewTaskDateTimeValue(inputs, hiddenInput) {
    const values = Array.from(inputs).map(input => input.value);
    const [yyyy, mm, dd, hh, min] = values;

    // すべての値が入力されている場合のみ、隠しフィールドに値を設定
    if (yyyy && yyyy.length === 4 && mm && mm.length === 2 && dd && dd.length === 2 && hh && hh.length === 2 && min && min.length === 2) {
      const paddedYyyy = yyyy.padStart(4, '0');
      const paddedMm = mm.padStart(2, '0');
      const paddedDd = dd.padStart(2, '0');
      const paddedHh = hh.padStart(2, '0');
      const paddedMin = min.padStart(2, '0');
      hiddenInput.value = `${paddedYyyy}-${paddedMm}-${paddedDd}T${paddedHh}:${paddedMin}:00`;
    } else {
      hiddenInput.value = '';
    }
  }

  function openGoogleDrivePicker() {
    // OAuthトークンを取得
    callGAS('getOAuthToken')
      .then(token => {
        // Google Picker APIを読み込む
        gapi.load('picker', {
          callback: () => {
            // Pickerを構築
            const picker = new google.picker.PickerBuilder()
              .setOAuthToken(token)
              .addView(google.picker.ViewId.DOCS)
              .setCallback(pickerCallback)
              .setOrigin('https://script.google.com')
              .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
              .build();

            // Pickerを表示
            picker.setVisible(true);
          },
          onerror: (error) => {
            console.error('Picker APIの読み込みに失敗しました:', error);
            alert('Google Picker APIの読み込みに失敗しました。');
          }
        });
      })
      .catch(error => {
        console.error('OAuthトークンの取得に失敗しました:', error);
        alert('OAuthトークンの取得に失敗しました: ' + error.message);
      });
  }

  function pickerCallback(data) {
    if (data[google.picker.Response.ACTION] === google.picker.Action.PICKED) {
      const docs = data[google.picker.Response.DOCUMENTS];

      // 選択されたファイルごとに処理
      docs.forEach(doc => {
        const fileId = doc[google.picker.Document.ID];

        // ファイル情報を取得
        callGAS('getDriveFileInfo', fileId)
          .then(fileInfo => {
            reviewRequestFiles.push({
              file_id: fileInfo.file_id,
              file_name: fileInfo.file_name,
              file_url: fileInfo.file_url || ''
            });
            updateReviewRequestFilesList();
          })
          .catch(error => {
            console.error('ファイル情報の取得に失敗しました:', error);
            alert('ファイルの取得に失敗しました: ' + error.message);
          });
      });
    } else if (data[google.picker.Response.ACTION] === google.picker.Action.CANCEL) {
      // ユーザーがキャンセルした場合、何もしない
    }
  }

  function handleFileUpload(event) {
    const files = Array.from(event.target.files);
    files.forEach(file => {
      // ファイルをbase64エンコードして送信する準備
      const reader = new FileReader();
      reader.onload = (e) => {
        const base64Data = e.target.result.split(',')[1];
        // ファイルをアップロード
        if (currentReviewRequestCreativeId) {
          callGAS('uploadFileToCreativeFolder', currentReviewRequestCreativeId, base64Data, file.name, file.type)
            .then(uploadedFile => {
              reviewRequestFiles.push({
                file_id: uploadedFile.file_id,
                file_name: uploadedFile.file_name,
                file_url: uploadedFile.file_url
              });
              updateReviewRequestFilesList();
            })
            .catch(handleError);
        }
      };
      reader.readAsDataURL(file);
    });
    event.target.value = '';
  }

  function sortTable(tableName, columnKey) {
    const state = tableState[tableName];
    if (state.sortKey === columnKey) {
      state.sortOrder = state.sortOrder === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = columnKey;
      state.sortOrder = 'asc';
    }
    if (tableName) {
      loadTabData(tableName);
    }
  }

  function showFilterMenu(event, tableName, columnKey) {
    event.stopPropagation();
    closeFilterMenu();
    const state = tableState[tableName];
    const data = tableName === SHEET_NAMES.CREATIVES ? creativesData : tableName === SHEET_NAMES.PLANS ? plansData : tableName === SHEET_NAMES.TASKS ? tasksData : membersData;
    const uniqueValues = [...new Set(data.map(item => item[columnKey]))].filter(v => v);
    const popup = document.createElement('div');
    popup.id = 'filter-popup';
    popup.className = 'filter-popup';
    const content = document.createElement('div');
    content.className = 'filter-popup-content';
    uniqueValues.forEach(value => {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = value;
      const currentFilters = state.filters[columnKey] || [];
      if (currentFilters.includes(value)) checkbox.checked = true;
      let labelText = value;
      if (columnKey.endsWith('_key')) {
        const type = columnKey.replace('_key', '').toUpperCase();
        labelText = getConfigLabel(value, type) || value;
      }
      label.appendChild(checkbox);
      label.append(` ${labelText}`);
      content.appendChild(label);
    });
    popup.appendChild(content);
    const buttons = document.createElement('div');
    buttons.className = 'filter-popup-buttons';
    const applyBtn = document.createElement('button');
    applyBtn.textContent = '適用';
    applyBtn.className = 'btn btn-primary';
    applyBtn.onclick = () => {
      const selectedValues = Array.from(content.querySelectorAll('input:checked')).map(cb => cb.value);
      if (selectedValues.length > 0) {
        state.filters[columnKey] = selectedValues;
      } else {
        delete state.filters[columnKey];
      }
      closeFilterMenu();
      if (tableName) {
        loadTabData(tableName);
      }
    };
    const clearBtn = document.createElement('button');
    clearBtn.textContent = 'クリア';
    clearBtn.className = 'btn btn-secondary';
    clearBtn.onclick = () => {
      delete state.filters[columnKey];
      closeFilterMenu();
      const dataLoaders = { [SHEET_NAMES.CREATIVES]: loadcreativesData, [SHEET_NAMES.PLANS]: loadProjectsData, [SHEET_NAMES.TASKS]: loadTasksData, [SHEET_NAMES.MEMBERS]: loadMembersData };
      if (dataLoaders[tableName]) {
        showLoading();
        dataLoaders[tableName]();
      }
    };
    buttons.appendChild(clearBtn);
    buttons.appendChild(applyBtn);
    popup.appendChild(buttons);
    document.body.appendChild(popup);
    const rect = event.target.getBoundingClientRect();
    popup.style.left = `${rect.left}px`;
    popup.style.top = `${rect.bottom + window.scrollY}px`;

  function applyFiltersAndSort(tableName, data) {
    const state = tableState[tableName];
    let processedData = [...data];
    const filterKeys = Object.keys(state.filters);
    if (filterKeys.length > 0) {
      processedData = processedData.filter(item => {
        return filterKeys.every(key => {
          if (!state.filters[key] || state.filters[key].length === 0) return true;
          return state.filters[key].includes(item[key]);
        });
      });
    }
    if (state.sortKey) {
      processedData.sort((a, b) => {
        let valA = a[state.sortKey];
        let valB = b[state.sortKey];
        if (state.sortKey.includes('datetime') || state.sortKey.includes('_at')) {
          valA = valA ? new Date(valA).getTime() : 0;
          valB = valB ? new Date(valB).getTime() : 0;
        }
        if (valA < valB) return state.sortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return state.sortOrder === 'asc' ? 1 : -1;
        return 0;
      });
    }
    return processedData;
  }

  function renderAssignees(assignees) {

  function getConfigLabel(key, type) {
    if (!key || !configData[type]) return key;
    const config = configData[type].find(c => c.config_key === key);
    return config ? config.config_value : key;
  }
  function formatDate(dateString) {
    if (!dateString) return '-';
    try {
      const dt = new Date(dateString);
      const offset = dt.getTimezoneOffset() * 60000;
      const localDate = new Date(dt.getTime() - offset);
      return localDate.toISOString().slice(0, 10);
    } catch (e) { return dateString; }
  }
  function formatDateTimeForDisplay(dateString, includeSeconds = false) {
    if (!dateString) return includeSeconds ? 'yyyy/mm/dd(曜日) hh:mm:ss' : 'yyyy/mm/dd(曜日) hh:mm';
    try {
      const dt = new Date(dateString);
      const year = String(dt.getFullYear()).padStart(4, '0');
      const month = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const weekday = weekdays[dt.getDay()];
      const hours = String(dt.getHours()).padStart(2, '0');
      const minutes = String(dt.getMinutes()).padStart(2, '0');
      const seconds = String(dt.getSeconds()).padStart(2, '0');
      if (includeSeconds) {
        return `${year}/${month}/${day}(${weekday}) ${hours}:${minutes}:${seconds}`;
      }
      return `${year}/${month}/${day}(${weekday}) ${hours}:${minutes}`;
    } catch (e) {
      return includeSeconds ? 'yyyy/mm/dd(曜日) hh:mm:ss' : 'yyyy/mm/dd(曜日) hh:mm';
    }
  }


  function formatDateTimeForInput(dateString) {
    if (!dateString) return '';
    try {
      const dt = new Date(dateString);
      const offset = dt.getTimezoneOffset() * 60000;
      const localDate = new Date(dt.getTime() - offset);
      return localDate.toISOString().slice(0, 16);
    } catch (e) { return ''; }
  }
  function calculateDaysRemaining(dueDateString) {
    if (!dueDateString) return '-';
    try {
      const dueDate = new Date(dueDateString);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      dueDate.setHours(0, 0, 0, 0);
      const diffTime = dueDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      if (diffDays < 0) {
        return `${Math.abs(diffDays)}日超過`;
      } else if (diffDays === 0) {
        return '今日';
      } else {
        return `${diffDays}日`;
      }
    } catch (e) {
      return '-';
    }
  }
  function escapeHtml(text) {
    if (text === null || typeof text === 'undefined') return '';
    return String(text).replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[match]);
  }

  function saveChange(tableName, id, field, newValue, oldValue) {
    if (String(newValue) === String(oldValue)) return;

    showLoading();

    // まずデータ配列を更新する
    const data = tableName === SHEET_NAMES.CREATIVES ? creativesData : tableName === SHEET_NAMES.PLANS ? plansData : tableName === SHEET_NAMES.TASKS ? tasksData : membersData;
    const idKey = tableName === SHEET_NAMES.MEMBERS ? 'member_email' : (tableName === SHEET_NAMES.CREATIVES ? 'id' : (tableName === SHEET_NAMES.TASKS ? 'id' : 'id'));
    const item = data.find(d => String(d[idKey]) === String(id));
    if (item) {
      item[field] = newValue;
    }

    // 次に表示を更新する
    const table = document.getElementById(`${tableName}-table`);
    const row = table.querySelector(`tr[data-id="${id}"]`);
    if (row) {
      const cell = row.querySelector(`td[data-field="${field}"]`);
      if (cell) {
        const header = getHeaderDef(tableName, field);
        let displayValue = newValue;
        if (header && header.configType) {
          displayValue = getConfigLabel(newValue, header.configType);
        } else if (header && header.editType === 'datetime') {
          displayValue = formatDateTimeForDisplay(newValue);
        }
        // editable-container の中の span.editable-text を更新する
        const editableTextSpan = cell.querySelector('.editable-text');
        if (editableTextSpan) {
          editableTextSpan.textContent = displayValue;
        } else {
          // editable-container がない場合（テキストフィールドなど）
          cell.textContent = displayValue;
        }
      }
    }

    // 最後にサーバーに保存する
    callGAS('updateItem', tableName, id, { [field]: newValue })
      .then(success => {
        hideLoading();
        if (!success) {
          handleError({ message: '更新に失敗しました。' });
          // 失敗時はデータを再読み込み
          if (tableName) {
            loadTabData(tableName);
          }
        }
      })
      .catch(err => {
        handleError(err);
        // エラー時はデータを再読み込み
        if (tableName) {
          loadTabData(tableName);
        }
      });
  }

  // ---- テキスト編集 ----
  function switchToEditMode(cell, header, tableName) {
    cell.classList.add('editing');
    const originalValue = cell.textContent;
    cell.innerHTML = '';
    const input = document.createElement('input');
    input.type = 'text';
    input.value = originalValue;
    input.className = 'inline-edit-input';
    cell.appendChild(input);
    input.focus();

    const onSave = () => {
      cell.innerHTML = escapeHtml(input.value);
      cell.classList.remove('editing');
      saveChange(tableName, cell.parentElement.dataset.id, header.key, input.value, originalValue);
    };
    input.addEventListener('blur', onSave);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) input.blur();
      if (e.key === 'Escape') {
        cell.innerHTML = escapeHtml(originalValue);
        cell.classList.remove('editing');
      }
    });
  }

    }

    const data = (tableName === 'creatives' ? creativesData : tableName === 'projects' ? projectsData : membersData);
    const idKey = tableName === 'members' ? 'member_email' : (tableName === 'creatives' ? 'creative_id' : 'project_id');
    const item = data.find(d => String(d[idKey]) === String(id));
    originalValue = item ? item[field] : '';

    // セルを取得
    const table = document.getElementById(`${tableName}-table`);
    const row = table.querySelector(`tr[data-id="${id}"]`);
    if (!row) return;

    const cell = row.querySelector(`td[data-field="${field}"]`);
    if (!cell) return;

    // 既に編集中なら何もしない
    if (cell.classList.contains('editing-datetime-picker')) return;

    // 編集中の状態にする
    cell.classList.add('editing-datetime-picker');

    // 現在の日時を取得してパース
    let dateObj;
    if (originalValue) {
      dateObj = new Date(originalValue);
    } else {
      dateObj = new Date();
    }

    const yyyy = dateObj.getFullYear().toString().padStart(4, '0');
    const mm = (dateObj.getMonth() + 1).toString().padStart(2, '0');
    const dd = dateObj.getDate().toString().padStart(2, '0');
    const hh = dateObj.getHours().toString().padStart(2, '0');
    const min = dateObj.getMinutes().toString().padStart(2, '0');
    const ss = dateObj.getSeconds().toString().padStart(2, '0');

    // 既存のコンテンツを非表示
    const container = cell.querySelector('.editable-container');
    if (container) {
      container.style.display = 'none';
    }

    // カスタム日時入力フィールドを作成
    const editorDiv = document.createElement('div');
    editorDiv.className = 'datetime-custom-editor';
    editorDiv.innerHTML = `
      <input type="text" class="datetime-segment" data-segment="yyyy" maxlength="4" value="${yyyy}" placeholder="yyyy" />
      <span class="datetime-separator">/</span>
      <input type="text" class="datetime-segment" data-segment="mm" maxlength="2" value="${mm}" placeholder="mm" />
      <span class="datetime-separator">/</span>
      <input type="text" class="datetime-segment" data-segment="dd" maxlength="2" value="${dd}" placeholder="dd" />
      <span class="datetime-separator"> </span>
      <input type="text" class="datetime-segment" data-segment="hh" maxlength="2" value="${hh}" placeholder="hh" />
      <span class="datetime-separator">:</span>
      <input type="text" class="datetime-segment" data-segment="min" maxlength="2" value="${min}" placeholder="mm" />
    `;

    cell.appendChild(editorDiv);

    const inputs = editorDiv.querySelectorAll('.datetime-segment');

    // 各inputにイベントリスナーを設定
    inputs.forEach((input, index) => {
      // 数字のみ入力可能
      input.addEventListener('input', (e) => {
        let value = e.target.value.replace(/[^0-9]/g, '');
        const maxLength = parseInt(e.target.getAttribute('maxlength'));

        if (value.length > maxLength) {
          value = value.substring(0, maxLength);
        }

        e.target.value = value;

        // 最大桁数に達したら次のフィールドへ
        if (value.length >= maxLength && index < inputs.length - 1) {
          inputs[index + 1].focus();
          inputs[index + 1].select();
        }
      });

      // キーボード操作
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing) {
          e.preventDefault();
          saveDateTimePicker(cell, tableName, id, field, originalValue, inputs);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          cancelDateTimePicker(cell, container);
        } else if (e.key === 'Tab') {
          // Tabキーは自然な動作を許可
          if (!e.shiftKey && index === inputs.length - 1) {
            // 最後のフィールドでTabを押したら保存
            e.preventDefault();
            saveDateTimePicker(cell, tableName, id, field, originalValue, inputs);
          }
        } else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) {
          // カーソルが末尾にある場合は次のフィールドへ
          if (index < inputs.length - 1) {
            e.preventDefault();
            inputs[index + 1].focus();
            inputs[index + 1].setSelectionRange(0, 0);
          }
        } else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) {
          // カーソルが先頭にある場合は前のフィールドへ
          if (index > 0) {
            e.preventDefault();
            const prevInput = inputs[index - 1];
            prevInput.focus();
            prevInput.setSelectionRange(prevInput.value.length, prevInput.value.length);
          }
        }
      });

      // フォーカスアウト時の処理
      input.addEventListener('blur', (e) => {
        setTimeout(() => {
          // 次のフォーカスがdatetime-segment内かチェック
          const focusedElement = document.activeElement;
          if (!focusedElement || !focusedElement.classList.contains('datetime-segment') || focusedElement.closest('td') !== cell) {
            saveDateTimePicker(cell, tableName, id, field, originalValue, inputs);
          }
        }, 100);
      });
    });

    // 最初のフィールドにフォーカス
    setTimeout(() => {
      inputs[0].focus();
      inputs[0].select();
    }, 50);
  }

  function saveDateTimePicker(cell, tableName, id, field, originalValue, inputs) {
    const values = Array.from(inputs).map(input => input.value);
    const [yyyy, mm, dd, hh, min] = values;

    // バリデーション
    const yearNum = parseInt(yyyy);
    const monthNum = parseInt(mm);
    const dayNum = parseInt(dd);
    const hourNum = parseInt(hh);
    const minuteNum = parseInt(min);

    if (isNaN(yearNum) || yearNum < 1900 || yearNum > 2100 ||
      isNaN(monthNum) || monthNum < 1 || monthNum > 12 ||
      isNaN(dayNum) || dayNum < 1 || dayNum > 31 ||
      isNaN(hourNum) || hourNum < 0 || hourNum > 23 ||
      isNaN(minuteNum) || minuteNum < 0 || minuteNum > 59) {
      alert('無効な日時です');
      cancelDateTimePicker(cell, cell.querySelector('.editable-container'));
      return;
    }

    // ISO形式の日時文字列を作成（秒は00固定）
    const paddedYyyy = yyyy.padStart(4, '0');
    const paddedMm = mm.padStart(2, '0');
    const paddedDd = dd.padStart(2, '0');
    const paddedHh = hh.padStart(2, '0');
    const paddedMin = min.padStart(2, '0');

    const newDateStr = `${paddedYyyy}-${paddedMm}-${paddedDd}T${paddedHh}:${paddedMin}:00`;
    const newDate = new Date(newDateStr);

    if (isNaN(newDate.getTime())) {
      alert('無効な日時です');
      cancelDateTimePicker(cell, cell.querySelector('.editable-container'));
      return;
    }

    const newValueAsISO = newDate.toISOString();

    // エディタを削除
    const editor = cell.querySelector('.datetime-custom-editor');
    if (editor) {
      cell.removeChild(editor);
    }

    // 元の表示に戻す
    const container = cell.querySelector('.editable-container');
    if (container) {
      container.style.display = 'flex';
      const displaySpan = container.querySelector('.editable-text');
      if (displaySpan) {
        displaySpan.textContent = formatDateTimeForDisplay(newValueAsISO);
      }
    }

    cell.classList.remove('editing-datetime-picker');

    // データを保存（変更があった場合のみ）
    if (newValueAsISO !== originalValue) {
      saveChange(tableName, id, field, newValueAsISO, originalValue);
    }
  }

  }

  function cancelTaskDateTimePicker(cell, container) {
    const editor = cell.querySelector('.datetime-custom-editor');
    if (editor) {
      cell.removeChild(editor);
    }
    if (container) {
      container.style.display = 'flex';
    }
    cell.classList.remove('editing-datetime-picker');
  }
  // ============================================
  // ID検索バー
  // ============================================
  function showIdSearchLoading() {
    const container = document.getElementById('id-search-container');
    if (container) {
      container.classList.add('id-search-loading');
    }
  }

  function hideIdSearchLoading() {
    const container = document.getElementById('id-search-container');
    if (container) {
      container.classList.remove('id-search-loading');
    }
  }

  function clearIdSearchInput() {
    const input = document.getElementById('id-search-input');
    if (!input) return;

    input.value = '';
    input.placeholder = 'ID検索';
  }

  // ID検索の共通処理
  function executeIdSearch(searchValue) {
    if (!searchValue) return;

    // 1. "P0001-W0001" 形式の対応 (最後のIDをターゲットにする)
    const parts = searchValue.split('-');
    const targetCode = parts[parts.length - 1];

    handleHeaderCloseClick();

    // 検索実行
    showIdSearchLoading(); // Use existing loading function
    callGAS('searchByCode', targetCode)
      .then(result => {
        hideIdSearchLoading();

        // 検索ボックスからフォーカスを外す
        const input = document.getElementById('id-search-input');
        if (input) {
          input.blur();
          input.value = searchValue; // 入力値はそのまま保持
        }

        if (!result) {
          alert('該当するデータが見つかりません');
          return;
        }

        const { item, tableName } = result;

        // テーブル名に応じた処理
        if (tableName === SHEET_NAMES.TASKS) {
          openTaskDetailOverlay(item.id);
        } else if (tableName === SHEET_NAMES.CREATIVES) {
          openCreativeDetailOverlay(item.id);
        } else if (tableName === SHEET_NAMES.PLANS) {
          openProjectDetailOverlay(item.id);
        } else {
          console.log('Unknown table for search result:', tableName);
          alert('このIDタイプの詳細は表示できません: ' + tableName);
        }
      })
      .catch(err => {
        hideIdSearchLoading();
        handleError(err);
      });
  }

  function handleIdSearchClick() {
    const input = document.getElementById('id-search-input');
    if (!input) return;

    const searchValue = input.value.trim();
    executeIdSearch(searchValue);
  }

  function handleIdSearchBlur(event) {
    const input = event.target;
    console.log('[DEBUG] handleIdSearchBlur triggered', {
      value: input.value,
      activeElement: document.activeElement,
      isInputFocused: document.activeElement === input
    });

    // フォーカスが外れたら、詳細画面が表示中の場合はIDを再設定
    updateIdSearchInput();
  }

  function handleIdSearchInput(event) {
    const input = event.target;
    let value = input.value;

    // 全角英数字を半角に変換
    value = value.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function (s) {
      return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
    });

    // 小文字を大文字に変換
    value = value.toUpperCase();

    // 許可された文字以外を削除 (ハイフンは許可)
    value = value.replace(/[^A-Z0-9-]/g, '');

    if (input.value !== value) {
      input.value = value;
    }
  }

  function handleIdSearchKeydown(event) {
    if (event.key === 'Enter' && !event.isComposing) {
      event.preventDefault();
      const input = event.target;
      const searchValue = input.value.trim();
      executeIdSearch(searchValue);
    }
  }
</script>
