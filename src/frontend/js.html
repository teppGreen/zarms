  function getTaskStatusColor(statusKey) {
    switch (statusKey) {
      case 'TODO':
        return '#BA1A1A'; // 赤色
      case 'IN_PROGRESS':
        return '#FFC107'; // 黄色
      case 'DONE':
        return '#4CAF50'; // 緑色
      default:
        return '#74777F'; // グレー（デフォルト）
    }
  }

  function editTaskField(event, taskId, field, currentValue, configType) {
    event.stopPropagation();
    const container = event.currentTarget;

    if (configType === 'TEXT') {
      // テキスト編集
      const inputContainer = document.createElement('div');
      inputContainer.className = 'popup-editor';
      inputContainer.style.position = 'absolute';
      inputContainer.style.zIndex = '1000';
      inputContainer.style.backgroundColor = 'var(--md-sys-color-surface)';
      inputContainer.style.border = '1px solid var(--md-sys-color-outline)';
      inputContainer.style.borderRadius = '8px';
      inputContainer.style.padding = '8px';
      inputContainer.style.minWidth = '200px';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'popup-editor-input';
      input.value = currentValue || '';
      input.style.width = '100%';
      input.style.padding = '8px';
      input.style.border = 'none';
      input.style.outline = 'none';
      input.style.fontSize = '0.875rem';
      input.style.fontFamily = 'inherit';

      const handleSubmit = () => {
        const newValue = input.value.trim();
        if (newValue !== currentValue) {
          updateTaskField(taskId, field, newValue, currentValue);
        }
        closeAllPopups();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSubmit();
        } else if (e.key === 'Escape') {
          closeAllPopups();
        }
      });

      input.addEventListener('blur', () => {
        setTimeout(handleSubmit, 200);
      });

      inputContainer.appendChild(input);
      createPopup(container, inputContainer);
      input.focus();
      input.select();
    } else if (configType === 'MEMBER') {
      // メンバー選択
      const optionsContainer = document.createElement('div');
      optionsContainer.className = 'popup-editor';
      optionsContainer.style.position = 'absolute';
      optionsContainer.style.zIndex = '1000';
      optionsContainer.style.backgroundColor = 'var(--md-sys-color-surface)';
      optionsContainer.style.border = '1px solid var(--md-sys-color-outline)';
      optionsContainer.style.borderRadius = '8px';
      optionsContainer.style.padding = '8px';
      optionsContainer.style.maxHeight = '200px';
      optionsContainer.style.overflowY = 'auto';

      const members = membersData || [];
      members.forEach(member => {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'popup-editor-option';
        optionDiv.textContent = member.member_name;
        optionDiv.dataset.value = member.member_email;
        if (member.member_email === currentValue) {
          optionDiv.classList.add('selected');
        }
        optionDiv.addEventListener('click', () => {
          updateTaskField(taskId, field, member.member_email, currentValue);
          closeAllPopups();
        });
        optionsContainer.appendChild(optionDiv);
      });

      createPopup(container, optionsContainer);
    } else {
      // ステータス選択
      const optionsContainer = document.createElement('div');
      optionsContainer.className = 'popup-editor';
      optionsContainer.style.position = 'absolute';
      optionsContainer.style.zIndex = '1000';
      optionsContainer.style.backgroundColor = 'var(--md-sys-color-surface)';
      optionsContainer.style.border = '1px solid var(--md-sys-color-outline)';
      optionsContainer.style.borderRadius = '8px';
      optionsContainer.style.padding = '8px';

      const options = configData[configType] || [];
      options.forEach(opt => {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'popup-editor-option';
        optionDiv.textContent = opt.config_value;
        optionDiv.dataset.value = opt.config_key;
        if (opt.config_key === currentValue) {
          optionDiv.classList.add('selected');
        }
        optionDiv.addEventListener('click', () => {
          updateTaskField(taskId, field, opt.config_key, currentValue);
          closeAllPopups();
        });
        optionsContainer.appendChild(optionDiv);
      });

      createPopup(container, optionsContainer);
    }
  }

  function updateTaskField(taskId, field, newValue, oldValue) {
    if (String(newValue) === String(oldValue)) return;

    showLoading();
    callGAS('updateItem', SHEET_NAMES.TASKS, taskId, { [field]: newValue })
      .then(() => {
        hideLoading();
        // Work詳細を再読み込み
        if (currentWorkId) {
          openWorkDetailOverlay(currentWorkId);
        }
      })
      .catch(error => {
        handleError(error);
      });
  }

  function openEditTaskModal(task) {
    // タスク編集モーダルを開く（簡易版：新規作成モーダルを再利用）
    const form = document.getElementById('new-task-form');
    const modalTitle = form.closest('.modal-content').querySelector('.modal-title');

    // モーダルタイトルを変更
    if (modalTitle) {
      modalTitle.textContent = 'タスク編集';
    }

    // フォームをリセット
    form.reset();

    // タスクデータを設定
    form.elements.work_id.value = task.work_id;
    form.elements.task_title.value = task.task_title || '';
    if (form.elements.task_detail) {
      form.elements.task_detail.value = task.task_detail || '';
    }

    // メンバー選択肢を設定
    const assignToSelect = form.elements.assign_to;
    assignToSelect.innerHTML = '<option value="">選択してください</option>';
    if (membersData && membersData.length > 0) {
      membersData.forEach(member => {
        const option = document.createElement('option');
        option.value = member.member_email;
        option.textContent = member.member_name;
        if (member.member_email === task.assign_to) {
          option.selected = true;
        }
        assignToSelect.appendChild(option);
      });
    }

    // ステータス選択肢を設定
    const statusSelect = form.elements.status_key;
    statusSelect.innerHTML = '<option value="">選択してください</option>';
    const taskStatuses = configData['TASK_STATUS'] || [];
    taskStatuses.forEach(status => {
      const option = document.createElement('option');
      option.value = status.config_key;
      option.textContent = status.config_value;
      if (status.config_key === task.status_key) {
        option.selected = true;
      }
      statusSelect.appendChild(option);
    });

    // 優先度選択肢を設定
    const prioritySelect = form.elements.priority_key;
    if (prioritySelect) {
      prioritySelect.innerHTML = '<option value="">選択してください</option>';
      const priorities = configData['TASK_PRIORITY'] || [];
      priorities.forEach(priority => {
        const option = document.createElement('option');
        option.value = priority.config_key;
        option.textContent = priority.config_value;
        if (priority.config_key === task.priority_key) {
          option.selected = true;
        }
        prioritySelect.appendChild(option);
      });
    }

    // 日時を設定
    if (task.planned_end_datetime && form.elements.planned_end_datetime) {
      form.elements.planned_end_datetime.value = formatDateTimeForInput(task.planned_end_datetime);
    }

    // 送信ボタンのテキストを変更
    const submitButton = form.querySelector('button[type="submit"]');
    if (submitButton) {
      submitButton.textContent = '更新';
    }

    // フォームの送信ハンドラを一時的に変更
    const originalOnsubmit = form.onsubmit;
    form.onsubmit = (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const taskData = Object.fromEntries(formData.entries());
      taskData.task_id = task.task_id;

      showModalLoading('modal-new-task', 'タスクを更新しています');
      callGAS('updateTask', task.task_id, taskData)
        .then(() => {
          showModalSuccess('modal-new-task', 'タスクを更新しました', () => {
            if (currentWorkId) {
              openWorkDetailOverlay(currentWorkId);
            }
          });
          // 元のハンドラに戻す
          form.onsubmit = originalOnsubmit;
          if (modalTitle) {
            modalTitle.textContent = '新規タスク作成';
          }
          if (submitButton) {
            submitButton.textContent = '作成';
          }
        })
        .catch(error => {
          handleError(error);
          resetModalState('modal-new-task');
        });
    };

    openModal('modal-new-task');
  }

      if (!currentUser) return members;

      const currentUserEmail = currentUser.member_email;
      const currentUserTeam = currentUser.member_team_key;

      const myself = [];

      const others = [];

      members.forEach(member => {
        if (member.member_email === currentUserEmail) {
          myself.push(member);

          sameTeam.push(member);
        } else {
          others.push(member);

      // その他は名前降順でソート
      others.sort((a, b) => {
        const nameA = (a.member_name || '').toLowerCase();
        const nameB = (b.member_name || '').toLowerCase();
        return nameB.localeCompare(nameA, 'ja');
      });

      // 順番に結合
      return [...myself, ...sameTeam, ...others];

    const sortedAvailableMembers = sortMembers(availableMembers);
    renderMembers(sortedAvailableMembers);

    // 検索機能
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = availableMembers.filter(m =>
        m.member_name.toLowerCase().includes(query) ||
        (m.member_email && m.member_email.toLowerCase().includes(query))
      );
      renderMembers(filtered);
    });

    // 位置を設定
    const rect = buttonElement.getBoundingClientRect();
    dropdown.style.left = `${rect.right}px`;
    dropdown.style.top = `${rect.top}px`;

    document.body.appendChild(dropdown);

    // 外側をクリックしたら閉じる
    const closeOnOutsideClick = (e) => {
      if (!dropdown.contains(e.target) && e.target !== buttonElement) {
        dropdown.remove();
        document.removeEventListener('click', closeOnOutsideClick);
      }
    };
    setTimeout(() => {
      document.addEventListener('click', closeOnOutsideClick);
    }, 0);

    // 検索入力にフォーカス
    searchInput.focus();
  }

  function buildNewCreativeForm() {
    const formContainer = document.getElementById('new-creative-form');
    const creativeTypes = configData['CREATIVE_TYPE'] || [];
    const creativeTypeOptions = creativeTypes.map(wt => `<option value="${wt.config_key}">${wt.config_value}</option>`).join('');
    formContainer.innerHTML = `<form id="new-creative-form-element" onsubmit="submitNewCreative(event)"> <div class="form-group"> <label class="form-label">企画タイトル</label> <div id="plan-combobox" class="combobox-container"> <input type="text" name="plan_title" class="input-field" required placeholder="既存の企画タイトルで検索、または新規作成" oninput="searchPlans(this.value)" autocomplete="off"> <input type="hidden" name="plan_id"> <div id="plan-suggestions" class="combobox-suggestions"></div> </div> </div> <div class="form-group"> <label class="form-label">制作タイトル</label> <input type="text" name="title" class="input-field" required> </div> <div class="form-group"> <label class="form-label">制作種別</label> <select name="creative_type_key" class="input-field" onchange="updateRegulationPreset(this.value)"> <option value="">選択してください</option> ${creativeTypeOptions} </select> </div> <div class="form-group"> <label class="form-label">納品期限</label> <div id="new-creative-datetime-container" class="datetime-custom-editor" style="display: flex; align-items: center; gap: 4px; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; background-color: white;"> <input type="text" class="datetime-segment" data-segment="yyyy" maxlength="4" value="" placeholder="yyyy" style="width: 60px; text-align: center; border: none; outline: none; background: transparent;"> <span class="datetime-separator">/</span> <input type="text" class="datetime-segment" data-segment="mm" maxlength="2" value="" placeholder="mm" style="width: 40px; text-align: center; border: none; outline: none; background: transparent;"> <span class="datetime-separator">/</span> <input type="text" class="datetime-segment" data-segment="dd" maxlength="2" value="" placeholder="dd" style="width: 40px; text-align: center; border: none; outline: none; background: transparent;"> <span class="datetime-separator"> </span> <input type="text" class="datetime-segment" data-segment="hh" maxlength="2" value="" placeholder="hh" style="width: 40px; text-align: center; border: none; outline: none; background: transparent;"> <span class="datetime-separator">:</span> <input type="text" class="datetime-segment" data-segment="min" maxlength="2" value="" placeholder="mm" style="width: 40px; text-align: center; border: none; outline: none; background: transparent;"> </div> <input type="hidden" name="deadline_at" id="new-creative-deadline-at"> </div> <div class="form-group"> <label class="form-label">制作物の概要</label> <textarea name="description" class="input-field" rows="4"></textarea> </div> <div class="modal-footer"> <button type="button" class="btn btn-secondary btn-cancel" onclick="closeModal('modal-new-creative')">キャンセル</button> <button type="submit" class="btn btn-primary">作成</button> </div> </form>`;

    // IME変換確定時のEnterキーを無視する処理を追加
    const form = document.getElementById('new-creative-form-element');
    if (form) {
      const textInputs = form.querySelectorAll('input[type="text"], textarea');
      textInputs.forEach(input => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && e.isComposing) {
            e.stopPropagation();
          }
        });
      });

      // カスタム日時入力フィールドの設定
      const datetimeContainer = document.getElementById('new-creative-datetime-container');
      const hiddenInput = document.getElementById('new-creative-deadline-at');
      if (datetimeContainer && hiddenInput) {
        const inputs = datetimeContainer.querySelectorAll('.datetime-segment');

        inputs.forEach((input, index) => {
          // 数字のみ入力可能
          input.addEventListener('input', (e) => {
            let value = e.target.value.replace(/[^0-9]/g, '');
            const maxLength = parseInt(e.target.getAttribute('maxlength'));

            if (value.length > maxLength) {
              value = value.substring(0, maxLength);
            }

            e.target.value = value;

            // 最大桁数に達したら次のフィールドへ
            if (value.length >= maxLength && index < inputs.length - 1) {
              inputs[index + 1].focus();
              inputs[index + 1].select();
            }

            // 隠しフィールドに値を更新
            updateNewWorkDateTimeValue(inputs, hiddenInput);
          });

          // キーボード操作
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) {
              e.preventDefault();
              // Enterキーで日時を確定（最後のフィールドの場合、またはすべてのフィールドが入力されている場合）
              if (index === inputs.length - 1) {
                // 最後のフィールドでEnterキーを押した場合、フォーカスを外して確定
                input.blur();
              } else {
                // 次のフィールドに移動
                if (index < inputs.length - 1) {
                  inputs[index + 1].focus();
                  inputs[index + 1].select();
                }
              }
            } else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) {
              // カーソルが末尾にある場合は次のフィールドへ
              if (index < inputs.length - 1) {
                e.preventDefault();
                inputs[index + 1].focus();
                inputs[index + 1].setSelectionRange(0, 0);
              }
            } else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) {
              // カーソルが先頭にある場合は前のフィールドへ
              if (index > 0) {
                e.preventDefault();
                const prevInput = inputs[index - 1];
                prevInput.focus();
                prevInput.setSelectionRange(prevInput.value.length, prevInput.value.length);
              }
            }
          });
        });
      }
    }
  }

  function updateNewWorkDateTimeValue(inputs, hiddenInput) {
    const values = Array.from(inputs).map(input => input.value);
    const [yyyy, mm, dd, hh, min] = values;

    // すべての値が入力されている場合のみ、隠しフィールドに値を設定
    if (yyyy && yyyy.length === 4 && mm && mm.length === 2 && dd && dd.length === 2 && hh && hh.length === 2 && min && min.length === 2) {
      const paddedYyyy = yyyy.padStart(4, '0');
      const paddedMm = mm.padStart(2, '0');
      const paddedDd = dd.padStart(2, '0');
      const paddedHh = hh.padStart(2, '0');
      const paddedMin = min.padStart(2, '0');
      hiddenInput.value = `${paddedYyyy}-${paddedMm}-${paddedDd}T${paddedHh}:${paddedMin}:00`;
    } else {
      hiddenInput.value = '';
    }
  }

  function updateRegulationPreset(workTypeKey) {
    if (!workTypeKey) return;
    const workType = (configData['CREATIVE_TYPE'] || []).find(wt => wt.config_key === workTypeKey);
    if (workType && workType.config_preset_value) {
      document.querySelector('textarea[name="work_detail_regulation"]').value = workType.config_preset_value;
    }
  }

  function searchPlans(query) {
    const suggestionsContainer = document.getElementById('plan-suggestions');
    const planIdInput = document.querySelector('#new-creative-form-element input[name="plan_id"]');
    if (!query) {
      suggestionsContainer.style.display = 'none';
      return;
    }
    const lowerCaseQuery = query.toLowerCase();
    const filteredPlans = plansData.filter(p => p.title.toLowerCase().includes(lowerCaseQuery));
    suggestionsContainer.innerHTML = '';
    filteredPlans.forEach(p => {
      const item = document.createElement('div');
      item.className = 'combobox-item';
      item.textContent = p.title;
      item.onclick = () => {
        document.querySelector('#new-creative-form-element input[name="plan_title"]').value = p.title;
        planIdInput.value = p.id;
        suggestionsContainer.style.display = 'none';
      };
      suggestionsContainer.appendChild(item);
    });
    const newItem = document.createElement('div');
    newItem.className = 'combobox-item';
    newItem.innerHTML = `+ 新規作成: <strong>${escapeHtml(query)}</strong>`;
    newItem.onclick = () => {
      document.querySelector('#new-creative-form-element input[name="plan_title"]').value = query;
      planIdInput.value = '';
      suggestionsContainer.style.display = 'none';
    };
    suggestionsContainer.appendChild(newItem);
    suggestionsContainer.style.display = 'block';
  }

  function openNewTaskModal(workId) {

    const textInputs = form.querySelectorAll('input[type="text"], textarea');
    textInputs.forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.isComposing) {
          e.stopPropagation();
        }
      });
    });

    // datetime-localをカスタム日時入力フィールドに置き換え
    const datetimeInput = form.querySelector('input[name="planned_end_datetime"]');
    if (datetimeInput && datetimeInput.type === 'datetime-local') {
      const formGroup = datetimeInput.closest('.form-group');
      if (formGroup) {
        const label = formGroup.querySelector('label');
        const labelText = label ? label.textContent : '終了予定日';

        // 既存のdatetime-localを非表示にして、カスタム日時入力フィールドを作成
        datetimeInput.style.display = 'none';
        datetimeInput.setAttribute('data-original-type', 'datetime-local');

        // カスタム日時入力フィールドのコンテナを作成
        let datetimeContainer = formGroup.querySelector('#new-task-datetime-container');
        if (!datetimeContainer) {
          datetimeContainer = document.createElement('div');
          datetimeContainer.id = 'new-task-datetime-container';
          datetimeContainer.className = 'datetime-custom-editor';
          datetimeContainer.style.cssText = 'display: flex; align-items: center; gap: 4px; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; background-color: white;';
          datetimeContainer.innerHTML = `
            <input type="text" class="datetime-segment" data-segment="yyyy" maxlength="4" value="" placeholder="yyyy" style="width: 60px; text-align: center; border: none; outline: none; background: transparent;">
            <span class="datetime-separator">/</span>
            <input type="text" class="datetime-segment" data-segment="mm" maxlength="2" value="" placeholder="mm" style="width: 40px; text-align: center; border: none; outline: none; background: transparent;">
            <span class="datetime-separator">/</span>
            <input type="text" class="datetime-segment" data-segment="dd" maxlength="2" value="" placeholder="dd" style="width: 40px; text-align: center; border: none; outline: none; background: transparent;">
            <span class="datetime-separator"> </span>
            <input type="text" class="datetime-segment" data-segment="hh" maxlength="2" value="" placeholder="hh" style="width: 40px; text-align: center; border: none; outline: none; background: transparent;">
            <span class="datetime-separator">:</span>
            <input type="text" class="datetime-segment" data-segment="min" maxlength="2" value="" placeholder="mm" style="width: 40px; text-align: center; border: none; outline: none; background: transparent;">
          `;
          datetimeInput.parentNode.insertBefore(datetimeContainer, datetimeInput);
        }

        // カスタム日時入力フィールドの設定
        const inputs = datetimeContainer.querySelectorAll('.datetime-segment');

        inputs.forEach((input, index) => {
          // 数字のみ入力可能
          input.addEventListener('input', (e) => {
            let value = e.target.value.replace(/[^0-9]/g, '');
            const maxLength = parseInt(e.target.getAttribute('maxlength'));

            if (value.length > maxLength) {
              value = value.substring(0, maxLength);
            }

            e.target.value = value;

            // 最大桁数に達したら次のフィールドへ
            if (value.length >= maxLength && index < inputs.length - 1) {
              inputs[index + 1].focus();
              inputs[index + 1].select();
            }

            // 隠しフィールドに値を更新
            updateNewTaskDateTimeValue(inputs, datetimeInput);
          });

          // キーボード操作
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) {
              e.preventDefault();
              // Enterキーで日時を確定（最後のフィールドの場合、またはすべてのフィールドが入力されている場合）
              if (index === inputs.length - 1) {
                // 最後のフィールドでEnterキーを押した場合、フォーカスを外して確定
                input.blur();
              } else {
                // 次のフィールドに移動
                if (index < inputs.length - 1) {
                  inputs[index + 1].focus();
                  inputs[index + 1].select();
                }
              }
            } else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) {
              // カーソルが末尾にある場合は次のフィールドへ
              if (index < inputs.length - 1) {
                e.preventDefault();
                inputs[index + 1].focus();
                inputs[index + 1].setSelectionRange(0, 0);
              }
            } else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) {
              // カーソルが先頭にある場合は前のフィールドへ
              if (index > 0) {
                e.preventDefault();
                const prevInput = inputs[index - 1];
                prevInput.focus();
                prevInput.setSelectionRange(prevInput.value.length, prevInput.value.length);
              }
            }
          });
        });
      }
    }

    // メンバー選択肢を設定
    const assignToSelect = form.elements.assign_to;
    assignToSelect.innerHTML = '<option value="">選択してください</option>';
    if (membersData && membersData.length > 0) {
      membersData.forEach(member => {
        const option = document.createElement('option');
        option.value = member.member_email;
        option.textContent = member.member_name;
        assignToSelect.appendChild(option);
      });
    }

    // ステータス選択肢を設定
    const statusSelect = form.elements.status_key;
    statusSelect.innerHTML = '<option value="">選択してください</option>';
    const taskStatuses = configData['TASK_STATUS'] || [];
    taskStatuses.forEach(status => {
      const option = document.createElement('option');
      option.value = status.config_key;
      option.textContent = status.config_value;
      if (status.config_key === 'TODO') {
        option.selected = true;
      }
      statusSelect.appendChild(option);
    });

    // 優先度選択肢を設定
    const prioritySelect = form.elements.priority_key;
    prioritySelect.innerHTML = '<option value="">選択してください</option>';
    const priorities = configData['TASK_PRIORITY'] || [];

  function updateNewTaskDateTimeValue(inputs, hiddenInput) {
    const values = Array.from(inputs).map(input => input.value);
    const [yyyy, mm, dd, hh, min] = values;

    // すべての値が入力されている場合のみ、隠しフィールドに値を設定
    if (yyyy && yyyy.length === 4 && mm && mm.length === 2 && dd && dd.length === 2 && hh && hh.length === 2 && min && min.length === 2) {
      const paddedYyyy = yyyy.padStart(4, '0');
      const paddedMm = mm.padStart(2, '0');
      const paddedDd = dd.padStart(2, '0');
      const paddedHh = hh.padStart(2, '0');
      const paddedMin = min.padStart(2, '0');
      hiddenInput.value = `${paddedYyyy}-${paddedMm}-${paddedDd}T${paddedHh}:${paddedMin}:00`;
    } else {
      hiddenInput.value = '';
    }
  }

  function openGoogleDrivePicker() {
    // OAuthトークンを取得
    callGAS('getOAuthToken')
      .then(token => {
        // Google Picker APIを読み込む
        gapi.load('picker', {
          callback: () => {
            // Pickerを構築
            const picker = new google.picker.PickerBuilder()
              .setOAuthToken(token)
              .addView(google.picker.ViewId.DOCS)
              .setCallback(pickerCallback)
              .setOrigin('https://script.google.com')
              .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
              .build();

            // Pickerを表示
            picker.setVisible(true);
          },
          onerror: (error) => {
            console.error('Picker APIの読み込みに失敗しました:', error);
            alert('Google Picker APIの読み込みに失敗しました。');
          }
        });
      })
      .catch(error => {
        console.error('OAuthトークンの取得に失敗しました:', error);
        alert('OAuthトークンの取得に失敗しました: ' + error.message);
      });
  }

  function pickerCallback(data) {
    if (data[google.picker.Response.ACTION] === google.picker.Action.PICKED) {
      const docs = data[google.picker.Response.DOCUMENTS];

      // 選択されたファイルごとに処理
      docs.forEach(doc => {
        const fileId = doc[google.picker.Document.ID];

        // ファイル情報を取得
        callGAS('getDriveFileInfo', fileId)
          .then(fileInfo => {
            reviewRequestFiles.push({
              file_id: fileInfo.file_id,
              file_name: fileInfo.file_name,
              file_url: fileInfo.file_url || ''
            });
            updateReviewRequestFilesList();
          })
          .catch(error => {
            console.error('ファイル情報の取得に失敗しました:', error);
            alert('ファイルの取得に失敗しました: ' + error.message);
          });
      });
    } else if (data[google.picker.Response.ACTION] === google.picker.Action.CANCEL) {
      // ユーザーがキャンセルした場合、何もしない
    }
  }

  function handleFileUpload(event) {
    const files = Array.from(event.target.files);
    files.forEach(file => {
      // ファイルをbase64エンコードして送信する準備
      const reader = new FileReader();
      reader.onload = (e) => {
        const base64Data = e.target.result.split(',')[1];
        // ファイルをアップロード
        if (currentReviewRequestWorkId) {
          callGAS('uploadFileToWorkFolder', currentReviewRequestWorkId, base64Data, file.name, file.type)
            .then(uploadedFile => {
              reviewRequestFiles.push({
                file_id: uploadedFile.file_id,
                file_name: uploadedFile.file_name,
                file_url: uploadedFile.file_url
              });
              updateReviewRequestFilesList();
            })
            .catch(handleError);
        }
      };
      reader.readAsDataURL(file);
    });
    event.target.value = '';
  }

  function applyFiltersAndSort(tableName, data) {
    const state = tableState[tableName];
    let processedData = [...data];
    const filterKeys = Object.keys(state.filters);
    if (filterKeys.length > 0) {
      processedData = processedData.filter(item => {
        return filterKeys.every(key => {
          if (!state.filters[key] || state.filters[key].length === 0) return true;
          return state.filters[key].includes(item[key]);
        });
      });
    }
    if (state.sortKey) {
      processedData.sort((a, b) => {
        let valA = a[state.sortKey];
        let valB = b[state.sortKey];
        if (state.sortKey.includes('datetime') || state.sortKey.includes('_at')) {
          valA = valA ? new Date(valA).getTime() : 0;
          valB = valB ? new Date(valB).getTime() : 0;
        }
        if (valA < valB) return state.sortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return state.sortOrder === 'asc' ? 1 : -1;
        return 0;
      });
    }
    return processedData;
  }

  function formatDate(dateString) {
    if (!dateString) return '-';
    try {
      const dt = new Date(dateString);
      const offset = dt.getTimezoneOffset() * 60000;
      const localDate = new Date(dt.getTime() - offset);
      return localDate.toISOString().slice(0, 10);
    } catch (e) { return dateString; }
  }
  function formatDateTimeForDisplay(dateString, includeSeconds = false) {
    if (!dateString) return includeSeconds ? 'yyyy/mm/dd(曜日) hh:mm:ss' : 'yyyy/mm/dd(曜日) hh:mm';
    try {
      const dt = new Date(dateString);
      const year = String(dt.getFullYear()).padStart(4, '0');
      const month = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const weekday = weekdays[dt.getDay()];
      const hours = String(dt.getHours()).padStart(2, '0');
      const minutes = String(dt.getMinutes()).padStart(2, '0');
      const seconds = String(dt.getSeconds()).padStart(2, '0');
      if (includeSeconds) {
        return `${year}/${month}/${day}(${weekday}) ${hours}:${minutes}:${seconds}`;
      }
      return `${year}/${month}/${day}(${weekday}) ${hours}:${minutes}`;
    } catch (e) {
      return includeSeconds ? 'yyyy/mm/dd(曜日) hh:mm:ss' : 'yyyy/mm/dd(曜日) hh:mm';
    }
  }

  function formatDateTimeForHome(dateString) {
    if (!dateString) return 'yyyy/mm/dd(曜日) hh:mm';
    try {
      const dt = new Date(dateString);
      const year = dt.getFullYear();
      const month = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const weekday = weekdays[dt.getDay()];
      const hours = String(dt.getHours()).padStart(2, '0');
      const minutes = String(dt.getMinutes()).padStart(2, '0');
      return `${year}/${month}/${day}(${weekday}) ${hours}:${minutes}`;
    } catch (e) {
      return 'yyyy/mm/dd(曜日) hh:mm';
    }
  }
  function formatDateTimeForInput(dateString) {
    if (!dateString) return '';
    try {
      const dt = new Date(dateString);
      const offset = dt.getTimezoneOffset() * 60000;
      const localDate = new Date(dt.getTime() - offset);
      return localDate.toISOString().slice(0, 16);
    } catch (e) { return ''; }
  }
  function calculateDaysRemaining(dueDateString) {
    if (!dueDateString) return '-';
    try {
      const dueDate = new Date(dueDateString);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      dueDate.setHours(0, 0, 0, 0);
      const diffTime = dueDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      if (diffDays < 0) {
        return `${Math.abs(diffDays)}日超過`;
      } else if (diffDays === 0) {
        return '今日';
      } else {
        return `${diffDays}日`;
      }
    } catch (e) {
      return '-';
    }
  }
  function escapeHtml(text) {
    if (text === null || typeof text === 'undefined') return '';
    return String(text).replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[match]);
  }

  function saveChange(tableName, id, field, newValue, oldValue) {
    if (String(newValue) === String(oldValue)) return;

    showLoading();

    // まずデータ配列を更新する
    const data = tableName === SHEET_NAMES.CREATIVES ? worksData : tableName === SHEET_NAMES.PLANS ? projectsData : tableName === SHEET_NAMES.TASKS ? tasksData : membersData;
    const idKey = tableName === SHEET_NAMES.MEMBERS ? 'member_email' : (tableName === SHEET_NAMES.CREATIVES ? 'work_id' : (tableName === SHEET_NAMES.TASKS ? 'task_id' : 'project_id'));
    const item = data.find(d => String(d[idKey]) === String(id));
    if (item) {
      item[field] = newValue;
    }

    // 次に表示を更新する
    const table = document.getElementById(`${tableName}-table`);
    const row = table.querySelector(`tr[data-id="${id}"]`);
    if (row) {
      const cell = row.querySelector(`td[data-field="${field}"]`);
      if (cell) {
        const header = getHeaderDef(tableName, field);
        let displayValue = newValue;
        if (header && header.configType) {
          displayValue = getConfigLabel(newValue, header.configType);
        } else if (header && header.editType === 'datetime') {
          displayValue = formatDateTimeForDisplay(newValue);
        }
        // editable-container の中の span.editable-text を更新する
        const editableTextSpan = cell.querySelector('.editable-text');
        if (editableTextSpan) {
          editableTextSpan.textContent = displayValue;
        } else {
          // editable-container がない場合（テキストフィールドなど）
          cell.textContent = displayValue;
        }
      }
    }

    // 最後にサーバーに保存する
    callGAS('updateItem', tableName, id, { [field]: newValue })
      .then(success => {
        hideLoading();
        if (!success) {
          handleError({ message: '更新に失敗しました。' });
          // 失敗時はデータを再読み込み
          const dataLoaders = { [SHEET_NAMES.CREATIVES]: () => loadData(SHEET_NAMES.CREATIVES), [SHEET_NAMES.PLANS]: () => loadData(SHEET_NAMES.PLANS), [SHEET_NAMES.TASKS]: () => loadData(SHEET_NAMES.TASKS), [SHEET_NAMES.MEMBERS]: () => loadData(SHEET_NAMES.MEMBERS) };
          if (dataLoaders[tableName]) dataLoaders[tableName]();
        }
      })
      .catch(err => {
        handleError(err);
        // エラー時はデータを再読み込み
        const dataLoaders = { [SHEET_NAMES.CREATIVES]: () => loadData(SHEET_NAMES.CREATIVES), [SHEET_NAMES.PLANS]: () => loadData(SHEET_NAMES.PLANS), [SHEET_NAMES.TASKS]: () => loadData(SHEET_NAMES.TASKS), [SHEET_NAMES.MEMBERS]: () => loadData(SHEET_NAMES.MEMBERS) };
        if (dataLoaders[tableName]) dataLoaders[tableName]();
      });
  }

  // ---- テキスト編集 ----
  function switchToEditMode(cell, header, tableName) {
    cell.classList.add('editing');
    const originalValue = cell.textContent;
    cell.innerHTML = '';
    const input = document.createElement('input');
    input.type = 'text';
    input.value = originalValue;
    input.className = 'inline-edit-input';
    cell.appendChild(input);
    input.focus();

    const onSave = () => {
      cell.innerHTML = escapeHtml(input.value);
      cell.classList.remove('editing');
      saveChange(tableName, cell.parentElement.dataset.id, header.key, input.value, originalValue);
    };
    input.addEventListener('blur', onSave);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) input.blur();
      if (e.key === 'Escape') {
        cell.innerHTML = escapeHtml(originalValue);
        cell.classList.remove('editing');
      }
    });
  }

  // ---- 日付ピッカーを開く ----
  function openDateTimePicker(event, tableName, id, field) {
    event.stopPropagation();
    event.preventDefault();

    let originalValue = '';
    if (tableName === 'task') {
      // タスクの場合は、現在開いているWork詳細からタスクデータを取得
      const container = document.getElementById('work-tasks-container');
      const row = container.querySelector(`tr[data-task-id="${id}"]`);
      if (row) {
        // タスクデータを再取得する必要がある場合は、getWorkByIdを呼び出す
        // 簡易版として、現在の表示から値を取得
        const cell = row.querySelector(`td[data-field="${field}"]`);
        if (cell) {
          const textSpan = cell.querySelector('.editable-text');
          if (textSpan) {
            // 表示されているテキストから日時を推測するのは難しいので、
            // バックエンドから再取得する
            if (currentWorkId) {
              callGAS('getWorkById', currentWorkId).then(work => {
                const task = work.tasks.find(t => t.task_id === id);
                if (task) {
                  openDateTimePickerForTask(id, field, task[field] || '');
                }
              });
              return;
            }
          }
        }
      }
      return;
    }

    const data = (tableName === 'works' ? worksData : tableName === 'projects' ? projectsData : membersData);
    const idKey = tableName === 'members' ? 'member_email' : (tableName === 'works' ? 'work_id' : 'project_id');
    const item = data.find(d => String(d[idKey]) === String(id));
    originalValue = item ? item[field] : '';

    // セルを取得
    const table = document.getElementById(`${tableName}-table`);
    const row = table.querySelector(`tr[data-id="${id}"]`);
    if (!row) return;

    const cell = row.querySelector(`td[data-field="${field}"]`);
    if (!cell) return;

    // 既に編集中なら何もしない
    if (cell.classList.contains('editing-datetime-picker')) return;

    // 編集中の状態にする
    cell.classList.add('editing-datetime-picker');

    // 現在の日時を取得してパース
    let dateObj;
    if (originalValue) {
      dateObj = new Date(originalValue);
    } else {
      dateObj = new Date();
    }

    const yyyy = dateObj.getFullYear().toString().padStart(4, '0');
    const mm = (dateObj.getMonth() + 1).toString().padStart(2, '0');
    const dd = dateObj.getDate().toString().padStart(2, '0');
    const hh = dateObj.getHours().toString().padStart(2, '0');
    const min = dateObj.getMinutes().toString().padStart(2, '0');
    const ss = dateObj.getSeconds().toString().padStart(2, '0');

    // 既存のコンテンツを非表示
    const container = cell.querySelector('.editable-container');
    if (container) {
      container.style.display = 'none';
    }

    // カスタム日時入力フィールドを作成
    const editorDiv = document.createElement('div');
    editorDiv.className = 'datetime-custom-editor';
    editorDiv.innerHTML = `
      <input type="text" class="datetime-segment" data-segment="yyyy" maxlength="4" value="${yyyy}" placeholder="yyyy" />
      <span class="datetime-separator">/</span>
      <input type="text" class="datetime-segment" data-segment="mm" maxlength="2" value="${mm}" placeholder="mm" />
      <span class="datetime-separator">/</span>
      <input type="text" class="datetime-segment" data-segment="dd" maxlength="2" value="${dd}" placeholder="dd" />
      <span class="datetime-separator"> </span>
      <input type="text" class="datetime-segment" data-segment="hh" maxlength="2" value="${hh}" placeholder="hh" />
      <span class="datetime-separator">:</span>
      <input type="text" class="datetime-segment" data-segment="min" maxlength="2" value="${min}" placeholder="mm" />
    `;

    cell.appendChild(editorDiv);

    const inputs = editorDiv.querySelectorAll('.datetime-segment');

    // 各inputにイベントリスナーを設定
    inputs.forEach((input, index) => {
      // 数字のみ入力可能
      input.addEventListener('input', (e) => {
        let value = e.target.value.replace(/[^0-9]/g, '');
        const maxLength = parseInt(e.target.getAttribute('maxlength'));

        if (value.length > maxLength) {
          value = value.substring(0, maxLength);
        }

        e.target.value = value;

        // 最大桁数に達したら次のフィールドへ
        if (value.length >= maxLength && index < inputs.length - 1) {
          inputs[index + 1].focus();
          inputs[index + 1].select();
        }
      });

      // キーボード操作
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing) {
          e.preventDefault();
          saveDateTimePicker(cell, tableName, id, field, originalValue, inputs);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          cancelDateTimePicker(cell, container);
        } else if (e.key === 'Tab') {
          // Tabキーは自然な動作を許可
          if (!e.shiftKey && index === inputs.length - 1) {
            // 最後のフィールドでTabを押したら保存
            e.preventDefault();
            saveDateTimePicker(cell, tableName, id, field, originalValue, inputs);
          }
        } else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) {
          // カーソルが末尾にある場合は次のフィールドへ
          if (index < inputs.length - 1) {
            e.preventDefault();
            inputs[index + 1].focus();
            inputs[index + 1].setSelectionRange(0, 0);
          }
        } else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) {
          // カーソルが先頭にある場合は前のフィールドへ
          if (index > 0) {
            e.preventDefault();
            const prevInput = inputs[index - 1];
            prevInput.focus();
            prevInput.setSelectionRange(prevInput.value.length, prevInput.value.length);
          }
        }
      });

      // フォーカスアウト時の処理
      input.addEventListener('blur', (e) => {
        setTimeout(() => {
          // 次のフォーカスがdatetime-segment内かチェック
          const focusedElement = document.activeElement;
          if (!focusedElement || !focusedElement.classList.contains('datetime-segment') || focusedElement.closest('td') !== cell) {
            saveDateTimePicker(cell, tableName, id, field, originalValue, inputs);
          }
        }, 100);
      });
    });

    // 最初のフィールドにフォーカス
    setTimeout(() => {
      inputs[0].focus();
      inputs[0].select();
    }, 50);
  }

  function saveDateTimePicker(cell, tableName, id, field, originalValue, inputs) {
    const values = Array.from(inputs).map(input => input.value);
    const [yyyy, mm, dd, hh, min] = values;

    // バリデーション
    const yearNum = parseInt(yyyy);
    const monthNum = parseInt(mm);
    const dayNum = parseInt(dd);
    const hourNum = parseInt(hh);
    const minuteNum = parseInt(min);

    if (isNaN(yearNum) || yearNum < 1900 || yearNum > 2100 ||
      isNaN(monthNum) || monthNum < 1 || monthNum > 12 ||
      isNaN(dayNum) || dayNum < 1 || dayNum > 31 ||
      isNaN(hourNum) || hourNum < 0 || hourNum > 23 ||
      isNaN(minuteNum) || minuteNum < 0 || minuteNum > 59) {
      alert('無効な日時です');
      cancelDateTimePicker(cell, cell.querySelector('.editable-container'));
      return;
    }

    // ISO形式の日時文字列を作成（秒は00固定）
    const paddedYyyy = yyyy.padStart(4, '0');
    const paddedMm = mm.padStart(2, '0');
    const paddedDd = dd.padStart(2, '0');
    const paddedHh = hh.padStart(2, '0');
    const paddedMin = min.padStart(2, '0');

    const newDateStr = `${paddedYyyy}-${paddedMm}-${paddedDd}T${paddedHh}:${paddedMin}:00`;
    const newDate = new Date(newDateStr);

    if (isNaN(newDate.getTime())) {
      alert('無効な日時です');
      cancelDateTimePicker(cell, cell.querySelector('.editable-container'));
      return;
    }

    const newValueAsISO = newDate.toISOString();

    // エディタを削除
    const editor = cell.querySelector('.datetime-custom-editor');
    if (editor) {
      cell.removeChild(editor);
    }

    // 元の表示に戻す
    const container = cell.querySelector('.editable-container');
    if (container) {
      container.style.display = 'flex';
      const displaySpan = container.querySelector('.editable-text');
      if (displaySpan) {
        displaySpan.textContent = formatDateTimeForDisplay(newValueAsISO);
      }
    }

    cell.classList.remove('editing-datetime-picker');

    // データを保存（変更があった場合のみ）
    if (newValueAsISO !== originalValue) {
      saveChange(tableName, id, field, newValueAsISO, originalValue);
    }
  }

  function cancelDateTimePicker(cell, container) {
    const editor = cell.querySelector('.datetime-custom-editor');
    if (editor) {
      cell.removeChild(editor);
    }


    if (container) {
      container.style.display = 'flex';
    }

    cell.classList.remove('editing-datetime-picker');
  }

  function openDateTimePickerForTask(taskId, field, originalValue) {
    // タスクの日時編集用のヘルパー関数
    const container = document.getElementById('work-tasks-container');
    const row = container.querySelector(`tr[data-task-id="${taskId}"]`);
    if (!row) return;

    const cell = row.querySelector(`td:nth-child(4)`); // 日時列
    if (!cell) return;

    if (cell.classList.contains('editing-datetime-picker')) return;
    cell.classList.add('editing-datetime-picker');

    let dateObj;
    if (originalValue) {
      dateObj = new Date(originalValue);
    } else {
      dateObj = new Date();
    }

    const yyyy = dateObj.getFullYear().toString().padStart(4, '0');
    const mm = (dateObj.getMonth() + 1).toString().padStart(2, '0');
    const dd = dateObj.getDate().toString().padStart(2, '0');
    const hh = dateObj.getHours().toString().padStart(2, '0');
    const min = dateObj.getMinutes().toString().padStart(2, '0');

    const containerDiv = cell.querySelector('.editable-container');
    if (containerDiv) {
      containerDiv.style.display = 'none';
    }

    const editorDiv = document.createElement('div');
    editorDiv.className = 'datetime-custom-editor';
    editorDiv.innerHTML = `
      <input type="text" class="datetime-segment" data-segment="yyyy" maxlength="4" value="${yyyy}" placeholder="yyyy" />
      <span class="datetime-separator">/</span>
      <input type="text" class="datetime-segment" data-segment="mm" maxlength="2" value="${mm}" placeholder="mm" />
      <span class="datetime-separator">/</span>
      <input type="text" class="datetime-segment" data-segment="dd" maxlength="2" value="${dd}" placeholder="dd" />
      <span class="datetime-separator"> </span>
      <input type="text" class="datetime-segment" data-segment="hh" maxlength="2" value="${hh}" placeholder="hh" />
      <span class="datetime-separator">:</span>
      <input type="text" class="datetime-segment" data-segment="min" maxlength="2" value="${min}" placeholder="mm" />
    `;

    cell.appendChild(editorDiv);

    const inputs = editorDiv.querySelectorAll('.datetime-segment');

    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        let value = e.target.value.replace(/[^0-9]/g, '');
        const maxLength = parseInt(e.target.getAttribute('maxlength'));
        if (value.length > maxLength) {
          value = value.substring(0, maxLength);
        }
        e.target.value = value;
        if (value.length >= maxLength && index < inputs.length - 1) {
          inputs[index + 1].focus();
          inputs[index + 1].select();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing) {
          e.preventDefault();
          saveTaskDateTimePicker(cell, taskId, field, originalValue, inputs);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          cancelTaskDateTimePicker(cell, containerDiv);
        }
      });

      input.addEventListener('blur', (e) => {
        setTimeout(() => {
          const focusedElement = document.activeElement;
          if (!focusedElement || !focusedElement.classList.contains('datetime-segment') || focusedElement.closest('td') !== cell) {
            saveTaskDateTimePicker(cell, taskId, field, originalValue, inputs);
          }
        }, 100);
      });
    });

    setTimeout(() => {
      inputs[0].focus();
      inputs[0].select();
    }, 50);
  }

  function saveTaskDateTimePicker(cell, taskId, field, originalValue, inputs) {

  function cancelTaskDateTimePicker(cell, container) {
    const editor = cell.querySelector('.datetime-custom-editor');
    if (editor) {

    }
    if (container) {

  // ============================================
  // ID検索バー
  // ============================================
  function showIdSearchLoading() {
    const container = document.getElementById('id-search-container');
    if (container) {
      container.classList.add('id-search-loading');
    }
  }

  function hideIdSearchLoading() {
    const container = document.getElementById('id-search-container');
    if (container) {
      container.classList.remove('id-search-loading');
    }
  }

  function updateIdSearchInput(idValue) {
    console.log('[DEBUG] updateIdSearchInput called', {
      idValue: idValue,
      currentWorkId: currentWorkId,
      currentProjectId: currentProjectId,
      hasCurrentWork: !!currentWork
    });

    const input = document.getElementById('id-search-input');
    if (!input) {
      console.log('[DEBUG] updateIdSearchInput: input not found');
      return;
    }

    console.log('[DEBUG] updateIdSearchInput: checking activeElement', {
      activeElement: document.activeElement,
      input: input,
      isInputFocused: document.activeElement === input
    });

    // フォーカス中は何もしない
    if (document.activeElement === input) {
      console.log('[DEBUG] updateIdSearchInput: input is focused, returning');
      return;
    }

    // idValueが直接指定された場合
    if (idValue) {
      console.log('[DEBUG] updateIdSearchInput: setting idValue directly', idValue);
      input.value = idValue;
      input.removeAttribute('placeholder');
      return;
    }

    // work詳細画面が表示中の場合
    if (currentWork) {
      const workDetailOverlay = document.getElementById('work-detail-overlay');
      const isOverlayVisible = workDetailOverlay && workDetailOverlay.classList.contains('show');
      const headerTitle = document.getElementById('header-title-work-detail-header');
      const headerTitleText = headerTitle ? headerTitle.textContent : null;

      console.log('[DEBUG] updateIdSearchInput: checking work detail', {
        isOverlayVisible: isOverlayVisible,
        headerTitleText: headerTitleText,
        shouldSetWorkId: isOverlayVisible && headerTitleText === 'CTMS v3.0'
      });

      if (isOverlayVisible) {
        if (headerTitle && headerTitle.textContent === 'CTMS v3.0') {
          // 保持しているworkデータからIDを構築（APIリクエスト不要）
          const workIdForSearch = `${currentWork.project_id || ''}-${currentWork.work_id || ''}`;
          console.log('[DEBUG] updateIdSearchInput: setting workIdForSearch', workIdForSearch);
          input.value = workIdForSearch;
          input.removeAttribute('placeholder');
          return;
        }
      }
    }

    // project詳細画面が表示中の場合
    if (currentProjectId) {
      const projectDetailOverlay = document.getElementById('project-detail-overlay');
      const isOverlayVisible = projectDetailOverlay && projectDetailOverlay.classList.contains('show');

      console.log('[DEBUG] updateIdSearchInput: checking project detail', {
        isOverlayVisible: isOverlayVisible,
        shouldSetProjectId: isOverlayVisible
      });

      if (isOverlayVisible) {
        console.log('[DEBUG] updateIdSearchInput: setting projectId', currentProjectId);
        input.value = currentProjectId;
        input.removeAttribute('placeholder');
        return;
      }
    }

    // どちらも表示されていない場合はクリア
    console.log('[DEBUG] updateIdSearchInput: clearing input');
    clearIdSearchInput();
  }

  function clearIdSearchInput() {
    const input = document.getElementById('id-search-input');
    if (!input) return;

    input.value = '';
    input.placeholder = 'ID検索';
  }

  function handleIdSearchFocus(event) {
    const input = event.target;
    // valueをクリアしてplaceholderを設定
    input.value = '';
    input.placeholder = 'ID検索（例：P0001, W0001, T0001, R0001）';
  }

  // ID検索の共通処理
  function executeIdSearch(searchValue) {
    if (!searchValue) return;

    // 複数のIDが連なっている場合、最も小さな単位のIDのみを取り出す
    // project_id > work_id > review_id > task_id の順で優先度が低い
    let targetId = null;
    let targetType = null;

    // task_idを検索 (T + 4桁の数字)
    const taskIdMatch = searchValue.match(/T\d{4}/);
    if (taskIdMatch) {
      targetId = taskIdMatch[0];
      targetType = 'task';
    }

    // review_idを検索 (R + 4桁の数字)
    const reviewIdMatch = searchValue.match(/R\d{4}/);
    if (reviewIdMatch && !targetId) {
      targetId = reviewIdMatch[0];
      targetType = 'review';
    }

    // work_idを検索 (W + 4桁の数字)
    const workIdMatch = searchValue.match(/W\d{4}/);
    if (workIdMatch && !targetId) {
      targetId = workIdMatch[0];
      targetType = 'work';
    }

    // project_idを検索 (P + 4桁の数字)
    const projectIdMatch = searchValue.match(/P\d{4}/);
    if (projectIdMatch && !targetId) {
      targetId = projectIdMatch[0];
      targetType = 'project';
    }

    if (!targetId) {
      alert('有効なIDが見つかりません。P0001, W0001, T0001, R0001 の形式で入力してください。');
      return;
    }

    handleHeaderCloseClick();
    // 検索ボックスからフォーカスを外す（入力値は保持）
    const input = document.getElementById('id-search-input');
    if (input) {
      input.blur();
      input.value = searchValue;
    }

    // 検索実行
    if (targetType === 'task') {
      // task_idの場合は、taskからwork_idを取得してwork詳細画面を開く
      callGAS('getTaskById', targetId).then(task => {
        if (!task) {
          alert('タスクが見つかりません');
          return;
        }
        openWorkDetailOverlay(task.work_id);
      }).catch(handleError);
    } else if (targetType === 'review') {
      // review_idの場合は、reviewからwork_idを取得してwork詳細画面を開く
      // new-buttonのスピナーをすぐに表示
      showLoading();
      callGAS('getReviewRequestById', targetId).then(reviewRequest => {
        if (!reviewRequest) {
          alert('レビューリクエストが見つかりません');
          hideLoading();
          return;
        }
        openWorkDetailOverlay(reviewRequest.work_id);
      }).catch(error => {
        handleError(error);
        hideLoading();
      });
    } else if (targetType === 'work') {
      // work_idの場合はwork詳細画面を開く
      openWorkDetailOverlay(targetId);
    } else if (targetType === 'project') {
      // project_idの場合はproject詳細画面を開く
      openProjectDetailOverlay(targetId);
    }
  }

  function handleIdSearchClick() {
    const input = document.getElementById('id-search-input');
    if (!input) return;

    const searchValue = input.value.trim();
    executeIdSearch(searchValue);
  }

  function handleIdSearchBlur(event) {
    const input = event.target;
    console.log('[DEBUG] handleIdSearchBlur triggered', {
      value: input.value,
      activeElement: document.activeElement,
      isInputFocused: document.activeElement === input
    });

    // フォーカスが外れたら、詳細画面が表示中の場合はIDを再設定
    updateIdSearchInput();
  }

  function handleIdSearchInput(event) {
    const input = event.target;
    // 半角英数とハイフンに変換し、大文字にする
    let value = input.value.replace(/[^A-Za-z0-9-]/g, '').toUpperCase();
    input.value = value;
  }

  function handleIdSearchKeydown(event) {
    if (event.key === 'Enter' && !event.isComposing) {
      event.preventDefault();
      const input = event.target;
      const searchValue = input.value.trim();
      executeIdSearch(searchValue);
    }
  }
</script>
