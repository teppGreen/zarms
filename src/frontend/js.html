  // 初期化
  async function initializeApp() {
    try {
      // データ読み込みを待つ
      await loadInitialData();
    } catch (error) {
      console.error('loadInitialData でエラーが発生しました:', error);
    }

    // グローバルショートカットキーの設定
    setupGlobalShortcuts();
  }

  /**
   * グローバルショートカットキーの設定
   */
  function setupGlobalShortcuts() {
    document.addEventListener('keydown', (e) => {
      // Cmd/Ctrl + K: 検索フォーカス
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          searchInput.focus();
          searchInput.select();
        }
      }

      // Cmd/Ctrl + N: 新規作成メニュー
      if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
        e.preventDefault();
        const newButton = document.getElementById('main-button');
        if (newButton && typeof handleMainButtonClick === 'function') {
          handleMainButtonClick({ target: newButton });
        }
      }

      // Esc: モーダルを閉じる
      if (e.key === 'Escape') {
        // detail_creativeのオーバーレイを閉じる
        const creativeDetailOverlay = document.getElementById('overlay-creative-detail');
        if (creativeDetailOverlay && creativeDetailOverlay.style.display !== 'none') {
          if (App.overlays.creativeDetail && typeof App.overlays.creativeDetail.close === 'function') {
            App.overlays.creativeDetail.close();
          }
          return;
        }

        // その他の開いているモーダルを閉じる
        const openModals = document.querySelectorAll('dialog[open]');
        if (openModals.length > 0) {
          openModals.forEach(modal => {
            if (typeof ui === 'function') {
              ui(`#${modal.id}`);
            } else {
              modal.close();
            }
          });
        }
      }
    });
  }

  // } else {

  // // window.onload も念のため設定
  window.onload = initializeApp;

  function loadInitialData(shouldSwitchTab = true) {
    showLoading();

    return Promise.all(
      callGAS('getConfig', null),
    ).then((config) => {
      configData = groupConfigByType(config);

      hideLoading();
      if (shouldSwitchTab) {
        switchTab('home');
      }
    }).catch(handleError);
  }

  // 直前のcallGAS呼び出しを記録（HTTP 429エラー時の再試行用）
  let lastCallGASInvocation = null;
  // 直前のJavaScript関数呼び出しを記録（HTTP 429エラー時の再試行用）
  let lastJSInvocation = null;

  // JavaScript関数呼び出しを記録するヘルパー関数
  function recordJSInvocation(functionName, ...args) {
    lastJSInvocation = {
      functionName: functionName,
      args: args
    };
  }

  function callGAS(functionName, ...args) {
    // 呼び出し履歴を記録
    lastCallGASInvocation = {
      functionName: functionName,
      args: args
    };

    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
      [functionName](...args);
    });
  }

  function groupConfigByType(configs) {
    const grouped = {};
    if (!configs || !Array.isArray(configs)) return grouped;

    configs.forEach(config => {
      if (!grouped[config.config_type]) {
        grouped[config.config_type] = [];
      }
      grouped[config.config_type].push(config);
    });
    return grouped;
  }

  let loadingTimeout = null;

  function showLoading() {
    if (loadingTimeout) clearTimeout(loadingTimeout);

    // app-headerにシマーエフェクトをON（スパイラルアニメーションの代わり）
    const appHeader = document.querySelector('.app-header');
    if (appHeader) {
      appHeader.classList.add('shimmer-loading');
    }

    // bodyタグにcursor: waitを適用
    document.body.style.cursor = 'wait';
  }

  function hideLoading() {
    // app-headerからシマーエフェクトをOFF（チェックマーク表示の代わり）
    const appHeader = document.querySelector('.app-header');
    if (appHeader) {
      appHeader.classList.remove('shimmer-loading');
    }

    // bodyタグからcursor: waitを削除
    document.body.style.cursor = '';
  }

  function handleError(error) {
    hideLoading();
    console.error('GAS Error:', error);

    // HTTP 429エラーを検出（エラーメッセージに"429"が含まれているか、エラーコードが429か）
    const is429Error = error.toString().includes('HTTP 429');

    if (is429Error && lastCallGASInvocation) {
      // HTTP 429エラーの場合、アラートを表示せずに再試行
      retryLastOperation();
      return;
    }

    // その他のエラーは通常通りアラートを表示
    alert('エラーが発生しました: ' + error.message);
  }

  // HTTP 429エラー時の再試行処理
  let retryPopup = null;
  let retryProgressInterval = null;

  function retryLastOperation() {
    if (!lastCallGASInvocation) {
      return;
    }

    // 再試行ポップアップを表示
    showRetryPopup();

    // 10秒待機してから再試行
    let progress = 0;
    const duration = 10000; // 10秒
    const interval = 100; // 100msごとに更新
    const increment = (interval / duration) * 100;

    retryProgressInterval = setInterval(() => {
      progress += increment;
      if (progress >= 100) {
        progress = 100;
        clearInterval(retryProgressInterval);
        retryProgressInterval = null;
      }
      updateRetryProgress(progress);
    }, interval);

    // 10秒後に再試行
    setTimeout(() => {
      if (retryProgressInterval) {
        clearInterval(retryProgressInterval);
        retryProgressInterval = null;
      }

      console.log('lastCallGASInvocation:', lastCallGASInvocation);
      console.log('lastJSInvocation:', lastJSInvocation);

      // 直前のGAS操作を再試行
      const { functionName, args } = lastCallGASInvocation;
      callGAS(functionName, ...args)
        .then(() => {
          // GASの再試行が成功したら、記録されたJavaScript関数も実行
          if (lastJSInvocation && lastJSInvocation.functionName && lastJSInvocation.args) {
            const jsFunctionName = lastJSInvocation.functionName;
            const jsArgs = lastJSInvocation.args;

            // 関数を取得して実行
            let jsFunction = null;
            if (typeof window[jsFunctionName] === 'function') {
              jsFunction = window[jsFunctionName];
            } else if (typeof this[jsFunctionName] === 'function') {
              jsFunction = this[jsFunctionName];
            } else {
              // 関数名から直接関数を取得を試みる
              try {
                jsFunction = eval(jsFunctionName);
                if (typeof jsFunction !== 'function') {
                  jsFunction = null;
                }
              } catch (e) {
                console.warn(`Failed to get function ${jsFunctionName}:`, e);
              }
            }

            if (jsFunction && typeof jsFunction === 'function') {
              try {
                jsFunction(...jsArgs);
              } catch (e) {
                console.error(`Failed to execute ${jsFunctionName}:`, e);
              }
            } else {
              console.warn(`Function ${jsFunctionName} not found`);
            }
          }

          // 成功時はポップアップを閉じる
          lastCallGASInvocation = null;
          lastJSInvocation = null;
          hideRetryPopup();
        })
        .catch((error) => {
          // 再試行時もHTTP 429エラーの場合は再度再試行
          const is429Error = error.toString().includes('429');

          if (is429Error) {
            // 再度再試行
            retryLastOperation();
          } else {
            // その他のエラーはポップアップを閉じて通常のエラー処理
            lastCallGASInvocation = null;
            lastJSInvocation = null;
            hideRetryPopup();
            handleError(error);
          }
        });
    }, duration);
  }

  function showRetryPopup() {
    // 既存のポップアップがあれば削除
    if (retryPopup) {
      retryPopup.remove();
    }

    // ポップアップ要素を作成
    retryPopup = document.createElement('div');
    retryPopup.id = 'retry-popup';
    retryPopup.className = 'retry-popup';
    retryPopup.innerHTML = `
      <div class="retry-popup-content">
        <div class="retry-popup-text">ネットワークエラーが発生したため復旧します<br>少々お待ちください</div>
        <div class="retry-progress-container">
          <div class="retry-progress-bar">
            <div class="retry-progress-fill" style="width: 0%"></div>
          </div>
        </div>
      </div>
    `;

    document.body.appendChild(retryPopup);
  }

  function updateRetryProgress(progress) {
    if (retryPopup) {
      const progressFill = retryPopup.querySelector('.retry-progress-fill');
      if (progressFill) {
        progressFill.style.width = `${progress}%`;
      }
    }
  }

  function hideRetryPopup() {
    if (retryPopup) {
      retryPopup.remove();
      retryPopup = null;
    }
    if (retryProgressInterval) {
      clearInterval(retryProgressInterval);
      retryProgressInterval = null;
    }
  }

      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

  function renderTable(name, data, headers) {
    const table = document.getElementById(`${name}-table`);
    if (!table) return;
    const thead = table.querySelector('thead');
    const tbody = table.querySelector('tbody');
    const state = tableState[name];

    // ヘッダーの生成
    thead.innerHTML = '';
    const headerRow = thead.insertRow();
    headers.forEach(header => {
      const th = document.createElement('th');
      const labelSpan = document.createElement('span');
      labelSpan.className = 'header-label';
      labelSpan.textContent = header.label;
      th.appendChild(labelSpan);
      if (header.sortable || header.filterable) {
        const iconsDiv = document.createElement('div');
        iconsDiv.className = 'header-icons';
        if (header.sortable) {
          const sortIcon = document.createElement('i');
          sortIcon.className = 'valign-middle';
          sortIcon.textContent = state.sortKey === header.key ? (state.sortOrder === 'asc' ? 'arrow_upward' : 'arrow_downward') : 'swap_vert';
          th.style.cursor = 'pointer';
          th.addEventListener('click', () => sortTable(name, header.key));
          iconsDiv.appendChild(sortIcon);
        }
        if (header.filterable) {
          const filterIcon = document.createElement('i');
          filterIcon.className = 'valign-middle';
          filterIcon.textContent = 'filter_list';
          filterIcon.style.cursor = 'pointer';
          filterIcon.addEventListener('click', (e) => showFilterMenu(e, name, header.key));
          iconsDiv.appendChild(filterIcon);
        }
        th.appendChild(iconsDiv);
      }
      headerRow.appendChild(th);
    });

    // ボディの生成
    tbody.innerHTML = '';
    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${headers.length}" style="text-align: center; color: var(--text);">データがありません</td></tr>`;
      return;
    }

    const idKey = 'id';

    data.forEach(item => {
      const row = tbody.insertRow();
      row.dataset.id = item[idKey];

      // Read-onlyテーブル: 行全体をクリック可能にし、詳細モーダルを開く
      row.style.cursor = 'pointer';
      row.addEventListener('click', (e) => {
        // ボタンクリック時は行クリックイベントを発火させない
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
          return;
        }

        // テーブルに応じた詳細モーダルを開く
        if (name === SHEET_NAMES.CREATIVES && App.overlays.creativeDetail) {
          App.overlays.creativeDetail.open(item.id);
        } else if (name === SHEET_NAMES.PLANS && App.overlays.planDetail) {
          App.overlays.planDetail.open(item.id);
        } else if (name === SHEET_NAMES.MEMBERS && App.modals.detail_member) {
          App.modals.detail_member.open(item.id);
        } else if (name === SHEET_NAMES.TASKS && App.overlays.taskDetail) {
          App.overlays.taskDetail.open(item.id);
        }
        // 他のテーブルも必要に応じて追加
      });

      headers.forEach(header => {
        const cell = row.insertCell();
        cell.dataset.field = header.key;
        const currentValue = item[header.key];
        let content = '';

        // すべてのセルをRead-onlyとして表示
        // editableプロパティは無視
        switch (header.key) {
          case 'display_id':
            if (name === SHEET_NAMES.CREATIVES) {
              content = `<button class="chip transparent circle" onclick="event.stopPropagation(); App.overlays.creativeDetail.open('${item.id}')">${escapeHtml(item.display_id || item.id)}</button>`;
            } else if (name === SHEET_NAMES.PLANS) {
              content = `<button class="chip transparent circle" onclick="event.stopPropagation(); App.overlays.planDetail.open('${item.id}')">${escapeHtml(item.display_id || item.id)}</button>`;
            } else {
              content = `<span>${escapeHtml(item.display_id || item.id)}</span>`;
            }
            break;
          case 'plan_title':
            if (item.plan_title) content = escapeHtml(item.plan_title);
            else if (item.plan_id && plansData) {
              const plan = plansData.find(p => p.id === item.plan_id);
              content = plan ? escapeHtml(plan.title) : '';
            }
            break;
          case 'client_name':
            if (item.client_name) content = escapeHtml(item.client_name);
            else if (item.client_directory_id && directoriesData) {
              const dir = directoriesData.find(d => d.id === item.client_directory_id);
              content = dir ? escapeHtml(dir.name) : '';
            }
            break;
          case 'assign_to_name':
            if (item.assign_to_name) content = escapeHtml(item.assign_to_name);
            else if (item.assign_to && membersData) {
              const member = membersData.find(m => m.id === item.assign_to);
              content = member ? escapeHtml(member.nickname || member.member_name) : '';
            }
            break;
          case 'created_by_name':
            if (item.created_by_name) content = escapeHtml(item.created_by_name);
            else if (item.created_by && membersData) {
              const member = membersData.find(m => m.id === item.created_by);
              content = member ? escapeHtml(member.nickname || member.member_name) : '';
            }
            break;
          case 'detail':
            content = `<button class="btn-link" onclick="event.stopPropagation(); App.modals.detail_member.open('${item.id}')">詳細</button>`;
            break;
          case 'assignees':
            content = renderAssignees(item.assignees);
            break;
          case 'icon_gfile_id':
            content = `<img src="${escapeHtml(item.icon_gfile_id ? 'https:/\/drive.google.com/thumbnail?id=' + item.icon_gfile_id : '')}" class="avatar" alt="">`;
            break;
          case 'deadline_at':
            content = `<span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">${escapeHtml(formatDateTimeForDisplay(currentValue, true))}</span>`;
            break;
          case 'ends_at':
          case 'starts_at':
            content = `<span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">${escapeHtml(formatDateTimeForDisplay(currentValue))}</span>`;
            break;
          case 'created_at':
          case 'updated_at':
            content = escapeHtml(formatDate(currentValue));
            break;
          default:
            // enum/config値の場合
            if (header.enumType) {
              content = escapeHtml(getConfigLabel(currentValue, header.enumType));
            } else if (header.configType) {
              content = escapeHtml(getConfigLabel(currentValue, header.configType));
            } else if (typeof currentValue === 'string' && currentValue.length > 10) {
              content = escapeHtml(currentValue.substring(0, 10)) + '...';
            } else {
              content = escapeHtml(currentValue);
            }
            break;
        }
        cell.innerHTML = content;
      });
    });
  }

  function sortTable(tableName, columnKey) {
    const state = tableState[tableName];
    if (state.sortKey === columnKey) {
      state.sortOrder = state.sortOrder === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = columnKey;
      state.sortOrder = 'asc';
    }
    if (tableName) {
      loadTabData(tableName);
    }
  }

  function showFilterMenu(event, tableName, columnKey) {
    event.stopPropagation();
    closeFilterMenu();
    const state = tableState[tableName];
    const data = tableName === SHEET_NAMES.CREATIVES ? creativesData : tableName === SHEET_NAMES.PLANS ? plansData : tableName === SHEET_NAMES.TASKS ? tasksData : membersData;
    const uniqueValues = [...new Set(data.map(item => item[columnKey]))].filter(v => v);
    const popup = document.createElement('div');
    popup.id = 'filter-popup';
    popup.className = 'filter-popup';
    const content = document.createElement('div');
    content.className = 'filter-popup-content';
    uniqueValues.forEach(value => {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = value;
      const currentFilters = state.filters[columnKey] || [];
      if (currentFilters.includes(value)) checkbox.checked = true;
      let labelText = value;
      if (columnKey.endsWith('_key')) {
        const type = columnKey.replace('_key', '').toUpperCase();
        labelText = getConfigLabel(value, type) || value;
      }
      label.appendChild(checkbox);
      label.append(` ${labelText}`);
      content.appendChild(label);
    });
    popup.appendChild(content);
    const buttons = document.createElement('div');
    buttons.className = 'filter-popup-buttons';
    const applyBtn = document.createElement('button');
    applyBtn.textContent = '適用';
    applyBtn.className = 'btn btn-primary';
    applyBtn.onclick = () => {
      const selectedValues = Array.from(content.querySelectorAll('input:checked')).map(cb => cb.value);
      if (selectedValues.length > 0) {
        state.filters[columnKey] = selectedValues;
      } else {
        delete state.filters[columnKey];
      }
      closeFilterMenu();
      if (tableName) {
        loadTabData(tableName);
      }
    };
    const clearBtn = document.createElement('button');
    clearBtn.textContent = 'クリア';
    clearBtn.className = 'btn btn-secondary';
    clearBtn.onclick = () => {
      delete state.filters[columnKey];
      closeFilterMenu();
      const dataLoaders = { [SHEET_NAMES.CREATIVES]: loadcreativesData, [SHEET_NAMES.PLANS]: loadProjectsData, [SHEET_NAMES.TASKS]: loadTasksData, [SHEET_NAMES.MEMBERS]: loadMembersData };
      if (dataLoaders[tableName]) {
        showLoading();
        dataLoaders[tableName]();
      }
    };
    buttons.appendChild(clearBtn);
    buttons.appendChild(applyBtn);
    popup.appendChild(buttons);
    document.body.appendChild(popup);
    const rect = event.target.getBoundingClientRect();
    popup.style.left = `${rect.left}px`;
    popup.style.top = `${rect.bottom + window.scrollY}px`;
    popup.style.display = 'block';
    popup.addEventListener('click', (e) => { e.stopPropagation(); });
    setTimeout(() => { document.addEventListener('click', closeFilterMenu); }, 0);
  }

  function closeFilterMenu() {
    const popup = document.getElementById('filter-popup');
    if (popup) {
      popup.remove();
      document.removeEventListener('click', closeFilterMenu);
    }
  }

  function applyFiltersAndSort(tableName, data) {
    const state = tableState[tableName];
    let processedData = [...data];
    const filterKeys = Object.keys(state.filters);
    if (filterKeys.length > 0) {
      processedData = processedData.filter(item => {
        return filterKeys.every(key => {
          if (!state.filters[key] || state.filters[key].length === 0) return true;
          return state.filters[key].includes(item[key]);
        });
      });
    }
    if (state.sortKey) {
      processedData.sort((a, b) => {
        let valA = a[state.sortKey];
        let valB = b[state.sortKey];
        if (state.sortKey.includes('datetime') || state.sortKey.includes('_at')) {
          valA = valA ? new Date(valA).getTime() : 0;
          valB = valB ? new Date(valB).getTime() : 0;
        }
        if (valA < valB) return state.sortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return state.sortOrder === 'asc' ? 1 : -1;
        return 0;
      });
    }
    return processedData;
  }

  function getHeaderDef(tableName, field) {
    const headers = tableName === SHEET_NAMES.CREATIVES ? creativesTableHeaders : tableName === SHEET_NAMES.PLANS ? plansTableHeaders : tableName === SHEET_NAMES.TASKS ? tasksTableHeaders : membersTableHeaders;

  function renderAssignees(assignees) {

    return `<div class="avatar-stack">${assignees.map(a => `<img src="${a.member_icon || 'https://via.placeholder.com/32'}" class="avatar" title="${escapeHtml(a.member_name)}" alt="${escapeHtml(a.member_name)}">`).join('')}</div>`;
  }
  function getConfigLabel(key, type) {
    if (!key || !configData[type]) return key;
    const config = configData[type].find(c => c.config_key === key);
    return config ? config.config_value : key;
  }
  function formatDate(dateString) {
    if (!dateString) return '-';
    try {
      const dt = new Date(dateString);
      const offset = dt.getTimezoneOffset() * 60000;
      const localDate = new Date(dt.getTime() - offset);
      return localDate.toISOString().slice(0, 10);
    } catch (e) { return dateString; }
  }
  function formatDateTimeForDisplay(dateString, includeSeconds = false) {
    if (!dateString) return includeSeconds ? 'yyyy/mm/dd(曜日) hh:mm:ss' : 'yyyy/mm/dd(曜日) hh:mm';
    try {
      const dt = new Date(dateString);
      const year = String(dt.getFullYear()).padStart(4, '0');
      const month = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const weekday = weekdays[dt.getDay()];
      const hours = String(dt.getHours()).padStart(2, '0');
      const minutes = String(dt.getMinutes()).padStart(2, '0');
      const seconds = String(dt.getSeconds()).padStart(2, '0');
      if (includeSeconds) {
        return `${year}/${month}/${day}(${weekday}) ${hours}:${minutes}:${seconds}`;
      }
      return `${year}/${month}/${day}(${weekday}) ${hours}:${minutes}`;
    } catch (e) {
      return includeSeconds ? 'yyyy/mm/dd(曜日) hh:mm:ss' : 'yyyy/mm/dd(曜日) hh:mm';
    }
  }


  function formatDateTimeForInput(dateString) {
    if (!dateString) return '';
    try {
      const dt = new Date(dateString);
      const offset = dt.getTimezoneOffset() * 60000;
      const localDate = new Date(dt.getTime() - offset);
      return localDate.toISOString().slice(0, 16);
    } catch (e) { return ''; }
  }
  function calculateDaysRemaining(dueDateString) {
    if (!dueDateString) return '-';
    try {
      const dueDate = new Date(dueDateString);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      dueDate.setHours(0, 0, 0, 0);
      const diffTime = dueDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      if (diffDays < 0) {
        return `${Math.abs(diffDays)}日超過`;
      } else if (diffDays === 0) {
        return '今日';
      } else {
        return `${diffDays}日`;
      }
    } catch (e) {
      return '-';
    }
  }
  function escapeHtml(text) {
    if (text === null || typeof text === 'undefined') return '';
    return String(text).replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[match]);
  }

  function saveChange(tableName, id, field, newValue, oldValue) {
    if (String(newValue) === String(oldValue)) return;

    showLoading();

    // まずデータ配列を更新する
    const data = tableName === SHEET_NAMES.CREATIVES ? creativesData : tableName === SHEET_NAMES.PLANS ? plansData : tableName === SHEET_NAMES.TASKS ? tasksData : membersData;
    const idKey = tableName === SHEET_NAMES.MEMBERS ? 'member_email' : (tableName === SHEET_NAMES.CREATIVES ? 'id' : (tableName === SHEET_NAMES.TASKS ? 'id' : 'id'));
    const item = data.find(d => String(d[idKey]) === String(id));
    if (item) {
      item[field] = newValue;
    }

    // 次に表示を更新する
    const table = document.getElementById(`${tableName}-table`);
    const row = table.querySelector(`tr[data-id="${id}"]`);
    if (row) {
      const cell = row.querySelector(`td[data-field="${field}"]`);
      if (cell) {
        const header = getHeaderDef(tableName, field);
        let displayValue = newValue;
        if (header && header.configType) {
          displayValue = getConfigLabel(newValue, header.configType);
        } else if (header && header.editType === 'datetime') {
          displayValue = formatDateTimeForDisplay(newValue);
        }
        // editable-container の中の span.editable-text を更新する
        const editableTextSpan = cell.querySelector('.editable-text');
        if (editableTextSpan) {
          editableTextSpan.textContent = displayValue;
        } else {
          // editable-container がない場合（テキストフィールドなど）
          cell.textContent = displayValue;
        }
      }
    }

    // 最後にサーバーに保存する
    callGAS('updateItem', tableName, id, { [field]: newValue })
      .then(success => {
        hideLoading();
        if (!success) {
          handleError({ message: '更新に失敗しました。' });
          // 失敗時はデータを再読み込み
          if (tableName) {
            loadTabData(tableName);
          }
        }
      })
      .catch(err => {
        handleError(err);
        // エラー時はデータを再読み込み
        if (tableName) {
          loadTabData(tableName);
        }
      });
  }

  // ---- テキスト編集 ----
  function switchToEditMode(cell, header, tableName) {
    cell.classList.add('editing');
    const originalValue = cell.textContent;
    cell.innerHTML = '';
    const input = document.createElement('input');
    input.type = 'text';
    input.value = originalValue;
    input.className = 'inline-edit-input';
    cell.appendChild(input);
    input.focus();

    const onSave = () => {
      cell.innerHTML = escapeHtml(input.value);
      cell.classList.remove('editing');
      saveChange(tableName, cell.parentElement.dataset.id, header.key, input.value, originalValue);
    };
    input.addEventListener('blur', onSave);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) input.blur();
      if (e.key === 'Escape') {
        cell.innerHTML = escapeHtml(originalValue);
        cell.classList.remove('editing');
      }
    });
  }

  // ---- セレクト（ドロップダウン）編集 ----
  function showSelectEditor(event, tableName, id, field) {
    event.stopPropagation();
    // Stop propagation to prevent immediate closing if clicking the button triggers document click

    // Find or create global menu
    let menu = document.getElementById('global-select-menu');
    if (!menu) {
      menu = document.createElement('menu');
      menu.id = 'global-select-menu';
      document.body.appendChild(menu);
    }

    // Clear menu
    menu.innerHTML = '';

    const header = getHeaderDef(tableName, field);
    const options = configData[header.configType] || [];
    if (options.length === 0) return;

    const data = (tableName === SHEET_NAMES.TASKS ? tasksData : tableName === SHEET_NAMES.CREATIVES ? creativesData : tableName === SHEET_NAMES.PLANS ? plansData : membersData);
    const idKey = tableName === SHEET_NAMES.MEMBERS ? 'member_email' : 'id';
    const item = data.find(d => String(d[idKey]) === String(id));
    const currentValue = item ? item[field] : '';

    options.forEach(opt => {
      const a = document.createElement('a');
      a.textContent = opt.config_value;
      if (opt.config_key === currentValue) {
        a.classList.add('active'); // BeerCSS active state for menu item? or just bold
        a.style.fontWeight = 'bold';
      }
      a.onclick = () => {
        saveChange(tableName, id, field, opt.config_key, currentValue);
        // Menu closes automatically or we can force it? 
        // BeerCSS menus close on click usually.
      };
      menu.appendChild(a);
    });

    // Open menu relative to trigger
    const trigger = event.currentTarget; // The container (button + text) or button
    ui(menu, trigger);
  }

  // ---- タスク日時編集（ネイティブ） ----
  function openDateTimePickerForTask(taskId, field, originalValue) {
    const container = document.getElementById('creative-tasks-container');
    if (!container) return;
    const row = container.querySelector(`tr[data-task-id="${taskId}"]`);
    if (!row) return;
    // Assuming 4th column is ends_at based on previous code reading
    const cell = row.querySelector(`td:nth-child(4)`);
    if (!cell) return;

    if (cell.classList.contains('editing')) return;
    cell.classList.add('editing');

    cell.innerHTML = '';
    const input = document.createElement('input');
    input.type = 'datetime-local';
    if (originalValue) {
      input.value = originalValue.slice(0, 16);
    }
    input.style.width = '100%';
    cell.appendChild(input);
    input.focus();

    const onSave = () => {
      let newValue = input.value;
      if (newValue && newValue.length === 16) newValue += ':00';
      if (newValue) {
        const d = new Date(newValue);
        newValue = d.toISOString();
      } else {
        newValue = '';
      }

      // UI restore
      cell.innerHTML = '';
      cell.classList.remove('editing');

      const datetimeContainer = document.createElement('div');
      datetimeContainer.className = 'row no-space align-center';
      const datetimeText = document.createElement('span');
      datetimeText.className = 'editable-text max';
      datetimeText.textContent = formatDateTimeForDisplay(newValue);
      const datetimeBtn = document.createElement('button');
      datetimeBtn.className = 'circle transparent small';
      datetimeBtn.innerHTML = '<i>edit</i>';
      datetimeContainer.appendChild(datetimeText);
      datetimeContainer.appendChild(datetimeBtn);
      datetimeContainer.addEventListener('click', () => {
        openDateTimePickerForTask(taskId, field, newValue);
      });
      cell.appendChild(datetimeContainer);

      if (newValue !== originalValue) {
        App.pages.taskDetail.updateTaskField(taskId, field, newValue, originalValue);
      }
    };

    input.addEventListener('blur', onSave);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') {
        input.removeEventListener('blur', onSave);
        cell.classList.remove('editing');
        cell.innerHTML = '';
        // Restore
        const datetimeContainer = document.createElement('div');
        datetimeContainer.className = 'row no-space align-center';
        const datetimeText = document.createElement('span');
        datetimeText.className = 'editable-text max';
        datetimeText.textContent = formatDateTimeForDisplay(originalValue);
        const datetimeBtn = document.createElement('button');
        datetimeBtn.className = 'circle transparent small';
        datetimeBtn.innerHTML = '<i>edit</i>';
        datetimeContainer.appendChild(datetimeText);
        datetimeContainer.appendChild(datetimeBtn);
        datetimeContainer.addEventListener('click', () => {
          openDateTimePickerForTask(taskId, field, originalValue);
        });
        cell.appendChild(datetimeContainer);
      }
    });
  }

  /**
   * テキスト検索の実行（フロントエンドデータから検索）
   */
  function performTextSearch(searchValue, searchTarget) {
    const results = [];
    const searchLower = searchValue.toLowerCase();

    // 検索対象のテーブルとフィールドを定義
    const searchConfigs = [
      { data: creativesData, tableName: SHEET_NAMES.CREATIVES, fields: ['title', 'display_id'] },
      { data: plansData, tableName: SHEET_NAMES.PLANS, fields: ['title', 'display_id'] },
      { data: tasksData, tableName: SHEET_NAMES.TASKS, fields: ['title', 'display_id'] },
      { data: membersData, tableName: SHEET_NAMES.MEMBERS, fields: ['nickname', 'email'] }
    ];

    searchConfigs.forEach(config => {
      if (!config.data) return;

      config.data.forEach(item => {
        let matches = false;

        if (searchTarget === 'all') {
          // すべてのフィールドを検索
          matches = config.fields.some(field => {
            const value = item[field];
            return value && value.toString().toLowerCase().includes(searchLower);
          });
        } else if (searchTarget === 'title') {
          // タイトルのみ検索
          const titleField = config.fields.find(f => f.includes('title') || f.includes('nickname'));
          if (titleField) {
            const value = item[titleField];
            matches = value && value.toString().toLowerCase().includes(searchLower);
          }
        }

        if (matches) {
          results.push({
            item: item,
            tableName: config.tableName,
            id: item.id,
            displayText: `[${config.tableName}] ${item.display_id || item.id}: ${item.title || item.nickname || item.email || ''}`
          });
        }
      });
    });

    return results.slice(0, 20); // 最大20件
  }

  /**
   * 検索結果をドロップダウンに表示
   */
  function displaySearchResults(results) {
    const resultsMenu = document.getElementById('search-results-menu');
    if (!resultsMenu) return;

    if (results.length === 0) {
      resultsMenu.style.display = 'none';
      return;
    }

    resultsMenu.innerHTML = results.map(result => {
      return `
        <a class="row" style="padding: 8px 16px; cursor: pointer;" onclick='openDetailModalFromSearch(${JSON.stringify(result).replace(/'/g, "\\'")}); event.stopPropagation();'>
          <span class="small-text">${escapeHtml(result.displayText)}</span>
        </a>
      `;
    }).join('');

    resultsMenu.style.display = 'block';
  }

    };

  /**
   * グローバル変数内の該当オブジェクトを直接更新します (Optimistic UI)
   * @param {string} tableName - テーブル名
   * @param {string} id - レコードID
   * @param {Object} updates - 更新する値のオブジェクト
   * @returns {Object|null} 更新されたアイテム、または見つからない場合はnull
   */
  function updateLocalData(tableName, id, updates) {
    const dataArray = getDataArray(tableName);
    if (!dataArray) {
      console.warn(`updateLocalData: テーブル ${tableName} が見つかりません`);
      return null;
    }

    const item = dataArray.find(d => d.id === id);
    if (!item) {
      console.warn(`updateLocalData: ID ${id} が ${tableName} に見つかりません`);
      return null;
    }

    // オブジェクトを直接更新
    Object.keys(updates).forEach(key => {
      item[key] = updates[key];
    });

    return item;
  }

  /**
   * 特定の行のみを再描画します (Optimistic UI)
   * @param {string} tableName - テーブル名
   * @param {string} id - レコードID
   */
  function reRenderTableRow(tableName, id) {
    const dataArray = getDataArray(tableName);
    const headers = getTableHeaders(tableName);

    if (!dataArray || !headers) {
      console.warn(`reRenderTableRow: テーブル ${tableName} が見つかりません`);
      return;
    }

    const item = dataArray.find(d => d.id === id);
    if (!item) {
      console.warn(`reRenderTableRow: ID ${id} が ${tableName} に見つかりません`);
      return;
    }

    const table = document.getElementById(`${tableName}-table`);
    if (!table) {
      console.warn(`reRenderTableRow: テーブル要素 ${tableName}-table が見つかりません`);
      return;
    }

    const tbody = table.querySelector('tbody');
    const row = tbody.querySelector(`tr[data-id="${id}"]`);

    if (!row) {
      console.warn(`reRenderTableRow: 行 (data-id="${id}") が見つかりません`);
      return;
    }

    // 行を削除して再生成
    const rowIndex = Array.from(tbody.children).indexOf(row);
    row.remove();

    const newRow = tbody.insertRow(rowIndex);
    newRow.dataset.id = item.id;

    headers.forEach(header => {
      const cell = newRow.insertCell();
      cell.dataset.field = header.key;
      const currentValue = item[header.key];

      // Read-onlyテーブルなので、editableプロパティは無視して表示のみ
      let content = '';

      switch (header.key) {
        case 'display_id':
          if (tableName === SHEET_NAMES.CREATIVES) {
            content = `<button class="chip transparent circle" onclick="App.overlays.creativeDetail.open('${item.id}')">${escapeHtml(item.display_id || item.id)}</button>`;
          } else if (tableName === SHEET_NAMES.PLANS) {
            content = `<button class="chip transparent circle" onclick="App.overlays.planDetail.open('${item.id}')">${escapeHtml(item.display_id || item.id)}</button>`;
          } else {
            content = `<span>${escapeHtml(item.display_id || item.id)}</span>`;
          }
          break;
        case 'plan_title':
          if (item.plan_title) content = escapeHtml(item.plan_title);
          else if (item.plan_id && plansData) {
            const plan = plansData.find(p => p.id === item.plan_id);
            content = plan ? escapeHtml(plan.title) : '';
          }
          break;
        case 'client_name':
          if (item.client_name) content = escapeHtml(item.client_name);
          else if (item.client_directory_id && directoriesData) {
            const dir = directoriesData.find(d => d.id === item.client_directory_id);
            content = dir ? escapeHtml(dir.name) : '';
          }
          break;
        case 'assign_to_name':
          if (item.assign_to_name) content = escapeHtml(item.assign_to_name);
          else if (item.assign_to && membersData) {
            const member = membersData.find(m => m.id === item.assign_to);
            content = member ? escapeHtml(member.nickname || member.member_name) : '';
          }
          break;
        case 'created_by_name':
          if (item.created_by_name) content = escapeHtml(item.created_by_name);
          else if (item.created_by && membersData) {
            const member = membersData.find(m => m.id === item.created_by);
            content = member ? escapeHtml(member.nickname || member.member_name) : '';
          }
          break;
        case 'icon_gfile_id':
          content = `<img src="${escapeHtml(item.icon_gfile_id ? 'https:/\/drive.google.com/thumbnail?id=' + item.icon_gfile_id : '')}" class="avatar" alt="">`;
          break;
        case 'deadline_at':
          content = `<span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">${escapeHtml(formatDateTimeForDisplay(currentValue, true))}</span>`;
          break;
        case 'ends_at':
        case 'starts_at':
          content = `<span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">${escapeHtml(formatDateTimeForDisplay(currentValue))}</span>`;
          break;
        case 'created_at':
        case 'updated_at':
          content = escapeHtml(formatDate(currentValue));
          break;
        default:
          // enum/configの場合はgetConfigLabelで表示
          if (header.enumType) {
            content = escapeHtml(getConfigLabel(currentValue, header.enumType));
          } else if (typeof currentValue === 'string' && currentValue.length > 10) {
            content = escapeHtml(currentValue.substring(0, 10)) + '...';
          } else {
            content = escapeHtml(currentValue);
          }
          break;
      }

      cell.innerHTML = content;
    });

    // 行クリックで詳細モーダルを開く
    newRow.style.cursor = 'pointer';
    newRow.addEventListener('click', () => {
      if (tableName === SHEET_NAMES.CREATIVES && App.overlays.creativeDetail) {
        App.overlays.creativeDetail.open(item.id);
      } else if (tableName === SHEET_NAMES.PLANS && App.overlays.planDetail) {
        App.overlays.planDetail.open(item.id);
      } else if (tableName === SHEET_NAMES.MEMBERS && App.overlays.memberDetail) {
        App.overlays.memberDetail.open(item.id);
      }
      // 他のテーブルも同様に追加可能
    });
  }

  /**
   * データをロールバックします (エラー時)
   * @param {string} tableName - テーブル名
   * @param {string} id - レコードID
   * @param {Object} oldData - 以前のデータ
   */
  function rollbackLocalData(tableName, id, oldData) {
    const dataArray = getDataArray(tableName);
    if (!dataArray) {
      console.warn(`rollbackLocalData: テーブル ${tableName} が見つかりません`);
      return;
    }

    const item = dataArray.find(d => d.id === id);
    if (!item) {
      console.warn(`rollbackLocalData: ID ${id} が ${tableName} に見つかりません`);
      return;
    }

    // 古いデータで上書き
    Object.keys(oldData).forEach(key => {
      item[key] = oldData[key];
    });

    // 行を再描画
    reRenderTableRow(tableName, id);
  }
</script>
