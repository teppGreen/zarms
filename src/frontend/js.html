  const SHEET_NAMES = templateVariables.SHEET_NAMES;
  // ... existing code ...

  // グローバル変数
  let currentUser = null;
  let creativesData = [];
  let plansData = [];
  let tasksData = [];
  let membersData = [];
  let knowledgesData = [];
  let configData = {};

  // テーブルの状態管理（ソート、フィルター）
  let tableState = {
    creatives: { sortKey: 'deadline_at', sortOrder: 'asc', filters: {} },

  };

  // テーブルヘッダーの定義

  const plansTableHeaders = [

    { key: 'description', label: '概要', sortable: false, editable: true, editType: 'text' },
    { key: 'created_at', label: '作成日', sortable: true, editable: false },
    { key: 'created_by_name', label: '作成者', sortable: true, filterable: true, editable: false },
    { key: 'creatives_count', label: '関連制作物', sortable: true, editable: false }
  ];

  const tasksTableHeaders = [
    { key: 'display_id', label: 'タスクID', sortable: true },
    { key: 'parent_task_id', label: '親タスクID', sortable: true, filterable: true, editable: false },
    { key: 'title', label: 'タスクタイトル', sortable: true, filterable: true, editable: true, editType: 'text' },
    { key: 'task_status_key', label: 'ステータス', sortable: true, filterable: true, editable: true, editType: 'select', configType: 'TASK_STATUS' },
    { key: 'priority_key', label: '優先度', sortable: true, filterable: true, editable: true, editType: 'select', configType: 'PRIORITY' },
    { key: 'assign_to_name', label: '担当者', sortable: true, filterable: true, editable: false },
    { key: 'ends_at', label: '終了日時', sortable: true, editable: true, editType: 'datetime' }
  ];

  const membersTableHeaders = [
    { key: 'detail', label: '', sortable: false },
    { key: 'icon_gfile_id', label: '', sortable: false },
    { key: 'nickname', label: '名前', sortable: true, filterable: true, editable: true, editType: 'text' },
    { key: 'email', label: 'メール', sortable: true, editable: false },
    { key: 'system_role_key', label: '権限', sortable: true, filterable: true, editable: true, editType: 'select', configType: 'SYSTEM_ROLE' },
    { key: 'assigned_creatives_count', label: '担当制作物数', sortable: true, editable: false }
  ];


  // 新規作成ボタンの初期化関数
  function initializeNewButton() {
    console.log('initializeNewButton が呼び出されました');

    // --- 新規作成ボタンのロジック ---
    const newButton = document.getElementById('new-button');
    const dropdown = document.getElementById('new-button-dropdown');
    const newButtonContainer = document.querySelector('.new-button-container');

    console.log('newButton:', newButton);
    console.log('newButtonContainer:', newButtonContainer);

    // 新規作成ボタンのクリック
    if (newButton) {
      console.log('新規作成ボタンが見つかりました。イベントリスナーを設定します。');
      // onclickを使用して確実に設定
      newButton.onclick = function (event) {
        console.log('新規作成ボタンがクリックされました', event);
        handleMainButtonClick(event);
      };

      // 子要素（span）からのクリックも確実に処理されるように
      const newButtonMain = document.getElementById('new-button-main');
      if (newButtonMain) {
        newButtonMain.onclick = function (event) {
          console.log('新規作成ボタン（span）がクリックされました', event);
          handleMainButtonClick(event);
        };
      }
    } else {
      console.error('新規作成ボタンが見つかりませんでした！');
      // リトライ（DOMがまだ読み込まれていない場合）
      setTimeout(initializeNewButton, 100);
      return;
    }

    // ドキュメント全体（body）をクリックした時の動作（一度だけ設定）
    if (!window.newButtonClickHandlerInitialized) {
      document.addEventListener('click', (event) => {
        // 新規作成ボタン関連の要素がクリックされた場合は処理をスキップ
        if (newButtonContainer && newButtonContainer.contains(event.target)) {
          return; // ボタンのクリックイベントを妨げないように早期リターン
        }

        // ポップアップエディタを閉じる
        closeAllPopups();

        // ドロップダウンが表示されていて、かつ
        // クリックされた場所がボタンコンテナの外側の場合にドロップダウンを閉じる
        if (dropdown && dropdown.classList.contains('show')) {
          closeNewButtonDropdown();
        }
      });
      window.newButtonClickHandlerInitialized = true;
    }
  }

  // 初期化
  async function initializeApp() {
    console.log('initializeApp が呼び出されました');

    // 全画面タイトルの最小表示時間を確保（アニメーションが適切に表示されるように）
    const titleStartTime = Date.now();
    const minDisplayTime = 1000; // 最小表示時間（ミリ秒）

    // 新規作成ボタンを最初に初期化（エラーが発生しても確実に実行されるように）
    try {
      console.log('initializeNewButton を呼び出します');
      initializeNewButton();
    } catch (error) {
      console.error('initializeNewButton でエラーが発生しました:', error);
    }

    try {
      // データ読み込みを待つ
      await loadInitialData();
    } catch (error) {
      console.error('loadInitialData でエラーが発生しました:', error);
    }

    try {
      // URLパラメータからwork_idを取得して詳細画面を開く（最優先処理）
      const urlParam = templateVariables.urlParam;
      console.log(`URLのパラメータ: ${JSON.stringify(urlParam)}`);
      if (urlParam.work_id) {
        const workId = urlParam.work_id;
        if (workId) openWorkDetailOverlay(workId);
      }
    } catch (error) {
      console.error('URLパラメータ処理でエラーが発生しました:', error);
    }

    // 最小表示時間を確保してから全画面タイトルを非表示にする
    try {
      const elapsedTime = Date.now() - titleStartTime;
      const remainingTime = Math.max(0, minDisplayTime - elapsedTime);

      setTimeout(() => {
        hideFullscreenTitle();
      }, remainingTime);
    } catch (error) {
      console.error('全画面タイトル非表示処理でエラーが発生しました:', error);
    }
  }

  // 全画面タイトルを非表示にする関数
  function hideFullscreenTitle() {
    const fullscreenTitle = document.getElementById('fullscreen-title');
    if (!fullscreenTitle) {
      return;
    }

    // アニメーションアウトクラスを追加
    fullscreenTitle.classList.add('fade-out');

    // アニメーション完了後にdisplay=noneにする
    setTimeout(() => {
      fullscreenTitle.style.display = 'none';
    }, 500); // アニメーション時間（0.5s）に合わせる
  }

  // 複数の方法で初期化を試みる
  if (document.readyState === 'loading') {
    console.log('DOMContentLoaded を待機します');
    document.addEventListener('DOMContentLoaded', initializeApp);
  } else {
    console.log('DOMContentLoaded は既に発火済み。即座に実行します');
    // DOMContentLoaded が既に発火している場合
    initializeApp();
  }

  // window.onload も念のため設定
  window.onload = initializeApp;

  function loadInitialData(shouldSwitchTab = true) {
    showLoading();

    return Promise.all([
      callGAS('getCurrentUser'),
      callGAS('getConfig', null),
      callGAS('getUserRole')
    ]).then(([user, config, role]) => {
      currentUser = user;
      configData = groupConfigByType(config);

      if (role === 'ADMIN') {
        document.getElementById('new-member-dropdown-item').style.display = 'block';
      }

      hideLoading();
      if (shouldSwitchTab) {
        switchTab('home');
      }
      return { user, config, role };
    }).catch(handleError);
  }

  // 直前のcallGAS呼び出しを記録（HTTP 429エラー時の再試行用）
  let lastCallGASInvocation = null;
  // 直前のJavaScript関数呼び出しを記録（HTTP 429エラー時の再試行用）
  let lastJSInvocation = null;

  // JavaScript関数呼び出しを記録するヘルパー関数
  function recordJSInvocation(functionName, ...args) {
    lastJSInvocation = {
      functionName: functionName,
      args: args
    };
  }

  function callGAS(functionName, ...args) {
    // 呼び出し履歴を記録
    lastCallGASInvocation = {
      functionName: functionName,
      args: args
    };

    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
      [functionName](...args);
    });
  }

  function groupConfigByType(configs) {
    const grouped = {};
    if (!configs || !Array.isArray(configs)) return grouped;

    configs.forEach(config => {
      if (!grouped[config.config_type]) {
        grouped[config.config_type] = [];
      }
      grouped[config.config_type].push(config);
    });
    return grouped;
  }

  let loadingTimeout = null;

  function showLoading() {
    if (loadingTimeout) clearTimeout(loadingTimeout);

    // app-headerにシマーエフェクトをON（スパイラルアニメーションの代わり）
    const appHeader = document.querySelector('.app-header');
    if (appHeader) {
      appHeader.classList.add('shimmer-loading');
    }

    // bodyタグにcursor: waitを適用
    document.body.style.cursor = 'wait';
  }

  function hideLoading() {
    // app-headerからシマーエフェクトをOFF（チェックマーク表示の代わり）
    const appHeader = document.querySelector('.app-header');
    if (appHeader) {
      appHeader.classList.remove('shimmer-loading');
    }

    // bodyタグからcursor: waitを削除
    document.body.style.cursor = '';
  }

  function handleError(error) {
    hideLoading();
    console.error('GAS Error:', error);

    // HTTP 429エラーを検出（エラーメッセージに"429"が含まれているか、エラーコードが429か）
    const is429Error = error.toString().includes('HTTP 429');

    if (is429Error && lastCallGASInvocation) {
      // HTTP 429エラーの場合、アラートを表示せずに再試行
      retryLastOperation();
      return;
    }

    // その他のエラーは通常通りアラートを表示
    alert('エラーが発生しました: ' + error.message);
  }

  // HTTP 429エラー時の再試行処理
  let retryPopup = null;
  let retryProgressInterval = null;

  function retryLastOperation() {
    if (!lastCallGASInvocation) {
      return;
    }

    // 再試行ポップアップを表示
    showRetryPopup();

    // 10秒待機してから再試行
    let progress = 0;
    const duration = 10000; // 10秒
    const interval = 100; // 100msごとに更新
    const increment = (interval / duration) * 100;

    retryProgressInterval = setInterval(() => {
      progress += increment;
      if (progress >= 100) {
        progress = 100;
        clearInterval(retryProgressInterval);
        retryProgressInterval = null;
      }
      updateRetryProgress(progress);
    }, interval);

    // 10秒後に再試行
    setTimeout(() => {
      if (retryProgressInterval) {
        clearInterval(retryProgressInterval);
        retryProgressInterval = null;
      }

      console.log('lastCallGASInvocation:', lastCallGASInvocation);
      console.log('lastJSInvocation:', lastJSInvocation);

      // 直前のGAS操作を再試行
      const { functionName, args } = lastCallGASInvocation;
      callGAS(functionName, ...args)
        .then(() => {
          // GASの再試行が成功したら、記録されたJavaScript関数も実行
          if (lastJSInvocation && lastJSInvocation.functionName && lastJSInvocation.args) {
            const jsFunctionName = lastJSInvocation.functionName;
            const jsArgs = lastJSInvocation.args;

            // 関数を取得して実行
            let jsFunction = null;
            if (typeof window[jsFunctionName] === 'function') {
              jsFunction = window[jsFunctionName];
            } else if (typeof this[jsFunctionName] === 'function') {
              jsFunction = this[jsFunctionName];
            } else {
              // 関数名から直接関数を取得を試みる
              try {
                jsFunction = eval(jsFunctionName);
                if (typeof jsFunction !== 'function') {
                  jsFunction = null;
                }
              } catch (e) {
                console.warn(`Failed to get function ${jsFunctionName}:`, e);
              }
            }

            if (jsFunction && typeof jsFunction === 'function') {
              try {
                jsFunction(...jsArgs);
              } catch (e) {
                console.error(`Failed to execute ${jsFunctionName}:`, e);
              }
            } else {
              console.warn(`Function ${jsFunctionName} not found`);
            }
          }

          // 成功時はポップアップを閉じる
          lastCallGASInvocation = null;
          lastJSInvocation = null;
          hideRetryPopup();
        })
        .catch((error) => {
          // 再試行時もHTTP 429エラーの場合は再度再試行
          const is429Error = error.toString().includes('429');

          if (is429Error) {
            // 再度再試行
            retryLastOperation();
          } else {
            // その他のエラーはポップアップを閉じて通常のエラー処理
            lastCallGASInvocation = null;
            lastJSInvocation = null;
            hideRetryPopup();
            handleError(error);
          }
        });
    }, duration);
  }

  function showRetryPopup() {
    // 既存のポップアップがあれば削除
    if (retryPopup) {
      retryPopup.remove();
    }

    // ポップアップ要素を作成
    retryPopup = document.createElement('div');
    retryPopup.id = 'retry-popup';
    retryPopup.className = 'retry-popup';
    retryPopup.innerHTML = `
      <div class="retry-popup-content">
        <div class="retry-popup-text">ネットワークエラーが発生したため復旧します<br>少々お待ちください</div>
        <div class="retry-progress-container">
          <div class="retry-progress-bar">
            <div class="retry-progress-fill" style="width: 0%"></div>
          </div>
        </div>
      </div>
    `;

    document.body.appendChild(retryPopup);
  }

  function updateRetryProgress(progress) {
    if (retryPopup) {
      const progressFill = retryPopup.querySelector('.retry-progress-fill');
      if (progressFill) {
        progressFill.style.width = `${progress}%`;
      }
    }
  }

  function hideRetryPopup() {
    if (retryPopup) {
      retryPopup.remove();
      retryPopup = null;
    }
    if (retryProgressInterval) {
      clearInterval(retryProgressInterval);
      retryProgressInterval = null;
    }
  }

  function closeNewButtonDropdown() {
    const dropdown = document.getElementById('new-button-dropdown');
    if (dropdown) {
      dropdown.classList.remove('show');
    }
  }

  /**
   * 「+ 新規作成」ボタンのドロップダウンの表示/非表示を切り替えます。
   */
  function toggleNewButtonDropdown(event) {
    event.stopPropagation(); // bodyのクリックイベントへの伝播を防ぐ
    const dropdown = document.getElementById('new-button-dropdown');
    if (dropdown) {
      dropdown.classList.toggle('show');
    }
  }

  /**
   * メインの「+ 新規作成」ボタンがクリックされたときの処理
   */
  function handleMainButtonClick(event) {
    console.log('handleMainButtonClick が呼び出されました', event);
    event.stopPropagation(); // bodyのクリックイベントへの伝播を防ぐ
    event.preventDefault(); // デフォルトの動作を防ぐ
    closeAllPopups();

    // アクティブなナビゲーションアイテムを確認してタブを判定
    const activeNavItem = document.querySelector('.nav-item.active');
    console.log('アクティブなナビゲーションアイテム:', activeNavItem);
    if (!activeNavItem) {
      // アクティブなタブが見つからない場合はドロップダウンを表示
      console.log('アクティブなタブが見つからないため、ドロップダウンを表示します');
      toggleNewButtonDropdown(event);
      return;
    }

    const navItemId = activeNavItem.id;
    console.log('ナビゲーションアイテムID:', navItemId);

    if (navItemId === 'creatives-nav') {
      console.log('制作物モーダルを開きます');
      openNewCreativeModal();
    } else if (navItemId === 'plans-nav') {
      console.log('制作物モーダルを開きます（企画タブ）');
      openNewCreativeModal();
    } else if (navItemId === 'members-nav') {
      console.log('メンバーモーダルを開きます');
      openNewMemberModal();
    } else if (navItemId === 'knowledges-nav') {
      console.log('ナレッジモーダルを開きます');
      openNewKnowledgeModal();
    } else {
      // それ以外のタブ（ホーム、統計など）ではドロップダウンを表示
      console.log('その他のタブのため、ドロップダウンを表示します');
      toggleNewButtonDropdown(event);
    }
  }

  // ============================================
  // ナビゲーション & タブ読み込み
  // ============================================

  function switchTab(tabName) {
    // closeWorkDetailOverlay();
    // ホームタブ以外に切り替える場合は残り時間の更新を停止
    if (tabName !== 'home') {
      stopRemainingTimeUpdates();
    }
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    document.querySelector(`.nav-item[onclick="switchTab('${tabName}')"]`).classList.add('active');
    document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
    document.getElementById('tab-' + tabName).style.display = 'block';
    loadTabData(tabName);
  }

  function loadTabData(tabName) {
    showLoading();
    const dataLoaders = {
      'home': loadHomeData,
      [SHEET_NAMES.CREATIVES]: () => loadData(SHEET_NAMES.CREATIVES),
      [SHEET_NAMES.PLANS]: () => loadData(SHEET_NAMES.PLANS),
      [SHEET_NAMES.TASKS]: () => loadData(SHEET_NAMES.TASKS),
      [SHEET_NAMES.MEMBERS]: () => loadData(SHEET_NAMES.MEMBERS),
      [SHEET_NAMES.KNOWLEDGES]: () => loadData(SHEET_NAMES.KNOWLEDGES),
      'summary': loadSummaryData,
    };
    if (dataLoaders[tabName]) dataLoaders[tabName]();
    else hideLoading();
  }

  function loadData(tableName) {
    // 依存関係のあるデータを並行して読み込む
    const promises = [callGAS('getItems', tableName)];

    if (tableName === SHEET_NAMES.CREATIVES) {
      promises.push(callGAS('getItems', SHEET_NAMES.PLANS));
      promises.push(callGAS('getItems', SHEET_NAMES.MEMBERS));
    } else if (tableName === SHEET_NAMES.TASKS) {
      promises.push(callGAS('getItems', SHEET_NAMES.CREATIVES));
      promises.push(callGAS('getItems', SHEET_NAMES.MEMBERS));
    }

    Promise.all(promises).then(results => {
      const data = results[0];

      switch (tableName) {
        case SHEET_NAMES.CREATIVES:
          creativesData = data;
          plansData = results[1] || [];
          membersData = results[2] || [];
          renderTable(SHEET_NAMES.CREATIVES, applyFiltersAndSort(SHEET_NAMES.CREATIVES, creativesData), creativesTableHeaders);
          break;
        case SHEET_NAMES.PLANS:
          plansData = data;
          renderTable(SHEET_NAMES.PLANS, applyFiltersAndSort(SHEET_NAMES.PLANS, plansData), plansTableHeaders);
          break;
        case SHEET_NAMES.TASKS:
          tasksData = data;
          creativesData = results[1] || [];
          membersData = results[2] || [];
          renderTable(SHEET_NAMES.TASKS, applyFiltersAndSort(SHEET_NAMES.TASKS, tasksData), tasksTableHeaders);
          break;
        case SHEET_NAMES.MEMBERS:
          membersData = data;
          renderTable(SHEET_NAMES.MEMBERS, applyFiltersAndSort(SHEET_NAMES.MEMBERS, membersData), membersTableHeaders);
          break;
        case SHEET_NAMES.KNOWLEDGES:
          knowledgesData = data;
          renderKnowledgesTable(data);
          break;
      }
      hideLoading();
    }).catch(handleError);
  }

  // ... (rest of the file)

  // ============================================
  // データ読み込み & 描画
  // ============================================

  // セッション中に非表示にするwork_idを管理
  let hiddenWorkIds = new Set();

  function loadHomeData() {
    // membersDataが取得されていない場合は取得
    const promises = [callGAS('getHomeData')];
    if (!membersData || membersData.length === 0) {
      promises.push(callGAS('getMembers'));
    } else {
      promises.push(Promise.resolve(membersData));
    }

    Promise.all(promises).then(([data, members]) => {
      if (!membersData || membersData.length === 0) {
        membersData = members;
      }

      document.getElementById('home-greeting').textContent = `${data.greeting}、${data.memberName}さん。`;

      // 最新の制作依頼を表示
      renderNewRequests(data.new_requests || []);

      // 担当中の制作物を表示
      renderAssignedWorks(data.works || []);

      // 最近のナレッジを表示
      renderKnowledge(data.knowledge || []);

      // 残り時間のリアルタイム更新を開始
      startRemainingTimeUpdates();

      hideLoading();
    }).catch(handleError);
  }

  function renderNewRequests(newRequests) {
    const container = document.getElementById('home-new-requests-container');
    container.innerHTML = '';

    // 非表示にするwork_idをフィルタ
    const visibleRequests = newRequests.filter(work => !hiddenWorkIds.has(work.id));

    if (visibleRequests.length === 0) {
      container.innerHTML = '<p style="color: #6b7280;">最新の制作依頼はありません</p>';
      return;
    }

    visibleRequests.forEach(work => {
      const card = document.createElement('div');
      card.className = 'home-card';
      card.dataset.workId = work.id;

      // 優先度、制作物種別、依頼者の所属チームを取得
      const priorityLabel = work.priority_key ? getConfigLabel(work.priority_key, 'PRIORITY') : '';
      const workTypeLabel = work.creative_type_key ? getConfigLabel(work.creative_type_key, 'CREATIVE_TYPE') : '';
      const clientTeamLabel = work.client_member_id ? (() => {
        const client = membersData?.find(m => m.id === work.client_member_id);
        return client ? getConfigLabel(client.member_team_key, 'TEAM') : '';
      })() : '';

  function calculateRemainingTime(ms) {
    if (!ms || ms <= 0) return '';

    const totalSeconds = ms / 1000; // ミリ秒を秒に変換（小数点以下も保持）
    const hours = Math.floor(totalSeconds / 3600); // 時間部分の取得（小数切り捨て）
    const minutes = Math.floor((totalSeconds % 3600) / 60); // 分部分の取得（小数切り捨て）
    const seconds = Math.floor(totalSeconds % 60); // ミリ秒部分は切り捨て（整数部分のみ）

    return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  }

  // 残り時間をリアルタイムで更新するためのinterval ID
  let remainingTimeIntervalId = null;

  function updateRemainingTimes() {
    const acceptButtons = document.querySelectorAll('.btn-accept[data-remaining-ms]');
    const now = new Date().getTime();

    acceptButtons.forEach(button => {
      const initialRemainingMs = parseInt(button.dataset.remainingMs) || 0;
      if (initialRemainingMs <= 0) return;

      // 初期時刻を取得（データ属性から）
      const initialTimeAttr = button.dataset.initialTime;
      if (!initialTimeAttr) {
        // 初回のみ、現在時刻を記録
        button.dataset.initialTime = now.toString();
        return;
      }

      const initialTime = parseInt(initialTimeAttr);
      const elapsed = now - initialTime;
      const remainingMs = initialRemainingMs - elapsed;

      const remainingTimeElement = button.querySelector('.remaining-time');
      if (remainingTimeElement) {
        if (remainingMs > 0) {
          const remainingTime = calculateRemainingTime(remainingMs);
          remainingTimeElement.textContent = `${remainingTime}`;
        }
      }
    });
  }

  function startRemainingTimeUpdates() {
    // 既存のintervalをクリア
    if (remainingTimeIntervalId) {
      clearInterval(remainingTimeIntervalId);
    }

    // 1秒ごとに更新
    remainingTimeIntervalId = setInterval(updateRemainingTimes, 1000);
    // 即座に1回実行
    updateRemainingTimes();
  }

  function stopRemainingTimeUpdates() {
    if (remainingTimeIntervalId) {
      clearInterval(remainingTimeIntervalId);
      remainingTimeIntervalId = null;
    }
  }

  function getWorkStatusColor(statusKey) {
    if (statusKey === 'TODO' || statusKey === 'APPROVED') {
      return 'status-red';
    } else if (statusKey === 'CREATE' || statusKey === 'REVIEW' || statusKey === 'REVISION') {
      return 'status-orange';
    } else if (statusKey === 'DELIVERED') {
      return 'status-green';
    }
    return 'status-red';
  }

  function formatDateForReview(dueDatetime) {
    if (!dueDatetime) return '';
    try {
      const date = new Date(dueDatetime);
      const year = String(date.getFullYear()).padStart(4, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const weekday = weekdays[date.getDay()];
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `~ ${year}/${month}/${day}(${weekday}) ${hours}:${minutes}`;
    } catch (e) {
      return '';
    }
  }

  function renderTable(name, data, headers) {
    const table = document.getElementById(`${name}-table`);
    if (!table) return;
    const thead = table.querySelector('thead');
    const tbody = table.querySelector('tbody');
    const state = tableState[name];

    // ヘッダーの生成
    thead.innerHTML = '';
    const headerRow = thead.insertRow();
    headers.forEach(header => {
      const th = document.createElement('th');
      const labelSpan = document.createElement('span');
      labelSpan.className = 'header-label';
      labelSpan.textContent = header.label;
      th.appendChild(labelSpan);
      if (header.sortable || header.filterable) {
        const iconsDiv = document.createElement('div');
        iconsDiv.className = 'header-icons';
        if (header.sortable) {
          const sortIcon = document.createElement('span');
          sortIcon.className = 'sort-icon';
          sortIcon.textContent = state.sortKey === header.key ? (state.sortOrder === 'asc' ? '↑' : '↓') : '↕';
          th.addEventListener('click', () => sortTable(name, header.key));
          iconsDiv.appendChild(sortIcon);
        }
        if (header.filterable) {
          const filterIcon = document.createElement('span');
          filterIcon.className = 'filter-icon';
          filterIcon.textContent = '▼';
          filterIcon.addEventListener('click', (e) => showFilterMenu(e, name, header.key));
          iconsDiv.appendChild(filterIcon);
        }
        th.appendChild(iconsDiv);
      }
      headerRow.appendChild(th);
    });

    // ボディの生成
    tbody.innerHTML = '';
    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${headers.length}" style="text-align: center; color: #6b7280;">データがありません</td></tr>`;
      return;
    }

    const idKey = 'id'; // New schema uses 'id' for all tables

    data.forEach(item => {
      const row = tbody.insertRow();
      row.dataset.id = item[idKey];
      headers.forEach(header => {
        const cell = row.insertCell();
        cell.dataset.field = header.key;
        const currentValue = item[header.key];
        let content = '';

        if (header.editable) {
          switch (header.editType) {
            case 'select':
              const selectContainer = document.createElement('div');
              selectContainer.className = 'editable-container';
              const selectText = document.createElement('span');
              selectText.className = 'editable-text';
              selectText.textContent = getConfigLabel(currentValue, header.configType);
              const selectToggle = document.createElement('span');
              selectToggle.className = 'editable-toggle-btn';
              selectToggle.textContent = '✎';
              selectContainer.appendChild(selectText);
              selectContainer.appendChild(selectToggle);
              selectContainer.addEventListener('click', (e) => {
                showSelectEditor(e, name, item[idKey], header.key);
              });
              cell.appendChild(selectContainer);
              break;
            case 'datetime':
              const datetimeContainer = document.createElement('div');
              datetimeContainer.className = 'editable-container datetime-editable';
              const datetimeText = document.createElement('span');
              datetimeText.className = 'editable-text';
              datetimeText.textContent = formatDateTimeForDisplay(currentValue);
              const datetimeToggle = document.createElement('span');
              datetimeToggle.className = 'editable-toggle-btn';
              datetimeToggle.textContent = '✎';
              datetimeContainer.appendChild(datetimeText);
              datetimeContainer.appendChild(datetimeToggle);
              datetimeContainer.addEventListener('click', (e) => {
                openDateTimePicker(e, name, item[idKey], header.key);
              });
              cell.appendChild(datetimeContainer);
              break;
            default: // text
              cell.textContent = currentValue;
              cell.classList.add('editable');
              cell.addEventListener('click', (e) => {
                if (cell.classList.contains('editing')) return;
                switchToEditMode(cell, header, name);
              });
              break;
          }
        } else {
          switch (header.key) {
            case 'display_id':
              if (name === SHEET_NAMES.CREATIVES) {
                content = `<button class="btn-link" style="font-family: 'Roboto Mono', monospace; font-weight: 500;" onclick="openCreativeDetailOverlay('${item.id}')">${escapeHtml(item.display_id || item.id)}</button>`;
              } else if (name === SHEET_NAMES.PLANS) {
                content = `<button class="btn-link" style="font-family: 'Roboto Mono', monospace; font-weight: 500;" onclick="openPlanDetailOverlay('${item.id}')">${escapeHtml(item.display_id || item.id)}</button>`;
              } else {
                content = `<span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">${escapeHtml(item.display_id || item.id)}</span>`;
              }
              break;
            case 'plan_title':
              if (item.plan_title) content = escapeHtml(item.plan_title);
              else if (item.plan_id && plansData) {
                const plan = plansData.find(p => p.id === item.plan_id);
                content = plan ? escapeHtml(plan.title) : '';
              }
              break;
            case 'client_name':
              if (item.client_name) content = escapeHtml(item.client_name);
              else if (item.client_member_id && membersData) {
                const member = membersData.find(m => m.id === item.client_member_id);
                content = member ? escapeHtml(member.nickname || member.member_name) : '';
              }
              break;
            case 'assign_to_name':
              if (item.assign_to_name) content = escapeHtml(item.assign_to_name);
              else if (item.assign_to && membersData) {
                const member = membersData.find(m => m.id === item.assign_to);
                content = member ? escapeHtml(member.nickname || member.member_name) : '';
              }
              break;
            case 'created_by_name':
              if (item.created_by_name) content = escapeHtml(item.created_by_name);
              else if (item.created_by && membersData) {
                const member = membersData.find(m => m.id === item.created_by);
                content = member ? escapeHtml(member.nickname || member.member_name) : '';
              }
              break;
            case 'detail': content = `<button class="btn-link" onclick="openMemberDetail('${item.id}')">詳細</button>`; break;
            case 'assignees': content = renderAssignees(item.assignees); break; // assignees needs to be populated in loadData or backend
            case 'icon_gfile_id': content = `<img src="${escapeHtml(item.icon_gfile_id ? 'https://drive.google.com/thumbnail?id=' + item.icon_gfile_id : 'https://via.placeholder.com/32')}" class="avatar" alt="">`; break;
            case 'deadline_at': content = `<span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">${escapeHtml(formatDateTimeForDisplay(currentValue, true))}</span>`; break;
            case 'ends_at': content = `<span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">${escapeHtml(formatDateTimeForDisplay(currentValue))}</span>`; break;
            case 'created_at': content = escapeHtml(formatDate(currentValue)); break;
            default:
              if (typeof currentValue === 'string' && currentValue.length > 10) {
                content = escapeHtml(currentValue.substring(0, 10)) + '...';
              } else {
                content = escapeHtml(currentValue);
              }
              break;
          }
          cell.innerHTML = content;
        }
      });
    });
  }

  function drawChart(elementId, chartType, data, hAxis, vAxis, options = {}) {
    const container = document.getElementById(elementId);
    if (!data || Object.keys(data).length === 0) {
      container.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 40px;">データがありません</p>';
      return;
    }
    const chartData = [[hAxis, vAxis]];
    Object.keys(data).forEach(key => {
      const label = hAxis === 'Status' ? getConfigLabel(key, 'WORK_STATUS') : key;
      chartData.push([label, data[key]]);
    });
    const dataTable = google.visualization.arrayToDataTable(chartData);
    const chart = new google.visualization[chartType === 'line' ? 'LineChart' : chartType === 'column' ? 'ColumnChart' : 'PieChart'](container);
    chart.draw(dataTable, options);
  }

  let currentWorkId = null;
  let currentWork = null;
  let currentProjectId = null;

  function openCreativeDetailOverlay(workId) {
    // JavaScript関数呼び出しを記録（HTTP 429エラー時の再試行用）
    recordJSInvocation('openCreativeDetailOverlay', workId);

    showLoading();
    currentWorkId = workId;
    const promises = [
      callGAS('getItemById', SHEET_NAMES.CREATIVES, workId),
      callGAS('getWorkflowTimestamps', workId)
    ];
    if (!membersData || membersData.length === 0) {
      promises.push(callGAS('getMembers'));
    } else {
      promises.push(Promise.resolve(membersData));
    }
    Promise.all(promises).then(([work, timestamps, members]) => {
      if (!membersData || membersData.length === 0) {
        membersData = members;
      }

      // 現在のworkデータを保持
      currentWork = work;

      // メインヘッダーを更新
      const headerTitleDefault = document.getElementById('header-title-default');
      const headerTitleWorkDetailHeader = document.getElementById('header-title-work-detail-header');
      const headerCloseBtn = document.getElementById('header-close-btn');
      const newButton = document.getElementById('new-button');

      if (headerTitleDefault) headerTitleDefault.style.display = 'none';
      if (headerTitleWorkDetailHeader) {
        headerTitleWorkDetailHeader.style.display = 'flex';
        headerTitleWorkDetailHeader.textContent = 'CTMS v3.0';
      }
      if (headerCloseBtn) headerCloseBtn.style.display = 'flex';
      if (newButton) newButton.style.display = 'none';

      // ID検索バーにIDを表示
      const workIdForSearch = `${work.plan_id || ''}-${work.display_id || work.id || ''}`;
      updateIdSearchInput(workIdForSearch);

      // ワークフローステータスバーを表示
      const workflowStatusBar = document.getElementById('workflow-status-bar');
      if (workflowStatusBar && timestamps) {
        workflowStatusBar.style.display = 'flex';

        // workflow-status-dropdownに全てのCREATIVE_STATUSを表示
        const workflowStatusDropdown = document.getElementById('workflow-status-dropdown');
        if (workflowStatusDropdown && configData.CREATIVE_STATUS) {
          workflowStatusDropdown.innerHTML = '';
          const activeStatuses = configData.CREATIVE_STATUS.filter(status => status.is_active !== false);
          activeStatuses.forEach(status => {
            const option = document.createElement('option');
            option.value = status.config_key;
            option.textContent = status.config_value;
            if (status.config_key === work.creative_status_key) {
              option.selected = true;
            }
            workflowStatusDropdown.appendChild(option);
          });

          // ドロップダウン変更イベントを追加
          workflowStatusDropdown.onchange = function () {
            const newStatusKey = this.value;
            if (newStatusKey && newStatusKey !== work.creative_status_key) {
              showLoading();
              callGAS('updateItem', SHEET_NAMES.CREATIVES, work.id, { creative_status_key: newStatusKey })
                .then(() => {
                  hideLoading();
                  // 画面を再読み込みしてステータスの日時を更新
                  openCreativeDetailOverlay(work.id);
                })
                .catch(handleError);
            }
          };
        }

        // 日時をフォーマットする関数（yyyy/mm/dd(曜日) hh:mm形式）
        const formatWorkflowDate = (dateStr) => {
          if (!dateStr) return '';
          const date = new Date(dateStr);
          const days = ['日', '月', '火', '水', '木', '金', '土'];
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const day = String(date.getDate()).padStart(2, '0');
          const dayOfWeek = days[date.getDay()];
          const hours = String(date.getHours()).padStart(2, '0');
          const minutes = String(date.getMinutes()).padStart(2, '0');
          return `${year}/${month}/${day}(${dayOfWeek}) ${hours}:${minutes}`;
        };

        // ステータス表示を更新する関数
        function updateWorkflowStatusDisplay(work, timestamps) {
          const currentStatus = work.creative_status_key;

          // CANCELEDの場合は全ての背景色をgrayに
          const isCanceled = currentStatus === 'CANCELED';
          const canceledColor = '#9E9E9E'; // gray

          // アイコンの表示を背景色に応じて変更する関数
          function updateIcon(iconElement, color) {
            if (!iconElement) return;
            if (isCanceled) {
              // CANCELEDの場合はアイコンを非表示
              iconElement.textContent = '';
            } else if (color === '#4CAF50') {
              // 緑: ✓
              iconElement.textContent = '✓';
            } else if (color === '#FF9800') {
              // オレンジ: ＞
              iconElement.textContent = '＞';
            } else {
              // 赤: 何もなし
              iconElement.textContent = '';
            }
          }

          // 依頼: 常に緑、形式: yyyy/mm/dd(曜日) hh:mm
          const requestItem = document.getElementById('workflow-status-request');
          const requestIconWrapper = requestItem ? requestItem.querySelector('.workflow-status-icon-wrapper') : null;
          const requestIcon = requestItem ? requestItem.querySelector('.workflow-status-icon') : null;
          const requestDate = document.getElementById('workflow-date-request');
          if (requestItem && requestIconWrapper && requestIcon) {
            const requestColor = isCanceled ? canceledColor : '#4CAF50'; // CANCELEDの場合はgray、それ以外は緑
            requestIconWrapper.style.backgroundColor = requestColor;
            updateIcon(requestIcon, requestColor);
            // ブレード型の背景色も設定
            requestItem.style.setProperty('--blade-color', requestColor);
          }
          if (requestDate) {
            const requestDateValue = timestamps.request || work.created_at;
            if (requestDateValue) {
              requestDate.textContent = formatWorkflowDate(requestDateValue);
            }
          }

          // 制作: creative_status_key が TO-DO の場合は赤、CREATEの場合はオレンジ、それ以外の場合は緑
          // 形式: yyyy/mm/dd(曜日) hh:mm ~
          const productionItem = document.getElementById('workflow-status-production');
          const productionIconWrapper = productionItem ? productionItem.querySelector('.workflow-status-icon-wrapper') : null;
          const productionIcon = productionItem ? productionItem.querySelector('.workflow-status-icon') : null;
          const productionDate = document.getElementById('workflow-date-production');
          if (productionItem && productionIconWrapper && productionIcon) {
            let productionColor;
            if (isCanceled) {
              productionColor = canceledColor; // CANCELEDの場合はgray
            } else if (currentStatus === 'TO-DO') {
              productionColor = '#F44336'; // TO-DOの場合は赤
            } else if (currentStatus === 'CREATE') {
              productionColor = '#FF9800'; // CREATEの場合はオレンジ
            } else {
              productionColor = '#4CAF50'; // それ以外の場合は緑
            }
            productionIconWrapper.style.backgroundColor = productionColor;
            updateIcon(productionIcon, productionColor);
            // ブレード型の背景色も設定
            productionItem.style.setProperty('--blade-color', productionColor);
          }
          if (productionDate && timestamps.production) {
            productionDate.textContent = formatWorkflowDate(timestamps.production) + ' ~';
          }

          // 承認: creative_status_key が REVIEW または REVISIONの場合はオレンジ、APPROVEDの場合は緑、それ以外の場合は赤
          // 形式: 色がオレンジの場合は yyyy/mm/dd(曜日) hh:mm ~, 色が赤の場合は ~ yyyy/mm/dd(曜日) hh:mm
          const approvalItem = document.getElementById('workflow-status-approval');
          const approvalIconWrapper = approvalItem ? approvalItem.querySelector('.workflow-status-icon-wrapper') : null;
          const approvalIcon = approvalItem ? approvalItem.querySelector('.workflow-status-icon') : null;
          const approvalDate = document.getElementById('workflow-date-approval');
          if (approvalItem && approvalIconWrapper && approvalIcon) {
            let approvalColor = isCanceled ? canceledColor : '#F44336'; // CANCELEDの場合はgray、デフォルト: 赤
            if (!isCanceled) {
              if (currentStatus === 'REVIEW' || currentStatus === 'REVISION') {
                approvalColor = '#FF9800'; // オレンジ
              } else if (currentStatus === 'APPROVED') {
                approvalColor = '#4CAF50'; // 緑
              }
            }
            approvalIconWrapper.style.backgroundColor = approvalColor;
            updateIcon(approvalIcon, approvalColor);
            // ブレード型の背景色も設定
            approvalItem.style.setProperty('--blade-color', approvalColor);
          }
          if (approvalDate && timestamps.approval) {
            let approvalColor = '#F44336';
            if (currentStatus === 'REVIEW' || currentStatus === 'REVISION') {
              approvalColor = '#FF9800';
            } else if (currentStatus === 'APPROVED') {
              approvalColor = '#4CAF50';
            }
            if (approvalColor === '#FF9800') {
              // オレンジの場合
              approvalDate.textContent = formatWorkflowDate(timestamps.approval) + ' ~';
            } else {
              // 赤の場合
              approvalDate.textContent = '~ ' + formatWorkflowDate(timestamps.approval);
            }
          }

          // 納品: creative_status_key が DELIVERED の場合は緑、APPROVED の場合はオレンジ、それ以外の場合は赤
          // 形式: 色が緑の場合は yyyy/mm/dd(曜日) hh:mm, 色が赤またはオレンジの場合は ~ yyyy/mm/dd(曜日) hh:mm
          // 日時の後ろに、deadline_atまでの残り日数を表示
          const deliveryItem = document.getElementById('workflow-status-delivery');
          const deliveryIconWrapper = deliveryItem ? deliveryItem.querySelector('.workflow-status-icon-wrapper') : null;
          const deliveryIcon = deliveryItem ? deliveryItem.querySelector('.workflow-status-icon') : null;
          const deliveryDate = document.getElementById('workflow-date-delivery');

          // 残り日数を計算する関数
          function calculateDaysRemaining(dueDatetime) {
            if (!dueDatetime) return null;
            const now = new Date();
            const due = new Date(dueDatetime);
            // 日付のみを比較（時刻を無視）
            const nowDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const dueDate = new Date(due.getFullYear(), due.getMonth(), due.getDate());
            const diffTime = dueDate - nowDate;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
          }

          if (deliveryItem && deliveryIconWrapper && deliveryIcon) {
            let deliveryColor = isCanceled ? canceledColor : '#F44336'; // CANCELEDの場合はgray、デフォルト: 赤
            if (!isCanceled) {
              if (currentStatus === 'DELIVERED') {
                deliveryColor = '#4CAF50'; // 緑
              } else if (currentStatus === 'APPROVED') {
                deliveryColor = '#FF9800'; // オレンジ
              }
            }

            // 期限超過のチェック（CANCELEDの場合は無視）
            if (!isCanceled) {
              const daysRemaining = calculateDaysRemaining(work.deadline_at);
              const isOverdue = daysRemaining !== null && daysRemaining < 0;

              if (isOverdue) {
                // 期限超過の場合: 透明度を反転＆文字色をwhiteに変更
                deliveryItem.classList.add('overdue');
                deliveryIconWrapper.style.opacity = '1';
              } else {
                deliveryItem.classList.remove('overdue');
                deliveryIconWrapper.style.opacity = '1';
              }
            } else {
              deliveryItem.classList.remove('overdue');
              deliveryIconWrapper.style.opacity = '1';
            }

            deliveryIconWrapper.style.backgroundColor = deliveryColor;
            updateIcon(deliveryIcon, deliveryColor);
            // ブレード型の背景色も設定
            deliveryItem.style.setProperty('--blade-color', deliveryColor);
          }
          if (deliveryDate && timestamps.delivery) {
            let deliveryColor = '#F44336';
            if (currentStatus === 'DELIVERED') {
              deliveryColor = '#4CAF50';
            } else if (currentStatus === 'APPROVED') {
              deliveryColor = '#FF9800';
            }

            let dateText = '';
            if (deliveryColor === '#4CAF50') {
              // 緑の場合
              dateText = formatWorkflowDate(timestamps.delivery);
            } else {
              // 赤またはオレンジの場合
              dateText = '~ ' + formatWorkflowDate(timestamps.delivery);
            }

            deliveryDate.textContent = dateText;

            // DELIVEREDでない場合のみ、日時部分をクリック可能にする
            if (currentStatus !== 'DELIVERED') {
              deliveryDate.style.cursor = 'pointer';
              deliveryDate.classList.add('editable-datetime');
              deliveryDate.onclick = (e) => {
                e.stopPropagation();
                openDeliveryDateTimePicker(deliveryDate, work.id, timestamps.delivery || work.deadline_at);
              };
            } else {
              deliveryDate.style.cursor = 'default';
              deliveryDate.classList.remove('editable-datetime');
              deliveryDate.onclick = null;
            }
          }

          // 残り日数を新しい要素に表示
          const daysRemainingItem = document.getElementById('workflow-status-days-remaining');
          const daysRemainingText = document.getElementById('workflow-days-remaining-text');
          if (daysRemainingItem && daysRemainingText) {
            // DELIVEREDまたはCANCELEDの場合は非表示
            if (currentStatus === 'DELIVERED' || currentStatus === 'CANCELED') {
              daysRemainingItem.style.display = 'none';
            } else {
              const daysRemaining = calculateDaysRemaining(work.deadline_at);
              if (daysRemaining !== null) {
                let daysText = '';
                if (daysRemaining === 0) {
                  daysText = '本日';
                } else if (daysRemaining < 0) {
                  daysText = Math.abs(daysRemaining) + '日前(超過)';
                } else {
                  daysText = daysRemaining + '日後';
                }
                daysRemainingText.textContent = daysText;

                // 納品と同じ背景色を設定
                let deliveryColor = '#F44336';
                if (currentStatus === 'DELIVERED') {
                  deliveryColor = '#4CAF50';
                } else if (currentStatus === 'APPROVED') {
                  deliveryColor = '#FF9800';
                }

                // 期限超過のチェック
                const isOverdue = daysRemaining < 0;
                if (isOverdue) {
                  daysRemainingItem.classList.add('overdue');
                } else {
                  daysRemainingItem.classList.remove('overdue');
                }

                // ブレード型の背景色も設定
                daysRemainingItem.style.setProperty('--blade-color', deliveryColor);
                daysRemainingItem.style.display = 'flex';
              } else {
                daysRemainingItem.style.display = 'none';
              }
            }
          }
        }

        // ステータス表示を更新
        updateWorkflowStatusDisplay(work, timestamps);
      }

      // 納品日時の日時選択ピッカーを開く関数
      function openDeliveryDateTimePicker(dateElement, workId, originalValue) {
        if (!dateElement || !workId) return;

        // 既に編集中なら何もしない
        if (dateElement.classList.contains('editing-delivery-datetime')) return;

        // 編集中の状態にする
        dateElement.classList.add('editing-delivery-datetime');

        // 現在の日時を取得してパース
        let dateObj;
        if (originalValue) {
          dateObj = new Date(originalValue);
        } else {
          dateObj = new Date();
        }

        const yyyy = dateObj.getFullYear().toString().padStart(4, '0');
        const mm = (dateObj.getMonth() + 1).toString().padStart(2, '0');
        const dd = dateObj.getDate().toString().padStart(2, '0');
        const hh = dateObj.getHours().toString().padStart(2, '0');
        const min = dateObj.getMinutes().toString().padStart(2, '0');

        // 元のテキストを保存
        const originalText = dateElement.textContent;

        // カスタム日時入力フィールドを作成
        const editorDiv = document.createElement('div');
        editorDiv.className = 'datetime-custom-editor';
        editorDiv.style.position = 'absolute';
        editorDiv.style.zIndex = '1000';
        editorDiv.style.backgroundColor = 'var(--md-sys-color-surface)';
        editorDiv.style.border = '2px solid var(--md-sys-color-primary)';
        editorDiv.style.borderRadius = '8px';
        editorDiv.style.padding = '8px';
        editorDiv.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
        editorDiv.innerHTML = `
          <input type="text" class="datetime-segment" data-segment="yyyy" maxlength="4" value="${yyyy}" placeholder="yyyy" />
          <span class="datetime-separator">/</span>
          <input type="text" class="datetime-segment" data-segment="mm" maxlength="2" value="${mm}" placeholder="mm" />
          <span class="datetime-separator">/</span>
          <input type="text" class="datetime-segment" data-segment="dd" maxlength="2" value="${dd}" placeholder="dd" />
          <span class="datetime-separator"> </span>
          <input type="text" class="datetime-segment" data-segment="hh" maxlength="2" value="${hh}" placeholder="hh" />
          <span class="datetime-separator">:</span>
          <input type="text" class="datetime-segment" data-segment="min" maxlength="2" value="${min}" placeholder="mm" />
        `;

        // 位置を計算（dateElementの位置に合わせる）
        const rect = dateElement.getBoundingClientRect();
        const deliveryItem = document.getElementById('workflow-status-delivery');
        if (!deliveryItem) return;

        // deliveryItemにposition: relativeを設定
        const originalPosition = deliveryItem.style.position;
        if (!deliveryItem.style.position || deliveryItem.style.position === 'static') {
          deliveryItem.style.position = 'relative';
        }

        // 一時的にテキストを非表示（opacityで非表示にしてレイアウトを維持）
        dateElement.style.opacity = '0';

        // エディタを追加（deliveryItem内に配置）
        deliveryItem.appendChild(editorDiv);

        // 位置を計算（dateElementの相対位置）
        const itemRect = deliveryItem.getBoundingClientRect();
        const dateRect = dateElement.getBoundingClientRect();
        editorDiv.style.position = 'absolute';
        editorDiv.style.top = (dateRect.top - itemRect.top + dateRect.height + 4) + 'px';
        editorDiv.style.left = (dateRect.left - itemRect.left) + 'px';

        const inputs = editorDiv.querySelectorAll('.datetime-segment');

        // 各inputにイベントリスナーを設定
        inputs.forEach((input, index) => {
          // 数字のみ入力可能
          input.addEventListener('input', (e) => {
            let value = e.target.value.replace(/[^0-9]/g, '');
            const maxLength = parseInt(e.target.getAttribute('maxlength'));

            if (value.length > maxLength) {
              value = value.substring(0, maxLength);
            }

            e.target.value = value;

            // 最大桁数に達したら次のフィールドへ
            if (value.length >= maxLength && index < inputs.length - 1) {
              inputs[index + 1].focus();
              inputs[index + 1].select();
            }
          });

          // キーボード操作
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) {
              e.preventDefault();
              saveDeliveryDateTime(editorDiv, dateElement, workId, originalValue, inputs);
            } else if (e.key === 'Escape') {
              e.preventDefault();
              cancelDeliveryDateTime(editorDiv, dateElement, originalText);
            } else if (e.key === 'Tab') {
              // Tabキーは自然な動作を許可
              if (!e.shiftKey && index === inputs.length - 1) {
                // 最後のフィールドでTabを押したら保存
                e.preventDefault();
                saveDeliveryDateTime(editorDiv, dateElement, workId, originalValue, inputs);
              }
            } else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) {
              // カーソルが末尾にある場合は次のフィールドへ
              if (index < inputs.length - 1) {
                e.preventDefault();
                inputs[index + 1].focus();
                inputs[index + 1].setSelectionRange(0, 0);
              }
            } else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) {
              // カーソルが先頭にある場合は前のフィールドへ
              if (index > 0) {
                e.preventDefault();
                const prevInput = inputs[index - 1];
                prevInput.focus();
                prevInput.setSelectionRange(prevInput.value.length, prevInput.value.length);
              }
            }
          });

          // フォーカスアウト時の処理
          input.addEventListener('blur', (e) => {
            setTimeout(() => {
              // 次のフォーカスがdatetime-segment内かチェック
              const focusedElement = document.activeElement;
              if (!focusedElement || !focusedElement.classList.contains('datetime-segment') || !editorDiv.contains(focusedElement)) {
                saveDeliveryDateTime(editorDiv, dateElement, workId, originalValue, inputs);
              }
            }, 100);
          });
        });

        // クリックアウトサイドで閉じる
        const clickOutsideHandler = (e) => {
          if (!editorDiv.contains(e.target) && e.target !== dateElement) {
            saveDeliveryDateTime(editorDiv, dateElement, workId, originalValue, inputs);
            document.removeEventListener('click', clickOutsideHandler);
          }
        };
        setTimeout(() => {
          document.addEventListener('click', clickOutsideHandler);
        }, 100);

        // 最初のフィールドにフォーカス
        setTimeout(() => {
          inputs[0].focus();
          inputs[0].select();
        }, 50);
      }

      function saveDeliveryDateTime(editorDiv, dateElement, workId, originalValue, inputs) {
        const values = Array.from(inputs).map(input => input.value);
        const [yyyy, mm, dd, hh, min] = values;

        // バリデーション
        const yearNum = parseInt(yyyy);
        const monthNum = parseInt(mm);
        const dayNum = parseInt(dd);
        const hourNum = parseInt(hh);
        const minuteNum = parseInt(min);

        if (isNaN(yearNum) || yearNum < 1900 || yearNum > 2100 ||
          isNaN(monthNum) || monthNum < 1 || monthNum > 12 ||
          isNaN(dayNum) || dayNum < 1 || dayNum > 31 ||
          isNaN(hourNum) || hourNum < 0 || hourNum > 23 ||
          isNaN(minuteNum) || minuteNum < 0 || minuteNum > 59) {
          alert('無効な日時です');
          cancelDeliveryDateTime(editorDiv, dateElement, dateElement.textContent);
          return;
        }

        // ISO形式の日時文字列を作成（秒は00固定）
        const paddedYyyy = yyyy.padStart(4, '0');
        const paddedMm = mm.padStart(2, '0');
        const paddedDd = dd.padStart(2, '0');
        const paddedHh = hh.padStart(2, '0');
        const paddedMin = min.padStart(2, '0');

        const newDateStr = `${paddedYyyy}-${paddedMm}-${paddedDd}T${paddedHh}:${paddedMin}:00`;
        const newDate = new Date(newDateStr);

        if (isNaN(newDate.getTime())) {
          alert('無効な日時です');
          cancelDeliveryDateTime(editorDiv, dateElement, dateElement.textContent);
          return;
        }

        const newValueAsISO = newDate.toISOString();

        // エディタを削除
        if (editorDiv && editorDiv.parentNode) {
          editorDiv.parentNode.removeChild(editorDiv);
        }

        // テキストを再表示
        dateElement.style.opacity = '1';

            value: e.target.value,
            blurTimeoutId: blurTimeoutId,
            activeElement: document.activeElement === projectTitleInput
          });

          // 既存のblurタイマーをキャンセル
          if (blurTimeoutId) {
            console.log('[DEBUG] Cancelling blur timeout');
            clearTimeout(blurTimeoutId);
            blurTimeoutId = null;
          }

          const currentValue = e.target.value.trim();
          console.log('[DEBUG] onfocus currentValue:', currentValue);
          if (currentValue) {

        // フォーカスが外れたときに元の値に戻す

          console.log('[DEBUG] onblur triggered', {
            value: e.target.value,
            relatedTarget: e.relatedTarget,
            activeElement: document.activeElement,
            relatedTargetIsDropdown: e.relatedTarget && e.relatedTarget.closest('.overlay-project-title-dropdown')
          });

          // ドロップダウン内をクリックした場合は処理をスキップ
          if (e.relatedTarget && e.relatedTarget.closest('.overlay-project-title-dropdown')) {
            console.log('[DEBUG] Clicked on dropdown, skipping blur processing');
            return;
          }

          // 少し遅延させて、ドロップダウンのクリックイベントが先に処理されるようにする
          blurTimeoutId = setTimeout(() => {
            console.log('[DEBUG] blur timeout executed', {
              activeElement: document.activeElement,
              isInputFocused: document.activeElement === projectTitleInput,
              dropdownSelected: projectTitleInput.dataset.dropdownSelected
            });

            // フォーカスが再度当たっている場合は処理をスキップ
            if (document.activeElement === projectTitleInput) {
              console.log('[DEBUG] Input is focused again, skipping blur processing');
              blurTimeoutId = null;
              return;
            }

            const dropdownContainer = overlayProjectTitle.querySelector('.overlay-project-title-dropdown');
            const currentValue = projectTitleInput.value.trim();
            const dropdownDisplay = dropdownContainer ? dropdownContainer.style.display : 'not found';
            const isDropdownVisible = dropdownContainer && dropdownContainer.style.display !== 'none';

            console.log('[DEBUG] blur processing', {
              dropdownSelected: projectTitleInput.dataset.dropdownSelected,
              dropdownDisplay: dropdownDisplay,
              isDropdownVisible: isDropdownVisible,
              currentValue: currentValue,
              originalProjectTitle: originalProjectTitle,
              shouldReset: projectTitleInput.dataset.dropdownSelected !== 'true' &&
                !isDropdownVisible &&
                currentValue !== originalProjectTitle
            });

            // ドロップダウンが選択されていない場合、かつドロップダウンが非表示で、かつ値が変更されている場合は元の値に戻す
            if (projectTitleInput.dataset.dropdownSelected !== 'true' &&
              !isDropdownVisible &&
              currentValue !== originalProjectTitle) {
              // 値が変更されているが、ドロップダウンで選択されなかった場合は元の値に戻す
              console.log('[DEBUG] Resetting value to original');
              projectTitleInput.value = originalProjectTitle;
              projectTitleInput.dataset.projectId = originalProjectId;
            }
            // フラグをリセット
            projectTitleInput.dataset.dropdownSelected = 'false';
            blurTimeoutId = null;
          }, 200);
        };

        // キーボード操作のサポート
        let selectedIndex = -1;
        projectTitleInput.onkeydown = (e) => {
          const dropdownContainer = overlayProjectTitle.querySelector('.overlay-project-title-dropdown');
          if (!dropdownContainer || dropdownContainer.style.display === 'none') {
            return;
          }

          const options = dropdownContainer.querySelectorAll('.popup-editor-option');
          if (options.length === 0) return;

          if (e.key === 'ArrowDown') {
            e.preventDefault();
            selectedIndex = Math.min(selectedIndex + 1, options.length - 1);
            options[selectedIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            options.forEach((opt, idx) => {
              opt.classList.toggle('selected', idx === selectedIndex);
            });
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            selectedIndex = Math.max(selectedIndex - 1, -1);
            options.forEach((opt, idx) => {
              opt.classList.toggle('selected', idx === selectedIndex);
            });
            if (selectedIndex >= 0) {
              options[selectedIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
          } else if (e.key === 'Enter' && selectedIndex >= 0) {
            e.preventDefault();
            options[selectedIndex].click();
          } else if (e.key === 'Escape') {
            dropdownContainer.style.display = 'none';
            selectedIndex = -1;
          }
        };

        overlayProjectTitle.appendChild(projectTitleInput);

        // ドロップダウンコンテナを作成（既存のものを削除してから作成）
        let dropdownContainer = overlayProjectTitle.querySelector('.overlay-project-title-dropdown');
        if (dropdownContainer) {

      // 制作物種別

      // 依頼受付優先度

      }

      // 依頼者

        overlayClient.textContent = clientMember ? `${clientMember.member_name}/${getConfigLabel(clientMember.member_team_key, 'TEAM')}` : work.work_client_email || '';

      // 担当者
      const overlayAssignees = document.getElementById('overlay-assignees');
      if (overlayAssignees) {

          openAddAssigneeDropdown(e.target, work.work_id, work.assignees || []);
        };
      }

      // Googleドキュメントを埋め込む
      const docContainer = document.getElementById('work-detail-document-container');
      let currentDocumentClickHandler = null;
      let containerClickHandler = null;
      let observer = null;

      // 既存のイベントリスナーをクリーンアップ
      if (docContainer._iframeActive !== undefined) {
        if (docContainer._containerClickHandler) {
          docContainer.removeEventListener('click', docContainer._containerClickHandler);
        }
        if (docContainer._documentClickHandler) {
          document.removeEventListener('click', docContainer._documentClickHandler, true);
        }
        if (docContainer._observer) {
          docContainer._observer.disconnect();
        }
      }

      if (work.work_document_id) {
        // Googleドキュメントを編集可能な状態で埋め込む（rm=minimalパラメータ追加）
        const embedUrl = `https:\/\/docs.google.com/document/d/${work.work_document_id}/edit?rm=minimal&tab=${work.work_document_tab_id}`;
        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.style.cssText = 'width: 100%; height: 100%; max-width: 100%; border: none; overflow-x: hidden; border-radius: 8px; pointer-events: none;';
        docContainer.innerHTML = '';
        docContainer.appendChild(iframe);

        // iframeを無効化する関数
        const deactivateIframe = function () {
          iframe.style.pointerEvents = 'none';
          if (currentDocumentClickHandler) {
            document.removeEventListener('click', currentDocumentClickHandler, true);
            currentDocumentClickHandler = null;
          }
          docContainer._iframeActive = false;
        };

        // コンテナをクリックしたときにiframeを有効化
        let isIframeActive = false;
        containerClickHandler = function (e) {
          // iframe内のクリックは無視（iframe自身が処理）
          if (e.target === iframe) return;

          // コンテナをクリックした場合、iframeを有効化
          if (!isIframeActive) {
            iframe.style.pointerEvents = 'auto';
            isIframeActive = true;
            docContainer._iframeActive = true;

            // ドキュメント外をクリックしたときにiframeを無効化
            currentDocumentClickHandler = function (e) {
              // オーバーレイ内のクリックをチェック
              const overlay = document.getElementById('work-detail-overlay');
              if (overlay && overlay.contains(e.target)) {
                // work-detail-document-container外のクリックの場合のみ無効化
                if (!docContainer.contains(e.target) && e.target !== iframe) {
                  isIframeActive = false;
                  deactivateIframe();
                }
              } else {
                // オーバーレイ外のクリックの場合は無効化
                isIframeActive = false;
                deactivateIframe();
              }
            };

            // 少し遅延させてからイベントリスナーを追加（iframe内のクリックイベントが先に処理されるように）
            setTimeout(() => {
              document.addEventListener('click', currentDocumentClickHandler, true);
              docContainer._documentClickHandler = currentDocumentClickHandler;
            }, 100);
          }
        };

        docContainer.addEventListener('click', containerClickHandler);
        docContainer._containerClickHandler = containerClickHandler;

        // オーバーレイが閉じられたときにiframeを無効化
        const overlay = document.getElementById('work-detail-overlay');
        observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
              if (!overlay.classList.contains('show')) {
                isIframeActive = false;
                deactivateIframe();
              }
            }
          });
        });
        observer.observe(overlay, { attributes: true });
        docContainer._observer = observer;
      } else {
        docContainer.innerHTML = '';
      }

      renderWorkTasks(work.tasks);
      renderWorkAssignees(work.assignees);
      // renderWorkApps(work.apps);
      // renderWorkReviewRequests(work.review_requests || []);
      document.getElementById('new-task-button').onclick = () => openNewTaskModal(work.work_id);
      document.getElementById('new-review-request-button').onclick = () => openNewReviewRequestModal(work.work_id);
      document.getElementById('work-detail-overlay').classList.add('show');
      hideLoading();
    }).catch(handleError);
  }

  function initRichTextEditors() {
    // すべてのリッチテキストエディタのツールバーを初期化
    document.querySelectorAll('.rich-text-toolbar').forEach(toolbar => {
      const editorId = toolbar.dataset.editor;
      const editor = document.getElementById(editorId);
      if (!editor) return;

      // ツールバーボタンのイベントリスナーを設定
      toolbar.querySelectorAll('.toolbar-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const command = btn.dataset.command;
          const value = btn.dataset.value;
          const color = btn.dataset.color;

          editor.focus();

          if (color) {
            // 色選択
            document.execCommand('foreColor', false, color);
          } else if (command === 'formatBlock' && value) {
            // 見出し
            document.execCommand('formatBlock', false, value);
          } else {
            // その他のコマンド（bold, italic, strikeThrough, underline）
            document.execCommand(command, false, null);
          }

          updateToolbarState(toolbar, editor);
        });
      });

      // エディタの変更を監視して自動保存
      let saveTimeout = null;
      editor.addEventListener('input', () => {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          saveRichTextEditor(editor);
        }, 2000); // 2秒後に自動保存
      });

      // エディタのフォーカス時にツールバーの状態を更新
      editor.addEventListener('focus', () => {
        updateToolbarState(toolbar, editor);
      });

      editor.addEventListener('keyup', () => {
        updateToolbarState(toolbar, editor);
      });
    });
  }

  function updateToolbarState(toolbar, editor) {
    // ツールバーボタンのアクティブ状態を更新
    toolbar.querySelectorAll('.toolbar-btn').forEach(btn => {
      const command = btn.dataset.command;
      const value = btn.dataset.value;

      btn.classList.remove('active');

      if (command === 'formatBlock' && value) {
        // 見出しの状態をチェック
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
          const range = selection.getRangeAt(0);
          const node = range.commonAncestorContainer;
          const parent = node.nodeType === 1 ? node : node.parentElement;
          if (parent && parent.tagName && parent.tagName.toLowerCase() === value) {
            btn.classList.add('active');
          }
        }
      } else if (command && !btn.dataset.color) {
        // その他のコマンドの状態をチェック
        if (document.queryCommandState(command)) {
          btn.classList.add('active');
        }
      }
    });
  }

  function saveRichTextEditor(editor) {
    const workId = editor.dataset.workId;
    const field = editor.dataset.field;
    if (!workId || !field) return;

    const content = editor.innerHTML;

    // バックエンドに保存
    callGAS('updateWorkField', workId, field, content)
      .then(() => {
        // 保存成功（必要に応じて通知を表示）
      })
      .catch(error => {
        console.error('リッチテキスト保存エラー:', error);
      });
  }

  function searchPlansForCreativeDetail(query, workId) {
    const planTitleHeader = document.getElementById('creative-detail-plan-title-header');
    const suggestionsContainer = document.getElementById('creative-detail-plan-suggestions');
    const planTitleInput = planTitleHeader.querySelector('input');

    if (!query) {
      suggestionsContainer.style.display = 'none';
      return;
    }

    // plansDataが取得されていない場合は取得
    if (!plansData || plansData.length === 0) {
      callGAS('getItems', SHEET_NAMES.PLANS).then(data => {
        plansData = data;
        performPlanSearch(query, workId, suggestionsContainer, planTitleInput);
      }).catch(handleError);
    } else {
      performPlanSearch(query, workId, suggestionsContainer, planTitleInput);
    }
  }

  function performPlanSearch(query, workId, suggestionsContainer, planTitleInput) {
    const lowerCaseQuery = query.toLowerCase();
    const filteredPlans = (plansData || []).filter(p =>
      p.title.toLowerCase().includes(lowerCaseQuery)
    );

    suggestionsContainer.innerHTML = '';

    // 入力フィールドの位置を取得
    const inputRect = planTitleInput.getBoundingClientRect();

    filteredPlans.forEach(p => {
      const item = document.createElement('div');
      item.className = 'combobox-item';
      item.textContent = p.title;
      item.onclick = () => {
        planTitleInput.value = p.title;
        const oldPlanId = planTitleInput.dataset.planId;
        planTitleInput.dataset.planId = p.id;
        suggestionsContainer.style.display = 'none';
        // 企画IDを更新
        if (p.id !== oldPlanId) {
          showLoading();
          callGAS('updateItem', SHEET_NAMES.CREATIVES, workId, { plan_id: p.id })
            .then(() => {
              document.getElementById('creative-detail-plan-id-header').textContent = p.id;
              hideLoading();
            })
            .catch(handleError);
        }
      };
      suggestionsContainer.appendChild(item);
    });

    const newItem = document.createElement('div');
    newItem.className = 'combobox-item';
    newItem.innerHTML = `+ 新規作成: <strong>${escapeHtml(query)}</strong>`;
    newItem.onclick = () => {
      showLoading();
      callGAS('createItem', SHEET_NAMES.PLANS, { title: query }).then(planId => {
        planTitleInput.value = query;
        planTitleInput.dataset.planId = planId;
        suggestionsContainer.style.display = 'none';
        document.getElementById('creative-detail-plan-id-header').textContent = planId;
        // 企画IDを更新
        callGAS('updateItem', SHEET_NAMES.CREATIVES, workId, { plan_id: planId })
          .then(() => {
            // plansDataを更新
            if (plansData) {
              plansData.push({ id: planId, title: query });
            }
            hideLoading();
          })
          .catch(handleError);
      }).catch(handleError);
    };
    suggestionsContainer.appendChild(newItem);

    // 位置を設定
    suggestionsContainer.style.left = `${inputRect.left}px`;
    suggestionsContainer.style.top = `${inputRect.bottom + window.scrollY}px`;
    suggestionsContainer.style.width = `${inputRect.width}px`;
    suggestionsContainer.style.display = 'block';
  }

  function openDateTimePickerForWorkDetail(event, workId, field, originalValue) {
    event.stopPropagation();
    event.preventDefault();

    const container = event.currentTarget;
    const textSpan = container.querySelector('.editable-text');

    let dateObj;
    if (originalValue) {
      dateObj = new Date(originalValue);
    } else {
      dateObj = new Date();
    }

    const yyyy = dateObj.getFullYear().toString().padStart(4, '0');
    const mm = (dateObj.getMonth() + 1).toString().padStart(2, '0');
    const dd = dateObj.getDate().toString().padStart(2, '0');
    const hh = dateObj.getHours().toString().padStart(2, '0');
    const min = dateObj.getMinutes().toString().padStart(2, '0');

    // 既存のコンテンツを非表示
    container.style.display = 'none';

    // カスタム日時入力フィールドを作成
    const editorDiv = document.createElement('div');
    editorDiv.className = 'datetime-custom-editor';
    editorDiv.style.position = 'absolute';
    editorDiv.style.zIndex = '1000';
    editorDiv.innerHTML = `
      <input type="text" class="datetime-segment" data-segment="yyyy" maxlength="4" value="${yyyy}" placeholder="yyyy" />
      <span class="datetime-separator">/</span>
      <input type="text" class="datetime-segment" data-segment="mm" maxlength="2" value="${mm}" placeholder="mm" />
      <span class="datetime-separator">/</span>
      <input type="text" class="datetime-segment" data-segment="dd" maxlength="2" value="${dd}" placeholder="dd" />
      <span class="datetime-separator"> </span>
      <input type="text" class="datetime-segment" data-segment="hh" maxlength="2" value="${hh}" placeholder="hh" />
      <span class="datetime-separator">:</span>
      <input type="text" class="datetime-segment" data-segment="min" maxlength="2" value="${min}" placeholder="mm" />
    `;

    const rect = container.getBoundingClientRect();
    editorDiv.style.left = `${rect.left + window.scrollX}px`;
    editorDiv.style.top = `${rect.bottom + window.scrollY}px`;
    editorDiv.style.zIndex = '99999';
    document.body.appendChild(editorDiv);

    const inputs = editorDiv.querySelectorAll('.datetime-segment');

    // 各inputにイベントリスナーを設定
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        let value = e.target.value.replace(/[^0-9]/g, '');
        const maxLength = parseInt(e.target.getAttribute('maxlength'));
        if (value.length > maxLength) {
          value = value.substring(0, maxLength);
        }
        e.target.value = value;
        if (value.length >= maxLength && index < inputs.length - 1) {
          inputs[index + 1].focus();
          inputs[index + 1].select();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing) {
          e.preventDefault();
          saveWorkDetailDateTime(editorDiv, container, workId, field, originalValue, inputs);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          cancelWorkDetailDateTime(editorDiv, container);
        }
      });

      input.addEventListener('blur', (e) => {
        setTimeout(() => {
          const focusedElement = document.activeElement;
          if (!focusedElement || !focusedElement.classList.contains('datetime-segment')) {
            saveWorkDetailDateTime(editorDiv, container, workId, field, originalValue, inputs);
          }
        }, 100);
      });
    });

    setTimeout(() => {
      inputs[0].focus();
      inputs[0].select();
    }, 50);
  }

  function saveWorkDetailDateTime(editorDiv, container, workId, field, originalValue, inputs) {
    const values = Array.from(inputs).map(input => input.value);
    const [yyyy, mm, dd, hh, min] = values;

    const yearNum = parseInt(yyyy);
    const monthNum = parseInt(mm);
    const dayNum = parseInt(dd);
    const hourNum = parseInt(hh);
    const minuteNum = parseInt(min);

    if (isNaN(yearNum) || yearNum < 1900 || yearNum > 2100 ||
      isNaN(monthNum) || monthNum < 1 || monthNum > 12 ||
      isNaN(dayNum) || dayNum < 1 || dayNum > 31 ||
      isNaN(hourNum) || hourNum < 0 || hourNum > 23 ||
      isNaN(minuteNum) || minuteNum < 0 || minuteNum > 59) {
      alert('無効な日時です');
      cancelWorkDetailDateTime(editorDiv, container);
      return;
    }

    const newDateStr = `${yyyy.padStart(4, '0')}-${mm.padStart(2, '0')}-${dd.padStart(2, '0')}T${hh.padStart(2, '0')}:${min.padStart(2, '0')}:00`;
    const newDate = new Date(newDateStr);

    if (isNaN(newDate.getTime())) {
      alert('無効な日時です');
      cancelWorkDetailDateTime(editorDiv, container);
      return;
    }

    const newValueAsISO = newDate.toISOString();

    editorDiv.remove();
    container.style.display = 'inline-flex';

    if (newValueAsISO !== originalValue) {
      showLoading();
      callGAS('updateItem', SHEET_NAMES.CREATIVES, workId, { [field]: newValueAsISO })
        .then(() => {
          const textSpan = container.querySelector('.editable-text');
          if (textSpan) {
            textSpan.textContent = formatDateTimeForDisplay(newValueAsISO);
          }
          hideLoading();
        })
        .catch(handleError);
    }
  }

  function saveWorkDetailDateTimeHeader(editorDiv, container, workId, field, originalValue, inputs) {
    const values = Array.from(inputs).map(input => input.value);
    const [yyyy, mm, dd, hh, min] = values;

    const yearNum = parseInt(yyyy);
    const monthNum = parseInt(mm);
    const dayNum = parseInt(dd);
    const hourNum = parseInt(hh);
    const minuteNum = parseInt(min);

    if (isNaN(yearNum) || yearNum < 1900 || yearNum > 2100 ||
      isNaN(monthNum) || monthNum < 1 || monthNum > 12 ||
      isNaN(dayNum) || dayNum < 1 || dayNum > 31 ||
      isNaN(hourNum) || hourNum < 0 || hourNum > 23 ||
      isNaN(minuteNum) || minuteNum < 0 || minuteNum > 59) {
      alert('無効な日時です');
      cancelWorkDetailDateTime(editorDiv, container);
      return;
    }

    const newDateStr = `${yyyy.padStart(4, '0')}-${mm.padStart(2, '0')}-${dd.padStart(2, '0')}T${hh.padStart(2, '0')}:${min.padStart(2, '0')}:00`;
    const newDate = new Date(newDateStr);

    if (isNaN(newDate.getTime())) {
      alert('無効な日時です');
      cancelWorkDetailDateTime(editorDiv, container);
      return;
    }

    const newValueAsISO = newDate.toISOString();

    // テキストとボタンを再表示（先に表示を戻す）
    const textSpan = container.querySelector('.editable-text');
    if (textSpan) {
      textSpan.style.display = '';

    const toggleBtn = container.querySelector('.editable-toggle-btn');
    if (toggleBtn) {
      toggleBtn.style.display = '';
    }

    // ピッカーを削除
    editorDiv.remove();

    if (newValueAsISO !== originalValue) {
      showLoading();
      callGAS('updateItem', SHEET_NAMES.CREATIVES, workId, { [field]: newValueAsISO })
        .then(() => {
          const textSpanHeader = document.getElementById('work-detail-due-text-header');
          const textSpan = document.getElementById('work-detail-due-text');
          const formattedDate = formatDateTimeForDisplay(newValueAsISO);
          if (textSpanHeader) {
            textSpanHeader.textContent = formattedDate;
          }
          if (textSpan) {
            textSpan.textContent = formattedDate;
          }
          // 残り日数も更新
          if (field === 'due_datetime') {

          hideLoading();
        })

  function renderWorkTasks(tasks) {
    const container = document.getElementById('work-tasks-container');
    container.innerHTML = '';

      container.innerHTML = '<p class="text-sm text-gray-500">タスクはありません。</p>';

      const card = document.createElement('div');
      card.className = 'task-card';
      card.dataset.taskId = task.task_id;

      const statusColor = getTaskStatusColor(task.status_key);

      // 担当者の情報を取得
      const assignee = task.assign_to ? membersData.find(m => m.member_email === task.assign_to) : null;
      const assigneeName = assignee ? assignee.member_name : '';
      const assigneeTeam = assignee ? getConfigLabel(assignee.member_team_key, 'TEAM') : '';

            <div class="task-card-status-indicator" style="border-color: ${statusColor};">
              <div class="task-card-status-icon" style="background-color: ${statusColor};"></div>
            </div>
          </div>
          <div class="task-card-title">
            ${escapeHtml(task.task_title)}
          </div>
          <div class="task-card-footer">
            <div class="task-card-assignee">
              ${task.assign_to ? `
                <img src="${assigneeIcon}" class="task-card-avatar" alt="${escapeHtml(assigneeName)}" title="${escapeHtml(assigneeName)}/${escapeHtml(assigneeTeam)}">
              ` : '<div class="task-card-avatar-placeholder">未設定</div>'}
            </div>
            <div class="task-card-date">
              ${formatDateTimeForDisplay(task.planned_end_datetime)}
            </div>
          </div>

      card.addEventListener('click', () => {
