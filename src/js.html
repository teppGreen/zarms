<script>
  const { TABLE_NAMES, DIRECTORY_TYPES, TASK_STATUS, activeUser } = templateVariables;

  // App.state の初期化とデータ管理用関数の定義
  (function () {
    App.state = {
      data: {
        boards: [],
        directories: [],
        members: [],
        tasks: [],
        links: []
      },
      userId: null, // 現在のユーザーのID（uuid）
      previousTab: null,

      get: function (tableName) {
        return this.data[tableName];
      },

      set: function (tableName, data) {
        this.data[tableName] = data;
      }
    };
  })();


  window.onload = initializeApp;

  // 初期化
  async function initializeApp() {
    setupGlobalShortcuts();
    setupBrowserHistoryHandlers();

    // ユーザーIDを設定（templateVariablesから取得）
    if (activeUser && activeUser.id) {
      App.state.userId = activeUser.id;
    }

    // URLパラメータを取得
    const urlParams = templateVariables.urlParams || {};
    console.log('[initializeApp] URL params:', urlParams);

    // データ読み込み前にホームページを表示（ユーザーがタブを切り替えられるようにする）
    // URLパラメータがある場合はそれを使用、ない場合はhomeを表示
    let initialTab = 'home';
    let hasUrlParams = false;
    
    if (urlParams.tab) {
      hasUrlParams = true;
      if (urlParams.tab === 'board' && urlParams.board_id) {
        initialTab = 'board-' + urlParams.board_id;
      } else if (urlParams.tab !== 'board') {
        initialTab = urlParams.tab;
      }
    }

    if (App.utils.navigation && App.utils.navigation.switchTab) {
      App.utils.navigation.switchTab(initialTab, true); // trueでURL更新をスキップ
    }

    // URLパラメータがない場合は、初期状態をURLに反映（replaceStateで履歴に追加しない）
    if (!hasUrlParams && App.utils.url && App.utils.url.updateParams) {
      const params = App.utils.url.getParamsFromTabId(initialTab);
      App.utils.url.updateParams(params, true); // trueでreplaceState
    }

    // 全データを読み込み
    await loadAllData();

    // モーダルパラメータがある場合は該当のモーダルを開く
    if (urlParams.modal) {
      openModalFromParams(urlParams);
    }

    // 自動更新を開始
    startAutoRefresh();
  }

  /**
   * URLパラメータからモーダルを開く
   * @param {Object} params - URLパラメータ
   */
  function openModalFromParams(params) {
    console.log('[openModalFromParams] Opening modal from params:', params);
    
    // 定数定義
    const MAX_RETRY_ATTEMPTS = 10; // 最大リトライ回数
    const RETRY_DELAY_MS = 200;     // リトライ間隔（ミリ秒）
    const INITIAL_DELAY_MS = 500;   // 初期待機時間（ミリ秒）
    
    // タスク詳細モーダル
    if (params.modal === 'task-detail' && params.task_id) {
      if (App.modals.taskDetail && App.modals.taskDetail.open) {
        // データが読み込まれるまで少し待つ、またはデータが利用可能になるまでリトライ
        const attemptOpen = (retries = 0) => {
          const boardTasks = App.pages.boards?.currentBoardTasks || [];
          const task = boardTasks.find(t => t.id === params.task_id);
          
          if (task || retries >= MAX_RETRY_ATTEMPTS) {
            // タスクが見つかったか、リトライ回数上限に達した場合は開く
            App.modals.taskDetail.open(params.task_id, true); // trueでURL更新をスキップ
          } else {
            // タスクが見つからない場合は少し待ってリトライ
            setTimeout(() => attemptOpen(retries + 1), RETRY_DELAY_MS);
          }
        };
        setTimeout(() => attemptOpen(), INITIAL_DELAY_MS);
      }
    }
    // メンバー詳細モーダル
    else if (params.modal === 'member-detail' && params.member_id) {
      if (App.modals.memberDetail && App.modals.memberDetail.open) {
        setTimeout(() => {
          App.modals.memberDetail.open(params.member_id, true); // trueでURL更新をスキップ
        }, INITIAL_DELAY_MS);
      }
    }
  }

  /**
   * ブラウザ履歴の戻る/進むボタンへの対応
   */
  function setupBrowserHistoryHandlers() {
    window.addEventListener('popstate', function(event) {
      console.log('[popstate] Browser back/forward button pressed', event.state);
      
      const params = event.state || App.utils.url.getParams();
      
      // タブを切り替え
      if (params.tab) {
        let tabId = 'home';
        if (params.tab === 'board' && params.board_id) {
          tabId = 'board-' + params.board_id;
        } else if (params.tab !== 'board') {
          tabId = params.tab;
        }
        
        if (App.utils.navigation && App.utils.navigation.switchTab) {
          App.utils.navigation.switchTab(tabId, true); // URL更新をスキップ
        }
      }
      
      // モーダルの処理
      // 既存のモーダルを全て閉じる（各モーダルのcloseメソッドを使用）
      const openModals = document.querySelectorAll('dialog[open]');
      openModals.forEach(modal => {
        const modalId = modal.id;
        
        // モーダルIDからモーダルオブジェクトを取得してcloseメソッドを呼び出す
        // skipUrlUpdate=trueでURL更新をスキップ
        if (modalId === 'modal-detail-task' && App.modals.taskDetail && App.modals.taskDetail.close) {
          App.modals.taskDetail.close(true); // trueでURL更新をスキップ
        } else if (modalId === 'modal-detail-member' && App.modals.memberDetail && App.modals.memberDetail.close) {
          App.modals.memberDetail.close(true); // trueでURL更新をスキップ
        } else {
          // フォールバック: ui関数（Beer CSSのモーダルトグル）またはネイティブのclose()を使用
          if (typeof ui === 'function') {
            ui(`#${modalId}`); // Beer CSSのモーダルトグル関数
          } else {
            modal.close(); // ネイティブのdialog要素のclose()メソッド
          }
        }
      });
      
      // パラメータにモーダルが指定されている場合は開く
      if (params.modal) {
        openModalFromParams(params);
      }
    });
  }

  // 初回ロード: 最小限のデータのみ取得
  async function loadAllData() {
    try {
      // boards と links テーブルから並列でデータ取得
      const [boardsResult, linksResult] = await Promise.all([
        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'select', {
          columns: ['id', 'display_id', 'name', 'description', 'is_active']
        }),
        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.LINKS, 'select', {})
      ]);

      // 結果からデータを取得（キャッシュ情報を含む可能性がある）
      const boards = boardsResult?.data || boardsResult || [];
      const links = linksResult?.data || linksResult || [];

      // App.stateに保存
      console.log('Boards fetched (minimal):', boards);
      console.log('Links fetched:', links);
      App.state.data.boards = boards;
      App.state.data.links = links;

      // members, tasks, directoriesは各タブを開いた時に取得するため、ここでは空配列で初期化
      App.state.data.members = [];
      App.state.data.tasks = [];
      App.state.data.directories = [];

      // キャッシュからのデータだった場合、バックグラウンドで再取得
      if (boardsResult?.isCached === true) {
        console.log('キャッシュデータを検出。バックグラウンドで再取得中...', [TABLE_NAMES.BOARDS]);
        setTimeout(async () => {
          try {
            const freshResult = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'select', {
              columns: ['id', 'display_id', 'name', 'description', 'is_active']
            }, null, true);

            const freshBoards = freshResult?.data || freshResult || [];
            App.state.data.boards = freshBoards;

            // ナビゲーションを更新
            if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
              App.utils.navigation.renderBoardsNavigation();
            }
            if (App.pages && App.pages.boards && App.pages.boards.initialize) {
              App.pages.boards.initialize();
            }
            console.log('バックグラウンド更新完了');
          } catch (error) {
            console.error('バックグラウンド更新エラー:', error);
          }
        }, 100);
      }

      // ナビゲーションとボードページを更新
      if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
        App.utils.navigation.renderBoardsNavigation();
      }
      if (App.pages && App.pages.boards && App.pages.boards.initialize) {
        App.pages.boards.initialize();
      }

      // アプリリンクを描画
      if (App.utils.header && App.utils.header.renderAppLinks) {
        App.utils.header.renderAppLinks();
      }

      hideLoading();
    } catch (error) {
      console.error('データ読み込みエラー:', error);
      hideLoading();
      App.utils.error.handle(error);
    }
  }

  // 自動データ更新（1分ごと）
  let autoRefreshInterval = null;

  function startAutoRefresh() {
    // 既存のインターバルがあればクリア
    if (autoRefreshInterval) {
      clearInterval(autoRefreshInterval);
    }

    // 1分ごとにデータを更新
    autoRefreshInterval = setInterval(refreshData, 60000);
  }

  async function refreshData() {
    try {
      // 1. バックグラウンドで全データを再取得（forceRefreshを使用）
      const [boardsResult, membersResult, tasksResult, directoriesResult] = await Promise.all([
        callGAS('getItems', App.state.userId, TABLE_NAMES.BOARDS, true),  // forceRefresh = true
        callGAS('getItems', App.state.userId, TABLE_NAMES.MEMBERS, true),
        callGAS('getItems', App.state.userId, TABLE_NAMES.TASKS, true),
        callGAS('getItems', App.state.userId, TABLE_NAMES.DIRECTORIES, true)
      ]);

      // 2. 現在のアクティブタブ状態を保存（DOM更新前に保存）
      const currentTab = document.querySelector('main > div[style*="display: block"]');
      const savedTabId = currentTab ? currentTab.id : null;

      // ボードタブの場合、表示中の個別ボードIDも保存
      let savedBoardId = null;
      if (savedTabId === 'tab-board') {
        const activeBoard = document.querySelector('#tab-board > div[style*="display: block"]');
        if (activeBoard && activeBoard.id) {
          savedBoardId = activeBoard.id.replace('tab-board-', '');
        }
      }

      // 左ナビのアクティブ状態を保存
      const activeNavLink = document.querySelector('nav.left a.active');
      const savedNavDataBoardId = activeNavLink ? activeNavLink.dataset.boardId : null;
      const savedNavId = activeNavLink ? activeNavLink.id : null;

      // 3. 結果からデータを取得
      const boards = boardsResult?.data || boardsResult || [];
      const members = membersResult?.data || membersResult || [];
      const tasks = tasksResult?.data || tasksResult || [];
      const directories = directoriesResult?.data || directoriesResult || [];

      // 4. App.stateを完全に更新（DOM更新前に完了）
      App.state.data.boards = boards;
      App.state.data.members = members;
      App.state.data.tasks = tasks;
      App.state.data.directories = directories;

      // 5. すべてのデータ更新が完了してから、DOM更新を一括実行

      // ボードページを更新
      if (App.pages && App.pages.boards && App.pages.boards.initialize) {
        App.pages.boards.initialize();
      }

      // ナビゲーションを更新
      if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
        App.utils.navigation.renderBoardsNavigation();
      }

      // 左ナビのアクティブ状態を復元
      if (savedNavDataBoardId) {
        const navLink = document.querySelector(`a[data-board-id="${savedNavDataBoardId}"]`);
        if (navLink) navLink.classList.add('active');
      } else if (savedNavId) {
        const navLink = document.getElementById(savedNavId);
        if (navLink) navLink.classList.add('active');
      }

      // ボードタブの表示状態を復元
      if (savedTabId === 'tab-board' && savedBoardId) {
        const boardContainer = document.getElementById('tab-board');
        if (boardContainer) {
          boardContainer.style.display = 'block';
          // 全ての個別ボードを非表示にしてから対象を表示
          Array.from(boardContainer.children).forEach(child => {
            if (child.id && child.id.startsWith('tab-board-')) {
              child.style.display = 'none';
            }
          });
          const targetBoard = document.getElementById('tab-board-' + savedBoardId);
          if (targetBoard) {
            targetBoard.style.display = 'block';
          }
        }
      }

      // 現在表示中のページを再描画
      if (savedTabId) {
        let tabName = savedTabId.replace('tab-', '');

        // ボードタブの場合はID抽出
        if (tabName === 'board' && savedBoardId) {
          if (App.pages.boards && App.pages.boards.loadData) {
            App.pages.boards.loadData(savedBoardId);
          }
        } else if (tabName.startsWith('board-')) {
          const boardId = tabName.replace('board-', '');
          if (App.pages.boards && App.pages.boards.loadData) {
            App.pages.boards.loadData(boardId);
          }
        } else {
          if (App.pages[tabName] && App.pages[tabName].loadData) {
            App.pages[tabName].loadData();
          }
        }
      }

      console.log('データ自動更新完了');
    } catch (error) {
      console.error('データ自動更新エラー:', error);
    }
  }

  /**
   * キャッシュされたデータをバックグラウンドで再取得
   * @param {Array} results - { result, tableName } の配列
   */
  async function refreshCachedData(results) {
    const cachedTables = results.filter(r => r.result?.isCached === true);

    if (cachedTables.length === 0) {
      return; // キャッシュされたデータがない場合は何もしない
    }

    console.log('キャッシュデータを検出。バックグラウンドで再取得中...', cachedTables.map(r => r.tableName));

    // バックグラウンドで最新データを取得
    setTimeout(async () => {
      try {
        const promises = cachedTables.map(({ tableName }) =>
          callGAS('getItems', App.state.userId, tableName, true)  // forceRefresh = true
        );

        const freshResults = await Promise.all(promises);

        // UI更新前に現在のアクティブタブ状態を保存（非同期処理中にユーザーが移動した可能性を考慮）
        const currentTab = document.querySelector('main > div[style*="display: block"]');
        const savedTabId = currentTab ? currentTab.id : null;

        // ボードタブの場合、表示中の個別ボードIDも保存
        let savedBoardId = null;
        if (savedTabId === 'tab-board') {
          const activeBoard = document.querySelector('#tab-board > div[style*="display: block"]');
          if (activeBoard && activeBoard.id) {
            savedBoardId = activeBoard.id.replace('tab-board-', '');
          }
        }

        // 左ナビのアクティブ状態を保存
        const activeNavLink = document.querySelector('nav.left a.active');
        const savedNavDataBoardId = activeNavLink ? activeNavLink.dataset.boardId : null;
        const savedNavId = activeNavLink ? activeNavLink.id : null;

        // データを更新
        cachedTables.forEach(({ tableName }, index) => {
          const freshData = freshResults[index]?.data || freshResults[index] || [];
          App.state.data[tableName] = freshData;
        });

        // UIを更新
        if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
          App.utils.navigation.renderBoardsNavigation();
        }

        // 左ナビのアクティブ状態を復元
        if (savedNavDataBoardId) {
          const navLink = document.querySelector(`a[data-board-id="${savedNavDataBoardId}"]`);
          if (navLink) navLink.classList.add('active');
        } else if (savedNavId) {
          const navLink = document.getElementById(savedNavId);
          if (navLink) navLink.classList.add('active');
        }

        if (App.pages && App.pages.boards && App.pages.boards.initialize) {
          App.pages.boards.initialize();
        }

        // ボードタブの表示状態を復元
        if (savedTabId === 'tab-board' && savedBoardId) {
          const boardContainer = document.getElementById('tab-board');
          if (boardContainer) {
            boardContainer.style.display = 'block';
            // 全ての個別ボードを非表示にしてから対象を表示
            Array.from(boardContainer.children).forEach(child => {
              if (child.id && child.id.startsWith('tab-board-')) {
                child.style.display = 'none';
              }
            });
            const targetBoard = document.getElementById('tab-board-' + savedBoardId);
            if (targetBoard) {
              targetBoard.style.display = 'block';
              // カンバンを再描画
              if (App.pages.boards && App.pages.boards.renderKanban) {
                App.pages.boards.renderKanban(savedBoardId);
              }
            }
          }
        }

        console.log('バックグラウンド更新完了');
      } catch (error) {
        console.error('バックグラウンド更新エラー:', error);
      }
    }, 100); // 100ms後に実行（メインUIの表示を優先）
  }

  // グローバルショートカットキーの設定
  function setupGlobalShortcuts() {
    document.addEventListener('keydown', (e) => {
      // Cmd/Ctrl + K: 検索フォーカス
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          searchInput.focus();
          searchInput.select();
        }
      }

      // Cmd/Ctrl + N: 新規作成メニュー
      if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
        e.preventDefault();
        const newButton = document.getElementById('main-button');
        if (newButton && typeof handleMainButtonClick === 'function') {
          handleMainButtonClick({ target: newButton });
        }
      }

      // Esc: モーダルを閉じる
      if (e.key === 'Escape') {
        const openModals = document.querySelectorAll('dialog[open]');
        if (openModals.length > 0) {
          openModals.forEach(modal => {
            if (typeof ui === 'function') {
              ui(`#${modal.id}`);
            } else {
              modal.close();
            }
          });
        }
      }
    });
  }

  // 直前のcallGAS呼び出しを記録（HTTP 429エラー時の再試行用）
  let lastCallGASInvocation = null;
  // 直前のJavaScript関数呼び出しを記録（HTTP 429エラー時の再試行用）
  let lastJSInvocation = null;

  // JavaScript関数呼び出しを記録するヘルパー関数
  function recordJSInvocation(functionName, ...args) {
    lastJSInvocation = {
      functionName: functionName,
      args: args
    };
  }

  function callGAS(functionName, ...args) {
    // 呼び出し履歴を記録
    lastCallGASInvocation = {
      functionName: functionName,
      args: args
    };

    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
      [functionName](...args);
    });
  }

  let loadingTimeout = null;

  function showLoading() {
    if (loadingTimeout) clearTimeout(loadingTimeout);
    document.body.style.cursor = 'wait';
  }

  function hideLoading() {
    document.body.style.cursor = '';
  }

  function openModal(id) {
    const modal = document.getElementById(id);
    if (modal) {
      modal.classList.add('active');
    }
    const overlay = document.getElementById('overlay');
    if (overlay) {
      overlay.classList.add('active');
    }
  }

  function closeModal(id) {
    const modal = document.getElementById(id);
    if (modal) {
      modal.classList.remove('active');
    }
    const overlay = document.getElementById('overlay');
    if (overlay) {
      overlay.classList.remove('active');
    }
  }

  // ============================================
  // ヘルパー関数
  // ============================================

  function formatDateTimeForDisplay(dateString, format = 'yyyy/MM/dd(E) HH:mm') {
    if (!dateString) return '-';
    try {
      const dt = new Date(dateString);
      const year = String(dt.getFullYear()).padStart(4, '0');
      const month = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const weekday = weekdays[dt.getDay()];
      const hours = String(dt.getHours()).padStart(2, '0');
      const minutes = String(dt.getMinutes()).padStart(2, '0');
      const seconds = String(dt.getSeconds()).padStart(2, '0');

      return format
        .replace(/yyyy/g, year)
        .replace(/MM/g, month)
        .replace(/dd/g, day)
        .replace(/E/g, weekday)
        .replace(/HH/g, hours)
        .replace(/mm/g, minutes)
        .replace(/ss/g, seconds);
    } catch (e) {
      return dateString;
    }
  }

  function formatDateTimeForInput(dateString) {
    if (!dateString) return '';
    try {
      const dt = new Date(dateString);
      const offset = dt.getTimezoneOffset() * 60000;
      const localDate = new Date(dt.getTime() - offset);
      return localDate.toISOString().slice(0, 16);
    } catch (e) {
      return dateString;
    }
  }

  function escapeHtml(text) {
    if (text === null || typeof text === 'undefined') return '';
    return String(text).replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[match]);
  }

  /**
   * URLのダブルスラッシュをエスケープします
   * @param {string} url - エスケープするURL
   * @returns {string} エスケープされたURL
   */
  function escapeDoubleSlashes(url) {
    if (!url) return '';
    return String(url).replace(/\//g, '\\/');
  }

  // ============================================
  // URL Management Utilities
  // ============================================
  App.utils.url = {
    /**
     * URLパラメータを取得
     * @returns {Object} パラメータオブジェクト
     */
    getParams: function() {
      const params = {};
      const urlParams = new URLSearchParams(window.location.search);
      for (const [key, value] of urlParams) {
        params[key] = value;
      }
      return params;
    },

    /**
     * URLパラメータを更新（ブラウザ履歴にpush）
     * @param {Object} params - パラメータオブジェクト
     * @param {boolean} replace - trueの場合はreplaceState、falseの場合はpushState
     */
    updateParams: function(params, replace = false) {
      const url = new URL(window.location);
      
      // 既存のパラメータをクリア
      url.search = '';
      
      // 新しいパラメータを設定
      Object.keys(params).forEach(key => {
        if (params[key] !== null && params[key] !== undefined && params[key] !== '') {
          url.searchParams.set(key, params[key]);
        }
      });

      // 履歴に追加または置き換え
      if (replace) {
        window.history.replaceState(params, '', url.toString());
      } else {
        window.history.pushState(params, '', url.toString());
      }
    },

    /**
     * URLパラメータからタブIDを取得
     * @param {Object} params - パラメータオブジェクト
     * @returns {string} タブID（例: 'home', 'board-UUID'）
     */
    getTabIdFromParams: function(params) {
      if (!params.tab) return null;
      
      if (params.tab === 'board' && params.board_id) {
        return 'board-' + params.board_id;
      }
      
      return params.tab;
    },

    /**
     * タブIDからURLパラメータを生成
     * @param {string} tabId - タブID（例: 'home', 'board-UUID'）
     * @returns {Object} パラメータオブジェクト
     */
    getParamsFromTabId: function(tabId) {
      const params = {};
      
      if (tabId.startsWith('board-')) {
        params.tab = 'board';
        params.board_id = tabId.replace('board-', '');
      } else {
        params.tab = tabId;
      }
      
      return params;
    }
  };

  // ============================================
  // UI Utilities
  // ============================================
  App.utils.ui = {
    /**
     * Mainタグ内のすべてのインタラクティブ要素のReadonly/Disabled状態を切り替えます
     * @param {boolean} readonly - trueで無効化、falseで有効化
     */
    setMainReadonly: function (readonly) {
      const main = document.querySelector('main');

      // fields (inputs wrappers) and buttons within main
      // Also include inputs, selects, textareas directly
      const selectors = [
        '.field',
        'button',
        'input',
        'select',
        'textarea',
        'a[onclick]',
        'i[onclick]',
        '.chip i'
      ];

      const elements = main.querySelectorAll(selectors.join(', '));

      elements.forEach(el => {
        // Toggle disabled attribute for form elements and buttons
        if ('disabled' in el) {
          el.disabled = readonly;
        }

        // Control pointer events and visual opacity
        el.style.pointerEvents = readonly ? 'not-allowed' : '';
        el.style.opacity = readonly ? '0.8' : '';
      });
    }
  };

  // ============================================
  // Optimistic UI: データ同期ロジック
  // ============================================

  /**
   * グローバル変数内の該当オブジェクトを直接更新します (Optimistic UI)
   * @param {string} tableName - テーブル名
   */
  function getDataArray(tableName) {
    return App.state.data[tableName];
  }

  /**
   * グローバル変数内の該当オブジェクトを直接更新します (Optimistic UI)
   * @param {string} tableName - テーブル名
   * @param {string} id - レコードID
   * @param {Object} updates - 更新する値のオブジェクト
   * @returns {Object|null} 更新されたアイテム、または見つからない場合はnull
   */
  function updateLocalData(tableName, id, updates) {
    const dataArray = getDataArray(tableName);
    if (!dataArray) {
      console.warn(`updateLocalData: テーブル ${tableName} が見つかりません`);
      return null;
    }

    const item = dataArray.find(d => d.id === id);
    if (!item) {
      console.warn(`updateLocalData: ID ${id} が ${tableName} に見つかりません`);
      return null;
    }

    Object.keys(updates).forEach(key => {
      item[key] = updates[key];
    });

    return item;
  }

  /**
   * データをロールバックします (エラー時)
   * @param {string} tableName - テーブル名
   * @param {string} id - レコードID
   * @param {Object} oldData - 以前のデータ
   */
  function rollbackLocalData(tableName, id, oldData) {
    const dataArray = getDataArray(tableName);
    if (!dataArray) {
      console.warn(`rollbackLocalData: テーブル ${tableName} が見つかりません`);
      return;
    }

    const item = dataArray.find(d => d.id === id);
    if (!item) {
      console.warn(`rollbackLocalData: ID ${id} が ${tableName} に見つかりません`);
      return;
    }

    Object.keys(oldData).forEach(key => {
      item[key] = oldData[key];
    });
  }
</script>
