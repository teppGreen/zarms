<script>
  const { TABLE_NAMES, DIRECTORY_TYPES, TASK_STATUS, activeUser } = templateVariables;

  // App.state の初期化とデータ管理用関数の定義
  (function () {
    App.state = {
      data: {
        boards: [],
        directories: [],
        members: [],
        tasks: [],
        links: []
      },

      userId: null, // 現在のユーザーのID（uuid）
      userProperties: templateVariables.userProperties || {}, // ユーザープロパティ
      previousTab: null,

      get: function (tableName) {
        return this.data[tableName];
      },

      set: function (tableName, data) {
        this.data[tableName] = data;
      },

      /**
       * ユーザープロパティを保存します
       * @param {string} key - プロパティキー
       * @param {any} value - プロパティ値 (オブジェクトや配列の場合は自動的にJSON文字列化されます)
       * @returns {Promise}
       */
      saveUserProperty: async function (key, value) {
        let stringValue;
        if (value === null || value === undefined) {
          stringValue = '';
        } else if (typeof value === 'object') {
          stringValue = JSON.stringify(value);
        } else {
          stringValue = String(value);
        }

        // ローカル状態を更新
        this.userProperties[key] = stringValue;

        console.log(`[saveUserProperty] Key: ${key}, Value:`, value);
        return await callGAS('saveUserProperty', key, stringValue);
      },

      /**
       * ユーザープロパティを取得します
       * @param {string} key - プロパティキー
       * @param {any} defaultValue - 値がない場合のデフォルト値
       * @returns {any} パースされた値、または元の値
       */
      getUserProperty: function (key, defaultValue = null) {
        const value = this.userProperties[key];
        if (value === undefined || value === null || value === '') return defaultValue;

        // JSON形式（{ または [ で始まる）の場合はパースを試みる
        if (typeof value === 'string' && (value.trim().startsWith('{') || value.trim().startsWith('['))) {
          try {
            return JSON.parse(value);
          } catch (e) {
            console.error(`[getUserProperty] Error parsing key "${key}":`, e);
            return value;
          }
        }
        return value;
      }
    };
  })();


  window.onload = initializeApp;

  // 初期化
  async function initializeApp() {
    setupGlobalShortcuts();
    setupBrowserHistoryHandlers();

    // ユーザーIDを設定（templateVariablesから取得）
    if (activeUser && activeUser.id) {
      App.state.userId = activeUser.id;
    }

    // 全データを読み込み
    await loadAllData();

    // URLパラメータを取得
    const urlParams = templateVariables.urlParams || {};
    console.log('[initializeApp] URL params:', urlParams);

    // データ読み込み前にホームページを表示（ユーザーがタブを切り替えられるようにする）
    // URLパラメータがある場合はそれを使用、ない場合はhomeを表示
    let initialTab = 'home';
    let hasUrlParams = false;

    if (urlParams.tab) {
      if (urlParams.tab === 'board') {
        if (urlParams.board_id) {
          hasUrlParams = true;
          initialTab = 'board-' + urlParams.board_id;
        }
      } else {
        hasUrlParams = true;
        initialTab = urlParams.tab;
      }
    }

    await App.utils.navigation.switchTab(initialTab, true); // trueでURL更新をスキップ

    // モーダルパラメータがある場合は該当のモーダルを開く
    if (urlParams.modal) {
      openModalFromParams(urlParams);
    }

    // 自動更新を開始
    // TODO: 本番デプロイ時にコメントアウトを外すこと
    // startAutoRefresh();
  }

  /**
   * URLパラメータからモーダルを開く
   * @param {Object} params - URLパラメータ
   */
  function openModalFromParams(params) {
    console.log('[openModalFromParams] Opening modal from params:', params);

    // タスク詳細モーダル
    if (params.modal === 'task-detail' && params.task_id) {
      const boardTasks = App.pages.boards?.currentBoardTasks || [];
      const task = boardTasks.find(t => t.id === params.task_id);

      if (task) {
        App.modals.taskDetail.open(params.task_id, true); // trueでURL更新をスキップ
      } else {
        console.error('Task not found for ID:', params.task_id);
        console.log(`App.pages.boards?.currentBoardTasks:`, App.pages.boards?.currentBoardTasks);
      }
    }
    // メンバー詳細モーダル
    else if (params.modal === 'member-detail' && params.member_id) {
      App.modals.memberDetail.open(params.member_id, true); // trueでURL更新をスキップ
    }
  }

  /**
   * ブラウザ履歴の戻る/進むボタンへの対応
   */
  function setupBrowserHistoryHandlers() {
    const handleHistoryChange = async function (event) {
      console.log('[history] Browser back/forward button pressed or history changed', event.state);

      // event.stateがnullの場合は、URLから直接パラメータを取得（初回はキャッシュがあればそれを使用）
      const params = event.state || App.utils.url.getParams() || {};

      // 履歴変更があった場合はキャッシュを更新
      if (App.utils.url.setParams) {
        App.utils.url.setParams(params);
      }

      // タブを切り替え
      if (params.tab) {
        let tabId = 'home';
        if (params.tab === 'board' && params.board_id) {
          tabId = 'board-' + params.board_id;
        } else if (params.tab !== 'board') {
          tabId = params.tab;
        }

        if (App.utils.navigation && App.utils.navigation.switchTab) {
          await App.utils.navigation.switchTab(tabId, true); // URL更新をスキップ
        }
      } else {
        // パラメータがない場合はホームに戻る
        if (App.utils.navigation && App.utils.navigation.switchTab) {
          await App.utils.navigation.switchTab('home', true);
        }
      }

      // モーダルの処理
      // 既存のモーダルを全て閉じる（各モーダルのcloseメソッドを使用）
      const openModals = document.querySelectorAll('dialog[open]');
      openModals.forEach(modal => {
        const modalId = modal.id;

        // モーダルIDからモーダルオブジェクトを取得してcloseメソッドを呼び出す
        // skipUrlUpdate=trueでURL更新をスキップ
        if (modalId === 'modal-detail-task' && App.modals.taskDetail && App.modals.taskDetail.close) {
          App.modals.taskDetail.close(true); // trueでURL更新をスキップ
        } else if (modalId === 'modal-detail-member') {
          // 注: メンバー詳細は App.modals または App.overlays として参照されている可能性があります
          if (App.modals.memberDetail && App.modals.memberDetail.close) {
            App.modals.memberDetail.close(true);
          } else if (App.overlays.memberDetail && App.overlays.memberDetail.close) {
            App.overlays.memberDetail.close(true);
          }
        } else {
          // フォールバック: ui関数（Beer CSSのモーダルトグル）またはネイティブのclose()を使用
          if (typeof ui === 'function') {
            // 第二引数にオプションを渡し、URL更新をスキップするよう示す
            ui(`#${modalId}`, { skipUrlUpdate: true }); // Beer CSSのモーダルトグル関数
          } else if (typeof modal.close === 'function') {
            // 一部のカスタム実装では close(true) でURL更新をスキップできる可能性がある
            try {
              modal.close(true);
            } catch (e) {
              // ネイティブのdialog要素のclose()は引数を無視するため、安全にフォールバック
              modal.close();
            }
          }
        }
      });

      // パラメータにモーダルが指定されている場合は開く
      if (params.modal) {
        openModalFromParams(params);
      }
    };

    window.addEventListener('popstate', handleHistoryChange);

    // google.script.history が利用可能な場合はリスナーを追加
    if (typeof google !== 'undefined' && google.script && google.script.history) {
      google.script.history.setChangeHandler(handleHistoryChange);
    }
  }

  // 初回ロード: 最小限のデータのみ取得
  async function loadAllData() {
    try {
      // boards と links テーブルから並列でデータ取得
      const [boardsResult, linksResult] = await Promise.all([
        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'select', {
          columns: ['id', 'display_id', 'name', 'description', 'is_active']
        }),
        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.LINKS, 'select', {})
      ]);

      // 結果からデータを取得（キャッシュ情報を含む可能性がある）
      let boards = boardsResult?.data || boardsResult || [];
      let links = linksResult?.data || linksResult || [];

      // App.stateに保存
      console.log('Boards fetched (minimal):', boards);
      console.log('Links fetched:', links);
      App.state.data.boards = boards;
      App.state.data.links = links;

      // members, tasks, directoriesは各タブを開いた時に取得するため、ここでは空配列で初期化
      App.state.data.members = [];
      App.state.data.tasks = [];
      App.state.data.directories = [];

      // ナビゲーションとボードページを更新（キャッシュデータで先に描画）
      App.utils.navigation.renderBoardsNavigation();
      App.pages.boards.initialize();

      // アプリリンクを描画
      App.utils.header.renderAppLinks();

      hideLoading();

      // キャッシュからのデータだった場合、バックグラウンドで最新データを取得して再描画
      if (boardsResult?.isCached === true || linksResult?.isCached === true) {
        console.log('キャッシュデータを検出。バックグラウンドで最新データを取得中...');
        setTimeout(async () => {
          try {
            const promises = [];

            if (boardsResult?.isCached === true) {
              promises.push(
                callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'select', {
                  columns: ['id', 'display_id', 'name', 'description', 'is_active']
                }, null, true)
              );
            } else {
              promises.push(Promise.resolve(boardsResult));
            }

            if (linksResult?.isCached === true) {
              promises.push(
                callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.LINKS, 'select', {}, null, true)
              );
            } else {
              promises.push(Promise.resolve(linksResult));
            }

            const [freshBoardsResult, freshLinksResult] = await Promise.all(promises);
            const freshBoards = freshBoardsResult?.data || freshBoardsResult || [];
            const freshLinks = freshLinksResult?.data || freshLinksResult || [];

            App.state.data.boards = freshBoards;
            App.state.data.links = freshLinks;

            // ナビゲーションを更新
            if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
              // 現在のアクティブなボードIDを取得
              const activeLink = document.querySelector('#left-nav a.active') || document.querySelector('#boards-nav a.active');
              const activeBoardId = activeLink ? activeLink.dataset.boardId : null;

              App.utils.navigation.renderBoardsNavigation();

              // アクティブ状態を復元
              if (activeBoardId) {
                const newActiveLink = document.querySelector(`a[data-board-id="${activeBoardId}"]`);
                if (newActiveLink) {
                  newActiveLink.classList.add('active');
                }
              }
            }

            App.pages.boards.initialize();

            if (linksResult?.isCached === true) {
              App.utils.header.renderAppLinks();
            }

            console.log('バックグラウンド更新完了');
          } catch (error) {
            console.error('バックグラウンド更新エラー:', error);
          }
        }, 100); // 100ms後に実行（メインUIの表示を優先）
      }


    } catch (error) {
      console.error('データ読み込みエラー:', error);
      hideLoading();
      App.utils.error.handle(error);
    }
  }

  // 自動データ更新（1分ごと）
  let autoRefreshInterval = null;

  function startAutoRefresh() {
    // 既存のインターバルがあればクリア
    if (autoRefreshInterval) {
      clearInterval(autoRefreshInterval);
    }

    // 2分ごとにデータを更新
    autoRefreshInterval = setInterval(refreshData, 120000);
  }

  async function refreshData() {
    try {
      console.log('[refreshData] 自動更新開始 (コンテキスト対応)');

      const boardsResult = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'select', {
        columns: ['id', 'display_id', 'name', 'description', 'is_active']
      }, null, true);

      App.state.set('boards', boardsResult?.data || []);
      // ナビゲーションを更新
      if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
        // 現在のアクティブなボードIDを取得
        const activeLink = document.querySelector('#left-nav a.active') || document.querySelector('#boards-nav a.active');
        const activeBoardId = activeLink ? activeLink.dataset.boardId : null;

        App.utils.navigation.renderBoardsNavigation();

        // アクティブ状態を復元
        if (activeBoardId) {
          const newActiveLink = document.querySelector(`a[data-board-id="${activeBoardId}"]`);
          if (newActiveLink) {
            newActiveLink.classList.add('active');
          }
        }
      }

      // 現在表示中のタブを特定
      const currentTab = document.querySelector('main > div[style*="display: block"]');
      if (!currentTab) {
        console.log('[refreshData] アクティブなタブが見つかりません');
        return;
      }

      const tabId = currentTab.id; // 例: 'tab-home', 'tab-members', 'tab-board'
      console.log('[refreshData] 現在のタブ:', tabId);

      // タブ種別に応じて必要なデータのみを取得
      if (tabId === 'tab-members') {
        // メンバーページ: loadData関数を再利用
        console.log('[refreshData] メンバーページのデータを更新中...');
        if (App.pages.members && App.pages.members.loadData) {
          await App.pages.members.loadData();
        }
      } else if (tabId === 'tab-board') {
        App.pages.boards.initialize();
        // ボードページ: 表示中のボードのタスクのみを取得
        const activeBoardDiv = document.querySelector('#tab-board > div[style*="display: block"]');
        if (activeBoardDiv && activeBoardDiv.id) {
          const boardId = activeBoardDiv.id.replace('tab-board-', '');
          console.log('[refreshData] ボードページのデータを更新中 (boardId:', boardId, ')');
          if (App.pages.boards && App.pages.boards.loadData) {
            await App.pages.boards.loadData(boardId, true); // isRefresh = true
          }
        }
      }
      // homeタブなどでは何もしない（必要に応じて追加）

      console.log('[refreshData] データ自動更新完了 (コンテキスト対応)');
    } catch (error) {
      console.error('[refreshData] データ自動更新エラー:', error);
    }
  }

  // グローバルショートカットキーの設定
  function setupGlobalShortcuts() {
    document.addEventListener('keydown', (e) => {
      // Cmd/Ctrl + K: 検索フォーカス
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          searchInput.focus();
          searchInput.select();
        }
      }

      // Cmd/Ctrl + N: 新規作成メニュー
      if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
        e.preventDefault();
        const newButton = document.getElementById('main-button');
        if (newButton && typeof handleMainButtonClick === 'function') {
          handleMainButtonClick({ target: newButton });
        }
      }

      // Esc: モーダルを閉じる
      if (e.key === 'Escape') {
        const openModals = document.querySelectorAll('dialog[open]');
        if (openModals.length > 0) {
          openModals.forEach(modal => {
            if (typeof ui === 'function') {
              ui(`#${modal.id}`);
            } else {
              modal.close();
            }
          });
        }
      }
    });
  }

  // 直前のcallGAS呼び出しを記録（HTTP 429エラー時の再試行用）
  let lastCallGASInvocation = null;
  // 直前のJavaScript関数呼び出しを記録（HTTP 429エラー時の再試行用）
  let lastJSInvocation = null;

  // JavaScript関数呼び出しを記録するヘルパー関数
  function recordJSInvocation(functionName, ...args) {
    lastJSInvocation = {
      functionName: functionName,
      args: args
    };
  }

  function callGAS(functionName, ...args) {
    // 呼び出し履歴を記録
    lastCallGASInvocation = {
      functionName: functionName,
      args: args
    };

    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
      [functionName](...args);
    });
  }

  let loadingTimeout = null;

  function showLoading() {
    if (loadingTimeout) clearTimeout(loadingTimeout);
    document.body.style.cursor = 'wait';
  }

  function hideLoading() {
    document.body.style.cursor = '';
  }

   /**
   * スナックバーを表示する
   * @param {string} text - 表示するテキスト
   * @param {string} [color=''] - 色 (例: 'error', 'primary')。デフォルトは空欄
   * @param {string} [position='top'] - 位置 ('top', 'bottom')。デフォルトは 'top'
   * @param {number} [seconds=5] - 表示時間(秒)。デフォルトは 5秒
   */
  function showSnackbar(text, color = '', position = 'top', seconds = 5) {
    const snackbar = document.getElementById('global-snackbar');
    if (!snackbar) return;
    // クラスをリセット (snackbarクラスは必須、activeは後で追加)
    // 色と位置のクラスを追加
    snackbar.className = `snackbar ${position} ${color}`;
    // テキストを設定
    snackbar.textContent = text;
    // 表示 (activeクラスを追加)
    snackbar.classList.add('active');
    // 既存のタイマーがあればクリア
    if (snackbar.dataset.timerId) {
      clearTimeout(parseInt(snackbar.dataset.timerId));
    }
    // 指定時間後に非表示
    const timerId = setTimeout(() => {
      snackbar.classList.remove('active');
      snackbar.dataset.timerId = '';
    }, seconds * 1000);
    snackbar.dataset.timerId = timerId;
  }

  function openModal(id) {
    const modal = document.getElementById(id);
    if (modal) {
      modal.classList.add('active');
    }
    const overlay = document.getElementById('overlay');
    if (overlay) {
      overlay.classList.add('active');
    }
  }

  function closeModal(id) {
    const modal = document.getElementById(id);
    if (modal) {
      modal.classList.remove('active');
    }
    const overlay = document.getElementById('overlay');
    if (overlay) {
      overlay.classList.remove('active');
    }
  }

  // ============================================
  // ヘルパー関数
  // ============================================

  function formatDateTimeForDisplay(dateString, format = 'yyyy/MM/dd(E) HH:mm') {
    if (!dateString) return '';
    try {
      const dt = new Date(dateString);
      const year = String(dt.getFullYear()).padStart(4, '0');
      const month = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const weekday = weekdays[dt.getDay()];
      const hours = String(dt.getHours()).padStart(2, '0');
      const minutes = String(dt.getMinutes()).padStart(2, '0');
      const seconds = String(dt.getSeconds()).padStart(2, '0');

      return format
        .replace(/yyyy/g, year)
        .replace(/MM/g, month)
        .replace(/dd/g, day)
        .replace(/E/g, weekday)
        .replace(/HH/g, hours)
        .replace(/mm/g, minutes)
        .replace(/ss/g, seconds);
    } catch (e) {
      return dateString;
    }
  }

  function formatDateTimeForInput(dateString) {
    if (!dateString) return '';
    try {
      const dt = new Date(dateString);
      const offset = dt.getTimezoneOffset() * 60000;
      const localDate = new Date(dt.getTime() - offset);
      return localDate.toISOString().slice(0, 16);
    } catch (e) {
      return dateString;
    }
  }

  function escapeHtml(text) {
    if (text === null || typeof text === 'undefined') return '';
    return String(text).replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[match]);
  }

  /**
   * URLのダブルスラッシュをエスケープします
   * @param {string} url - エスケープするURL
   * @returns {string} エスケープされたURL
   */
  function escapeDoubleSlashes(url) {
    if (!url) return '';
    return String(url).replace(/\//g, '\\/');
  }

  // ============================================
  // URL Management Utilities
  // ============================================
  App.utils.url = {
    _cachedParams: null,

    /**
     * URLパラメータを取得
     * @returns {Object} パラメータオブジェクト
     */
    getParams: function () {
      // キャッシュがあればそれを使用
      if (this._cachedParams) {
        return { ...this._cachedParams };
      }

      let params = {};

      // 初回ロード時: templateVariablesからの取得を優先
      if (typeof templateVariables !== 'undefined' && templateVariables.urlParams) {
        params = { ...templateVariables.urlParams };
      } else {
        const urlParams = new URLSearchParams(window.location.search);
        for (const [key, value] of urlParams) {
          params[key] = value;
        }
      }

      this._cachedParams = params;
      return params;
    },

    /**
     * キャッシュされたパラメータを強制的に設定（履歴変更時など）
     * @param {Object} params 
     */
    setParams: function (params) {
      this._cachedParams = { ...params };
    },

    /**
     * URLパラメータを更新（ブラウザ履歴にpush）
     * @param {Object} params - パラメータオブジェクト
     * @param {boolean} replace - trueの場合はreplaceState、falseの場合はpushState
     */
    updateParams: function (params, replace = false) {
      // null, undefined, 空文字をフィルタリング
      const cleanParams = {};
      Object.keys(params).forEach(key => {
        if (params[key] !== null && params[key] !== undefined && params[key] !== '') {
          cleanParams[key] = params[key];
        }
      });

      // キャッシュを更新
      this._cachedParams = cleanParams;

      // google.script.history が利用可能な場合はそれを使用
      if (typeof google !== 'undefined' && google.script && google.script.history) {
        if (replace) {
          google.script.history.replace(cleanParams, cleanParams);
        } else {
          google.script.history.push(cleanParams, cleanParams);
        }
        return;
      }

      const url = new URL(window.location);

      // 既存のパラメータをクリア
      url.search = '';

      // 新しいパラメータを設定
      Object.keys(cleanParams).forEach(key => {
        url.searchParams.set(key, cleanParams[key]);
      });

      // 履歴に追加または置き換え
      if (replace) {
        window.history.replaceState(cleanParams, '', url.toString());
      } else {
        window.history.pushState(cleanParams, '', url.toString());
      }
    },

    /**
     * URLパラメータからタブIDを取得
     * @param {Object} params - パラメータオブジェクト
     * @returns {string|null} タブID（例: 'home', 'board-UUID'）またはnull
     */
    getTabIdFromParams: function (params) {
      if (!params.tab) return null;

      // boardタブの場合、board_idが有効な値であることを確認
      if (params.tab === 'board') {
        if (params.board_id && params.board_id !== '') {
          return 'board-' + params.board_id;
        }
        // board_idが無効な場合はnullを返す
        return null;
      }

      return params.tab;
    },

    /**
     * タブIDからURLパラメータを生成
     * @param {string} tabId - タブID（例: 'home', 'board-UUID'）
     * @returns {Object} パラメータオブジェクト
     */
    getParamsFromTabId: function (tabId) {
      const params = {};

      if (tabId.startsWith('board-')) {
        params.tab = 'board';
        params.board_id = tabId.replace('board-', '');
      } else {
        params.tab = tabId;
      }

      return params;
    }
  };

  // ============================================
  // UI Utilities
  // ============================================
  App.utils.ui = {
    /**
     * Mainタグ内のすべてのインタラクティブ要素のReadonly/Disabled状態を切り替えます
     * @param {boolean} readonly - trueで無効化、falseで有効化
     */
    setMainReadonly: function (readonly) {
      const main = document.querySelector('main');

      // fields (inputs wrappers) and buttons within main
      // Also include inputs, selects, textareas directly
      const selectors = [
        '.field',
        'button',
        'input',
        'select',
        'textarea',
        'a[onclick]',
        'i[onclick]',
        '.chip i'
      ];

      const elements = main.querySelectorAll(selectors.join(', '));

      elements.forEach(el => {
        // Toggle disabled attribute for form elements and buttons
        if ('disabled' in el) {
          el.disabled = readonly;
        }

        // Control pointer events and visual opacity
        el.style.pointerEvents = readonly ? 'not-allowed' : '';
        el.style.opacity = readonly ? '0.7' : '';
      });
    }
  };

  // ============================================
  // Optimistic UI: データ同期ロジック
  // ============================================

  /**
   * グローバル変数内の該当オブジェクトを直接更新します (Optimistic UI)
   * @param {string} tableName - テーブル名
   */
  function getDataArray(tableName) {
    return App.state.data[tableName];
  }

  /**
   * グローバル変数内の該当オブジェクトを直接更新します (Optimistic UI)
   * @param {string} tableName - テーブル名
   * @param {string} id - レコードID
   * @param {Object} updates - 更新する値のオブジェクト
   * @returns {Object|null} 更新されたアイテム、または見つからない場合はnull
   */
  function updateLocalData(tableName, id, updates) {
    const dataArray = getDataArray(tableName);
    if (!dataArray) {
      console.warn(`updateLocalData: テーブル ${tableName} が見つかりません`);
      return null;
    }

    const item = dataArray.find(d => d.id === id);
    if (!item) {
      console.warn(`updateLocalData: ID ${id} が ${tableName} に見つかりません`);
      return null;
    }

    Object.keys(updates).forEach(key => {
      item[key] = updates[key];
    });

    return item;
  }

  /**
   * データをロールバックします (エラー時)
   * @param {string} tableName - テーブル名
   * @param {string} id - レコードID
   * @param {Object} oldData - 以前のデータ
   */
  function rollbackLocalData(tableName, id, oldData) {
    const dataArray = getDataArray(tableName);
    if (!dataArray) {
      console.warn(`rollbackLocalData: テーブル ${tableName} が見つかりません`);
      return;
    }

    const item = dataArray.find(d => d.id === id);
    if (!item) {
      console.warn(`rollbackLocalData: ID ${id} が ${tableName} に見つかりません`);
      return;
    }

    Object.keys(oldData).forEach(key => {
      item[key] = oldData[key];
    });
  }
</script>
