<nav class="nav-header">
    <button mat-icon-button (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
    </button>
    <h5 class="bold max">制作物詳細</h5>
    <span class="spacer"></span>
    <button mat-stroked-button>
        <mat-icon>link</mat-icon>
        <span style="font-family: 'Roboto Mono', monospace; font-weight: 500;">{{ displayId }}</span>
    </button>
</nav>

<div class="grid-container" *ngIf="item; else loading">
    <!-- Left Column: Basic Info -->
    <div class="column-left">
        <mat-card>
            <mat-card-content>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>タイトル</mat-label>
                    <input matInput [(ngModel)]="item.title" (change)="updateField('title', item.title)">
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>ステータス</mat-label>
                    <mat-select [(ngModel)]="item.creative_status_key"
                        (selectionChange)="updateField('creative_status_key', $event.value)">
                        <mat-option *ngFor="let opt of statusOptions" [value]="opt.key">{{ opt.value }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>タイプ</mat-label>
                    <mat-select [(ngModel)]="item.creative_type_key"
                        (selectionChange)="updateField('creative_type_key', $event.value)">
                        <mat-option *ngFor="let opt of typeOptions" [value]="opt.key">{{ opt.value }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>優先度</mat-label>
                    <mat-select [(ngModel)]="item.priority_key"
                        (selectionChange)="updateField('priority_key', $event.value)">
                        <mat-option *ngFor="let opt of priorityOptions" [value]="opt.key">{{ opt.value }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>納品期限</mat-label>
                    <input matInput type="datetime-local" [(ngModel)]="item.deadline_at"
                        (change)="updateField('deadline_at', item.deadline_at)">
                </mat-form-field>

                <div class="directory-field">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>依頼元</mat-label>
                        <input matInput [value]="getClientDisplay()" readonly>
                        <button mat-icon-button matSuffix (click)="selectDirectory('client_directory_id')">
                            <mat-icon>edit</mat-icon>
                        </button>
                    </mat-form-field>
                </div>

                <div class="directory-field">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>依頼先</mat-label>
                        <input matInput [value]="getContractorDisplay()" readonly>
                        <button mat-icon-button matSuffix (click)="selectDirectory('contractor_directory_id')">
                            <mat-icon>edit</mat-icon>
                        </button>
                    </mat-form-field>
                </div>

                <!-- Assignees -->
                <div class="assignees-container">
                    <div *ngFor="let assignee of assignees" class="assignee-avatar" [matTooltip]="assignee.name">
                        <img *ngIf="assignee.iconUrl" [src]="assignee.iconUrl">
                        <mat-icon *ngIf="!assignee.iconUrl">account_circle</mat-icon>
                    </div>
                    <button mat-mini-fab color="primary" (click)="addMembers()">
                        <mat-icon>person_add</mat-icon>
                    </button>
                </div>

            </mat-card-content>
        </mat-card>
    </div>

    <!-- Center Column: Content -->
    <div class="column-center">
        <mat-tab-group>
            <mat-tab label="ドキュメント">
                <div class="tab-content" [innerHTML]="getDocumentContent()"></div>
            </mat-tab>
            <mat-tab label="フォルダ">
                <div class="tab-content" [innerHTML]="getFolderContent()"></div>
            </mat-tab>
            <mat-tab label="リレーション">
                <p>リレーション機能は実装予定です</p>
            </mat-tab>
            <mat-tab label="タスク">
                <p>タスク機能は実装予定です</p>
            </mat-tab>
        </mat-tab-group>
    </div>

    <!-- Right Column: Notes -->
    <div class="column-right">
        <mat-card class="notes-card">
            <mat-card-header>
                <mat-card-title>コメント</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <div *ngIf="notes.length === 0">コメントはありません</div>
                <div *ngFor="let note of notes" class="note-item">
                    <div class="note-header">
                        <span class="note-author">{{ note.authorName }}</span>
                        <span class="note-date">{{ note.createdAt | date:'short' }}</span>
                    </div>
                    <div class="note-content">{{ note.content }}</div>
                </div>
            </mat-card-content>
            <mat-card-actions>
                <button mat-button color="primary" (click)="addNote()">コメントを追加</button>
            </mat-card-actions>
        </mat-card>
    </div>
</div>

<ng-template #loading>
    <div class="loading-container">
        <mat-spinner></mat-spinner>
    </div>
</ng-template>
