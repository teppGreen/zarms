<div id="tab-home" style="display: none;">
    <div id="home-content">
        <!-- コンテンツは loadData で動的に生成されます -->
    </div>
</div>

<script>
    (function () {
        App.pages.home = {
            loadData: function () {
                this.renderContent();
                hideLoading();
            },

            renderContent: function () {
                const greeting = this.getGreeting();
                const formattedDate = formatDateTimeForDisplay(new Date(), 'yyyy年MM月dd日(E)');
                const daysUntilEvent = calculateDaysUntil('2026-04-24');

                const content = `
                <div class="grid">
                    <div class="s12 center-align large-margin">
                        <div class="large-space"></div>
                        <h1 class="small bold">${greeting}、${activeUser.display_name}さん｡</h1>
                        <h2>${formattedDate}</h2>
                        <div class="large-space"></div>
                        <p class="large-text">リアル会場0日目(準備日)まで、残り${daysUntilEvent}日です。
                        サイドバーからボードを開いて、業務を始めましょう。</p>
                    </div>
                </div>`;

                document.getElementById('home-content').innerHTML = content;
            },

            getGreeting: function () {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 12) {
                    return 'おはようございます';
                } else if (hour >= 12 && hour < 18) {
                    return 'こんにちは';
                } else {
                    return 'こんばんは';
                }
            },

            
        };
    })();
</script>
