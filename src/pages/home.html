<div id="tab-home" style="display: none;">
    <div id="home-content" class="large-margin large-padding">
        <!-- コンテンツは loadData で動的に生成されます -->
    </div>
    <article class="large-margin large-padding">
      <div class="hedaer row tiny-space">
        <i class="extra">info</i>
        <h5>システムの名称・ロゴを変更しました</h5>
      </div>
      <p>
        これまで使用していた「ZEN Boards」のロゴが、システムの提供元が株式会社ドワンゴであると誤認される可能性があるとのご指摘をいただいたため、名称およびロゴを「ZARMS」に変更しました。
        今後は本システムを<strong>「ザームス」</strong>と呼んでいただけますと幸いです。<br>
        この変更によって、システムの機能や操作に影響はありません。<br>
        なお、本システムは大学が公式に使用を承認したものではなく、学生委員が自主的に開発・使用しているものとなります。予めご承知おきください。
      </p>

    </article>
</div>

<script>
    (function () {
        App.pages.home = {
            loadData: function () {
                this.renderContent();
                hideLoading();
            },

            renderContent: function () {
                const greeting = this.getGreeting();
                const formattedDate = formatDateTimeForDisplay(new Date(), 'yyyy年MM月dd日(E)');
                const daysUntilEvent = calculateDaysUntil('2026-04-24');

                const content = `
                    <div class="row">
                        <h1 class="small bold">${greeting}、${activeUser.display_name}さん｡</h1>
                        <div class="max"></div>
                        <h2>${formattedDate}</h2>
                    </div>
                
                    <div class="large-text top-margin">
                        リアル会場0日目(準備日)まで、残り${daysUntilEvent}日です。<br>
                        サイドバーからボードを開いて、業務を始めましょう。
                    </div>`;
                

                document.getElementById('home-content').innerHTML = content;
            },

            getGreeting: function () {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 12) {
                    return 'おはようございます';
                } else if (hour >= 12 && hour < 18) {
                    return 'こんにちは';
                } else {
                    return 'こんばんは';
                }
            },

            
        };
    })();
</script>
