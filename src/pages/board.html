<!-- ボードページのコンテナ（動的に生成される） -->
<div id="tab-board" style="display: none;">
    <!-- 各ボードのタブが動的に生成される -->
</div>

<script>
    (function () {
        // 各ボードのページロジックを App.pages に登録
        App.pages.boards = {
            sortableInstances: {}, // SortableJS インスタンスを保持
            currentBoardId: null, // 現在表示中のボードID
            lastRenderTimes: {}, // ボードごとの最終レンダリング時刻
            cachedBoardTasks: {}, // ボードごとのタスクデータキャッシュ
            // マイボードのフィルタ設定
            myBoardFilters: {},

            // ステータスキーとカラムIDのマッピング
            statusMapping: {
                'todo': 'TODO',
                'in-progress': 'IN_PROGRESS',
                'in-review': 'IN_REVIEW',
                'done': 'DONE'
            },

            // 逆マッピング（ステータスキーからボードIDへ）
            reverseStatusMapping: {
                'TODO': 'todo',
                'IN_PROGRESS': 'in-progress',
                'IN_REVIEW': 'in-review',
                'DONE': 'done'
            },

            /**
             * マイボードフィルタを初期化（初回のみ）
             */
            initializeMyBoardFilters: function (filterByActiveUser = true) {
                const userId = App.state.userId;
                if (!userId) return;

                this.myBoardFilters = {
                    title: '',
                    titleMatchMode: 'contains',
                    members: {
                        created_by: filterByActiveUser ? [userId] : [],
                        processed_by: filterByActiveUser ? [userId] : [],
                        reviewed_by: filterByActiveUser ? [userId] : [],
                        received_by: filterByActiveUser ? [userId] : []
                    },
                    dateRanges: {
                        starts_at: { from: null, to: null },
                        ends_at: { from: null, to: null }
                    },
                    boards: [],  // Array of board IDs to filter by
                    isOverdue: false
                };
            },

            /**
             * フィルタをリセット
             */
            resetMyBoardFilters: function () {
                this.initializeMyBoardFilters();
                this.loadData('my-board', false);
            },

            /**
             * ボードページコンテナを初期化・再構築（差分更新）
             */
            initialize: function () {
                const boards = App.state.data.boards || [];
                const container = document.getElementById('tab-board');

                if (!container) return;

                // 既存のボードIDを取得
                const existingBoardIds = Array.from(container.children)
                    .filter(child => child.id && child.id.startsWith('tab-board-'))
                    .map(child => child.id.replace('tab-board-', ''));

                // 新しいボードリストのIDを取得（'my-board'を含める）
                const newBoardIds = boards.map(board => board.id);
                newBoardIds.push('my-board');

                // 削除されたボードを削除
                existingBoardIds.forEach(boardId => {
                    if (!newBoardIds.includes(boardId)) {
                        const pageDiv = document.getElementById(`tab-board-${boardId}`);
                        if (pageDiv) {
                            pageDiv.remove();
                        }
                    }
                });

                // 各ボードをループ
                boards.forEach(board => {
                    let pageDiv = document.getElementById(`tab-board-${board.id}`);
                    const headerHtml = `
                        <header class="small-margin no-padding">
                            <nav id="board-tab-header-${board.id}" class="no-margin no-padding row">
                                <div class="field transparent max no-margin bold">
                                    <input type="text" 
                                    value="${escapeHtml(board.name)}" 
                                    style="font-size: 1.75rem;" 
                                    placeholder="000_ユニット名_用途"
                                    onfocus="if(this.value.trim() !== '') this.dataset.originalValue = this.value"
                                    onblur="App.pages.boards.updateBoardName('${board.id}', this.value, this)">
                                </div>
                                <div class="medium"></div>
                                <button class="circle transparent" id="btn-share-${board.id}">
                                    <i>share</i>
                                    <div class="tooltip bottom">共有</div>
                                </button>
                                <button class="circle transparent" id="btn-archive-${board.id}">
                                    <i>${board.is_active ? 'archive' : 'unarchive'}</i>
                                    <div class="tooltip bottom">${board.is_active ? 'アーカイブ' : 'アーカイブ解除'}</div>
                                </button>
                                <button class="circle transparent" id="btn-star-${board.id}">
                                    <i>star_border</i>
                                    <div class="tooltip bottom">スター</div>
                                </button>
                            </nav>
                        </header>
                    `;

                    if (!pageDiv) {
                        // 新しいボード用のページコンテナを作成
                        pageDiv = document.createElement('div');
                        pageDiv.id = `tab-board-${board.id}`;
                        pageDiv.className = '';
                        pageDiv.style.display = 'none';

                        pageDiv.innerHTML = `
                            ${headerHtml}
                            <div id="kanban-canvas-${board.id}" class="top-margin"></div>
                        `;

                        container.appendChild(pageDiv);
                    } else {
                        // 既存のボードであってもnav要素を置換
                        const existingHeader = pageDiv.querySelector('header');
                        if (existingHeader) {
                            existingHeader.outerHTML = headerHtml;
                        }
                    }
                    // イベントを（再）登録
                    this.setupHeaderEvents(board);
                });

                // マイボード用のコンテナ生成
                this.initializeMyBoard(container);
            },

            initializeMyBoard: function (container) {
                const boardId = 'my-board';
                let pageDiv = document.getElementById(`tab-board-${boardId}`);

                // マイボード用のヘッダー（アーカイブ・スターなし）
                const headerHtml = `
                <header class="small-margin">
                    <nav id="board-tab-header-${boardId}" class="no-padding no-margin row">
                        <h3 class="bold small">マイボード</h3>
                        <div class="max"></div>
                        <a onclick="App.pages.boards.resetMyBoardFilters()">
                            <span>フィルタをリセット</span>
                            <div class="tooltip bottom">自分が担当者のタスクのみ表示</div>
                        </a>
                        <button class="circle transparent" onclick="if(App.modals.filterTask){ App.modals.filterTask.syncUI(); } ui('#modal-filter-task')">
                            <i>filter_list</i>
                            <div class="tooltip bottom">フィルタ</div>
                        </button>
                    </nav>
                </header>
                `;

                if (!pageDiv) {
                    pageDiv = document.createElement('div');
                    pageDiv.id = `tab-board-${boardId}`;
                    pageDiv.className = '';
                    pageDiv.style.display = 'none';

                    pageDiv.innerHTML = `
                        ${headerHtml}
                        <div id="kanban-canvas-${boardId}" class="top-margin"></div>
                    `;
                    container.appendChild(pageDiv);
                } else {
                    const existingHeader = pageDiv.querySelector('header');
                    if (existingHeader) {
                        existingHeader.outerHTML = headerHtml;
                    }
                }
            },

            loadData: async function (boardId, isRefresh = false) {
                if (!boardId) {
                    hideLoading();
                    return;
                }

                this.currentBoardId = boardId;

                // 読み込み中アニメーションを表示
                if (!isRefresh) {
                    this.renderKanban(boardId, true);
                }

                try {
                    let query = {};
                    if (boardId !== 'my-board') {
                        query = {
                            where: { board_id: ["=", boardId] }
                        };
                    }

                    // JOINは使わず、単純なSELECTを実行
                    const result = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'select', query, null, isRefresh);
                    let tasks = result?.data || result || [];

                    // マイボードの場合、リストデータも取得
                    let lists = [];
                    if (boardId === 'my-board' && this.myBoardFilters?.includeListMembers) {
                        try {
                            const listsResult = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.LISTS, 'select', {}, null, isRefresh);
                            lists = listsResult?.data || listsResult || [];
                        } catch (error) {
                            console.error('Error loading lists:', error);
                        }
                    }

                    // マイボードの場合、フロントエンドでさらにフィルタリング
                    if (boardId === 'my-board') {
                        tasks = this.filterMyBoardTasks(tasks, lists);
                    }

                    // ボード固有のタスクキャッシュに保存
                    this.cachedBoardTasks[boardId] = tasks;

                    console.log(`Board ${boardId} tasks loaded:`, tasks.length);

                    // カンバンを表示（まずキャッシュデータで描画）
                    this.renderKanban(boardId, false);
                    hideLoading();

                    // isCachedチェック: キャッシュデータの場合はバックグラウンドで最新データを取得
                    if (result?.isCached === true) {
                        console.log(`Board ${boardId}: キャッシュデータ検出。バックグラウンドで最新データを取得中...`);
                        setTimeout(async () => {
                            try {
                                const freshResult = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'select', query, null, true); // forceRefresh = true
                                let freshTasks = freshResult?.data || freshResult || [];

                                // マイボードの場合、リストデータも再取得
                                let freshLists = [];
                                if (boardId === 'my-board' && this.myBoardFilters?.includeListMembers) {
                                    try {
                                        const freshListsResult = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.LISTS, 'select', {}, null, true);
                                        freshLists = freshListsResult?.data || freshListsResult || [];
                                    } catch (error) {
                                        console.error('Error loading fresh lists:', error);
                                    }
                                }

                                // マイボードの場合のフィルタリング（再取得時）
                                if (boardId === 'my-board') {
                                    freshTasks = this.filterMyBoardTasks(freshTasks, freshLists);
                                }

                                this.cachedBoardTasks[boardId] = freshTasks;
                                console.log(`Board ${boardId} tasks refreshed:`, freshTasks.length);

                                // 最新データでカンバンを再描画
                                this.renderKanban(boardId, false);
                            } catch (error) {
                                console.error(`Board ${boardId} background refresh error:`, error);
                            }
                        }, 100); // 100ms後に実行（メインUIの表示を優先）
                    }
                } catch (error) {
                    console.error('Error loading board tasks:', error);
                    hideLoading();
                    App.utils.error.handle(error);
                }
            },

            renderKanban: function (boardId, isLoading = false) {
                const containerId = `kanban-canvas-${boardId}`;
                const container = document.getElementById(containerId);

                if (!container) {
                    hideLoading();
                    return;
                }

                const columns = [
                    {
                        id: 'todo',
                        title: '未着手',
                        filter: (t) => t.task_status_key === 'TODO'
                    },
                    {
                        id: 'in-progress',
                        title: '進行中',
                        filter: (t) => t.task_status_key === 'IN_PROGRESS'
                    },
                    {
                        id: 'in-review',
                        title: '確認中',
                        filter: (t) => t.task_status_key === 'IN_REVIEW'
                    },
                    {
                        id: 'done',
                        title: '完了',
                        filter: (t) => t.task_status_key === 'DONE'
                    }
                ];

                // 既存のSortableインスタンスを破棄
                Object.values(this.sortableInstances || {}).forEach(instance => {
                    if (instance && typeof instance.destroy === 'function') {
                        instance.destroy();
                    }
                });
                this.sortableInstances = {};

                // ローカルキャッシュから取得（loadDataでJOIN済み）
                const boardTasks = this.cachedBoardTasks[boardId] || [];

                // 最終レンダリング時刻を更新
                if (!isLoading) {
                    this.lastRenderTimes[boardId] = Date.now();
                }

                const html = [
                    '<div class="grid no-space">',
                    columns.map(column => {
                        let itemsHtml = '';
                        let countText = '-';

                        if (isLoading) {
                            itemsHtml = Array(4).fill(0).map((_, i) =>
                                `<article class="shimmer-loading small-margin no-elevate" style="height: 100px; animation-delay: ${i * 0.1}s; cursor: not-allowed;"></article>`
                            ).join('');
                        } else {
                            const columnTasks = boardTasks.filter(column.filter);
                            // starts_at、ends_atの順にソート
                            columnTasks.sort((a, b) => {
                                // starts_atで比較（nullは最後）
                                if (!a.starts_at && !b.starts_at) {
                                    // 両方nullの場合、ends_atで比較
                                    if (!a.ends_at && !b.ends_at) return 0;
                                    if (!a.ends_at) return 1;
                                    if (!b.ends_at) return -1;
                                    return new Date(a.ends_at) - new Date(b.ends_at);
                                }
                                if (!a.starts_at) return 1;
                                if (!b.starts_at) return -1;

                                const startsDiff = new Date(a.starts_at) - new Date(b.starts_at);
                                if (startsDiff !== 0) return startsDiff;

                                // starts_atが同じ場合、ends_atで比較（nullは最後）
                                if (!a.ends_at && !b.ends_at) return 0;
                                if (!a.ends_at) return 1;
                                if (!b.ends_at) return -1;
                                return new Date(a.ends_at) - new Date(b.ends_at);
                            });
                            itemsHtml = columnTasks.map(task => this.createTaskCard(task)).join('');
                            countText = columnTasks.length;
                        }

                        return `
                            <div class="s12 m3 l3">
                                <div class="grid no-space">
                                    <div class="row s12 no-round left-margin right-margin">
                                        <span class="bold">${column.title}</span>
                                        <div class="max"></div>
                                        <span class="tiny">${countText}</span>
                                    </div>
                                    <div class="s12 scroll large-height no-padding kanban-column-items" data-status-id="${column.id}" data-board-id="${boardId}" id="kanban-${boardId}-${column.id}-list">
                                        ${itemsHtml}
                                    </div>
                                </div>
                            </div>`;
                    }).join(''),
                    '</div>'
                ].join('');

                container.innerHTML = html;

                if (!isLoading) {
                    this.bindCardClick(container);
                    this.setupSortable(boardId);
                }
            },
            /**
             * SortableJSを初期化
             */
            setupSortable: function (boardId) {
                const container = document.getElementById(`kanban-canvas-${boardId}`);
                if (!container) return;

                const groupName = `kanban-${boardId}`;
                const columns = container.querySelectorAll('.kanban-column-items');

                columns.forEach(column => {
                    const listId = column.id;

                    if (this.sortableInstances[listId]) {
                        this.sortableInstances[listId].destroy();
                    }

                    this.sortableInstances[listId] = Sortable.create(column, {
                        group: groupName,
                        animation: 150,
                        ghostClass: 'surface-container',
                        dragClass: 'surface',
                        onEnd: (evt) => this.onDragEnd(evt, boardId)
                    });
                });
            },

            /**
             * ドラッグ終了時の処理
             */
            onDragEnd: function (evt, boardId) {
                const taskId = evt?.item?.dataset?.eid;
                const targetStatusId = evt?.to?.dataset?.statusId;
                const sourceStatusId = evt?.from?.dataset?.statusId;

                if (!taskId || !targetStatusId) {
                    return;
                }

                if (targetStatusId === sourceStatusId) {
                    return;
                }

                this.handleTaskDrop(taskId, targetStatusId, boardId, () => {
                    this.renderKanban(boardId);
                });
            },

            /**
             * カードクリック時の処理（イベント委譲版）
             */
            bindCardClick: function (container) {
                if (!container) return;

                // イベント委譲を使用して、親コンテナに1つのイベントリスナーを設定
                container.addEventListener('click', (e) => {
                    // カードまたはその子要素がクリックされたかチェック
                    const card = e.target.closest('.kanban-card');
                    if (card) {
                        const taskId = card.dataset.eid;
                        if (taskId && App.modals.taskDetail) {
                            App.modals.taskDetail.open(taskId);
                        }
                    }
                });
            },

            /**
             * タスクドロップ時の処理
             */
            handleTaskDrop: function (taskId, targetStatusId, boardId, rollback) {
                if (!taskId || !targetStatusId) {
                    return;
                }

                // refreshDataが実行中の場合は中止する
                if (typeof refreshDataAbortController !== 'undefined' && refreshDataAbortController) {
                    console.log('[handleTaskDrop] refreshDataを中止します');
                    refreshDataAbortController.aborted = true;
                    refreshDataAbortController = null;
                }

                const newStatusKey = this.statusMapping[targetStatusId];
                if (!newStatusKey) {
                    if (typeof rollback === 'function') rollback();
                    return;
                }

                // 現在のタスクを取得して元のステータスを保存
                // ボード固有のデータ(this.cachedBoardTasks)を優先して検索
                const boardTasks = this.cachedBoardTasks[boardId] || [];
                const task = boardTasks.find(t => t.id === taskId);

                if (!task) {
                    console.error('Task not found in current board tasks:', taskId);
                    if (typeof rollback === 'function') rollback();
                    return;
                }

                const oldStatusKey = task.task_status_key;

                // 同じステータスへのドロップは無視
                if (oldStatusKey === newStatusKey) {
                    return;
                }

                // Optimistic UI update
                // 1. ボード固有のデータを直接更新
                task.task_status_key = newStatusKey;
                // 2. グローバルデータもあれば更新
                updateLocalData(TABLE_NAMES.TASKS, taskId, { task_status_key: newStatusKey });

                // DB更新
                callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'update', {
                    where: { id: ["=", taskId] },
                    set: { task_status_key: newStatusKey }
                }, `タスクステータスを更新`)
                    .then(result => {
                        if (!result || (Array.isArray(result) && result.length === 0)) {
                            // ロールバック
                            task.task_status_key = oldStatusKey;
                            updateLocalData(TABLE_NAMES.TASKS, taskId, { task_status_key: oldStatusKey });
                            if (typeof rollback === 'function') rollback();
                            alert('ステータスの更新に失敗しました');
                        } else {
                            this.loadData(boardId, true);
                        }
                    })
                    .catch(error => {
                        // ロールバック
                        task.task_status_key = oldStatusKey;
                        updateLocalData(TABLE_NAMES.TASKS, taskId, { task_status_key: oldStatusKey });
                        if (typeof rollback === 'function') rollback();
                        App.utils.error.handle(error);
                    });
            },




            /**
             * 新しいボードを作成
             */
            createBoard: async function () {
                const promptValue = prompt('新しいボードの名前', '000_ユニット名_用途');

                if (!promptValue) {
                    return;
                } else if (promptValue === '') {
                    alert('ボード名を入力してください');
                    return;
                }

                showLoading();
                try {
                    const cleanItem = {
                        name: promptValue,
                        is_active: true
                    };

                    const result = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'insert', cleanItem);
                    // insert returns the inserted object(s). If array, take first.
                    const newBoard = result?.data || null;

                    if (!newBoard || !newBoard.id) {
                        throw new Error('ボードの作成に失敗しました (No data returned)');
                    }

                    // ローカルデータを更新
                    App.state.data.boards.push(newBoard);

                    // 初期化（新しいタブのDOM作成）
                    this.initialize();

                    // ナビゲーション再描画
                    if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
                        App.utils.navigation.renderBoardsNavigation();
                    }

                    // タブ切り替え
                    if (App.utils.navigation && App.utils.navigation.switchTab) {
                        await App.utils.navigation.switchTab(`board-${newBoard.id}`);
                    }
                } catch (error) {
                    console.error('Failed to create board:', error);
                    App.utils.error.handle(error);
                } finally {
                    hideLoading();
                }
            },

            /**
             * ボード名を更新
             */
            updateBoardName: async function (boardId, newName, inputElement) {
                if (!boardId) return;

                if (!newName || newName.trim() === "") {
                    if (inputElement && inputElement.dataset.originalValue) {
                        inputElement.value = inputElement.dataset.originalValue;
                    }
                    return;
                }

                // 見た目を更新 (Optimistic)
                const board = App.state.data.boards.find(b => b.id === boardId);
                if (board) {
                    const oldName = board.name;
                    if (oldName === newName) return; // 変更なし

                    board.name = newName;

                    // 左側のナビゲーションを再描画
                    if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
                        App.utils.navigation.renderBoardsNavigation();
                        // アクティブ状態を復元（renderBoardsNavigationの実装によってはリセットされるため）
                        const activeLink = document.querySelector(`a[data-board-id="${boardId}"]`);
                        if (activeLink) activeLink.classList.add('active');
                    }

                    try {
                        await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'update', {
                            where: { id: ["=", boardId] },
                            set: { name: newName }
                        }, 'ボード名を更新');
                    } catch (error) {
                        console.error('Failed to update board name:', error);
                        // ロールバック
                        board.name = oldName;
                        if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
                            App.utils.navigation.renderBoardsNavigation();
                        }
                        alert('ボード名の更新に失敗しました');
                    }
                }
            },

            setupHeaderEvents: function (board) {
                // Share Button
                const btnShare = document.getElementById(`btn-share-${board.id}`);
                if (btnShare) {
                    btnShare.addEventListener('click', () => {
                        const url = `${scriptUrl}?tab=board&board_id=${board.id}`;
                        const text = `[ボード] ${board.name} | ZARMS`;

                        const htmlContent = `<a href="${url}">[ボード#${board.display_id}] ${escapeHtml(board.name)} | ZARMS</a>`;
                        const textContent = `[ボード#${board.display_id}] ${board.name} | ZARMS\n${url}`;

                        const blobHtml = new Blob([htmlContent], { type: "text/html" });
                        const blobText = new Blob([textContent], { type: "text/plain" });

                        const data = [new ClipboardItem({
                            ["text/html"]: blobHtml,
                            ["text/plain"]: blobText
                        })];

                        navigator.clipboard.write(data).then(() => {
                            showSnackbar('このボードへのリンクをコピーしました。', 'success');
                        }).catch(err => {
                            console.error('Clipboard write failed', err);
                            navigator.clipboard.writeText(textContent).then(() => {
                                showSnackbar('何らかの理由でこのボードへのリンクをコピーできませんでした。', 'error');
                            });
                        });
                    });
                }

                // Archive Button
                const btnArchive = document.getElementById(`btn-archive-${board.id}`);
                if (btnArchive) {
                    btnArchive.addEventListener('click', async () => {
                        const isArchiving = board.is_active;
                        const confirmMsg = isArchiving ? 'このボードをアーカイブしますか？\n他の人の画面でも、アーカイブ済のボードとして表示されるようになります。ボードには引き続きアクセスできます。' : 'このボードのアーカイブを解除しますか？';
                        if (!confirm(confirmMsg)) return;

                        try {
                            showSnackbar(isArchiving ? 'ボードをアーカイブしました。まもなく画面が更新されます。' : 'ボードのアーカイブを解除しました。まもなく画面が更新されます。', 'primary');
                            const newStatus = !isArchiving;
                            const actionName = isArchiving ? 'ボードをアーカイブ' : 'ボードのアーカイブを解除';

                            await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'update', {
                                where: { id: ["=", board.id] },
                                set: { is_active: newStatus }
                            }, actionName);

                            refreshData();
                        } catch (e) {
                            console.error(e);
                            alert('処理に失敗しました。時間をおいて再度お試しください。');
                        }
                    });
                }

                // Star Button
                this.updateStarButton(board.id);
                const btnStar = document.getElementById(`btn-star-${board.id}`);
                if (btnStar) {
                    btnStar.addEventListener('click', async () => {
                        console.log('[btnStar] Clicked for board:', board.id);
                        console.log('[btnStar] Initial classList:', btnStar.classList.toString());

                        // 1. ボタンのactiveクラスを切り替え (Optimistic UI)
                        const isActive = btnStar.classList.toggle('active');
                        console.log('[btnStar] After toggle - isActive:', isActive);
                        console.log('[btnStar] After toggle - classList:', btnStar.classList.toString());

                        // アイコンも連動して切り替え
                        const icon = btnStar.querySelector('i');
                        if (icon) {
                            icon.textContent = isActive ? 'star' : 'star_border';
                            if (isActive) {
                                icon.classList.add('fill');
                            } else {
                                icon.classList.remove('fill');
                            }
                        }

                        // 2. ユーザープロパティ保存
                        // 共通の getUserProperty を使用
                        const starred = App.state.getUserProperty('starred_boards', []);
                        console.log('[btnStar] Current starred_boards:', JSON.stringify(starred));

                        const index = starred.indexOf(board.id);
                        console.log('[btnStar] Index of board.id in starred:', index);

                        if (isActive) {
                            console.log('[btnStar] Adding board to starred (isActive=true)');
                            if (index === -1) {
                                starred.push(board.id);
                                console.log('[btnStar] Board added to starred array');
                            } else {
                                console.log('[btnStar] Board already in starred array, skipping');
                            }
                        } else {
                            console.log('[btnStar] Removing board from starred (isActive=false)');
                            if (index !== -1) {
                                starred.splice(index, 1);
                                console.log('[btnStar] Board removed from starred array');
                            } else {
                                console.log('[btnStar] Board not in starred array, skipping');
                            }
                        }

                        console.log('[btnStar] Updated starred_boards:', JSON.stringify(starred));

                        if (App.state.saveUserProperty) {
                            console.log('[btnStar] Saving user property...');
                            // 共通の saveUserProperty を使用 (await可能、自動文字列化)
                            await App.state.saveUserProperty('starred_boards', starred);
                            console.log('[btnStar] User property saved successfully');
                        } else {
                            console.warn('[btnStar] App.state.saveUserProperty is not available');
                        }

                        // 3. ナビゲーション再描画
                        if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
                            console.log('[btnStar] Re-rendering boards navigation...');
                            App.utils.navigation.renderBoardsNavigation();
                            console.log('[btnStar] Boards navigation re-rendered');
                        } else {
                            console.warn('[btnStar] App.utils.navigation.renderBoardsNavigation is not available');
                        }
                    });
                }
            },

            updateStarButton: function (boardId) {
                console.log('[updateStarButton] Called for board:', boardId);
                const btnStar = document.getElementById(`btn-star-${boardId}`);
                if (!btnStar) {
                    console.warn('[updateStarButton] Star button not found for board:', boardId);
                    return;
                }

                // 共通の getUserProperty を使用
                const starred = App.state.getUserProperty('starred_boards', []);
                console.log('[updateStarButton] Current starred_boards:', JSON.stringify(starred));
                const isStarred = starred.includes(boardId);
                console.log('[updateStarButton] Is board starred?', isStarred);

                // activeクラスの制御
                if (isStarred) {
                    btnStar.classList.add('active');
                    console.log('[updateStarButton] Added active class');
                } else {
                    btnStar.classList.remove('active');
                    console.log('[updateStarButton] Removed active class');
                }

                const icon = btnStar.querySelector('i');
                if (icon) {
                    icon.textContent = isStarred ? 'star' : 'star_border';
                    if (isStarred) {
                        icon.classList.add('fill');
                    } else {
                        icon.classList.remove('fill');
                    }
                    console.log('[updateStarButton] Icon updated to:', icon.textContent);
                }
            },

            /**
             * マイボードのタスクをフィルタリング
             */
            filterMyBoardTasks: function (tasks, lists = []) {
                const filters = this.myBoardFilters;

                return tasks.filter(t => {
                    // Title Filter
                    if (filters.title) {
                        const title = (t.name || '').toLowerCase();
                        const keyword = filters.title.toLowerCase();
                        if (filters.titleMatchMode === 'starts_with') {
                            if (!title.startsWith(keyword)) return false;
                        } else if (filters.titleMatchMode === 'ends_with') {
                            if (!title.endsWith(keyword)) return false;
                        } else if (filters.titleMatchMode === 'not_contains') {
                            if (title.includes(keyword)) return false;
                        } else {
                            // contains
                            if (!title.includes(keyword)) return false;
                        }
                    }

                    // Member Filter - check if task member is in selected members for any role
                    let memberMatch = false;
                    const roles = ['created_by', 'processed_by', 'reviewed_by', 'received_by'];

                    for (const role of roles) {
                        const selectedMembers = filters.members[role] || [];
                        if (selectedMembers.length > 0 && selectedMembers.includes(t[role])) {
                            memberMatch = true;
                            break;
                        }

                        // processed_byの場合、includeListMembersがtrueならリストの担当者も確認
                        if (role === 'processed_by' && filters.includeListMembers && selectedMembers.length > 0) {
                            // このタスクに紐づくリストを検索
                            const taskLists = lists.filter(list => list.task_id === t.id);
                            // リストの担当者が選択されたメンバーに含まれているか確認
                            for (const list of taskLists) {
                                if (list.assign_to && selectedMembers.includes(list.assign_to)) {
                                    memberMatch = true;
                                    break;
                                }
                            }
                            if (memberMatch) break;
                        }
                    }

                    // If no members selected for any role, show all tasks
                    const hasAnyMemberFilter = roles.some(role => (filters.members[role] || []).length > 0);
                    if (hasAnyMemberFilter && !memberMatch) return false;

                    // Date Range Filters
                    // Start Date Range
                    if (filters.dateRanges?.starts_at?.from) {
                        if (!t.starts_at || new Date(t.starts_at) < new Date(filters.dateRanges.starts_at.from)) {
                            return false;
                        }
                    }
                    if (filters.dateRanges?.starts_at?.to) {
                        if (!t.starts_at || new Date(t.starts_at) > new Date(filters.dateRanges.starts_at.to)) {
                            return false;
                        }
                    }

                    // End Date Range
                    if (filters.dateRanges?.ends_at?.from) {
                        if (!t.ends_at || new Date(t.ends_at) < new Date(filters.dateRanges.ends_at.from)) {
                            return false;
                        }
                    }
                    if (filters.dateRanges?.ends_at?.to) {
                        if (!t.ends_at || new Date(t.ends_at) > new Date(filters.dateRanges.ends_at.to)) {
                            return false;
                        }
                    }

                    // Board Filter
                    if (filters.boards && filters.boards.length > 0) {
                        if (!filters.boards.includes(t.board_id)) {
                            return false;
                        }
                    }

                    // Overdue Filter
                    if (filters.isOverdue) {
                        if (t.task_status_key === 'DONE') return false;
                        if (!t.ends_at) return false;
                        if (new Date(t.ends_at) > new Date()) return false;
                    }

                    return true;
                });
            },

            createTaskCard: function (task) {
                const displayId = task.display_id ? `#${task.display_id}` : '';

                // App.state.data.members からメンバー情報を取得
                const allMembers = App.state.data.members || [];
                const createdBy = allMembers.find(m => m.id === task.created_by);
                const processedBy = allMembers.find(m => m.id === task.processed_by);
                const reviewedBy = allMembers.find(m => m.id === task.reviewed_by);
                const receivedBy = allMembers.find(m => m.id === task.received_by);

                const assigneeNames = [
                    createdBy ? createdBy.display_name : '',
                    processedBy ? processedBy.display_name : '',
                    reviewedBy ? reviewedBy.display_name : '',
                    receivedBy ? receivedBy.display_name : ''
                ];

                const assigneePhotoUrls = [
                    createdBy ? createdBy.profile_photo_url : null,
                    processedBy ? processedBy.profile_photo_url : null,
                    reviewedBy ? reviewedBy.profile_photo_url : null,
                    receivedBy ? receivedBy.profile_photo_url : null
                ];

                const assigneeIcons = assigneePhotoUrls.map((url, index) => {
                    let opacity;
                    if (index === 1 && task.task_status_key === 'TODO') {
                        opacity = 1;
                    } else if (index === 1 && task.task_status_key === 'IN_PROGRESS') {
                        opacity = 1;
                    } else if (index === 2 && task.task_status_key === 'IN_REVIEW') {
                        opacity = 1;
                    } else if (index === 3 && task.task_status_key === 'DONE') {
                        opacity = 1;
                    } else {
                        opacity = 0.5;
                    }

                    let iconSrc, buttonClass;
                    if (url) {
                        // URLをサニタイズ（危険なプロトコルを除外）
                        const safeUrl = sanitizeUrl(url);
                        if (safeUrl) {
                            // URLはサニタイズ済みで安全なので、そのまま使用
                            iconSrc = `<img src="${safeUrl}" title="${escapeHtml(assigneeNames[index])}" class="responsive">`;
                        } else {
                            iconSrc = `<i title="${escapeHtml(assigneeNames[index])}">person</i>`;
                        }
                        buttonClass = 'circle transparent small';
                    } else {
                        iconSrc = `<i title="${escapeHtml(assigneeNames[index])}">person</i>`;
                        buttonClass = 'circle tertiary small';
                    }

                    return `
                        <button class="${buttonClass}" style="opacity: ${opacity};">
                            ${iconSrc}
                        </button>
                    `;
                });

                let datetimeSpan;
                if (!task.starts_at && !task.ends_at) {
                    datetimeSpan = `
                        <i class="error-text tiny">warning</i>
                        <span class="error-text">終了日時を設定してください</span>
                    `;
                } else {
                    datetimeSpan = `
                        <span>${formatDateTimeForDisplay(task.starts_at, 'MM/dd(E)') || ''} - ${formatDateTimeForDisplay(task.ends_at, 'MM/dd(E) HH:mm') || ''}</span>
                    `;
                }


                return `
                <article class="kanban-card small-margin padding" data-eid="${task.id}" role="button" style="cursor: move;">
                    <div>
                        <span>${displayId} <strong>${escapeHtml(task.name || '')}</strong></span>
                    </div>
                    <div>
                        ${datetimeSpan}
                    </div>
                    <div class="tiny-space row">
                        ${assigneeIcons.join('')}
                    </div>
                </article>
                `;
            }
        };
    })();
</script>
