<!-- jKanban ライブラリの読み込み -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jkanban@1.3.1/dist/jkanban.min.css">
<script src="https://cdn.jsdelivr.net/npm/jkanban@1.3.1/dist/jkanban.min.js"></script>
<!-- ボードページのコンテナ（動的に生成される） -->
<div id="tab-board" style="display: none;">
    <!-- 各ボードのタブが動的に生成される -->
</div>

<script>
    (function () {
        // 各ボードのページロジックを App.pages に登録
        App.pages.boards = {
            kanbanInstances: {}, // jKanban インスタンスを保持
            currentBoardId: null, // 現在表示中のボードID

            // ステータスキーとjKanbanボードIDのマッピング
            statusMapping: {
                'draft-todo': 'TODO',
                'in-progress': 'IN_PROGRESS',
                'in-review': 'IN_REVIEW',
                'done': 'DONE'
            },

            // 逆マッピング（ステータスキーからボードIDへ）
            reverseStatusMapping: {
                'DRAFT': 'draft-todo',
                'TODO': 'draft-todo',
                'IN_PROGRESS': 'in-progress',
                'IN_REVIEW': 'in-review',
                'DONE': 'done'
            },

            /**
             * ボードページコンテナを初期化・再構築
             */
            initialize: function () {
                const boards = App.state.data.boards || [];
                const container = document.getElementById('tab-board');

                // 既存のコンテナ内容をクリア（重複防止）
                container.innerHTML = '';

                boards.forEach(board => {
                    // 各ボード用のページコンテナを作成
                    const pageDiv = document.createElement('div');
                    pageDiv.id = `tab-board-${board.id}`;
                    pageDiv.className = '';
                    pageDiv.style.display = 'none';

                    pageDiv.innerHTML = `
                        <nav class="small-margin row align-center">
                            <h5 class="bold max">${escapeHtml(board.name || '')}</h5>
                            <div class="max"></div>
                            <button class="border circle"><i>star</i></button>
                        </nav>
                        <div id="kanban-canvas-${board.id}" class="top-margin"></div>
                    `;

                    container.appendChild(pageDiv);
                });
            },

            loadData: function (boardId) {
                if (!boardId) {
                    hideLoading();
                    return;
                }

                this.currentBoardId = boardId;

                // カンバンを表示
                this.renderKanban(boardId);
                hideLoading();
            },

            renderKanban: function (boardId) {
                const tasks = App.state.data.tasks || [];
                const boardTasks = tasks.filter(task => task.board_id === boardId);

                // タスクをステータスごとに分類
                const draftTodoTasks = boardTasks.filter(t => ['DRAFT', 'TODO'].includes(t.task_status_key));
                const inProgressTasks = boardTasks.filter(t => t.task_status_key === 'IN_PROGRESS');
                const inReviewTasks = boardTasks.filter(t => t.task_status_key === 'IN_REVIEW');
                const doneTasks = boardTasks.filter(t => t.task_status_key === 'DONE');

                // jKanban用のデータ構造を構築
                // kanban-boardのclassに "small-padding surface" を追加
                const kanbanData = [
                    {
                        id: 'draft-todo',
                        title: '未着手',
                        class: '',
                        item: draftTodoTasks.map(task => this.createTaskCard(task))
                    },
                    {
                        id: 'in-progress',
                        title: '進行中',
                        class: '',
                        item: inProgressTasks.map(task => this.createTaskCard(task))
                    },
                    {
                        id: 'in-review',
                        title: '確認中',
                        class: '',
                        item: inReviewTasks.map(task => this.createTaskCard(task))
                    },
                    {
                        id: 'done',
                        title: '完了',
                        class: '',
                        item: doneTasks.map(task => this.createTaskCard(task))
                    }
                ];

                const containerId = `kanban-canvas-${boardId}`;
                const container = document.getElementById(containerId);

                if (container) {
                    container.innerHTML = '';

                    const self = this;

                    // jKanbanインスタンスを作成
                    const kanban = new jKanban({
                        element: `#${containerId}`,
                        responsivePercentage: true,
                        boards: kanbanData,
                        dragBoards: false,
                        dragItems: true,
                        itemAddOptions: {
                            enabled: true,
                            content: '+',
                            class: 'kanban-title-button btn-block',
                            footer: false,
                            buttonClick: function (el, boardId) {
                                console.log('Add item button clicked for board:', boardId);
                                // ココに処理を記述
                            }
                        },
                        click: function (el) {
                            // タスクカードクリック時にモーダルを開く
                            const taskId = el.dataset.eid;
                            console.log('[Kanban] Task clicked:', taskId);
                            if (taskId && App.modals.taskDetail) {
                                App.modals.taskDetail.open(taskId);
                            }
                        },
                        dropEl: function (el, target, source, sibling) {
                            // タスクのドロップ時にステータスを更新
                            self.handleTaskDrop(el, target, source);
                        }
                    });

                    this.kanbanInstances[boardId] = kanban;

                    // ここからDOM操作
                    const kanbanBoards = container.querySelectorAll('.kanban-board');
                    kanbanBoards.forEach(board => {
                        board.classList.add('no-padding', 'surface', 'no-round', 'no-elevate', 'large-height');
                    });

                    const kanbanBoardHeaders = container.querySelectorAll('.kanban-board-header');
                    kanbanBoardHeaders.forEach(header => {
                        header.classList.add('small-padding', 'background', 'no-round');
                    });

                    const kanbanDrags = container.querySelectorAll('.kanban-drag');
                    kanbanDrags.forEach(drag => {
                        drag.classList.add('small-padding', 'surface-container', 'no-round', 'scroll');
                    });

                    const kanbanItems = container.querySelectorAll('.kanban-item');
                    kanbanItems.forEach(item => {
                        if (item.tagName.toLowerCase() === 'div') {
                            const article = document.createElement('article');
                            // 属性を全てコピー
                            Array.from(item.attributes).forEach(attr => {
                                article.setAttribute(attr.name, attr.value);
                            });
                            // コンテンツを移動
                            while (item.firstChild) {
                                article.appendChild(item.firstChild);
                            }
                            // 要素を置換
                            item.parentNode.replaceChild(article, item);
                            // クラスを追加
                            article.classList.add('no-margin', 'top-margin', 'surface');

                            // クリックイベントを追加
                            article.addEventListener('click', function () {
                                const taskId = this.dataset.eid;
                                console.log('[Kanban] Task clicked (custom):', taskId);
                                if (taskId && App.modals.taskDetail) {
                                    App.modals.taskDetail.open(taskId);
                                }
                            });
                        }
                    });

                    // ここまでDOM操作
                }
            },

            /**
             * タスクドロップ時の処理
             * @param {HTMLElement} el - ドロップされた要素
             * @param {HTMLElement} target - ドロップ先のボード要素
             * @param {HTMLElement} source - ドラッグ元のボード要素
             */
            handleTaskDrop: function (el, target, source) {
                const taskId = el.dataset.eid;
                if (!taskId) {
                    console.error('[Kanban] No task ID found on dropped element');
                    return;
                }

                // ドロップ先のボードIDを取得（jKanbanのboard要素からdata-idを取得）
                const targetBoard = target.closest('[data-id]');
                if (!targetBoard) {
                    console.error('[Kanban] Could not find target board');
                    return;
                }

                const targetBoardId = targetBoard.dataset.id;
                const newStatusKey = this.statusMapping[targetBoardId];

                if (!newStatusKey) {
                    console.error('[Kanban] Unknown board ID:', targetBoardId);
                    return;
                }

                console.log(`[Kanban] Task ${taskId} moved to ${targetBoardId} (${newStatusKey})`);

                // 現在のタスクを取得して元のステータスを保存
                const tasks = App.state.data.tasks || [];
                const task = tasks.find(t => t.id === taskId);
                if (!task) {
                    console.error('[Kanban] Task not found:', taskId);
                    return;
                }

                const oldStatusKey = task.task_status_key;

                // 同じステータスへのドロップは無視
                if (oldStatusKey === newStatusKey) {
                    console.log('[Kanban] Same status, no update needed');
                    return;
                }

                // Optimistic UI update
                updateLocalData(TABLE_NAMES.TASKS, taskId, { task_status_key: newStatusKey });

                // DB更新
                callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'update', {
                    where: { id: ["=", taskId] },
                    set: { task_status_key: newStatusKey }
                }, `タスクステータスを更新`)
                    .then(result => {
                        if (!result || (Array.isArray(result) && result.length === 0)) {
                            console.error('[Kanban] Task status update failed');
                            // ロールバック
                            updateLocalData(TABLE_NAMES.TASKS, taskId, { task_status_key: oldStatusKey });
                            this.renderKanban(this.currentBoardId);
                            alert('ステータスの更新に失敗しました');
                        } else {
                            console.log('[Kanban] Task status updated successfully');
                        }
                    })
                    .catch(error => {
                        console.error('[Kanban] Task status update error:', error);
                        // ロールバック
                        updateLocalData(TABLE_NAMES.TASKS, taskId, { task_status_key: oldStatusKey });
                        this.renderKanban(this.currentBoardId);
                        App.utils.error.handle(error);
                    });
            },

            createTaskCard: function (task) {
                return {
                    id: task.id,
                    title: `
                    <div>
                      <div class="tiny-space row">
                        <span class="bold">${task.name || ''}</span>
                        <span>${task.display_id ? `#${task.display_id}` : ''}</span>
                      </div>
                      <div class="tiny-space row">
                        <i class="tiny">${task.assignee_image_url ? `<img src="${task.assignee_image_url}" alt="${task.assignee_name || ''}">` : 'person'}</i>
                        <span class="small-text">${escapeHtml(task.assignee_name || '')}</span>
                      </div>
                      <div class="tiny-space row">
                        <i class="tiny">schedule</i>
                        <span class="small-text">${formatDateTimeForDisplay(task.starts_at) || ''} - ${formatDateTimeForDisplay(task.ends_at) || ''}</span>
                      </div>
                    </div>
                  `
                };
            }
        };

        // ページロード時にボードページを初期化
        window.addEventListener('load', () => {
            setTimeout(() => App.pages.boards.initialize(), 100);
        });

        // ナビゲーションから各ボードページを呼び出すためのラッパー関数は不要になったため削除
    })();
</script>
