<!-- SortableJS ライブラリの読み込み -->
<script src="https:\/\/cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<!-- ボードページのコンテナ（動的に生成される） -->
<div id="tab-board" style="display: none;">
    <!-- 各ボードのタブが動的に生成される -->
</div>

<script>
    (function () {
        // 各ボードのページロジックを App.pages に登録
        App.pages.boards = {
            sortableInstances: {}, // SortableJS インスタンスを保持
            currentBoardId: null, // 現在表示中のボードID

            // ステータスキーとカラムIDのマッピング
            statusMapping: {
                'todo': 'TODO',
                'in-progress': 'IN_PROGRESS',
                'in-review': 'IN_REVIEW',
                'done': 'DONE'
            },

            // 逆マッピング（ステータスキーからボードIDへ）
            reverseStatusMapping: {
                'TODO': 'todo',
                'IN_PROGRESS': 'in-progress',
                'IN_REVIEW': 'in-review',
                'DONE': 'done'
            },

            /**
             * ボードページコンテナを初期化・再構築（差分更新）
             */
            initialize: function () {
                const boards = App.state.data.boards || [];
                const container = document.getElementById('tab-board');

                if (!container) return;

                // 既存のボードIDを取得
                const existingBoardIds = Array.from(container.children)
                    .filter(child => child.id && child.id.startsWith('tab-board-'))
                    .map(child => child.id.replace('tab-board-', ''));

                // 新しいボードリストのIDを取得
                const newBoardIds = boards.map(board => board.id);

                // 削除されたボードを削除
                existingBoardIds.forEach(boardId => {
                    if (!newBoardIds.includes(boardId)) {
                        const pageDiv = document.getElementById(`tab-board-${boardId}`);
                        if (pageDiv) {
                            pageDiv.remove();
                        }
                    }
                });

                // 各ボードをループ
                boards.forEach(board => {
                    let pageDiv = document.getElementById(`tab-board-${board.id}`);
                    const headerHtml = `
                        <nav id="board-tab-header-${board.id}" class="small-margin row">
                            <h3 class="bold small">${escapeHtml(board.name)}</h5>
                            <div class="max"></div>
                            <button class="circle transparent" onclick="ui('#modal-filter-task')">
                                <i>filter_list</i>
                                <div class="tooltip bottom">フィルタ</div>
                            </button>
                            <button class="circle transparent" id="btn-share-${board.id}">
                                <i>share</i>
                                <div class="tooltip bottom">共有</div>
                            </button>
                            <button class="circle transparent" id="btn-archive-${board.id}">
                                <i>${board.is_active ? 'archive' : 'unarchive'}</i>
                                <div class="tooltip bottom">${board.is_active ? 'アーカイブ' : 'アーカイブ解除'}</div>
                            </button>
                            <button class="circle transparent" id="btn-star-${board.id}">
                                <i>star_border</i>
                                <div class="tooltip bottom">スター</div>
                            </button>
                        </nav>
                    `;

                    if (!pageDiv) {
                        // 新しいボード用のページコンテナを作成
                        pageDiv = document.createElement('div');
                        pageDiv.id = `tab-board-${board.id}`;
                        pageDiv.className = '';
                        pageDiv.style.display = 'none';

                        pageDiv.innerHTML = `
                            ${headerHtml}
                            <div id="kanban-canvas-${board.id}" class="top-margin"></div>
                        `;

                        container.appendChild(pageDiv);
                    } else {
                        // 既存のボードであってもnav要素を置換
                        const existingNav = pageDiv.querySelector('nav');
                        if (existingNav) {
                            existingNav.outerHTML = headerHtml;
                        }
                    }
                    // イベントを（再）登録
                    this.setupHeaderEvents(board);
                });
            },

            loadData: async function (boardId, isRefresh = false) {
                if (!boardId) {
                    hideLoading();
                    return;
                }

                this.currentBoardId = boardId;

                // 読み込み中アニメーションを表示
                if (!isRefresh) {
                    this.renderKanban(boardId, true);
                }

                try {
                    // タスクをmembersとJOINして取得
                    const query = {
                        where: { board_id: ["=", boardId] }
                    };

                    const joins = [
                        {
                            targetTable: 'members',
                            joinType: 'LEFT',
                            columns: ['display_name', 'profile_photo_url'],
                            localKey: 'created_by',
                            foreignKey: 'id',
                            alias: 'created_by_'
                        },
                        {
                            targetTable: 'members',
                            joinType: 'LEFT',
                            columns: ['display_name', 'profile_photo_url'],
                            localKey: 'processed_by',
                            foreignKey: 'id',
                            alias: 'processed_by_'
                        },
                        {
                            targetTable: 'members',
                            joinType: 'LEFT',
                            columns: ['display_name', 'profile_photo_url'],
                            localKey: 'reviewed_by',
                            foreignKey: 'id',
                            alias: 'reviewed_by_'
                        },
                        {
                            targetTable: 'members',
                            joinType: 'LEFT',
                            columns: ['display_name', 'profile_photo_url'],
                            localKey: 'received_by',
                            foreignKey: 'id',
                            alias: 'received_by_'
                        }
                    ];

                    const result = await callGAS('selectWithJoin', TABLE_NAMES.TASKS, query, joins);
                    let tasks = result?.data || result || [];

                    // ボード固有のタスクキャッシュに保存
                    this.currentBoardTasks = tasks;

                    console.log(`Board ${boardId} tasks loaded with JOINs:`, tasks.length);

                    // カンバンを表示（まずキャッシュデータで描画）
                    this.renderKanban(boardId, false);
                    hideLoading();

                    // isCachedチェック: キャッシュデータの場合はバックグラウンドで最新データを取得
                    if (result?.isCached === true) {
                        console.log(`Board ${boardId}: キャッシュデータ検出。バックグラウンドで最新データを取得中...`);
                        setTimeout(async () => {
                            try {
                                const freshResult = await callGAS('selectWithJoin', TABLE_NAMES.TASKS, query, joins, true); // forceRefresh = true
                                const freshTasks = freshResult?.data || freshResult || [];

                                this.currentBoardTasks = freshTasks;
                                console.log(`Board ${boardId} tasks refreshed:`, freshTasks.length);

                                // 最新データでカンバンを再描画
                                this.renderKanban(boardId, false);
                            } catch (error) {
                                console.error(`Board ${boardId} background refresh error:`, error);
                            }
                        }, 100); // 100ms後に実行（メインUIの表示を優先）
                    }
                } catch (error) {
                    console.error('Error loading board tasks:', error);
                    hideLoading();
                    App.utils.error.handle(error);
                }
            },

            renderKanban: function (boardId, isLoading = false) {
                const containerId = `kanban-canvas-${boardId}`;
                const container = document.getElementById(containerId);

                if (!container) {
                    hideLoading();
                    return;
                }

                const columns = [
                    {
                        id: 'todo',
                        title: '未着手',
                        filter: (t) => t.task_status_key === 'TODO'
                    },
                    {
                        id: 'in-progress',
                        title: '進行中',
                        filter: (t) => t.task_status_key === 'IN_PROGRESS'
                    },
                    {
                        id: 'in-review',
                        title: '確認中',
                        filter: (t) => t.task_status_key === 'IN_REVIEW'
                    },
                    {
                        id: 'done',
                        title: '完了',
                        filter: (t) => t.task_status_key === 'DONE'
                    }
                ];

                // 既存のSortableインスタンスを破棄
                Object.values(this.sortableInstances || {}).forEach(instance => {
                    if (instance && typeof instance.destroy === 'function') {
                        instance.destroy();
                    }
                });
                this.sortableInstances = {};

                // ローカルキャッシュから取得（loadDataでJOIN済み）
                const boardTasks = this.currentBoardTasks || [];

                const html = [
                    '<div class="grid no-space">',
                    columns.map(column => {
                        let itemsHtml = '';
                        let countText = '-';

                        if (isLoading) {
                            itemsHtml = Array(4).fill(0).map((_, i) =>
                                `<article class="shimmer-loading small-margin no-elevate" style="height: 100px; animation-delay: ${i * 0.1}s;"></article>`
                            ).join('');
                        } else {
                            const columnTasks = boardTasks.filter(column.filter);
                            itemsHtml = columnTasks.map(task => this.createTaskCard(task)).join('');
                            countText = columnTasks.length;
                        }

                        return `
                            <div class="s12 m3 l3">
                                <article class="kanban-column background no-round no-elevate no-scroll no-padding">
                                    <div class="row no-round left-margin right-margin">
                                        <span class="bold">${column.title}</span>
                                        <div class="max"></div>
                                        <span class="tiny">${countText}</span>
                                    </div>
                                    <div class="scroll large-height no-padding kanban-column-items" data-status-id="${column.id}" data-board-id="${boardId}" id="kanban-${boardId}-${column.id}-list">
                                        ${itemsHtml}
                                    </div>
                                </article>
                            </div>`;
                    }).join(''),
                    '</div>'
                ].join('');

                container.innerHTML = html;

                if (!isLoading) {
                    this.bindCardClick(container);
                    this.setupSortable(boardId);
                }
            },
            /**
             * SortableJSを初期化
             */
            setupSortable: function (boardId) {
                const container = document.getElementById(`kanban-canvas-${boardId}`);
                if (!container) return;

                const groupName = `kanban-${boardId}`;
                const columns = container.querySelectorAll('.kanban-column-items');

                columns.forEach(column => {
                    const listId = column.id;

                    if (this.sortableInstances[listId]) {
                        this.sortableInstances[listId].destroy();
                    }

                    this.sortableInstances[listId] = Sortable.create(column, {
                        group: groupName,
                        animation: 150,
                        ghostClass: 'surface-container',
                        dragClass: 'surface',
                        onEnd: (evt) => this.onDragEnd(evt, boardId)
                    });
                });
            },

            /**
             * ドラッグ終了時の処理
             */
            onDragEnd: function (evt, boardId) {
                const taskId = evt?.item?.dataset?.eid;
                const targetStatusId = evt?.to?.dataset?.statusId;
                const sourceStatusId = evt?.from?.dataset?.statusId;

                if (!taskId || !targetStatusId) {
                    return;
                }

                if (targetStatusId === sourceStatusId) {
                    return;
                }

                this.handleTaskDrop(taskId, targetStatusId, boardId, () => {
                    this.renderKanban(boardId);
                });
            },

            /**
             * カードクリック時の処理
             */
            bindCardClick: function (container) {
                if (!container) return;

                const cards = container.querySelectorAll('.kanban-card');
                cards.forEach(card => {
                    card.addEventListener('click', () => {
                        const taskId = card.dataset.eid;
                        if (taskId && App.modals.taskDetail) {
                            App.modals.taskDetail.open(taskId);
                        }
                    });
                });
            },

            /**
             * タスクドロップ時の処理
             */
            handleTaskDrop: function (taskId, targetStatusId, boardId, rollback) {
                if (!taskId || !targetStatusId) {
                    return;
                }

                const newStatusKey = this.statusMapping[targetStatusId];
                if (!newStatusKey) {
                    if (typeof rollback === 'function') rollback();
                    return;
                }

                // 現在のタスクを取得して元のステータスを保存
                // ボード固有のデータ(this.currentBoardTasks)を優先して検索
                const boardTasks = this.currentBoardTasks || [];
                const task = boardTasks.find(t => t.id === taskId);

                if (!task) {
                    console.error('Task not found in current board tasks:', taskId);
                    if (typeof rollback === 'function') rollback();
                    return;
                }

                const oldStatusKey = task.task_status_key;

                // 同じステータスへのドロップは無視
                if (oldStatusKey === newStatusKey) {
                    return;
                }

                // Optimistic UI update
                // 1. ボード固有のデータを直接更新
                task.task_status_key = newStatusKey;
                // 2. グローバルデータもあれば更新
                updateLocalData(TABLE_NAMES.TASKS, taskId, { task_status_key: newStatusKey });

                // DB更新
                callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'update', {
                    where: { id: ["=", taskId] },
                    set: { task_status_key: newStatusKey }
                }, `タスクステータスを更新`)
                    .then(result => {
                        if (!result || (Array.isArray(result) && result.length === 0)) {
                            // ロールバック
                            task.task_status_key = oldStatusKey;
                            updateLocalData(TABLE_NAMES.TASKS, taskId, { task_status_key: oldStatusKey });
                            if (typeof rollback === 'function') rollback();
                            alert('ステータスの更新に失敗しました');
                        } else {
                            this.loadData(boardId, true);
                        }
                    })
                    .catch(error => {
                        // ロールバック
                        task.task_status_key = oldStatusKey;
                        updateLocalData(TABLE_NAMES.TASKS, taskId, { task_status_key: oldStatusKey });
                        if (typeof rollback === 'function') rollback();
                        App.utils.error.handle(error);
                    });
            },



            setupHeaderEvents: function (board) {
                // Share Button
                const btnShare = document.getElementById(`btn-share-${board.id}`);
                if (btnShare) {
                    btnShare.addEventListener('click', () => {
                        const url = `${scriptUrl}?tab=board&board_id=${board.id}`;
                        const text = `[ボード#${board.display_id}] ${board.name} | ZEN Boards`;

                        const htmlContent = `<a href="${url}">[ボード#${board.display_id}] ${escapeHtml(board.name)} | ZEN Boards</a>`;
                        const textContent = `[ボード#${board.display_id}] ${board.name} | ZEN Boards\n${url}`;

                        const blobHtml = new Blob([htmlContent], { type: "text/html" });
                        const blobText = new Blob([textContent], { type: "text/plain" });

                        const data = [new ClipboardItem({
                            ["text/html"]: blobHtml,
                            ["text/plain"]: blobText
                        })];

                        navigator.clipboard.write(data).then(() => {
                            showSnackbar('このボードへのリンクをコピーしました。', 'success');
                        }).catch(err => {
                            console.error('Clipboard write failed', err);
                            navigator.clipboard.writeText(textContent).then(() => {
                                showSnackbar('何らかの理由でこのボードへのリンクをコピーできませんでした。', 'error');
                            });
                        });
                    });
                }

                // Archive Button
                const btnArchive = document.getElementById(`btn-archive-${board.id}`);
                if (btnArchive) {
                    btnArchive.addEventListener('click', async () => {
                        const isArchiving = board.is_active;
                        const confirmMsg = isArchiving ? 'このボードをアーカイブしますか？\n他の人の画面でも、アーカイブ済のボードとして表示されるようになります。ボードには引き続きアクセスできます。' : 'このボードのアーカイブを解除しますか？';
                        if (!confirm(confirmMsg)) return;

                        try {
                            showSnackbar(isArchiving ? 'ボードをアーカイブしました。まもなく画面が更新されます。' : 'ボードのアーカイブを解除しました。まもなく画面が更新されます。', 'primary');
                            const newStatus = !isArchiving;
                            const actionName = isArchiving ? 'ボードをアーカイブ' : 'ボードのアーカイブを解除';

                            await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'update', {
                                where: { id: ["=", board.id] },
                                set: { is_active: newStatus }
                            }, actionName);

                            refreshData();
                        } catch (e) {
                            console.error(e);
                            alert('処理に失敗しました。時間をおいて再度お試しください。');
                        }
                    });
                }

                // Star Button
                this.updateStarButton(board.id);
                const btnStar = document.getElementById(`btn-star-${board.id}`);
                if (btnStar) {
                    btnStar.addEventListener('click', async () => {
                        console.log('[btnStar] Clicked for board:', board.id);
                        console.log('[btnStar] Initial classList:', btnStar.classList.toString());

                        // 1. ボタンのactiveクラスを切り替え (Optimistic UI)
                        const isActive = btnStar.classList.toggle('active');
                        console.log('[btnStar] After toggle - isActive:', isActive);
                        console.log('[btnStar] After toggle - classList:', btnStar.classList.toString());

                        // アイコンも連動して切り替え
                        const icon = btnStar.querySelector('i');
                        if (icon) {
                            icon.textContent = isActive ? 'star' : 'star_border';
                            if (isActive) {
                                icon.classList.add('fill');
                            } else {
                                icon.classList.remove('fill');
                            }
                        }

                        // 2. ユーザープロパティ保存
                        // 共通の getUserProperty を使用
                        const starred = App.state.getUserProperty('starred_boards', []);
                        console.log('[btnStar] Current starred_boards:', JSON.stringify(starred));

                        const index = starred.indexOf(board.id);
                        console.log('[btnStar] Index of board.id in starred:', index);

                        if (isActive) {
                            console.log('[btnStar] Adding board to starred (isActive=true)');
                            if (index === -1) {
                                starred.push(board.id);
                                console.log('[btnStar] Board added to starred array');
                            } else {
                                console.log('[btnStar] Board already in starred array, skipping');
                            }
                        } else {
                            console.log('[btnStar] Removing board from starred (isActive=false)');
                            if (index !== -1) {
                                starred.splice(index, 1);
                                console.log('[btnStar] Board removed from starred array');
                            } else {
                                console.log('[btnStar] Board not in starred array, skipping');
                            }
                        }

                        console.log('[btnStar] Updated starred_boards:', JSON.stringify(starred));

                        if (App.state.saveUserProperty) {
                            console.log('[btnStar] Saving user property...');
                            // 共通の saveUserProperty を使用 (await可能、自動文字列化)
                            await App.state.saveUserProperty('starred_boards', starred);
                            console.log('[btnStar] User property saved successfully');
                        } else {
                            console.warn('[btnStar] App.state.saveUserProperty is not available');
                        }

                        // 3. ナビゲーション再描画
                        if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
                            console.log('[btnStar] Re-rendering boards navigation...');
                            App.utils.navigation.renderBoardsNavigation();
                            console.log('[btnStar] Boards navigation re-rendered');
                        } else {
                            console.warn('[btnStar] App.utils.navigation.renderBoardsNavigation is not available');
                        }
                    });
                }
            },

            updateStarButton: function (boardId) {
                console.log('[updateStarButton] Called for board:', boardId);
                const btnStar = document.getElementById(`btn-star-${boardId}`);
                if (!btnStar) {
                    console.warn('[updateStarButton] Star button not found for board:', boardId);
                    return;
                }

                // 共通の getUserProperty を使用
                const starred = App.state.getUserProperty('starred_boards', []);
                console.log('[updateStarButton] Current starred_boards:', JSON.stringify(starred));
                const isStarred = starred.includes(boardId);
                console.log('[updateStarButton] Is board starred?', isStarred);

                // activeクラスの制御
                if (isStarred) {
                    btnStar.classList.add('active');
                    console.log('[updateStarButton] Added active class');
                } else {
                    btnStar.classList.remove('active');
                    console.log('[updateStarButton] Removed active class');
                }

                const icon = btnStar.querySelector('i');
                if (icon) {
                    icon.textContent = isStarred ? 'star' : 'star_border';
                    if (isStarred) {
                        icon.classList.add('fill');
                    } else {
                        icon.classList.remove('fill');
                    }
                    console.log('[updateStarButton] Icon updated to:', icon.textContent);
                }
            },

            createTaskCard: function (task) {
                const displayId = task.display_id ? `#${task.display_id}` : '';

                // JOIN済みデータから担当者情報を取得
                const assigneeNames = [
                    task.created_by_display_name, task.processed_by_display_name, task.reviewed_by_display_name, task.received_by_display_name
                ];
                const assigneePhotoUrls = [
                    task.created_by_profile_photo_url, task.processed_by_profile_photo_url, task.reviewed_by_profile_photo_url, task.received_by_profile_photo_url
                ]
                const assigneeIcons = assigneePhotoUrls.map((url, index) => {
                    let opacity;
                    if (index === 1 && task.task_status_key === 'TODO') {
                        opacity = 1;
                    } else if (index === 1 && task.task_status_key === 'IN_PROGRESS') {
                        opacity = 1;
                    } else if (index === 2 && task.task_status_key === 'IN_REVIEW') {
                        opacity = 1;
                    } else if (index === 3 && task.task_status_key === 'DONE') {
                        opacity = 1;
                    } else {
                        opacity = 0.5;
                    }

                    let iconSrc, buttonClass;
                    if (url) {
                        iconSrc = `<img src="${url}" title="${escapeHtml(assigneeNames[index])}" class="responsive">`;
                        buttonClass = 'circle transparent small';
                    } else {
                        iconSrc = `<i title="${escapeHtml(assigneeNames[index])}">person</i>`;
                        buttonClass = 'circle tertiary small';
                    }

                    return `
                        <button class="${buttonClass}" style="opacity: ${opacity};">
                            ${iconSrc}
                        </button>
                    `;
                });

                let datetimeSpan;
                if (!task.starts_at && !task.ends_at) {
                    datetimeSpan = `
                        <i class="error-text tiny">warning</i>
                        <span class="error-text">終了日時を設定してください</span>
                    `;
                } else {
                    datetimeSpan = `
                        <span>${formatDateTimeForDisplay(task.starts_at, 'MM/dd(E)') || ''} - ${formatDateTimeForDisplay(task.ends_at, 'MM/dd(E) HH:mm') || ''}</span>
                    `;
                }


                return `
                <article class="kanban-card small-margin padding" data-eid="${task.id}" role="button">
                    <div>
                        <span>${displayId} <strong>${escapeHtml(task.name || '')}</strong></span>
                    </div>
                    <div>
                        ${datetimeSpan}
                    </div>
                    <div class="tiny-space row">
                        ${assigneeIcons.join('')}
                    </div>
                </article>
                `;
            }
        };
    })();
</script>
