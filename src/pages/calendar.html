<div id="tab-calendar" style="display: none;">
    <div class="large-padding large-height">
        <p>準備が完了次第、このタブに共有カレンダーが表示されます。現在は権限がなくても問題ありません。（総務）</p>
        <iframe id="calendar-iframe" style="border:solid 1px #777" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
    </div>
</div>

<script>
(function() {
  // カレンダーURLを設定から取得
  document.addEventListener('DOMContentLoaded', function() {
    const iframe = document.getElementById('calendar-iframe');
    if (iframe) {
      iframe.src = EXTERNAL_URLS.CALENDAR;
    }
  });
})();
</script>
