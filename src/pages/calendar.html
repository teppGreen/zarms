<div id="tab-calendar" style="display: none;">
  <header class="small-margin no-padding">
    <nav class="no-margin no-padding space">
      <h3 class="bold small">カレンダー</h3>
      <a id="add-calendar" class="small-text secondary-text">新しいタブで開く<i class="tiny">open_in_new</i></a>
    </nav>
  </header>
  <div class="small-margin large-height round border">
    <iframe id="calendar-iframe" style="border-width:0" width="100%" height="100%" frameborder="0"
      scrolling="no"></iframe>
  </div>
</div>

<script>
  (function () {
    // カレンダーURLを設定から取得
    document.addEventListener('DOMContentLoaded', function () {
      const iframe = document.getElementById('calendar-iframe');
      if (iframe) {
        iframe.src = EXTERNAL_URLS.CALENDAR;
      }

      const link = document.getElementById('add-calendar');
      if (link) {
        link.href = EXTERNAL_URLS.ADD_CALENDAR;
      }
    });
  })();
</script>
