<div id="tab-members" style="display: none;">
    <div class="grid">
        <!-- 左側: Members (75%) -->
        <div class="s12 m9 scroll">
            <h5>メンバー</h5>
            <div id="members-list" class="grid">
                <!-- Memberカードが動的に生成される -->
            </div>
        </div>

        <!-- 右側: Directories (25%) -->
        <div class="s12 m3 scroll">
            <h6>組織</h6>
            <div id="directories-tree">
                <!-- ツリー構造が動的に生成される -->
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        App.pages.members = {
            loadData: async function () {
                try {
                    showLoading();

                    // membersデータを取得
                    let membersResult = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.MEMBERS, 'select', {});
                    let members = membersResult?.data || membersResult || [];

                    // directoriesデータを取得
                    let directoriesResult = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.DIRECTORIES, 'select', {});
                    let directories = directoriesResult?.data || directoriesResult || [];

                    console.log('Members data loaded:', members.length);
                    console.log('Directories data loaded:', directories.length);

                    // まずキャッシュデータで描画
                    this.renderMembers(members);
                    this.renderDirectories(directories);
                    hideLoading();

                    // isCachedチェック: キャッシュデータの場合はバックグラウンドで最新データを取得
                    if (membersResult?.isCached === true || directoriesResult?.isCached === true) {
                        console.log('Members/Directories: キャッシュデータ検出。バックグラウンドで最新データを取得中...');
                        setTimeout(async () => {
                            try {
                                const promises = [];

                                if (membersResult?.isCached === true) {
                                    promises.push(
                                        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.MEMBERS, 'select', {}, null, true)
                                    );
                                } else {
                                    promises.push(Promise.resolve(membersResult));
                                }

                                if (directoriesResult?.isCached === true) {
                                    promises.push(
                                        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.DIRECTORIES, 'select', {}, null, true)
                                    );
                                } else {
                                    promises.push(Promise.resolve(directoriesResult));
                                }

                                const [freshMembersResult, freshDirectoriesResult] = await Promise.all(promises);
                                const freshMembers = freshMembersResult?.data || freshMembersResult || [];
                                const freshDirectories = freshDirectoriesResult?.data || freshDirectoriesResult || [];

                                console.log('Members data refreshed:', freshMembers.length);
                                console.log('Directories data refreshed:', freshDirectories.length);

                                // 最新データで再描画
                                this.renderMembers(freshMembers);
                                this.renderDirectories(freshDirectories);
                            } catch (error) {
                                console.error('Background refresh error (members/directories):', error);
                            }
                        }, 100); // 100ms後に実行（メインUIの表示を優先）
                    }
                } catch (error) {
                    console.error('Error loading members page data:', error);
                    hideLoading();
                    App.utils.error.handle(error);
                }
            },

            renderMembers: function (members = []) {
                const container = document.getElementById('members-list');

                if (members.length === 0) {
                    container.innerHTML = '<p class="padding">メンバーが登録されていません</p>';
                    return;
                }

                let html = '';
                members.forEach(member => {
                    //  Slack風のカード表示
                    html += `
            <article class="s12 m6 l4 padding border round">
              <div class="row">
                ${member.profile_photo_url
                            ? `<img src="${escapeHtml(member.profile_photo_url)}" class="circle small" alt="${escapeHtml(member.display_name)}">`
                            : '<i class="extra">account_circle</i>'}
                <div class="max">
                  <h6 class="small">${escapeHtml(member.display_name || '')}</h6>
                  <p class="small-text">${escapeHtml(member.email || '')}</p>
                </div>
              </div>
            </article>
          `;
                });

                container.innerHTML = html;
            },

            renderDirectories: function (directories = []) {
                const container = document.getElementById('directories-tree');

                if (directories.length === 0) {
                    container.innerHTML = '<p class="padding small">組織が登録されていません</p>';
                    return;
                }

                // ツリー構造を構築
                const tree = this.buildTree(directories);
                container.innerHTML = this.renderTree(tree, 0);
            },

            buildTree: function (flatData) {
                if (!flatData || flatData.length === 0) return [];

                // IDをキーにしたマップを作成
                const nodeMap = {};
                flatData.forEach(item => {
                    nodeMap[item.id] = {
                        ...item,
                        children: []
                    };
                });

                // 親子関係を構築
                const rootNodes = [];
                flatData.forEach(item => {
                    const node = nodeMap[item.id];
                    if (item.parent_directory_id && nodeMap[item.parent_directory_id]) {
                        nodeMap[item.parent_directory_id].children.push(node);
                    } else {
                        rootNodes.push(node);
                    }
                });

                return rootNodes;
            },

            renderTree: function (nodes, level) {
                let html = '<ul class="no-space">';

                nodes.forEach(node => {
                    const hasChildren = node.children && node.children.length > 0;
                    const indent = level * 16;

                    html += `
            <li style="padding-left: ${indent}px;">
              <div class="row small-space small-padding">
                <i class="tiny">${hasChildren ? 'folder' : 'folder_open'}</i>
                <span class="small-text">${escapeHtml(node.name || '')}</span>
              </div>
          `;

                    if (hasChildren) {
                        html += this.renderTree(node.children, level + 1);
                    }

                    html += '</li>';
                });

                html += '</ul>';
                return html;
            }
        };
    })();
</script>
