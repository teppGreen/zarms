<div id="tab-members" style="display: none;">
    <header class="small-margin no-padding">
        <nav class="no-margin no-padding">
            <h3 class="bold small">メンバー</h3>
            <a id="member-spreadsheet-link" target="_blank" title="委員名簿を開く">
                <i class="large">open_in_new</i>
            </a>
            <div class="max"></div>
            <a onclick="App.pages.members.clearDirectorySelection()">
                <span>フィルタをリセット</span>
            </a>
        </nav>
    </header>
    <div class="grid">
        <!-- 左側: Members (75%) -->
        <div class="s12 m9 background no-scroll no-round large-height">
            <div id="members-table"></div>
        </div>

        <!-- 右側: Directories (25%) -->
        <div class="s12 m3 background scroll no-round large-height">
            <div id="directories-tree">
                <!-- ツリー構造が動的に生成される -->
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        // スプレッドシートURLを設定から取得
        document.addEventListener('DOMContentLoaded', function() {
            const link = document.getElementById('member-spreadsheet-link');
            if (link) {
                link.href = EXTERNAL_URLS.MEMBER_SPREADSHEET;
            }
        });

        App.pages.members = {
            memberAssignments: [],
            currentMembers: [],
            expandedNodes: {},
            selectedDirectoryIds: new Set(), // Changed to Set for multi-selection
            tree: [],
            table: null,
            columnTitles: {
                profile_photo_url: 'プロフィール画像',
                display_name: 'Slack 表示名',
                name: '氏名',
                email: 'メールアドレス',
                remark: 'システム備考',
                is_active: '有効'
            },

            loadData: async function (firstLoad = false) {
                // membersデータを取得 (firstLoad時のみ、またはstateから)
                let members = App.state.data.members || [];
                let directories = App.state.data.directories || [];

                if (firstLoad) {
                    // member_assignmentsデータを取得
                    try {
                        const res = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.MEMBER_ASSIGNMENTS, 'select', {
                            where: {
                                related_table: ["=", TABLE_NAMES.DIRECTORIES],
                            }
                        }, null, true);
                        this.memberAssignments = res.data || res || [];
                        console.log('Member assignments loaded:', this.memberAssignments.length);
                    } catch (e) {
                        console.error('Error loading member_assignments:', e);
                        this.memberAssignments = [];
                    }
                    console.log('Members data loaded:', members.length);
                    console.log('Directories data loaded:', directories.length);
                }

                // ディレクトリは常に描画（DOM操作のみ）
                this.renderDirectories(directories);

                // Tabulatorの初期化と描画
                // タブが表示されている場合のみ初期化する（非表示状態で初期化するとエラーになるため）
                const container = document.getElementById('tab-members');
                const isVisible = container && container.style.display !== 'none';

                if (isVisible && !this.table) {
                    await this.initTable();
                    return this.loadData(false); //このままreturnせずに続行するとエラーが出てしまうのでなくなく
                }

                if (this.table) {
                    await this.renderMembers(members);
                }
                hideLoading();
            },

            initTable: function () {
                const self = this;

                const cellClickHandler = function (e, cell) {
                    const value = cell.getValue();
                    const field = cell.getField();
                    let textContent, htmlContent;

                    // display_nameの場合は特別な処理
                    if (field === 'display_name') {
                        const rowData = cell.getData();
                        const displayName = rowData.display_name || "";
                        const slackUrl = rowData.slack_profile_url || "";
                        const slackId = slackUrl.slice(-11); // 最後の11文字
                        textContent = displayName;
                        htmlContent = `<span><a target="_blank" data-member-id="${escapeHtml(slackId)}" href="${escapeHtml(slackUrl)}" rel="noopener noreferrer">@${escapeHtml(displayName)}</a></span> `;
                    } else if (field === 'email') {
                        textContent = value;
                        htmlContent = `<a href="mailto:${escapeHtml(value)}">${escapeHtml(value)}</a>`;
                    } else {
                        textContent = value;
                        htmlContent = escapeHtml(value);
                    }

                    const blobText = new Blob([textContent], { type: "text/plain" });
                    const blobHtml = new Blob([htmlContent], { type: "text/html" });

                    const clipboardData = [new ClipboardItem({
                        ["text/plain"]: blobText,
                        ["text/html"]: blobHtml
                    })];

                    navigator.clipboard.write(clipboardData).then(() => {
                        showSnackbar(`コピーしました`, 'success');
                    }).catch(err => {
                        console.error('Clipboard write failed', err);
                        // Fallback to text
                        navigator.clipboard.writeText(textContent).then(() => {
                            showSnackbar(`コピーしました`, 'success');
                        });
                    });
                };

                // Footer click handler helper
                window.handleFooterClick = function (field) {
                    self.copyColumnData(field);
                };

                const footerButtonFormatter = function (cell, formatterParams, onRendered) {
                    // Using a button with onclick calling the global handler (or reachable method)
                    // Since Tabulator formatters render HTML string, we stick to HTML string with onclick.
                    const field = cell.getColumn().getField();
                    return `<div class="center-align middle-align" style="width: 100%; height: 100%;">
                        <button class="circle transparent small" onclick="event.stopPropagation(); handleFooterClick('${field}')" title="この列の値をすべてコピー">
                            <i class="tiny">content_copy</i>
                        </button>
                    </div>`;
                };

                // Using bottomCalc to show the footer row. 
                // We return a dummy value so the row is rendered.
                const footerCalc = function (values, data, calcParams) {
                    return "Copy";
                };

                this.table = new Tabulator("#members-table", {
                    height: "100%",
                    layout: "fitDataFill",
                    columnDefaults: {
                        headerSort: true,
                        cellClick: cellClickHandler,
                        hozAlign: "left",
                        vertAlign: "middle",
                    },
                    columns: [
                        {
                            title: "",
                            field: "profile_photo_url",
                            hozAlign: "center",
                            headerSort: false, // Sort disabled
                            formatter: function (cell, formatterParams, onRendered) {
                                const profilePhotoUrl = cell.getValue();
                                const slackUrl = cell.getData().slack_profile_url;
                                
                                // URLをサニタイズ（危険なプロトコルを除外）
                                const safeSlackUrl = sanitizeUrl(slackUrl);
                                const safePhotoUrl = sanitizeUrl(profilePhotoUrl);
                                
                                let icon;
                                if (safePhotoUrl) {
                                    // URLはサニタイズ済みで安全なので、そのまま使用
                                    icon = `<i class="extra circle transparent"><img src="${safePhotoUrl}" class="responsive"></i>`;
                                } else {
                                    icon = '<i class="extra circle">account_circle</i>';
                                }
                                
                                if (safeSlackUrl) {
                                    return `<a href="${safeSlackUrl}" target="_blank" rel="noopener noreferrer">${icon}</a>`;
                                }
                                
                                return icon;
                            }
                        },
                        {
                            title: this.columnTitles[`display_name`],
                            field: "display_name",
                            bottomCalc: footerCalc,
                            bottomCalcFormatter: footerButtonFormatter,
                            bottomCalcFormatterParams: {
                                cellClick: function () { } // フッターセル自体のクリックを無効化
                            }
                        },
                        {
                            title: this.columnTitles[`name`],
                            field: "name",
                            bottomCalc: footerCalc,
                            bottomCalcFormatter: footerButtonFormatter,
                            bottomCalcFormatterParams: {
                                cellClick: function () { } // フッターセル自体のクリックを無効化
                            }
                        },
                        {
                            title: this.columnTitles[`email`],
                            field: "email",
                            bottomCalc: footerCalc,
                            bottomCalcFormatter: footerButtonFormatter,
                            bottomCalcFormatterParams: {
                                cellClick: function () { } // フッターセル自体のクリックを無効化
                            }
                        },
                        { title: this.columnTitles[`remark`], field: "remark" },
                        { title: this.columnTitles[`is_active`], field: "is_active", formatter: "tickCross", hozAlign: "center" },
                        { title: "ID", field: "id", visible: false }
                    ],
                });
            },

            copyColumnData: function (field) {
                const data = this.table.getData("active"); // Get filtered data
                if (!data || data.length === 0) {
                    showSnackbar('コピーするデータがありません', 'warning');
                    return;
                }

                let textContent, htmlContent;

                if (field === 'display_name') {
                    const items = data.map(m => {
                        const name = m.display_name || "";
                        const url = m.slack_profile_url || "";
                        const slackId = url.slice(-11);
                        return { name, url, slackId };
                    });

                    textContent = items.map(i => `${i.name}`).join(',');
                    htmlContent = items.map(i => {
                        return `<span><a target="_blank" data-member-id="${escapeHtml(i.slackId)}" data-member-label="@${escapeHtml(i.name)}" href="${escapeHtml(i.url)}" rel="noopener noreferrer">@${escapeHtml(i.name)}</a></span> `;
                    }).join('');
                } else if (field === 'email') {
                    const emails = data.map(m => m.email).filter(e => e);
                    textContent = emails.join(',');
                    htmlContent = emails.map(e => `<a href="mailto:${escapeHtml(e)}">${escapeHtml(e)}</a>`).join(',');
                } else if (field === 'name') {
                    const names = data.map(m => m.name).filter(n => n);
                    textContent = names.join(',');
                    htmlContent = names.map(n => escapeHtml(n)).join(',');
                } else {
                    return;
                }

                const blobText = new Blob([textContent], { type: "text/plain" });
                const blobHtml = new Blob([htmlContent], { type: "text/html" });

                const clipboardData = [new ClipboardItem({
                    ["text/plain"]: blobText,
                    ["text/html"]: blobHtml
                })];

                navigator.clipboard.write(clipboardData).then(() => {
                    showSnackbar(`${this.columnTitles[field]}をコピーしました`, 'success');
                }).catch(err => {
                    console.error('Clipboard write failed', err);
                    // Fallback to text
                    navigator.clipboard.writeText(textContent).then(() => {
                        showSnackbar(`${this.columnTitles[field]}をコピーしました`, 'success');
                    });
                });
            },

            renderMembers: function (members = []) {
                this.currentMembers = members;
                if (this.table) {
                    this.table.replaceData(members);
                }
            },

            renderDirectories: function (directories = []) {
                const container = document.getElementById('directories-tree');

                if (directories.length === 0) {
                    container.innerHTML = '<p class="padding">組織が登録されていません</p>';
                    return;
                }

                // ツリー構造を構築
                this.tree = this.buildTree(directories);

                // 初回読み込み時のみ、3階層目まで展開する
                if (Object.keys(this.expandedNodes).length === 0) {
                    this.expandLevels(this.tree, 3);
                }

                container.innerHTML = this.renderTree(this.tree);
            },

            expandLevels: function (nodes, level) {
                if (level <= 0 || !nodes) return;
                nodes.forEach(node => {
                    this.expandedNodes[node.id] = true;
                    if (node.children && node.children.length > 0) {
                        this.expandLevels(node.children, level - 1);
                    }
                });
            },

            buildTree: function (flatData) {
                if (!flatData || flatData.length === 0) return [];

                // IDをキーにしたマップを作成
                const nodeMap = {};
                flatData.forEach(item => {
                    nodeMap[item.id] = {
                        ...item,
                        children: []
                    };
                });

                // 親子関係を構築
                const rootNodes = [];
                flatData.forEach(item => {
                    const node = nodeMap[item.id];
                    if (item.parent_directory_id && nodeMap[item.parent_directory_id]) {
                        nodeMap[item.parent_directory_id].children.push(node);
                    } else {
                        rootNodes.push(node);
                    }
                });

                return rootNodes;
            },

            renderTree: function (nodes) {
                if (!nodes || nodes.length === 0) return '';

                let html = '<ul class="no-space" style="list-style: none; padding-left: 0;">';

                nodes.forEach(node => {
                    const hasChildren = node.children && node.children.length > 0;
                    const isExpanded = this.expandedNodes[node.id];
                    const isSelected = this.selectedDirectoryIds.has(node.id);

                    // トグルアイコン
                    let toggleIcon = 'remove';
                    if (hasChildren) {
                        toggleIcon = isExpanded ? 'expand_more' : 'chevron_right';
                    }

                    // Checkbox
                    const checkbox = `
                        <label class="checkbox">
                            <input type="checkbox" ${isSelected ? 'checked' : ''} 
                                   onclick="event.stopPropagation(); App.pages.members.toggleDirectorySelection('${node.id}')">
                            <span></span>
                        </label>
                    `;

                    html += `
                        <li style="list-style: none;">
                        <div class="row tiny-space small-padding align-center">
                            <button class="circle transparent small" 
                                    onclick="event.stopPropagation(); App.pages.members.toggleNode('${node.id}')"
                                    ${hasChildren ? '' : 'disabled'}>
                                <i>${toggleIcon}</i>
                            </button>
                            ${checkbox}
                            <div class="max pointer" onclick="App.pages.members.toggleDirectorySelection('${node.id}')">
                                <span class="small-text ${isSelected ? 'bold' : ''}">${escapeHtml(node.name || '')}</span>
                            </div>
                        </div>
                    `;

                    if (hasChildren && isExpanded) {
                        html += `<div style="padding-left: 1.2rem;">${this.renderTree(node.children)}</div>`;
                    }

                    html += '</li>';
                });

                html += '</ul>';
                return html;
            },

            toggleNode: function (nodeId) {
                const currentState = this.expandedNodes[nodeId];
                this.expandedNodes[nodeId] = !currentState;
                // ツリー再描画（現在のデータを使用）
                const directories = App.state.data.directories || [];
                this.renderDirectories(directories);
            },

            findNode: function (nodes, id) {
                for (const node of nodes) {
                    if (node.id === id) return node;
                    if (node.children && node.children.length > 0) {
                        const found = this.findNode(node.children, id);
                        if (found) return found;
                    }
                }
                return null;
            },

            collectIds: function (node) {
                let ids = [node.id];
                if (node.children && node.children.length > 0) {
                    for (const child of node.children) {
                        ids = ids.concat(this.collectIds(child));
                    }
                }
                return ids;
            },

            toggleDirectorySelection: function (directoryId) {
                if (this.selectedDirectoryIds.has(directoryId)) {
                    this.selectedDirectoryIds.delete(directoryId);
                } else {
                    this.selectedDirectoryIds.add(directoryId);
                }
                this.applyFilter();
            },

            clearDirectorySelection: function () {
                this.selectedDirectoryIds.clear();
                this.renderMembers(App.state.data.members || []);
                // ツリー再描画
                const directories = App.state.data.directories || [];
                this.renderDirectories(directories);
            },

            applyFilter: function () {
                if (this.selectedDirectoryIds.size === 0) {
                    this.renderMembers(App.state.data.members || []);
                } else {
                    let targetIds = [];
                    // 選択された全てのディレクトリについて、その子孫も含めたIDを収集
                    this.selectedDirectoryIds.forEach(id => {
                        const targetNode = this.findNode(this.tree, id);
                        if (targetNode) {
                            targetIds = targetIds.concat(this.collectIds(targetNode));
                        } else {
                            targetIds.push(id);
                        }
                    });

                    // 重複除去
                    targetIds = [...new Set(targetIds)];

                    // フィルタリング
                    const assignments = this.memberAssignments.filter(a =>
                        targetIds.includes(a.related_id)
                    );
                    const memberIds = assignments.map(a => a.member_id);
                    const uniqueMemberIds = [...new Set(memberIds)];

                    const allMembers = App.state.data.members || [];
                    const filteredMembers = allMembers.filter(m => uniqueMemberIds.includes(m.id));

                    this.renderMembers(filteredMembers);
                }

                // ツリー再描画（選択状態の更新のため）
                const directories = App.state.data.directories || [];
                this.renderDirectories(directories);
            }
        };
    })();
</script>
