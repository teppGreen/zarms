<div id="tab-members" style="display: none;">
    <div class="grid no-scroll">
        <!-- 左側: Members (75%) -->
        <div class="s12 m9 scroll no-round large-height scroll">
            <h5>メンバー</h5>
            <div id="members-list" class="grid">
                <!-- Memberカードが動的に生成される -->
            </div>
        </div>

        <!-- 右側: Directories (25%) -->
        <div class="s12 m3 scroll no-round large-height scroll">
            <h5>組織</h5>
            <div id="directories-tree">
                <!-- ツリー構造が動的に生成される -->
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        App.pages.members = {
            memberAssignments: [],
            expandedNodes: {},
            selectedDirectoryId: null,

            loadData: async function () {
                showLoading();

                // membersデータを取得
                let members = App.state.data.members || [];
                members = members.filter(member => member.is_active === true);

                // directoriesデータを取得
                let directories = App.state.data.directories || [];

                // member_assignmentsデータを取得
                try {
                    const res = await callGAS('handleDatabaseProcess', App.state.userId, 'member_assignments', 'select', {});
                    this.memberAssignments = res.data || res || [];
                    console.log('Member assignments loaded:', this.memberAssignments.length);
                } catch (e) {
                    console.error('Error loading member_assignments:', e);
                    this.memberAssignments = [];
                }

                console.log('Members data loaded:', members.length);
                console.log('Directories data loaded:', directories.length);

                this.renderMembers(members);
                this.renderDirectories(directories);
                hideLoading();
            },

            renderMembers: function (members = []) {
                const container = document.getElementById('members-list');

                if (members.length === 0) {
                    container.innerHTML = '<p class="padding">メンバーが登録されていません</p>';
                    return;
                }

                let html = '';
                members.forEach(member => {
                    //  Slack風のカード表示
                    html += `
            <article class="s12 m6 l4 padding border round">
              <div class="row">
                ${member.profile_photo_url
                            ? `<img src="${escapeHtml(member.profile_photo_url)}" class="circle small" alt="${escapeHtml(member.display_name)}">`
                            : '<i class="extra">account_circle</i>'}
                <div class="max no-line">
                  <span class="small">${member.display_name || ''}</span>
                  <span class="small-text">${member.email || ''}</span>
                </div>
              </div>
            </article>
          `;
                });

                container.innerHTML = html;
            },

            renderDirectories: function (directories = []) {
                const container = document.getElementById('directories-tree');

                if (directories.length === 0) {
                    container.innerHTML = '<p class="padding small">組織が登録されていません</p>';
                    return;
                }

                // ツリー構造を構築
                const tree = this.buildTree(directories);
                container.innerHTML = this.renderTree(tree);
            },

            buildTree: function (flatData) {
                if (!flatData || flatData.length === 0) return [];

                // IDをキーにしたマップを作成
                const nodeMap = {};
                flatData.forEach(item => {
                    nodeMap[item.id] = {
                        ...item,
                        children: []
                    };
                });

                // 親子関係を構築
                const rootNodes = [];
                flatData.forEach(item => {
                    const node = nodeMap[item.id];
                    if (item.parent_directory_id && nodeMap[item.parent_directory_id]) {
                        nodeMap[item.parent_directory_id].children.push(node);
                    } else {
                        rootNodes.push(node);
                    }
                });

                return rootNodes;
            },

            renderTree: function (nodes) {
                if (!nodes || nodes.length === 0) return '';

                let html = '<ul class="no-space" style="list-style: none; padding-left: 0;">';

                nodes.forEach(node => {
                    const hasChildren = node.children && node.children.length > 0;
                    const isExpanded = this.expandedNodes[node.id];
                    const isSelected = this.selectedDirectoryId === node.id;

                    // トグルアイコン
                    let toggleIcon = 'remove';
                    if (hasChildren) {
                        toggleIcon = isExpanded ? 'expand_more' : 'chevron_right';
                    }

                    const activeClass = isSelected ? 'surface-variant' : '';

                    html += `
            <li class="${activeClass}" style="list-style: none;">
              <div class="row small-space small-padding align-center">
                <button class="circle transparent small" 
                        onclick="event.stopPropagation(); App.pages.members.toggleNode('${node.id}')"
                        ${hasChildren ? '' : 'disabled'}>
                    <i>${toggleIcon}</i>
                </button>
                <div class="max pointer" onclick="App.pages.members.selectDirectory('${node.id}')">
                    <span class="small-text ${isSelected ? 'bold' : ''}">${escapeHtml(node.name || '')}</span>
                </div>
              </div>
            `;

                    if (hasChildren && isExpanded) {
                        html += `<div style="padding-left: 24px;">${this.renderTree(node.children)}</div>`;
                    }

                    html += '</li>';
                });

                html += '</ul>';
                return html;
            },

            toggleNode: function (nodeId) {
                const currentState = this.expandedNodes[nodeId];
                this.expandedNodes[nodeId] = !currentState;
                // ツリー再描画（現在のデータを使用）
                const directories = App.state.data.directories || [];
                this.renderDirectories(directories);
            },

            selectDirectory: function (directoryId) {
                if (this.selectedDirectoryId === directoryId) {
                    // 選択解除
                    this.selectedDirectoryId = null;
                    this.renderMembers(App.state.data.members || []);
                } else {
                    // 選択
                    this.selectedDirectoryId = directoryId;

                    // フィルタリング
                    const assignments = this.memberAssignments.filter(a =>
                        a.related_table === 'directories' && a.related_id === directoryId
                    );
                    const memberIds = assignments.map(a => a.member_id);

                    const allMembers = App.state.data.members || [];
                    const filteredMembers = allMembers.filter(m => memberIds.includes(m.id));

                    this.renderMembers(filteredMembers);
                }

                // ツリー再描画（選択状態の更新のため）
                const directories = App.state.data.directories || [];
                this.renderDirectories(directories);
            }
        };
    })();
</script>
