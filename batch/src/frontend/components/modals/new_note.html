<dialog id="modal-new-note" class="modal">
    <h5 class="bold">コメントを追加</h5>
    <form id="new-note-form" onsubmit="App.modals.new_note.submit(event)">
        <div class="modal-content">
            <input type="hidden" name="creative_id">
            <div class="field textarea border">
                <textarea name="content" required placeholder="コメントを入力..." rows="5"></textarea>
            </div>
        </div>
        <nav class="right-align">
            <button class="border" type="button" onclick="closeModal('modal-new-note')">キャンセル</button>
            <button type="submit">送信</button>
        </nav>
    </form>
</dialog>

<script>
    (function () {
        App.modals.new_note = {
            open: function (creativeId) {
                const form = document.getElementById('new-note-form');
                if (form) {
                    form.reset();
                    if (form.elements.creative_id) {
                        form.elements.creative_id.value = creativeId;
                    }
                    openModal('modal-new-note');
                    // Focus the textarea
                    setTimeout(() => {
                        const textarea = form.querySelector('textarea');
                        if (textarea) textarea.focus();
                    }, 100);
                }
            },

            submit: function (event) {
                event.preventDefault();
                const form = event.target;
                const content = form.elements.content.value.trim();
                const creativeId = form.elements.creative_id.value;

                if (!content) return;

                const noteData = {
                    content: content,
                    related_table: SHEET_NAMES.CREATIVES,
                    related_id: creativeId
                };

                // Disable button to prevent double submit
                const submitBtn = form.querySelector('button[type="submit"]');
                if (submitBtn) submitBtn.disabled = true;

                callGAS('createItem', 'notes', noteData)
                    .then(() => {
                        closeModal('modal-new-note');
                        if (App.overlays.creativeDetail && App.overlays.creativeDetail.currentId === creativeId) {
                            App.overlays.creativeDetail.loadNotes(creativeId);
                        }
                    })
                    .catch(err => {
                        console.error('[NewNote] Failed to post note:', err);
                        alert('送信に失敗しました: ' + (err.message || err));
                    })
                    .finally(() => {
                        if (submitBtn) submitBtn.disabled = false;
                    });
            }
        };
    })();
</script>
