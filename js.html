<script>
    // グローバル変数
    let currentUser = null;
    let worksData = [];
    let projectsData = [];
    let membersData = [];
    let knowledgeData = [];
    let configData = {};

    // テーブルの状態管理（ソート、フィルター）
    let tableState = {
      works: { sortKey: 'due_datetime', sortOrder: 'asc', filters: {} },
      projects: { sortKey: 'created_at', sortOrder: 'desc', filters: {} },
      members: { sortKey: 'member_name', sortOrder: 'asc', filters: {} },
    };

    // テーブルヘッダーの定義
    const worksTableHeaders = [
      { key: 'work_id', label: 'ID', sortable: true },
      { key: 'project_title', label: '案件タイトル', sortable: true, filterable: true, editable: false },
      { key: 'work_title', label: '制作タイトル', sortable: true, filterable: true, editable: true, editType: 'text' },
      { key: 'work_status_key', label: 'ステータス', sortable: true, filterable: true, editable: true, editType: 'select', configType: 'WORK_STATUS' },
      { key: 'due_datetime', label: '納品期限', sortable: true, editable: true, editType: 'datetime' },
      { key: 'client_name', label: '依頼者', sortable: true, filterable: true, editable: false },
      { key: 'assignees', label: '担当者', sortable: false, editable: false }
    ];

    const projectsTableHeaders = [
      { key: 'project_id', label: 'ID', sortable: true },
      { key: 'project_title', label: '案件タイトル', sortable: true, filterable: true, editable: true, editType: 'text' },
      { key: 'created_at', label: '作成日', sortable: true, editable: false },
      { key: 'creator_name', label: '作成者', sortable: true, filterable: true, editable: false },
      { key: 'works_count', label: '関連制作物', sortable: true, editable: false }
    ];

    const membersTableHeaders = [
      { key: 'detail', label: '', sortable: false },
      { key: 'avatar', label: '', sortable: false },
      { key: 'member_name', label: '名前', sortable: true, filterable: true, editable: true, editType: 'text' },
      { key: 'member_email', label: 'メール', sortable: true, editable: false },
      { key: 'member_team_key', label: 'チーム', sortable: true, filterable: true, editable: true, editType: 'select', configType: 'TEAM' },
      { key: 'role_key', label: '権限', sortable: true, filterable: true, editable: true, editType: 'select', configType: 'ROLE' },
      { key: 'assigned_works_count', label: '担当制作物数', sortable: true, editable: false }
    ];


    // 初期化
    window.onload = function() {
      loadInitialData();
      document.body.addEventListener('click', closeAllPopups);

      // --- 新規作成ボタンのロジック ---
      const newButton = document.getElementById('new-button');
      const dropdown = document.getElementById('new-button-dropdown');
      const newButtonContainer = document.querySelector('.new-button-container');

      // 新規作成ボタンのクリック
      if (newButton) {
        newButton.addEventListener('click', handleMainButtonClick);
      }

      // ドキュメント全体（body）をクリックした時の動作
      document.addEventListener('click', (event) => {
        // ドロップダウンが表示されていて、かつ
        // クリックされた場所がボタンコンテナの外側の場合にドロップダウンを閉じる
        if (dropdown && dropdown.classList.contains('show') && newButtonContainer && !newButtonContainer.contains(event.target)) {
           closeNewButtonDropdown();
        }
      });
    };

    function loadInitialData() {
      showLoading();
      
      Promise.all([
        callGAS('getCurrentUser'),
        callGAS('getConfig', null),
        callGAS('getUserRole')
      ]).then(([user, config, role]) => {
        currentUser = user;
        configData = groupConfigByType(config);
        
        if (role === 'ADMIN') {
          document.getElementById('new-member-dropdown-item').style.display = 'block';
        }
        
        hideLoading();
        switchTab('home');
      }).catch(handleError);
    }

    function callGAS(functionName, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          [functionName](...args);
      });
    }

    function groupConfigByType(configs) {
      const grouped = {};
      if (!configs || !Array.isArray(configs)) return grouped;
      
      configs.forEach(config => {
        if (!grouped[config.config_type]) {
          grouped[config.config_type] = [];
        }
        grouped[config.config_type].push(config);
      });
      return grouped;
    }

    let loadingTimeout = null;

    function showLoading() {
      if (loadingTimeout) clearTimeout(loadingTimeout);
      
      // 新規作成ボタンのローディング
      const newButton = document.getElementById('new-button');
      const newButtonLoading = document.getElementById('new-button-loading');
      if (newButton) {
        newButton.style.display = 'none';
      }
      if (newButtonLoading) {
        const spinner = newButtonLoading.querySelector('.loading-spinner');
        const checkmark = newButtonLoading.querySelector('.loading-checkmark');
        newButtonLoading.style.display = 'flex';
        if (spinner) spinner.style.display = 'flex';
        if (checkmark) checkmark.style.display = 'none';
      }
    }

    function hideLoading() {
      // 新規作成ボタンのローディング
      const newButton = document.getElementById('new-button');
      const newButtonLoading = document.getElementById('new-button-loading');
      if (newButtonLoading) {
        const spinner = newButtonLoading.querySelector('.loading-spinner');
        const checkmark = newButtonLoading.querySelector('.loading-checkmark');
        
        // スピナーを非表示にしてチェックマークを表示
        if (spinner) spinner.style.display = 'none';
        if (checkmark) checkmark.style.display = 'flex';
        
        // チェックマークを表示してからボタンを表示
        if (loadingTimeout) clearTimeout(loadingTimeout);
        loadingTimeout = setTimeout(() => {
          newButtonLoading.style.display = 'none';
          if (newButton) {
            newButton.style.display = 'flex';
          }
        }, 1500);
      } else {
        // ローディング要素がない場合は直接ボタンを表示
        if (newButton) {
          newButton.style.display = 'flex';
        }
      }
    }
    
    function handleError(error) {
      hideLoading();
      console.error('GAS Error:', error);
      alert('エラーが発生しました: ' + error.message);
    }

    function closeNewButtonDropdown() {
      const dropdown = document.getElementById('new-button-dropdown');
      if (dropdown) {
        dropdown.classList.remove('show');
      }
    }

    /**
     * 「+ 新規作成」ボタンのドロップダウンの表示/非表示を切り替えます。
     */
    function toggleNewButtonDropdown(event) {
      event.stopPropagation(); // bodyのクリックイベントへの伝播を防ぐ
      const dropdown = document.getElementById('new-button-dropdown');
      if (dropdown) {
        dropdown.classList.toggle('show');
      }
    }

    /**
     * メインの「+ 新規作成」ボタンがクリックされたときの処理
     */
    function handleMainButtonClick(event) {
      event.stopPropagation(); // bodyのクリックイベントへの伝播を防ぐ
      
      // 他のポップアップは閉じる
      closeAllPopups();
      
      // 表示中のタブを判定
      if (document.getElementById('tab-works').style.display === 'block') {
        openNewWorkModal();
      } else if (document.getElementById('tab-projects').style.display === 'block') {
        openNewWorkModal();
      } else if (document.getElementById('tab-members').style.display === 'block') {
        openNewMemberModal();
      } else if (document.getElementById('tab-knowledge').style.display === 'block') {
        openNewKnowledgeModal();
      } else {
        // それ以外のタブ（ホーム、統計など）ではドロップダウンを表示
        toggleNewButtonDropdown(event);
      }
    }

    // ============================================
    // ナビゲーション & タブ読み込み
    // ============================================

    function switchTab(tabName) {
      closeWorkDetailOverlay();
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      document.querySelector(`.nav-item[onclick="switchTab('${tabName}')"]`).classList.add('active');
      document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
      document.getElementById('tab-' + tabName).style.display = 'block';
      loadTabData(tabName);
    }

    function loadTabData(tabName) {
      showLoading();
      const dataLoaders = {
        'home': loadHomeData, 'works': loadWorksData, 'projects': loadProjectsData,
        'members': loadMembersData, 'knowledge': loadKnowledgeData, 'summary': loadSummaryData,
      };
      if (dataLoaders[tabName]) dataLoaders[tabName]();
      else hideLoading();
    }

    // ============================================
    // データ読み込み & 描画
    // ============================================

    function loadHomeData() {
      callGAS('getHomeData').then(data => {
        document.getElementById('home-greeting').textContent = `${data.greeting}、${data.memberName}さん。`;
        const container = document.getElementById('home-works-container');
        container.innerHTML = '';
        if (!data.works || data.works.length === 0) {
          container.innerHTML = '<p style="color: #6b7280;">担当中の制作はありません</p>';
        } else {
          data.works.forEach(work => {
            container.innerHTML += `<div class="card card-clickable" onclick="openWorkDetailOverlay('${work.work_id}')"> <h3 style="margin: 0 0 8px 0; font-size: 16px; font-weight: 600;">${escapeHtml(work.work_title)}</h3> <p style="margin: 0 0 8px 0; color: #6b7280; font-size: 14px;"><button class="btn-link" onclick="event.stopPropagation(); openProjectDetail('${work.project_id}');">${escapeHtml(work.project_title)}</button></p> <div style="font-size: 12px; color: #6b7280;"> <span>納期: ${formatDateTimeForDisplay(work.due_datetime)}</span> </div> </div>`;
          });
        }
        hideLoading();
      }).catch(handleError);
    }

    function loadWorksData() {
      callGAS('getWorks').then(data => { worksData = data; renderTable('works', applyFiltersAndSort('works', worksData), worksTableHeaders); hideLoading(); }).catch(handleError);
    }
    function loadProjectsData() {
      callGAS('getProjects').then(data => { projectsData = data; renderTable('projects', applyFiltersAndSort('projects', projectsData), projectsTableHeaders); hideLoading(); }).catch(handleError);
    }
    function loadMembersData() {
      callGAS('getMembers').then(data => { membersData = data; renderTable('members', applyFiltersAndSort('members', membersData), membersTableHeaders); hideLoading(); }).catch(handleError);
    }

    function loadKnowledgeData() {
      callGAS('getKnowledge').then(data => {
        knowledgeData = data;
        const container = document.getElementById('knowledge-container');
        container.innerHTML = '';
        if (!knowledgeData || knowledgeData.length === 0) {
          container.innerHTML = '<p style="color: #6b7280; grid-column: 1 / -1;">データがありません</p>';
        } else {
          knowledgeData.forEach(item => {
            container.innerHTML += `<div class="card"> <div style="margin-bottom: 8px;"> <span class="badge" style="background: #fef3c7; color: #92400e;">${getConfigLabel(item.knowledge_type_key, 'KNOWLEDGE_TYPE')}</span> </div> <div style="margin-bottom: 12px; font-size: 14px; color: #6b7280;"> ${escapeHtml(item.work_title)} </div> <div style="margin-bottom: 12px;"> ${escapeHtml(item.knowledge_content.substring(0, 150))}... </div> <div style="font-size: 12px; color: #9ca3af;"> ${formatDate(item.created_at)} - ${escapeHtml(item.creator_name)} </div> </div>`;
          });
        }
        hideLoading();
      }).catch(handleError);
    }

    function loadSummaryData() {
      google.charts.load('current', {'packages':['corechart']});
      google.charts.setOnLoadCallback(() => {
        callGAS('getSummaryData').then(data => {
          drawChart('chart-work-status', 'pie', data.workStatus, 'Status', 'Count', { pieHole: 0.4 });
          drawChart('chart-assignee', 'column', data.assignee, 'Member', 'Works', { legend: { position: 'none' } });
          drawChart('chart-work-type', 'pie', data.workType, 'Type', 'Count');
          drawChart('chart-monthly', 'line', data.monthly, 'Month', 'Works', { curveType: 'function', legend: { position: 'none' } });
          hideLoading();
        }).catch(handleError);
      });
    }
    
    function renderTable(name, data, headers) {
      const table = document.getElementById(`${name}-table`);
      const thead = table.querySelector('thead');
      const tbody = table.querySelector('tbody');
      const state = tableState[name];

      // ヘッダーの生成
      thead.innerHTML = '';
      const headerRow = thead.insertRow();
      headers.forEach(header => {
        const th = document.createElement('th');
        const contentDiv = document.createElement('div');
        contentDiv.className = 'header-content';
        const labelSpan = document.createElement('span');
        labelSpan.textContent = header.label;
        contentDiv.appendChild(labelSpan);
        if (header.sortable || header.filterable) {
          const iconsDiv = document.createElement('div');
          iconsDiv.className = 'header-icons';
          if (header.sortable) {
            const sortIcon = document.createElement('span');
            sortIcon.className = 'sort-icon';
            sortIcon.textContent = state.sortKey === header.key ? (state.sortOrder === 'asc' ? '↑' : '↓') : '↕';
            th.addEventListener('click', () => sortTable(name, header.key));
            iconsDiv.appendChild(sortIcon);
          }
          if (header.filterable) {
            const filterIcon = document.createElement('span');
            filterIcon.className = 'filter-icon';
            filterIcon.textContent = '▼';
            filterIcon.addEventListener('click', (e) => showFilterMenu(e, name, header.key));
            iconsDiv.appendChild(filterIcon);
          }
          contentDiv.appendChild(iconsDiv);
        }
        th.appendChild(contentDiv);
        headerRow.appendChild(th);
      });

      // ボディの生成
      tbody.innerHTML = '';
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${headers.length}" style="text-align: center; color: #6b7280;">データがありません</td></tr>`;
        return;
      }

      const idKey = name === 'members' ? 'member_email' : (name === 'works' ? 'work_id' : 'project_id');

      data.forEach(item => {
        const row = tbody.insertRow();
        row.dataset.id = item[idKey];
        headers.forEach(header => {
          const cell = row.insertCell();
          cell.dataset.field = header.key;
          const currentValue = item[header.key];
          let content = '';

          if (header.editable) {
            switch(header.editType) {
              case 'select':
                cell.innerHTML = `<div class="editable-container" onclick="showSelectEditor(event, '${name}', '${item[idKey]}', '${header.key}')"> <span class="editable-text">${getConfigLabel(currentValue, header.configType)}</span> <span class="editable-toggle-btn">✎</span> </div>`;
                break;
              case 'datetime':
                cell.innerHTML = `<div class="editable-container datetime-editable" onclick="openDateTimePicker(event, '${name}', '${item[idKey]}', '${header.key}')">
                  <span class="editable-text">${formatDateTimeForDisplay(currentValue)}</span>
                  <span class="editable-toggle-btn">✎</span>
                </div>`;
                break;
              default: // text
                cell.textContent = currentValue;
                cell.classList.add('editable');
                cell.addEventListener('click', (e) => {
                  if (cell.classList.contains('editing')) return;
                  switchToEditMode(cell, header, name);
                });
                break;
            }
          } else {
            switch(header.key) {
              case 'work_id': content = `<button class="btn-link" onclick="openWorkDetailOverlay('${item.work_id}')">${item.work_id}</button>`; break;
              case 'project_id': content = `<button class="btn-link" onclick="openProjectDetail('${item.project_id}')">${item.project_id}</button>`; break;
              case 'detail': content = `<button class="btn-link" onclick="openMemberDetail('${item.member_email}')">詳細</button>`; break;
              case 'assignees': content = renderAssignees(item.assignees); break;
              case 'avatar': content = `<img src="${item.member_icon || 'https://via.placeholder.com/32'}" class="avatar" alt="">`; break;
              case 'due_datetime': content = formatDateTimeForDisplay(currentValue, true); break;
              case 'created_at': content = formatDate(currentValue); break;
              default: 
                if (typeof currentValue === 'string' && currentValue.length > 10) {
                  content = escapeHtml(currentValue.substring(0, 10)) + '...';
                } else {
                  content = escapeHtml(currentValue);
                }
                break;
            }
            cell.innerHTML = content;
          }
        });
      });
    }

    function drawChart(elementId, chartType, data, hAxis, vAxis, options = {}) {
      const container = document.getElementById(elementId);
      if (!data || Object.keys(data).length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 40px;">データがありません</p>';
        return;
      }
      const chartData = [[hAxis, vAxis]];
      Object.keys(data).forEach(key => {
        const label = hAxis === 'Status' ? getConfigLabel(key, 'WORK_STATUS') : key;
        chartData.push([label, data[key]]);
      });
      const dataTable = google.visualization.arrayToDataTable(chartData);
      const chart = new google.visualization[chartType === 'line' ? 'LineChart' : chartType === 'column' ? 'ColumnChart' : 'PieChart'](container);
      chart.draw(dataTable, options);
    }

    let currentWorkId = null;

    function openWorkDetailOverlay(workId) {
      showLoading();
      currentWorkId = workId;
      const promises = [ callGAS('getWorkById', workId) ];
      if (!membersData || membersData.length === 0) {
        promises.push(callGAS('getMembers'));
      } else {
        promises.push(Promise.resolve(membersData));
      }
      Promise.all(promises).then(([work, members]) => {
        if (!membersData || membersData.length === 0) {
          membersData = members;
        }
        document.getElementById('work-detail-title').textContent = work.work_title;
        
        // リッチテキストエディタにデータを設定
        const contentEditor = document.getElementById('work-detail-content-editor');
        const designEditor = document.getElementById('work-detail-design-editor');
        const regulationEditor = document.getElementById('work-detail-regulation-editor');
        const noteEditor = document.getElementById('work-detail-note-editor');
        
        contentEditor.innerHTML = work.work_detail_content || '';
        contentEditor.dataset.workId = workId;
        designEditor.innerHTML = work.work_detail_design || '';
        designEditor.dataset.workId = workId;
        regulationEditor.innerHTML = work.work_detail_regulation || '';
        regulationEditor.dataset.workId = workId;
        noteEditor.innerHTML = work.work_detail_note || '';
        noteEditor.dataset.workId = workId;
        
        // リッチテキストエディタの初期化
        initRichTextEditors();
        
        renderWorkTasks(work.tasks);
        renderWorkAssignees(work.assignees);
        renderWorkApps(work.apps);
        document.getElementById('new-task-button').onclick = () => openNewTaskModal(work.work_id);
        document.getElementById('work-detail-overlay').classList.add('show');
        hideLoading();
      }).catch(handleError);
    }

    function initRichTextEditors() {
      // すべてのリッチテキストエディタのツールバーを初期化
      document.querySelectorAll('.rich-text-toolbar').forEach(toolbar => {
        const editorId = toolbar.dataset.editor;
        const editor = document.getElementById(editorId);
        if (!editor) return;
        
        // ツールバーボタンのイベントリスナーを設定
        toolbar.querySelectorAll('.toolbar-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const command = btn.dataset.command;
            const value = btn.dataset.value;
            const color = btn.dataset.color;
            
            editor.focus();
            
            if (color) {
              // 色選択
              document.execCommand('foreColor', false, color);
            } else if (command === 'formatBlock' && value) {
              // 見出し
              document.execCommand('formatBlock', false, value);
            } else {
              // その他のコマンド（bold, italic, strikeThrough, underline）
              document.execCommand(command, false, null);
            }
            
            updateToolbarState(toolbar, editor);
          });
        });
        
        // エディタの変更を監視して自動保存
        let saveTimeout = null;
        editor.addEventListener('input', () => {
          clearTimeout(saveTimeout);
          saveTimeout = setTimeout(() => {
            saveRichTextEditor(editor);
          }, 2000); // 2秒後に自動保存
        });
        
        // エディタのフォーカス時にツールバーの状態を更新
        editor.addEventListener('focus', () => {
          updateToolbarState(toolbar, editor);
        });
        
        editor.addEventListener('keyup', () => {
          updateToolbarState(toolbar, editor);
        });
      });
    }

    function updateToolbarState(toolbar, editor) {
      // ツールバーボタンのアクティブ状態を更新
      toolbar.querySelectorAll('.toolbar-btn').forEach(btn => {
        const command = btn.dataset.command;
        const value = btn.dataset.value;
        
        btn.classList.remove('active');
        
        if (command === 'formatBlock' && value) {
          // 見出しの状態をチェック
          const selection = window.getSelection();
          if (selection.rangeCount > 0) {
            const range = selection.getRangeAt(0);
            const node = range.commonAncestorContainer;
            const parent = node.nodeType === 1 ? node : node.parentElement;
            if (parent && parent.tagName && parent.tagName.toLowerCase() === value) {
              btn.classList.add('active');
            }
          }
        } else if (command && !btn.dataset.color) {
          // その他のコマンドの状態をチェック
          if (document.queryCommandState(command)) {
            btn.classList.add('active');
          }
        }
      });
    }

    function saveRichTextEditor(editor) {
      const workId = editor.dataset.workId;
      const field = editor.dataset.field;
      if (!workId || !field) return;
      
      const content = editor.innerHTML;
      
      // バックエンドに保存
      callGAS('updateWorkField', workId, field, content)
        .then(() => {
          // 保存成功（必要に応じて通知を表示）
        })
        .catch(error => {
          console.error('リッチテキスト保存エラー:', error);
        });
    }

    function closeWorkDetailOverlay() {
      document.getElementById('work-detail-overlay').classList.remove('show');
    }

    function renderWorkTasks(tasks) {
      const container = document.getElementById('work-tasks-container');
      container.innerHTML = '';
      if (!tasks || tasks.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-500">タスクはありません。</p>';
        return;
      }
      const table = document.createElement('table');
      table.className = 'table-fixed w-full text-sm';
      table.innerHTML = `<thead><tr class="border-b"><th class="w-2/5 text-left py-2">タスク名</th><th class="w-1/5 text-left py-2">ステータス</th><th class="w-1/5 text-left py-2">担当者</th><th class="w-1/5 text-left py-2">終了予定</th><th class="w-1/12"></th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      tasks.forEach(task => {
        const row = tbody.insertRow();
        row.className = 'border-b';
        row.dataset.taskId = task.task_id;
        
        const titleCell = row.insertCell();
        titleCell.className = 'py-2';
        titleCell.textContent = task.task_title;
        
        const statusCell = row.insertCell();
        statusCell.className = 'py-2';
        statusCell.innerHTML = `<div class="editable-container" onclick="editTaskField(event, '${task.task_id}', 'status_key', '${task.status_key}', 'TASK_STATUS')"><span class="editable-text">${getConfigLabel(task.status_key, 'TASK_STATUS')}</span><span class="editable-toggle-btn">✎</span></div>`;
        
        const assigneeCell = row.insertCell();
        assigneeCell.className = 'py-2';
        assigneeCell.innerHTML = `<div class="editable-container" onclick="editTaskField(event, '${task.task_id}', 'assign_to', '${task.assign_to || ''}', 'MEMBER')"><span class="editable-text">${escapeHtml(getMemberNameById(task.assign_to))}</span><span class="editable-toggle-btn">✎</span></div>`;
        
        const dateCell = row.insertCell();
        dateCell.className = 'py-2';
        dateCell.innerHTML = `<div class="editable-container datetime-editable" onclick="openDateTimePicker(event, 'task', '${task.task_id}', 'planned_end_datetime')"><span class="editable-text">${formatDateTimeForDisplay(task.planned_end_datetime)}</span><span class="editable-toggle-btn">✎</span></div>`;
        
        const actionCell = row.insertCell();
        actionCell.className = 'py-2 text-right';
        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-sm btn-secondary';

    function openEditTaskModal(task) {
      // タスク編集モーダルを開く（簡易版：新規作成モーダルを再利用）
      const form = document.getElementById('new-task-form');
      form.elements.work_id.value = task.work_id;
      form.elements.task_title.value = task.task_title;
      form.elements.task_detail.value = task.task_detail || '';
      
      // メンバー選択肢を設定
      const assignToSelect = form.elements.assign_to;
      assignToSelect.innerHTML = '<option value="">選択してください</option>';
      if (membersData && membersData.length > 0) {
        membersData.forEach(member => {
          const option = document.createElement('option');
          option.value = member.member_email;
          option.textContent = member.member_name;
          if (member.member_email === task.assign_to) {
            option.selected = true;
          }
          assignToSelect.appendChild(option);
        });
      }
      
      // ステータス選択肢を設定
      const statusSelect = form.elements.status_key;
      statusSelect.innerHTML = '<option value="">選択してください</option>';
      const taskStatuses = configData['TASK_STATUS'] || [];
      taskStatuses.forEach(status => {
        const option = document.createElement('option');
        option.value = status.config_key;
        option.textContent = status.config_value;
        if (status.config_key === task.status_key) {
          option.selected = true;
        }
        statusSelect.appendChild(option);
      });
      
      // 優先度選択肢を設定
      const prioritySelect = form.elements.priority_key;
      prioritySelect.innerHTML = '<option value="">選択してください</option>';
      const priorities = configData['TASK_PRIORITY'] || [];
      priorities.forEach(priority => {
        const option = document.createElement('option');
        option.value = priority.config_key;
        option.textContent = priority.config_value;
        if (priority.config_key === task.priority_key) {
          option.selected = true;
        }
        prioritySelect.appendChild(option);
      });
      
      // 日時を設定
      if (task.planned_end_datetime) {
        form.elements.planned_end_datetime.value = formatDateTimeForInput(task.planned_end_datetime);
      }
      
      // フォームの送信ハンドラを一時的に変更
      form.onsubmit = (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const taskData = Object.fromEntries(formData.entries());
        taskData.task_id = task.task_id;
        
        showModalLoading('modal-new-task', 'タスクを更新しています');
        callGAS('updateTask', task.task_id, taskData)
          .then(() => {
            showModalSuccess('modal-new-task', 'タスクを更新しました', () => {
              if (currentWorkId) {
                openWorkDetailOverlay(currentWorkId);
              }
            });
          })
          .catch(error => {
            handleError(error);
            resetModalState('modal-new-task');
          });
      };
      
      openModal('modal-new-task');
    }

    function showFilterMenu(event, tableName, columnKey) {
      event.stopPropagation();
      closeFilterMenu();
      const state = tableState[tableName];
      const data = tableName === 'works' ? worksData : tableName === 'projects' ? projectsData : membersData;
      const uniqueValues = [...new Set(data.map(item => item[columnKey]))].filter(v => v);
      const popup = document.createElement('div');
      popup.id = 'filter-popup';
      popup.className = 'filter-popup';
      const content = document.createElement('div');
      content.className = 'filter-popup-content';
      uniqueValues.forEach(value => {
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = value;
        const currentFilters = state.filters[columnKey] || [];
        if (currentFilters.includes(value)) checkbox.checked = true;
        let labelText = value;
        if (columnKey.endsWith('_key')) {
          const type = columnKey.replace('_key', '').toUpperCase();
          labelText = getConfigLabel(value, type) || value;
        }
        label.appendChild(checkbox);
        label.append(` ${labelText}`);
        content.appendChild(label);
      });
      popup.appendChild(content);
      const buttons = document.createElement('div');
      buttons.className = 'filter-popup-buttons';
      const applyBtn = document.createElement('button');
      applyBtn.textContent = '適用';
      applyBtn.className = 'btn btn-primary';
      applyBtn.onclick = () => {
        const selectedValues = Array.from(content.querySelectorAll('input:checked')).map(cb => cb.value);
        if (selectedValues.length > 0) {
          state.filters[columnKey] = selectedValues;
        } else {
          delete state.filters[columnKey];
        }
        closeFilterMenu();
        const dataLoaders = { 'works': loadWorksData, 'projects': loadProjectsData, 'members': loadMembersData };
        if (dataLoaders[tableName]) {
          showLoading();
          dataLoaders[tableName]();
        }
      };
      const clearBtn = document.createElement('button');
      clearBtn.textContent = 'クリア';
      clearBtn.className = 'btn btn-secondary';
      clearBtn.onclick = () => {
        delete state.filters[columnKey];
        closeFilterMenu();
        const dataLoaders = { 'works': loadWorksData, 'projects': loadProjectsData, 'members': loadMembersData };
        if (dataLoaders[tableName]) {
          showLoading();
          dataLoaders[tableName]();
        }
      };
      buttons.appendChild(clearBtn);
      buttons.appendChild(applyBtn);
      popup.appendChild(buttons);
      document.body.appendChild(popup);
      const rect = event.target.getBoundingClientRect();
      popup.style.left = `${rect.left}px`;
      popup.style.top = `${rect.bottom + window.scrollY}px`;
      popup.style.display = 'block';
      popup.addEventListener('click', (e) => { e.stopPropagation(); });
      setTimeout(() => { document.addEventListener('click', closeFilterMenu); }, 0);
    }

    function closeFilterMenu() {

      if (popup) {

      }

    function applyFiltersAndSort(tableName, data) {
      const state = tableState[tableName];
      let processedData = [...data];
      const filterKeys = Object.keys(state.filters);
      if (filterKeys.length > 0) {
        processedData = processedData.filter(item => {
          return filterKeys.every(key => {
            if (!state.filters[key] || state.filters[key].length === 0) return true;
            return state.filters[key].includes(item[key]);
          });
        });
      }
      if (state.sortKey) {
        processedData.sort((a, b) => {
          let valA = a[state.sortKey];
          let valB = b[state.sortKey];
          if (state.sortKey.includes('datetime') || state.sortKey.includes('_at')) {
            valA = valA ? new Date(valA).getTime() : 0;
            valB = valB ? new Date(valB).getTime() : 0;
          }
          if (valA < valB) return state.sortOrder === 'asc' ? -1 : 1;
          if (valA > valB) return state.sortOrder === 'asc' ? 1 : -1;
          return 0;
        });
      }
      return processedData;
    }

    function getHeaderDef(tableName, field) {
      const headers = tableName === 'works' ? worksTableHeaders : tableName === 'projects' ? projectsTableHeaders : membersTableHeaders;
      return headers.find(h => h.key === field);
    }
    function renderAssignees(assignees) {
      if (!assignees || assignees.length === 0) return '-';
      return `<div class="avatar-stack">${assignees.map(a => `<img src="${a.member_icon || 'https://via.placeholder.com/32'}" class="avatar" title="${escapeHtml(a.member_name)}" alt="${escapeHtml(a.member_name)}">`).join('')}</div>`;
    }
    function getConfigLabel(key, type) {
      if (!key || !configData[type]) return key;
      const config = configData[type].find(c => c.config_key === key);
      return config ? config.config_value : key;
    }
    function formatDate(dateString) {
      if (!dateString) return '-';
      try {
        const dt = new Date(dateString);
        const offset = dt.getTimezoneOffset() * 60000;
        const localDate = new Date(dt.getTime() - offset);
        return localDate.toISOString().slice(0,10);
      } catch (e) { return dateString; }
    }
    function formatDateTimeForDisplay(dateString, includeSeconds = false) {
      if (!dateString) return includeSeconds ? 'yyyy/mm/dd hh:mm:ss' : 'yyyy/mm/dd hh:mm';
      try {
        const dt = new Date(dateString);
        const year = dt.getFullYear();
        const month = ('0' + (dt.getMonth() + 1)).slice(-2);
        const day = ('0' + dt.getDate()).slice(-2);
        const hours = ('0' + dt.getHours()).slice(-2);
        const minutes = ('0' + dt.getMinutes()).slice(-2);
        const seconds = ('0' + dt.getSeconds()).slice(-2);
        if (includeSeconds) {
          return `${year}/${month}/${day} ${hours}:${minutes}:${seconds}`;
        }
        return `${year}/${month}/${day} ${hours}:${minutes}`;
      } catch (e) {
        return includeSeconds ? 'yyyy/mm/dd hh:mm:ss' : 'yyyy/mm/dd hh:mm';
      }
    }
    function formatDateTimeForInput(dateString) {
      if (!dateString) return '';
      try {
        const dt = new Date(dateString);
        const offset = dt.getTimezoneOffset() * 60000;
        const localDate = new Date(dt.getTime() - offset);
        return localDate.toISOString().slice(0, 16);
      } catch (e) { return ''; }
    }
    function escapeHtml(text) {
      if (text === null || typeof text === 'undefined') return '';
      return String(text).replace(/[&<>"']/g, match => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[match]);
    }

    function saveChange(tableName, id, field, newValue, oldValue) {
      if (String(newValue) === String(oldValue)) return;

      showLoading();
      
      // まずデータ配列を更新する
      const data = tableName === 'works' ? worksData : tableName === 'projects' ? projectsData : membersData;
      const idKey = tableName === 'members' ? 'member_email' : (tableName === 'works' ? 'work_id' : 'project_id');
      const item = data.find(d => String(d[idKey]) === String(id));
      if (item) {
        item[field] = newValue;
      }

      // 次に表示を更新する
      const table = document.getElementById(`${tableName}-table`);
      const row = table.querySelector(`tr[data-id="${id}"]`);
      if (row) {
        const cell = row.querySelector(`td[data-field="${field}"]`);
        if (cell) {
          const header = getHeaderDef(tableName, field);
          let displayValue = newValue;
          if (header && header.configType) {
            displayValue = getConfigLabel(newValue, header.configType);
          } else if (header && header.editType === 'datetime') {
            displayValue = formatDateTimeForDisplay(newValue);
          }
          // editable-container の中の span.editable-text を更新する
          const editableTextSpan = cell.querySelector('.editable-text');
          if (editableTextSpan) {
            editableTextSpan.textContent = displayValue;
          } else {
            // editable-container がない場合（テキストフィールドなど）
            cell.textContent = displayValue;
          }
        }
      }

      // 最後にサーバーに保存する
      callGAS('updateSingleField', tableName, id, field, newValue)
        .then(success => {
          hideLoading();
          if (!success) {
            handleError({ message: '更新に失敗しました。' });
            // 失敗時はデータを再読み込み
            const dataLoaders = { 'works': loadWorksData, 'projects': loadProjectsData, 'members': loadMembersData };
            if (dataLoaders[tableName]) dataLoaders[tableName]();
          }
        })
        .catch(err => {
          handleError(err);
          // エラー時はデータを再読み込み
          const dataLoaders = { 'works': loadWorksData, 'projects': loadProjectsData, 'members': loadMembersData };
          if (dataLoaders[tableName]) dataLoaders[tableName]();
        });
    }

    // ---- テキスト編集 ----
    function switchToEditMode(cell, header, tableName) {
      cell.classList.add('editing');
      const originalValue = cell.textContent;
      cell.innerHTML = '';
      const input = document.createElement('input');
      input.type = 'text';
      input.value = originalValue;
      input.className = 'inline-edit-input';
      cell.appendChild(input);
      input.focus();

      const onSave = () => {
        cell.innerHTML = escapeHtml(input.value);
        cell.classList.remove('editing');
        saveChange(tableName, cell.parentElement.dataset.id, header.key, input.value, originalValue);
      };
      input.addEventListener('blur', onSave);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') input.blur();
        if (e.key === 'Escape') {
          cell.innerHTML = escapeHtml(originalValue);
          cell.classList.remove('editing');
        }
      });
    }

    // ---- セレクト（ドロップダウン）編集 ----
    function showSelectEditor(event, tableName, id, field) {
      event.stopPropagation();
      const container = event.currentTarget;
      const header = getHeaderDef(tableName, field);
      const data = (tableName === 'works' ? worksData : tableName === 'projects' ? projectsData : membersData);
      const idKey = tableName === 'members' ? 'member_email' : (tableName === 'works' ? 'work_id' : 'project_id');
      const item = data.find(d => d[idKey] === id);
      const currentValue = item ? item[field] : '';
      
      const optionsContainer = document.createElement('div');

      const options = configData[header.configType] || [];
      if (options.length === 0) return;

      options.forEach(opt => {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'popup-editor-option';
        optionDiv.textContent = opt.config_value;
        optionDiv.dataset.value = opt.config_key;
        if (opt.config_key === currentValue) {
          optionDiv.classList.add('selected');
        }
        optionDiv.addEventListener('click', () => {
          saveChange(tableName, id, field, opt.config_key, currentValue);
          closeAllPopups();
        });
        optionsContainer.appendChild(optionDiv);
      });
      
      createPopup(container, optionsContainer);
    }




    
    // ---- 日付ピッカーを開く ----
    function openDateTimePicker(event, tableName, id, field) {
      event.stopPropagation();
      event.preventDefault();
      
      let originalValue = '';
      if (tableName === 'task') {
        // タスクの場合は、現在開いているWork詳細からタスクデータを取得
        const container = document.getElementById('work-tasks-container');
        const row = container.querySelector(`tr[data-task-id="${id}"]`);
        if (row) {
          // タスクデータを再取得する必要がある場合は、getWorkByIdを呼び出す
          // 簡易版として、現在の表示から値を取得
          const cell = row.querySelector(`td[data-field="${field}"]`);
          if (cell) {
            const textSpan = cell.querySelector('.editable-text');
            if (textSpan) {
              // 表示されているテキストから日時を推測するのは難しいので、
              // バックエンドから再取得する
              if (currentWorkId) {
                callGAS('getWorkById', currentWorkId).then(work => {
                  const task = work.tasks.find(t => t.task_id === id);
                  if (task) {
                    openDateTimePickerForTask(id, field, task[field] || '');
                  }
                });
                return;
              }
            }
          }
        }
        return;
      }
      
      const data = (tableName === 'works' ? worksData : tableName === 'projects' ? projectsData : membersData);
      const idKey = tableName === 'members' ? 'member_email' : (tableName === 'works' ? 'work_id' : 'project_id');
      const item = data.find(d => String(d[idKey]) === String(id));
      originalValue = item ? item[field] : '';
      
      // セルを取得
      const table = document.getElementById(`${tableName}-table`);
      const row = table.querySelector(`tr[data-id="${id}"]`);
      if (!row) return;
      
      const cell = row.querySelector(`td[data-field="${field}"]`);
      if (!cell) return;
      
      // 既に編集中なら何もしない
      if (cell.classList.contains('editing-datetime-picker')) return;
      
      // 編集中の状態にする
      cell.classList.add('editing-datetime-picker');
      
      // 現在の日時を取得してパース
      let dateObj;
      if (originalValue) {
        dateObj = new Date(originalValue);
      } else {
        dateObj = new Date();
      }
      
      const yyyy = dateObj.getFullYear().toString().padStart(4, '0');
      const mm = (dateObj.getMonth() + 1).toString().padStart(2, '0');
      const dd = dateObj.getDate().toString().padStart(2, '0');
      const hh = dateObj.getHours().toString().padStart(2, '0');
      const min = dateObj.getMinutes().toString().padStart(2, '0');
      const ss = dateObj.getSeconds().toString().padStart(2, '0');
      
      // 既存のコンテンツを非表示
      const container = cell.querySelector('.editable-container');
      if (container) {
        container.style.display = 'none';
      }
      
      // カスタム日時入力フィールドを作成
      const editorDiv = document.createElement('div');
      editorDiv.className = 'datetime-custom-editor';
      editorDiv.innerHTML = `
        <input type="text" class="datetime-segment" data-segment="yyyy" maxlength="4" value="${yyyy}" placeholder="yyyy" />
        <span class="datetime-separator">/</span>
        <input type="text" class="datetime-segment" data-segment="mm" maxlength="2" value="${mm}" placeholder="mm" />
        <span class="datetime-separator">/</span>
        <input type="text" class="datetime-segment" data-segment="dd" maxlength="2" value="${dd}" placeholder="dd" />
        <span class="datetime-separator"> </span>
        <input type="text" class="datetime-segment" data-segment="hh" maxlength="2" value="${hh}" placeholder="hh" />
        <span class="datetime-separator">:</span>
        <input type="text" class="datetime-segment" data-segment="min" maxlength="2" value="${min}" placeholder="mm" />
      `;
      
      cell.appendChild(editorDiv);
      
      const inputs = editorDiv.querySelectorAll('.datetime-segment');
      
      // 各inputにイベントリスナーを設定
      inputs.forEach((input, index) => {
        // 数字のみ入力可能
        input.addEventListener('input', (e) => {
          let value = e.target.value.replace(/[^0-9]/g, '');
          const maxLength = parseInt(e.target.getAttribute('maxlength'));
          
          if (value.length > maxLength) {
            value = value.substring(0, maxLength);
          }
          
          e.target.value = value;
          
          // 最大桁数に達したら次のフィールドへ
          if (value.length >= maxLength && index < inputs.length - 1) {
            inputs[index + 1].focus();
            inputs[index + 1].select();
          }
        });
        
        // キーボード操作
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            saveDateTimePicker(cell, tableName, id, field, originalValue, inputs);
          } else if (e.key === 'Escape') {
            e.preventDefault();
            cancelDateTimePicker(cell, container);
          } else if (e.key === 'Tab') {
            // Tabキーは自然な動作を許可
            if (!e.shiftKey && index === inputs.length - 1) {
              // 最後のフィールドでTabを押したら保存
              e.preventDefault();
              saveDateTimePicker(cell, tableName, id, field, originalValue, inputs);
            }
          } else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) {
            // カーソルが末尾にある場合は次のフィールドへ
            if (index < inputs.length - 1) {
              e.preventDefault();
              inputs[index + 1].focus();
              inputs[index + 1].setSelectionRange(0, 0);
            }
          } else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) {
            // カーソルが先頭にある場合は前のフィールドへ
            if (index > 0) {
              e.preventDefault();
              const prevInput = inputs[index - 1];
              prevInput.focus();
              prevInput.setSelectionRange(prevInput.value.length, prevInput.value.length);
            }
          }
        });
        
        // フォーカスアウト時の処理
        input.addEventListener('blur', (e) => {
          setTimeout(() => {
            // 次のフォーカスがdatetime-segment内かチェック
            const focusedElement = document.activeElement;
            if (!focusedElement || !focusedElement.classList.contains('datetime-segment') || focusedElement.closest('td') !== cell) {
              saveDateTimePicker(cell, tableName, id, field, originalValue, inputs);
            }
          }, 100);
        });
      });
      
      // 最初のフィールドにフォーカス
      setTimeout(() => {
        inputs[0].focus();
        inputs[0].select();
      }, 50);
    }
    
    function saveDateTimePicker(cell, tableName, id, field, originalValue, inputs) {
      const values = Array.from(inputs).map(input => input.value);
      const [yyyy, mm, dd, hh, min] = values;
      
      // バリデーション
      const yearNum = parseInt(yyyy);
      const monthNum = parseInt(mm);
      const dayNum = parseInt(dd);
      const hourNum = parseInt(hh);
      const minuteNum = parseInt(min);
      
      if (isNaN(yearNum) || yearNum < 1900 || yearNum > 2100 ||
          isNaN(monthNum) || monthNum < 1 || monthNum > 12 ||
          isNaN(dayNum) || dayNum < 1 || dayNum > 31 ||
          isNaN(hourNum) || hourNum < 0 || hourNum > 23 ||
          isNaN(minuteNum) || minuteNum < 0 || minuteNum > 59) {
        alert('無効な日時です');
        cancelDateTimePicker(cell, cell.querySelector('.editable-container'));
        return;
      }
      
      // ISO形式の日時文字列を作成（秒は00固定）
      const paddedYyyy = yyyy.padStart(4, '0');
      const paddedMm = mm.padStart(2, '0');
      const paddedDd = dd.padStart(2, '0');
      const paddedHh = hh.padStart(2, '0');
      const paddedMin = min.padStart(2, '0');
      
      const newDateStr = `${paddedYyyy}-${paddedMm}-${paddedDd}T${paddedHh}:${paddedMin}:00`;
      const newDate = new Date(newDateStr);
      
      if (isNaN(newDate.getTime())) {
        alert('無効な日時です');
        cancelDateTimePicker(cell, cell.querySelector('.editable-container'));
        return;
      }
      
      const newValueAsISO = newDate.toISOString();
      
      // エディタを削除
      const editor = cell.querySelector('.datetime-custom-editor');
      if (editor) {
        cell.removeChild(editor);
      }
      
      // 元の表示に戻す
      const container = cell.querySelector('.editable-container');
      if (container) {
        container.style.display = 'flex';
        const displaySpan = container.querySelector('.editable-text');
        if (displaySpan) {
          displaySpan.textContent = formatDateTimeForDisplay(newValueAsISO);
        }
      }
      
      cell.classList.remove('editing-datetime-picker');
      
      // データを保存（変更があった場合のみ）
      if (newValueAsISO !== originalValue) {
        saveChange(tableName, id, field, newValueAsISO, originalValue);
      }
    }
    
    function cancelDateTimePicker(cell, container) {
      const editor = cell.querySelector('.datetime-custom-editor');
      if (editor) {
        cell.removeChild(editor);
      }
      
      
      if (container) {
        container.style.display = 'flex';
      }
      
      cell.classList.remove('editing-datetime-picker');
    }
