<style>
    :root {
      /* Custom variables for layout */
      --sidebar-width: 80px;
      --header-height: 72px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Noto Sans JP', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Layout */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      z-index: 100;
      display: flex;
      align-items: center;
    }

    .header-content {
      position: relative;
      width: 100%;
      max-width: 100%;
      padding: 0 32px;
      padding-left: calc(var(--sidebar-width) + 32px);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 24px;
    }

    #work-detail-header-info {
      display: none;
      flex: 1;
      margin-left: 24px;
      font-size: 14px;
    }

    #work-detail-header-row1,
    #work-detail-header-row2 {
      white-space: nowrap;
      flex-wrap: wrap;
    }

    #work-detail-header-info > div > div {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .work-detail-status-container,
    .work-detail-due-container {
      white-space: nowrap;
      flex-shrink: 0;
    }

    #work-detail-assignees-header-info img.avatar {
      vertical-align: middle;
      display: inline-block;
    }

    .url-copy-button-header {
      flex-shrink: 0;
      margin-left: auto;
    }

    .header-title {
      font-size: 1.5rem;
      line-height: 1.75rem;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
    }

    #sidebar-loading-indicator {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      margin-left: 8px;
    }

    .sidebar {
      width: var(--sidebar-width);
      height: calc(100vh - var(--header-height));
      position: fixed;
      left: 0;
      top: var(--header-height);
      display: flex;
      flex-direction: column;
    }
    
    .main-content {
      margin-left: var(--sidebar-width);
      margin-top: var(--header-height);
      padding: 24px 32px;
      min-height: calc(100vh - var(--header-height));
    }
    
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 8px;
      margin: 0 4px;
      cursor: pointer;
      border-radius: 12px;
      font-weight: 500;
    }

    .nav-item span:first-child {
      font-size: 24px;
      line-height: 1;
    }

    .nav-item span:last-child {
      font-size: 11px;
      line-height: 1.2;
    }

    .sidebar-nav {
      padding: 16px 0;
      flex: 1;
      overflow-y: auto;
    }

    .sidebar-nav > .nav-item + .nav-item {
      margin-top: 0.25rem;
    }

    /* Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 1rem;
    }

    @media (min-width: 768px) {
      #home-works-container.grid-container,
      #knowledge-container.grid-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      #home-works-container.grid-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .summary-grid.grid-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1280px) {
      #knowledge-container.grid-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .summary-grid.grid-container {
      gap: 1.25rem;
    }

    /* Typography */
    .main-title {
      font-size: 1.875rem;
      line-height: 2.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .main-subtitle {
      color: #475569;
    }

    .section-title {
      font-size: 1.25rem;
      line-height: 1.75rem;
      font-weight: 700;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.125rem;
      line-height: 1.75rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    /* Table */
    .table-container {
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    
    th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      position: relative;
      white-space: nowrap;
    }
    
    th .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
    }

    th .header-label {
      flex-grow: 1;
    }

    th .header-icons {
      display: none;
      align-items: center;
      gap: 4px;
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      padding-left: 8px;
      border-radius: 4px;
    }

    th:hover .header-icons {
      display: flex;
    }

    .sort-icon, .filter-icon {
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s;
      padding: 4px;
      border-radius: 50%;
    }

    .filter-popup {
      position: absolute;
      top: 100%;
      left: 0;
      border-radius: 12px;
      z-index: 20;
      padding: 12px;
      min-width: 200px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }

    .filter-popup-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .filter-popup-content label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .filter-popup-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 8px;
    }
    
    td {
      padding: 12px 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Avatar */
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }
    
    .avatar-stack {
      display: flex;
    }
    
    .avatar-stack .avatar {
      margin-left: -12px;
      border: 2px solid white;
    }

    /* New Button */
    .new-button-container {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--sidebar-width);
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .new-button {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 700;
      font-size: 28px;
      border: none;
      padding: 0;
      margin: 0;
    }

    #new-button-main {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      font-size: 32px;
      line-height: 1;
    }

    .new-button-loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .new-button-loading .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .new-button-loading .loading-checkmark {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .new-button-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: calc((var(--sidebar-width) - 56px) / 2);
      border-radius: 12px;
      z-index: 1000;
      overflow: hidden;
      transform-origin: top left;
      min-width: 200px;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.95) translateY(-10px);
      transition: opacity 0.3s, visibility 0.3s, transform 0.3s;
    }

    .new-button-dropdown.show {
      opacity: 1;
      visibility: visible;
      transform: scale(1) translateY(0);
    }

    .new-button-dropdown a {
      display: block;
      padding: 12px 16px;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }

    /* Inline Edit Styles */
    .editable {
      cursor: text;
      border-radius: 4px;
      padding: 12px 16px;
      margin: -12px -16px;
    }

    .inline-edit-input {
      width: 100%;
      padding: 10px 14px;
      margin: -12px -16px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      outline: 2px solid;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .editable-container {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      position: relative;
      border-radius: 4px;
      padding: 12px 16px;
      margin: -12px -16px;
    }

    .editable-text {
      flex-grow: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .editable-toggle-btn {
      flex-shrink: 0;
      margin-left: 8px;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.2s;
      font-size: 14px;
    }

    .editable-container:hover .editable-toggle-btn {
      opacity: 1;
      transform: scale(1);
    }
    
    /* datetime専用のスタイル */
    .datetime-editor-container {
      display: inline-flex;
      align-items: center;
      gap: 0;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.5;
      white-space: nowrap;
      flex-wrap: nowrap;
    }
    
    .datetime-text {
      display: inline-block;
      min-width: 1ch;
      outline: none;
      border: none;
      background: transparent;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 0;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      vertical-align: baseline;
    }
    
    .datetime-text:focus {
      background-color: rgba(0, 0, 0, 0.05);
      border-radius: 2px;
      padding: 0 2px;
      margin: 0 -2px;
    }
    
    .datetime-text[data-segment="year"] {
      width: 4ch;
    }
    
    .datetime-text[data-segment="month"],
    .datetime-text[data-segment="day"],
    .datetime-text[data-segment="hour"],
    .datetime-text[data-segment="minute"] {
      width: 2ch;
    }
    
    .datetime-separator {
      padding: 0 2px;
      font-family: 'Courier New', monospace;
      user-select: none;
    }
    
    .datetime-custom-editor {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 10px 14px;
      margin: -12px -16px;
      background-color: white;
      border: 2px solid;
      border-radius: 4px;
      white-space: nowrap;
      box-sizing: border-box;
      width: calc(100% + 32px);
    }
    
    .datetime-segment {
      border: none;
      background: transparent;
      font-family: 'SF Mono', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      outline: none;
      padding: 1px 2px;
      border-radius: 2px;
      box-sizing: border-box;
    }
    
    .datetime-segment:focus {
      background-color: rgba(0, 0, 0, 0.05);
    }
    
    .datetime-segment[data-segment="yyyy"] {
      width: 42px;
    }
    
    .datetime-segment[data-segment="mm"],
    .datetime-segment[data-segment="dd"],
    .datetime-segment[data-segment="hh"],
    .datetime-segment[data-segment="min"] {
      width: 24px;
    }
    
    .datetime-custom-editor .datetime-separator {
      user-select: none;
      font-size: 13px;
    }
    
    .datetime-editable {
      cursor: pointer;
    }
    
    .datetime-editable .editable-text {
      font-family: 'SF Mono', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', monospace;
      font-size: 14px;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .popup-editor {
      position: absolute;
      z-index: 100;
      border-radius: 12px;
      padding: 8px;
      transform-origin: top left;
    }

    .popup-editor-input {
      width: 100%;
      min-width: 150px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: inherit;
      outline: none;
      padding: 8px 12px;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .popup-editor-option {
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 6px;
      white-space: nowrap;
    }

    /* Overlay for Work Detail */
    .overlay {
      position: fixed;
      top: var(--header-height);
      left: var(--sidebar-width);
      width: calc(100% - var(--sidebar-width));
      height: calc(100% - var(--header-height));
      z-index: 900;
      display: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .overlay.show {
      display: block;
      opacity: 1;
    }

    .overlay-content {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .overlay-header-info {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 24px 32px;
    }

    .overlay-body {
      flex-grow: 1;
      display: flex;
      overflow-y: auto;
      padding: 24px 32px;
    }

    .overlay-main {
      flex: 0 0 33.333%;
      padding-right: 16px;
      overflow-y: auto;
    }

    .overlay-center {
      flex: 0 0 33.333%;
      padding: 0 16px;
      overflow-y: auto;
    }

    .overlay-side {
      flex: 0 0 33.333%;
      padding-left: 16px;
      overflow-y: auto;
    }

    .detail-section {
      margin-bottom: 24px;
    }

    .detail-section h3 {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      padding: 0 1rem;
    }

    /* Rich Text Editor */
    .rich-text-editor-wrapper {
      border: 1px solid;
      border-radius: 8px;
      overflow: hidden;
    }

    .rich-text-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px;
      border-bottom: 1px solid;
      flex-wrap: wrap;
    }

    .toolbar-btn {
      padding: 6px 12px;
      border: none;
      background-color: transparent;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
    }

    .toolbar-separator {
      width: 1px;
      height: 24px;
      margin: 0 4px;
    }

    .toolbar-btn.color-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 2px solid;
      padding: 0;
    }

    .rich-text-editor {
      min-height: 150px;
      padding: 12px;
      outline: none;
      overflow-y: auto;
    }

    .rich-text-editor:focus {
      outline: none;
    }

    .rich-text-editor h1 {
      font-size: 1.875rem;
      font-weight: 700;
      margin: 0.5rem 0;
    }

    .rich-text-editor h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0.5rem 0;
    }

    .rich-text-editor h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0.5rem 0;
    }

    /* Combobox */
    .combobox-container {
      position: relative;
    }

    .combobox-suggestions {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      border-radius: 8px;
      margin-top: 4px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1100;
    }

    .combobox-suggestions div {
      padding: 10px 16px;
      cursor: pointer;
    }

    /* Chart */
    .chart-container {
      height: 18rem;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .modal.active {
      display: flex;
      opacity: 1;
    }
    
    .modal-content {
      border-radius: 28px;
      padding: 24px;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
      width: 90%;
    }

    .modal-title {
      font-size: 1.5rem;
      line-height: 2rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
    }

    .modal-footer {
      margin-top: 1.25rem;
      text-align: right;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-form-content {
      display: block;
    }

    .modal-result-content {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 250px;
      text-align: center;
    }

    .modal-result-content.show {
      display: flex;
    }

    .modal-spinner {
      box-sizing: border-box;
      width: 80px;
      height: 80px;
      border: 8px solid rgba(0, 0, 0, 0.1);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .modal-checkmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      line-height: 1;
      margin-bottom: 16px;
    }

    .modal-result-message {
      font-size: 1.25rem;
      font-weight: 500;
    }

    /* Form */
    .form-group {
      margin-bottom: 1rem;
    }

    /* Badge */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Link button */
    .btn-link {
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      font-size: inherit;
      font-family: inherit;
    }
</style>
