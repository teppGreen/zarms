<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZARMS Members Tabulator Sandbox</title>

    <!-- Beer CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/beercss@3.10.8/dist/cdn/beer.min.css"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="light">
    <main class="responsive" id="app">
      <header>
        <h4>Members タブ描画検証 (Tabulator)</h4>
        <p class="small-text">
          GAS本体に影響を出さず、ローカルでUI崩れの有無を確認するためのサンドボックスです。
        </p>
      </header>

      <section class="grid">
        <article class="s12 m6 l4">
          <h6>表示オプション</h6>
          <label class="checkbox">
            <input id="fitColumns" type="checkbox" checked />
            <span>fitColumns レイアウト</span>
          </label>
          <label class="checkbox">
            <input id="stripedRows" type="checkbox" checked />
            <span>行のストライプ表示</span>
          </label>
          <button id="rerenderButton" class="button fill">再描画</button>
        </article>

        <article class="s12 m6 l8">
          <h6>描画ログ</h6>
          <pre id="log"></pre>
        </article>
      </section>

      <section>
        <div id="members-table-shell">
          <iframe
            id="members-table-frame"
            title="Members Tabulator Isolated Frame"
            loading="eager"
          ></iframe>
        </div>
      </section>
    </main>

    <!-- Beer CSS JS -->
    <script src="https://cdn.jsdelivr.net/npm/beercss@3.10.8/dist/cdn/beer.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
