<dialog id="modal-select-boards" class="modal padding no-scroll">
    <header class="fixed small-padding">
        <div class="row no-space align-center">
            <div class="max">
                <h5 class="bold">ボードを選択</h5>
            </div>
            <button class="circle transparent" onclick="ui('#modal-select-boards')">
                <i>close</i>
            </button>
        </div>

        <!-- 検索バー -->
        <div class="field round border prefix">
            <i>search</i>
            <input type="text" id="board-search-input" placeholder="ボード名で検索..."
                oninput="App.modals.selectBoards.filterResults()">
        </div>
    </header>

    <!-- 結果リスト -->
    <article id="board-results-container" class="scroll medium small-padding no-round small-line background no-elevate">
        <!-- 動的に生成 -->
    </article>

    <footer class="fixed small-padding">
        <nav class="right-align">
            <button class="border" onclick="ui('#modal-select-boards')">キャンセル</button>
            <button onclick="App.modals.selectBoards.confirm()">選択</button>
        </nav>
    </footer>
</dialog>

<script>
    (function () {
        App.modals.selectBoards = {
            callback: null,
            selectedIds: [],
            allBoards: [],
            multiSelect: false,

            open: async function (options = {}) {
                this.callback = options.callback || null;
                this.multiSelect = options.multiSelect || false;
                this.selectedIds = options.preSelected || [];

                // App.state.data.boards から直接ロード
                this.allBoards = App.state.data.boards || [];
                this.render();
                await ui('#modal-select-boards');

                // 共通処理を使用
                App.utils.modal.focusInput('#board-search-input');
            },

            render: function () {
                this.filterResults();
            },

            filterResults: function () {
                const searchInput = document.getElementById('board-search-input');
                const container = document.getElementById('board-results-container');

                if (!container) return;

                const searchTerm = searchInput ? searchInput.value : '';

                // 共通フィルタリング処理を使用
                const filtered = App.utils.modal.filterData(
                    this.allBoards,
                    searchTerm,
                    ['name'], // 検索対象フィールド
                    true // activeOnly
                );

                // 表示
                if (filtered.length === 0) {
                    container.innerHTML = '<p class="padding">該当するボードが見つかりません</p>';
                    return;
                }

                container.innerHTML = filtered.map(board => {
                    const isSelected = this.selectedIds.includes(board.id);
                    const safeBoardName = escapeHtml(board.name);
                    const safeBoardId = escapeHtmlAttribute(board.id);
                    
                    return `
                        <div><label class="${this.multiSelect ? 'checkbox' : 'radio'} row middle-align small-space">
                            <input type="${this.multiSelect ? 'checkbox' : 'radio'}" 
                                name="board-select" 
                                value="${safeBoardId}" 
                                ${isSelected ? 'checked' : ''}
                                onchange="App.modals.selectBoards.toggleSelection('${safeBoardId}', this.checked)">
                            <span class="small-margin">
                                <strong>${safeBoardName}</strong>
                            </span>
                        </label></div>
                    `;
                }).join('');
            },

            toggleSelection: function (id, checked) {
                if (this.multiSelect) {
                    if (checked && !this.selectedIds.includes(id)) {
                        this.selectedIds.push(id);
                    } else if (!checked) {
                        this.selectedIds = this.selectedIds.filter(sid => sid !== id);
                    }
                } else {
                    this.selectedIds = checked ? [id] : [];
                }
            },

            confirm: function () {
                // 共通処理を使用
                this.selectedIds = App.utils.modal.getSelectedIds(
                    '#board-results-container',
                    'board-select',
                    this.multiSelect
                );

                if (this.callback && typeof this.callback === 'function') {
                    this.callback(this.selectedIds);
                }

                ui('#modal-select-boards');
            }
        };
    })();
</script>
