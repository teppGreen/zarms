<main class="surface-container no-padding">
    <header class="center-align">
        <div class="row tiny-space">
            <h1 id="page-title" class="small-text"></h1>
            <a id="public-sheet-link" target="_blank" title="スプレッドシートを開く" class="small-text secondary-text"><i class="tiny">open_in_new</i></a>
        </div>
    </header>

    <div class="background center large-width round large-padding">
        <div id="state-loading" class="page active">
            <div class="center-align">
              <div class="center small-height small-width">
                <div class="shape loading-indicator max rotate">
                  <img src="https://i.gyazo.com/b89e144f8b87cb5ccc92773364308a23.png" class="responsive" alt="紅瑠くるりの決めポーズのイラスト">
                </div>
              </div>
              <div class="space"></div>  
              <p class="large-text bold">集計結果を読み込んでいます</p>
              <p>しばらくお待ちください。</p>
            </div>
        </div>

        <div id="state-error" class="page">
            <div class="center-align">
                <i class="extra error-text">error</i>
                <p class="large-text bold error-text">データの取得に失敗しました</p>
                <p id="error-message"></p>
                <button id="retry-button" class="primary responsive extra margin">
                    <i>refresh</i>
                    <span>再読み込み</span>
                </button>
            </div>
        </div>

        <div id="state-result" class="page">
          <div class="center-align row vertical tiny-space">
            <span id="plan-num" class="font-number left-padding right-padding border round center-align"></span>
            <span id="plan-name" class="large-text center-align bold"></span>
          </div>

          <div class="space"></div>

          <div class="row center-align">
            <img class="extra" src="https://i.gyazo.com/1a5c0f6c2ad4f6600200c9e3de4e8f95.png">
            <span class="no-line">数字の大小＝企画の優劣じゃないよ。<br>多くの人を惹きつけた企画も、<br>誰かの心に深く刺さった企画も、<br>ぜんぶが合わさったのが展軸祭だよ。<br>
              次回もみんなと会えたら嬉しいな！</span>
          </div>

          <div class="space"></div>

          <div class="grid">
              <div class="padding row vertical primary large-round center-align s12 m6 l6 tiny-space">
                  <span class="middle-align">件数
                    <i class="tiny">help</i>
                    <div class="tooltip bottom round">この企画を｢特に良かった｣と<br>評価した人数</div>
                  </span>
                  <span id="count-num" class="font-number bold small-margin" style="font-size: 2rem;"></span>
              </div>
              <div class="padding row vertical surface-container-highest large-round center-align s12 m6 l6 tiny-space">
                  <span class="middle-align">割合
                    <i class="tiny">help</i>
                    <div class="tooltip bottom round">アンケートの全回答者に占める<br>件数の割合</div>
                  </span>
                  <span id="count-ratio" class="font-number bold small-margin" style="font-size: 2rem;"></span>
              </div>
              <div class="padding row vertical surface-container-highest large-round center-align s12 m6 l6 tiny-space">
                  <span>総合ランク</span>
                  <span id="general-ranking" class="font-number bold small-margin" style="font-size: 2rem;"></span>
              </div>
              <div class="padding row vertical surface-container-highest large-round center-align s12 m6 l6 tiny-space">
                  <span id="type-ranking-label">種別内ランク</span>
                  <span id="type-ranking" class="font-number bold small-margin" style="font-size: 2rem;"></span>
              </div>
          </div>

          <div class="space"></div>
          
          <table class="border">
              <tbody>
                  <tr>
                      <td class="secondary-text">出展団体名</td>
                      <td id="directory-name"></td>
                  </tr>
                  <tr>
                      <td class="secondary-text">あなたの表示名</td>
                      <td id="member-display-name"></td>
                  </tr>
                  <tr>
                      <td class="secondary-text">あなたの属性</td>
                      <td id="member-role"></td>
                  </tr>
              </tbody>
          </table>
      </div>
    </div>

    <footer class="center-align">
        <span class="secondary-text">展軸祭実行委員会</span>
    </footer>
</main>
