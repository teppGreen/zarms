<dialog id="modal-detail-skill" class="surface-container padding max">

        <div class="grid small-padding bottom-margin">
            <div class="s12 m9">
                <h5 class="bold no-margin">スキル詳細</h5>
            </div>
            <div class="s12 m3">
                <nav class="row right-align">
                    <button class="circle transparent" onclick="App.modals.skillDetail.openNewComment()" title="コメントを作成">
                        <i>add_comment</i>
                    </button>
                    <button class="circle transparent" onclick="App.modals.skillDetail.close()" title="閉じる">
                        <i>close</i>
                    </button>
                </nav>
            </div>
        </div>

        <div class="grid small-padding tiny-space no-margin">
            <div class="s12 m3 background small-round padding">
                <h6 class="bold small bottom-margin">基本情報</h6>

                <div class="field border label small bottom-margin">
                    <input type="text" id="skill-detail-title-input" placeholder=" ">
                    <label>タイトル</label>
                </div>

                <div class="field border label small suffix no-wrap bottom-margin">
                    <select id="skill-detail-type-input">
                        <option value="">（未設定）</option>
                    </select>
                    <label>種別</label>
                    <i>arrow_drop_down</i>
                </div>

                <div class="field border label small bottom-margin">
                    <textarea id="skill-detail-user-note-input" rows="4" placeholder=" "></textarea>
                    <label>メモ</label>
                </div>

                <div class="field border label small bottom-margin">
                    <textarea id="skill-detail-remark-input" rows="2" placeholder=" "></textarea>
                    <label>備考</label>
                </div>

                <div class="field border label small bottom-margin">
                    <input type="text" id="skill-detail-created-by-input" placeholder=" " readonly>
                    <label>作成者</label>
                </div>

                <div class="field border label small bottom-margin">
                    <input type="text" id="skill-detail-created-at-input" placeholder=" " readonly>
                    <label>作成日時</label>
                </div>

                <div class="field border label small bottom-margin">
                    <input type="text" id="skill-detail-updated-by-input" placeholder=" " readonly>
                    <label>最終更新者</label>
                </div>

                <div class="field border label small bottom-margin">
                    <input type="text" id="skill-detail-updated-at-input" placeholder=" " readonly>
                    <label>最終更新日時</label>
                </div>

                <p id="skill-detail-error" class="error-text small-text" style="display: none;"></p>
                <div class="center-align row tiny-space secondary-text small-text top-margin" id="skill-detail-last-updated"></div>
            </div>

            <div class="s12 m6 background small-round padding">
                <div class="row tiny-space bottom-margin">
                    <h6 class="bold small max">保有メンバー</h6>
                    <div class="field label border small">
                        <select id="skill-detail-level-select"></select>
                        <label>追加レベル</label>
                    </div>
                    <button class="small round border" onclick="App.modals.skillDetail.openAddMembers()">
                        <i>person_add</i>
                        <span>メンバー追加</span>
                    </button>
                </div>
                <div id="skill-detail-members-list"></div>
            </div>

            <div class="s12 m3 background small-round padding">
                <div class="bottom-margin">
                    <button class="no-margin responsive large fill round max" onclick="App.modals.skillDetail.openNewComment()">
                        <i>add_comment</i>
                        <span>コメントを作成</span>
                    </button>
                </div>
                <div class="scroll medium-height" id="skill-comments-list"></div>
            </div>
        </div>

        <nav class="small-padding no-margin">
            <div class="max"></div>
            <button class="border large round" onclick="App.modals.skillDetail.close()">閉じる</button>
            <button id="skill-detail-save-btn" class="primary large round" onclick="App.modals.skillDetail.save()">保存</button>
        </nav>
</dialog>
