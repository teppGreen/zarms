<script>
    (function () {
        App.modals.memberDetail = {
            currentId: null,
            currentItem: null,
            originalData: null,
            isDirty: false,
            quill: null,
            // 一時保存用: 所属組織とスキルの変更を保存するまで保持
            pendingDirectoryChanges: { toAdd: [], toRemove: [], toUpdate: [] },
            pendingSkillChanges: { toAdd: [], toRemove: [], toUpdate: [] },
            originalDirectories: [],
            originalSkills: [],

            open: function (memberId) {
                if (!memberId) return;

                const member = (App.state.data.members || []).find(function (m) { return m.id === memberId; });
                if (!member) {
                    console.error('[MemberDetail] Member not found:', memberId);
                    return;
                }

                this.currentId = memberId;
                this.currentItem = Object.assign({}, member);
                this.originalData = Object.assign({}, member);
                this.isDirty = false;

                // 一時保存用データをリセット
                this.pendingDirectoryChanges = { toAdd: [], toRemove: [], toUpdate: [] };
                this.pendingSkillChanges = { toAdd: [], toRemove: [], toUpdate: [] };
                
                // 現在の所属・スキルを取得して保持
                const assignments = App.state.data.directoryAssignments || [];
                const skillAssignments = App.state.data.skillAssignments || [];
                this.originalDirectories = assignments
                    .filter(function (a) { return a.member_id === memberId && a.is_active !== false; })
                    .map(function (a) { return Object.assign({}, a); });
                this.originalSkills = skillAssignments
                    .filter(function (a) { return a.member_id === memberId; })
                    .map(function (a) { return Object.assign({}, a); });

                if (!this.quill) {
                    this.quill = App.utils.quill.init('#member-description-editor', {
                        placeholder: 'プロフィール説明を入力...'
                    });
                }

                ui('#modal-detail-member', true);

                this._render(member);
                this._renderDirectories(memberId);
                this._renderSkills(memberId);
                this.loadComments(memberId);
                this.switchTab(document.querySelector('#member-detail-tabs > a'), 'profile');
                this._bindEscClose();
            },

            close: function (skipDirtyCheck, closeReason) {
                if (!skipDirtyCheck && this.isDirty) {
                    const message = closeReason === 'escape'
                        ? '未保存の変更があります。変更を破棄して閉じますか？'
                        : '変更を破棄して閉じますか？';
                    if (!confirm(message)) return false;
                }
                closeModal('modal-detail-member');
                this._reset();
                return true;
            },

            discard: function () {
                if (this.isDirty) {
                    if (!confirm('変更を破棄しますか？')) return;
                }
                closeModal('modal-detail-member');
                this._reset();
            },

            save: async function () {
                const id = this.currentId;
                if (!id) return;

                const errorEl = document.getElementById('member-detail-error');
                const newName = (document.getElementById('member-detail-name-input')?.value || '').trim();
                const nameYomi = (document.getElementById('member-detail-name-yomi-input')?.value || '').trim();
                const displayNameInput = (document.getElementById('member-detail-display-name-input')?.value || '').trim();
                const displayName = displayNameInput || newName;
                const displayNameYomi = (document.getElementById('member-detail-display-name-yomi-input')?.value || '').trim();
                const currentEmail = (document.getElementById('member-detail-email-input')?.value || '').trim();
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const yomiPattern = /^[ァ-ヶー\s　]+$/;

                if (!newName) {
                    if (errorEl) { errorEl.textContent = '氏名は必須です'; errorEl.style.display = ''; }
                    return;
                }
                if (newName.length > 80) {
                    if (errorEl) { errorEl.textContent = '氏名は80文字以内で入力してください'; errorEl.style.display = ''; }
                    return;
                }
                if (!currentEmail) {
                    if (errorEl) { errorEl.textContent = 'メールアドレスは必須です'; errorEl.style.display = ''; }
                    return;
                }
                if (!emailPattern.test(currentEmail)) {
                    if (errorEl) { errorEl.textContent = 'メールアドレスの形式が正しくありません'; errorEl.style.display = ''; }
                    return;
                }
                if (displayName.length > 80) {
                    if (errorEl) { errorEl.textContent = '表示名は80文字以内で入力してください'; errorEl.style.display = ''; }
                    return;
                }
                if (nameYomi && (!yomiPattern.test(nameYomi) || nameYomi.length > 80)) {
                    if (errorEl) { errorEl.textContent = '氏名ヨミはカタカナ80文字以内で入力してください'; errorEl.style.display = ''; }
                    return;
                }
                if (displayNameYomi && (!yomiPattern.test(displayNameYomi) || displayNameYomi.length > 80)) {
                    if (errorEl) { errorEl.textContent = '表示名ヨミはカタカナ80文字以内で入力してください'; errorEl.style.display = ''; }
                    return;
                }

                const urlFields = [
                    { id: 'member-detail-website-url-input', label: 'ウェブサイトURL' },
                    { id: 'member-detail-slack-url-input', label: 'SlackプロフィールURL' },
                    { id: 'member-detail-photo-file-url-input', label: 'プロフィール写真GファイルURL' },
                    { id: 'member-detail-photo-url-input', label: 'プロフィール写真URL' }
                ];
                for (let i = 0; i < urlFields.length; i += 1) {
                    const field = urlFields[i];
                    const value = (document.getElementById(field.id)?.value || '').trim();
                    if (!value) continue;
                    try {
                        const parsed = new URL(value);
                        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
                            throw new Error('invalid protocol');
                        }
                    } catch (e) {
                        if (errorEl) { errorEl.textContent = field.label + ' の形式が正しくありません'; errorEl.style.display = ''; }
                        return;
                    }
                }

                if (errorEl) errorEl.style.display = 'none';

                const updates = {
                    name: newName,
                    display_name: displayName,
                    email: currentEmail,
                    name_yomi: nameYomi || null,
                    display_name_yomi: displayNameYomi || null,
                    phone_number: (document.getElementById('member-detail-phone-number-input')?.value || '').trim() || null,
                    birthday: (document.getElementById('member-detail-birthday-input')?.value || '').trim() || null,
                    title: (document.getElementById('member-detail-title-input')?.value || '').trim() || null,
                    website_url: (document.getElementById('member-detail-website-url-input')?.value || '').trim() || null,
                    description: App.utils.quill.getContent(this.quill) || null,
                    slack_profile_url: (document.getElementById('member-detail-slack-url-input')?.value || '').trim() || null,
                    profile_photo_file_url: (document.getElementById('member-detail-photo-file-url-input')?.value || '').trim() || null,
                    profile_photo_url: (document.getElementById('member-detail-photo-url-input')?.value || '').trim() || null,
                    system_role_key: (document.getElementById('member-detail-system-role-key-input')?.value || '').trim() || null,
                    is_active: document.getElementById('member-detail-is-active-input')?.checked !== false,
                    remark: (document.getElementById('member-detail-remark-input')?.value || '').trim() || null
                };

                const orig = this.originalData || {};
                let hasChanges = false;
                for (const key of Object.keys(updates)) {
                    if (String(updates[key] ?? '') !== String(orig[key] ?? '')) {
                        hasChanges = true;
                        break;
                    }
                }

                // 所属組織・スキルの変更があるかチェック
                const hasDirectoryChanges = this.pendingDirectoryChanges.toAdd.length > 0 ||
                    this.pendingDirectoryChanges.toRemove.length > 0 ||
                    this.pendingDirectoryChanges.toUpdate.length > 0;
                const hasSkillChanges = this.pendingSkillChanges.toAdd.length > 0 ||
                    this.pendingSkillChanges.toRemove.length > 0 ||
                    this.pendingSkillChanges.toUpdate.length > 0;

                if (!hasChanges && !hasDirectoryChanges && !hasSkillChanges) {
                    this.isDirty = false;
                    closeModal('modal-detail-member');
                    this._reset();
                    return;
                }

                Object.assign(this.currentItem, updates);
                const memberInState = (App.state.data.members || []).find(function (m) { return m.id === id; });
                if (memberInState) Object.assign(memberInState, updates);

                this.isDirty = false;
                closeModal('modal-detail-member');
                showSnackbar('変更を保存しています...', 'info', 'top', 0);

                try {
                    // メンバー基本情報の更新
                    if (hasChanges) {
                        await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.MEMBERS, 'update', {
                            where: { id: ['=', id] },
                            set: updates
                        }, 'メンバーを更新');
                    }

                    // 所属組織の変更を保存
                    if (hasDirectoryChanges) {
                        await this._saveDirectoryChanges(id);
                    }

                    // スキルの変更を保存
                    if (hasSkillChanges) {
                        await this._saveSkillChanges(id);
                    }

                    showSnackbar('変更を保存しました', 'success');
                    if (App.pages.members && App.pages.members.loadData) {
                        App.pages.members.loadData(true);
                    }
                } catch (err) {
                    console.error('[MemberDetail] 保存エラー:', err);
                    if (memberInState) Object.assign(memberInState, orig);
                    showSnackbar('保存に失敗しました', 'error');
                }

                this._reset();
            },

            copyField: async function (fieldId, mode) {
                const text = this._buildCopyText(fieldId, mode);
                if (!text) {
                    showSnackbar('コピー対象の値がありません', 'error');
                    return;
                }

                try {
                    await this._copyToClipboard(text);
                    showSnackbar('コピーしました', 'success');
                } catch (err) {
                    console.error('[MemberDetail] コピーエラー:', err);
                    showSnackbar('コピーに失敗しました', 'error');
                }
            },

            _buildCopyText: function (fieldId, mode) {
                const value = (document.getElementById(fieldId)?.value || '').trim();
                if (!value && mode !== 'email') return '';

                if (mode === 'email') {
                    const email = (document.getElementById('member-detail-email-input')?.value || '').trim();
                    if (!email) return '';
                    const displayName = (document.getElementById('member-detail-display-name-input')?.value || '').trim();
                    const name = (document.getElementById('member-detail-name-input')?.value || '').trim();
                    const title = displayName || name;
                    if (!title) return '<' + email + '>';
                    return title + '(' + name + ') <' + email + '>';
                }

                if (mode === 'slackTail') {
                    return this._extractSlackProfileTail(value);
                }

                return value;
            },

            _copyToClipboard: function (text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text);
                }
                return Promise.reject(new Error('Clipboard API is not available'));
            },

            switchTab: function (el, tabName) {
                const tabs = document.querySelectorAll('#member-detail-tabs > a');
                tabs.forEach(function (a) { a.className = ''; });
                if (el) el.className = 'active';

                const profileTab = document.getElementById('member-detail-tab-profile');
                const directoriesTab = document.getElementById('member-detail-tab-directories');
                const skillsTab = document.getElementById('member-detail-tab-skills');

                if (profileTab) profileTab.className = tabName === 'profile' ? 'page medium-height active' : 'page medium-height';
                if (directoriesTab) directoriesTab.className = tabName === 'directories' ? 'page medium-height active scroll' : 'page medium-height scroll';
                if (skillsTab) skillsTab.className = tabName === 'skills' ? 'page medium-height active scroll' : 'page medium-height scroll';
            },

            openNewComment: function () {
                if (!this.currentId) return;
                if (!App.modals.newComment) return;

                if (App.modals.newComment.openFor) {
                    App.modals.newComment.openFor('members', this.currentId);
                    return;
                }

                App.modals.newComment.open(this.currentId);
            },

            openAddDirectory: function () {
                if (!this.currentId) return;
                if (!App.modals.selectDirectories || !App.modals.selectDirectories.open) return;

                const memberId = this.currentId;
                const preSelected = (App.state.data.directoryAssignments || [])
                    .filter(function (a) { return a.member_id === memberId && a.is_active !== false; })
                    .map(function (a) { return a.directory_id; });

                App.modals.selectDirectories.open({
                    multiSelect: true,
                    preSelected: preSelected,
                    callback: function (selectedIds) {
                        App.modals.memberDetail.applyDirectorySelection(memberId, selectedIds);
                    }
                });
            },

            applyDirectorySelection: function (memberId, selectedIds) {
                if (!memberId) return;
                if (!selectedIds || selectedIds.length === 0) return;

                const self = this;
                
                // 一時保存リストに追加（即座にDBに反映しない）
                selectedIds.forEach(function (directoryId) {
                    // 既に追加予定リストにあるかチェック
                    const alreadyPending = self.pendingDirectoryChanges.toAdd.find(function (d) {
                        return d.directory_id === directoryId;
                    });
                    if (alreadyPending) return;

                    // 削除予定リストから除外
                    self.pendingDirectoryChanges.toRemove = self.pendingDirectoryChanges.toRemove.filter(function (id) {
                        return id !== directoryId;
                    });

                    // 既存の割り当てかチェック
                    const existing = self.originalDirectories.find(function (d) {
                        return d.directory_id === directoryId;
                    });

                    if (!existing) {
                        // 新規追加
                        self.pendingDirectoryChanges.toAdd.push({
                            member_id: memberId,
                            directory_id: directoryId,
                            is_active: true,
                            role: null
                        });
                    }
                });

                this.isDirty = true;
                this._renderDirectories(memberId);
                showSnackbar('所属組織を追加しました（保存ボタンで確定）', 'info');
            },

            deactivateDirectoryAssignment: function (assignmentId, directoryId) {
                if (!directoryId) return;
                if (!confirm('所属組織を解除しますか？')) return;

                // 追加予定リストから削除
                this.pendingDirectoryChanges.toAdd = this.pendingDirectoryChanges.toAdd.filter(function (d) {
                    return d.directory_id !== directoryId;
                });

                // 削除予定リストに追加（既存のものの場合のみ）
                const existing = this.originalDirectories.find(function (d) {
                    return d.directory_id === directoryId;
                });
                if (existing && !this.pendingDirectoryChanges.toRemove.includes(directoryId)) {
                    this.pendingDirectoryChanges.toRemove.push(directoryId);
                }

                this.isDirty = true;
                this._renderDirectories(this.currentId);
                showSnackbar('所属組織を解除しました（保存ボタンで確定）', 'info');
            },

            updateDirectoryRole: function (assignmentId, directoryId, roleValue) {
                if (!directoryId) return;

                const normalizedRole = (roleValue || '').trim() || null;

                // 追加予定リスト内で更新
                const pending = this.pendingDirectoryChanges.toAdd.find(function (d) {
                    return d.directory_id === directoryId;
                });
                if (pending) {
                    pending.role = normalizedRole;
                    this.isDirty = true;
                    return;
                }

                // 更新予定リストに追加
                const updateIndex = this.pendingDirectoryChanges.toUpdate.findIndex(function (u) {
                    return u.directory_id === directoryId;
                });
                if (updateIndex >= 0) {
                    this.pendingDirectoryChanges.toUpdate[updateIndex].role = normalizedRole;
                } else {
                    const existing = this.originalDirectories.find(function (d) {
                        return d.directory_id === directoryId;
                    });
                    if (existing && existing.role !== normalizedRole) {
                        this.pendingDirectoryChanges.toUpdate.push({
                            id: existing.id,
                            directory_id: directoryId,
                            role: normalizedRole
                        });
                    }
                }

                this.isDirty = true;
                showSnackbar('役割を変更しました（保存ボタンで確定）', 'info');
            },

            openAddSkill: function () {
                if (!this.currentId) return;
                if (!App.modals.selectSkills || !App.modals.selectSkills.open) return;

                const memberId = this.currentId;
                const preSelected = (App.state.data.skillAssignments || [])
                    .filter(function (a) { return a.member_id === memberId; })
                    .map(function (a) { return a.skill_id; });

                App.modals.selectSkills.open({
                    multiSelect: true,
                    preSelected: preSelected,
                    defaultLevel: 'BEGINNER',
                    callback: function (result) {
                        App.modals.memberDetail.applySkillSelection(memberId, result.selectedIds, result.levelKey);
                    }
                });
            },

            applySkillSelection: function (memberId, selectedIds, levelKey) {
                if (!memberId) return;
                if (!selectedIds || selectedIds.length === 0) return;

                const self = this;
                const level = levelKey || 'BEGINNER';

                // 一時保存リストに追加
                selectedIds.forEach(function (skillId) {
                    const alreadyPending = self.pendingSkillChanges.toAdd.find(function (s) {
                        return s.skill_id === skillId;
                    });
                    if (alreadyPending) return;

                    // 削除予定リストから除外
                    self.pendingSkillChanges.toRemove = self.pendingSkillChanges.toRemove.filter(function (id) {
                        return id !== skillId;
                    });

                    // 既存のスキルかチェック
                    const existing = self.originalSkills.find(function (s) {
                        return s.skill_id === skillId;
                    });

                    if (!existing) {
                        // 新規追加
                        self.pendingSkillChanges.toAdd.push({
                            member_id: memberId,
                            skill_id: skillId,
                            skill_level_key: level,
                            remark: null
                        });
                    } else if (existing.skill_level_key !== level) {
                        // レベル更新
                        const updateIndex = self.pendingSkillChanges.toUpdate.findIndex(function (u) {
                            return u.skill_id === skillId;
                        });
                        if (updateIndex >= 0) {
                            self.pendingSkillChanges.toUpdate[updateIndex].skill_level_key = level;
                        } else {
                            self.pendingSkillChanges.toUpdate.push({
                                id: existing.id,
                                skill_id: skillId,
                                skill_level_key: level,
                                remark: existing.remark
                            });
                        }
                    }
                });

                this.isDirty = true;
                this._renderSkills(memberId);
                showSnackbar('スキルを追加しました（保存ボタンで確定）', 'info');
            },

            removeSkillAssignment: function (assignmentId, skillId) {
                if (!skillId) return;
                if (!confirm('スキルを削除しますか？')) return;

                // 追加予定リストから削除
                this.pendingSkillChanges.toAdd = this.pendingSkillChanges.toAdd.filter(function (s) {
                    return s.skill_id !== skillId;
                });

                // 削除予定リストに追加（既存のものの場合のみ）
                const existing = this.originalSkills.find(function (s) {
                    return s.skill_id === skillId;
                });
                if (existing && !this.pendingSkillChanges.toRemove.includes(skillId)) {
                    this.pendingSkillChanges.toRemove.push(skillId);
                }

                this.isDirty = true;
                this._renderSkills(this.currentId);
                showSnackbar('スキルを削除しました（保存ボタンで確定）', 'info');
            },

            updateSkillLevel: function (assignmentId, skillId, levelKey) {
                if (!skillId) return;

                // 追加予定リスト内で更新
                const pending = this.pendingSkillChanges.toAdd.find(function (s) {
                    return s.skill_id === skillId;
                });
                if (pending) {
                    pending.skill_level_key = levelKey;
                    this.isDirty = true;
                    return;
                }

                // 更新予定リストに追加
                const updateIndex = this.pendingSkillChanges.toUpdate.findIndex(function (u) {
                    return u.skill_id === skillId;
                });
                if (updateIndex >= 0) {
                    this.pendingSkillChanges.toUpdate[updateIndex].skill_level_key = levelKey;
                } else {
                    const existing = this.originalSkills.find(function (s) {
                        return s.skill_id === skillId;
                    });
                    if (existing && existing.skill_level_key !== levelKey) {
                        this.pendingSkillChanges.toUpdate.push({
                            id: existing.id,
                            skill_id: skillId,
                            skill_level_key: levelKey,
                            remark: existing.remark
                        });
                    }
                }

                this.isDirty = true;
                this._renderSkills(this.currentId);
                showSnackbar('スキルレベルを変更しました（保存ボタンで確定）', 'info');
            },

            updateSkillRemark: function (assignmentId, skillId, remarkValue) {
                if (!skillId) return;

                const normalizedRemark = (remarkValue || '').trim() || null;

                // 追加予定リスト内で更新
                const pending = this.pendingSkillChanges.toAdd.find(function (s) {
                    return s.skill_id === skillId;
                });
                if (pending) {
                    pending.remark = normalizedRemark;
                    this.isDirty = true;
                    return;
                }

                // 更新予定リストに追加
                const updateIndex = this.pendingSkillChanges.toUpdate.findIndex(function (u) {
                    return u.skill_id === skillId;
                });
                if (updateIndex >= 0) {
                    this.pendingSkillChanges.toUpdate[updateIndex].remark = normalizedRemark;
                } else {
                    const existing = this.originalSkills.find(function (s) {
                        return s.skill_id === skillId;
                    });
                    if (existing && existing.remark !== normalizedRemark) {
                        this.pendingSkillChanges.toUpdate.push({
                            id: existing.id,
                            skill_id: skillId,
                            skill_level_key: existing.skill_level_key,
                            remark: normalizedRemark
                        });
                    }
                }

                this.isDirty = true;
                showSnackbar('備考を変更しました（保存ボタンで確定）', 'info');
            },

            // 保存時に呼ばれる関数: 所属組織の変更をDBに反映
            _saveDirectoryChanges: async function (memberId) {
                const assignments = App.state.data.directoryAssignments || [];

                // 削除
                for (let i = 0; i < this.pendingDirectoryChanges.toRemove.length; i++) {
                    const directoryId = this.pendingDirectoryChanges.toRemove[i];
                    const existing = assignments.find(function (a) {
                        return a.member_id === memberId && a.directory_id === directoryId;
                    });
                    if (existing && existing.id) {
                        await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.DIRECTORY_ASSIGNMENTS, 'update', {
                            where: { id: ['=', existing.id] },
                            set: { is_active: false }
                        }, '所属組織を解除');
                        existing.is_active = false;
                    }
                }

                // 追加
                for (let i = 0; i < this.pendingDirectoryChanges.toAdd.length; i++) {
                    const record = this.pendingDirectoryChanges.toAdd[i];
                    const inserted = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.DIRECTORY_ASSIGNMENTS, 'insert', record, '所属組織を追加');
                    if (inserted && inserted.data && inserted.data.id) {
                        record.id = inserted.data.id;
                        assignments.push(record);
                    }
                }

                // 更新
                for (let i = 0; i < this.pendingDirectoryChanges.toUpdate.length; i++) {
                    const update = this.pendingDirectoryChanges.toUpdate[i];
                    await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.DIRECTORY_ASSIGNMENTS, 'update', {
                        where: { id: ['=', update.id] },
                        set: { role: update.role }
                    }, '組織での役割を更新');
                    const target = assignments.find(function (a) { return a.id === update.id; });
                    if (target) target.role = update.role;
                }
            },

            // 保存時に呼ばれる関数: スキルの変更をDBに反映
            _saveSkillChanges: async function (memberId) {
                const assignments = App.state.data.skillAssignments || [];

                // 削除
                for (let i = 0; i < this.pendingSkillChanges.toRemove.length; i++) {
                    const skillId = this.pendingSkillChanges.toRemove[i];
                    const existing = assignments.find(function (a) {
                        return a.member_id === memberId && a.skill_id === skillId;
                    });
                    if (existing && existing.id) {
                        await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.SKILL_ASSIGNMENTS, 'remove', {
                            where: { id: ['=', existing.id] }
                        }, 'スキルを削除');
                        const index = assignments.findIndex(function (a) { return a.id === existing.id; });
                        if (index >= 0) assignments.splice(index, 1);
                    }
                }

                // 追加
                for (let i = 0; i < this.pendingSkillChanges.toAdd.length; i++) {
                    const record = this.pendingSkillChanges.toAdd[i];
                    const inserted = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.SKILL_ASSIGNMENTS, 'insert', record, 'スキルを追加');
                    if (inserted && inserted.data && inserted.data.id) {
                        record.id = inserted.data.id;
                        assignments.push(record);
                    }
                }

                // 更新
                for (let i = 0; i < this.pendingSkillChanges.toUpdate.length; i++) {
                    const update = this.pendingSkillChanges.toUpdate[i];
                    await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.SKILL_ASSIGNMENTS, 'update', {
                        where: { id: ['=', update.id] },
                        set: {
                            skill_level_key: update.skill_level_key,
                            remark: update.remark
                        }
                    }, 'スキルを更新');
                    const target = assignments.find(function (a) { return a.id === update.id; });
                    if (target) {
                        target.skill_level_key = update.skill_level_key;
                        target.remark = update.remark;
                    }
                }
            },

            loadComments: function (memberId, skipLoadingCache = false) {
                const commentsList = document.getElementById('member-comments-list');
                if (commentsList) {
                    commentsList.innerHTML = '<div class="small-padding center row small-space"><progress class="circle indeterminate small"></progress><span class="small-text">読み込み中</span></div>';
                }

                const query = {
                    where: {
                        related_table: ['=', 'members'],
                        related_id: ['=', memberId]
                    },
                    orderBy: {
                        created_at: 'desc'
                    }
                };

                callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.COMMENTS, 'select', query, null, skipLoadingCache)
                    .then(results => {
                        if (this.currentId !== memberId) return;

                        const comments = results?.data || results || [];
                        this.renderComments(comments);

                        if (results?.isCached) {
                            callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.COMMENTS, 'select', query, null, true)
                                .then(refreshedResults => {
                                    if (this.currentId !== memberId) return;
                                    const refreshedComments = refreshedResults?.data || refreshedResults || [];
                                    this.renderComments(refreshedComments);
                                });
                        }
                    })
                    .catch(error => {
                        console.error('[MemberDetail] コメント読み込みエラー:', error);
                        if (this.currentId === memberId && commentsList) {
                            commentsList.innerHTML = '<p class="error-text padding">コメントの読み込みに失敗しました</p>';
                        }
                    });
            },

            renderComments: function (comments) {
                const container = document.getElementById('member-comments-list');
                if (!container) return;

                if (!comments || comments.length === 0) {
                    container.innerHTML = '<p>コメントはありません</p>';
                    return;
                }

                const members = App.state.data.members || [];

                container.innerHTML = comments.map(function (comment, index) {
                    const creator = members.find(function (m) { return m.id === comment.created_by; });
                    const creatorName = creator ? creator.display_name : '不明';
                    const creatorPhoto = creator ? creator.profile_photo_url : '';
                    const creatorSlackProfileUrl = creator ? creator.slack_profile_url : '#';
                    const createdAt = formatDateTimeForDisplay(comment.created_at, 'MM/dd HH:mm');
                    const hr = index > 0 ? '<hr class="max small-margin">' : '';

                    const creatorIcon = creatorPhoto
                        ? '<img src="' + creatorPhoto + '" alt="' + escapeHtml(creatorName) + '" class="circle tiny">'
                        : '<i class="tiny">account_circle</i>';

                    return '' +
                        hr +
                        '<div class="small-padding">' +
                        '<div class="row tiny-space">' +
                        '<a href="' + escapeHtml(creatorSlackProfileUrl) + '" target="_blank">' + creatorIcon + '<\/a>' +
                        '<div class="max row tiny-space">' +
                        '<span class="bold small-text">' + escapeHtml(creatorName) + '<\/span>' +
                        '<span class="small-text secondary-text">' + createdAt + '<\/span>' +
                        '<\/div>' +
                        '<\/div>' +
                        '<div class="tiny-space"><\/div>' +
                        '<p class="small-text no-margin tiny-line">' + escapeHtmlWithLineBreaks(comment.content) + '<\/p>' +
                        '<\/div>';
                }).join('');
            },

            // コメントを即座にUIに追加（Optimistic UI Update）
            appendCommentToUI: function (comment) {
                const container = document.getElementById('member-comments-list');
                if (!container) return;

                const members = App.state.data.members || [];
                const creator = members.find(function (m) { return m.id === comment.created_by; });
                const creatorName = creator ? creator.display_name : '不明';
                const creatorPhoto = creator ? creator.profile_photo_url : '';
                const creatorSlackProfileUrl = creator ? creator.slack_profile_url : '#';
                const createdAt = formatDateTimeForDisplay(comment.created_at, 'MM/dd HH:mm');

                const creatorIcon = creatorPhoto
                    ? '<img src="' + creatorPhoto + '" alt="' + escapeHtml(creatorName) + '" class="circle tiny">'
                    : '<i class="tiny">account_circle</i>';

                const newCommentHtml = '<div class="small-padding">' +
                    '<div class="row tiny-space">' +
                    '<a href="' + escapeHtml(creatorSlackProfileUrl) + '" target="_blank">' + creatorIcon + '<\/a>' +
                    '<div class="max row tiny-space">' +
                    '<span class="bold small-text">' + escapeHtml(creatorName) + '<\/span>' +
                    '<span class="small-text secondary-text">' + createdAt + '<\/span>' +
                    '<\/div>' +
                    '<\/div>' +
                    '<div class="tiny-space"><\/div>' +
                    '<p class="small-text no-margin tiny-line">' + escapeHtmlWithLineBreaks(comment.content) + '<\/p>' +
                    '<\/div>';

                // 既存のコメントがある場合は先頭に追加、無い場合は置き換え
                if (container.innerHTML.indexOf('コメントはありません') >= 0) {
                    container.innerHTML = newCommentHtml;
                } else {
                    container.innerHTML = newCommentHtml + '<hr class="max small-margin">' + container.innerHTML;
                }
            },

            _render: function (member) {
                const statusChip = document.getElementById('member-detail-status-chip');
                if (statusChip) {
                    if (member.is_active === false) {
                        statusChip.textContent = '退籍';
                        statusChip.className = 'chip small border';
                    } else {
                        statusChip.textContent = '在籍';
                        statusChip.className = 'chip small primary';
                    }
                }

                const setVal = function (id, val) {
                    var el = document.getElementById(id);
                    if (el) el.value = val || '';
                };

                var members = App.state.data.members || [];
                var findDisplayName = function (memberId) {
                    if (!memberId) return '';
                    var found = members.find(function (item) { return item.id === memberId; });
                    return found ? (found.display_name || found.name || found.email || '') : '不明';
                };

                setVal('member-detail-name-input', member.name);
                setVal('member-detail-display-name-input', member.display_name);
                setVal('member-detail-email-input', member.email);
                setVal('member-detail-name-yomi-input', member.name_yomi);
                setVal('member-detail-display-name-yomi-input', member.display_name_yomi);
                setVal('member-detail-phone-number-input', member.phone_number);
                setVal('member-detail-birthday-input', member.birthday);
                setVal('member-detail-title-input', member.title);
                setVal('member-detail-website-url-input', member.website_url);
                setVal('member-detail-slack-url-input', member.slack_profile_url);
                setVal('member-detail-slack-tail-input', this._extractSlackProfileTail(member.slack_profile_url));
                setVal('member-detail-photo-file-url-input', member.profile_photo_file_url);
                setVal('member-detail-photo-url-input', member.profile_photo_url);
                setVal('member-detail-system-role-key-input', member.system_role_key);
                setVal('member-detail-remark-input', member.remark);
                setVal('member-detail-created-by-input', findDisplayName(member.created_by));
                setVal('member-detail-created-at-input', member.created_at ? formatDateTimeForDisplay(member.created_at) : '');
                setVal('member-detail-updated-by-input', findDisplayName(member.updated_by));
                setVal('member-detail-updated-at-input', member.updated_at ? formatDateTimeForDisplay(member.updated_at) : '');

                if (this.quill) {
                    App.utils.quill.setContent(this.quill, member.description || '');
                }

                var cb = document.getElementById('member-detail-is-active-input');
                if (cb) cb.checked = member.is_active !== false;

                var lastUpdatedEl = document.getElementById('member-detail-last-updated');
                if (lastUpdatedEl) {
                    if (member.updated_at) {
                        var updatedByMember = (App.state.data.members || []).find(function (m) { return m.id === member.updated_by; });
                        var updatedByName = updatedByMember ? updatedByMember.display_name : '';
                        lastUpdatedEl.innerHTML = `<i>update</i><span>${formatDateTimeForDisplay(member.updated_at, 'MM/dd(E) HH:mm') || ''}<span>${updatedByName || ''}</span></span>`;
                    } else {
                        lastUpdatedEl.innerHTML = '';
                    }
                }

                var errorEl = document.getElementById('member-detail-error');
                if (errorEl) errorEl.style.display = 'none';

                this._setupDirtyWatchers();
                this.isDirty = false;
            },

            _setupDirtyWatchers: function () {
                var self = this;
                var watchIds = [
                    'member-detail-name-input',
                    'member-detail-display-name-input',
                    'member-detail-name-yomi-input',
                    'member-detail-display-name-yomi-input',
                    'member-detail-email-input',
                    'member-detail-phone-number-input',
                    'member-detail-birthday-input',
                    'member-detail-title-input',
                    'member-detail-website-url-input',
                    'member-detail-slack-url-input',
                    'member-detail-photo-file-url-input',
                    'member-detail-photo-url-input',
                    'member-detail-system-role-key-input',
                    'member-detail-remark-input',
                    'member-detail-is-active-input'
                ];

                watchIds.forEach(function (wid) {
                    var el = document.getElementById(wid);
                    if (!el || el.dataset.memberDetailBound === '1') return;
                    el.addEventListener('input', function () { self.isDirty = true; });
                    el.addEventListener('change', function () { self.isDirty = true; });
                    el.dataset.memberDetailBound = '1';
                });

                var slackInput = document.getElementById('member-detail-slack-url-input');
                if (slackInput && slackInput.dataset.memberDetailSlackTailBound !== '1') {
                    const updateTail = function () {
                        const tailEl = document.getElementById('member-detail-slack-tail-input');
                        if (!tailEl) return;
                        tailEl.value = self._extractSlackProfileTail(slackInput.value || '');
                    };
                    slackInput.addEventListener('input', updateTail);
                    slackInput.addEventListener('change', updateTail);
                    slackInput.dataset.memberDetailSlackTailBound = '1';
                }

                if (this.quill && this.quill.__memberDetailDirtyBound !== true) {
                    this.quill.on('text-change', function () {
                        self.isDirty = true;
                    });
                    this.quill.__memberDetailDirtyBound = true;
                }
            },

            _renderDirectories: function (memberId) {
                var container = document.getElementById('member-detail-directories-list');
                if (!container) return;

                var self = this;
                var directories = App.state.data.directories || [];
                
                // 現在表示すべき所属組織を計算（一時保存の変更を反映）
                var currentDirectories = [];
                
                // 既存の所属から開始
                this.originalDirectories.forEach(function (orig) {
                    // 削除予定リストに無ければ追加
                    if (!self.pendingDirectoryChanges.toRemove.includes(orig.directory_id)) {
                        var dir = Object.assign({}, orig);
                        // 更新があれば反映
                        var update = self.pendingDirectoryChanges.toUpdate.find(function (u) {
                            return u.directory_id === orig.directory_id;
                        });
                        if (update) {
                            dir.role = update.role;
                        }
                        currentDirectories.push(dir);
                    }
                });
                
                // 新規追加分を追加
                this.pendingDirectoryChanges.toAdd.forEach(function (add) {
                    currentDirectories.push(add);
                });

                if (currentDirectories.length === 0) {
                    container.innerHTML = '<p class="secondary-text padding">所属組織はありません</p>';
                    return;
                }

                container.innerHTML = currentDirectories.map(function (a) {
                    var dir = directories.find(function (d) { return d.id === a.directory_id; });
                    var dirName = dir ? dir.name : '（削除済み組織）';
                    var role = a.role || '';
                    var isActive = a.is_active !== false;
                    var actionBtn = '<button class="small round border" onclick="App.modals.memberDetail.deactivateDirectoryAssignment(\'' + escapeHtmlAttribute(a.id || '') + '\', \'' + escapeHtmlAttribute(a.directory_id) + '\')">解除<\/button>';
                    return '<div class="row padding small-space">' +
                        '<i>account_tree</i>' +
                        '<div class="max">' +
                        '<p class="no-margin bold small">' + escapeHtml(dirName) + '<\/p>' +
                        '<div class="field border label small top-margin no-margin">' +
                        '<input type="text" placeholder=" " value="' + escapeHtmlAttribute(role) + '" onchange="App.modals.memberDetail.updateDirectoryRole(\'' + escapeHtmlAttribute(a.id || '') + '\', \'' + escapeHtmlAttribute(a.directory_id) + '\', this.value)">' +
                        '<label>役割</label>' +
                        '<\/div>' +
                        '<\/div>' +
                        (!isActive ? '<span class="chip small border">退任済</span>' : actionBtn) +
                        '<\/div>';
                }).join('<hr class="small-margin">');
            },

            _renderSkills: function (memberId) {
                var container = document.getElementById('member-detail-skills-list');
                if (!container) return;

                var self = this;
                var skills = App.state.data.skills || [];
                
                // 現在表示すべきスキルを計算（一時保存の変更を反映）
                var currentSkills = [];
                
                // 既存のスキルから開始
                this.originalSkills.forEach(function (orig) {
                    // 削除予定リストに無ければ追加
                    if (!self.pendingSkillChanges.toRemove.includes(orig.skill_id)) {
                        var sk = Object.assign({}, orig);
                        // 更新があれば反映
                        var update = self.pendingSkillChanges.toUpdate.find(function (u) {
                            return u.skill_id === orig.skill_id;
                        });
                        if (update) {
                            sk.skill_level_key = update.skill_level_key;
                            sk.remark = update.remark;
                        }
                        currentSkills.push(sk);
                    }
                });
                
                // 新規追加分を追加
                this.pendingSkillChanges.toAdd.forEach(function (add) {
                    currentSkills.push(add);
                });

                if (currentSkills.length === 0) {
                    container.innerHTML = '<p class="secondary-text padding">スキル情報はありません</p>';
                    return;
                }

                var levelLabels = {
                    BEGINNER: '初級',
                    INTERMEDIATE: '中級',
                    ADVANCED: '上級',
                    EXPERT: 'エキスパート'
                };

                const levelOptions = function (current) {
                    return Object.keys(levelLabels).map(function (key) {
                        const selected = current === key ? ' selected' : '';
                        return '<option value="' + key + '"' + selected + '>' + levelLabels[key] + '<\/option>';
                    }).join('');
                };

                container.innerHTML = currentSkills.map(function (sa) {
                    var skill = skills.find(function (s) { return s.id === sa.skill_id; });
                    var skillName = skill ? skill.title : '（削除済みスキル）';
                    var level = levelLabels[sa.skill_level_key] || sa.skill_level_key || '';
                    var remark = sa.remark || '';
                    var levelSelect = '<select class="small" onchange="App.modals.memberDetail.updateSkillLevel(\'' + escapeHtmlAttribute(sa.id || '') + '\', \'' + escapeHtmlAttribute(sa.skill_id) + '\', this.value)">' + levelOptions(sa.skill_level_key) + '<\/select>';
                    var remarkInput = '<input type="text" placeholder="備考" value="' + escapeHtmlAttribute(remark) + '" onchange="App.modals.memberDetail.updateSkillRemark(\'' + escapeHtmlAttribute(sa.id || '') + '\', \'' + escapeHtmlAttribute(sa.skill_id) + '\', this.value)">';
                    var deleteBtn = '<button class="circle small transparent" onclick="App.modals.memberDetail.removeSkillAssignment(\'' + escapeHtmlAttribute(sa.id || '') + '\', \'' + escapeHtmlAttribute(sa.skill_id) + '\')"><i>delete</i><\/button>';
                    return '<div class="row padding small-space">' +
                        '<i>psychology</i>' +
                        '<div class="max">' +
                        '<p class="no-margin bold small">' + escapeHtml(skillName) + '<\/p>' +
                        '<div class="row small-space top-margin">' +
                        levelSelect +
                        '<div class="field border small max no-margin">' + remarkInput + '<\/div>' +
                        '<\/div>' +
                        '<\/div>' +
                        deleteBtn +
                        '<\/div>';
                }).join('<hr class="small-margin">');
            },
                        : '<span class="small-text secondary-text">-<\/span>';
                    var removeBtn = sa.id
                        ? '<button class="small round border" onclick="App.modals.memberDetail.removeSkillAssignment(\'' + sa.id + '\')">解除<\/button>'
                        : '';
                    return '<div class="row padding small-space">' +
                        '<i>psychology</i>' +
                        '<div class="max">' +
                        '<p class="no-margin bold small">' + escapeHtml(skillName) + '<\/p>' +
                        (level ? '<p class="no-margin small-text secondary-text">' + escapeHtml(level) + '<\/p>' : '') +
                        '<div class="field border label small top-margin no-margin">' +
                        '<input type="text" placeholder=" " value="' + escapeHtmlAttribute(remark) + '" onchange="App.modals.memberDetail.updateSkillRemark(\'' + escapeHtmlAttribute(sa.id || '') + '\', this.value)">' +
                        '<label>備考</label>' +
                        '<\/div>' +
                        '<\/div>' +
                        '<div class="row tiny-space">' + levelSelect + removeBtn + '<\/div>' +
                        '<\/div>';
                }).join('<hr class="small-margin">');
            },

            _reset: function () {
                this.currentId = null;
                this.currentItem = null;
                this.originalData = null;
                this.isDirty = false;

                var fields = [
                    'member-detail-name-input',
                    'member-detail-display-name-input',
                    'member-detail-email-input',
                    'member-detail-name-yomi-input',
                    'member-detail-display-name-yomi-input',
                    'member-detail-phone-number-input',
                    'member-detail-birthday-input',
                    'member-detail-title-input',
                    'member-detail-website-url-input',
                    'member-detail-slack-url-input',
                    'member-detail-slack-tail-input',
                    'member-detail-photo-file-url-input',
                    'member-detail-photo-url-input',
                    'member-detail-system-role-key-input',
                    'member-detail-remark-input',
                    'member-detail-created-by-input',
                    'member-detail-created-at-input',
                    'member-detail-updated-by-input',
                    'member-detail-updated-at-input'
                ];
                fields.forEach(function (id) {
                    var el = document.getElementById(id);
                    if (el) el.value = '';
                });

                var statusChip = document.getElementById('member-detail-status-chip');
                if (statusChip) {
                    statusChip.textContent = '';
                    statusChip.className = 'chip small';
                }

                var cb = document.getElementById('member-detail-is-active-input');
                if (cb) cb.checked = true;

                var comments = document.getElementById('member-comments-list');
                if (comments) comments.innerHTML = '';

                if (this.quill) {
                    App.utils.quill.clear(this.quill);
                }

                var profileTabBtn = document.querySelector('#member-detail-tabs > a');
                this.switchTab(profileTabBtn, 'profile');
            },

            _extractSlackProfileTail: function (value) {
                if (!value) return '';
                var normalized = String(value).trim().replace(/\/+$/, '');
                if (!normalized) return '';
                var token = normalized.split(/[\/?#]/).filter(Boolean).pop() || '';
                if (token.length <= 11) return token;
                return token.slice(-11);
            },

            _bindEscClose: function () {
                const dialog = document.getElementById('modal-detail-member');
                if (!dialog || dialog.dataset.memberEscBound === '1') return;
                const self = this;
                dialog.addEventListener('keydown', function (event) {
                    if (!event || event.key !== 'Escape') return;
                    event.preventDefault();
                    event.stopPropagation();
                    self.close(false, 'escape');
                });
                dialog.dataset.memberEscBound = '1';
            }
        };
    })();
</script>
