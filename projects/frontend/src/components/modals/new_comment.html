<!-- 新規コメント作成モーダル -->
 <!-- 将来的には、タスク追加画面単体で動作するようにしたい（タスクを選択する欄を作る） -->
<dialog id="modal-new-comment" class="modal padding no-scroll">
    <nav class="small-padding bottom-margin">
        <h5 class="max bold">新規コメント作成</h5>
        <button class="circle transparent" onclick="App.modals.newComment.close()">
            <i>close</i>
        </button>
    </nav>

    <div class="field no-border background scroll large-width small-round">
        <textarea id="new-comment-content" rows="10" placeholder="コメント内容を入力..."></textarea>
    </div>

    <nav class="right-align small-padding">
        <button class="border" onclick="App.modals.newComment.close()">キャンセル</button>
        <button onclick="App.modals.newComment.save()">作成</button>
    </nav>
</dialog>

<script>
    (function () {
        App.modals.newComment = {
            taskId: null,

            /**
             * 新規コメントモーダルを開く
             * @param {string} taskId - タスクID
             */
            open: function (taskId) {
                // フィールドをクリア
                this.reset();
                this.taskId = taskId;

                // モーダルを開く
                ui('#modal-new-comment');

                // コメント入力欄にフォーカス
                setTimeout(() => {
                    const contentField = document.getElementById('new-comment-content');
                    if (contentField) contentField.focus();
                }, 100);
            },

            /**
             * モーダルを閉じる
             */
            close: function () {
                ui('#modal-new-comment');
                this.reset();
            },

            /**
             * モーダルをリセット
             */
            reset: function () {
                const contentField = document.getElementById('new-comment-content');
                if (contentField) contentField.value = '';
            },

            /**
             * コメントを保存
             */
            save: function () {
                const contentField = document.getElementById('new-comment-content');
                const content = contentField ? contentField.value.trim() : '';

                if (!content) {
                    alert('コメントの内容を入力してください');
                    return;
                }

                this.close();
                showSnackbar('コメントを作成しています...', 'info', 'top', 0);

                // コメントを保存
                callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.COMMENTS, 'insert', {
                    content: content,
                    related_table: 'tasks',
                    related_id: this.taskId
                }, 'コメントを作成')
                    .then(result => {
                        if (!result || (Array.isArray(result) && result.length === 0)) {
                            showSnackbar('コメントの作成に失敗しました', 'error');
                            return;
                        }

                        showSnackbar('コメントを作成しました', 'success');

                        // タスク詳細モーダルが開いていて、同じタスクの場合はコメントリストを再読み込み
                        if (App.modals.taskDetail && App.modals.taskDetail.currentId === this.taskId) {
                            App.modals.taskDetail.loadComments(this.taskId, true);
                        }
                        
                    })
                    .catch(error => {
                        console.error('[NewComment] Save error:', error);
                        App.utils.error.handle(error);
                    });
            }
        };
    })();
</script>
