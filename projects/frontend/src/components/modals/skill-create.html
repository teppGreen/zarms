<!-- 新規スキル作成モーダル -->
<dialog id="modal-new-skill" class="modal medium-width padding">
    <nav class="small-padding bottom-margin">
        <h5 class="max bold">新規スキル登録</h5>
        <button class="circle transparent" onclick="App.modals.newSkill.close()">
            <i>close</i>
        </button>
    </nav>

    <div class="small-padding">
        <div class="field border large label bottom-margin">
            <input placeholder=" " type="text" id="new-skill-title-input">
            <label>タイトル <span class="error-text">*</span></label>
        </div>

        <div class="field border large label bottom-margin">
            <input placeholder=" " type="text" id="new-skill-type-input">
            <label>種別</label>
        </div>

        <div class="field border large label bottom-margin">
            <textarea placeholder=" " id="new-skill-description-input" rows="3"></textarea>
            <label>説明</label>
        </div>

        <div class="field border large label bottom-margin">
            <textarea placeholder=" " id="new-skill-remark-input" rows="2"></textarea>
            <label>備考</label>
        </div>

        <p id="new-skill-error" class="error-text small-text" style="display: none;"></p>

        <nav class="right-align top-margin">
            <button class="border" onclick="App.modals.newSkill.close()">
                <span>キャンセル</span>
            </button>
            <button id="new-skill-create-btn" class="primary" onclick="App.modals.newSkill.create()">
                <i>psychology</i>
                <span>登録する</span>
            </button>
        </nav>
    </div>
</dialog>
