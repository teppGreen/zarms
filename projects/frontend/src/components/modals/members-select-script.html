<script>
    (function () {
        App.modals.selectMembers = {
            callback: null,
            applyAllCallback: null,
            selectedIds: [],
            allMembers: [],
            filteredMembers: [],
            multiSelect: false,
            showApplyAll: false,
            includeSelectionMeta: false,
            roleOptions: [],
            selectedMetaById: {},

            open: async function (options = {}) {
                this.callback = options.callback || null;
                this.applyAllCallback = options.applyAllCallback || null;
                this.multiSelect = options.multiSelect || false;
                this.selectedIds = options.preSelected || [];
                this.showApplyAll = options.showApplyAll || false;
                this.includeSelectionMeta = options.includeSelectionMeta === true;
                this.roleOptions = Array.isArray(options.roleOptions) ? options.roleOptions.slice() : [];
                this.selectedMetaById = Object.assign({}, options.preSelectedMeta || {});

                // 「全担当者に適用」ボタンの表示制御
                const applyAllBtn = document.getElementById('select-members-apply-all-btn');
                if (applyAllBtn) {
                    applyAllBtn.style.display = this.showApplyAll ? '' : 'none';
                }

                // App.state.data.members から直接ロード
                this.allMembers = App.state.data.members || [];
                // Reset filteredMembers
                this.filteredMembers = [];
                this.render();
                await appUi('#modal-select-members',true);

                // 共通処理を使用
                App.utils.modal.focusInput('#member-search-input');
            },

            render: function () {
                this.filterResults();
            },

            filterResults: function () {
                const searchInput = document.getElementById('member-search-input');
                const container = document.getElementById('member-results-container');
                const selectAllContainer = document.getElementById('member-select-all-container');
                const selectAllCheckbox = document.getElementById('member-select-all-checkbox');

                if (!container) return;

                const searchTerm = searchInput ? searchInput.value : '';

                // 共通フィルタリング処理を使用
                this.filteredMembers = App.utils.modal.filterData(
                    this.allMembers,
                    searchTerm,
                    ['display_name', 'email'], // 検索対象フィールド
                    true // activeOnly
                );

                // 全選択チェックボックスの表示制御
                if (this.multiSelect && selectAllContainer) {
                    selectAllContainer.style.display = '';

                    // 全選択状態の更新
                    if (this.filteredMembers.length > 0 && selectAllCheckbox) {
                        const allSelected = this.filteredMembers.every(m => this.selectedIds.includes(m.id));
                        selectAllCheckbox.checked = allSelected;
                        selectAllCheckbox.disabled = false;
                    } else if (selectAllCheckbox) {
                        selectAllCheckbox.checked = false;
                        selectAllCheckbox.disabled = true;
                    }
                } else if (selectAllContainer) {
                    selectAllContainer.style.display = 'none';
                }

                // 表示
                if (this.filteredMembers.length === 0) {
                    container.innerHTML = '<p class="padding">該当する人物が見つかりません</p>';
                    return;
                }

                container.innerHTML = this.filteredMembers.map(member => {
                    const isSelected = this.selectedIds.includes(member.id);
                    const safeDisplayName = escapeHtml(member.display_name || member.email || '名前未設定');
                    const safeId = escapeHtmlAttribute(member.id);
                    const selectedRole = this._getSelectedRole(member.id);
                    const roleSelector = this._buildRoleSelector(member.id, selectedRole, isSelected);

                    return `
                        <div>
                        <label class="${this.multiSelect ? 'checkbox' : 'radio'} left-align small-space">
                            <input type="${this.multiSelect ? 'checkbox' : 'radio'}" 
                                name="member-select" 
                                value="${safeId}" 
                                ${isSelected ? 'checked' : ''}
                                onchange="App.modals.selectMembers.toggleSelection('${safeId}', this.checked)">
                            <span class="small-margin">
                                <strong>${safeDisplayName}</strong>
                            </span>
                        </label>
                        ${roleSelector}
                        </div>
                    `;
                }).join('');
            },

            _getSelectedRole: function (memberId) {
                const meta = this.selectedMetaById && this.selectedMetaById[memberId] ? this.selectedMetaById[memberId] : {};
                const role = meta && typeof meta.role === 'string' ? meta.role.trim() : '';
                return role || '';
            },

            _buildRoleSelector: function (memberId, selectedRole, isSelected) {
                if (!this.includeSelectionMeta || this.roleOptions.length === 0) return '';
                const optionsHtml = ['<option value="">（未設定）</option>'].concat(this.roleOptions.map(function (roleValue) {
                    const safeRole = escapeHtmlAttribute(roleValue);
                    const selectedAttr = roleValue === selectedRole ? ' selected' : '';
                    return '<option value="' + safeRole + '"' + selectedAttr + '>' + escapeHtml(roleValue) + '</option>';
                })).join('');
                const disabledAttr = isSelected ? '' : ' disabled';
                return '<div class="field border label small top-margin no-margin">' +
                    '<select onchange="App.modals.selectMembers.updateSelectionRole(\'' + escapeHtmlAttribute(memberId) + '\', this.value)"' + disabledAttr + '>' +
                    optionsHtml +
                    '</select>' +
                    '<label>役割</label>' +
                    '<i>arrow_drop_down</i>' +
                    '</div>';
            },

            updateSelectionRole: function (memberId, roleValue) {
                if (!memberId) return;
                const normalizedRole = String(roleValue || '').trim();
                if (!this.selectedMetaById[memberId]) {
                    this.selectedMetaById[memberId] = {};
                }
                this.selectedMetaById[memberId].role = normalizedRole || null;
            },

            toggleSelectAll: function (checked) {
                if (!this.multiSelect) return;

                if (checked) {
                    // 表示されているメンバーをすべて選択
                    this.filteredMembers.forEach(member => {
                        if (!this.selectedIds.includes(member.id)) {
                            this.selectedIds.push(member.id);
                        }
                    });
                } else {
                    // 表示されているメンバーの選択を解除
                    const filteredIds = this.filteredMembers.map(m => m.id);
                    this.selectedIds = this.selectedIds.filter(id => !filteredIds.includes(id));
                    filteredIds.forEach((id) => {
                        if (this.selectedMetaById[id]) {
                            this.selectedMetaById[id].role = null;
                        }
                    });
                }
                this.render();
            },

            toggleSelection: function (id, checked) {
                if (this.multiSelect) {
                    if (checked && !this.selectedIds.includes(id)) {
                        this.selectedIds.push(id);
                    } else if (!checked) {
                        this.selectedIds = this.selectedIds.filter(sid => sid !== id);
                        if (this.selectedMetaById[id]) {
                            this.selectedMetaById[id].role = null;
                        }
                    }
                    this.render();
                } else {
                    this.selectedIds = checked ? [id] : [];
                }
            },

            _buildCallbackPayload: function () {
                if (!this.includeSelectionMeta) {
                    return this.selectedIds.slice();
                }
                return this.selectedIds.map((memberId) => {
                    const meta = this.selectedMetaById[memberId] || {};
                    return {
                        member_id: memberId,
                        role: (meta.role || '').trim() || null
                    };
                });
            },

            confirm: function () {
                const payload = this._buildCallbackPayload();

                if (this.callback && typeof this.callback === 'function') {
                    this.callback(payload);
                }

                appUi('#modal-select-members',false);
            },

            confirmAll: function () {
                const payload = this._buildCallbackPayload();

                if (this.applyAllCallback && typeof this.applyAllCallback === 'function') {
                    this.applyAllCallback(payload);
                }

                appUi('#modal-select-members',false);
            }
        };
    })();
</script>
