<dialog id="modal-select-tasks" class="modal padding no-scroll">
    <nav class="small-padding bottom-margin">
        <h5 class="max bold">タスクを選択</h5>
        <button class="circle transparent" onclick="ui('#modal-select-tasks')">
            <i>close</i>
        </button>
    </nav>

    <!-- 検索バー -->
    <div class="field small-round border prefix bottom-margin top-margin">
        <i class="front" onclick="App.modals.selectTasks.searchTasks()">search</i>
        <input type="text" id="task-search-input" placeholder="タスク名を入力してください（部分一致）"
            onkeydown="if(event.key === 'Enter' && !event.isComposing) { event.preventDefault(); App.modals.selectTasks.searchTasks(); }">
    </div>

    <!-- 全選択チェックボックス (複数選択時のみ表示) -->
    <div id="task-select-all-container" class="row left-align margin" style="display: none;">
        <label class="checkbox">
            <input type="checkbox" id="task-select-all-checkbox"
                onchange="App.modals.selectTasks.toggleSelectAll(this.checked)">
            <span>すべて選択</span>
        </label>
    </div>

    <!-- 結果リスト -->
    <article id="task-results-container"
        class="scroll large-width medium-height small-padding small-round extra-line background no-elevate">
        <!-- 動的に生成 -->
    </article>

    <nav class="right-align small-padding">
        <a onclick="App.modals.selectTasks.confirm(true)"><span>選択を解除</span></a>
        <div class="max"></div>
        <button class="border" onclick="ui('#modal-select-tasks')">キャンセル</button>
        <button onclick="App.modals.selectTasks.confirm()">適用</button>
    </nav>
</dialog>

<script>
    (function () {
        App.modals.selectTasks = {
            callback: null,
            selectedIds: [],
            searchResults: [],
            multiSelect: false,
            excludeId: null,
            isLoading: false,

            open: async function (options = {}) {
                this.callback = options.callback || null;
                this.multiSelect = options.multiSelect || false;
                this.excludeId = options.excludeId || null;

                await ui('#modal-select-tasks');
                const input = document.getElementById('task-search-input');

                // Reset select all checkbox visibility
                const selectAllContainer = document.getElementById('task-select-all-container');
                if (selectAllContainer) selectAllContainer.style.display = 'none';

                input.focus();
                input.select();
            },

            searchTasks: async function () {
                const searchInput = document.getElementById('task-search-input');
                const searchTerm = searchInput ? `%${searchInput.value.trim()}%` : '';

                // ローディング表示
                this.isLoading = true;
                this.renderLoading();

                try {
                    // データベース検索を実行
                    const query = {
                        where: {
                            name: ["LIKE", searchTerm]
                        },
                        orderBy: {
                            ['display_id']: 'desc'
                        }
                    };

                    // 除外IDがある場合は条件に追加
                    if (this.excludeId) {
                        query.where.id = ["!=", this.excludeId];
                    }

                    const results = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'select', query, null, true);

                    this.searchResults = results?.data || [];
                    this.renderResults();
                } catch (error) {
                    console.error('タスク検索エラー:', error);
                    this.renderError();
                } finally {
                    this.isLoading = false;
                }
            },

            renderLoading: function () {
                const container = document.getElementById('task-results-container');
                if (!container) return;

                container.innerHTML = `
                    <div class="padding center-align">
                        <progress class="circle"></progress>
                        <p class="small-margin">検索中...</p>
                    </div>
                `;
            },

            renderError: function () {
                const container = document.getElementById('task-results-container');
                if (!container) return;

                container.innerHTML = '<p class="padding">検索中にエラーが発生しました</p>';
            },

            renderResults: function () {
                const container = document.getElementById('task-results-container');
                const selectAllContainer = document.getElementById('task-select-all-container');
                const selectAllCheckbox = document.getElementById('task-select-all-checkbox');

                if (!container) return;

                // 全選択チェックボックスの表示制御
                if (this.multiSelect && selectAllContainer) {
                    selectAllContainer.style.display = '';

                    // 全選択状態の更新
                    if (this.searchResults.length > 0 && selectAllCheckbox) {
                        const allSelected = this.searchResults.every(t => this.selectedIds.includes(t.id));
                        selectAllCheckbox.checked = allSelected;
                        selectAllCheckbox.disabled = false;
                    } else if (selectAllCheckbox) {
                        selectAllCheckbox.checked = false;
                        selectAllCheckbox.disabled = true;
                    }
                } else if (selectAllContainer) {
                    selectAllContainer.style.display = 'none';
                }

                // 検索結果が0件の場合
                if (this.searchResults.length === 0) {
                    container.innerHTML = '<p class="padding">該当するタスクが見つかりません</p>';
                    return;
                }

                // 検索結果を表示
                container.innerHTML = this.searchResults.map(task => {
                    const isSelected = this.selectedIds.includes(task.id);
                    const displayName = escapeHtml(task.name || '無題のタスク');
                    const displayId = task.display_id ? `#${task.display_id}` : '';
                    const safeId = escapeHtmlAttribute(task.id);

                    return `
                        <div><label class="${this.multiSelect ? 'checkbox' : 'radio'} left-align small-space">
                            <input type="${this.multiSelect ? 'checkbox' : 'radio'}" 
                                name="task-select" 
                                value="${safeId}" 
                                ${isSelected ? 'checked' : ''}
                                onchange="App.modals.selectTasks.toggleSelection('${safeId}', this.checked)">
                            <span class="small-margin">
                                <strong>${displayName}</strong>
                                ${displayId ? `<span class="small-text" style="opacity: 0.7;"> ${displayId}</span>` : ''}
                                ${task.parent_task_id ? '<span class="chip tiny secondary">親タスク設定済</span>' : ''}
                            </span>
                        </label></div>
                    `;
                }).join('');
            },

            toggleSelectAll: function (checked) {
                if (!this.multiSelect) return;

                if (checked) {
                    // 表示されているタスクをすべて選択
                    this.searchResults.forEach(task => {
                        if (!this.selectedIds.includes(task.id)) {
                            this.selectedIds.push(task.id);
                        }
                    });
                } else {
                    // 表示されているタスクの選択を解除
                    const searchIds = this.searchResults.map(t => t.id);
                    this.selectedIds = this.selectedIds.filter(id => !searchIds.includes(id));
                }
                this.renderResults();
            },

            toggleSelection: function (id, checked) {
                if (this.multiSelect) {
                    if (checked && !this.selectedIds.includes(id)) {
                        this.selectedIds.push(id);
                    } else if (!checked) {
                        this.selectedIds = this.selectedIds.filter(sid => sid !== id);
                    }
                    this.renderResults();
                } else {
                    this.selectedIds = checked ? [id] : [];
                }
            },

            confirm: function (reset = false) {
                if (reset) {
                    this.callback([]);
                } else {
                    // 選択されたタスクの詳細情報を取得
                    const selectedTasks = this.searchResults.filter(task =>
                        this.selectedIds.includes(task.id)
                    ).map(task => ({
                        id: task.id,
                        name: task.name,
                        display_id: task.display_id,
                        task_status_key: task.task_status_key
                    }));

                    this.callback(selectedTasks);
                }
                ui('#modal-select-tasks');
            }
        };
    })();
</script>
