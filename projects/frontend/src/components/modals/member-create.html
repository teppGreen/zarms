<!-- 新規メンバー作成モーダル -->
<dialog id="modal-new-member" class="modal medium-width padding">
    <nav class="small-padding bottom-margin">
        <h5 class="max bold">新規メンバー登録</h5>
        <button class="circle transparent" onclick="App.modals.newMember.close()">
            <i>close</i>
        </button>
    </nav>

    <div class="small-padding">
        <!-- 氏名 -->
        <div class="field border large label bottom-margin">
            <input placeholder=" " type="text" id="new-member-name-input">
            <label>氏名 <span class="error-text">*</span></label>
        </div>

        <!-- 表示名 -->
        <div class="field border large label bottom-margin">
            <input placeholder=" " type="text" id="new-member-display-name-input">
            <label>表示名</label>
            <output>氏名と異なる場合に入力してください</output>
        </div>

        <!-- メールアドレス -->
        <div class="field border large label bottom-margin">
            <input placeholder=" " type="email" id="new-member-email-input">
            <label>メールアドレス <span class="error-text">*</span></label>
        </div>

        <!-- SlackプロフィールURL -->
        <div class="field border large label bottom-margin">
            <input placeholder=" " type="url" id="new-member-slack-url-input">
            <label>SlackプロフィールURL</label>
        </div>

        <!-- プロフィール写真URL -->
        <div class="field border large label bottom-margin">
            <input placeholder=" " type="url" id="new-member-photo-url-input">
            <label>プロフィール写真URL</label>
        </div>

        <!-- 有効フラグ -->
        <label class="row padding no-margin bottom-margin">
            <input type="checkbox" id="new-member-is-active-input" checked>
            <span>在籍中（有効）</span>
        </label>

        <!-- 備考 -->
        <div class="field border large label bottom-margin">
            <textarea placeholder=" " id="new-member-remark-input" rows="2"></textarea>
            <label>備考</label>
        </div>

        <!-- エラー表示 -->
        <p id="new-member-error" class="error-text small-text" style="display: none;"></p>

        <!-- 作成ボタン -->
        <nav class="right-align top-margin">
            <button class="border" onclick="App.modals.newMember.close()">
                <span>キャンセル</span>
            </button>
            <button id="new-member-create-btn" class="primary" onclick="App.modals.newMember.create()">
                <i>person_add</i>
                <span>登録する</span>
            </button>
        </nav>
    </div>
</dialog>

<script>
    (function () {
        App.modals.newMember = {

            open: function () {
                this._resetForm();
                const dialog = document.getElementById('modal-new-member');
                if (dialog) {
                    ui(dialog, true);
                    setTimeout(function () {
                        const nameInput = document.getElementById('new-member-name-input');
                        if (nameInput) nameInput.focus();
                    }, 80);
                }
            },

            close: function () {
                const dialog = document.getElementById('modal-new-member');
                if (dialog) ui(dialog, false);
            },

            create: async function () {
                const name = (document.getElementById('new-member-name-input')?.value || '').trim();
                const displayName = (document.getElementById('new-member-display-name-input')?.value || '').trim();
                const email = (document.getElementById('new-member-email-input')?.value || '').trim();
                const slackUrl = (document.getElementById('new-member-slack-url-input')?.value || '').trim();
                const photoUrl = (document.getElementById('new-member-photo-url-input')?.value || '').trim();
                const isActive = document.getElementById('new-member-is-active-input')?.checked !== false;
                const remark = (document.getElementById('new-member-remark-input')?.value || '').trim();

                const errorEl = document.getElementById('new-member-error');
                const createBtn = document.getElementById('new-member-create-btn');

                // バリデーション
                if (!name) {
                    if (errorEl) { errorEl.textContent = '氏名は必須です'; errorEl.style.display = ''; }
                    return;
                }
                if (!email) {
                    if (errorEl) { errorEl.textContent = 'メールアドレスは必須です'; errorEl.style.display = ''; }
                    return;
                }

                if (errorEl) errorEl.style.display = 'none';
                if (createBtn) createBtn.disabled = true;

                try {
                    const dataObject = {
                        name: name,
                        display_name: displayName || name,
                        email: email,
                        slack_profile_url: slackUrl || null,
                        profile_photo_url: photoUrl || null,
                        is_active: isActive,
                        remark: remark || null
                    };

                    await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.MEMBERS, 'insert', dataObject, null, false);

                    // キャッシュをクリアして再取得
                    await loadAllData();

                    showSnackbar('メンバーを登録しました', 'success');
                    this.close();

                } catch (err) {
                    console.error('[newMember] 登録エラー:', err);
                    if (errorEl) { errorEl.textContent = '登録に失敗しました: ' + (err.message || err); errorEl.style.display = ''; }
                } finally {
                    if (createBtn) createBtn.disabled = false;
                }
            },

            _resetForm: function () {
                const ids = ['new-member-name-input', 'new-member-display-name-input', 'new-member-email-input', 'new-member-slack-url-input', 'new-member-photo-url-input', 'new-member-remark-input'];
                ids.forEach(function (id) {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
                const cb = document.getElementById('new-member-is-active-input');
                if (cb) cb.checked = true;
                const err = document.getElementById('new-member-error');
                if (err) err.style.display = 'none';
            }
        };
    })();
</script>
