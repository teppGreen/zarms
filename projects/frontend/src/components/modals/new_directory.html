<!-- 新規組織作成モーダル -->
<dialog id="modal-new-directory" class="modal medium-width padding">
    <nav class="small-padding bottom-margin">
        <h5 class="max bold">新規組織登録</h5>
        <button class="circle transparent" onclick="App.modals.newDirectory.close()">
            <i>close</i>
        </button>
    </nav>

    <div class="small-padding">
        <!-- 組織名 -->
        <div class="field border large label bottom-margin">
            <input placeholder=" " type="text" id="new-directory-name-input">
            <label>組織名 <span class="error-text">*</span></label>
        </div>

        <!-- 種別 -->
        <div class="field border large suffix no-wrap label bottom-margin">
            <select id="new-directory-type-select">
                <!-- 動的に生成 -->
            </select>
            <label>種別</label>
            <i>arrow_drop_down</i>
        </div>

        <!-- 親組織 -->
        <div class="field border large suffix no-wrap label bottom-margin">
            <select id="new-directory-parent-select">
                <option value="">（なし）</option>
            </select>
            <label>親組織</label>
            <i>arrow_drop_down</i>
        </div>

        <!-- SlackチャンネルURL -->
        <div class="field border large label bottom-margin">
            <input placeholder=" " type="url" id="new-directory-slack-url-input">
            <label>SlackチャンネルURL</label>
        </div>

        <!-- フォルダID -->
        <div class="field border large label bottom-margin">
            <input placeholder=" " type="text" id="new-directory-gfolder-id-input">
            <label>Google DriveフォルダID</label>
        </div>

        <!-- 有効フラグ -->
        <label class="row padding no-margin bottom-margin">
            <input type="checkbox" id="new-directory-is-active-input" checked>
            <span>有効</span>
        </label>

        <!-- 備考 -->
        <div class="field border large label bottom-margin">
            <textarea placeholder=" " id="new-directory-remark-input" rows="2"></textarea>
            <label>備考</label>
        </div>

        <!-- エラー表示 -->
        <p id="new-directory-error" class="error-text small-text" style="display: none;"></p>

        <!-- 登録ボタン -->
        <nav class="right-align top-margin">
            <button class="border" onclick="App.modals.newDirectory.close()">
                <span>キャンセル</span>
            </button>
            <button id="new-directory-create-btn" class="primary" onclick="App.modals.newDirectory.create()">
                <i>account_tree</i>
                <span>登録する</span>
            </button>
        </nav>
    </div>
</dialog>

<script>
    (function () {
        App.modals.newDirectory = {

            open: function () {
                this._resetForm();
                this._populateSelects();
                const dialog = document.getElementById('modal-new-directory');
                if (dialog) {
                    ui(dialog, true);
                    setTimeout(function () {
                        const el = document.getElementById('new-directory-name-input');
                        if (el) el.focus();
                    }, 80);
                }
            },

            close: function () {
                const dialog = document.getElementById('modal-new-directory');
                if (dialog) ui(dialog, false);
            },

            // セレクト要素をデータで初期化
            _populateSelects: function () {
                const typeSelect = document.getElementById('new-directory-type-select');
                if (typeSelect && typeof DIRECTORY_TYPES !== 'undefined') {
                    typeSelect.innerHTML = '<option value="">（種別なし）</option>';
                    Object.entries(DIRECTORY_TYPES).forEach(function (entry) {
                        const opt = document.createElement('option');
                        opt.value = entry[0];
                        opt.textContent = entry[1];
                        typeSelect.appendChild(opt);
                    });
                }

                const parentSelect = document.getElementById('new-directory-parent-select');
                if (parentSelect) {
                    const dirs = App.state.data.directories || [];
                    const activeDir = dirs.filter(function (d) { return d.is_active !== false; });
                    activeDir.sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
                    parentSelect.innerHTML = '<option value="">（なし）</option>';
                    activeDir.forEach(function (d) {
                        const opt = document.createElement('option');
                        opt.value = d.id;
                        opt.textContent = d.name;
                        parentSelect.appendChild(opt);
                    });
                }
            },

            create: async function () {
                const name = (document.getElementById('new-directory-name-input')?.value || '').trim();
                const typeKey = document.getElementById('new-directory-type-select')?.value || null;
                const parentId = document.getElementById('new-directory-parent-select')?.value || null;
                const slackUrl = (document.getElementById('new-directory-slack-url-input')?.value || '').trim();
                const gfolderId = (document.getElementById('new-directory-gfolder-id-input')?.value || '').trim();
                const isActive = document.getElementById('new-directory-is-active-input')?.checked !== false;
                const remark = (document.getElementById('new-directory-remark-input')?.value || '').trim();

                const errorEl = document.getElementById('new-directory-error');
                const createBtn = document.getElementById('new-directory-create-btn');

                if (!name) {
                    if (errorEl) { errorEl.textContent = '組織名は必須です'; errorEl.style.display = ''; }
                    return;
                }

                if (errorEl) errorEl.style.display = 'none';
                if (createBtn) createBtn.disabled = true;

                try {
                    const dataObject = {
                        name: name,
                        directory_type_key: typeKey || null,
                        parent_directory_id: parentId || null,
                        slack_channel_url: slackUrl || null,
                        gfolder_id: gfolderId || null,
                        is_active: isActive,
                        remark: remark || null
                    };

                    await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.DIRECTORIES, 'insert', dataObject, null, false);

                    await loadAllData();

                    showSnackbar('組織を登録しました', 'success');
                    this.close();

                } catch (err) {
                    console.error('[newDirectory] 登録エラー:', err);
                    if (errorEl) { errorEl.textContent = '登録に失敗しました: ' + (err.message || err); errorEl.style.display = ''; }
                } finally {
                    if (createBtn) createBtn.disabled = false;
                }
            },

            _resetForm: function () {
                const ids = ['new-directory-name-input', 'new-directory-slack-url-input', 'new-directory-gfolder-id-input', 'new-directory-remark-input'];
                ids.forEach(function (id) {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
                const cb = document.getElementById('new-directory-is-active-input');
                if (cb) cb.checked = true;
                const err = document.getElementById('new-directory-error');
                if (err) err.style.display = 'none';
            }
        };
    })();
</script>
