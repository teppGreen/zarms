<script>
    (function () {
        App.modals.directoryDetail = {
            currentId: null,

            open: function (directoryId) {
                if (!directoryId) return;

                const directory = (App.state.data.directories || []).find(function (item) { return item.id === directoryId; });
                if (!directory) return;

                this.currentId = directoryId;
                this._populateSelects(directoryId);
                this._render(directory);
                this.loadComments(directoryId);
                ui('#modal-detail-directory');
            },

            close: function () {
                ui('#modal-detail-directory');
                this.currentId = null;
            },

            save: async function () {
                if (!this.currentId) return;

                const errorEl = document.getElementById('directory-detail-error');
                const saveBtn = document.getElementById('directory-detail-save-btn');
                const name = (document.getElementById('directory-detail-name-input')?.value || '').trim();
                const typeKey = document.getElementById('directory-detail-type-select')?.value || null;
                const parentId = document.getElementById('directory-detail-parent-select')?.value || null;
                const slackUrl = (document.getElementById('directory-detail-slack-url-input')?.value || '').trim() || null;
                const gfolderId = (document.getElementById('directory-detail-gfolder-id-input')?.value || '').trim() || null;
                const isActive = document.getElementById('directory-detail-is-active-input')?.checked !== false;
                const remark = (document.getElementById('directory-detail-remark-input')?.value || '').trim() || null;

                if (!name) {
                    if (errorEl) {
                        errorEl.textContent = '組織名は必須です';
                        errorEl.style.display = '';
                    }
                    return;
                }

                if (parentId && this._hasParentCycle(parentId, this.currentId)) {
                    if (errorEl) {
                        errorEl.textContent = '親組織に自身または子孫組織は設定できません';
                        errorEl.style.display = '';
                    }
                    return;
                }

                if (errorEl) errorEl.style.display = 'none';
                if (saveBtn) saveBtn.disabled = true;
                showSnackbar('ディレクトリを保存しています...', 'info', 'top', 0);

                const updateSet = {
                    name: name,
                    directory_type_key: typeKey || null,
                    parent_directory_id: parentId || null,
                    slack_channel_url: slackUrl,
                    gfolder_id: gfolderId,
                    is_active: isActive,
                    remark: remark
                };

                try {
                    await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.DIRECTORIES, 'update', {
                        where: { id: ['=', this.currentId] },
                        set: updateSet
                    }, 'ディレクトリを更新');

                    const target = (App.state.data.directories || []).find(function (item) { return item.id === App.modals.directoryDetail.currentId; });
                    if (target) {
                        Object.assign(target, updateSet);
                    }

                    if (App.utils.modalFlow && App.utils.modalFlow.refreshMembersDataInBackground) {
                        App.utils.modalFlow.refreshMembersDataInBackground(true);
                    } else if (App.pages.members && App.pages.members.loadData) {
                        App.pages.members.loadData(true);
                    }

                    showSnackbar('ディレクトリを更新しました', 'success');
                    this.close();
                } catch (err) {
                    console.error('[directoryDetail] save failed', err);
                    showSnackbar('更新に失敗しました', 'error');
                    if (errorEl) {
                        errorEl.textContent = '更新に失敗しました';
                        errorEl.style.display = '';
                    }
                } finally {
                    if (saveBtn) saveBtn.disabled = false;
                }
            },

            openNewComment: function () {
                if (!this.currentId) return;
                if (!App.modals.newComment) return;

                if (App.modals.newComment.openFor) {
                    App.modals.newComment.openFor('directories', this.currentId);
                    return;
                }

                App.modals.newComment.open(this.currentId);
            },

            loadComments: function (directoryId, skipLoadingCache = false) {
                const commentsList = document.getElementById('directory-comments-list');
                if (commentsList) {
                    commentsList.innerHTML = '<div class="small-padding center row small-space"><progress class="circle indeterminate small"></progress><span class="small-text">読み込み中</span></div>';
                }

                const query = {
                    where: {
                        related_table: ['=', 'directories'],
                        related_id: ['=', directoryId]
                    },
                    orderBy: {
                        created_at: 'desc'
                    }
                };

                callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.COMMENTS, 'select', query, null, skipLoadingCache)
                    .then(results => {
                        if (this.currentId !== directoryId) return;

                        const comments = results?.data || results || [];
                        this.renderComments(comments);

                        if (results?.isCached) {
                            callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.COMMENTS, 'select', query, null, true)
                                .then(refreshedResults => {
                                    if (this.currentId !== directoryId) return;
                                    const refreshedComments = refreshedResults?.data || refreshedResults || [];
                                    this.renderComments(refreshedComments);
                                });
                        }
                    })
                    .catch(error => {
                        console.error('[DirectoryDetail] コメント読み込みエラー:', error);
                        if (this.currentId === directoryId && commentsList) {
                            commentsList.innerHTML = '<p class="error-text padding">コメントの読み込みに失敗しました</p>';
                        }
                    });
            },

            renderComments: function (comments) {
                const container = document.getElementById('directory-comments-list');
                if (!container) return;

                if (!comments || comments.length === 0) {
                    container.innerHTML = '<p>コメントはありません</p>';
                    return;
                }

                const members = App.state.data.members || [];

                container.innerHTML = comments.map(function (comment, index) {
                    const creator = members.find(function (m) { return m.id === comment.created_by; });
                    const creatorName = creator ? creator.display_name : '不明';
                    const creatorPhoto = creator ? creator.profile_photo_url : '';
                    const creatorSlackProfileUrl = creator ? creator.slack_profile_url : '#';
                    const createdAt = formatDateTimeForDisplay(comment.created_at, 'MM/dd HH:mm');
                    const hr = index > 0 ? '<hr class="max small-margin">' : '';

                    const creatorIcon = creatorPhoto
                        ? '<img src="' + creatorPhoto + '" alt="' + escapeHtml(creatorName) + '" class="circle tiny">'
                        : '<i class="tiny">account_circle</i>';

                    return '' +
                        hr +
                        '<div class="small-padding">' +
                        '<div class="row tiny-space">' +
                        '<a href="' + escapeHtml(creatorSlackProfileUrl) + '" target="_blank">' + creatorIcon + '<\/a>' +
                        '<div class="max row tiny-space">' +
                        '<span class="bold small-text">' + escapeHtml(creatorName) + '<\/span>' +
                        '<span class="small-text secondary-text">' + createdAt + '<\/span>' +
                        '<\/div>' +
                        '<\/div>' +
                        '<div class="tiny-space"><\/div>' +
                        '<p class="small-text no-margin tiny-line">' + escapeHtmlWithLineBreaks(comment.content) + '<\/p>' +
                        '<\/div>';
                }).join('');
            },

            openAddMembers: function () {
                if (!this.currentId) return;
                if (!App.modals.selectMembers || !App.modals.selectMembers.open) return;

                const directoryId = this.currentId;
                const preSelected = (App.state.data.directoryAssignments || [])
                    .filter(function (a) { return a.directory_id === directoryId && a.is_active !== false; })
                    .map(function (a) { return a.member_id; });

                App.modals.selectMembers.open({
                    multiSelect: true,
                    preSelected: preSelected,
                    callback: function (selectedIds) {
                        App.modals.directoryDetail.applyMembersSelection(directoryId, selectedIds);
                    }
                });
            },

            applyMembersSelection: async function (directoryId, selectedIds) {
                if (!directoryId) return;
                if (!selectedIds || selectedIds.length === 0) return;

                const assignments = App.state.data.directoryAssignments || [];
                showSnackbar('所属メンバーを更新しています...', 'info', 'top', 0);

                try {
                    for (let i = 0; i < selectedIds.length; i++) {
                        const memberId = selectedIds[i];
                        const existing = assignments.find(function (a) {
                            return a.directory_id === directoryId && a.member_id === memberId;
                        });

                        if (existing) {
                            if (existing.is_active === false) {
                                await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.DIRECTORY_ASSIGNMENTS, 'update', {
                                    where: { id: ['=', existing.id] },
                                    set: { is_active: true }
                                }, '所属メンバーを更新');
                                existing.is_active = true;
                            }
                            continue;
                        }

                        const record = {
                            directory_id: directoryId,
                            member_id: memberId,
                            is_active: true
                        };

                        const inserted = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.DIRECTORY_ASSIGNMENTS, 'insert', record, '所属メンバーを追加');
                        if (inserted && inserted.data && inserted.data.id) {
                            record.id = inserted.data.id;
                        }
                        assignments.push(record);
                    }

                    showSnackbar('所属メンバーを更新しました', 'success');
                } catch (err) {
                    console.error('[directoryDetail] applyMembersSelection failed', err);
                    showSnackbar('所属メンバーの更新に失敗しました', 'error');
                    if (App.utils.modalFlow && App.utils.modalFlow.refreshMembersDataInBackground) {
                        App.utils.modalFlow.refreshMembersDataInBackground(true);
                    } else if (App.pages.members && App.pages.members.loadData) {
                        App.pages.members.loadData(true);
                    }
                }

                const directory = (App.state.data.directories || []).find(function (item) { return item.id === directoryId; });
                if (directory) {
                    this._render(directory);
                }
                if (App.utils.modalFlow && App.utils.modalFlow.refreshMembersDataInBackground) {
                    App.utils.modalFlow.refreshMembersDataInBackground(false);
                } else if (App.pages.members && App.pages.members.loadData) {
                    App.pages.members.loadData(false);
                }
            },

            deactivateMemberAssignment: async function (assignmentId) {
                if (!assignmentId) return;
                if (!confirm('所属メンバーを解除しますか？')) return;

                const assignments = App.state.data.directoryAssignments || [];
                const target = assignments.find(function (a) { return a.id === assignmentId; });
                if (!target) return;

                try {
                    await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.DIRECTORY_ASSIGNMENTS, 'update', {
                        where: { id: ['=', assignmentId] },
                        set: { is_active: false }
                    }, '所属メンバーを解除');
                    target.is_active = false;
                    showSnackbar('所属メンバーを解除しました', 'success');
                } catch (err) {
                    console.error('[directoryDetail] deactivateMemberAssignment failed', err);
                    showSnackbar('所属メンバーの解除に失敗しました', 'error');
                    if (App.utils.modalFlow && App.utils.modalFlow.refreshMembersDataInBackground) {
                        App.utils.modalFlow.refreshMembersDataInBackground(true);
                    } else if (App.pages.members && App.pages.members.loadData) {
                        App.pages.members.loadData(true);
                    }
                }

                const directory = (App.state.data.directories || []).find(function (item) { return item.id === this.currentId; }, this);
                if (directory) {
                    this._render(directory);
                }
                if (App.utils.modalFlow && App.utils.modalFlow.refreshMembersDataInBackground) {
                    App.utils.modalFlow.refreshMembersDataInBackground(false);
                } else if (App.pages.members && App.pages.members.loadData) {
                    App.pages.members.loadData(false);
                }
            },

            openMemberDetail: function (memberId) {
                if (!memberId) return;
                if (App.modals.memberDetail && App.modals.memberDetail.open) {
                    App.modals.memberDetail.open(memberId);
                }
            },

            updateMemberRole: async function (assignmentId, roleValue) {
                if (!assignmentId) return;

                const assignments = App.state.data.directoryAssignments || [];
                const target = assignments.find(function (a) { return a.id === assignmentId; });
                if (!target) return;

                const normalizedRole = (roleValue || '').trim() || null;
                const prevRole = target.role || null;
                if (normalizedRole === prevRole) return;

                target.role = normalizedRole;

                try {
                    await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.DIRECTORY_ASSIGNMENTS, 'update', {
                        where: { id: ['=', assignmentId] },
                        set: { role: normalizedRole }
                    }, '所属メンバーの役割を更新');
                    showSnackbar('役割を更新しました', 'success');
                } catch (err) {
                    console.error('[directoryDetail] updateMemberRole failed', err);
                    target.role = prevRole;
                    showSnackbar('役割の更新に失敗しました', 'error');
                    if (App.utils.modalFlow && App.utils.modalFlow.refreshMembersDataInBackground) {
                        App.utils.modalFlow.refreshMembersDataInBackground(true);
                    }
                }

                const directory = (App.state.data.directories || []).find(function (item) { return item.id === this.currentId; }, this);
                if (directory) {
                    this._render(directory);
                }
            },

            _populateSelects: function (currentId) {
                const typeSelect = document.getElementById('directory-detail-type-select');
                const parentSelect = document.getElementById('directory-detail-parent-select');
                const directories = App.state.data.directories || [];

                if (typeSelect) {
                    typeSelect.innerHTML = '<option value="">（種別なし）</option>';
                    Object.entries((KEY_LABELS && KEY_LABELS.DIRECTORY_TYPE) ? KEY_LABELS.DIRECTORY_TYPE : {}).forEach(function (entry) {
                        const option = document.createElement('option');
                        option.value = entry[0];
                        option.textContent = entry[1];
                        typeSelect.appendChild(option);
                    });
                }

                if (parentSelect) {
                    parentSelect.innerHTML = '<option value="">（なし）</option>';
                    directories.filter(function (item) {
                        return item.id !== currentId;
                    }).sort(function (left, right) {
                        return (left.name || '').localeCompare(right.name || '');
                    }).forEach(function (item) {
                        const option = document.createElement('option');
                        option.value = item.id;
                        option.textContent = item.name;
                        parentSelect.appendChild(option);
                    });
                }
            },

            _render: function (directory) {
                const assignments = (App.state.data.directoryAssignments || []).filter(function (assignment) {
                    return assignment.directory_id === directory.id && assignment.is_active !== false;
                });
                const members = App.state.data.members || [];
                const chips = assignments.map(function (assignment) {
                    const member = members.find(function (item) { return item.id === assignment.member_id; });
                    const label = member ? (member.display_name || member.name || member.email || '不明') : '不明';
                    const role = assignment.role || '';
                    const openButton = member && member.id
                        ? '<button class="small border round" onclick="App.modals.directoryDetail.openMemberDetail(\'' + escapeHtmlAttribute(member.id) + '\')">詳細<\/button>'
                        : '';
                    const removeButton = assignment.id
                        ? '<button class="small border round" onclick="App.modals.directoryDetail.deactivateMemberAssignment(\'' + escapeHtmlAttribute(assignment.id) + '\')">解除<\/button>'
                        : '';

                    return '<div class="row middle-align tiny-space padding">' +
                        '<i>person<\/i>' +
                        '<div class="max">' +
                        '<p class="no-margin small">' + escapeHtml(label) + '<\/p>' +
                        '<div class="field border label small top-margin no-margin">' +
                        '<input type="text" placeholder=" " value="' + escapeHtmlAttribute(role) + '" onchange="App.modals.directoryDetail.updateMemberRole(\'' + escapeHtmlAttribute(assignment.id || '') + '\', this.value)">' +
                        '<label>役割</label>' +
                        '<\/div>' +
                        '<\/div>' +
                        '<div class="row tiny-space">' + openButton + removeButton + '<\/div>' +
                        '<\/div>';
                }).join('');

                const setValue = function (id, value) {
                    const el = document.getElementById(id);
                    if (el) el.value = value || '';
                };

                setValue('directory-detail-name-input', directory.name);
                setValue('directory-detail-id-input', directory.id ? '#' + directory.id : '');
                setValue('directory-detail-slack-url-input', directory.slack_channel_url);
                setValue('directory-detail-gfolder-id-input', directory.gfolder_id);
                setValue('directory-detail-remark-input', directory.remark);

                const findDisplayName = function (memberId) {
                    if (!memberId) return '';
                    const member = members.find(function (item) { return item.id === memberId; });
                    return member ? (member.display_name || member.name || member.email || '') : memberId;
                };
                setValue('directory-detail-created-by-input', findDisplayName(directory.created_by));
                setValue('directory-detail-created-at-input', directory.created_at ? formatDateTimeForDisplay(directory.created_at) : '');
                setValue('directory-detail-updated-by-input', findDisplayName(directory.updated_by));
                setValue('directory-detail-updated-at-input', directory.updated_at ? formatDateTimeForDisplay(directory.updated_at) : '');

                const typeSelect = document.getElementById('directory-detail-type-select');
                if (typeSelect) typeSelect.value = directory.directory_type_key || '';
                const parentSelect = document.getElementById('directory-detail-parent-select');
                if (parentSelect) parentSelect.value = directory.parent_directory_id || '';
                const activeInput = document.getElementById('directory-detail-is-active-input');
                if (activeInput) activeInput.checked = directory.is_active !== false;
                const idEl = document.getElementById('directory-detail-id');
                if (idEl) idEl.textContent = directory.id ? '#' + directory.id : '';
                const memberCountEl = document.getElementById('directory-detail-member-count');
                if (memberCountEl) memberCountEl.textContent = '所属メンバー数 ' + String(assignments.length);
                const membersEl = document.getElementById('directory-detail-members');
                if (membersEl) membersEl.innerHTML = chips || '<p class="small-text secondary-text">所属メンバーはありません</p>';
                const errorEl = document.getElementById('directory-detail-error');
                if (errorEl) errorEl.style.display = 'none';
            },

            _hasParentCycle: function (parentId, currentId) {
                const directories = App.state.data.directories || [];
                const visited = {};
                let cursor = parentId;

                while (cursor) {
                    if (cursor === currentId) return true;
                    if (visited[cursor]) return true;
                    visited[cursor] = true;
                    const node = directories.find(function (item) { return item.id === cursor; });
                    cursor = node ? (node.parent_directory_id || null) : null;
                }

                return false;
            }
        };
    })();
</script>
