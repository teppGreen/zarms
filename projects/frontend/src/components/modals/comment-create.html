<!-- 新規コメント作成モーダル -->
 <!-- 将来的には、タスク追加画面単体で動作するようにしたい（タスクを選択する欄を作る） -->
<dialog id="modal-new-comment" class="modal padding no-scroll">
    <nav class="small-padding bottom-margin">
        <h5 class="max bold">新規コメント作成</h5>
        <button class="circle transparent" onclick="App.modals.newComment.close()">
            <i>close</i>
        </button>
    </nav>

    <div class="field no-border background scroll large-width small-round">
        <textarea id="new-comment-content" rows="10" placeholder="コメント内容を入力..."></textarea>
    </div>

    <nav class="right-align small-padding">
        <button class="border" onclick="App.modals.newComment.close()">キャンセル</button>
        <button onclick="App.modals.newComment.save()">作成</button>
    </nav>
</dialog>
