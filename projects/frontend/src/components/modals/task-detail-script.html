<script>
  (function () {
    App.modals.taskDetail = {
      currentId: null,
      currentItem: null,
      originalData: null, // 元のデータを保持（変更検知用）
      isDirty: false, // 変更フラグ
      quill: null, // Quillエディタインスタンス
      currentLists: [], // 現在のタスクに紐づくリストデータ
      originalLists: [], // リストの元のデータ（変更検知用）
      listSortable: null, // SortableJSインスタンス
      deletedListIds: [], // 削除されたリストIDの配列
      isListLoadingFresh: true, // リストの新鮮なデータを読み込み中か
      currentParentTask: null, // 親タスクデータ
      currentChildTasks: [], // 子タスクの配列
      originalParentTaskId: null, // 元の親タスクID（変更検知用）
      originalChildTaskIds: [], // 元の子タスクIDの配列（変更検知用）
      addedChildTaskIds: [], // 追加された子タスクIDの配列（変更検知用）
      deletedChildTaskIds: [], // 削除された子タスクIDの配列
      pendingComments: [], // モーダル内で作成された保存待ちコメント
      currentHistoryLogs: [], // 履歴タブの表示対象ログ
      historyLoadError: null, // 履歴ロードエラー

      applyAssigneeLabels: function () {
        const roleLabels = {
          'task-detail-role-created-by': KEY_LABELS.ASIGNEE_TYPE.CREATED_BY,
          'task-detail-role-processed-by': KEY_LABELS.ASIGNEE_TYPE.PROCESSED_BY,
          'task-detail-role-reviewed-by': KEY_LABELS.ASIGNEE_TYPE.REVIEWED_BY,
          'task-detail-role-received-by': KEY_LABELS.ASIGNEE_TYPE.RECEIVED_BY
        };

        Object.keys(roleLabels).forEach(id => {
          const element = document.getElementById(id);
          if (element) {
            element.textContent = roleLabels[id];
          }
        });
      },

      applyStatusSelectOptions: function () {
        const statusSelect = document.getElementById('task-status-select');
        if (!statusSelect) return;

        // optionを全削除
        statusSelect.innerHTML = '';

        // KEY_LABELS.TASK_STATUSからoption要素を生成
        const statusKeys = ['TODO', 'IN_PROGRESS', 'IN_REVIEW', 'DONE'];
        statusKeys.forEach(key => {
          const option = document.createElement('option');
          option.value = key;
          option.textContent = KEY_LABELS.TASK_STATUS[key] || '';
          statusSelect.appendChild(option);
        });
      },

      markDirty: function (reason = '') {
        this.syncDirtyState(reason);
      },

      updateActionButtons: function () {
        const primaryBtn = document.getElementById('task-primary-action-btn');
        const discardBtn = document.getElementById('task-discard-btn');

        if (primaryBtn) {
          primaryBtn.textContent = this.isDirty ? '変更を保存' : '閉じる';
        }

        if (discardBtn) {
          discardBtn.style.display = this.isDirty ? '' : 'none';
        }
      },

      syncDirtyState: function (reason = '') {
        const nextDirty = this.hasUnsavedChanges();
        const changed = this.isDirty !== nextDirty;
        this.isDirty = nextDirty;
        this.updateActionButtons();
        if (changed && reason) {
          console.log(`[TaskDetail] isDirty changed to ${nextDirty} (${reason})`);
        }
      },

      hasUnsavedChanges: function () {
        if (!this.currentId || !this.originalData || !this.currentItem) return false;

        if ((this.pendingComments || []).length > 0) return true;

        const originalData = this.originalData;
        const currentItem = this.currentItem;

        const nameInput = document.getElementById('task-name-input');
        const statusSelect = document.getElementById('task-status-select');
        const prioritySelect = document.getElementById('task-priority-select');
        const boardSelect = document.getElementById('task-board-select');
        const startsAtInput = document.getElementById('task-starts-at-input');
        const endsAtInput = document.getElementById('task-ends-at-input');

        if (nameInput && nameInput.value !== (originalData.name || '')) return true;

        const description = this.getDescription();
        if (description !== (originalData.description || '')) return true;

        if (statusSelect && statusSelect.value !== (originalData.task_status_key || '')) return true;
        if (prioritySelect && prioritySelect.value !== (originalData.priority_key || '')) return true;
        if (boardSelect && boardSelect.value !== (originalData.board_id || '')) return true;

        if (startsAtInput) {
          const newStartsAt = startsAtInput.value ? new Date(startsAtInput.value).toISOString() : '';
          const oldStartsAt = originalData.starts_at || '';
          if (newStartsAt !== oldStartsAt) return true;
        }

        if (endsAtInput) {
          const newEndsAt = endsAtInput.value ? new Date(endsAtInput.value).toISOString() : '';
          const oldEndsAt = originalData.ends_at || '';
          if (newEndsAt !== oldEndsAt) return true;
        }

        const memberRoles = ['processed_by', 'reviewed_by', 'received_by'];
        for (const role of memberRoles) {
          if (currentItem[role] !== originalData[role]) return true;
        }

        const listChanges = this.getListChanges();
        if (listChanges.toInsert.length > 0 || listChanges.toUpdate.length > 0 || listChanges.toDelete.length > 0) return true;

        const relatedChanges = this.getRelatedTaskChanges();
        if (relatedChanges.hasParentChange || relatedChanges.childTasksToAdd.length > 0 || relatedChanges.childTasksToRemove.length > 0) return true;

        return false;
      },

      queuePendingComment: function (content) {
        if (!content || !this.currentId) return null;

        const pendingComment = {
          id: `temp-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          content: content,
          related_table: 'tasks',
          related_id: this.currentId,
          created_by: App.state.userId,
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString()
        };

        this.pendingComments.push({
          content: content,
          related_table: 'tasks',
          related_id: this.currentId
        });

        this.appendCommentToUI(pendingComment);
        this.syncDirtyState('queuePendingComment');
        return pendingComment;
      },

      requestClose: function (reason = 'generic', skipUrlUpdate = false) {
        this.syncDirtyState(`requestClose:${reason}`);
        const hasUnsavedChanges = this.hasUnsavedChanges();

        if (hasUnsavedChanges) {
          const shouldSave = confirm('変更を保存しますか？');
          if (shouldSave) {
            this.save();
            return true;
          }
          return false;
        }

        this.close(skipUrlUpdate, true);
        return true;
      },

      onPrimaryAction: function () {
        this.syncDirtyState('onPrimaryAction');

        // 「変更を保存」ボタン押下時は確認ダイアログを表示せず、そのまま保存する
        if (this.hasUnsavedChanges()) {
          this.save();
          return;
        }

        this.close(false, true);
      },

      open: async function (taskId, skipUrlUpdate = false, defaultDirty = false) {
        console.log('[TaskDetail] open called with id:', taskId);

        if (!taskId) {
          console.error('[TaskDetail] Invalid task ID');
          return;
        }

        this.reset();

        this.currentId = taskId;

        // tasks データから取得（ボードページでJOIN済み）
        const currentBoardId = App.pages.boards?.currentBoardId;
        const boardTasks = (currentBoardId && App.pages.boards?.cachedBoardTasks?.[currentBoardId]) || [];
        let task = boardTasks.find(t => t.id === taskId);

        // キャッシュに見つからない場合、他ボードのキャッシュから検索
        if (!task && App.pages.boards?.cachedBoardTasks) {
          const allBoardTasks = Object.values(App.pages.boards.cachedBoardTasks).flat();
          task = allBoardTasks.find(t => t.id === taskId);
        }

        // キャッシュに見つからない場合、グローバルデータから検索（My Boardなどでキャッシュに含まれていない場合への対策）
        if (!task && App.state.data.tasks) {
          task = App.state.data.tasks.find(t => t.id === taskId);
        }

        if (!task) {
          console.error('[TaskDetail] Task not found:', taskId);
          alert('開こうとしたタスクが見つかりませんでした。削除された可能性があります。');
          return;
        }

        this.currentItem = task;
        this.originalData = { ...task }; // 元のデータを保存
        // 関連タスクの元データを初期化（loadRelatedTasks完了前のisDirtyバグを防ぐ）
        this.originalParentTaskId = task.parent_task_id || null;
        this.originalChildTaskIds = [];
        this.addedChildTaskIds = [];
        this.deletedChildTaskIds = [];
        this.applyAssigneeLabels();
        this.applyStatusSelectOptions();

        // モーダルを先に開く（BeerCSSのlabelスタイルが正しく適用されるように）
        appUi('#modal-detail-task', true);

        // Quillの初期化（初回のみ）
        if (!this.quill) {
          this.quill = App.utils.quill.init('#task-description-editor', {
            placeholder: `${KEY_LABELS.ASIGNEE_TYPE.PROCESSED_BY}の人の目線に立って、タスクの説明を書きましょう。\nShift+Enterで改行、Enterで段落区切り`
          });
        }

        this.render(task);
        this.bindChangeListeners();
        this.switchTaskDetailTab(null, 'description');

        // URLパラメータを更新（skipUrlUpdateがfalseの場合のみ）
        if (!skipUrlUpdate && App.utils.url && App.utils.url.updateParams) {
          const currentParams = App.utils.url.getParams();
          const newParams = {
            tab: currentParams.tab || 'home',
            modal: 'task-detail',
            task_id: taskId
          };

          // タブがボードの場合のみ、board_id をURLに含める
          if (newParams.tab === 'board') {
            // ボードIDが存在する場合は追加
            if (currentParams.board_id) {
              newParams.board_id = currentParams.board_id;
            } else if (this.currentItem && this.currentItem.board_id && this.currentItem.board_id !== '') {
              // currentItemからboard_idを取得（nullチェックと空文字列チェック付き）
              // board_idが有効な値（null/undefined/空文字でない）の場合のみ追加
              newParams.board_id = this.currentItem.board_id;
            }
          }

          App.utils.url.updateParams(newParams, false);
        }

        this.loadComments(taskId);

        // トップナビゲーションの通知コメントを既読にする
        if (App.utils.header && App.utils.header.comments && App.utils.header.comments.markCommentsAsReadByTaskId) {
          App.utils.header.comments.markCommentsAsReadByTaskId(taskId);
        }

        this.loadLists(taskId);
        this.loadRelatedTasks(taskId);
        this.loadHistoryLogs(taskId);

        // defaultDirtyは互換目的で受け取るが、保存必要判定は常に差分計算を使用する
        this.syncDirtyState('open');
      },

      switchTaskDetailTab: function (clickedNav, tabId) {
        appUi(`#task-detail-${tabId}`);
        if (clickedNav) {
          clickedNav.parentNode.querySelectorAll('a').forEach(a => {
            a.classList.remove('active');
          });
          clickedNav.classList.add('active');
        }
      },

      /**
       * コメントを読み込み
       * @param {string} taskId - タスクID
       */
      loadComments: function (taskId, skipLoadingCache = false) {
        App.utils.commentManager.loadComments({
          relatedTable: 'tasks',
          relatedId: taskId,
          containerId: 'task-comments-list',
          skipLoadingCache: skipLoadingCache,
          isCurrent: () => this.currentId === taskId,
          onRender: (comments) => this.renderComments(comments),
          logPrefix: 'TaskDetail'
        });
      },

      /**
       * 入力フィールドの変更を監視
       */
      bindChangeListeners: function () {
        const fields = [
          'task-name-input',
          // 'task-description-input', // Removed for Quill
          'task-status-select',
          'task-priority-select',
          'task-board-select',
          'task-starts-at-input',
          'task-ends-at-input'
        ];

        fields.forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.addEventListener('input', () => {
              this.syncDirtyState(`input: ${id}`);
            });
            el.addEventListener('change', () => {
              this.syncDirtyState(`change: ${id}`);
            });
          }
        });

        // Quillはinputイベントを発火しないため専用で変更検知する
        if (this.quill && !this._boundQuillDirtyHandler) {
          this.quill.on('text-change', () => {
            this.syncDirtyState('quill text-change');
          });
          this._boundQuillDirtyHandler = true;
        }

        const statusSelect = document.getElementById('task-status-select');
        if (statusSelect) {
          statusSelect.addEventListener('change', () => {
            const selectedValue = statusSelect.value;
            this.renderStatusIcon(selectedValue);
          });
        }

        const prioritySelect = document.getElementById('task-priority-select');
        if (prioritySelect) {
          prioritySelect.addEventListener('change', () => {
            const selectedValue = prioritySelect.value;
            this.renderPriorityIcon(selectedValue);
          });
        }
      },

      /**
       * Quillエディタの内容を取得（空の場合は空文字を返す）
       * @returns {string}
       */
      getDescription: function () {
        return App.utils.quill.getContent(this.quill);
      },

      /**
       * モーダルを閉じる
       * @param {boolean} skipUrlUpdate - trueの場合、URL更新をスキップ（履歴操作時に使用）
       */
      close: function (skipUrlUpdate = false, skipDirtyCheckOrReason = false, skipClose = false) {
        // 共通モーダルクローズ呼び出しとの互換性:
        // App.utils.ui.closeTopModal から close(skipUrlUpdate, reason) で呼ばれるため、
        // 第2引数が文字列の場合は保存確認をスキップしない。
        const skipDirtyCheck = typeof skipDirtyCheckOrReason === 'boolean'
          ? skipDirtyCheckOrReason
          : false;

        const hasUnsavedChanges = this.hasUnsavedChanges();

        // 変更がある場合は確認
        if (!skipDirtyCheck && hasUnsavedChanges) {
          const shouldSave = confirm('変更を保存しますか？');
          if (shouldSave) {
            // 保存を実行
            this.save(skipClose);
            return true;
          } else {
            return false;
          }
        }

        if (skipClose) {
          return true;
        }

        appUi('#modal-detail-task', false);
        this.reset();

        // URLパラメータからモーダル関連のパラメータを削除（skipUrlUpdateがfalseの場合のみ）
        if (!skipUrlUpdate && App.utils.url && App.utils.url.updateParams) {
          const currentParams = App.utils.url.getParams();
          const newParams = {
            tab: currentParams.tab || 'home'
          };

          // ボードIDが存在する場合は保持
          if (currentParams.board_id) {
            newParams.board_id = currentParams.board_id;
          }

          App.utils.url.updateParams(newParams, false);
        }

        return true;
      },

      /**
       * 変更を破棄してモーダルを閉じる
       */
      discard: function () {
        if (this.hasUnsavedChanges()) {
          if (!confirm('変更を破棄しますか？')) {
            return;
          }
        }

        appUi('#modal-detail-task', false);
        this.reset();

        // URLパラメータを更新
        if (App.utils.url && App.utils.url.updateParams) {
          const currentParams = App.utils.url.getParams();
          const newParams = {
            tab: currentParams.tab || 'home'
          };

          if (currentParams.board_id) {
            newParams.board_id = currentParams.board_id;
          }

          App.utils.url.updateParams(newParams, false);
        }
      },

      /**
       * タスクを削除
       */
      deleteTask: function (targetTaskId = null) {
        const id = targetTaskId || this.currentId;
        if (!id) return;

        // 対象タスクのデータを取得
        let itemToDelete = null;
        if (targetTaskId && targetTaskId !== this.currentId) {
          // グローバルデータまたはボードキャッシュから検索
          if (App.state.data.tasks) {
            itemToDelete = App.state.data.tasks.find(t => t.id === targetTaskId);
          }
          if (!itemToDelete && App.pages.boards && App.pages.boards.currentBoardId) {
            const cache = App.pages.boards.cachedBoardTasks[App.pages.boards.currentBoardId];
            if (cache) {
              itemToDelete = cache.find(t => t.id === targetTaskId);
            }
          }
        } else {
          itemToDelete = this.currentItem;
        }

        if (!confirm('このタスクを削除しますか？')) {
          return;
        }

        // モーダルで開いているタスクを削除する場合はモーダルを閉じる
        if (!targetTaskId || targetTaskId === this.currentId) {
          // 変更フラグをクリア
          this.isDirty = false;
          this.updateActionButtons();
          // モーダルを閉じる
          this.close(false, true);
        }

        // 削除処理開始を通知（成功トーストは callGAS の .then() 側で表示する）
        showSnackbar('タスクを削除しています…', 'info');

        // ── Optimistic UI Update: ローカルデータから削除 ──
        // 削除前の状態を保存（ロールバック用）
        const deletedTaskData = itemToDelete ? { ...itemToDelete } : null;
        let deletedGlobalIndex = -1;
        let deletedCacheIndex = -1;
        let deletedMyBoardIndex = -1;
        const boardId = itemToDelete ? itemToDelete.board_id : null;

        // グローバルデータから削除
        if (App.state.data.tasks) {
          deletedGlobalIndex = App.state.data.tasks.findIndex(t => t.id === id);
          if (deletedGlobalIndex > -1) {
            App.state.data.tasks.splice(deletedGlobalIndex, 1);
          }
        }

        // ボードキャッシュからも削除
        if (boardId && App.pages.boards && App.pages.boards.cachedBoardTasks) {
          const cache = App.pages.boards.cachedBoardTasks[boardId];
          if (cache) {
            deletedCacheIndex = cache.findIndex(t => t.id === id);
            if (deletedCacheIndex > -1) {
              cache.splice(deletedCacheIndex, 1);
            }
            // カンバン再描画
            if (App.pages.boards.viewMode === 'list') {
              if (App.pages.boards.renderList) {
                App.pages.boards.renderList(boardId, false);
              }
            } else {
              if (App.pages.boards.renderKanban) {
                App.pages.boards.renderKanban(boardId);
              }
            }
          }
        }

        // my-boardのキャッシュからも削除
        if (App.pages.boards && App.pages.boards.cachedBoardTasks) {
          const myBoardCache = App.pages.boards.cachedBoardTasks['my-board'];
          if (Array.isArray(myBoardCache)) {
            deletedMyBoardIndex = myBoardCache.findIndex(t => t.id === id);
            if (deletedMyBoardIndex > -1) {
              myBoardCache.splice(deletedMyBoardIndex, 1);
            }
            // my-boardが表示中なら再描画
            if (App.pages.boards.currentBoardId === 'my-board') {
              if (App.pages.boards.viewMode === 'list') {
                if (App.pages.boards.renderList) {
                  App.pages.boards.renderList('my-board', false);
                }
              } else {
                if (App.pages.boards.renderKanban) {
                  App.pages.boards.renderKanban('my-board');
                }
              }
            }
          }
        }

        // DB削除
        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'remove', {
          where: { id: ["=", id] }
        })
          .then(() => {
            console.log('Task deleted from server');
            showSnackbar('タスクを削除しました', 'success');
          })
          .catch(err => {
            console.error('Failed to delete task:', err);
            showSnackbar('削除に失敗しました。元に戻しています...', 'error');

            // ロールバック: グローバルデータに復元
            if (deletedTaskData && App.state.data.tasks && deletedGlobalIndex > -1) {
              App.state.data.tasks.splice(deletedGlobalIndex, 0, deletedTaskData);
            }

            // ロールバック: ボードキャッシュに復元
            if (deletedTaskData && boardId && App.pages.boards && App.pages.boards.cachedBoardTasks) {
              const cache = App.pages.boards.cachedBoardTasks[boardId];
              if (cache && deletedCacheIndex > -1) {
                cache.splice(deletedCacheIndex, 0, deletedTaskData);
              }
              // 再描画
              if (App.pages.boards.viewMode === 'list') {
                if (App.pages.boards.renderList) {
                  App.pages.boards.renderList(boardId, false);
                }
              } else {
                if (App.pages.boards.renderKanban) {
                  App.pages.boards.renderKanban(boardId);
                }
              }
            }

            // ロールバック: my-boardキャッシュに復元
            if (deletedTaskData && App.pages.boards && App.pages.boards.cachedBoardTasks) {
              const myBoardCache = App.pages.boards.cachedBoardTasks['my-board'];
              // 削除前のインデックスが保持されている場合のみ、同じ位置に戻す
              if (Array.isArray(myBoardCache) && typeof deletedMyBoardIndex === 'number' && deletedMyBoardIndex > -1) {
                myBoardCache.splice(deletedMyBoardIndex, 0, deletedTaskData);
              }
              // my-boardが表示中なら再描画
              if (App.pages.boards.currentBoardId === 'my-board') {
                if (App.pages.boards.viewMode === 'list') {
                  if (App.pages.boards.renderList) {
                    App.pages.boards.renderList('my-board', false);
                  }
                } else {
                  if (App.pages.boards.renderKanban) {
                    App.pages.boards.renderKanban('my-board');
                  }
                }
              }
            }
          });
      },

      /**
       * 変更を保存
       */
      save: async function (skipClose = false) {
        const id = this.currentId;
        if (!id) {
          console.error('[TaskDetail] Cannot save: No ID');
          return;
        }

        // 参照を保持（モーダルを閉じた後も使用するため）
        const currentItem = this.currentItem;
        const originalData = { ...this.originalData };

        // フィールドから値を取得
        const nameInput = document.getElementById('task-name-input');
        const descInput = document.getElementById('task-description-input');
        const statusSelect = document.getElementById('task-status-select');
        const prioritySelect = document.getElementById('task-priority-select');
        const boardSelect = document.getElementById('task-board-select');
        const startsAtInput = document.getElementById('task-starts-at-input');
        const endsAtInput = document.getElementById('task-ends-at-input');

        const updates = {};
        let hasChanges = false;

        // 各フィールドの変更をチェック
        if (nameInput && nameInput.value !== originalData.name) {
          updates.name = nameInput.value;
          hasChanges = true;
        }

        const description = this.getDescription();

        if (description !== (originalData.description || '')) {
          updates.description = description;
          hasChanges = true;
        }

        if (statusSelect && statusSelect.value !== originalData.task_status_key) {
          updates.task_status_key = statusSelect.value;
          hasChanges = true;
        }

        if (prioritySelect && prioritySelect.value !== originalData.priority_key) {
          updates.priority_key = prioritySelect.value;
          hasChanges = true;
        }

        if (boardSelect && boardSelect.value !== originalData.board_id) {
          updates.board_id = boardSelect.value;
          hasChanges = true;
        }

        // 日付フィールドの処理
        if (startsAtInput) {
          const newStartsAt = startsAtInput.value ? new Date(startsAtInput.value).toISOString() : '';
          const oldStartsAt = originalData.starts_at || '';
          if (newStartsAt !== oldStartsAt) {
            updates.starts_at = newStartsAt;
            hasChanges = true;
          }
        }

        if (endsAtInput) {
          const newEndsAt = endsAtInput.value ? new Date(endsAtInput.value).toISOString() : '';
          const oldEndsAt = originalData.ends_at || '';
          if (newEndsAt !== oldEndsAt) {
            updates.ends_at = newEndsAt;
            hasChanges = true;
          }
        }

        // メンバーフィールドの変更をチェック
        const memberRoles = ['processed_by', 'reviewed_by', 'received_by'];
        memberRoles.forEach(role => {
          if (currentItem[role] !== originalData[role]) {
            updates[role] = currentItem[role];
            hasChanges = true;
          }
        });

        // リストの変更をチェック
        const listChanges = this.getListChanges();
        const hasListChanges = listChanges.toInsert.length > 0 ||
          listChanges.toUpdate.length > 0 ||
          listChanges.toDelete.length > 0;

        // 関連タスクの変更をチェック
        const relatedChanges = this.getRelatedTaskChanges();
        const hasRelatedChanges = relatedChanges.hasParentChange ||
          relatedChanges.childTasksToAdd.length > 0 ||
          relatedChanges.childTasksToRemove.length > 0;
        const hasPendingComments = (this.pendingComments || []).length > 0;

        // 親タスクの変更をupdatesに含める
        if (relatedChanges.hasParentChange) {
          updates.parent_task_id = currentItem.parent_task_id || '';
          hasChanges = true;
        }

        if (!hasChanges && !hasListChanges && !hasRelatedChanges && !hasPendingComments) {
          this.close(false, true, skipClose);
          return;
        }

        // Optimistic UI update
        Object.assign(currentItem, updates);
        updateLocalData(TABLE_NAMES.TASKS, id, updates);

        // 変更フラグをクリアしてモーダルを閉じる
        this.isDirty = false;
        this.updateActionButtons();
        appUi('#modal-detail-task', false);

        // URLパラメータを更新
        if (App.utils.url && App.utils.url.updateParams) {
          const currentParams = App.utils.url.getParams();
          const newParams = {
            tab: currentParams.tab || 'home'
          };
          if (currentParams.board_id) {
            newParams.board_id = currentParams.board_id;
          }
          App.utils.url.updateParams(newParams, false);
        }

        showSnackbar('変更を保存しています...', 'info', 'top', 0);

        // ── Optimistic UI: callGAS前にローカルキャッシュを更新＆即座に描画 ──
        const newBoardId = currentItem.board_id;
        const oldBoardId = originalData.board_id;
        const boardIdChanged = !!updates.board_id && oldBoardId !== newBoardId;

        if (App.pages.boards && App.pages.boards.cachedBoardTasks) {
          if (boardIdChanged) {
            // board_id変更: 旧ボードキャッシュからタスクを削除し、新ボードキャッシュへ追加
            const oldCache = App.pages.boards.cachedBoardTasks[oldBoardId];
            if (Array.isArray(oldCache)) {
              const oldIdx = oldCache.findIndex(t => t.id === id);
              if (oldIdx > -1) {
                oldCache.splice(oldIdx, 1);
              }
            }
            const newCache = App.pages.boards.cachedBoardTasks[newBoardId];
            if (Array.isArray(newCache)) {
              newCache.push({ ...currentItem });
            }
          } else if (newBoardId) {
            // board_id変更なし: 該当タスクのフィールドを更新
            const cache = App.pages.boards.cachedBoardTasks[newBoardId];
            if (Array.isArray(cache)) {
              const cachedTask = cache.find(t => t.id === id);
              if (cachedTask) {
                Object.assign(cachedTask, updates);
              }
            }
          }
          // my-boardのキャッシュも更新
          const myBoardCache = App.pages.boards.cachedBoardTasks['my-board'];
          if (Array.isArray(myBoardCache)) {
            const myBoardTask = myBoardCache.find(t => t.id === id);
            if (myBoardTask) {
              Object.assign(myBoardTask, updates);
            }
          }
        }

        // カンバン／リストをローカルキャッシュから即座に再描画（Optimistic UI）
        // 再描画対象ボードを収集し、重複を避けて描画
        if (App.pages.boards) {
          const boardsToRender = new Set();
          if (oldBoardId) boardsToRender.add(oldBoardId);
          if (newBoardId) boardsToRender.add(newBoardId);
          if (App.pages.boards.currentBoardId === 'my-board') {
            boardsToRender.add('my-board');
          }
          boardsToRender.forEach(bid => {
            if (App.pages.boards.viewMode === 'list') {
              if (App.pages.boards.renderList) App.pages.boards.renderList(bid, false);
            } else {
              if (App.pages.boards.renderKanban) App.pages.boards.renderKanban(bid);
            }
          });
        }

        try {
          // タスクの更新
          if (hasChanges) {
            const result = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'update', {
              where: { id: ["=", id] },
              set: updates
            }, 'タスクを更新');

            if (!result || (Array.isArray(result) && result.length === 0)) {
              throw new Error('Task update failed');
            }
          }

          // リストの変更を保存
          if (hasListChanges) {
            await this.saveListChanges(listChanges);
          }

          // 関連タスクの変更を保存
          if (hasRelatedChanges) {
            await this.saveRelatedTaskChanges(id, relatedChanges);
          }

          // コメントの変更を保存
          if (hasPendingComments) {
            await this.savePendingComments();
          }

          console.log('[TaskDetail] Update successful');
          showSnackbar('変更を保存しました', 'success');

          // もしこのタスクのモーダルが再度開かれていたら、内部状態を更新
          if (this.currentId === id) {
            this.originalData = { ...currentItem };
            this.originalLists = JSON.parse(JSON.stringify(this.currentLists));
            this.originalLinks = JSON.parse(JSON.stringify(this.currentLinks));
            this.originalFiles = JSON.parse(JSON.stringify(this.currentFiles));
            this.deletedListIds = [];
            this.pendingComments = [];
            this.isDirty = false;
            this.updateActionButtons();
          }

          // ── cachedBoardTasks も更新（updateLocalDataはApp.state.data.tasksのみ更新するため）──
          const boardId = currentItem.board_id;
          if (boardId && App.pages.boards && App.pages.boards.cachedBoardTasks) {
            const cache = App.pages.boards.cachedBoardTasks[boardId];
            if (Array.isArray(cache)) {
              const cachedTask = cache.find(t => t.id === id);
              if (cachedTask) {
                Object.assign(cachedTask, updates);
              }
            }
            // my-boardのキャッシュも更新
            const myBoardCache = App.pages.boards.cachedBoardTasks['my-board'];
            if (Array.isArray(myBoardCache)) {
              const myBoardTask = myBoardCache.find(t => t.id === id);
              if (myBoardTask) {
                Object.assign(myBoardTask, updates);
              }
            }
          }

          // カンバン／リストをローカルキャッシュから即座に再描画（Optimistic UI）
          if (boardId && App.pages.boards) {
            if (App.pages.boards.viewMode === 'list') {
              App.pages.boards.renderList(boardId, false);
              if (App.pages.boards.currentBoardId === 'my-board') {
                App.pages.boards.renderList('my-board', false);
              }
            } else {
              App.pages.boards.renderKanban(boardId);
              if (App.pages.boards.currentBoardId === 'my-board') {
                App.pages.boards.renderKanban('my-board');
              }
            }

            // メンバーフィールドが更新された場合はバックグラウンドでDBから最新データを再取得（JOIN情報を同期）
            const memberFieldsUpdated = ['processed_by', 'reviewed_by', 'received_by'].some(role => updates.hasOwnProperty(role));
            if (memberFieldsUpdated && App.pages.boards.loadData) {
              App.pages.boards.loadData(boardId, true).then(() => {
                if (this.currentId === id) {
                  const updatedTask = App.pages.boards.cachedBoardTasks[boardId]?.find(t => t.id === id);
                  if (updatedTask) {
                    this.currentItem = updatedTask;
                    this.originalData = { ...updatedTask };
                  }
                }
              });
              if (App.pages.boards.currentBoardId === 'my-board') {
                App.pages.boards.loadData('my-board', true);
              }
            }
          }

        } catch (error) {
          console.error('[TaskDetail] Update exception:', error);
          showSnackbar('更新に失敗しました', 'error');
          // Rollback
          Object.assign(currentItem, originalData);
          rollbackLocalData(TABLE_NAMES.TASKS, id, originalData);

          // cachedBoardTasks もロールバック
          if (originalData.board_id && App.pages.boards && App.pages.boards.cachedBoardTasks) {
            const rollbackCache = App.pages.boards.cachedBoardTasks[originalData.board_id];
            if (Array.isArray(rollbackCache)) {
              const rollbackTask = rollbackCache.find(t => t.id === id);
              if (rollbackTask) {
                Object.assign(rollbackTask, originalData);
              }
            }
          }

          // カンバン再描画して元に戻す
          if (originalData.board_id && App.pages.boards) {
            if (App.pages.boards.viewMode === 'list') {
              App.pages.boards.renderList(originalData.board_id, false);
              if (App.pages.boards.currentBoardId === 'my-board') {
                App.pages.boards.renderList('my-board', false);
              }
            } else {
              App.pages.boards.renderKanban(originalData.board_id);
              if (App.pages.boards.currentBoardId === 'my-board') {
                App.pages.boards.renderKanban('my-board');
              }
            }
          }
        }
      },

      /**
       * タスクデータをフォームに描画
       * @param {Object} task - タスクオブジェクト
       */
      render: function (task) {
        console.log('[TaskDetail] Rendering task:', task);

        // Modal Title (Task Name)
        const modalTitle = document.getElementById('task-modal-title');
        if (modalTitle) {
          modalTitle.textContent = task.name;
        }

        // Display ID
        const displayIdEl = document.getElementById('task-display-id');
        if (displayIdEl) {
          displayIdEl.textContent = `#${task.display_id}`;
        }

        // Link Copy Button
        this.setupLinkCopyButton(task);
        // Duplicate Button
        this.setupDuplicateButton(task);

        // Name
        const nameInput = document.getElementById('task-name-input');
        if (nameInput) nameInput.value = task.name || '';

        // Description
        // Quillへ値をセット
        if (this.quill) {
          App.utils.quill.setContent(this.quill, task.description);
        }

        // Status
        const statusSelect = document.getElementById('task-status-select');
        if (statusSelect) statusSelect.value = task.task_status_key || 'TODO';
        this.renderStatusIcon(task.task_status_key);

        // Priority
        const prioritySelect = document.getElementById('task-priority-select');
        if (prioritySelect) prioritySelect.value = task.priority_key || 'MEDIUM';
        this.renderPriorityIcon(task.priority_key);

        // Board
        this.renderBoardOptions(task.board_id);

        // Member Avatars
        const members = App.state.data.members || [];
        const getMember = (id) => members.find(m => m.id === id);

        const createdBy = getMember(task.created_by);
        this.renderMemberAvatar('created_by', createdBy?.display_name, createdBy?.profile_photo_url);

        const processedBy = getMember(task.processed_by);
        this.renderMemberAvatar('processed_by', processedBy?.display_name, processedBy?.profile_photo_url);

        const reviewedBy = getMember(task.reviewed_by);
        this.renderMemberAvatar('reviewed_by', reviewedBy?.display_name, reviewedBy?.profile_photo_url);

        const receivedBy = getMember(task.received_by);
        this.renderMemberAvatar('received_by', receivedBy?.display_name, receivedBy?.profile_photo_url);

        // Dates
        const endsAtInput = document.getElementById('task-ends-at-input');
        if (endsAtInput) {
          endsAtInput.value = formatDateTimeForInput(task.ends_at) || '';
          // BeerCSSのラベル位置を更新するためにchangeイベントを発火
          endsAtInput.dispatchEvent(new Event('change', { bubbles: true }));
        }

        const startsAtInput = document.getElementById('task-starts-at-input');
        if (startsAtInput) {
          startsAtInput.value = formatDateTimeForInput(task.starts_at) || '';
          // BeerCSSのラベル位置を更新するためにchangeイベントを発火
          startsAtInput.dispatchEvent(new Event('change', { bubbles: true }));
        }

        this.renderLastUpdated();
        this.syncDirtyState('render');
      },

      /**
       * リンクコピーボタンをセットアップ
       * @param {Object} task - タスクオブジェクト
       */
      setupLinkCopyButton: function (task) {
        const btnCopyLink = document.getElementById('task-copy-link-btn');
        if (!btnCopyLink) return;

        // 既存のイベントリスナーを削除（重複防止）
        const newBtn = btnCopyLink.cloneNode(true);
        btnCopyLink.parentNode.replaceChild(newBtn, btnCopyLink);

        newBtn.addEventListener('click', () => {
          this.shareTask(task);
        });
      },

      /**
       * タスクを共有
       * @param {Object} task - タスクオブジェクト
       */
      shareTask: function (task) {
        if (!task) return;

        const currentParams = App.utils.url.getParams();
        const url = `${scriptUrl}?tab=${currentParams.tab || 'board'}&board_id=${task.board_id}&modal=task-detail&task_id=${task.id}`;
        const text = `[タスク#${task.display_id}] ${task.name} | ZARMS`;

        const htmlContent = `<a href="${url}">[タスク#${task.display_id}] ${escapeHtml(task.name)} | ZARMS</a>`;
        const textContent = `${text}\n${url}`;

        const blobHtml = new Blob([htmlContent], { type: "text/html" });
        const blobText = new Blob([textContent], { type: "text/plain" });

        const data = [new ClipboardItem({
          ["text/html"]: blobHtml,
          ["text/plain"]: blobText
        })];

        navigator.clipboard.write(data).then(() => {
          showSnackbar('このタスクへのリンクをコピーしました', 'success');
        }).catch(err => {
          console.error('Clipboard write failed', err);
          navigator.clipboard.writeText(textContent).then(() => {
            showSnackbar('リンクをコピーしました（テキスト形式）', 'success');
          }).catch(() => {
            showSnackbar('リンクのコピーに失敗しました', 'error');
          });
        });
      },

      /**
       * タスクを複製
       * @param {Object} task - タスクオブジェクト
       */
      duplicateTask: async function (task) {
        if (!task) return;

        // モーダルが開いているかつ、対象が現在のタスクの場合
        const isCurrentTask = this.currentId === task.id;
        if (isCurrentTask) {
          const result = await this.close(false, false, true);
          if (!result) return;
        }

        const promptValue = prompt('新しいタスク名', task.name + ' のコピー');

        // キャンセル(null)または空文字の場合は中断
        if (promptValue === null) {
          return;
        } else if (promptValue === '') {
          alert('タスク名を入力してください');
          return;
        }

        // モーダルが開いているかつ、対象が現在のタスクの場合、完全に閉じる
        if (isCurrentTask) {
          this.close(false, true);
        }

        // 現在のタスクデータをコピー
        const newTask = { ...task };

        // 新しい値を設定
        newTask.name = promptValue;
        newTask.id = crypto.randomUUID();
        newTask.display_id = '#';
        newTask.created_at = new Date().toISOString();
        newTask.updated_at = new Date().toISOString();
        newTask.updated_by = App.state.userId;
        newTask.created_by = App.state.userId;
        newTask.created_by_display_name = activeUser.display_name;
        newTask.created_by_profile_photo_url = activeUser.profile_photo_url;

        // ローカルデータに追加
        if (!App.state.data.tasks) {
          App.state.data.tasks = [];
        }
        App.state.data.tasks.push(newTask);

        // ボードキャッシュにも追加 (表示中のボードと同じであれば、またはMy Board表示中であれば)
        const currentBoardId = App.pages.boards && App.pages.boards.currentBoardId;
        if (currentBoardId && (newTask.board_id === currentBoardId || currentBoardId === 'my-board')) {
          const cache = App.pages.boards.cachedBoardTasks[currentBoardId];
          if (Array.isArray(cache)) {
            cache.push(newTask);
            console.log('newTask is added to cachedBoardTasks', currentBoardId, newTask.id);
          }
        }

        if (currentBoardId && App.pages.boards && App.pages.boards.renderKanban) {
          App.pages.boards.renderKanban(currentBoardId);
        }

        await new Promise(resolve => setTimeout(resolve, 500));
        this.open(newTask.id, false, true);

        // サーバーに保存
        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'insert', newTask)
          .then(result => {
            if (result && result.data && result.data.display_id) {
              // サーバー生成のdisplay_idで更新
              newTask.display_id = result.data.display_id;

              // モーダルが開いていればUI更新
              if (this.currentId === newTask.id) {
                const displayIdEl = document.getElementById('task-display-id');
                if (displayIdEl) displayIdEl.textContent = `#${newTask.display_id}`;

                this.setupLinkCopyButton(newTask);

                if (this.originalData) {
                  this.originalData.display_id = result.data.display_id;
                }
              }

              if (currentBoardId && App.pages.boards && App.pages.boards.renderKanban) {
                App.pages.boards.renderKanban(currentBoardId);
              }
            }
          })
          .catch(err => {
            console.error('Failed to duplicate task:', err);
            showSnackbar('タスクの複製に失敗しました', 'error');
          });
      },

      /**
       * メンバーアバターを描画
       * @param {string} role - 役割（created_by, processed_by, reviewed_by, received_by）
       * @param {string} displayName - 表示名
       * @param {string} photoUrl - プロフィール写真URL
       */
      renderMemberAvatar: function (role, displayName, photoUrl) {
        // IDはケバブケース（ハイフンつなぎ）で定義されているため変換
        const idSuffix = role.replace(/_/g, '-');
        const avatarBtn = document.getElementById(`avatar-${idSuffix}`);
        const label = document.getElementById(`label-${idSuffix}`);

        if (!avatarBtn) return;

        // クラスとコンテンツを設定
        // 画像がある場合は transparent、ない場合は tertiary クラスを使用
        const baseClass = 'circle no-margin';
        if (photoUrl) {
          avatarBtn.className = `${baseClass} transparent`;
          avatarBtn.innerHTML = `<img src="${photoUrl}" class="responsive" alt="${escapeHtml(displayName || '未設定')}">`;
        } else {
          avatarBtn.className = `${baseClass} tertiary`;
          avatarBtn.innerHTML = '<i>person</i>';
        }

        if (label) {
          label.textContent = displayName || '未設定';
        }
      },

      /**
       * メンバー選択モーダルを開く
       * @param {string} role - 役割（created_by, processed_by, reviewed_by, received_by）
       */
      selectMember: function (role) {
        if (!App.modals.selectMembers) {
          console.error('[TaskDetail] selectMembers modal not available');
          return;
        }

        // CREATED_BYの担当者は変更不可
        if (role === 'created_by') {
          showSnackbar(`${KEY_LABELS.ASIGNEE_TYPE.CREATED_BY}は変更できません`, 'info');
          return;
        }

        const currentMemberId = this.currentItem ? this.currentItem[role] : null;

        App.modals.selectMembers.open({
          multiSelect: false,
          preSelected: currentMemberId ? [currentMemberId] : [],
          callback: (selectedIds) => {
            if (selectedIds && selectedIds.length > 0) {
              this.updateMemberField(role, selectedIds[0]);
            }
          }
        });
      },

      /**
       * メンバーフィールドを更新（ローカル状態のみ、DB保存は「変更を保存」時）
       * @param {string} role - 役割
       * @param {string} memberId - メンバーID
       */
      updateMemberField: function (role, memberId) {
        if (!this.currentItem) {
          console.error('[TaskDetail] Cannot update: No current item');
          return;
        }

        // ローカル状態を更新
        this.currentItem[role] = memberId;

        // メンバー情報を取得してアバターを更新
        const members = App.state.data.members || [];
        const member = members.find(m => m.id === memberId);

        if (member) {
          // JOIN済みデータのように、display_name と profile_photo_url を設定
          this.currentItem[`${role}_display_name`] = member.display_name;
          this.currentItem[`${role}_profile_photo_url`] = member.profile_photo_url;

          // アバターを再描画
          this.renderMemberAvatar(role, member.display_name, member.profile_photo_url);
        } else {
          // メンバーが見つからない場合は未設定として表示
          this.currentItem[`${role}_display_name`] = null;
          this.currentItem[`${role}_profile_photo_url`] = null;
          this.renderMemberAvatar(role, null, null);
        }

        this.syncDirtyState(`updateMemberField: ${role}`);
        console.log(`[TaskDetail] Member field ${role} updated locally to ${memberId}`);
      },

      /**
       * ボード選択オプションを生成
       * @param {string} selectedBoardId - 選択中のボードID
       */
      renderBoardOptions: function (selectedBoardId) {
        const boardSelect = document.getElementById('task-board-select');
        if (!boardSelect) return;

        boardSelect.innerHTML = `<option value="my-board" ${(!selectedBoardId || selectedBoardId === 'my-board' || selectedBoardId === 'null') ? 'selected' : ''}>マイボード</option>`;

        const boards = App.state.data.boards || [];
        boardSelect.innerHTML += boards.map(board =>
          `<option value="${escapeHtml(board.id)}" ${board.id === selectedBoardId ? 'selected' : ''}>${escapeHtml(board.name || '')}</option>`
        ).join('');
      },

      /**
       * 新規コメントモーダルを開く
       */
      openNewComment: function () {
        if (!App.modals.newComment) {
          console.error('[TaskDetail] newComment modal not available');
          return;
        }

        const taskId = this.currentId;
        const boardId = this.currentItem ? this.currentItem.board_id : null;

        if (!taskId) {
          console.error('[TaskDetail] No task ID');
          return;
        }

        App.modals.newComment.open(taskId, boardId);
      },

      /**
       * リストデータを読み込み
       * @param {string} taskId - タスクID
       */
      loadLists: function (taskId) {
        this.isListLoadingFresh = true;
        const listContainer = document.getElementById('task-list-items');
        listContainer.innerHTML = '<div class="small-padding center row small-space"><progress class="circle indeterminate small"></progress><span class="small-text">読み込み中</span></div>';
        this._renderListAddButton(true);

        const query = {
          where: {
            task_id: ["=", taskId]
          },
          orderBy: {
            index: "asc"
          }
        };

        console.log('[TaskDetail] Loading lists for task:', taskId);
        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.LISTS, 'select', query)
          .then(results => {
            console.log('[TaskDetail] Lists query results:', results);
            if (this.currentId !== taskId) return;

            const lists = results?.data || results || [];
            console.log('[TaskDetail] Lists loaded:', lists);
            this.currentLists = lists;
            // originalDataにもリストを保存（変更検知用）
            this.originalLists = JSON.parse(JSON.stringify(lists));
            this.isListLoadingFresh = results?.isCached || false;
            this.renderLists(this.isListLoadingFresh);
            this.updateListBadge();
            this.syncDirtyState('loadLists:initial');

            if (results?.isCached) {
              console.log('[TaskDetail] Lists are cached, refetching...');
              callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.LISTS, 'select', query, null, true)
                .then(results => {
                  if (this.currentId !== taskId) return;
                  const refleshedLists = results?.data || results || [];
                  console.log('[TaskDetail] Lists refetched:', refleshedLists);
                  this.currentLists = refleshedLists;
                  this.originalLists = JSON.parse(JSON.stringify(refleshedLists));
                  this.isListLoadingFresh = false;
                  this.renderLists();
                  this.updateListBadge();
                  this.syncDirtyState('loadLists:refetch');
                })
            }
          })
          .catch(error => {
            console.error('[TaskDetail] Error loading lists:', error);
          });
      },

      /**
       * リスト項目を描画
       */
      renderLists: function (disabled = false) {
        const container = document.getElementById('task-list-items');
        if (!container) return;

        // キャッシュ由来データ表示中は、追加ボタンを常に無効化する
        const effectiveDisabled = !!disabled || this.isListLoadingFresh === true;

        // SortableJSインスタンスを破棄
        if (this.listSortable) {
          this.listSortable.destroy();
          this.listSortable = null;
        }

        if (!this.currentLists || this.currentLists.length === 0) {
          container.innerHTML = '<p>リスト項目はありません</p>';
          this._renderListAddButton(effectiveDisabled);
          return;
        }

        const members = App.state.data.members || [];

        const html = this.currentLists.map((list,index) => {
          const assignee = members.find(m => m.id === list.assign_to);
          const avatarHtml = assignee?.profile_photo_url
            ? `<img src="${assignee.profile_photo_url}" class="responsive" alt="${escapeHtml(assignee.display_name)}">`
            : '<i>person</i>';

          return `
            <div class="list-item row background small-space ${index > 0 ? 'top-margin' : ''}" data-list-id="${list.id}">
              <i class="drag-handle" style="cursor: move;">drag_indicator</i>
              <label class="checkbox">
                <input type="checkbox" 
                  ${list.is_done ? 'checked' : ''} 
                  onchange="App.modals.taskDetail.updateListField('${list.id}', 'is_done', this.checked)"
                  ${disabled ? 'disabled' : ''}>
                <span></span>
              </label>
              <div class="field small no-margin max">
                <input type="text" 
                  value="${escapeHtml(list.name || '')}" 
                  placeholder="リスト項目名"
                  onchange="App.modals.taskDetail.updateListField('${list.id}', 'name', this.value)"
                  ${disabled ? 'disabled' : ''}>
              </div>
              <button class="circle small transparent chip" 
                onclick="App.modals.taskDetail.selectListAssignee('${list.id}')"
                ${disabled ? 'disabled' : ''}>
                ${avatarHtml}
                <div class="tooltip left">${assignee ? escapeHtml(assignee.display_name) : '未設定'}</div>
              </button>
              <button class="circle small transparent" 
                onclick="App.modals.taskDetail.deleteListItem('${list.id}')"
                ${disabled ? 'disabled' : ''}>
                <i>delete</i>
              </button>
            </div>
          `;
        }).join('');

        container.innerHTML = html;
        this.setupListSortable();
        this._renderListAddButton(effectiveDisabled);
      },

      /**
       * リストページ末尾にインライン「項目を作成」ボタンを配置
       * SortableJSの管理外（task-detail-list直下）に置くことでドラッグ対象から除外する
       */
      _renderListAddButton: function (disabled = false) {
        const listPage = document.getElementById('task-detail-list');
        if (!listPage) return;

        // 既存のインラインボタンを削除（重複防止）
        const existing = listPage.querySelector('.list-inline-add-btn');
        if (existing) existing.remove();

        const btn = document.createElement('button');
        btn.className = 'top-margin primary center list-inline-add-btn';
        btn.disabled = disabled;
        btn.innerHTML = '<i>add</i><span>項目を作成</span>';
        btn.onclick = () => this.createListItem();
        listPage.appendChild(btn);
      },

      /**
       * SortableJSを初期化
       */
      setupListSortable: function () {
        const container = document.getElementById('task-list-items');
        if (!container) return;

        this.listSortable = Sortable.create(container, {
          animation: 150,
          handle: '.drag-handle',
          ghostClass: 'surface-container',
          onEnd: (evt) => this.onListReorder(evt)
        });
      },

      /**
       * リストの並び替え処理
       */
      onListReorder: function (evt) {
        // isDirtyフラグを立てる
        this.markDirty('onListReorder');

        const oldIndex = evt.oldIndex;
        const newIndex = evt.newIndex;

        if (oldIndex === newIndex) return;

        // ローカルデータの並び替え
        const [movedItem] = this.currentLists.splice(oldIndex, 1);
        this.currentLists.splice(newIndex, 0, movedItem);

        // 移動したアイテムのindexのみを更新（前後のアイテムの中間値を使用）
        const prevItem = this.currentLists[newIndex - 1];
        const nextItem = this.currentLists[newIndex + 1];

        if (!prevItem && !nextItem) {
          movedItem.index = 0;
        } else if (!prevItem) {
          movedItem.index = nextItem.index - 1;
        } else if (!nextItem) {
          movedItem.index = prevItem.index + 1;
        } else {
          movedItem.index = (prevItem.index + nextItem.index) / 2;
        }

        // データベースへの保存は「変更を保存」ボタンで実行される
        console.log('[TaskDetail] List order updated (not saved yet)');
      },

      /**
       * 新しいリスト項目を作成
       */
      createListItem: async function () {
        if (!this.currentId) return;

        // isDirtyフラグを立てる
        this.markDirty('createListItem');

        const newList = {
          id: crypto.randomUUID(),
          task_id: this.currentId,
          index: (this.currentLists[this.currentLists.length - 1]?.index ?? -1) + 1,
          is_done: false,
          name: '',
          assign_to: null,
          _isNew: true // 新規作成フラグ
        };

        // ローカルデータに追加
        this.currentLists.push(newList);
        await this.renderLists();
        await this.updateListBadge();

        const container = document.getElementById('task-list-items');
        container.scrollTo(0, container.scrollHeight);

        const listItems = container.querySelectorAll('div.list-item');
        const addedListItem = listItems[listItems.length - 1].querySelector('div.field > input');

        addedListItem.focus();
        addedListItem.select();

        // データベースへの保存は「変更を保存」ボタンで実行される
        console.log('[TaskDetail] List item created (not saved yet)');
      },

      /**
       * リスト項目のフィールドを更新
       * @param {string} listId - リストID
       * @param {string} field - フィールド名
       * @param {any} value - 新しい値
       */
      updateListField: function (listId, field, value) {
        const list = this.currentLists.find(l => l.id === listId);
        if (!list) return;

        // isDirtyフラグを立てる
        this.markDirty(`updateListField: ${field}`);

        list[field] = value;

        if (field === 'is_done') {
          this.updateListBadge();
        }

        // データベースへの保存は「変更を保存」ボタンで実行される
        console.log(`[TaskDetail] List field ${field} updated (not saved yet)`);
      },

      /**
       * リスト項目を削除
       * @param {string} listId - リストID
       */
      deleteListItem: function (listId) {
        const list = this.currentLists.find(l => l.id === listId);
        if (!list) return;

        // isDirtyフラグを立てる
        this.markDirty('deleteListItem');

        // ローカルデータから削除
        this.currentLists = this.currentLists.filter(l => l.id !== listId);

        // インデックスの振り直しは行わない

        this.renderLists();
        this.updateListBadge();

        // 新規作成されたものでなければ削除リストに追加
        if (!list._isNew) {
          this.deletedListIds.push(listId);
        }

        // データベースへの削除は「変更を保存」ボタンで実行される
        console.log('[TaskDetail] List item deleted (not saved yet)');
      },

      /**
       * リスト項目の担当者を選択
       * @param {string} listId - リストID
       */
      selectListAssignee: function (listId) {
        if (!App.modals.selectMembers) {
          console.error('[TaskDetail] selectMembers modal not available');
          return;
        }

        const list = this.currentLists.find(l => l.id === listId);
        if (!list) return;

        App.modals.selectMembers.open({
          multiSelect: false,
          preSelected: list.assign_to ? [list.assign_to] : [],
          callback: (selectedIds) => {
            if (selectedIds && selectedIds.length > 0) {
              this.updateListField(listId, 'assign_to', selectedIds[0]);
              this.renderLists();
            }
          }
        });
      },

      /**
       * リストバッジを更新
       */
      updateListBadge: function () {
        const badge = document.getElementById('task-list-badge');
        if (!badge) return;

        const lists = this.currentLists;
        let count = 0;
        for (const list of lists) {
          if (!list.is_done) {
            count++;
          }
        }
        badge.textContent = count;
        count > 0 ? badge.style.display = '' : badge.style.display = 'none';
      },

      /**
       * リストの変更を取得
       * @returns {Object} 変更内容
       */
      getListChanges: function () {
        const toInsert = [];
        const toUpdate = [];
        const toDelete = [...this.deletedListIds];

        // 現在のリストと元のリストを比較
        this.currentLists.forEach(currentList => {
          if (currentList._isNew) {
            // 新規作成
            const { _isNew, ...listData } = currentList;
            toInsert.push(listData);
          } else {
            // 既存のリストを探す
            const originalList = this.originalLists.find(l => l.id === currentList.id);
            if (originalList) {
              // 変更があるかチェック
              const hasChanges =
                currentList.index !== originalList.index ||
                currentList.is_done !== originalList.is_done ||
                currentList.name !== originalList.name ||
                currentList.assign_to !== originalList.assign_to;

              if (hasChanges) {
                toUpdate.push(currentList);
              }
            }
          }
        });

        return { toInsert, toUpdate, toDelete };
      },

      /**
       * リストの変更を保存
       * @param {Object} listChanges - 変更内容
       */
      saveListChanges: async function (listChanges) {
        const { toInsert, toUpdate, toDelete } = listChanges;

        // 挿入
        await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.LISTS, 'bulkinsert', toInsert);

        // 削除
        for (const listId of toDelete) {
          await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.LISTS, 'remove', {
            where: { id: ["=", listId] }
          });
        }

        // 更新
        for (const list of toUpdate) {
          const { id, task_id, ...updates } = list;
          await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.LISTS, 'update', {
            where: { id: ["=", list.id] },
            set: updates
          });
        }

        console.log('[TaskDetail] List changes saved');
      },

      /**
       * 関連タスクの変更を取得
       */
      getRelatedTaskChanges: function () {
        const currentParentId = this.currentItem?.parent_task_id || null;
        const originalParentId = this.originalParentTaskId || null;
        const hasParentChange = currentParentId !== originalParentId;

        // 明示的に差分を管理し、再描画やキャッシュ更新の影響を受けないようにする
        const childTasksToAdd = [...new Set(this.addedChildTaskIds)];
        const childTasksToRemove = [...new Set(this.deletedChildTaskIds)];

        return {
          hasParentChange,
          childTasksToAdd,
          childTasksToRemove
        };
      },

      /**
       * 関連タスクの変更を保存
       */
      saveRelatedTaskChanges: async function (currentTaskId, relatedChanges) {
        const { childTasksToAdd, childTasksToRemove } = relatedChanges;
        console.log(`[saveRelatedTaskChanges] ${JSON.stringify(relatedChanges)}`);

        // すべての現在の子タスクのparent_task_idをcurrentIdに設定
        for (const childTaskId of childTasksToAdd) {
          const updateResult = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'update', {
            where: { id: ["=", childTaskId] },
            set: { parent_task_id: currentTaskId }
          });

          if (!updateResult || (Array.isArray(updateResult) && updateResult.length === 0)) {
            throw new Error(`Failed to assign parent_task_id for child task: ${childTaskId}`);
          }

          updateLocalData(TABLE_NAMES.TASKS, childTaskId, { parent_task_id: currentTaskId });
        }

        // 削除された子タスクのparent_task_idをnullに設定
        for (const childTaskId of childTasksToRemove) {
          const updateResult = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'update', {
            where: { id: ["=", childTaskId] },
            set: { parent_task_id: '' }
          });

          if (!updateResult || (Array.isArray(updateResult) && updateResult.length === 0)) {
            throw new Error(`Failed to clear parent_task_id for child task: ${childTaskId}`);
          }

          updateLocalData(TABLE_NAMES.TASKS, childTaskId, { parent_task_id: '' });
        }

        this.addedChildTaskIds = [];
        this.deletedChildTaskIds = [];

        console.log('[TaskDetail] Related task changes saved');
      },

      savePendingComments: async function () {
        const comments = this.pendingComments || [];
        if (comments.length === 0) return;

        for (const comment of comments) {
          const result = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.COMMENTS, 'insert', {
            content: comment.content,
            related_table: comment.related_table,
            related_id: comment.related_id
          }, 'コメントを作成');

          if (!result || (Array.isArray(result) && result.length === 0)) {
            throw new Error('Failed to save pending comment');
          }
        }

        this.pendingComments = [];
      },

      /**
       * 関連タスク（親タスク・子タスク）を読み込み
       * @param {string} taskId - タスクID
       */
      loadRelatedTasks: async function (taskId) {
        if (!taskId) return;

        const parentTaskContainer = document.getElementById('parent-task-container');
        parentTaskContainer.innerHTML = '<div class="center row small-space"><progress class="circle indeterminate small"></progress><span class="small-text">読み込み中</span></div>';

        const childTasksContainer = document.getElementById('child-tasks-container');
        childTasksContainer.innerHTML = '<div class="center row small-space"><progress class="circle indeterminate small"></progress><span class="small-text">読み込み中</span></div>';

        const currentItem = this.currentItem;
        const parentTaskId = currentItem?.parent_task_id;
        const query_parent = {
          where: {
            id: ["=", parentTaskId]
          }
        };
        const query_child = {
          where: {
            parent_task_id: ["=", taskId]
          },
          orderBy: {
            display_id: 'asc'
          }
        };

        let parentTask;
        // 親タスクを取得
        if (parentTaskId) {
          parentTask = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'select', query_parent);
          if (this.currentId !== taskId) return;
          this.currentParentTask = parentTask ? parentTask.data[0] : null;
        } else {
          this.currentParentTask = null;
        }

        this.originalParentTaskId = parentTaskId || null;
        this.renderParentTask();

        // 子タスクを取得
        const childTasks = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'select', query_child);
        if (this.currentId !== taskId) return;

        this.currentChildTasks = childTasks ? childTasks.data : [];
        this.originalChildTaskIds = (childTasks ? childTasks.data : []).map(t => t.id);
        this.addedChildTaskIds = [];
        this.deletedChildTaskIds = [];

        this.renderChildTasks();
        this.updateRelatedBadge();
        this.syncDirtyState('loadRelatedTasks:initial');

        if (parentTask?.isCached) {
          await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'select', query_parent, null, true)
            .then(results => {
              if (this.currentId !== taskId) return;
              this.currentParentTask = results ? results?.data[0] : null;
              this.renderParentTask();
              this.syncDirtyState('loadRelatedTasks:parentRefetch');
            })
        }

        if (childTasks?.isCached) {
          await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'select', query_child, null, true)
            .then(results => {
              if (this.currentId !== taskId) return;
              this.currentChildTasks = results ? results?.data : [];
              this.originalChildTaskIds = (results ? results?.data : []).map(t => t.id);
              this.renderChildTasks();
              this.syncDirtyState('loadRelatedTasks:childRefetch');
            })
        }

        this.updateRelatedBadge();
        this.syncDirtyState('loadRelatedTasks:done');
      },

      /**
       * 親タスクフィールドを描画
       */
      renderParentTask: function () {
        const container = document.getElementById('parent-task-container');
        if (!container) return;

        if (this.currentParentTask) {
          const displayId = this.currentParentTask.display_id ? `#${this.currentParentTask.display_id}` : '';
          const taskName = escapeHtml(this.currentParentTask.name || '無題のタスク');
          const statusText = KEY_LABELS.TASK_STATUS[this.currentParentTask.task_status_key] || '';
          const statusClass = this.currentParentTask.task_status_key === 'DONE' ? 'success' : 'secondary';
          container.innerHTML = `
            <p class="no-margin">
              <strong style="cursor: pointer; text-decoration: underline;" onclick="App.modals.taskDetail.openRelatedTask('${this.currentParentTask.id}', '${this.currentParentTask.board_id || ''}')">${displayId}</strong> ${taskName}
              <span class="chip small ${statusClass}">${statusText}</span>
            </p>`;
        } else {
          container.innerHTML = `<p class="no-margin secondary-text">親タスクは設定されていません</p>`;
        }
      },

      /**
       * 子タスクリストを描画
       */
      renderChildTasks: function () {
        const container = document.getElementById('child-tasks-container');
        if (!container) return;

        if (this.currentChildTasks.length === 0) {
          container.innerHTML = `<p class="no-margin secondary-text">子タスクは設定されていません</p>`;
        } else {
          container.innerHTML = this.currentChildTasks.map(task => {
            const displayId = task.display_id ? `#${task.display_id}` : '';
            const taskName = escapeHtml(task.name || '無題のタスク');
            const statusText = KEY_LABELS.TASK_STATUS[task.task_status_key] || '';
            const statusClass = task.task_status_key === 'DONE' ? 'success' : 'secondary';
            return `
              <div class="row middle-align small-space">
                <div class="max">
                  <p class="no-margin">
                    <strong style="cursor: pointer; text-decoration: underline;" onclick="App.modals.taskDetail.openRelatedTask('${task.id}', '${task.board_id || ''}')">${displayId}</strong> ${taskName}
                    <span class="chip small ${statusClass}">${statusText}</span>
                  </p>
                </div>
                <button class="circle transparent small" onclick="App.modals.taskDetail.removeChildTask('${task.id}')" title="子タスクを削除">
                  <i>delete</i>
                </button>
              </div>
            `;
          }).join('');
        }
      },

      /**
       * 親タスクを編集
       */
      editParentTask: function () {
        if (!App.modals.selectTasks) {
          console.error('[TaskDetail] selectTasks modal not available');
          return;
        }

        const currentParentId = this.currentParentTask?.id || null;

        App.modals.selectTasks.open({
          multiSelect: false,
          excludeId: this.currentId,
          preSelected: currentParentId ? [currentParentId] : [],
          callback: (selectedTasks) => {
            if (selectedTasks.length === 0) {
              // 親タスクを削除
              this.currentParentTask = null;
              this.currentItem.parent_task_id = null;
            } else {
              // 親タスクを設定（callbackから受け取った情報を使用）
              const selectedTask = selectedTasks[0];
              this.currentParentTask = selectedTask;
              this.currentItem.parent_task_id = selectedTask.id;
            }
            this.renderParentTask();
            this.updateRelatedBadge();
            this.markDirty('editParentTask');
          }
        });
      },

      /**
       * 子タスクを追加
       */
      addChildTask: function () {
        if (!App.modals.selectTasks) {
          console.error('[TaskDetail] selectTasks modal not available');
          return;
        }

        App.modals.selectTasks.open({
          multiSelect: false,
          excludeId: this.currentId,
          preSelected: [],
          callback: async (selectedTasks) => {
            if (selectedTasks.length === 0) return;

            const selectedTask = selectedTasks[0];

            // App.state.data.tasksから最新の情報を取得して親タスク情報を確認
            const currentParentTaskId = selectedTask.parent_task_id;

            // 既に親タスクが設定されているかチェック
            if (currentParentTaskId) {
              const confirmOverwrite = confirm(
                `#${selectedTask.display_id} ${selectedTask.name}には既に親タスクが設定されています。上書きしますか？`
              );
              if (!confirmOverwrite) return;
            }

            // 子タスクリストに追加（callbackから受け取った情報を使用）
            if (!this.currentChildTasks.find(t => t.id === selectedTask.id)) {
              this.currentChildTasks.push(selectedTask);
              if (!this.originalChildTaskIds.includes(selectedTask.id) && !this.addedChildTaskIds.includes(selectedTask.id)) {
                this.addedChildTaskIds.push(selectedTask.id);
              }
              this.deletedChildTaskIds = this.deletedChildTaskIds.filter(id => id !== selectedTask.id);
              this.renderChildTasks();
              this.updateRelatedBadge();
              this.markDirty('addChildTask');
            }
          }
        });
      },

      /**
       * 子タスクを削除
       * @param {string} taskId - タスクID
       */
      removeChildTask: function (taskId) {
        // 追加直後に削除された項目は追加差分から除外
        this.addedChildTaskIds = this.addedChildTaskIds.filter(id => id !== taskId);

        // 削除リストに追加
        if (this.originalChildTaskIds.includes(taskId) && !this.deletedChildTaskIds.includes(taskId)) {
          this.deletedChildTaskIds.push(taskId);
        }

        // currentChildTasksから削除
        this.currentChildTasks = this.currentChildTasks.filter(t => t.id !== taskId);

        this.renderChildTasks();
        this.updateRelatedBadge();
        this.markDirty('removeChildTask');
      },

      /**
       * 関連タスクを開く（親タスクまたは子タスク）
       * @param {string} taskId - 開くタスクのID
       * @param {string} boardId - タスクが属するボードID
       */
      openRelatedTask: async function (taskId, boardId) {
        if (!taskId) {
          console.error('[TaskDetail] Invalid task ID');
          return;
        }

        // close関数を実行（変更確認を含む）
        const closeResult = this.close();

        // closeがfalseを返した場合（ユーザーが保存をキャンセルした場合）は処理を中断
        if (!closeResult) {
          return;
        }

        // URLパラメータを更新してボードに移動
        if (App.utils.url && App.utils.url.updateParams) {
          const newParams = {
            tab: 'board',
            board_id: boardId || 'my-board' // ボードIDがない場合はMy Boardに移動
          };

          App.utils.url.updateParams(newParams, false);
        }

        const targetBoardId = boardId || 'my-board';

        // マイボードの場合は新しいナビゲーションを使用
        if (targetBoardId === 'my-board') {
          if (App.utils.navigation && App.utils.navigation.navigateToMyBoardWithTaskName) {
            await App.utils.navigation.navigateToMyBoardWithTaskName(taskId);
            return;
          }
        }

        // ボードタブに切り替え
        if (App.utils.navigation && App.utils.navigation.switchTab) {
          // ボードの読み込みを待つ
          await App.utils.navigation.switchTab(`board-${targetBoardId}`);

          // タスクを開く処理（共通関数を使用）
          if (App.utils.navigation && App.utils.navigation.tryOpenTask) {
            await App.utils.navigation.tryOpenTask(taskId, targetBoardId, { skipInitialLoad: true });
          }
        }
      },

      /**
       * 関連タブのバッジを更新
       */
      updateRelatedBadge: function () {
        const badge = document.getElementById('task-related-badge');
        if (!badge) return;

        const count = (this.currentParentTask ? 1 : 0) + this.currentChildTasks.length;
        badge.textContent = count;

        count > 0 ? badge.style.display = '' : badge.style.display = 'none';
      },

      /**
       * 履歴ログを読み込む（常にキャッシュ無効）
       * @param {string} taskId - タスクID
       */
      loadHistoryLogs: function (taskId) {
        if (App.utils.historyManager) {
          App.utils.historyManager.renderState({
            containerId: 'task-history-list',
            state: 'loading',
            escapeText: function (value) {
              return escapeHtml(String(value || ''));
            }
          });
        }

        this.historyLoadError = null;
        this.currentHistoryLogs = [];
        this.updateHistoryBadge();

        const query = {
          where: {
            table_name: ['=', 'tasks'],
            record_id: ['=', taskId]
          },
          orderBy: {
            created_at: 'desc'
          }
        };

        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.LOGS, 'select', query, null, true)
          .then(result => {
            if (this.currentId !== taskId) return;
            this.currentHistoryLogs = result?.data || result || [];
            this.historyLoadError = null;
            this.renderHistoryLogs();
            this.updateHistoryBadge();
          })
          .catch(error => {
            if (this.currentId !== taskId) return;
            this.historyLoadError = error;
            console.error('[TaskDetail] Error loading history logs:', error);
            this.renderHistoryLogs();
            this.updateHistoryBadge();
          });
      },

      /**
       * 履歴1件の要約文を生成
       * @param {Object} log - logsレコード
       * @returns {string}
       */
      getHistorySummary: function (log) {
        const operation = (log?.operation_type_key || '').toUpperCase();

        if (operation === 'INSERT') {
          return 'タスクを作成';
        }

        if (operation === 'REMOVE') {
          return 'タスクを削除';
        }

        let payload = log?.data;
        if (typeof payload === 'string') {
          try {
            payload = JSON.parse(payload);
          } catch (e) {
            payload = null;
          }
        }

        if (operation === 'UPDATE') {
          const updatedFields = Object.keys(payload?.set || {});
          if (updatedFields.length === 0) return 'タスクを更新';

          const labels = {
            name: 'タスク名',
            description: '説明',
            task_status_key: 'ステータス',
            priority_key: '優先度',
            processed_by: '進行者',
            reviewed_by: '確認者',
            received_by: '受領者',
            starts_at: '開始日時',
            ends_at: '終了日時',
            board_id: 'ボード'
          };

          const fieldLabels = updatedFields.map(field => labels[field] || field);
          return `更新: ${fieldLabels.join(' / ')}`;
        }

        if (operation === 'BULKINSERT') {
          return '複数レコードを作成';
        }

        return '操作を実行';
      },

      /**
       * 履歴ログを描画
       */
      renderHistoryLogs: function () {
        const container = document.getElementById('task-history-list');
        if (!container) return;

        const escapeText = function (value) {
          return escapeHtml(String(value || ''));
        };

        if (this.historyLoadError) {
          if (App.utils.historyManager) {
            App.utils.historyManager.renderState({
              containerId: 'task-history-list',
              state: 'error',
              message: '履歴の読み込みに失敗しました',
              escapeText: escapeText
            });
          }
          return;
        }

        if (!this.currentHistoryLogs || this.currentHistoryLogs.length === 0) {
          if (App.utils.historyManager) {
            App.utils.historyManager.renderState({
              containerId: 'task-history-list',
              state: 'empty',
              message: '履歴はありません',
              escapeText: escapeText
            });
          }
          return;
        }

        const members = App.state.data.members || [];
        if (App.utils.historyManager) {
          App.utils.historyManager.renderEntries({
            containerId: 'task-history-list',
            entries: this.currentHistoryLogs,
            escapeText: escapeText,
            resolveActorName: function (log) {
              const creator = members.find(member => member.id === log.created_by);
              return creator ? (creator.display_name || creator.name || '不明') : '不明';
            },
            formatDateTime: function (value) {
              return formatDateTimeForDisplay(value, 'MM/dd HH:mm');
            },
            buildSummary: (log) => this.getHistorySummary(log),
            operationLabelMap: {
              INSERT: '作成',
              UPDATE: '更新',
              REMOVE: '削除',
              BULKINSERT: '一括作成'
            }
          });
        }
      },

      /**
       * 履歴タブのバッジを更新
       */
      updateHistoryBadge: function () {
        const badge = document.getElementById('task-history-badge');
        if (!badge) return;

        const count = (this.currentHistoryLogs || []).length;
        badge.textContent = count;
        badge.style.display = count > 0 ? '' : 'none';
      }
    };
  })();
</script>
