<dialog id="modal-select-boards" class="modal padding no-scroll">
    <nav class="small-padding bottom-margin">
        <h5 class="bold max">ボードを選択</h5>
        <button class="circle transparent" onclick="appUi('#modal-select-boards')">
            <i>close</i>
        </button>
    </nav>

    <!-- 検索バー -->
    <div class="field small-round border prefix bottom-margin top-margin">
        <i>search</i>
        <input type="text" id="board-search-input" placeholder="ボード名で検索..."
            oninput="App.modals.selectBoards.filterResults()">
    </div>

    <!-- 全選択チェックボックス (複数選択時のみ表示) -->
    <div id="board-select-all-container" class="row left-align margin" style="display: none;">
        <label class="checkbox">
            <input type="checkbox" id="board-select-all-checkbox"
                onchange="App.modals.selectBoards.toggleSelectAll(this.checked)">
            <span>すべて選択</span>
        </label>
    </div>

    <!-- 結果リスト -->
    <div id="board-results-container"
        class="scroll large-width medium-height small-padding small-round extra-line background">
        <!-- 動的に生成 -->
    </div>

    <nav class="right-align small-padding">
        <button class="border" onclick="appUi('#modal-select-boards')">キャンセル</button>
        <button onclick="App.modals.selectBoards.confirm()">適用</button>
    </nav>
</dialog>
