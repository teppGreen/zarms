<dialog id="modal-select-directories" class="modal large-width bottom">
    <nav class="small-padding bottom-margin">
        <h5 class="max">組織を選択</h5>
        <span id="directory-select-status" class="chip small border" style="display: none;">更新中</span>
        <button class="circle transparent" onclick="ui('#modal-select-directories')">
            <i>close</i>
        </button>
    </nav>
    <div>
        <div class="row">
            <!-- 検索バー -->
            <div class="field border prefix max">
                <i>search</i>
                <input type="text" id="directory-search-input" placeholder="IDまたは名前で検索..."
                    oninput="App.modals.selectDirectories.filterResults()">
            </div>

            <!-- フィルタ -->
            <div class="field label border">
                <select id="directory-type-filter" onchange="App.modals.selectDirectories.filterResults()">
                    <option value="">すべて</option>
                    <!-- ENUMから動的に生成 -->
                </select>
                <label>組織タイプ</label>
            </div>
        </div>

        <!-- 全選択チェックボックス (複数選択時のみ表示) -->
        <div id="directory-select-all-container" class="row middle-align split-margin" style="display: none;">
            <label class="checkbox">
                <input type="checkbox" id="directory-select-all-checkbox"
                    onchange="App.modals.selectDirectories.toggleSelectAll(this.checked)">
                <span>すべて選択</span>
            </label>
        </div>
    </div>

    <div>
        <article class="padding medium no-elevate scroll">
            <!-- 結果リスト（ツリー構造） -->
            <div id="directory-results-container" class="large-line">
                <table id="directory-tree-table" class="">
                    <tbody id="directory-tree-body">
                        <!-- ツリー行は動的生成 -->
                    </tbody>
                </table>
            </div>
        </article>
    </div>

    <footer class="">
        <nav class="right-align">
            <button class="border" onclick="ui('#modal-select-directories')">キャンセル</button>
            <button onclick="App.modals.selectDirectories.confirm()">適用</button>
        </nav>
    </footer>
</dialog>
