<script>
    (function () {
        App.modals.planDetail = {
            currentId: null,
            currentItem: null,
            originalData: null,
            currentAssignments: [],
            originalAssignments: [],
            isDeleteRequested: false,
            isDirty: false,
            isSaving: false,
            isDeleting: false,
            quill: null,
            thumbnailPreviewToken: '',
            thumbnailPreviewStatus: 'empty',
            thumbnailPreviewErrorCode: '',
            thumbnailPreviewRecommendedAction: 'none',
            thumbnailPreviewDebounceTimer: null,
            thumbnailCopyFeedbackTimer: null,
            lastOperationState: 'idle',

            open: function (planId) {
                if (!planId) return;

                const plan = (App.state.data.plans || []).find(function (item) {
                    return item.id === planId;
                });
                if (!plan) {
                    showSnackbar('企画が見つかりませんでした', 'error');
                    return;
                }

                this.currentId = planId;
                this.currentItem = Object.assign({}, plan);
                this.originalData = Object.assign({}, plan);

                const assignments = (App.state.data.planAssignments || []).filter(function (assignment) {
                    return assignment.plan_id === planId;
                }).map(function (assignment) {
                    return Object.assign({}, assignment);
                });
                this.currentAssignments = assignments;
                this.originalAssignments = assignments.map(function (assignment) {
                    return Object.assign({}, assignment);
                });
                this.isDeleteRequested = false;
                this.isDirty = false;
                this.isSaving = false;
                this.isDeleting = false;

                if (!this.quill) {
                    this.quill = App.utils.quill.init('#plan-description-editor', {
                        placeholder: '企画説明を入力...'
                    });
                }

                appUi('#modal-detail-plan', true);
                this._render();
                this._bindChangeListeners();
                this.loadComments(planId);
                appUi('#plan-detail-tab-description');
                this._bindTabStateSync();
                this._setErrorMessage('', 'error');
                this._setOperationState('idle');

                this._syncLatest(planId);
            },

            close: function (options = {}) {
                const skipDirtyCheck = options.skipDirtyCheck === true;
                const reason = options.reason || 'user';

                if (this.isSaving || this.isDeleting) {
                    showSnackbar('保存処理中は閉じられません', 'info');
                    return;
                }
                if (!skipDirtyCheck && this.isDirty) {
                    const message = reason === 'escape'
                        ? '未保存の変更があります。変更を破棄して閉じますか？'
                        : '変更を破棄して閉じますか？';
                    if (!confirm(message)) return;
                }
                appUi('#modal-detail-plan', false);
                this._reset();
            },

            discard: function () {
                if (this.isSaving || this.isDeleting) {
                    showSnackbar('保存処理中は破棄できません', 'info');
                    return;
                }
                if (this.isDirty && !confirm('変更を破棄しますか？')) return;
                appUi('#modal-detail-plan', false);
                this._reset();
            },

            toggleDirty: function (nextValue) {
                this.isDirty = nextValue === undefined ? true : nextValue === true;
            },

            openAddMembers: function () {
                if (!this.currentId || !App.modals.selectMembers || !App.modals.selectMembers.open) return;
                const preSelected = this.currentAssignments
                    .filter(function (assignment) { return assignment.is_active !== false; })
                    .map(function (assignment) { return assignment.member_id; });

                App.modals.selectMembers.open({
                    multiSelect: true,
                    preSelected: preSelected,
                    callback: function (selectedIds) {
                        App.modals.planDetail.applyMemberSelection(selectedIds);
                    }
                });
            },

            applyMemberSelection: function (selectedIds) {
                const before = this.currentAssignments.slice();
                const existingByMemberId = before.reduce(function (acc, assignment) {
                    acc[assignment.member_id] = assignment;
                    return acc;
                }, {});

                const nextAssignments = (selectedIds || []).map(function (memberId) {
                    const existing = existingByMemberId[memberId];
                    if (existing) {
                        const next = Object.assign({}, existing);
                        next.is_active = true;
                        return next;
                    }
                    return {
                        id: null,
                        plan_id: App.modals.planDetail.currentId,
                        member_id: memberId,
                        role: null,
                        is_active: true
                    };
                });

                this.currentAssignments = nextAssignments;
                this.toggleDirty(true);
                this._renderAssignments();
                this._refreshThumbnailPreviewFromInput();
            },

            updateAssignmentRole: function (index, roleValue) {
                const target = this.currentAssignments[index];
                if (!target) return;
                target.role = (roleValue || '').trim() || null;
                this.toggleDirty(true);
            },

            updateAssignmentActive: function (index, isActive) {
                const target = this.currentAssignments[index];
                if (!target) return;
                target.is_active = isActive === true;
                this.toggleDirty(true);
            },

            removeAssignmentAt: function (index) {
                if (index < 0 || index >= this.currentAssignments.length) return;
                this.currentAssignments.splice(index, 1);
                this.toggleDirty(true);
                this._renderAssignments();
            },

            save: async function () {
                if (!this.currentId) return;
                if (this.isSaving || this.isDeleting) return;

                const validationResult = this._validatePlanInputs();
                if (!validationResult.canSave) {
                    this._setErrorMessage(validationResult.message, validationResult.level === 'warning' ? 'warning' : 'error');
                    if (validationResult.fieldId) {
                        const invalidField = document.getElementById(validationResult.fieldId);
                        if (invalidField && typeof invalidField.focus === 'function') {
                            invalidField.focus();
                        }
                    }
                    return;
                }
                this._setErrorMessage('', 'error');
                const name = (document.getElementById('plan-detail-name-input')?.value || '').trim();

                const updates = {
                    plan_number: (document.getElementById('plan-detail-plan-number-input')?.value || '').trim() || null,
                    zarms_code: (document.getElementById('plan-detail-zarms-code-input')?.value || '').trim() || null,
                    parent_plan_id: (document.getElementById('plan-detail-parent-plan-id-input')?.value || '').trim() || null,
                    plan_type_sequence_number: (document.getElementById('plan-detail-plan-type-sequence-number-input')?.value || '').trim() || null,
                    name: name,
                    plan_status: (document.getElementById('plan-detail-status-input')?.value || '').trim() || null,
                    plan_type: (document.getElementById('plan-detail-type-input')?.value || '').trim() || null,
                    summary: (document.getElementById('plan-detail-summary-input')?.value || '').trim() || null,
                    description: App.utils.quill.getContent(this.quill) || null,
                    plan_tags: (document.getElementById('plan-detail-plan-tags-input')?.value || '').trim() || null,
                    plan_categories: (document.getElementById('plan-detail-plan-categories-input')?.value || '').trim() || null,
                    selection_application_text: (document.getElementById('plan-detail-selection-application-text-input')?.value || '').trim() || null,
                    selection_presentation_url: (document.getElementById('plan-detail-selection-presentation-url-input')?.value || '').trim() || null,
                    first_selection_comment: (document.getElementById('plan-detail-first-selection-comment-input')?.value || '').trim() || null,
                    second_selection_comment: (document.getElementById('plan-detail-second-selection-comment-input')?.value || '').trim() || null,
                    estimated_staff_count: (document.getElementById('plan-detail-estimated-staff-count-input')?.value || '').trim() || null,
                    estimated_participant_count: (document.getElementById('plan-detail-estimated-participant-count-input')?.value || '').trim() || null,
                    estimated_total_cost: (document.getElementById('plan-detail-estimated-total-cost-input')?.value || '').trim() || null,
                    actual_staff_count: (document.getElementById('plan-detail-actual-staff-count-input')?.value || '').trim() || null,
                    actual_participant_count: (document.getElementById('plan-detail-actual-participant-count-input')?.value || '').trim() || null,
                    actual_total_cost: (document.getElementById('plan-detail-actual-total-cost-input')?.value || '').trim() || null,
                    has_collaborators: document.getElementById('plan-detail-has-collaborators-input')?.checked === true,
                    has_guests: document.getElementById('plan-detail-has-guests-input')?.checked === true,
                    online_media_type: (document.getElementById('plan-detail-online-media-type-input')?.value || '').trim() || null,
                    online_media_url: (document.getElementById('plan-detail-online-media-url-input')?.value || '').trim() || null,
                    website_url: (document.getElementById('plan-detail-website-url-input')?.value || '').trim() || null,
                    sheet_url: (document.getElementById('plan-detail-sheet-url-input')?.value || '').trim() || null,
                    folder_url: (document.getElementById('plan-detail-folder-url-input')?.value || '').trim() || null,
                    document_url: (document.getElementById('plan-detail-document-url-input')?.value || '').trim() || null,
                    slide_url: (document.getElementById('plan-detail-slide-url-input')?.value || '').trim() || null,
                    script_url: (document.getElementById('plan-detail-script-url-input')?.value || '').trim() || null,
                    thumbnail_url: (document.getElementById('plan-detail-thumbnail-url-input')?.value || '').trim() || null,
                    exhibitor_type: (document.getElementById('plan-detail-exhibitor-type-input')?.value || '').trim() || null,
                    exhibitor_member: (document.getElementById('plan-detail-exhibitor-member-input')?.value || '').trim() || null,
                    exhibitor_directory: (document.getElementById('plan-detail-exhibitor-directory-input')?.value || '').trim() || null,
                    manager_committee_student: (document.getElementById('plan-detail-manager-committee-student-input')?.value || '').trim() || null,
                    manager_committee_staff: (document.getElementById('plan-detail-manager-committee-staff-input')?.value || '').trim() || null,
                    slack_channel_url: (document.getElementById('plan-detail-slack-channel-url-input')?.value || '').trim() || null,
                    has_recruitment: document.getElementById('plan-detail-has-recruitment-input')?.checked === true,
                    has_live: document.getElementById('plan-detail-has-live-input')?.checked === true,
                    remark: (document.getElementById('plan-detail-remark-input')?.value || '').trim() || null
                };

                const changedPlanFields = {};
                Object.keys(updates).forEach(function (key) {
                    if (String(updates[key] ?? '') !== String((App.modals.planDetail.originalData || {})[key] ?? '')) {
                        changedPlanFields[key] = updates[key];
                    }
                });

                if (this.isDeleteRequested === true) {
                    this.isDeleting = true;
                    this._setOperationState('deleting');
                    this._updateActionButtons();
                    showSnackbar('企画を削除しています...', 'info', 'top', 0);
                    try {
                        await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.PLANS, 'remove', {
                            where: { id: ['=', this.currentId] }
                        }, '企画を削除');

                        await this._refreshPlansData(true);
                        appUi('#modal-detail-plan', false);
                        this._reset();
                        showSnackbar('企画を削除しました', 'success');
                    } catch (error) {
                        console.error('[PlanDetail] 削除エラー:', error);
                        this._setOperationState('delete_error');
                        this._setErrorMessage('企画の削除に失敗しました。時間をおいて再試行してください。', 'error');
                        showSnackbar('企画の削除に失敗しました', 'error');
                    } finally {
                        this.isDeleting = false;
                        this._updateActionButtons();
                    }
                    return;
                }

                this.isSaving = true;
                this._setOperationState('saving');
                this._updateActionButtons();
                showSnackbar('企画を保存しています...', 'info', 'top', 0);

                try {
                    if (Object.keys(changedPlanFields).length > 0) {
                        await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.PLANS, 'update', {
                            where: { id: ['=', this.currentId] },
                            set: changedPlanFields
                        }, '企画を更新');
                    }

                    await this._saveAssignments();
                    await this._refreshPlansData(true);

                    const refreshed = (App.state.data.plans || []).find(function (item) {
                        return item.id === App.modals.planDetail.currentId;
                    });
                    if (refreshed) {
                        this.currentItem = Object.assign({}, refreshed);
                        this.originalData = Object.assign({}, refreshed);
                    }
                    this.originalAssignments = this.currentAssignments.map(function (assignment) {
                        return Object.assign({}, assignment);
                    });
                    this.toggleDirty(false);
                    this._render();

                    showSnackbar('企画を保存しました', 'success');
                    this._setErrorMessage('', 'error');
                    this._setOperationState('save_success');
                } catch (error) {
                    console.error('[PlanDetail] 保存エラー:', error);
                    this._setErrorMessage('企画の保存に失敗しました。入力内容を確認して再試行してください。', 'error');
                    this._setOperationState('save_error');
                    showSnackbar('企画の保存に失敗しました', 'error');
                } finally {
                    this.isSaving = false;
                    this._updateActionButtons();
                }
            },

            requestDelete: function () {
                if (!this.currentId) return;
                if (this.isSaving || this.isDeleting) return;
                if (this.isDeleteRequested === true) {
                    if (!confirm('削除予約を解除しますか？')) return;
                    this.isDeleteRequested = false;
                    this.toggleDirty(true);
                    this._setOperationState(this.isDirty ? 'dirty' : 'idle');
                    this._setErrorMessage('', 'error');
                    return;
                }
                if (!confirm('この企画を削除対象として保存しますか？\n「変更を保存」で確定します。')) return;
                this.isDeleteRequested = true;
                this.toggleDirty(true);
                this._setErrorMessage('この企画は削除予定です。「変更を保存」で確定します。', 'warning');
                this._setOperationState('delete_reserved');
            },

            _bindTabStateSync: function () {
                const tabs = document.querySelectorAll('#plan-detail-tabs > a');
                tabs.forEach(function (tab) {
                    if (!tab || tab.dataset.planDetailTabBound === '1') return;
                    tab.addEventListener('click', function () {
                        setTimeout(function () {
                            App.modals.planDetail._updateActionButtons();
                        }, 0);
                    });
                    tab.dataset.planDetailTabBound = '1';
                });
            },

            openNewComment: function () {
                if (!this.currentId) return;
                if (!App.modals.newComment) return;

                if (App.modals.newComment.openFor) {
                    App.modals.newComment.openFor('plans', this.currentId);
                    return;
                }

                App.modals.newComment.open(this.currentId);
            },

            loadComments: function (planId, skipLoadingCache = false) {
                App.utils.commentManager.loadComments({
                    relatedTable: 'plans',
                    relatedId: planId,
                    containerId: 'plan-comments-list',
                    skipLoadingCache: skipLoadingCache,
                    isCurrent: () => this.currentId === planId,
                    onRender: (comments) => this.renderComments(comments),
                    logPrefix: 'PlanDetail'
                });
            },

            renderComments: function (comments) {
                App.utils.commentManager.renderComments({
                    containerId: 'plan-comments-list',
                    comments: comments,
                    escapeText: function (value) {
                        return App.modals.planDetail._escapeHtml(value || '');
                    },
                    escapeUrl: function (value) {
                        return App.modals.planDetail._escapeHtml(value || '#');
                    }
                });
            },

            // コメントを即座にUIに追加（Optimistic UI Update）
            appendCommentToUI: function (comment) {
                App.utils.commentManager.appendCommentToUI({
                    containerId: 'plan-comments-list',
                    comment: comment,
                    escapeText: function (value) {
                        return App.modals.planDetail._escapeHtml(value || '');
                    },
                    escapeUrl: function (value) {
                        return App.modals.planDetail._escapeHtml(value || '#');
                    }
                });
            },

            _saveAssignments: async function () {
                const originalById = (this.originalAssignments || []).reduce(function (acc, assignment) {
                    if (assignment.id) {
                        acc[assignment.id] = assignment;
                    }
                    return acc;
                }, {});

                for (let i = 0; i < this.currentAssignments.length; i += 1) {
                    const assignment = this.currentAssignments[i];
                    const payload = {
                        plan_id: this.currentId,
                        member_id: assignment.member_id,
                        role: (assignment.role || '').trim() || null,
                        is_active: assignment.is_active !== false
                    };

                    if (assignment.id) {
                        const original = originalById[assignment.id] || {};
                        const changed =
                            String(payload.member_id ?? '') !== String(original.member_id ?? '') ||
                            String(payload.role ?? '') !== String(original.role ?? '') ||
                            Boolean(payload.is_active) !== Boolean(original.is_active !== false);

                        if (!changed) continue;

                        await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.PLAN_ASSIGNMENTS, 'update', {
                            where: { id: ['=', assignment.id] },
                            set: payload
                        }, '企画関係者を更新');
                        continue;
                    }

                    const inserted = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.PLAN_ASSIGNMENTS, 'insert', payload, '企画関係者を追加');
                    if (inserted && inserted.data && inserted.data.id) {
                        assignment.id = inserted.data.id;
                    }
                }

                const currentIdSet = this.currentAssignments
                    .filter(function (assignment) { return !!assignment.id; })
                    .map(function (assignment) { return assignment.id; });

                for (let i = 0; i < this.originalAssignments.length; i += 1) {
                    const original = this.originalAssignments[i];
                    if (!original.id) continue;
                    if (currentIdSet.indexOf(original.id) !== -1) continue;

                    await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.PLAN_ASSIGNMENTS, 'remove', {
                        where: { id: ['=', original.id] }
                    }, '企画関係者を削除');
                }
            },

            _syncLatest: function (planId) {
                const self = this;
                Promise.resolve().then(async function () {
                    try {
                        await self._refreshPlansData(true);
                        if (self.currentId !== planId) return;

                        const refreshed = (App.state.data.plans || []).find(function (item) {
                            return item.id === planId;
                        });
                        if (!refreshed || self.isDirty) return;

                        self.currentItem = Object.assign({}, refreshed);
                        self.originalData = Object.assign({}, refreshed);
                        self.currentAssignments = (App.state.data.planAssignments || []).filter(function (assignment) {
                            return assignment.plan_id === planId;
                        }).map(function (assignment) {
                            return Object.assign({}, assignment);
                        });
                        self.originalAssignments = self.currentAssignments.map(function (assignment) {
                            return Object.assign({}, assignment);
                        });
                        self._render();
                    } catch (error) {
                        console.error('[PlanDetail] 背景同期エラー:', error);
                    }
                });
            },

            _refreshPlansData: async function (forceRefresh) {
                const plansResult = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.PLANS, 'select', {}, null, forceRefresh === true);
                const assignmentsResult = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.PLAN_ASSIGNMENTS, 'select', {}, null, forceRefresh === true);

                App.state.data.plans = plansResult?.data || [];
                App.state.data.planAssignments = assignmentsResult?.data || [];

                if (App.pages.members && App.pages.members.loadData) {
                    await App.pages.members.loadData(true);
                }
            },

            _render: function () {
                const plan = this.currentItem || {};
                const status = plan.plan_status || 'SUBMITTED';
                const statusLabel = (KEY_LABELS && KEY_LABELS.PLAN_STATUS && KEY_LABELS.PLAN_STATUS[status]) ? KEY_LABELS.PLAN_STATUS[status] : status;

                const chipEl = document.getElementById('plan-detail-status-chip');
                const displayIdEl = document.getElementById('plan-detail-display-id');
                const updatedEl = document.getElementById('plan-detail-last-updated');

                if (chipEl) chipEl.textContent = statusLabel;
                if (displayIdEl) displayIdEl.textContent = plan.plan_number || (plan.zarms_code || '');
                if (updatedEl) {
                    const parts = [];
                    if (plan.updated_at) parts.push(formatDateTimeForDisplay(plan.updated_at, 'yyyy/MM/dd HH:mm'));
                    if (plan.updated_by) {
                        const updater = (App.state.data.members || []).find(function (member) {
                            return member.id === plan.updated_by;
                        });
                        if (updater) parts.push((updater.display_name || updater.name || '') + ' 更新');
                    }
                    updatedEl.textContent = parts.join(' / ');
                }
                this._updateStatusChipColor(status);

                const mappings = [
                    ['plan-detail-plan-number-input', plan.plan_number || ''],
                    ['plan-detail-zarms-code-input', plan.zarms_code || ''],
                    ['plan-detail-parent-plan-id-input', plan.parent_plan_id || ''],
                    ['plan-detail-plan-type-sequence-number-input', plan.plan_type_sequence_number || ''],
                    ['plan-detail-name-input', plan.name || ''],
                    ['plan-detail-status-input', plan.plan_status || 'SUBMITTED'],
                    ['plan-detail-type-input', plan.plan_type || ''],
                    ['plan-detail-summary-input', plan.summary || ''],
                    ['plan-detail-plan-tags-input', plan.plan_tags || ''],
                    ['plan-detail-plan-categories-input', plan.plan_categories || ''],
                    ['plan-detail-selection-application-text-input', plan.selection_application_text || ''],
                    ['plan-detail-selection-presentation-url-input', plan.selection_presentation_url || ''],
                    ['plan-detail-first-selection-comment-input', plan.first_selection_comment || ''],
                    ['plan-detail-second-selection-comment-input', plan.second_selection_comment || ''],
                    ['plan-detail-estimated-staff-count-input', plan.estimated_staff_count || ''],
                    ['plan-detail-estimated-participant-count-input', plan.estimated_participant_count || ''],
                    ['plan-detail-estimated-total-cost-input', plan.estimated_total_cost || ''],
                    ['plan-detail-actual-staff-count-input', plan.actual_staff_count || ''],
                    ['plan-detail-actual-participant-count-input', plan.actual_participant_count || ''],
                    ['plan-detail-actual-total-cost-input', plan.actual_total_cost || ''],
                    ['plan-detail-online-media-type-input', plan.online_media_type || ''],
                    ['plan-detail-online-media-url-input', plan.online_media_url || ''],
                    ['plan-detail-website-url-input', plan.website_url || ''],
                    ['plan-detail-sheet-url-input', plan.sheet_url || ''],
                    ['plan-detail-folder-url-input', plan.folder_url || ''],
                    ['plan-detail-document-url-input', plan.document_url || ''],
                    ['plan-detail-slide-url-input', plan.slide_url || ''],
                    ['plan-detail-script-url-input', plan.script_url || ''],
                    ['plan-detail-thumbnail-url-input', plan.thumbnail_url || ''],
                    ['plan-detail-exhibitor-type-input', plan.exhibitor_type || ''],
                    ['plan-detail-exhibitor-member-input', plan.exhibitor_member || ''],
                    ['plan-detail-exhibitor-directory-input', plan.exhibitor_directory || ''],
                    ['plan-detail-manager-committee-student-input', plan.manager_committee_student || ''],
                    ['plan-detail-manager-committee-staff-input', plan.manager_committee_staff || ''],
                    ['plan-detail-slack-channel-url-input', plan.slack_channel_url || ''],
                    ['plan-detail-remark-input', plan.remark || '']
                ];

                mappings.forEach(function (entry) {
                    const el = document.getElementById(entry[0]);
                    if (el) el.value = entry[1];
                });

                const statusInput = document.getElementById('plan-detail-status-input');
                if (statusInput && KEY_LABELS && KEY_LABELS.PLAN_STATUS) {
                    const options = Object.entries(KEY_LABELS.PLAN_STATUS).map(function (entry) {
                        return '<option value="' + App.modals.planDetail._escapeAttr(entry[0]) + '">' + App.modals.planDetail._escapeHtml(entry[1]) + '</option>';
                    }).join('');
                    statusInput.innerHTML = options;
                    statusInput.value = plan.plan_status || 'SUBMITTED';
                }

                if (this.quill) {
                    App.utils.quill.setContent(this.quill, plan.description || '');
                }

                const setChecked = function (id, value) {
                    const el = document.getElementById(id);
                    if (el) el.checked = value === true;
                };
                setChecked('plan-detail-has-collaborators-input', plan.has_collaborators === true);
                setChecked('plan-detail-has-guests-input', plan.has_guests === true);
                setChecked('plan-detail-has-recruitment-input', plan.has_recruitment === true);
                setChecked('plan-detail-has-live-input', plan.has_live === true);

                const members = App.state.data.members || [];
                const findDisplayName = function (memberId) {
                    if (!memberId) return '';
                    const member = members.find(function (item) { return item.id === memberId; });
                    return member ? (member.display_name || member.name || member.email || '') : '不明';
                };
                const setText = function (id, value) {
                    const el = document.getElementById(id);
                    if (el) el.value = value || '';
                };
                setText('plan-detail-applied-by-input', findDisplayName(plan.applied_by));
                setText('plan-detail-applied-at-input', plan.applied_at ? formatDateTimeForDisplay(plan.applied_at) : '');
                setText('plan-detail-created-by-input', findDisplayName(plan.created_by));

            },

            _renderAssignments: function () {
                const container = document.getElementById('plan-detail-assignments-list');

                if (!this.currentAssignments || this.currentAssignments.length === 0) {
                    container.innerHTML = '<p class="secondary-text small-text padding">関係者は登録されていません</p>';
                    return;
                }

                container.innerHTML = this.currentAssignments.map(function (assignment, index) {
                    const member = (App.state.data.members || []).find(function (item) {
                        return item.id === assignment.member_id;
                    });
                    const memberName = member ? (member.display_name || member.name || '名称未設定') : '不明な人物';
                    const memberEmail = member ? (member.email || '') : '';
                    const role = App.modals.planDetail._escapeAttr(assignment.role || '');
                    const checked = assignment.is_active === false ? '' : 'checked';

                    return '<article class="border small-round padding bottom-margin">' +
                        '<div class="row tiny-space middle-align">' +
                        '<div class="max">' +
                        '<div class="bold">' + App.modals.planDetail._escapeHtml(memberName) + '</div>' +
                        '<div class="small-text secondary-text">' + App.modals.planDetail._escapeHtml(memberEmail) + '</div>' +
                        '</div>' +
                        '<button class="circle transparent" onclick="App.modals.planDetail.removeAssignmentAt(' + index + ')" title="この関係者を削除">' +
                        '<i>remove_circle</i>' +
                        '</button>' +
                        '</div>' +
                        '<div class="field border label small top-margin">' +
                        '<input placeholder=" " type="text" value="' + role + '" oninput="App.modals.planDetail.updateAssignmentRole(' + index + ', this.value)">' +
                        '<label>役割</label>' +
                        '</div>' +
                        '<label class="row tiny-space top-margin">' +
                        '<input type="checkbox" ' + checked + ' onchange="App.modals.planDetail.updateAssignmentActive(' + index + ', this.checked)">' +
                        '<span>有効</span>' +
                        '</label>' +
                        '</article>';
                }).join('');
            },

            _setThumbnailPreviewState: function (message, dataUrl, status) {
                const stateEl = document.getElementById('plan-detail-thumbnail-preview-state');
                const guideEl = document.getElementById('plan-detail-thumbnail-preview-guide');
                const imageEl = document.getElementById('plan-detail-thumbnail-preview-image');
                const chipEl = document.getElementById('plan-detail-thumbnail-preview-chip');
                const retryButton = document.getElementById('plan-detail-thumbnail-preview-retry');
                const openButton = document.getElementById('plan-detail-thumbnail-preview-open');
                const manualRefreshButton = document.getElementById('plan-detail-thumbnail-refresh-button');
                const normalizeButton = document.getElementById('plan-detail-thumbnail-normalize-button');
                const normalizeRefreshButton = document.getElementById('plan-detail-thumbnail-normalize-refresh-button');
                const nextActionButton = document.getElementById('plan-detail-thumbnail-next-action-button');
                const copyUrlButton = document.getElementById('plan-detail-thumbnail-copy-url-button');
                const copyNoteButton = document.getElementById('plan-detail-thumbnail-copy-note-button');
                const copyFeedbackEl = document.getElementById('plan-detail-thumbnail-copy-feedback');
                const inputHintEl = document.getElementById('plan-detail-thumbnail-input-hint');
                const recoveryFlowEl = document.getElementById('plan-detail-thumbnail-recovery-flow');
                const recoveryHintEl = document.getElementById('plan-detail-thumbnail-recovery-hint');
                const recoveryStep1Button = document.getElementById('plan-detail-thumbnail-recovery-step1-button');
                const recoveryStep2Button = document.getElementById('plan-detail-thumbnail-recovery-step2-button');
                const recoveryStep3Button = document.getElementById('plan-detail-thumbnail-recovery-step3-button');
                const recoveryStep1LabelEl = recoveryStep1Button ? recoveryStep1Button.querySelector('span') : null;
                const retryLabelEl = retryButton ? retryButton.querySelector('span') : null;
                const nextActionLabelEl = nextActionButton ? nextActionButton.querySelector('span') : null;
                const hasImage = !!dataUrl;
                const statusKey = status || (hasImage ? 'success' : 'empty');
                this.thumbnailPreviewStatus = statusKey;
                this.thumbnailPreviewRecommendedAction = this._resolveThumbnailRecommendedAction(statusKey, this.thumbnailPreviewErrorCode);
                this._updateThumbnailDiagnostics(statusKey, this.thumbnailPreviewErrorCode, this.thumbnailPreviewRecommendedAction);
                this._updateThumbnailInitialTriage(statusKey, this.thumbnailPreviewErrorCode, this.thumbnailPreviewRecommendedAction);

                if (stateEl) {
                    stateEl.textContent = message || '';
                    stateEl.style.display = hasImage ? 'none' : '';
                }
                if (imageEl) {
                    if (hasImage) {
                        imageEl.src = dataUrl;
                        imageEl.style.display = '';
                    } else {
                        imageEl.removeAttribute('src');
                        imageEl.style.display = 'none';
                    }
                }
                if (chipEl) {
                    if (statusKey === 'loading') chipEl.textContent = '読み込み中';
                    if (statusKey === 'success') chipEl.textContent = '表示中';
                    if (statusKey === 'error') {
                        if (this.thumbnailPreviewErrorCode === 'invalid_drive_url') chipEl.textContent = 'URL不正';
                        else if (this.thumbnailPreviewErrorCode === 'permission_denied') chipEl.textContent = '権限不足';
                        else if (this.thumbnailPreviewErrorCode === 'not_image') chipEl.textContent = '非画像';
                        else if (this.thumbnailPreviewErrorCode === 'file_not_found') chipEl.textContent = '未検出';
                        else chipEl.textContent = '取得失敗';
                    }
                    if (statusKey === 'empty') chipEl.textContent = '未設定';
                }
                if (guideEl) {
                    if (statusKey === 'loading') {
                        guideEl.textContent = 'プレビューを取得中です。完了後に表示される画像を確認し、問題なければ保存してください';
                    } else if (statusKey === 'success') {
                        guideEl.textContent = '表示OKです。このまま保存できます（保存されるのは画像データではなくURL文字列です）';
                    } else if (statusKey === 'error') {
                        if (this.thumbnailPreviewErrorCode === 'invalid_drive_url') {
                            guideEl.textContent = 'Drive共有URLの形式が不正です。「Drive URLを整形」を押し、続けて「入力内容で確認」で再確認してください';
                        } else if (this.thumbnailPreviewErrorCode === 'permission_denied') {
                            guideEl.textContent = 'Driveの共有設定で「リンクを知っている全員が閲覧可」に変更後、「入力内容で確認」で再確認してください';
                        } else if (this.thumbnailPreviewErrorCode === 'not_image') {
                            guideEl.textContent = '画像以外のファイルです。PNG/JPG等の画像ファイルURLに変更し、「入力内容で確認」で再確認してください';
                        } else if (this.thumbnailPreviewErrorCode === 'file_not_found') {
                            guideEl.textContent = '対象ファイルが見つかりません。URL内のファイルIDを確認し、必要なら「Drive URLを整形」後に「入力内容で確認」を実行してください';
                        } else {
                            guideEl.textContent = '取得に失敗しました。URLとDriveの状態を確認し、「入力内容で確認」を押してください';
                        }
                    } else {
                        guideEl.textContent = '1. Drive共有URLを貼り付け 2. 「Drive URLを整形」 3. 「入力内容で確認」 4. 表示できたら保存（保存値はURL）';
                    }
                }
                if (inputHintEl) {
                    if (statusKey === 'loading') {
                        inputHintEl.textContent = '読み込み中です。結果が出たら表示画像を確認してください';
                    } else if (statusKey === 'success') {
                        inputHintEl.textContent = '確認完了: URL文字列のまま保存されます。問題なければ保存してください';
                    } else if (statusKey === 'error') {
                        if (this.thumbnailPreviewErrorCode === 'invalid_drive_url') {
                            inputHintEl.textContent = '次アクション: 「Drive URLを整形」→「入力内容で確認」';
                        } else if (this.thumbnailPreviewErrorCode === 'permission_denied') {
                            inputHintEl.textContent = '次アクション: Drive共有を閲覧可能に変更 → 「入力内容で確認」';
                        } else if (this.thumbnailPreviewErrorCode === 'not_image') {
                            inputHintEl.textContent = '次アクション: 画像ファイルURLへ変更 → 「入力内容で確認」';
                        } else if (this.thumbnailPreviewErrorCode === 'file_not_found') {
                            inputHintEl.textContent = '次アクション: ファイルID確認（必要なら整形）→「入力内容で確認」';
                        } else {
                            inputHintEl.textContent = '次アクション: URLを見直して「入力内容で確認」';
                        }
                    } else {
                        inputHintEl.textContent = '迷ったら「Drive URLを整形」→「入力内容で確認」。表示できたらURL文字列のまま保存できます';
                    }
                }
                if (retryButton) {
                    retryButton.disabled = statusKey === 'loading' || this.isSaving || this.isDeleting;
                    if (retryLabelEl) {
                        retryLabelEl.textContent = statusKey === 'error' ? '再試行' : '再読込';
                    }
                }
                if (manualRefreshButton) {
                    manualRefreshButton.disabled = statusKey === 'loading' || this.isSaving || this.isDeleting;
                }
                if (normalizeButton) {
                    normalizeButton.disabled = this.isSaving || this.isDeleting;
                }
                if (normalizeRefreshButton) {
                    normalizeRefreshButton.disabled = statusKey === 'loading' || this.isSaving || this.isDeleting;
                }
                if (nextActionButton) {
                    nextActionButton.disabled = statusKey === 'loading' || this.isSaving || this.isDeleting || this.thumbnailPreviewRecommendedAction === 'none';
                    if (nextActionLabelEl) {
                        if (this.thumbnailPreviewRecommendedAction === 'normalize_refresh') {
                            nextActionLabelEl.textContent = '整形して確認';
                        } else if (this.thumbnailPreviewRecommendedAction === 'refresh') {
                            nextActionLabelEl.textContent = '入力内容で確認';
                        } else if (this.thumbnailPreviewRecommendedAction === 'open_source') {
                            nextActionLabelEl.textContent = 'URLを開く';
                        } else {
                            nextActionLabelEl.textContent = '次アクション';
                        }
                    }
                }
                if (recoveryStep1Button) {
                    recoveryStep1Button.disabled = nextActionButton ? nextActionButton.disabled : true;
                }
                if (recoveryStep1LabelEl) {
                    const resolvedLabel = String(nextActionLabelEl?.textContent || '').trim() || this._getThumbnailDiagnosticActionLabel(this.thumbnailPreviewRecommendedAction);
                    recoveryStep1LabelEl.textContent = '1. ' + resolvedLabel;
                }
                if (recoveryStep2Button) {
                    recoveryStep2Button.disabled = statusKey === 'loading' || this.isSaving || this.isDeleting;
                }
                if (recoveryStep3Button) {
                    const url = this._getThumbnailUrl();
                    recoveryStep3Button.disabled = !url || this.isSaving || this.isDeleting;
                }
                if (openButton) {
                    const url = this._getThumbnailUrl();
                    openButton.disabled = !url || this.isSaving || this.isDeleting;
                }
                if (copyUrlButton) {
                    const url = this._getThumbnailUrl();
                    copyUrlButton.disabled = !url || this.isSaving || this.isDeleting;
                }
                if (copyNoteButton) {
                    const url = this._getThumbnailUrl();
                    copyNoteButton.disabled = !url || this.isSaving || this.isDeleting;
                }
                if (copyFeedbackEl && !String(copyFeedbackEl.dataset.locked || '').trim()) {
                    if (statusKey === 'success') {
                        copyFeedbackEl.className = 'small-text secondary-text';
                        copyFeedbackEl.textContent = '共有時は「URLをコピー」または「引き継ぎ情報をコピー」を利用できます';
                    } else if (statusKey === 'error') {
                        copyFeedbackEl.className = 'small-text tertiary-text';
                        copyFeedbackEl.textContent = '次アクション実行後も失敗する場合は「引き継ぎ情報をコピー」でエラー分類と次アクションを共有できます';
                    } else if (statusKey === 'loading') {
                        copyFeedbackEl.className = 'small-text tertiary-text';
                        copyFeedbackEl.textContent = '判定中です。完了後にコピー導線を利用してください';
                    } else {
                        copyFeedbackEl.className = 'small-text secondary-text';
                        copyFeedbackEl.textContent = 'URL入力後にコピー導線が有効になります';
                    }
                }
                if (recoveryFlowEl) {
                    recoveryFlowEl.style.display = statusKey === 'error' ? '' : 'none';
                }
                if (recoveryHintEl) {
                    if (statusKey === 'error') {
                        const step1Label = String(recoveryStep1LabelEl?.textContent || '').trim() || '1. 次アクション';
                        recoveryHintEl.textContent = step1Label + ' → 2. 入力内容で確認 → 3. 引き継ぎ情報をコピー の順で進めてください';
                    } else if (statusKey === 'loading') {
                        recoveryHintEl.textContent = '判定中です。失敗が確定したら 1 → 2 → 3 の順で進めます';
                    } else if (statusKey === 'success') {
                        recoveryHintEl.textContent = '表示成功です。失敗時のみ復旧順を表示します';
                    } else {
                        recoveryHintEl.textContent = '失敗したら 1 → 2 → 3 の順で押すと最短で復旧・引き継ぎできます';
                    }
                }
            },

            _getThumbnailDiagnosticCodeLabel: function (statusKey, errorCode) {
                if (statusKey === 'success') return 'ok';
                if (statusKey === 'loading') return 'checking';
                if (statusKey === 'empty') return 'none';
                return String(errorCode || 'fetch_failed').trim() || 'fetch_failed';
            },

            _getThumbnailDiagnosticMeaningLabel: function (statusKey, errorCode) {
                if (statusKey === 'success') return '表示に成功。保存時はURL文字列が保存されます';
                if (statusKey === 'loading') return 'URLから画像取得を確認中です';
                if (statusKey === 'empty') return '未入力のため未判定です';
                if (errorCode === 'invalid_drive_url') return 'Drive共有URLの形式が不正、またはURLとして解釈できません';
                if (errorCode === 'permission_denied') return '対象ファイルを閲覧する権限が不足しています';
                if (errorCode === 'not_image') return '対象ファイルは画像ではありません';
                if (errorCode === 'file_not_found') return 'ファイルIDに対応するファイルが見つかりません';
                return '画像取得処理に失敗しました';
            },

            _getThumbnailDiagnosticActionLabel: function (recommendedAction) {
                if (recommendedAction === 'normalize_refresh') return 'Drive URLを整形 → 入力内容で確認';
                if (recommendedAction === 'refresh') return '入力内容で確認';
                if (recommendedAction === 'open_source') return 'URLを開く';
                return '入力内容で確認';
            },

            _updateThumbnailDiagnostics: function (statusKey, errorCode, recommendedAction) {
                const codeEl = document.getElementById('plan-detail-thumbnail-diagnostic-code');
                const meaningEl = document.getElementById('plan-detail-thumbnail-diagnostic-meaning');
                const actionEl = document.getElementById('plan-detail-thumbnail-diagnostic-action');
                const diagnosticsEl = document.getElementById('plan-detail-thumbnail-diagnostics');
                if (codeEl) codeEl.textContent = this._getThumbnailDiagnosticCodeLabel(statusKey, errorCode);
                if (meaningEl) meaningEl.textContent = this._getThumbnailDiagnosticMeaningLabel(statusKey, errorCode);
                if (actionEl) actionEl.textContent = this._getThumbnailDiagnosticActionLabel(recommendedAction);
                if (diagnosticsEl) {
                    diagnosticsEl.className = statusKey === 'error'
                        ? 'small-text tertiary-text top-margin'
                        : 'small-text secondary-text top-margin';
                }
            },

            _resolveThumbnailRecommendedAction: function (statusKey, errorCode) {
                if (statusKey === 'success') return 'open_source';
                if (statusKey !== 'error') return 'none';
                if (errorCode === 'invalid_drive_url') return 'normalize_refresh';
                return 'refresh';
            },

            _scheduleThumbnailPreviewRefresh: function () {
                this._cancelThumbnailPreviewRefresh();
                this.thumbnailPreviewDebounceTimer = setTimeout(function () {
                    App.modals.planDetail.thumbnailPreviewDebounceTimer = null;
                    App.modals.planDetail._refreshThumbnailPreviewFromInput(false);
                }, 350);
            },

            _cancelThumbnailPreviewRefresh: function () {
                if (!this.thumbnailPreviewDebounceTimer) return;
                clearTimeout(this.thumbnailPreviewDebounceTimer);
                this.thumbnailPreviewDebounceTimer = null;
            },

            _refreshThumbnailPreviewFromInput: async function (forceImmediate) {
                if (forceImmediate === true) {
                    this._cancelThumbnailPreviewRefresh();
                }
                const inputEl = document.getElementById('plan-detail-thumbnail-url-input');
                if (!inputEl) return;
                const url = String(inputEl.value || '').trim();
                if (!url) {
                    this.thumbnailPreviewErrorCode = '';
                    this._setThumbnailPreviewState('サムネイルURLを入力するとプレビューを表示します', null, 'empty');
                    return;
                }

                if (!this._isHttpOrHttpsUrl(url)) {
                    this.thumbnailPreviewErrorCode = 'invalid_drive_url';
                    this._setThumbnailPreviewState('URLはhttp/https形式で入力してください', null, 'error');
                    return;
                }

                const requestToken = String(Date.now()) + '-' + String(Math.random()).slice(2);
                this.thumbnailPreviewToken = requestToken;
                this.thumbnailPreviewErrorCode = '';
                this._setThumbnailPreviewState('サムネイルを読み込み中です...', null, 'loading');

                try {
                    const result = await callGAS('getDriveImageDataUrl', url);
                    if (this.thumbnailPreviewToken !== requestToken) return;
                    const dataUrl = result && result.dataUrl ? String(result.dataUrl) : '';
                    if (!dataUrl) {
                        throw new Error('画像データを取得できませんでした');
                    }
                    this.thumbnailPreviewErrorCode = '';
                    this._setThumbnailPreviewState('', dataUrl, 'success');
                } catch (error) {
                    if (this.thumbnailPreviewToken !== requestToken) return;
                    console.error('[PlanDetail] サムネイルプレビュー取得エラー:', error);
                    const errorInfo = this._parseThumbnailPreviewError(error);
                    this.thumbnailPreviewErrorCode = errorInfo.code;
                    this._setThumbnailPreviewState(errorInfo.message, null, 'error');
                }
            },

            retryThumbnailPreview: function () {
                this._refreshThumbnailPreviewFromInput(true);
            },

            manualRefreshThumbnailPreview: function () {
                this._refreshThumbnailPreviewFromInput(true);
            },

            normalizeThumbnailUrlInput: function () {
                const inputEl = document.getElementById('plan-detail-thumbnail-url-input');
                if (!inputEl) return;
                const current = String(inputEl.value || '').trim();
                if (!current) {
                    this.thumbnailPreviewErrorCode = 'invalid_drive_url';
                    this._setThumbnailPreviewState('サムネイルURLを入力してから整形してください', null, 'error');
                    return;
                }
                const normalized = this._normalizeDriveFileUrl(current);
                if (!normalized) {
                    this.thumbnailPreviewErrorCode = 'invalid_drive_url';
                    this._setThumbnailPreviewState('Drive共有URLを入力してください（file/d/{id} または open?id=）', null, 'error');
                    return;
                }
                if (normalized !== current) {
                    inputEl.value = normalized;
                    this.toggleDirty(true);
                }
                this.thumbnailPreviewErrorCode = '';
                this._setThumbnailPreviewState('Drive画像URLを整形しました。表示確認を実行します', null, 'loading');
                this._refreshThumbnailPreviewFromInput(true);
            },

            normalizeAndRefreshThumbnailPreview: function () {
                const inputEl = document.getElementById('plan-detail-thumbnail-url-input');
                if (!inputEl) return;
                const current = String(inputEl.value || '').trim();
                if (!current) {
                    this.thumbnailPreviewErrorCode = 'invalid_drive_url';
                    this._setThumbnailPreviewState('サムネイルURLを入力してから整形してください', null, 'error');
                    return;
                }
                const normalized = this._normalizeDriveFileUrl(current);
                if (!normalized) {
                    this.thumbnailPreviewErrorCode = 'invalid_drive_url';
                    this._setThumbnailPreviewState('Drive共有URLを入力してください（file/d/{id} または open?id=）', null, 'error');
                    return;
                }
                if (normalized !== current) {

                this.thumbnailCopyFeedbackTimer = setTimeout(function () {
                    App.modals.planDetail.thumbnailCopyFeedbackTimer = null;

                    App.modals.planDetail._setThumbnailPreviewState(

                        document.getElementById('plan-detail-thumbnail-preview-image')?.getAttribute('src') || '',

            _copyTextToClipboard: async function (text) {
                const payload = String(text || '');
                if (!payload) return false;
                if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                    await navigator.clipboard.writeText(payload);
                    return true;
                }
                const tempArea = document.createElement('textarea');
                tempArea.value = payload;
                tempArea.setAttribute('readonly', 'readonly');
                tempArea.style.position = 'fixed';
                tempArea.style.top = '-9999px';
                document.body.appendChild(tempArea);
                tempArea.select();
                tempArea.setSelectionRange(0, tempArea.value.length);
                const copied = document.execCommand('copy');
                document.body.removeChild(tempArea);
                if (!copied) {
                    throw new Error('copy_command_failed');
                }
                return true;
            },

            _getThumbnailUrl: function () {
                const inputEl = document.getElementById('plan-detail-thumbnail-url-input');
                return String(inputEl?.value || '').trim();

            _normalizeDriveFileUrl: function (urlText) {
                const text = String(urlText || '').trim();
                if (!text) return '';
                if (!this._isHttpOrHttpsUrl(text)) return '';
                try {
                    const parsed = new URL(text);
                    const host = String(parsed.hostname || '').toLowerCase();
                    let fileId = '';
                    if (host.indexOf('drive.google.com') === -1 && host.indexOf('docs.google.com') === -1) {
                        return '';
                    }
                    const pathMatch = parsed.pathname.match(/\/d\/([a-zA-Z0-9_-]+)/);
                    if (pathMatch && pathMatch[1]) {
                        fileId = pathMatch[1];
                    }
                    if (!fileId) {
                        fileId = parsed.searchParams.get('id') || '';
                    }
                    if (!fileId) return '';
                    return 'https://drive.google.com/file/d/' + fileId + '/view';
                } catch (error) {
                    return '';
                }
            },

            _parseThumbnailPreviewError: function (error) {
                const raw = String(error && error.message ? error.message : error || '');
                const normalized = raw.replace(/^Exception:\s*/, '');
                const tagged = normalized.match(/THUMBNAIL_ERROR:([^:]+):([\s\S]*)/);
                if (tagged) {
                    const code = String(tagged[1] || 'fetch_failed').trim() || 'fetch_failed';
                    const message = String(tagged[2] || 'サムネイルの取得に失敗しました').trim() || 'サムネイルの取得に失敗しました';
                    return { code: code, message: message };
                }

                if (/Google DriveのURL|DriveファイルID|invalid|URL/.test(normalized)) {
                    return { code: 'invalid_drive_url', message: 'Google Driveの画像URLを指定してください' };
                }
                if (/権限|アクセス|permission|authorized/i.test(normalized)) {
                    return { code: 'permission_denied', message: '指定されたファイルへのアクセス権限がありません' };
                }
                if (/画像ではありません|image/i.test(normalized)) {
                    return { code: 'not_image', message: '指定されたファイルは画像ではありません' };
                }
                return {
                    code: 'fetch_failed',
                    message: 'サムネイルの取得に失敗しました'
                };
            },

            _isNonNegativeIntegerText: function (value) {
                const text = String(value || '').trim();
                if (!text) return true;
                if (!/^\d+$/.test(text)) return false;
                const number = Number(text);
                return Number.isFinite(number) && number >= 0;
            },

            _isHttpOrHttpsUrl: function (value) {
                const text = String(value || '').trim();
                if (!text) return true;
                try {
                    const parsed = new URL(text);
                    return parsed.protocol === 'http:' || parsed.protocol === 'https:';
                } catch (error) {
                    return false;
                }
            },

            _validatePlanInputs: function () {
                if (this.isDeleteRequested === true) {
                    return {
                        canSave: true,
                        level: 'info',
                        message: ''
                    };
                }

                const name = String(document.getElementById('plan-detail-name-input')?.value || '').trim();
                if (!name) {
                    return {
                        canSave: false,
                        level: 'warning',
                        message: '企画名を入力すると保存できます',
                        fieldId: 'plan-detail-name-input'
                    };
                }

                const integerFields = [
                    { id: 'plan-detail-plan-type-sequence-number-input', label: '企画種別内連番' },
                    { id: 'plan-detail-estimated-staff-count-input', label: '推定運営者数' },
                    { id: 'plan-detail-estimated-participant-count-input', label: '推定参加者数' },
                    { id: 'plan-detail-estimated-total-cost-input', label: '推定合計費用' },
                    { id: 'plan-detail-actual-staff-count-input', label: '実績運営者数' },
                    { id: 'plan-detail-actual-participant-count-input', label: '実績参加者数' },
                    { id: 'plan-detail-actual-total-cost-input', label: '実績合計費用' }
                ];
                for (let i = 0; i < integerFields.length; i += 1) {
                    const field = integerFields[i];
                    const text = String(document.getElementById(field.id)?.value || '').trim();
                    if (!text) continue;
                    if (!this._isNonNegativeIntegerText(text)) {
                        return {
                            canSave: false,
                            level: 'error',
                            message: field.label + ' は0以上の整数で入力してください',
                            fieldId: field.id
                        };
                    }
                }

                const urlFields = [
                    { id: 'plan-detail-selection-presentation-url-input', label: '選考プレゼン動画URL' },
                    { id: 'plan-detail-online-media-url-input', label: 'オンライン媒体URL' },
                    { id: 'plan-detail-website-url-input', label: '特設サイトURL' },
                    { id: 'plan-detail-sheet-url-input', label: 'シートURL' },
                    { id: 'plan-detail-folder-url-input', label: 'フォルダURL' },
                    { id: 'plan-detail-document-url-input', label: 'ドキュメントURL' },
                    { id: 'plan-detail-slide-url-input', label: 'スライドURL' },
                    { id: 'plan-detail-script-url-input', label: '台本URL' },
                    { id: 'plan-detail-thumbnail-url-input', label: 'サムネイルURL' },
                    { id: 'plan-detail-slack-channel-url-input', label: 'SlackチャンネルURL' }
                ];
                for (let i = 0; i < urlFields.length; i += 1) {
                    const field = urlFields[i];
                    const text = String(document.getElementById(field.id)?.value || '').trim();
                    if (!text) continue;
                    if (!this._isHttpOrHttpsUrl(text)) {
                        return {
                            canSave: false,
                            level: 'error',
                            message: field.label + ' はhttp/https形式で入力してください',
                            fieldId: field.id
                        };
                    }
                }

                return {
                    canSave: true,
                    level: 'info',
                    message: ''
                };
            },

            _setErrorMessage: function (message, level) {
                const containerEl = document.getElementById('plan-detail-error-container');
                const errorEl = document.getElementById('plan-detail-error');
                const iconEl = document.getElementById('plan-detail-error-icon');
                if (!containerEl || !errorEl || !iconEl) return;

                const text = String(message || '').trim();
                if (!text) {
                    containerEl.style.display = 'none';
                    errorEl.textContent = '';
                    iconEl.textContent = 'error';
                    containerEl.className = 'small-round padding top-margin';
                    return;
                }

                const kind = level === 'warning' ? 'warning' : 'error';
                containerEl.className = kind === 'warning'
                    ? 'small-round padding top-margin secondary-container'
                    : 'small-round padding top-margin error-container';
                iconEl.textContent = kind === 'warning' ? 'warning' : 'error';
                errorEl.className = kind === 'warning' ? 'small-text no-margin' : 'small-text no-margin error-text';
                errorEl.textContent = text;
                containerEl.style.display = '';
            },

            _updateActionButtons: function () {
                const saveButton = document.getElementById('plan-detail-save-button');
                const discardButton = document.getElementById('plan-detail-discard-button');
                const requestDeleteButton = document.getElementById('plan-detail-request-delete-button');
                const closeButton = document.getElementById('plan-detail-close-button');
                const newCommentHeaderButton = document.getElementById('plan-detail-new-comment-header-button');
                const newCommentSideButton = document.getElementById('plan-detail-new-comment-side-button');
                const openMembersButton = document.getElementById('plan-detail-open-members-button');
                const unsavedIndicator = document.getElementById('plan-detail-unsaved-indicator');
                const saveReadinessChip = document.getElementById('plan-detail-save-readiness-chip');
                const processing = this.isSaving || this.isDeleting;
                const hasChanges = this.isDirty === true;
                const validationResult = this._validatePlanInputs();
                const canSave = hasChanges && !processing && validationResult.canSave;
                if (saveButton) {
                    saveButton.disabled = !canSave;
                    const isMembersTab = document.getElementById('plan-detail-tab-members')?.classList.contains('active') === true;
                    const defaultLabel = isMembersTab
                        ? '<i>save</i><span>関係者の変更を保存</span>'
                        : '<i>save</i><span>変更を保存</span>';
                    saveButton.innerHTML = defaultLabel;
                    if (this.isDeleting) {
                        saveButton.innerHTML = '<progress class="circle small"></progress><span>削除を実行中...</span>';
                    } else if (this.isSaving) {
                        saveButton.innerHTML = '<progress class="circle small"></progress><span>保存中...</span>';
                    } else if (this.isDeleteRequested) {
                        saveButton.innerHTML = '<i>delete</i><span>削除を確定</span>';
                    }
                }
                if (saveReadinessChip) {
                    saveReadinessChip.className = 'chip small';
                    if (processing) {
                        saveReadinessChip.textContent = '判定保留';
                        saveReadinessChip.className += ' tertiary-container';
                    } else if (!hasChanges) {
                        saveReadinessChip.textContent = '保存不要';
                    } else if (validationResult.canSave) {
                        saveReadinessChip.textContent = '保存可能';
                        saveReadinessChip.className += ' secondary-container';
                    } else {
                        saveReadinessChip.textContent = '保存不可';
                        saveReadinessChip.className += ' error-container';
                    }
                }
                if (discardButton) {
                    discardButton.disabled = !hasChanges || processing;
                }
                if (requestDeleteButton) requestDeleteButton.disabled = processing;
                if (closeButton) closeButton.disabled = processing;
                if (newCommentHeaderButton) newCommentHeaderButton.disabled = processing;
                if (newCommentSideButton) newCommentSideButton.disabled = processing;
                if (openMembersButton) openMembersButton.disabled = processing;
                if (unsavedIndicator) {
                    unsavedIndicator.className = this.isDeleteRequested ? 'chip small error-container' : 'chip small';
                    if (this.isDeleting) {
                        unsavedIndicator.textContent = '削除処理中';
                    } else if (this.isSaving) {
                        unsavedIndicator.textContent = '保存処理中';
                    } else if (this.isDeleteRequested) {
                        unsavedIndicator.textContent = '削除予約中';
                    } else {
                        unsavedIndicator.textContent = hasChanges ? '未保存の変更あり' : '保存済み';
                    }
                }
                if (!processing && this.lastOperationState === 'dirty') {
                    if (validationResult.canSave) {
                        this._setOperationState('dirty');
                    } else {
                        this._setOperationState('dirty_invalid', validationResult.message);
                    }
                }

            },

            _setInputsDisabled: function (disabled) {
                const dialog = document.getElementById('modal-detail-plan');
                if (!dialog) return;
                const controls = dialog.querySelectorAll('input, textarea, select, button');
                controls.forEach(function (el) {
                    if (!el) return;
                    if (
                        el.id === 'plan-detail-save-button' ||
                        el.id === 'plan-detail-discard-button' ||
                        el.id === 'plan-detail-request-delete-button' ||
                        el.id === 'plan-detail-close-button' ||
                        el.id === 'plan-detail-thumbnail-preview-retry' ||
                        el.id === 'plan-detail-thumbnail-preview-open' ||
                        el.id === 'plan-detail-thumbnail-normalize-button' ||
                        el.id === 'plan-detail-thumbnail-normalize-refresh-button' ||
                        el.id === 'plan-detail-thumbnail-refresh-button' ||
                        el.id === 'plan-detail-thumbnail-next-action-button' ||
                        el.id === 'plan-detail-thumbnail-copy-url-button' ||
                        el.id === 'plan-detail-thumbnail-copy-note-button' ||
                        el.id === 'plan-detail-new-comment-header-button' ||
                        el.id === 'plan-detail-new-comment-side-button' ||
                        el.id === 'plan-detail-open-members-button'
                    ) {
                        return;
                    }
                    el.disabled = disabled === true;
                });
            },

            _setOperationState: function (state, detailMessage) {
                const operationEl = document.getElementById('plan-detail-operation-state');
                if (!operationEl) return;
                this.lastOperationState = state;

                if (state === 'saving') {
                    operationEl.className = 'small-text tertiary-text bottom-margin';
                    operationEl.textContent = '保存中です。処理が完了するまで操作をロックしています';
                    return;
                }
                if (state === 'save_success') {
                    operationEl.className = 'small-text secondary-text bottom-margin';
                    operationEl.textContent = '保存が完了しました';
                    return;
                }
                if (state === 'save_error') {
                    operationEl.className = 'small-text error-text bottom-margin';
                    operationEl.textContent = '保存に失敗しました。入力内容を確認して再試行してください';
                    return;
                }
                if (state === 'delete_reserved') {
                    operationEl.className = 'small-text error-text bottom-margin';
                    operationEl.textContent = '削除予約中です。「削除を確定」で削除が実行されます';
                    return;
                }
                if (state === 'deleting') {
                    operationEl.className = 'small-text error-text bottom-margin';
                    operationEl.textContent = '削除処理中です。完了までお待ちください';
                    return;
                }
                if (state === 'delete_error') {
                    operationEl.className = 'small-text error-text bottom-margin';
                    operationEl.textContent = '削除に失敗しました。時間をおいて再試行してください';
                    return;
                }
                if (state === 'dirty') {
                    const validationResult = this._validatePlanInputs();
                    if (!validationResult.canSave) {
                        operationEl.className = 'small-text error-text bottom-margin';
                        operationEl.textContent = '未保存の変更があります。' + validationResult.message;
                        return;
                    }
                    operationEl.className = 'small-text secondary-text bottom-margin';
                    operationEl.textContent = '未保存の変更があります';
                    return;
                }
                if (state === 'dirty_invalid') {
                    operationEl.className = 'small-text error-text bottom-margin';
                    operationEl.textContent = detailMessage ? ('未保存の変更があります。' + detailMessage) : '未保存の変更があります。入力内容を確認してください';
                    return;
                }
                operationEl.className = 'small-text secondary-text bottom-margin';
                operationEl.textContent = '編集すると「未保存の変更あり」に変わります';
            },

            _updateStatusChipColor: function (status) {
                const chipEl = document.getElementById('plan-detail-status-chip');
                if (!chipEl) return;
                const warningStatuses = ['RETURNED', 'REJECTED', 'DISCARDED'];
                const successStatuses = ['APPROVED', 'READY', 'PUBLISHED'];
                const processingStatuses = ['IN_REVIEW1', 'IN_REVIEW2', 'IN_PREPARATION'];
                chipEl.className = 'chip small';
                if (warningStatuses.indexOf(status) !== -1) {
                    chipEl.className += ' error-container';
                    return;
                }
                if (successStatuses.indexOf(status) !== -1) {
                    chipEl.className += ' secondary-container';
                    return;
                }
                if (processingStatuses.indexOf(status) !== -1) {
                    chipEl.className += ' tertiary-container';
                }
            },

            _escapeHtml: function (value) {
                return String(value || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            },

            _escapeAttr: function (value) {
                return this._escapeHtml(value).replace(/`/g, '&#96;');
            }
        };

        const originalToggleDirty = App.modals.planDetail.toggleDirty;
        App.modals.planDetail.toggleDirty = function (nextValue) {
            originalToggleDirty.call(this, nextValue);
            if (!this.isSaving && !this.isDeleting) {
                if (this.isDeleteRequested) {
                    this._setOperationState('delete_reserved');
                } else if (this.isDirty) {
                    this._setOperationState('dirty');
                } else {
                    this._setOperationState('idle');
                }
            }
            this._updateActionButtons();
        };
    })();
</script>
