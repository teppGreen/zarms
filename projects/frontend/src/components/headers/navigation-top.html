<nav class="top right-margin surface">

    <button id="new-button" class="large round primary">
        <i><img src="https://i.gyazo.com/57e5513686f69b7aa4210c4dd8558c15.png" class="responsive"></i>
        <span class="l">新規作成</span>
        <menu id="new-button-dropdown" class="min no-wrap">
            <li>
                <a onclick="App.modals.newTask.open()">
                    <i>add_task</i>
                    <span>新しいタスク</span>
                </a>
            </li>
            <li>
                <a onclick="App.pages.boards.createBoard()">
                    <i>create_new_folder</i>
                    <span>新しいボード</span>
                </a>
            </li>
            <li>
                <a onclick="App.modals.newMember.open()">
                    <i>person_add</i>
                    <span>新しいメンバー</span>
                </a>
            </li>
            <li>
                <a onclick="App.modals.newDirectory.open()">
                    <i>account_tree</i>
                    <span>新しい組織</span>
                </a>
            </li>
            <li>
                <a onclick="App.modals.newSkill.open()">
                    <i>psychology</i>
                    <span>新しいスキル</span>
                </a>
            </li>
        </menu>
    </button>

    <!-- 検索バー -->
    <div class="field round prefix border" id="search-container">
        <i id="search-icon" class="front" style="cursor: pointer;"
            onclick="App.utils.search.handleSearchClick()">search</i>
        <input placeholder="検索" id="search-input" onkeydown="App.utils.search.handleSearchKeydown(event)"
            onblur="App.utils.search.handleSearchBlur(event)">
        <div class="l tooltip right round left-padding right-padding">
            <p>タスク名またはタスク番号を検索します</p>
            <span><i class="tiny no-padding no-margin">keyboard_option_key</i>F</span>
        </div>
    </div>

    <div class="max"></div>

    <nav class="left-margin right-margin">
        <button id="comments-button" class="l circle transparent" onclick="App.utils.header.comments.toggle()" title="コメント">
            <i>comment</i>
            <span id="comments-badge" class="badge" style="display: none;">0</span>
            <menu id="comments-menu" class="left no-padding medium-width">
                <div id="comments-list">
                    <!-- コメントはクリック時に動的に生成される -->
                </div>
            </menu>
        </button>

        <button class="l circle transparent" title="リンク">
            <i>apps</i>
            <menu id="apps-menu" class="left no-padding medium-width">
                <div id="apps-grid">
                    <!-- リンクはloadAllData実行時に動的に生成される -->
                </div>
            </menu>
        </button>

        <button class="circle transparent" title="ヘルプ">
            <i>help</i>
            <menu id="help-menu" class="left no-wrap">
                <li><a id="help-link" href="" target="_blank">ヘルプ</a></li>
                <li><a id="terms-link" href="" target="_blank">利用規約</a></li>
                <li><a id="privacy-link" href="" target="_blank">プライバシーポリシー</a></li>
            </menu>
        </button>

        <button id="system-info-button" class="l circle transparent" title="ZARMSについて" onclick="App.utils.header.systemUpdates.toggle()">
            <i>info</i>
            <menu id="system-info-menu" class="left no-padding medium-width">
                <div id="system-info-list">
                    <!-- アップデート情報はloadAllData実行時に動的に生成される -->
                </div>
            </menu>
        </button>
    </nav>
</nav>

<!-- システムアップデート通知モーダル -->
<dialog id="modal-system-update" class="modal max large-padding">
    <div class="large-margin large-padding center-align">
        <h5 class="bold">ZARMSがアップデートされました</h5>
        <p>新しいバージョンを使うために、ページを更新してください。</p>
        <div class="grid large-margin">
            <div class="s6">
                <button class="primary-container extra responsive" onclick="ui('#modal-system-update')">
                    <span class="secondary-text">あとで</span>
                </button>
            </div>
            <div class="s6">
                <button class="primary extra responsive" onclick="App.utils.header.systemUpdates.reloadPage(this)">
                    <i>refresh</i>
                    <span>今すぐ更新する</span>
                </button>
            </div>
        </div>
    </div>
</dialog>
