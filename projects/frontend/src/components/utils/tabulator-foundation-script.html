<script>
    (function () {
        if (!App.utils) App.utils = {};
        if (!App.utils.tabulator) App.utils.tabulator = {};

        Object.assign(App.utils.tabulator, {
            createMessageTypes: function (prefix) {
                const base = String(prefix || 'tabulator').trim() || 'tabulator';
                return {
                    ready: base + '-ready',
                    rowClick: base + '-row-click',
                    openExternal: base + '-open-external',
                    sortChange: base + '-sort-change',
                    filterChange: base + '-filter-change',
                    error: base + '-error',
                    render: base + '-render',
                    resize: base + '-resize',
                    downloadCsv: base + '-download-csv',
                    downloadCsvResult: base + '-download-csv-result'
                };
            },

            createFrameToken: function () {
                let token = '';
                try {
                    const bytes = new Uint8Array(16);
                    window.crypto.getRandomValues(bytes);
                    token = Array.from(bytes).map(function (value) {
                        return value.toString(16).padStart(2, '0');
                    }).join('');
                } catch (err) {
                    token = String(Date.now()) + String(Math.random()).slice(2);
                }
                return token;
            },

            createFrameElement: function (options) {
                const config = options || {};
                const frame = document.createElement('iframe');
                frame.id = String(config.frameId || 'tabulator-frame');
                frame.className = String(config.className || 'tabulator-frame');
                frame.setAttribute('title', String(config.title || 'Tabulator一覧'));
                frame.setAttribute('sandbox', String(config.sandbox || 'allow-scripts allow-popups allow-popups-to-escape-sandbox'));
                frame.setAttribute('loading', String(config.loading || 'eager'));
                frame.setAttribute('referrerpolicy', String(config.referrerpolicy || 'no-referrer'));
                frame.srcdoc = String(config.srcdoc || '');
                frame.style.width = String(config.width || '100%');
                frame.style.border = String(config.border || '0');
                frame.style.display = String(config.display || 'block');
                frame.style.background = String(config.background || 'transparent');
                return frame;
            },

            mountFrameToContainer: function (options) {
                const config = options || {};
                const container = config.container || null;
                if (!container) return null;

                const frameId = String(config.frameId || 'tabulator-frame');
                let frame = document.getElementById(frameId);
                if (!frame) {
                    frame = this.createFrameElement(config);
                    container.innerHTML = '';
                    container.appendChild(frame);
                }
                return frame;
            },

            buildFrameSrcdoc: function (options) {
                const config = options || {};
                const tabName = String(config.tabName || 'tab');
                const token = String(config.token || '');
                const messageTypes = config.messageTypes || this.createMessageTypes('tabulator');
                const hostSource = String(config.hostSource || 'tabulator-host');
                const rootId = String(config.rootId || 'tabulator-root');
                const hiddenColumnsKey = String(config.hiddenColumnsKey || 'tabulator.hiddenColumns');
                const tableCssUrl = String(config.tableCssUrl || 'https://unpkg.com/tabulator-tables@6.4.0/dist/css/tabulator.min.css');
                const tableCssIntegrity = String(config.tableCssIntegrity || '');
                const tableJsUrl = String(config.tableJsUrl || 'https://unpkg.com/tabulator-tables@6.4.0/dist/js/tabulator.min.js');
                const tableJsIntegrity = String(config.tableJsIntegrity || '');
                const dataTreeElementColumn = String(config.dataTreeElementColumn || 'name');
                const cssAttrs = tableCssIntegrity ? ' integrity="' + tableCssIntegrity + '" crossorigin="anonymous"' : ' crossorigin="anonymous"';
                const jsAttrs = tableJsIntegrity ? ' integrity="' + tableJsIntegrity + '" crossorigin="anonymous"' : ' crossorigin="anonymous"';

                return ''
                    + '<!doctype html>'
                    + '<html lang="ja">'
                    + '    <head>'
                    + '        <meta charset="UTF-8">'
                    + '        <meta name="viewport" content="width=device-width, initial-scale=1.0">'
                    + '        <link rel="stylesheet" href="' + tableCssUrl + '"' + cssAttrs + '>'
                    + '        <style>'
                    + '            html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Noto Sans JP",sans-serif;}'
                    + '            #' + rootId + '{width:100%;height:100%;}'
                    + '            .tabulator{height:100%;border:0;background:var(--surface-container-low);font-size:14px;}'
                    + '            .tabulator .tabulator-header{background:#fff;border-bottom:1px solid #dadce0;color:#1f1f1f;font-weight:600;}'
                    + '            .tabulator .tabulator-col,.tabulator .tabulator-cell{padding:12px 14px;}'
                    + '            .tabulator .tabulator-row{background:#fff;border-bottom:1px solid #eceff1;}'
                    + '            .tabulator .tabulator-row:hover{background:#f7faff;}'
                    + '            .tabulator-row.tabulator-selected{background:#eef3ff;}'
                    + '            .tabulator-placeholder{display:flex;align-items:center;justify-content:center;color:#5f6368;}'
                    + '            .members-tabulator-cell-wrap{white-space:normal;line-height:1.5;}'
                    + '            .members-tabulator-cell-nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}'
                    + '            .members-open-detail-btn{padding:4px 10px;border:1px solid #c7cacf;border-radius:999px;background:#fff;color:#1f1f1f;cursor:pointer;font-size:12px;line-height:1.2;}'
                    + '            .members-open-detail-btn:hover{background:#f3f6fb;}'
                    + '            .members-name-cell{display:flex;align-items:center;gap:8px;min-width:0;}'
                    + '            .members-avatar{width:22px;height:22px;border-radius:50%;overflow:hidden;background:#d8dce3;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:#37474f;font-style:normal;font-weight:600;}'
                    + '            .members-avatar .responsive{width:100%;height:100%;object-fit:cover;display:block;}'
                    + '            .members-name-link{color:#2d3eff;cursor:pointer;display:block;text-align:left;padding:0;min-width:0;max-width:100%;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:underline;}'
                    + '            .members-name-label{display:block;min-width:0;max-width:100%;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9aa0a6;text-decoration:none;}'
                    + '            .members-copy-btn{border:1px solid #d2d7df;background:#fff;border-radius:999px;cursor:pointer;min-width:44px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:#1f1f1f;flex-shrink:0;padding:0 8px;}'
                    + '            .members-copy-btn:hover{background:#f3f6fb;}'
                    + '        </style>'
                    + '    </head>'
                    + '    <body>'
                    + '        <div id="' + rootId + '"></div>'
                    + '        <script src="' + tableJsUrl + '"' + jsAttrs + '><\/script>'
                    + '        <script>'
                    + '            const FRAME_TOKEN = ' + JSON.stringify(token) + ';'
                    + '            const TAB_NAME = ' + JSON.stringify(tabName) + ';'
                    + '            const ROOT_ID = ' + JSON.stringify(rootId) + ';'
                    + '            const HOST_SOURCE = ' + JSON.stringify(hostSource) + ';'
                    + '            const MESSAGE_TYPES = ' + JSON.stringify(messageTypes) + ';'
                    + '            const HIDDEN_COLUMNS_KEY = ' + JSON.stringify(hiddenColumnsKey) + ';'
                    + '            const DATA_TREE_ELEMENT_COLUMN = ' + JSON.stringify(dataTreeElementColumn) + ';'
                    + '            let table = null;'
                    + '            let tableBuilt = false;'
                    + '            let selectedCell = null;'
                    + ''
                    + '            function postMessageToParent(type, payload) {'
                    + '                window.parent.postMessage({ source: "members-tabulator", type: type, tabName: TAB_NAME, token: FRAME_TOKEN, payload: payload || {} }, "*");'
                    + '            }'
                    + ''
                    + '            function readHiddenColumns() {'
                    + '                try {'
                    + '                    const raw = localStorage.getItem(HIDDEN_COLUMNS_KEY);'
                    + '                    if (!raw) return [];'
                    + '                    const parsed = JSON.parse(raw);'
                    + '                    if (!Array.isArray(parsed)) return [];'
                    + '                    return parsed.filter(function (value) {'
                    + '                        return typeof value === "string" && value !== "" && value !== "__open_action";'
                    + '                    });'
                    + '                } catch (error) {'
                    + '                    return [];'
                    + '                }'
                    + '            }'
                    + ''
                    + '            function writeHiddenColumns(fields) {'
                    + '                try {'
                    + '                    localStorage.setItem(HIDDEN_COLUMNS_KEY, JSON.stringify(fields || []));'
                    + '                } catch (error) {}'
                    + '            }'
                    + ''
                    + '            function syncHiddenColumnsFromTable() {'
                    + '                if (!table) return;'
                    + '                const hidden = [];'
                    + '                (table.getColumns() || []).forEach(function (column) {'
                    + '                    if (!column || !column.getField || !column.isVisible) return;'
                    + '                    const field = column.getField();'
                    + '                    if (!field || field === "__open_action") return;'
                    + '                    if (!column.isVisible()) hidden.push(field);'
                    + '                });'
                    + '                writeHiddenColumns(hidden);'
                    + '            }'
                    + ''
                    + '            function createHeaderMenu() {'
                    + '                if (!table || !table.getColumns) return [];'
                    + '                return (table.getColumns() || []).map(function (column) {'
                    + '                    if (!column || !column.getField || !column.getDefinition) return null;'
                    + '                    const field = column.getField();'
                    + '                    if (!field || field === "__open_action") return null;'
                    + '                    const definition = column.getDefinition() || {};'
                    + '                    const title = definition.title || field;'
                    + '                    const visible = column.isVisible ? column.isVisible() : true;'
                    + '                    return {'
                    + '                        label: (visible ? "✓ " : "□ ") + String(title),'
                    + '                        action: function (event) {'
                    + '                            if (event && event.stopPropagation) event.stopPropagation();'
                    + '                            if (column.isVisible && column.isVisible()) {'
                    + '                                column.hide();'
                    + '                            } else {'
                    + '                                column.show();'
                    + '                            }'
                    + '                            syncHiddenColumnsFromTable();'
                    + '                        }'
                    + '                    };'
                    + '                }).filter(Boolean);'
                    + '            }'
                    + ''
                    + '            function createStatusNode(value) {'
                    + '                const span = document.createElement("span");'
                    + '                span.textContent = String(value || "");'
                    + '                if (value === "在籍" || value === "有効") {'
                    + '                    span.style.color = "#2d3eff";'
                    + '                    span.style.fontWeight = "600";'
                    + '                } else {'
                    + '                    span.style.opacity = "0.6";'
                    + '                }'
                    + '                return span;'
                    + '            }'
                    + ''
                    + '            function createOpenButton(cell) {'
                    + '                const button = document.createElement("button");'
                    + '                button.type = "button";'
                    + '                button.className = "members-open-detail-btn";'
                    + '                button.textContent = "開く";'
                    + '                button.addEventListener("mousedown", function (event) {'
                    + '                    event.preventDefault();'
                    + '                    event.stopPropagation();'
                    + '                });'
                    + '                button.addEventListener("click", function (event) {'
                    + '                    event.preventDefault();'
                    + '                    event.stopPropagation();'
                    + '                    const row = cell && cell.getRow ? cell.getRow() : null;'
                    + '                    const data = row && row.getData ? row.getData() : null;'
                    + '                    const rowKey = data && data.__row_key !== undefined && data.__row_key !== null ? String(data.__row_key) : "";'
                    + '                    postMessageToParent(MESSAGE_TYPES.rowClick, { rowKey: rowKey });'
                    + '                });'
                    + '                return button;'
                    + '            }'
                    + ''
                    + '            function normalizeExternalUrl(value) {'
                    + '                const raw = value === null || value === undefined ? "" : String(value).trim();'
                    + '                if (!raw) return "";'
                    + '                if (!/^https?:\\/\\//i.test(raw)) {'
                    + '                    return "https://" + raw.replace(/^\\/+/, "");'
                    + '                }'
                    + '                return raw;'
                    + '            }'
                    + ''
                    + '            function createMemberNameCell(cell) {'
                    + '                const wrapper = document.createElement("div");'
                    + '                wrapper.className = "members-name-cell";'
                    + '                const row = cell && cell.getRow ? cell.getRow() : null;'
                    + '                const data = row && row.getData ? row.getData() : {};'
                    + '                const cellValue = cell && cell.getValue ? cell.getValue() : "";'
                    + '                const displayName = cellValue === null || cellValue === undefined ? "" : String(cellValue);'
                    + '                const avatar = document.createElement("i");'
                    + '                avatar.className = "circle small members-avatar";'
                    + '                const photoUrl = data && data.profile_photo_url ? String(data.profile_photo_url).trim() : "";'
                    + '                if (photoUrl) {'
                    + '                    const img = document.createElement("img");'
                    + '                    img.className = "responsive";'
                    + '                    img.alt = displayName;'
                    + '                    img.src = photoUrl;'
                    + '                    avatar.appendChild(img);'
                    + '                } else {'
                    + '                    avatar.textContent = (displayName || "?").slice(0, 1).toUpperCase();'
                    + '                }'
                    + '                const slackUrl = normalizeExternalUrl(data && data.slack_profile_url ? data.slack_profile_url : "");'
                    + '                let nameNode;'
                    + '                if (slackUrl) {'
                    + '                    const link = document.createElement("a");'
                    + '                    link.className = "members-name-link";'
                    + '                    link.href = slackUrl;'
                    + '                    link.rel = "noopener noreferrer";'
                    + '                    link.target = "_blank";'
                    + '                    link.textContent = displayName;'
                    + '                    link.addEventListener("click", function (event) {'
                    + '                        event.preventDefault();'
                    + '                        event.stopPropagation();'
                    + '                        postMessageToParent(MESSAGE_TYPES.openExternal, { url: slackUrl });'
                    + '                    });'
                    + '                    nameNode = link;'
                    + '                } else {'
                    + '                    const span = document.createElement("span");'
                    + '                    span.className = "members-name-label";'
                    + '                    span.textContent = displayName;'
                    + '                    nameNode = span;'
                    + '                }'
                    + '                wrapper.appendChild(avatar);'
                    + '                wrapper.appendChild(nameNode);'
                    + '                return wrapper;'
                    + '            }'
                    + ''
                    + '            function createColumns(columns, hiddenColumns) {'
                    + '                const hiddenSet = new Set(Array.isArray(hiddenColumns) ? hiddenColumns : []);'
                    + '                return (columns || []).map(function (column) {'
                    + '                    const definition = {'
                    + '                        title: column.title,'
                    + '                        field: column.field,'
                    + '                        headerSort: column.headerSort !== false,'
                    + '                        headerSortClickElement: "icon",'
                    + '                        sorter: column.sorter || "string",'
                    + '                        hozAlign: column.hozAlign || "left",'
                    + '                        cssClass: column.cssClass || "",'
                    + '                        variableHeight: column.variableHeight === true,'
                    + '                        formatter: "plaintext"'
                    + '                    };'
                    + '                    if (column.width) { definition.width = column.width; }'
                    + '                    if (column.headerFilterType !== false) {'
                    + '                        if (column.headerFilterType === "list") {'
                    + '                            definition.headerFilter = "list";'
                    + '                            definition.headerFilterParams = { values: Array.isArray(column.headerFilterValues) ? column.headerFilterValues : [], clearable: true };'
                    + '                        } else {'
                    + '                            definition.headerFilter = column.headerFilterType || "input";'
                    + '                        }'
                    + '                    }'
                    + '                    if (column.formatterKey === "status") {'
                    + '                        definition.formatter = function (cell) { return createStatusNode(cell.getValue()); };'
                    + '                    }'
                    + '                    if (column.formatterKey === "openAction") {'
                    + '                        definition.formatter = function (cell) { return createOpenButton(cell); };'
                    + '                    }'
                    + '                    if (column.formatterKey === "memberNameLink") {'
                    + '                        definition.formatter = function (cell) { return createMemberNameCell(cell); };'
                    + '                    }'
                    + '                    if (definition.field !== "__open_action" && hiddenSet.has(definition.field)) {'
                    + '                        definition.visible = false;'
                    + '                    }'
                    + '                    definition.headerMenu = function () { return createHeaderMenu(); };'
                    + '                    return definition;'
                    + '                });'
                    + '            }'
                    + ''
                    + '            function setupCellCopy() {'
                    + '                window.addEventListener("keydown", function (event) {'
                    + '                    if (!(event.metaKey || event.ctrlKey) || String(event.key || "").toLowerCase() !== "c") return;'
                    + '                    const hasRangeSelection = !!document.querySelector(".tabulator-range-selected");'
                    + '                    if (hasRangeSelection && table && table.copyToClipboard) {'
                    + '                        event.preventDefault();'
                    + '                        try {'
                    + '                            table.copyToClipboard("range", false, { columnHeaders: false, rowGroups: false, columnCalcs: false, formatCells: true });'
                    + '                            return;'
                    + '                        } catch (error) {}'
                    + '                    }'
                    + '                    if (!selectedCell || !selectedCell.getValue) return;'
                    + '                    event.preventDefault();'
                    + '                    const value = selectedCell.getValue();'
                    + '                    const text = value === null || value === undefined ? "" : String(value);'
                    + '                    if (navigator.clipboard && navigator.clipboard.writeText) {'
                    + '                        navigator.clipboard.writeText(text).catch(function () {});'
                    + '                    }'
                    + '                });'
                    + '            }'
                    + ''
                    + '            function applyHeaderFilters(filters) {'
                    + '                if (!table) return;'
                    + '                table.clearHeaderFilter();'
                    + '                (filters || []).forEach(function (filter) {'
                    + '                    if (!filter || !filter.field) return;'
                    + '                    table.setHeaderFilterValue(filter.field, String(filter.value || ""));'
                    + '                });'
                    + '            }'
                    + ''
                    + '            function downloadCsv(fileName) {'
                    + '                if (!table || typeof table.download !== "function") {'
                    + '                    postMessageToParent(MESSAGE_TYPES.downloadCsvResult, { ok: false, message: "表の初期化が未完了です" });'
                    + '                    return;'
                    + '                }'
                    + '                try {'
                    + '                    table.download("csv", String(fileName || "catalog.csv"), { bom: true });'
                    + '                    postMessageToParent(MESSAGE_TYPES.downloadCsvResult, { ok: true });'
                    + '                } catch (error) {'
                    + '                    postMessageToParent(MESSAGE_TYPES.downloadCsvResult, { ok: false, message: error && error.message ? error.message : "CSV出力に失敗しました" });'
                    + '                }'
                    + '            }'
                    + ''
                    + '            function renderTable(payload) {'
                    + '                const root = document.getElementById(ROOT_ID);'
                    + '                if (!root) return;'
                    + '                const rows = Array.isArray(payload.rows) ? payload.rows : [];'
                    + '                const sorters = Array.isArray(payload.sorters) ? payload.sorters : [];'
                    + '                const headerFilters = Array.isArray(payload.headerFilters) ? payload.headerFilters : [];'
                    + '                const hiddenColumns = readHiddenColumns();'
                    + '                const columns = createColumns(payload.columns, hiddenColumns);'
                    + '                if (!table) {'
                    + '                    tableBuilt = false;'
                    + '                    table = new Tabulator(root, {'
                    + '                        data: rows,'
                    + '                        columns: columns,'
                    + '                        layout: "fitColumns",'
                    + '                        height: "100%",'
                    + '                        placeholder: payload.emptyText || "データがありません",'
                    + '                        initialSort: sorters,'
                    + '                        index: "__row_key",'
                    + '                        dataTree: payload.dataTree === true,'
                    + '                        dataTreeStartExpanded: false,'
                    + '                        dataTreeElementColumn: DATA_TREE_ELEMENT_COLUMN,'
                    + '                        dataTreeChildField: "_children",'
                    + '                        clipboard: true,'
                    + '                        clipboardCopyRowRange: "range",'
                    + '                        clipboardCopyStyled: false,'
                    + '                        clipboardCopyConfig: { columnHeaders: false, rowGroups: false, columnCalcs: false, formatCells: true },'
                    + '                        selectableRows: false,'
                    + '                        selectableRange: 1,'
                    + '                        selectableRangeColumns: true,'
                    + '                        selectableRangeRows: true,'
                    + '                        selectableRangeAutoFocus: false'
                    + '                    });'
                    + '                    table.on("tableBuilt", function () { tableBuilt = true; });'
                    + '                    table.on("cellClick", function (event, cell) {'
                    + '                        if (!cell || !cell.getColumn) return;'
                    + '                        const field = cell.getColumn().getField();'
                    + '                        if (field === "__open_action") return;'
                    + '                        if (selectedCell && selectedCell.getElement) {'
                    + '                            selectedCell.getElement().classList.remove("members-cell-selected");'
                    + '                        }'
                    + '                        selectedCell = cell;'
                    + '                        if (cell.getElement) {'
                    + '                            cell.getElement().classList.add("members-cell-selected");'
                    + '                        }'
                    + '                    });'
                    + '                    table.on("dataSorted", function (sorters) {'
                    + '                        postMessageToParent(MESSAGE_TYPES.sortChange, {'
                    + '                            sorters: (sorters || []).map(function (sorter) {'
                    + '                                return { column: sorter.field, dir: sorter.dir };'
                    + '                            })'
                    + '                        });'
                    + '                    });'
                    + '                    table.on("dataFiltered", function (filters) {'
                    + '                        postMessageToParent(MESSAGE_TYPES.filterChange, {'
                    + '                            filters: (filters || []).map(function (filter) {'
                    + '                                return { field: filter.field || "", value: filter.value === null || filter.value === undefined ? "" : String(filter.value) };'
                    + '                            })'
                    + '                        });'
                    + '                    });'
                    + '                    setupCellCopy();'
                    + '                    applyHeaderFilters(headerFilters);'
                    + '                    syncHiddenColumnsFromTable();'
                    + '                    return;'
                    + '                }'
                    + '                table.setColumns(columns);'
                    + '                table.setData(rows);'
                    + '                if (sorters.length) {'
                    + '                    table.setSort(sorters);'
                    + '                } else {'
                    + '                    table.clearSort();'
                    + '                }'
                    + '                applyHeaderFilters(headerFilters);'
                    + '                syncHiddenColumnsFromTable();'
                    + '            }'
                    + ''
                    + '            window.addEventListener("message", function (event) {'
                    + '                const data = event.data || {};'
                    + '                if (!data || data.source !== HOST_SOURCE || data.token !== FRAME_TOKEN) return;'
                    + '                if (data.type === MESSAGE_TYPES.render) {'
                    + '                    try {'
                    + '                        renderTable(data.payload || {});'
                    + '                    } catch (error) {'
                    + '                        postMessageToParent(MESSAGE_TYPES.error, { message: error && error.message ? error.message : "Tabulator描画に失敗しました" });'
                    + '                    }'
                    + '                }'
                    + '                if (data.type === MESSAGE_TYPES.resize && table && tableBuilt && document.body && document.body.offsetWidth > 0) {'
                    + '                    table.redraw(true);'
                    + '                }'
                    + '                if (data.type === MESSAGE_TYPES.downloadCsv) {'
                    + '                    downloadCsv(data.payload && data.payload.fileName ? String(data.payload.fileName) : "catalog.csv");'
                    + '                }'
                    + '            });'
                    + ''
                    + '            window.addEventListener("load", function () {'
                    + '                postMessageToParent(MESSAGE_TYPES.ready, {});'
                    + '            });'
                    + '        <\/script>'
                    + '    </body>'
                    + '</html>';
            }
        });
    })();
</script>
