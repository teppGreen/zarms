<script>
  // グローバル変数
  // urlParams, EVENT_CONFIG, AUTH_CONFIG, EXTERNAL_URLS は既にregister.htmlで定義済みなので、再定義不要
  const { TABLE_NAMES, KEY_LABELS, activeUser, initialData } = templateVariables;

  // 本番環境（!isDevelopment）の場合、コンソール出力を抑制
  if (!templateVariables.isDevelopment) {
    const noop = () => { };
    console.log = noop;
    console.debug = noop;
    console.info = noop;
    console.warn = noop;
    // console.error も抑制したい場合は、上記と同様に noop を代入してください
  }

  // App.state の初期化とデータ管理用関数の定義
  (function () {
    App.state = {
      data: {
        boards: [],
        directories: [],
        members: [],
        plans: [],
        tasks: [],
        apps: [],
        links: [],
        systemUpdates: [],
        directoryAssignments: [],
        planAssignments: [],
        skills: [],
        skillAssignments: []
      },

      userId: null, // 現在のユーザーのID（uuid）
      useApiMode: !!templateVariables.useApiMode,
      userProperties: templateVariables.userProperties || {}, // ユーザープロパティ
      previousTab: null,
      isDevelopment: templateVariables.isDevelopment,

      get: function (tableName) {
        return this.data[tableName];
      },

      set: function (tableName, data) {
        this.data[tableName] = data;
      },

      /**
       * ユーザープロパティを保存します
       * @param {string} key - プロパティキー
       * @param {any} value - プロパティ値 (オブジェクトや配列の場合は自動的にJSON文字列化されます)
       * @returns {Promise}
       */
      saveUserProperty: async function (key, value) {
        let stringValue;
        if (value === null || value === undefined) {
          stringValue = '';
        } else if (typeof value === 'object') {
          stringValue = JSON.stringify(value);
        } else {
          stringValue = String(value);
        }

        // ローカル状態を更新
        this.userProperties[key] = stringValue;

        console.log(`[saveUserProperty] Key: ${key}, Value:`, value);
        return await callGAS('saveUserProperty', key, stringValue);
      },

      /**
       * ユーザープロパティを取得します
       * @param {string} key - プロパティキー
       * @param {any} defaultValue - 値がない場合のデフォルト値
       * @returns {any} パースされた値、または元の値
       */
      getUserProperty: function (key, defaultValue = null) {
        const value = this.userProperties[key];
        if (value === undefined || value === null || value === '') return defaultValue;

        // JSON形式（{ または [ で始まる）の場合はパースを試みる
        if (typeof value === 'string' && (value.trim().startsWith('{') || value.trim().startsWith('['))) {
          try {
            return JSON.parse(value);
          } catch (e) {
            console.error(`[getUserProperty] Error parsing key "${key}":`, e);
            return value;
          }
        }
        return value;
      }
    };
  })();


  window.onload = initializeApp;

  /**
   * アプリケーションを初期化します
   * ショートカット設定、履歴ハンドラー設定、データ読み込みを行います
   * @returns {Promise<void>}
   */
  async function initializeApp() {
    setupGlobalShortcuts();
    setupBrowserHistoryHandlers();
    setupModalCloseWarning();

    // ユーザーIDを設定（templateVariablesから取得）
    if (activeUser && activeUser.id) {
      App.state.userId = activeUser.id;
    }

    // 必要最小限のデータを読み込み（バックグラウンド更新のPromiseを受け取る）
    let needsBackgroundMasterDataRefresh = true;
    const backgroundUpdatePromise = await loadInitialData();
    App.utils.navigation.changeH1();

    console.log('[initializeApp] URL params:', urlParams);

    // 初期ローディングを削除
    const initialLoading = document.getElementById('initial-loading');
    if (initialLoading) {
      initialLoading.style.display = 'none';
    }

    // URLパラメータに基づいて遷移判定
    if (urlParams.tab === 'board' && urlParams.board_id) {
      const targetBoardId = urlParams.board_id;
      console.log('[initializeApp] Board requested:', targetBoardId);

      // ボードの存在確認 (まずは現在のデータで確認)
      let boards = [...(App.state.data.boards || []), { id: 'my-board', display_id: 'my-board', name: 'My Board' }];
      let targetBoard = boards.find(b => b.id === targetBoardId || b.display_id === targetBoardId);

      // キャッシュにない、かつバックグラウンド更新中の場合は待機
      if (!targetBoard && backgroundUpdatePromise) {
        console.log('[initializeApp] Board not found in cache. Waiting for background update...');
        await backgroundUpdatePromise;
        console.log('[initializeApp] Background update finished');

        // 更新後のデータで再確認
        boards = [...(App.state.data.boards || []), { id: 'my-board', display_id: 'my-board', name: 'My Board' }];
        targetBoard = boards.find(b => b.id === targetBoardId || b.display_id === targetBoardId);
      }

      if (targetBoard) {
        console.log('[initializeApp] Board found, switching:', targetBoard);
        await App.utils.navigation.switchTab('board-' + targetBoard.id, true);
      } else {
        console.warn('[initializeApp] Board not found:', targetBoardId);
        alert('ボードが見つかりませんでした\nID: ' + targetBoardId);
        // ホーム画面にフォールバック（データはswitchTab内で読み込み）
        await App.utils.navigation.switchTab('home', true);
      }

    } else if (urlParams.tab && urlParams.tab !== 'home') {
      // その他のタブの場合
      const requestedTab = urlParams.tab === 'members' ? 'catalog' : urlParams.tab;
      await App.utils.navigation.switchTab(requestedTab, true);
    } else {
      // タブ指定がない、またはhomeの場合（データはswitchTab内で読み込み）
      await App.utils.navigation.switchTab('home', true);
    }

    // モーダルパラメータがある場合は該当のモーダルを開く
    if (urlParams.modal) {
      // タスク詳細の場合は最新データを待機
      if (urlParams.modal === 'task-detail' && backgroundUpdatePromise) {
        console.log('[initializeApp] Waiting for background update before opening task modal...');
        await backgroundUpdatePromise;
      }
      openModalFromParams(urlParams);
    }

    // タブごとの最終更新日時を初期化
    App.state.tabLastUpdated = {};

    // バックグラウンド更新が残っている場合は継続
    if (needsBackgroundMasterDataRefresh) {
      backgroundUpdatePromise;
    }

    // システムアップデートの自動更新を開始
    if (App.utils.header.systemUpdates) {
      App.utils.header.systemUpdates.startAutoRefresh();
    }
  }

  /**
   * URLパラメータからモーダルを開く
   * @param {Object} params - URLパラメータ
   */
  function openModalFromParams(params) {
    console.log('[openModalFromParams] Opening modal from params:', params);

    const modalParam = String(params.modal || '').trim();
    const normalizedModal = (function (value) {
      const aliases = {
        'task-detail': 'task-detail',
        'member-detail': 'member-detail',
        'modal-member-detail': 'member-detail',
        'modal-detail-member': 'member-detail',
        'directory-detail': 'directory-detail',
        'modal-directory-detail': 'directory-detail',
        'modal-detail-directory': 'directory-detail',
        'skill-detail': 'skill-detail',
        'modal-skill-detail': 'skill-detail',
        'modal-detail-skill': 'skill-detail',
        'plan-detail': 'plan-detail',
        'modal-plan-detail': 'plan-detail',
        'modal-detail-plan': 'plan-detail'
      };
      return aliases[value] || '';
    })(modalParam);

    // タスク詳細モーダル
    if (normalizedModal === 'task-detail' && params.task_id) {
      // マイボードの場合（board_id='my-board'）、またはボードIDが指定されていない場合は
      // マイボードとして扱い、フィルタリングして表示
      if (!params.board_id || params.board_id === 'my-board') {
        if (App.utils.navigation && App.utils.navigation.navigateToMyBoardWithTaskName) {
          App.utils.navigation.navigateToMyBoardWithTaskName(params.task_id);
          return;
        }
      }

      const currentBoardId = params.board_id || App.pages.boards?.currentBoardId;
      if (!currentBoardId) {
        // ボードIDが特定できない場合はそのままopen（エラー処理はopenに任せる）
        App.modals.taskDetail.open(params.task_id, true);
        return;
      }

      // 共通関数を使用してタスクを開く
      if (App.utils.navigation && App.utils.navigation.tryOpenTask) {
        // まずボードに遷移する (データロードはスキップし、tryOpenTaskに任せる)
        if (App.utils.navigation.switchTab) {
          (async () => {
            await App.utils.navigation.switchTab(`board-${currentBoardId}`, false, false, true);
            // 遷移後にタスクを開く
            await App.utils.navigation.tryOpenTask(params.task_id, currentBoardId);
          })();
        } else {
          App.utils.navigation.tryOpenTask(params.task_id, currentBoardId);
        }
      } else {
        // 万が一関数がない場合はフォールバック
        App.modals.taskDetail.open(params.task_id, true);
      }
      return;
    }

    // 人物詳細モーダル
    if (normalizedModal === 'member-detail' && params.member_id) {
      if (App.modals.memberDetail && typeof App.modals.memberDetail.open === 'function') {
        App.modals.memberDetail.open(params.member_id, true);
      }
      return;
    }

    // 組織詳細モーダル
    if (normalizedModal === 'directory-detail' && params.directory_id) {
      if (App.modals.directoryDetail && typeof App.modals.directoryDetail.open === 'function') {
        App.modals.directoryDetail.open(params.directory_id, true);
      }
      return;
    }

    // 技能詳細モーダル
    if (normalizedModal === 'skill-detail' && params.skill_id) {
      if (App.modals.skillDetail && typeof App.modals.skillDetail.open === 'function') {
        App.modals.skillDetail.open(params.skill_id, true);
      }
      return;
    }

    // 企画詳細モーダル
    if (normalizedModal === 'plan-detail' && params.plan_id) {
      if (App.modals.planDetail && typeof App.modals.planDetail.open === 'function') {
        App.modals.planDetail.open(params.plan_id, true);
      }
    }
  }

  /**
   * ブラウザ履歴の戻る/進むボタンへの対応
   */
  function setupBrowserHistoryHandlers() {
    const handleHistoryChange = async function (event) {
      console.log('[history] Browser back/forward button pressed or history changed', event.state);

      // event.stateがnullの場合は、URLから直接パラメータを取得（初回はキャッシュがあればそれを使用）
      const params = event.state || App.utils.url.getParams() || {};

      // 履歴変更があった場合はキャッシュを更新
      if (App.utils.url.setParams) {
        App.utils.url.setParams(params);
      }

      // タブを切り替え
      if (params.tab) {
        let tabId = 'home';
        if (params.tab === 'board' && params.board_id) {
          tabId = 'board-' + params.board_id;
        } else if (params.tab !== 'board') {
          tabId = params.tab === 'members' ? 'catalog' : params.tab;
        }

        if (App.utils.navigation && App.utils.navigation.switchTab) {
          await App.utils.navigation.switchTab(tabId, true); // URL更新をスキップ
        }
      } else {
        // パラメータがない場合はホームに戻る
        if (App.utils.navigation && App.utils.navigation.switchTab) {
          await App.utils.navigation.switchTab('home', true);
        }
      }

      // モーダルの処理
      // 既存のモーダルを閉じる（優先度順に、全て閉じる）
      // URL状態と同期させるため、開いているモーダルがなくなるまで処理する
      let safetyCounter = 0;
      while (App.utils.ui.closeTopModal(true) && safetyCounter < 10) {
        safetyCounter++;
      }

      // パラメータにモーダルが指定されている場合は開く
      if (params.modal) {
        openModalFromParams(params);
      }
    };

    window.addEventListener('popstate', handleHistoryChange);

    // google.script.history が利用可能な場合はリスナーを追加
    if (typeof google !== 'undefined' && google.script && google.script.history) {
      google.script.history.setChangeHandler(handleHistoryChange);
    }
  }

  /**
   * モーダルが開いている時にブラウザを閉じようとした際の警告を設定します
   */
  function setupModalCloseWarning() {
    window.addEventListener('beforeunload', (e) => {
      // モーダルが開いているかチェック
      const hasOpenModal = isAnyModalOpen();

      if (hasOpenModal) {
        // ブラウザ標準の確認ダイアログを表示
        e.preventDefault();
        e.returnValue = ''; // Chrome では空文字列を設定する必要がある
        return ''; // 一部のブラウザ用
      }
    });
  }

  /**
   * 開いているモーダル要素を取得します（優先順位順にソート）
   * @param {boolean} sorted - 優先順位でソートするか（デフォルト: false）
   * @returns {Array<HTMLElement>} 開いているモーダル要素の配列
   */
  function getOpenModals(sorted = false) {
    // 1. dialog要素で開いているものを取得
    const dialogModals = Array.from(document.querySelectorAll('dialog[open], dialog.active')).filter(modal => {
      return modal && modal.id && modal.id.startsWith('modal-');
    });

    // 2. classに'modal'が含まれ、activeまたはopenの要素を取得
    const modalElements = Array.from(document.querySelectorAll('[class*="modal"]'));
    const visibleModals = modalElements.filter(modal => {
      if (!modal || !modal.id || !modal.id.startsWith('modal-')) {
        return false;
      }
      const isActive = modal.classList.contains('active');
      const hasOpenAttr = modal.hasAttribute('open') || modal.open === true;

      return isActive || hasOpenAttr;
    });

    // 重複を除去してマージ
    const allModals = [...new Set([...dialogModals, ...visibleModals])];

    // ソートが必要な場合
    if (sorted && allModals.length > 0) {
      // 各要素にDOM内のインデックスを付与（後方ほど大きい値）
      const allDialogs = Array.from(document.querySelectorAll('dialog'));
      const domIndexMap = new Map();
      allDialogs.forEach((el, i) => domIndexMap.set(el, i));

      allModals.sort((a, b) => {
        const getPriority = (id) => {
          if (!id) return 0;
          if (id.startsWith('modal-select-')) return 3;
          if (id.startsWith('modal-new-')) return 2;
          if (id.startsWith('modal-detail-')) return 1;
          return 0;
        };

        const priorityA = getPriority(a.id);
        const priorityB = getPriority(b.id);

        // 優先度が異なる場合は優先度の高い順
        if (priorityA !== priorityB) {
          return priorityB - priorityA;
        }

        // 同一優先度の場合はDOM順の逆順（後方に配置されたものが上＝先に閉じるべき）
        const indexA = domIndexMap.get(a) ?? 0;
        const indexB = domIndexMap.get(b) ?? 0;
        return indexB - indexA;
      });
    }

    return allModals;
  }

  /**
   * 何かしらのモーダルが開いているかチェックします
   * @returns {boolean} モーダルが開いている場合true
   */
  function isAnyModalOpen() {
    return getOpenModals().length > 0;
  }

  /**
   * 初回ロード時に必要な最小限のデータを読み込みます。
   * - navigation用マスタデータ（boards/apps/members）のみ取得
   * - directories/plans/skills はタブ切り替え時に遅延ロード
   * - tab-homeのデータはswitchTab経由の通常タブ読み込みで取得
   * @returns {Promise<Promise|null>} バックグラウンド更新のPromise（なければnull）
   */
  async function loadInitialData() {
    try {
      // ── Step 1: サーバー埋め込みデータを即座に反映（GAS呼び出しなし）─────────────────────

      let boards = [];
      let members = [];

      if (initialData) {
        // ナビゲーション必須のマスタデータのみ反映
        boards = initialData.boards || [];
        members = initialData.members || [];
        console.log('[loadInitialData] Server-embedded initialData');
      }

      // ── Step 2: App.stateにマスタデータを反映 ──────────────────────────────────────────
      App.state.data.boards = boards;
      App.state.data.members = members;

      // ── Step 3: 即座にUIを描画（Render-First） ──────────────────────────────────────
      App.utils.navigation.renderBoardsNavigation();
      App.pages.boards.initialize();
      App.pages.boards.initializeMyBoardFilters();

      if (App.utils.header.comments) {
        App.utils.header.comments.loadData().catch(e =>
          console.warn('[Comments] Background initial load failed:', e)
        );
      }

      if (App.utils.header.systemUpdates) {
        App.utils.header.systemUpdates.loadData().catch(e =>
          console.warn('[SystemUpdates] Background initial load failed:', e)
        );
      }

      if (App.utils.header) {
        App.utils.header.refreshApps().catch(e =>
          console.warn('[Apps] Background initial load failed:', e)
        );
      }

      // ── Step 4: バックグラウンドでboards/membersを最新化 ───────────────────────
      const backgroundUpdatePromise = new Promise((resolve) => {
        setTimeout(async (needsBackgroundMasterDataRefresh) => {
          try {
            const batchResult = await callGAS('handleBatchDatabaseProcess', App.state.userId, [
              { key: 'boards', tableName: TABLE_NAMES.BOARDS, operation: 'select', dataObject: { orderBy: { name: 'asc' } }, forceRefresh: true },
              { key: 'members', tableName: TABLE_NAMES.MEMBERS, operation: 'select', dataObject: {}, forceRefresh: true }
            ]);
            const r = batchResult?.results || {};

            App.state.data.boards = r.boards?.data || r.boards || boards;
            App.state.data.members = r.members?.data || r.members || members;
            App.utils.navigation.renderBoardsNavigation();
            App.pages.boards.initialize();
            needsBackgroundMasterDataRefresh = false;
            console.log('[loadInitialData] バックグラウンド更新完了');
          } catch (error) {
            console.error('[loadInitialData] バックグラウンド更新エラー:', error);
          } finally {
            resolve();
          }
        }, 100);
      });

      return backgroundUpdatePromise;

    } catch (error) {
      console.error('[loadInitialData] データ読み込みエラー:', error);
      App.utils.error.handle(error);
      return null;
    }
  }


  /**
   * 現在表示中のタブのデータを強制再取得して再描画します（手動更新ボタン用）
   * @returns {Promise<void>}
   */
  async function refreshCurrentTab() {
    console.log('[refreshCurrentTab] 手動更新開始');

    // 現在表示中のタブを特定
    const currentTab = document.querySelector('main > div[style*="display: block"]');
    if (!currentTab) {
      console.log('[refreshCurrentTab] アクティブなタブが見つかりません');
      return;
    }

    const tabId = currentTab.id; // 例: 'tab-home', 'tab-catalog', 'tab-board'
    console.log('[refreshCurrentTab] 現在のタブ:', tabId);

    // 更新ボタンをローディング状態に
    setRefreshButtonLoading(true);

    try {
      if (tabId === 'tab-board') {
        // ボードページ: 表示中のボードのタスクのみを強制取得
        const activeBoardDiv = document.querySelector('#tab-board > div[style*="display: block"]');
        if (activeBoardDiv && activeBoardDiv.id) {
          const boardId = activeBoardDiv.id.replace('tab-board-', '');
          if (App.pages.boards && App.pages.boards.loadData) {
            await App.pages.boards.loadData(boardId, true);
          }
          // 最終更新日時を更新
          updateTabLastUpdated('board-' + boardId);
        }
      } else if (tabId === 'tab-catalog') {
        if (App.pages.catalog && App.pages.catalog.loadData) {
          await App.pages.catalog.loadData(true);
        }
        updateTabLastUpdated('catalog');
      } else if (tabId === 'tab-boards') {
        if (App.pages.boardsList && App.pages.boardsList.loadData) {
          await App.pages.boardsList.loadData(true);
        }
        updateTabLastUpdated('boards');
      } else if (tabId === 'tab-home') {
        if (App.pages.home && App.pages.home.loadData) {
          await App.pages.home.loadData(true);
        }
        updateTabLastUpdated('home');
      } else if (tabId === 'tab-insights') {
        if (App.pages.insights && App.pages.insights.loadData) {
          await App.pages.insights.loadData(true);
        }
        updateTabLastUpdated('insights');
      }

      console.log('[refreshCurrentTab] 手動更新完了');
    } catch (error) {
      console.error('[refreshCurrentTab] 手動更新エラー:', error);
    } finally {
      // 更新ボタンをリセット
      setRefreshButtonLoading(false);
    }
  }

  /**
   * 現在表示中のタブの更新ボタンアイコンをローディング／通常状態に切り替えます
   * @param {boolean} isLoading
   */
  function setRefreshButtonLoading(isLoading) {
    // 現在表示中のタブを特定してボタンを探す
    const currentTab = document.querySelector('main > div[style*="display: block"]');
    if (!currentTab) return;

    // ボードタブの場合は内側の表示中ボードを対象に
    let searchRoot = currentTab;
    if (currentTab.id === 'tab-board') {
      const activeBoard = currentTab.querySelector(':scope > div[style*="display: block"]');
      if (activeBoard) searchRoot = activeBoard;
    }

    // 対象のrefreshボタンを探す
    const btn = searchRoot.querySelector('button[onclick="refreshCurrentTab()"]');
    if (!btn) return;

    const iconEl = btn.querySelector('i > i');
    if (!iconEl) return;

    if (isLoading) {
      iconEl.classList.add('fast-rotate');
      btn.disabled = true;
    } else {
      iconEl.classList.remove('fast-rotate');
      btn.disabled = false;
    }
  }

  /**
   * 指定タブの最終更新日時をApp.stateに保存し、UI表示を更新します
   * @param {string} tabKey - タブキー（例: 'home', 'board-UUID'）
   */
  function updateTabLastUpdated(tabKey) {
    if (!App.state.tabLastUpdated) App.state.tabLastUpdated = {};
    const now = new Date();
    App.state.tabLastUpdated[tabKey] = now;

    // UI要素に反映
    const el = document.getElementById('last-updated-' + tabKey);
    if (el) {
      const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
      el.textContent = '最終更新: ' + timeStr;
    }
  }

  // グローバルショートカットキーの設定
  function setupGlobalShortcuts() {
    if (!App.utils.shortcuts) App.utils.shortcuts = {};

    App.utils.shortcuts.getDefinitions = function () {
      return [
        { keys: 'Alt + F', action: '検索欄にフォーカス' },
        { keys: 'Alt + T', action: '新規タスクを開く' },
        { keys: 'Alt + B', action: '新規ボードを作成' },
        { keys: 'Alt + H', action: 'ショートカット一覧を開く' },
        { keys: 'Alt + 1', action: 'ホームタブへ移動' },
        { keys: 'Alt + 2', action: '一覧タブへ移動' },
        { keys: 'Alt + 3', action: '予定タブへ移動' },
        { keys: 'Alt + 4', action: '分析タブへ移動' },
        { keys: 'Alt + 5', action: 'ボードタブへ移動' },
        { keys: 'Alt + 6', action: 'タスクタブへ移動' },
        { keys: 'Alt + R', action: '表示中データを再読込' },
        { keys: 'Esc', action: 'モーダルを閉じる' }
      ];
    };

    const isEditableTarget = function (target) {
      if (!target || !(target instanceof HTMLElement)) return false;
      if (target.isContentEditable) return true;
      const tagName = (target.tagName || '').toLowerCase();
      if (tagName === 'input' || tagName === 'textarea' || tagName === 'select') return true;
      return !!target.closest('input, textarea, select, [contenteditable=""], [contenteditable="true"]');
    };

    const focusSearch = function () {
      const searchInput = document.getElementById('search-input');
      if (!searchInput) return;
      searchInput.focus();
      searchInput.select();
    };

    const openShortcutsHelp = function () {
      if (App.utils.header && App.utils.header.shortcuts && App.utils.header.shortcuts.open) {
        App.utils.header.shortcuts.open();
        return;
      }
      const modal = document.getElementById('modal-shortcuts-help');
      if (modal) appUi('modal-shortcuts-help', true);
    };

    document.addEventListener('keydown', (e) => {
      if (!e || e.isComposing) return;

      if (e.key === 'Escape') {
        App.utils.ui.closeTopModal(false, 'escape');
        return;
      }

      if (!e.altKey || e.ctrlKey || e.metaKey) return;

      if (e.code === 'KeyF') {
        e.preventDefault();
        focusSearch();
        return;
      }

      if (e.code === 'KeyH') {
        e.preventDefault();
        openShortcutsHelp();
        return;
      }

      if (isEditableTarget(e.target)) return;

      if (e.code === 'KeyT' && App.modals.newTask && App.modals.newTask.open) {
        e.preventDefault();
        App.modals.newTask.open();
        return;
      }

      if (e.code === 'KeyB' && App.pages.boards && App.pages.boards.createBoard) {
        e.preventDefault();
        App.pages.boards.createBoard();
        return;
      }

      if (e.code === 'Digit2' && App.utils.navigation && App.utils.navigation.switchTab) {
        e.preventDefault();
        App.utils.navigation.switchTab('catalog');
        return;
      }

      if (e.code === 'Digit1' && App.utils.navigation && App.utils.navigation.switchTab) {
        e.preventDefault();
        App.utils.navigation.switchTab('home');
        return;
      }

      if (e.code === 'Digit5' && App.utils.navigation && App.utils.navigation.switchTab) {
        e.preventDefault();
        App.utils.navigation.switchTab('boards');
        return;
      }

      if (e.code === 'Digit3' && App.utils.navigation && App.utils.navigation.switchTab) {
        e.preventDefault();
        App.utils.navigation.switchTab('calendar');
        return;
      }

      if (e.code === 'Digit6' && App.utils.navigation && App.utils.navigation.switchTab) {
        e.preventDefault();
        App.utils.navigation.switchTab('board-my-board');
        return;
      }

      if (e.code === 'Digit4' && App.utils.navigation && App.utils.navigation.switchTab) {
        e.preventDefault();
        App.utils.navigation.switchTab('insights');
        return;
      }

      if (e.code === 'KeyR') {
        e.preventDefault();
        refreshCurrentTab();
      }
    });
  }

  App.utils.gas = {
    lastInvocation: null,
    lastCallback: null,  // 関数参照を直接保存（文字列ではなく）
    retryState: {
      isRetrying: false,
      progressInterval: null
    },

    /**
     * コールバック関数を登録します
     * @param {Function|string} callback - コールバック関数または関数パス
     */
    registerCallback: function (callback) {
      if (typeof callback === 'function') {
        this.lastCallback = callback;
      } else if (typeof callback === 'string') {
        // 文字列の場合は安全に解決
        this.lastCallback = resolveFunctionSafely(callback);
      } else {
        this.lastCallback = null;
      }
    },

    /**
     * 登録されたコールバックを実行します
     * @param {...any} args - コールバックの引数
     * @returns {boolean} 実行成功した場合true
     */
    executeCallback: function (...args) {
      if (this.lastCallback && typeof this.lastCallback === 'function') {
        try {
          this.lastCallback(...args);
          return true;
        } catch (e) {
          console.error('[executeCallback] Failed to execute callback:', e);
          return false;
        }
      }
      return false;
    }
  };

  /**
   * Google Apps Script関数を呼び出します
   * @param {string} functionName - 呼び出す関数名
   * @param {...any} args - 関数の引数
   * @returns {Promise} 実行結果のPromise
   */
  function callGAS(functionName, ...args) {
    return new Promise((resolve, reject) => {
      setRefreshButtonLoading(true);
      const useApiMode = !!(App.state && App.state.useApiMode);
      const callArgs = [...args, useApiMode];

      // 最後の呼び出しを記録
      App.utils.gas.lastInvocation = {
        functionName: functionName,
        args: callArgs,
        timestamp: new Date().toISOString()
      };
      google.script.run
        .withSuccessHandler(function (result) {
          resolve(result);
          setRefreshButtonLoading(false);
        })
        .withFailureHandler(function (error) {
          reject(error);
          setRefreshButtonLoading(false);
        })
      [functionName](...callArgs);
    });
  }

  /**
   * コールバック付きでGAS関数を呼び出します
   * @param {string} functionName - 呼び出す関数名
   * @param {Array} args - 関数の引数配列
   * @param {Function} callback - 成功時のコールバック
   */
  function callGASWithCallback(functionName, args, callback) {
    // コールバックを安全に登録
    App.utils.gas.registerCallback(callback);

    return callGAS(functionName, ...args)
      .then(result => {
        if (callback && typeof callback === 'function') {
          callback(result);
        }
        return result;
      });
  }

  // JavaScript関数呼び出しを記録するヘルパー関数（下位互換性のため残す）
  function recordJSInvocation(functionName, ...args) {
    App.utils.gas.registerCallback(function () {
      if (typeof window[functionName] === 'function') {
        window[functionName](...args);
      }
    });
  }

  /**
   * 複数のテーブルからデータを並列で取得します（バッチ処理）
   * @param {Array<Object>} queries - クエリ配列 [{tableName, operation, dataObject}, ...]
   * @returns {Promise<Array>} 結果の配列
   */
  async function batchDatabaseOperations(queries) {
    if (!queries || queries.length === 0) {
      return [];
    }

    // 並列実行
    const promises = queries.map(query => {
      return callGAS(
        'handleDatabaseProcess',
        App.state.userId,
        query.tableName,
        query.operation || 'select',
        query.dataObject || {},
        query.remark || null,
        query.forceRefresh || false
      );
    });

    try {
      const results = await Promise.all(promises);
      console.log('[batchDatabaseOperations] Completed', results.length, 'operations');
      return results;
    } catch (error) {
      console.error('[batchDatabaseOperations] Error:', error);
      throw error;
    }
  }

  /**
   * BeerCSSのui()を上書きせずに呼び出すための独自ヘルパー
   * モーダルはApp.utils.modalで制御し、それ以外はwindow.uiへ委譲します
   * @param {string|HTMLElement} target - UIターゲット
   * @param {boolean} [forceState] - true: 開く, false: 閉じる, 未指定: トグル
   * @returns {Promise<HTMLElement|null>|any} 実行結果
   */
  function appUi(target, forceState) {
    const modalUtils = App && App.utils && App.utils.modal;
    if (modalUtils) {
      const modalId = modalUtils.getModalId(target);
      const isModalSelector = typeof modalId === 'string' && modalId.startsWith('modal-');

      if (isModalSelector) {
        if (forceState === true) {
          modalUtils.open(modalId);
          return Promise.resolve(modalUtils.getModalElement(modalId));
        }

        if (forceState === false) {
          modalUtils.close(modalId);
          return Promise.resolve(modalUtils.getModalElement(modalId));
        }

        modalUtils.toggle(modalId);
        return Promise.resolve(modalUtils.getModalElement(modalId));
      }
    }
    
    if (typeof window.ui === 'function') {
      return window.ui(target, forceState);
    }

    return Promise.resolve(null);
  }

  /**
   * 日時を指定形式でフォーマットします
   * @param {string} dateString - フォーマットする日時
   * @param {string} [format='yyyy/MM/dd(E) HH:mm'] - フォーマット形式
   * @returns {string} フォーマットされた日時文字列
   */
  function formatDateTimeForDisplay(dateString, format = 'yyyy/MM/dd(E) HH:mm') {
    if (!dateString) return '';
    try {
      const dt = new Date(dateString);
      const year = String(dt.getFullYear()).padStart(4, '0');
      const month = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const weekday = weekdays[dt.getDay()];
      const hours = String(dt.getHours()).padStart(2, '0');
      const minutes = String(dt.getMinutes()).padStart(2, '0');
      const seconds = String(dt.getSeconds()).padStart(2, '0');

      return format
        .replace(/yyyy/g, year)
        .replace(/MM/g, month)
        .replace(/dd/g, day)
        .replace(/E/g, weekday)
        .replace(/HH/g, hours)
        .replace(/mm/g, minutes)
        .replace(/ss/g, seconds);
    } catch (e) {
      return dateString;
    }
  }

  function formatDateTimeForInput(dateString) {
    if (!dateString) return '';
    try {
      const dt = new Date(dateString);
      const offset = dt.getTimezoneOffset() * 60000;
      const localDate = new Date(dt.getTime() - offset);
      return localDate.toISOString().slice(0, 16);
    } catch (e) {
      return dateString;
    }
  }

  /**
   * HTML文字列をエスケープします（XSS対策）
   * @param {string} text - エスケープする文字列
   * @returns {string} エスケープされた文字列
   */
  function escapeHtml(text) {
    if (text === null || text === undefined) {
      return '';
    }

    const str = String(text);
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#x27;',
      '/': '&#x2F;'
    };

    return str.replace(/[&<>"'/]/g, function (char) {
      return map[char];
    });
  }

  /**
   * HTML属性値をエスケープします
   * @param {string} text - エスケープする文字列
   * @returns {string} エスケープされた文字列
   */
  function escapeHtmlAttribute(text) {
    if (text === null || text === undefined) {
      return '';
    }

    const str = String(text);
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#x27;',
      '/': '&#x2F;',
      '\n': '&#10;',
      '\r': '&#13;',
      '\t': '&#9;'
    };

    return str.replace(/[&<>"'/\n\r\t]/g, function (char) {
      return map[char];
    });
  }

  /**
   * テキストをHTMLエスケープした後、改行を<br>タグに変換します
   * @param {string} text - 変換する文字列
   * @returns {string} エスケープされ、改行が<br>タグに変換された文字列
   */
  function escapeHtmlWithLineBreaks(text) {
    if (text === null || text === undefined) {
      return '';
    }

    // まずHTMLエスケープを実行
    const escaped = escapeHtml(text);

    // 改行文字を<br>タグに変換
    // \r\nと\nの両方に対応
    return escaped.replace(/\r\n/g, '<br>').replace(/\n/g, '<br>');
  }

  /**
   * URLをサニタイズします。安全なスキーム（http, https, mailto, tel）と相対URLのみを許可します。
   * @param {string} url - サニタイズするURL
   * @returns {string} サニタイズされたURL。安全でない場合は空文字を返します。
   */
  function sanitizeUrl(url) {
    if (!url || typeof url !== "string") {
      return "";
    }

    const urlTrimmed = url.trim();

    // 相対URL（/で始まる、またはプロトコルを含まない）は許可
    if (
      urlTrimmed.startsWith("/") ||
      urlTrimmed.startsWith("./") ||
      urlTrimmed.startsWith("../") ||
      !urlTrimmed.includes(":")
    ) {
      return urlTrimmed;
    }

    try {
      // 安全なスキームのみ許可する（new URLで確実にプロトコルを検証）
      const parsed = new URL(urlTrimmed, window.location.origin);
      const allowedProtocols = ["http:", "https:", "mailto:", "tel:"];

      if (allowedProtocols.includes(parsed.protocol)) {
        return parsed.href;
      }

      console.warn("[sanitizeUrl] Unsafe protocol detected:", urlTrimmed);
      return "";
    } catch (e) {
      // 不正なURL形式の場合は許可しない
      console.warn("[sanitizeUrl] Invalid URL format:", urlTrimmed);
      return "";
    }
  }

  /**
   * 関数名から関数オブジェクトを安全に取得します
   * evalを使用せず、予め定義されたパスから関数を探索します
   * @param {string} functionPath - 関数のパス（例: 'App.pages.boards.loadData'）
   * @returns {Function|null} 関数オブジェクト、見つからない場合はnull
   */
  function resolveFunctionSafely(functionPath) {
    if (!functionPath || typeof functionPath !== 'string') {
      return null;
    }

    // ドット区切りのパスを配列に分割
    const parts = functionPath.split('.');
    let current = window;

    // パスを辿って関数を取得
    for (let i = 0; i < parts.length; i++) {
      if (current && typeof current === 'object' && Object.prototype.hasOwnProperty.call(current, parts[i])) {
        current = current[parts[i]];
      } else {
        console.warn(`[resolveFunctionSafely] Cannot resolve path: ${functionPath} at ${parts[i]}`);
        return null;
      }
    }

    // 最終的に関数であることを確認
    if (typeof current === 'function') {
      return current;
    }

    console.warn(`[resolveFunctionSafely] Path does not resolve to a function: ${functionPath}`);
    return null;
  }

  App.utils.url = {
    _cachedParams: null,

    /**
     * URLパラメータを取得
     * @returns {Object} パラメータオブジェクト
     */
    getParams: function () {
      // キャッシュがあればそれを使用
      if (this._cachedParams) {
        return { ...this._cachedParams };
      }

      let params = {};

      // 初回ロード時: templateVariablesからの取得を優先
      if (typeof templateVariables !== 'undefined' && templateVariables.urlParams) {
        params = { ...templateVariables.urlParams };
      } else {
        const urlParams = new URLSearchParams(window.location.search);
        for (const [key, value] of urlParams) {
          params[key] = value;
        }
      }

      this._cachedParams = params;
      return params;
    },

    /**
     * キャッシュされたパラメータを強制的に設定（履歴変更時など）
     * @param {Object} params 
     */
    setParams: function (params) {
      this._cachedParams = { ...params };
    },

    /**
     * URLパラメータを更新（ブラウザ履歴にpush）
     * @param {Object} params - パラメータオブジェクト
     * @param {boolean} replace - trueの場合はreplaceState、falseの場合はpushState
     */
    updateParams: function (params, replace = false) {
      // null, undefined, 空文字をフィルタリング
      const cleanParams = {};
      Object.keys(params).forEach(key => {
        if (params[key] !== null && params[key] !== undefined && params[key] !== '') {
          cleanParams[key] = params[key];
        }
      });

      // キャッシュを更新
      this._cachedParams = cleanParams;

      // google.script.history が利用可能な場合はそれを使用
      if (typeof google !== 'undefined' && google.script && google.script.history) {
        if (replace) {
          google.script.history.replace(cleanParams, cleanParams);
        } else {
          google.script.history.push(cleanParams, cleanParams);
        }
        // return;
      }
    },

    /**
     * URLパラメータからタブIDを取得
     * @param {Object} params - パラメータオブジェクト
     * @returns {string|null} タブID（例: 'home', 'board-UUID'）またはnull
     */
    getTabIdFromParams: function (params) {
      if (!params.tab) return null;

      // boardタブの場合、board_idが有効な値であることを確認
      if (params.tab === 'board') {
        if (params.board_id && params.board_id !== '') {
          return 'board-' + params.board_id;
        }
        // board_idが無効な場合はnullを返す
        return null;
      }

      if (params.tab === 'members') return 'catalog';
      return params.tab;
    },

    /**
     * タブIDからURLパラメータを生成
     * @param {string} tabId - タブID（例: 'home', 'board-UUID'）
     * @returns {Object} パラメータオブジェクト
     */
    getParamsFromTabId: function (tabId) {
      const params = {};

      if (tabId.startsWith('board-')) {
        params.tab = 'board';
        params.board_id = tabId.replace('board-', '');
      } else {
        params.tab = tabId === 'members' ? 'catalog' : tabId;
      }

      return params;
    }
  };

  // ============================================
  // UI Utilities

  App.utils.ui = {
    /**
     * Mainタグ内のすべてのインタラクティブ要素のReadonly/Disabled状態を切り替えます
     * @param {boolean} readonly - trueで無効化、falseで有効化
     */
    setMainReadonly: function (readonly) {
      const main = document.querySelector('main');

      // fields (inputs wrappers) and buttons within main
      // Also include inputs, selects, textareas directly
      const selectors = [
        '.field',
        'button',
        'input',
        'select',
        'textarea',
        'a[onclick]',
        'i[onclick]',
        '.chip i'
      ];

      const elements = main.querySelectorAll(selectors.join(', '));

      elements.forEach(el => {
        // Toggle disabled attribute for form elements and buttons
        if ('disabled' in el) {
          el.disabled = readonly;
        }

        // Control pointer events and visual opacity
        el.style.pointerEvents = readonly ? 'not-allowed' : '';
        el.style.opacity = readonly ? '0.7' : '';
      });
    },

    /**
     * モーダルIDからApp.modals内の対応するオブジェクトを自動解決する
     * 例: 'modal-new-task-preview' -> App.modals.newTaskPreview
     *     'modal-detail-task' -> App.modals.taskDetail
     *     'modal-new-task' -> App.modals.newTask
     * @param {string} modalId - モーダルのID
     * @returns {Object|null} 対応するApp.modalsオブジェクト
     */
    resolveModalHandler: function (modalId) {
      if (!modalId || !modalId.startsWith('modal-')) return null;

      // 'modal-' プレフィックスを除去
      const rawName = modalId.replace(/^modal-/, '');

      // IDパターンからApp.modalsのキーを解決するマッピング
      // パターン: 'type-name(-suffix)' -> 対応するApp.modalsのキー
      const patterns = [
        // detail系: 'detail-task' -> 'taskDetail', 'detail-member' -> 'memberDetail'
        { regex: /^detail-(.+)$/, transform: (m) => m[1].replace(/-([a-z])/g, (_, c) => c.toUpperCase()) + 'Detail' },
        // new系: 'new-task-preview' -> 'newTaskPreview', 'new-task' -> 'newTask', 'new-comment' -> 'newComment'
        { regex: /^new-(.+)$/, transform: (m) => 'new' + m[1].split('-').map((s, i) => s.charAt(0).toUpperCase() + s.slice(1)).join('') },
        // select系: 'select-members' -> 'selectMembers'
        { regex: /^select-(.+)$/, transform: (m) => 'select' + m[1].split('-').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('') },
        // filter系: 'filter-task' -> 'filterTask'
        { regex: /^filter-(.+)$/, transform: (m) => 'filter' + m[1].split('-').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('') },
      ];

      for (const pattern of patterns) {
        const match = rawName.match(pattern.regex);
        if (match) {
          const key = pattern.transform(match);
          if (App.modals[key]) {
            return App.modals[key];
          }
        }
      }

      return null;
    },

    /**
     * 最も優先度の高いモーダルを1つ閉じる
     * 優先順位: 'modal-select-' > 'modal-new-' > 'modal-detail-' > その他
     * 同一優先度の場合はDOM内で後方に配置されたものから先に閉じる
     * @param {boolean} skipUrlUpdate - URL更新をスキップするかどうか
     * @returns {boolean} モーダルを閉じた場合はtrue
     */
    closeTopModal: function (skipUrlUpdate = false, reason = 'generic') {
      const openModals = getOpenModals(true); // 優先順位でソート済み
      if (openModals.length === 0) {
        if (App.utils.modal && typeof App.utils.modal.syncOverlayWithManagedModals === 'function') {
          App.utils.modal.syncOverlayWithManagedModals();
        }
        return true;
      }

      const targetModal = openModals[0];
      const modalId = targetModal.id;
      console.log(`[closeTopModal] Closing ${modalId}, skipUrlUpdate: ${skipUrlUpdate}`);

      // App.modalsから対応するハンドラを自動解決
      const handler = this.resolveModalHandler(modalId);

      if (handler) {
        // closePreview メソッドがある場合（プレビュー系モーダル）
        if (typeof handler.closePreview === 'function' && modalId.includes('-preview')) {
          handler.closePreview();
          return true;
        }

        // requestClose がある場合は優先して使用（保存確認を含む共通導線）
        if (typeof handler.requestClose === 'function') {
          const result = handler.requestClose(reason, skipUrlUpdate);
          return result !== false;
        }

        // close メソッドがある場合はそれを使う
        if (typeof handler.close === 'function') {
          const result = handler.close({
            skipUrlUpdate: skipUrlUpdate,
            reason: reason
          });
          return result !== false; // falseが返された場合のみfalse扱い
        }
      }

      // ハンドラが見つからない場合は汎用的な閉じ処理
      if (App.utils.modal && typeof App.utils.modal.close === 'function') {
        App.utils.modal.close(modalId);
      } else if (typeof appUi === 'function') {
        appUi(modalId, false);
      } else {
        targetModal.classList.remove('active');
        targetModal.removeAttribute('open');
      }

      if (App.utils.modal && typeof App.utils.modal.syncOverlayWithManagedModals === 'function') {
        App.utils.modal.syncOverlayWithManagedModals();
      }

      return true;
    }
  };

  // ============================================
  // Modal Utilities
  // 責任: モーダルの共通処理（フォーカス、フィルタリング、選択管理）
  // ============================================

  /**
   * モーダル関連のユーティリティ関数
   */
  App.utils.modal = {
    _overlayPrefix: 'overlay-for-',
    _overlayRemoveDelayMs: 300,

    /**
     * モーダル参照（id/selector/element）からモーダルIDを解決します
     * @param {string|HTMLElement} target - モーダル参照
     * @returns {string|null} モーダルID
     */
    getModalId: function (target) {
      if (!target) return null;

      if (typeof target === 'string') {
        if (target.startsWith('#')) {
          return target.slice(1);
        }
        return target;
      }

      if (target.id) {
        return target.id;
      }

      return null;
    },

    /**
     * 対象がselect系モーダルか判定します
     * @param {string|HTMLElement} target - モーダル参照
     * @returns {boolean} select系ならtrue
     */
    isSelectModal: function (target) {
      const modalId = this.getModalId(target);
      return !!modalId && modalId.startsWith('modal-select-');
    },

    /**
     * モーダル要素を取得します
     * @param {string|HTMLElement} target - モーダル参照
     * @returns {HTMLElement|null} モーダル要素
     */
    getModalElement: function (target) {
      if (!target) return null;
      if (target instanceof HTMLElement) return target;

      const modalId = this.getModalId(target);
      if (!modalId) return null;
      return document.getElementById(modalId);
    },

    /**
     * モーダルが開いているか判定します
     * @param {string|HTMLElement} target - モーダル参照
     * @returns {boolean} 開いている場合true
     */
    isOpen: function (target) {
      const modal = this.getModalElement(target);
      if (!modal) return false;

      const hasOpenAttr = modal.hasAttribute('open') || modal.open === true;
      const hasActiveClass = modal.classList.contains('active');

      return hasOpenAttr || hasActiveClass;
    },

    /**
     * モーダル専用overlay要素のIDを返します
     * @param {string} modalId - モーダルID
     * @returns {string} overlay要素ID
     */
    getOverlayId: function (modalId) {
      return `${this._overlayPrefix}${modalId}`;
    },

    /**
     * モーダルに紐づくoverlay要素を返します
     * @param {string} modalId - モーダルID
     * @returns {HTMLElement|null} overlay要素
     */
    getOverlayElement: function (modalId) {
      if (!modalId) return null;
      return document.getElementById(this.getOverlayId(modalId));
    },

    /**
     * モーダル直前にoverlay要素を生成・配置します
     * @param {string} modalId - モーダルID
     * @param {HTMLElement} modal - モーダル要素
     * @returns {HTMLElement|null} overlay要素
     */
    createOverlayForModal: function (modalId, modal) {
      if (!modalId || !modal) return null;

      let overlay = this.getOverlayElement(modalId);
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = this.getOverlayId(modalId);
        overlay.className = 'overlay dark js-managed-modal-overlay';
        overlay.dataset.modalId = modalId;
        overlay.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();

          // 詳細モーダルなどで requestClose が定義されている場合は、
          // 保存確認を含む共通クローズ導線を優先する
          const handler = App.utils?.ui?.resolveModalHandler
            ? App.utils.ui.resolveModalHandler(modalId)
            : null;

          if (handler && typeof handler.requestClose === 'function') {
            // requestClose側で「閉じる」「保存して閉じる」「閉じない(キャンセル)」を判断する。
            // ここでcloseへフォールバックすると、キャンセル時にも閉じてしまうため禁止。
            handler.requestClose('overlay-click');
            return;
          }

          this.close(modalId);
        });
      }

      if (modal.parentNode) {
        modal.parentNode.insertBefore(overlay, modal);
      }

      if (overlay.dataset.removeTimerId) {
        clearTimeout(parseInt(overlay.dataset.removeTimerId, 10));
        overlay.dataset.removeTimerId = '';
      }

      overlay.classList.remove('active');
      overlay.style.display = '';
      overlay.style.pointerEvents = 'auto';

      // 挿入直後にactiveを付与して表示状態へ遷移させる
      requestAnimationFrame(() => {
        if (document.body.contains(overlay)) {
          overlay.classList.add('active');
        }
      });

      return overlay;
    },

    /**
     * モーダルに紐づくoverlay要素を削除します
     * @param {string} modalId - モーダルID
     */
    removeOverlayForModal: function (modalId) {
      const overlay = this.getOverlayElement(modalId);
      if (!overlay) return;

      if (overlay.dataset.removeTimerId) {
        clearTimeout(parseInt(overlay.dataset.removeTimerId, 10));
      }

      overlay.classList.remove('active');
      overlay.style.pointerEvents = 'none';

      const timerId = setTimeout(() => {
        if (!document.body.contains(overlay)) return;
        if (overlay.classList.contains('active')) return;
        overlay.style.display = 'none';
        overlay.remove();
      }, this._overlayRemoveDelayMs);

      overlay.dataset.removeTimerId = String(timerId);
    },

    /**
     * 管理対象（全モーダル）のうち何かが開いているか判定します
     * @returns {boolean} 開いている場合true
     */
    hasAnyManagedModalOpen: function () {
      const openModals = getOpenModals(false);
      return openModals.some(modal => {
        return modal && modal.id && modal.id.startsWith('modal-');
      });
    },

    /**
     * 管理対象モーダルの状態に応じて #overlay を同期します
     */
    syncOverlayWithManagedModals: function () {
      const openManagedModals = getOpenModals(false).filter(modal => {
        return modal && modal.id && modal.id.startsWith('modal-');
      });
      const openManagedModalIds = new Set(openManagedModals.map(modal => modal.id));

      openManagedModals.forEach(modal => {
        this.createOverlayForModal(modal.id, modal);
      });

      const overlays = document.querySelectorAll('.js-managed-modal-overlay');
      overlays.forEach(overlay => {
        const modalId = overlay.dataset.modalId;
        if (!openManagedModalIds.has(modalId)) {
          this.removeOverlayForModal(modalId);
        }
      });
    },

    /**
     * モーダル開閉時にBeerCSSが自動生成したoverlay要素を除去します
     */
    removeAutoGeneratedOverlays: function () {
      const overlays = document.querySelectorAll('.overlay');
      overlays.forEach(overlay => {
        if (overlay && !overlay.classList.contains('js-managed-modal-overlay')) {
          overlay.remove();
        }
      });
    },

    /**
     * モーダルを開きます
     * @param {string|HTMLElement} target - モーダル参照
     */
    open: function (target) {
      const modalId = this.getModalId(target);
      const modal = this.getModalElement(target);
      if (!modalId || !modal) return;

      if (!this.isOpen(modal)) {
        // showModalはネイティブbackdropがoverlayクリックを阻害するため使わない
        modal.setAttribute('open', '');
        modal.classList.add('active');
      }

      this.createOverlayForModal(modalId, modal);

      this.removeAutoGeneratedOverlays();
    },

    /**
     * モーダルを閉じます
     * @param {string|HTMLElement} target - モーダル参照
     */
    close: function (target) {
      const modalId = this.getModalId(target);
      const modal = this.getModalElement(target);
      if (!modalId || !modal) return;

      // 念のため明示的に閉じる（環境差異対策）
      modal.classList.remove('active');
      modal.removeAttribute('open');
      modal.open = false;

      this.removeOverlayForModal(modalId);
      this.syncOverlayWithManagedModals();

      this.removeAutoGeneratedOverlays();
    },

    /**
     * モーダルをトグルします
     * @param {string|HTMLElement} target - モーダル参照
     */
    toggle: function (target) {
      if (this.isOpen(target)) {
        this.close(target);
      } else {
        this.open(target);
      }
    },

    /**
     * 入力フィールドにフォーカスを設定します（リトライ機能付き）
     * @param {string} selector - 入力フィールドのセレクタ
     * @param {number} maxRetries - 最大リトライ回数
     * @param {number} delay - リトライ間隔（ミリ秒）
     */
    focusInput: function (selector, maxRetries = UI_CONFIG.MODAL_FOCUS_MAX_RETRIES, delay = UI_CONFIG.MODAL_FOCUS_DELAY) {
      const tryFocus = (count = 0) => {
        const input = document.querySelector(selector);
        if (input && input.offsetParent !== null) {
          input.focus();
          input.select();
          return true;
        } else if (count < maxRetries) {
          setTimeout(() => tryFocus(count + 1), delay);
          return false;
        }
        console.warn(`[focusInput] Failed to focus element: ${selector}`);
        return false;
      };

      tryFocus();
    },

    /**
     * データをフィルタリングします（検索語による絞り込み）
     * @param {Array<Object>} data - データ配列
     * @param {string} searchTerm - 検索語
     * @param {Array<string>} searchFields - 検索対象フィールド名の配列
     * @param {boolean} activeOnly - is_activeがtrueのみ対象とするか
     * @returns {Array<Object>} フィルタリングされたデータ
     */
    filterData: function (data, searchTerm, searchFields, activeOnly = true) {
      if (!data || !Array.isArray(data)) {
        return [];
      }

      const term = searchTerm ? searchTerm.toLowerCase().trim() : '';

      return data.filter(item => {
        // アクティブフィルタ
        if (activeOnly && item.is_active !== true) {
          return false;
        }

        // 検索語が空の場合はアクティブフィルタのみ適用
        if (!term) {
          return true;
        }

        // 指定されたフィールドのいずれかに検索語が含まれているか
        return searchFields.some(field => {
          const value = item[field];
          return value && String(value).toLowerCase().includes(term);
        });
      });
    },

    /**
     * 選択状態を切り替えます
     * @param {Array<string>} selectedIds - 選択中のID配列
     * @param {string} id - 切り替えるID
     * @param {boolean} multiSelect - 複数選択可能か
     * @returns {Array<string>} 更新後の選択ID配列
     */
    toggleSelection: function (selectedIds, id, multiSelect) {
      const newSelection = [...selectedIds];
      const index = newSelection.indexOf(id);

      if (multiSelect) {
        // 複数選択: トグル動作
        if (index > -1) {
          newSelection.splice(index, 1);
        } else {
          newSelection.push(id);
        }
      } else {
        // 単一選択: 置き換え
        return [id];
      }

      return newSelection;
    },

    /**
     * チェックボックス/ラジオボタンの選択状態を取得します
     * @param {string} containerSelector - コンテナのセレクタ
     * @param {string} inputName - input要素のname属性
     * @param {boolean} multiSelect - 複数選択か
     * @returns {Array<string>} 選択されたIDの配列
     */
    getSelectedIds: function (containerSelector, inputName, multiSelect) {
      const container = document.querySelector(containerSelector);
      if (!container) return [];

      const inputs = container.querySelectorAll(`input[name="${inputName}"]:checked`);
      return Array.from(inputs).map(input => input.value);
    },

    /**
     * モーダルの検索入力欄をリセットします
     * @param {string} selector - 検索入力欄のセレクタ
     */
    resetSearchInput: function (selector) {
      const input = document.querySelector(selector);
      if (input) {
        input.value = '';
      }
    },

    /**
     * 選択結果をチップとして表示します
     * @param {string} containerSelector - コンテナのセレクタ
     * @param {Array<Object>} items - 選択されたアイテムの配列
     * @param {Function} onRemove - チップ削除時のコールバック(itemId)
     * @param {Function} labelFormatter - ラベル表示用のフォーマッタ(item) => string
     */
    renderSelectedChips: function (containerSelector, items, onRemove, labelFormatter) {
      const container = document.querySelector(containerSelector);
      if (!container) return;

      if (!items || items.length === 0) {
        container.innerHTML = '<span class="small-text secondary-text">なし</span>';
        return;
      }

      let html = '';
      items.forEach(item => {
        const fallbackDisplayId = item && item.display_id !== undefined && item.display_id !== null && String(item.display_id).trim() !== ''
          ? `#${item.display_id}`
          : '';
        const label = labelFormatter
          ? labelFormatter(item)
          : (item.name || item.display_name || item.title || item.plan_number || fallbackDisplayId || '未設定');
        const safeLabel = escapeHtml(label);
        const safeId = escapeHtmlAttribute(item.id);

        html += `
          <button class="chip" data-item-id="${safeId}">
            <span>${safeLabel}</span>
            <i>close</i>
          </button>
        `;
      });

      container.innerHTML = html;

      // チップの削除イベントを設定
      if (onRemove) {
        container.querySelectorAll('.chip').forEach(chip => {
          chip.addEventListener('click', () => {
            const itemId = chip.dataset.itemId;
            onRemove(itemId);
          });
        });
      }
    }
  };

  /**
   * テキスト操作ユーティリティ
   */
  App.utils.text = {
    /**
     * テキストを正規化します（大文字・小文字、全角・半角の曖昧排除）
     * @param {string} text - 正規化するテキスト
     * @returns {string} 正規化されたテキスト
     */
    normalize: function (text) {
      if (text === null || text === undefined) return '';
      return String(text)
        .normalize('NFKC')
        .toLowerCase();
    }
  };

  /**
   * 検索ユーティリティ
   */
  App.utils.search = {
    /**
     * 検索の前提となる正規化と数値判定を一括して行います
     * @param {string} searchValue - 検索文字列
     * @returns {Object} { normalizedValue, numericValue, isNumericInput }
     */
    getNormalizedSearchInfo: function (searchValue) {
      if (!searchValue) return { normalizedValue: '', numericValue: NaN, isNumericInput: false };
      const normalizedValue = App.utils.text.normalize(searchValue);
      const numericValue = Number(normalizedValue);
      const isNumericInput = !isNaN(numericValue) && normalizedValue !== '' && Number.isInteger(numericValue);
      return { normalizedValue, numericValue, isNumericInput };
    },

    /**
     * 文字列からタスク検索用のクエリを構築します
     * クライアント側ではカラムIDが不明なため、基本的には where 句を使用します。
     * @param {string} searchValue - 検索文字列
     * @returns {Object} クエリオブジェクト { where: Object }
     */
    buildTaskSearchQuery: function (searchValue) {
      const { normalizedValue, numericValue, isNumericInput } = this.getNormalizedSearchInfo(searchValue);
      if (!normalizedValue) return null;

      if (isNumericInput) {
        // 数値入力の場合: display_id が一致するものを優先
        return {
          where: { display_id: ['=', numericValue] }
        };
      } else {
        // 通常の文字列検索
        return {
          where: { name: ['LIKE', `%${normalizedValue}%`] }
        };
      }
    }
  };

  /**
   * エンティティ横断検索ユーティリティ
   * tasks / plans / directories / skills / members を共通方式で検索します。
   */
  App.utils.entitySearch = {
    /**
     * 検索対象の定義
     * @returns {Object<string, Object>}
     */
    getConfigs: function () {
      return {
        tasks: { tableName: TABLE_NAMES.TASKS, nameField: 'name', label: 'タスク' },
        plans: { tableName: TABLE_NAMES.PLANS, nameField: 'name', label: '企画' },
        directories: { tableName: TABLE_NAMES.DIRECTORIES, nameField: 'name', label: '組織' },
        skills: { tableName: TABLE_NAMES.SKILLS, nameField: 'title', label: '技能' },
        members: { tableName: TABLE_NAMES.MEMBERS, nameField: 'display_name', label: '人物' }
      };
    },

    /**
     * テーブルラベルを返します
     * @param {string} table - テーブル名
     * @returns {string}
     */
    getLabel: function (table) {
      const config = this.getConfigs()[table];
      return config ? config.label : (table || '不明');
    },

    /**
     * エンティティ横断検索
     * @param {string} searchValue - 検索文字列
     * @param {Object} options - 検索オプション
     * @param {Array<string>} options.tables - 対象テーブル
     * @param {boolean} options.forceRefresh - キャッシュ無視
     * @param {number} options.limit - 返却件数上限
     * @returns {Promise<Array<Object>>}
     */
    searchAcross: async function (searchValue, options = {}) {
      const { normalizedValue, numericValue, isNumericInput } = App.utils.search.getNormalizedSearchInfo(searchValue);
      if (!normalizedValue) return [];

      const configs = this.getConfigs();
      const tables = (Array.isArray(options.tables) && options.tables.length)
        ? options.tables.filter(function (table) { return Boolean(configs[table]); })
        : Object.keys(configs);
      const forceRefresh = options.forceRefresh !== false;
      const queries = [];

      tables.forEach(table => {
        const config = configs[table];
        const keyPrefix = `entity_${table}`;
        queries.push({
          key: `${keyPrefix}_name`,
          tableName: config.tableName,
          operation: 'select',
          dataObject: {
            where: { [config.nameField]: ['LIKE', `%${normalizedValue}%`] },
            orderBy: { display_id: 'desc' }
          },
          forceRefresh
        });
        queries.push({
          key: `${keyPrefix}_id`,
          tableName: config.tableName,
          operation: 'select',
          dataObject: {
            where: { id: ['LIKE', `%${normalizedValue}%`] },
            orderBy: { display_id: 'desc' }
          },
          forceRefresh
        });
        if (isNumericInput) {
          queries.push({
            key: `${keyPrefix}_display`,
            tableName: config.tableName,
            operation: 'select',
            dataObject: {
              where: { display_id: ['=', numericValue] },
              orderBy: { display_id: 'desc' }
            },
            forceRefresh
          });
        }
      });

      const batchResult = await callGAS('handleBatchDatabaseProcess', App.state.userId, queries);
      const resultsObj = batchResult?.results || {};
      const merged = new Map();

      tables.forEach(table => {
        const config = configs[table];
        const keyPrefix = `entity_${table}`;
        const rawRows = []
          .concat(resultsObj[`${keyPrefix}_name`]?.data || resultsObj[`${keyPrefix}_name`] || [])
          .concat(resultsObj[`${keyPrefix}_id`]?.data || resultsObj[`${keyPrefix}_id`] || [])
          .concat(resultsObj[`${keyPrefix}_display`]?.data || resultsObj[`${keyPrefix}_display`] || []);

        rawRows.forEach(row => {
          if (!row || !row.id) return;
          const mapKey = `${table}:${row.id}`;
          if (merged.has(mapKey)) return;
          merged.set(mapKey, {
            table: table,
            id: row.id,
            name: row[config.nameField] || '',
            display_id: row.display_id || null
          });
        });
      });

      const list = Array.from(merged.values());
      list.sort((a, b) => {
        const aDisplay = (typeof a.display_id === 'number') ? a.display_id : -1;
        const bDisplay = (typeof b.display_id === 'number') ? b.display_id : -1;
        if (aDisplay !== bDisplay) return bDisplay - aDisplay;
        return (a.name || '').localeCompare((b.name || ''), 'ja');
      });

      const limit = Number.isInteger(options.limit) ? options.limit : 100;
      return list.slice(0, limit);
    }
  };

  // ============================================
  // Optimistic UI: データ同期ロジック
  // ============================================

  /**
   * グローバル変数内の該当オブジェクトを直接更新します (Optimistic UI)
   * @param {string} tableName - テーブル名
   */
  function getDataArray(tableName) {
    return App.state.data[tableName];
  }

  /**
   * グローバル変数内の該当オブジェクトを直接更新します (Optimistic UI)
   * @param {string} tableName - テーブル名
   * @param {string} id - レコードID
   * @param {Object} updates - 更新する値のオブジェクト
   * @returns {Object|null} 更新されたアイテム、または見つからない場合はnull
   */
  function updateLocalData(tableName, id, updates) {
    const dataArray = getDataArray(tableName);
    if (!dataArray) {
      console.warn(`updateLocalData: テーブル ${tableName} が見つかりません`);
      return null;
    }

    const item = dataArray.find(d => d.id === id);
    if (!item) {
      console.warn(`updateLocalData: ID ${id} が ${tableName} に見つかりません`);
      return null;
    }

    Object.keys(updates).forEach(key => {
      item[key] = updates[key];
    });

    return item;
  }

  /**
   * データをロールバックします (エラー時)
   * @param {string} tableName - テーブル名
   * @param {string} id - レコードID
   * @param {Object} oldData - 以前のデータ
   */
  function rollbackLocalData(tableName, id, oldData) {
    const dataArray = getDataArray(tableName);
    if (!dataArray) {
      console.warn(`rollbackLocalData: テーブル ${tableName} が見つかりません`);
      return;
    }

    const item = dataArray.find(d => d.id === id);
    if (!item) {
      console.warn(`rollbackLocalData: ID ${id} が ${tableName} に見つかりません`);
      return;
    }

    Object.keys(oldData).forEach(key => {
      item[key] = oldData[key];
    });
  }

  async function delay(ms) {

  /**
   * 指定日までの残り日数を計算します
   * @param {string} to - 目標日（YYYY-MM-DD形式）
   * @returns {number} 残り日数
   */
  function calculateDaysUntil(to) {
    const eventDate = new Date(to);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    eventDate.setHours(0, 0, 0, 0);

    const diffTime = eventDate - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    return diffDays;
  }

  // ============================================
  // Quill Rich Text Editor Module
  // リッチテキストエディタの共通モジュール
  // ============================================

  App.utils.quill = {
    // 登録済みフラグ（1回のみ登録）
    _registered: false,

    /**
     * カスタムBlotを登録（アプリ起動時に1回だけ呼ぶ）
     */
    registerCustomBlots: function () {
      if (this._registered || typeof Quill === 'undefined') return;

      const Embed = Quill.import('blots/embed');
      class SoftBreakBlot extends Embed {
        static blotName = 'softbreak';
        static tagName = 'BR';
      }
      Quill.register(SoftBreakBlot);
      this._registered = true;
      console.log('[App.utils.quill] Custom blots registered');
    },

    /**
     * Quillエディタを初期化
     * @param {string} selector - エディタのセレクタ（例: '#my-editor'）
     * @param {Object} options - オプション設定
     * @param {string} options.placeholder - プレースホルダー
     * @param {Array} options.toolbar - ツールバー設定（デフォルト: 標準ツールバー）
     * @returns {Quill} Quillインスタンス
     */
    init: function (selector, options = {}) {
      // カスタムBlotを登録
      this.registerCustomBlots();

      // デフォルトツールバー
      const defaultToolbar = [
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
        ['link', 'clean']
      ];

      // デフォルトプレースホルダー
      const defaultPlaceholder = 'テキストを入力...\nShift+Enterで改行 / Enterで段落区切り';
      const clipboardMatchers = [
        [Node.ELEMENT_NODE, function (node, delta) {
          (delta.ops || []).forEach(function (op) {
            if (!op || !op.attributes) return;
            delete op.attributes.color;
            delete op.attributes.background;
            delete op.attributes.font;
          });
          return delta;
        }]
      ];

      // Quillインスタンスを作成
      const quill = new Quill(selector, {
        theme: 'bubble',
        placeholder: options.placeholder || defaultPlaceholder,
        modules: {
          toolbar: options.toolbar || defaultToolbar,
          clipboard: {
            matchers: clipboardMatchers
          },
          keyboard: {
            bindings: {
              // Shift+Enterでbrタグを挿入
              linebreak: {
                key: 'Enter',
                shiftKey: true,
                handler: function (range) {
                  // BRタグを挿入
                  this.quill.insertEmbed(range.index, 'softbreak', true, 'user');
                  // BRの直後にゼロ幅スペースを挿入してカーソル位置を確保
                  this.quill.insertText(range.index + 1, '\u200B', 'user');
                  // カーソルをゼロ幅スペースの後に移動
                  this.quill.setSelection(range.index + 2, 'user');
                  return false;
                }
              }
            }
          }
        }
      });

      // イベントハンドラを設定
      this._setupEventHandlers(quill);

      return quill;
    },

    /**
     * イベントハンドラを設定（リンク永続性、自動リンク化、空コンテンツクリーンアップ）
     * @param {Quill} quill - Quillインスタンス
     */
    _setupEventHandlers: function (quill) {
      // テキスト変更時の処理
      quill.on('text-change', (delta, oldDelta, source) => {
        if (source !== 'user') return;

        // 1. リンクの永続性（リンク内での編集時にリンクを維持）
        this._handleLinkPersistence(quill, delta);

        // 2. 自動リンク化（URL入力後にスペース/改行で確定）
        this._handleAutoLink(quill, delta, oldDelta);

        // 3. 空コンテンツのクリーンアップ
        this._handleEmptyCleanup(quill);
      });

      // リンククリック時に新しいタブで開く（安全なスキームのみ許可）
      quill.root.addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (!link || !link.href) {
          return;
        }
        const safeUrl = sanitizeUrl(link.href);
        if (!safeUrl) {
          // 不正なスキームのURLは開かない
          e.preventDefault();
          return;
        }
        e.preventDefault();
        window.open(safeUrl, '_blank', 'noopener,noreferrer');
      });
    },
    /**
     * リンクの永続性を処理
     * @param {Quill} quill - Quillインスタンス
     * @param {Object} delta - 変更Delta
     */
    _handleLinkPersistence: function (quill, delta) {
      let index = 0;
      delta.ops.forEach(op => {
        if (op.retain) {
          index += op.retain;
        } else if (op.insert) {
          if (typeof op.insert === 'string') {
            const len = op.insert.length;
            // スペース、改行の場合はリンクを継承しない
            if (op.insert !== ' ' && op.insert !== '\n') {
              // 挿入箇所の前後両方のリンクを確認（index は現在の挿入位置、index + len は挿入された文字列の直後の位置）
              const formatBefore = index > 0 ? quill.getFormat(index - 1, 1) : {};
              const formatAfter = quill.getFormat(index + len, 1);
              // 両端が同じリンクである（＝リンクの途中に挿入された）場合のみリンクを継承し、境界では付与しない
              const linkUrl = (formatBefore.link && formatBefore.link === formatAfter.link) ? formatBefore.link : null;
              if (linkUrl) {
                quill.formatText(index, len, 'link', linkUrl, 'silent');
              }
            }
            index += len;
          } else if (typeof op.insert === 'object') {
            // softbreak等のEmbed要素の場合はリンクを継承しない
            index += 1;
          }
        }
      });
    },

    /**
     * URL自動リンク化を処理
     * @param {Quill} quill - Quillインスタンス
     * @param {Object} delta - 変更Delta
     * @param {Object} oldDelta - 変更前のDelta
     */
    _handleAutoLink: function (quill, delta, oldDelta) {
      const hasSpaceOrNewline = delta.ops.some(op =>
        op.insert && typeof op.insert === 'string' && (op.insert.includes(' ') || op.insert.includes('\n'))
      );

      if (!hasSpaceOrNewline) return;

      // oldDeltaからテキストを取得（変更前の状態）
      let oldText = '';
      oldDelta.ops.forEach(op => {
        if (typeof op.insert === 'string') {
          oldText += op.insert;
        } else if (typeof op.insert === 'object') {
          oldText += ' ';
        }
      });

      // delta操作から挿入位置を特定
      let insertPos = 0;
      for (const op of delta.ops) {
        if (op.retain) {
          insertPos += op.retain;
        } else if (op.insert) {
          break;
        }
      }

      // 挿入位置の直前のテキストを取得
      const beforeInsert = oldText.substring(0, insertPos);

      // 最後の単語を抽出
      const words = beforeInsert.split(/[\s\n\u00a0]+/);
      const lastWord = words[words.length - 1];

      // URLパターンにマッチするかチェック
      const urlRegex = /^https?:\/\/[^\s\n\u00a0]+$/;
      if (urlRegex.test(lastWord)) {
        const urlStart = insertPos - lastWord.length;
        const existingFormat = quill.getFormat(urlStart, lastWord.length);
        if (!existingFormat.link) {
          quill.formatText(urlStart, lastWord.length, 'link', lastWord, 'silent');
        }
      }
    },

    /**
     * 空コンテンツのクリーンアップを処理
     * @param {Quill} quill - Quillインスタンス
     */
    _handleEmptyCleanup: function (quill) {
      const textContent = quill.getText().trim();
      const hasEmbeds = quill.root.querySelector('img, iframe, video');
      if (textContent === '' && !hasEmbeds) {
        if (quill.root.innerHTML !== '') {
          quill.root.innerHTML = '';
        }
      }
    },

    /**
     * エディタの内容を取得（実質空の場合は空文字を返す）
     * @param {Quill} quill - Quillインスタンス
     * @returns {string} HTML文字列または空文字
     */
    getContent: function (quill) {
      if (!quill) return '';
      const text = quill.getText().trim();
      const html = this._sanitizeHtml(quill.root.innerHTML);
      // 実質的なテキストがなく、かつ画像等もない場合は空文字を返す
      if (text === '' && !quill.root.querySelector('img, iframe, video')) {
        return '';
      }
      return html;
    },

    /**
     * エディタに内容を設定
     * @param {Quill} quill - Quillインスタンス
     * @param {string} html - 設定するHTML
     */
    setContent: function (quill, html) {
      if (!quill) return;
      if (html) {
        quill.root.innerHTML = this._sanitizeHtml(html);
      } else {
        quill.root.innerHTML = '';
      }
    },

    /**
     * HTMLから色指定関連を除去
     * @param {string} html - 元HTML
     * @returns {string} 色指定除去後HTML
     */
    _sanitizeHtml: function (html) {
      if (!html) return '';
      const container = document.createElement('div');
      container.innerHTML = String(html);

      container.querySelectorAll('*').forEach(function (element) {
        element.removeAttribute('color');
        element.removeAttribute('bgcolor');
        element.removeAttribute('face');

        if (element.hasAttribute('style')) {
          const retained = element.getAttribute('style').split(';').map(function (item) {
            return item.trim();
          }).filter(function (decl) {
            if (!decl) return false;
            const pair = decl.split(':');
            const prop = (pair[0] || '').trim().toLowerCase();
            return prop !== 'color' && prop !== 'background' && prop !== 'background-color' && prop !== 'font' && prop !== 'font-family';
          });
          if (retained.length) {
            element.setAttribute('style', retained.join('; '));
          } else {
            element.removeAttribute('style');
          }
        }

        if (element.className && typeof element.className === 'string') {
          const classes = element.className.split(/\s+/).filter(function (className) {
            return className && !/^ql-(color|bg|font)-/.test(className);
          });
          if (classes.length) {
            element.className = classes.join(' ');
          } else {
            element.removeAttribute('class');
          }
        }
      });

      return container.innerHTML;
    },

    /**
     * エディタをクリア
     * @param {Quill} quill - Quillインスタンス
     */
    clear: function (quill) {
      if (!quill) return;
      quill.root.innerHTML = '';
    }
  };

  console.log('[App.utils.quill] Quill module loaded');

</script>
