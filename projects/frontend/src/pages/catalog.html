<div id="tab-catalog" style="display: none;">
    <header class="small-margin no-padding">
        <div class="row no-margin no-padding middle-align">
            <div class="tabs" id="catalog-table-nav" title="表示切替">
                <a class="active" data-catalog-table="members" title="人物">
                    <i>person</i>
                    <span class="m l">人物</span>
                </a>
                <a data-ui="#catalog-subtab-directories" data-catalog-table="directories" title="組織">
                    <i>account_tree</i>
                    <span class="m l">組織</span>
                </a>
                <a data-ui="#catalog-subtab-skills" data-catalog-table="skills" title="技能">
                    <i>psychology</i>
                    <span class="m l">技能</span>
                </a>
                <a data-ui="#catalog-subtab-plans" data-catalog-table="plans" title="企画">
                    <i>store</i>
                    <span class="m l">企画</span>
                </a>
            </div>
            <div class="max"></div>
            <span id="last-updated-catalog" class="small-text secondary-text"></span>
            <div data-refresh-button></div>
        </div>
    </header>

    <section class="small-margin">
        <article class="border small-round surface-container-low small-padding">
            <div class="row wrap small-space center-align">
                <div class="row tiny-space center-align">
                    <i>groups</i>
                    <div>
                        <div class="small-text secondary-text">表示件数</div>
                        <h5 id="members-summary-count" class="no-margin">0</h5>
                        <div id="members-summary-total" class="small-text secondary-text">全 0 件</div>
                    </div>
                </div>
                <div class="row tiny-space center-align">
                    <i>filter_alt</i>
                    <span class="small-text secondary-text">有効条件</span>
                    <span id="members-filter-count" class="badge">0</span>
                </div>
                <div class="field border label small no-margin" style="min-width: 14rem; flex: 1 1 16rem;">
                    <input id="catalog-quick-search-input" type="search" placeholder=" " oninput="App.pages.catalog.setQuickSearch(this.value)" autocomplete="off">
                    <label>クイック検索（現在のテーブル全体）</label>
                    <i>search</i>
                </div>
                <div class="field border label small no-margin" style="min-width: 12rem; flex: 0 1 14rem;">
                    <select id="catalog-sort-select" onchange="App.pages.catalog.setSortPreset(this.value)"></select>
                    <label>並び替え</label>
                    <i>sort</i>
                </div>
                <button class="border" type="button" onclick="App.pages.catalog.toggleSortDirection()" title="並び順を反転">
                    <i>swap_vert</i>
                    <span>昇順/降順</span>
                </button>
                <div class="max"></div>
                <div id="catalog-quick-filter-chips" class="row wrap tiny-space"></div>
                <div class="max"></div>
                <button class="border" type="button" onclick="App.pages.catalog.resetFilters(App.pages.catalog.getCurrentTab())">
                    <i>filter_alt_off</i>
                    <span>条件をクリア</span>
                </button>
                <button class="border" type="button" onclick="App.pages.catalog.resetColumnVisibility(App.pages.catalog.getCurrentTab())">
                    <i>view_column</i>
                    <span>列表示をリセット</span>
                </button>
                <button class="border" type="button" onclick="App.pages.catalog.loadData(true)">
                    <i>refresh</i>
                    <span>再読み込み</span>
                </button>
                <button class="border" type="button" onclick="App.pages.catalog.downloadCsvForCurrentTab()">
                    <i>download</i>
                    <span>CSV出力</span>
                </button>
            </div>
        </article>
    </section>

    <div id="catalog-subtab-members" class="page active small-margin small-round">
        <div>
            <div id="members-table-loading" class="row center-align padding">
                <progress class="circle small"></progress>
            </div>
            <div id="members-table-container" class="members-tabulator-host" style="display: none;"></div>
        </div>
    </div>

    <div id="catalog-subtab-directories" style="display: none;" class="page small-margin small-round">
        <div>
            <div id="directories-table-loading" class="row center-align padding" style="display: none;">
                <progress class="circle small"></progress>
            </div>
            <div id="directories-table-container" class="members-tabulator-host" style="display: none;"></div>
        </div>
    </div>

    <div id="catalog-subtab-skills" style="display: none;" class="page small-margin small-round">
        <div>
            <div id="skills-table-loading" class="row center-align padding" style="display: none;">
                <progress class="circle small"></progress>
            </div>
            <div id="skills-table-container" class="members-tabulator-host" style="display: none;"></div>
        </div>
    </div>

    <div id="catalog-subtab-plans" style="display: none;" class="page small-margin small-round">
        <div>
            <div id="plans-table-loading" class="row center-align padding" style="display: none;">
                <progress class="circle small"></progress>
            </div>
            <div id="plans-table-container" class="members-tabulator-host" style="display: none;"></div>
        </div>
    </div>
</div>
