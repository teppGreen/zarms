<div id="tab-members" style="display: none;">
    <header class="small-margin no-padding">
        <nav class="no-margin no-padding space">
            <h3 class="bold small">メンバー</h3>
            <a id="open-member-spreadsheet" rel="noopener noreferrer" target="_blank" class="small-text secondary-text">新しいタブで開く<i class="tiny">open_in_new</i></a>
        </nav>
    </header>
    <div class="small-margin large-height round border">
        <iframe id="member-spreadsheet-link" src="" style="width: 100%; height: 100%; border: 0;"></iframe>
    </div>
</div>

<script>
    (function () {
        // スプレッドシートURLを設定から取得
        document.addEventListener('DOMContentLoaded', function () {
            const link = document.getElementById('member-spreadsheet-link');
            if (link) {
                link.src = EXTERNAL_URLS.MEMBER_SPREADSHEET + '&rm=minimal';
            }

            const link2 = document.getElementById('open-member-spreadsheet');
            if (link2) {
                link2.href = EXTERNAL_URLS.MEMBER_SPREADSHEET;
            }
        });
    })();
</script>
