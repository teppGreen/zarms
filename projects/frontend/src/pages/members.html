<div id="tab-members" style="display: none;">
    <header class="small-margin">
        <nav class="no-padding no-margin row">
            <h3 class="bold small">メンバー</h3>
            <div class="max"></div>
            <nav class="tabbed background small max" id="members-tab-nav" title="表示切替">
                <a class="active" id="members-tab-btn-member" title="メンバー" onclick="App.pages.members.switchTab('member')">
                    <i>person</i>
                    <span class="l">メンバー</span>
                </a>
                <a id="members-tab-btn-directory" title="ディレクトリ" onclick="App.pages.members.switchTab('directory')">
                    <i>account_tree</i>
                    <span class="l">ディレクトリ</span>
                </a>
                <a id="members-tab-btn-skills" title="スキル" onclick="App.pages.members.switchTab('skills')">
                    <i>psychology</i>
                    <span class="l">スキル</span>
                </a>
            </nav>
            <button class="circle transparent" onclick="App.modals.filterMembers.open()" title="フィルタ">
                <i>filter_list</i>
            </button>
            <span id="members-filter-count" class="chip small fill" style="display: none;">0</span>
        </nav>
    </header>

    <div id="members-subtab-member" class="small-margin small-round">
        <div>
            <div id="members-table-loading" class="row center-align padding">
                <progress class="circle small"></progress>
            </div>
            <div id="members-table-container" class="members-tabulator-host" style="display: none;"></div>
        </div>
    </div>

    <div id="members-subtab-directory" style="display: none;" class="small-margin small-round">
        <div>
            <div id="directories-table-loading" class="row center-align padding" style="display: none;">
                <progress class="circle small"></progress>
            </div>
            <div id="directories-table-container" class="members-tabulator-host" style="display: none;"></div>
        </div>
    </div>

    <div id="members-subtab-skills" style="display: none;" class="small-margin small-round">
        <div>
            <div id="skills-table-loading" class="row center-align padding" style="display: none;">
                <progress class="circle small"></progress>
            </div>
            <div id="skills-table-container" class="members-tabulator-host" style="display: none;"></div>
        </div>
    </div>
</div>

<dialog id="modal-filter-members" class="padding no-scroll">
    <nav class="bottom-margin small-padding">
        <h5 id="members-filter-title" class="bold">一覧のフィルタ</h5>
        <div class="max"></div>
        <button class="circle transparent" onclick="ui('#modal-filter-members')">
            <i>close</i>
        </button>
    </nav>

    <div id="members-filter-fields" class="grid background large-width medium-height scroll padding tiny-space no-margin small-round"></div>

    <nav class="right-align small-padding">
        <a onclick="App.modals.filterMembers.resetAll()"><span>リセット</span></a>
        <div class="max"></div>
        <button class="border" onclick="ui('#modal-filter-members')">キャンセル</button>
        <button onclick="App.modals.filterMembers.apply()">適用</button>
    </nav>
</dialog>
