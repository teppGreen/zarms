<div id="tab-insights" style="display: none;">
    <header class="small-margin no-padding">
        <div class="row no-margin no-padding middle-align">
            <h2 class="small bold">分析</h2>
            <div class="max"></div>
            <button id="insights-reload-button" class="chip" onclick="App.pages.insights.loadData(true)">
                <i>refresh</i>
                <span>再読み込み</span>
            </button>
        </div>
        <p class="small-text secondary-text">直近30日間のtasks関連ログを全体集計して表示します。</p>
    </header>

    <div class="grid no-space">
        <div class="s12 m6 l6 small-margin">
            <article class="padding">
                <nav>
                    <h6 class="small bold">曜日別更新件数</h6>
                </nav>
                <div id="insights-weekday-chart" class="top-margin shimmer-loading" style="min-height: 320px;"></div>
            </article>
        </div>

        <div class="s12 m6 l6 small-margin">
            <article class="padding">
                <nav class="">
                    <h6 class="small bold">タスクランキング</h6>
                    <div class="max"></div>
                    <button class="chip" disabled>直近30日間</button>
                </nav>
                <span class="small-text secondary-text">期間内のtasks関連ログ作成数（担当者別）</span>
                <div id="insights-task-ranking-chart" class="top-margin shimmer-loading" style="min-height: 320px;"></div>
            </article>
        </div>

        <div class="s12 m6 l6 small-margin">
            <article class="padding">
                <nav class="">
                    <h6 class="small bold">ボードランキング</h6>
                    <div class="max"></div>
                    <button class="chip" disabled>直近30日間</button>
                </nav>
                <span class="small-text secondary-text">期間内に更新されたタスク数（ボード別）</span>
                <div id="insights-board-ranking-chart" class="top-margin shimmer-loading" style="min-height: 320px;"></div>
            </article>
        </div>
    </div>
</div>
