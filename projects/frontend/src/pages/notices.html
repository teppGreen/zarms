<div id="tab-notices" style="display: none;">
    <header class="small-margin no-padding">
        <div class="row no-margin no-padding middle-align">
            <h2 class="small bold">お知らせ</h2>
            <div class="max"></div>
            <button id="notices-reload-button" class="chip" onclick="App.pages.notices.loadData(true)">
                <i>refresh</i>
                <span>再読み込み</span>
            </button>
        </div>
        <p class="small-text secondary-text">左にお知らせ、右で資料リンクを直接管理できます。</p>
    </header>

    <div class="grid no-space">
        <div class="s12 m9 l9 small-margin">
            <article class="padding">
                <nav>
                    <h6 class="small bold">掲示中のお知らせ</h6>
                </nav>
                <div id="notices-list" class="top-margin shimmer-loading" data-tab-render-root></div>
            </article>
        </div>
        <div class="s12 m3 l3 small-margin">
            <article class="padding">
                <nav>
                    <h6 class="small bold">資料リンク</h6>
                </nav>
                <div id="notices-links-editor" class="top-margin shimmer-loading" data-tab-render-root></div>
            </article>
        </div>
    </div>
</div>

<dialog id="modal-new-notice" class="modal medium-width padding">
    <nav class="small-padding bottom-margin row middle-align">
        <h5 class="bold max">新しいお知らせ</h5>
        <button class="circle transparent" onclick="App.modals.newNotice.close()">
            <i>close</i>
        </button>
    </nav>

    <div class="field border label bottom-margin">
        <input id="new-notice-title" maxlength="80" placeholder="例: 企画提出締切のお知らせ">
        <label>タイトル</label>
    </div>

    <div class="field border label bottom-margin">
        <input id="new-notice-category" maxlength="30" placeholder="例: 事務連絡">
        <label>カテゴリ</label>
    </div>

    <div class="grid no-space">
        <div class="s12 m6 l6 small-margin">
            <div class="field border label">
                <input id="new-notice-starts-at" type="datetime-local">
                <label>掲示開始</label>
            </div>
        </div>
        <div class="s12 m6 l6 small-margin">
            <div class="field border label">
                <input id="new-notice-ends-at" type="datetime-local">
                <label>掲示終了</label>
            </div>
        </div>
    </div>

    <div class="field textarea border label top-margin">
        <textarea id="new-notice-body" rows="8" placeholder="本文を入力"></textarea>
        <label>本文</label>
    </div>

    <div class="row top-margin middle-align">
        <span id="new-notice-status" class="small-text secondary-text"></span>
        <div class="max"></div>
        <button class="chip" onclick="App.modals.newNotice.close()">
            <i>close</i>
            <span>キャンセル</span>
        </button>
        <button id="new-notice-save-button" class="chip primary" onclick="App.modals.newNotice.save()">
            <i>save</i>
            <span>作成</span>
        </button>
    </div>
</dialog>

<dialog id="modal-notice-detail" class="modal right no-padding max">
    <div class="top">
        <button class="circle transparent" onclick="App.pages.notices.closeNoticeDetail()">
            <i>close</i>
        </button>
        <h5 id="notice-detail-title" class="small bold max"></h5>
    </div>
    <div class="large-padding">
        <div class="row tiny-space middle-align small-text secondary-text">
            <i>schedule</i>
            <span id="notice-detail-period"></span>
        </div>
        <div class="row tiny-space middle-align small-text secondary-text top-margin">
            <i>person</i>
            <span id="notice-detail-author"></span>
        </div>
        <article id="notice-detail-body" class="top-margin"></article>
    </div>
</dialog>
