<script>
    (function () {
        // URLを設定から取得
        document.addEventListener('DOMContentLoaded', function () {
            const contactFormLink = document.getElementById('home-contact-form-link');
            if (contactFormLink) contactFormLink.href = EXTERNAL_URLS.CONTACT_FORM;
        });

        App.pages.home = {
            // データのキャッシュ
            cachedTasks: [],
            cachedLogs: [],
            historyVisibleCount: 100,
            isLoadingMoreHistory: false,

            loadData: async function (isRefresh = false) {
                console.log('[Home] Loading data... isRefresh:', isRefresh);

                // 常にリサイズハンドラーをセットアップ（二重登録防止済み）
                this.setupResizeHandler();

                if (!isRefresh) {
                    this.renderContent();
                } else {
                    // タブ切り替え時などはヘッダー（最終更新日時など）のみ先に更新
                    this.updateHeader();
                }

                // すぐに高さを調整（非表示中に行われたリサイズへの対応）
                requestAnimationFrame(() => this.applyPanelHeights());

                try {
                    // 初回ロード時に initialData（サーバー埋め込み）をキャッシュに反映し、即座に描画
                    if (!isRefresh && (typeof initialData !== 'undefined') && initialData) {
                        let hasInitialData = false;
                        if (initialData.tasks && initialData.tasks.length > 0 && this.cachedTasks.length === 0) {
                            this.cachedTasks = initialData.tasks;
                            hasInitialData = true;
                            console.log('[Home] Initialized cachedTasks from initialData:', this.cachedTasks.length, 'items');
                        }
                        if (initialData.logs && initialData.logs.length > 0 && this.cachedLogs.length === 0) {
                            this.cachedLogs = initialData.logs;
                            hasInitialData = true;
                            console.log('[Home] Initialized cachedLogs from initialData:', this.cachedLogs.length, 'items');
                        }

                        // initialData があれば、即座にキャッシュから描画してから、必要な場合だけバックグラウンドで最新データを取得
                        if (hasInitialData) {
                            this.historyVisibleCount = 100;
                            this.renderNextTasks(this.cachedTasks);
                            this.renderRelatedHistoryForHome();
                            this.applyPanelHeights();
                            this.updateHeader();

                            const shouldRefreshFromServer = Boolean(initialData.hasAnyCachedData);
                            if (shouldRefreshFromServer) {
                                console.log('[Home] Initial data rendered from cache. Fetching fresh data in background...');
                                setTimeout(() => this.loadData(true), 100);
                            }
                            return;
                        }
                    }

                    // クエリの準備
                    const tasksQuery = {
                        where: { task_status_key: ['!=', 'DONE'] }
                    };
                    const logsQuery = {
                        where: { created_by: ['=', App.state.userId] },
                        orderBy: { created_at: 'desc' },
                        limit: 100
                    };

                    const [tasksResult, logsResult] = await Promise.allSettled([
                        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'select', tasksQuery, null, isRefresh),
                        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.LOGS, 'select', logsQuery, null, isRefresh)
                    ]);

                    const asArray = (result, fallback) => {
                        if (!result || result.status !== 'fulfilled') return fallback || [];
                        const value = result.value;
                        return value?.data || value || fallback || [];
                    };

                    // データ展開（失敗時はキャッシュを利用）
                    const tasks = asArray(tasksResult, this.cachedTasks);
                    const logs = asArray(logsResult, this.cachedLogs);

                    // キャッシュ更新
                    this.cachedTasks = tasks;
                    this.cachedLogs = logs;
                    this.historyVisibleCount = 100;

                    // 描画
                    this.renderNextTasks(tasks);
                    this.renderRelatedHistoryForHome();

                    // 描画後にパネルの高さを調整
                    this.applyPanelHeights();

                    // データの読み込み完了時刻でヘッダーを最終更新
                    this.updateHeader();

                    // キャッシュヒット時の再取得（バックグラウンド）
                    const hasCachedResult =
                        (tasksResult.status === 'fulfilled' && tasksResult.value?.isCached) ||
                        (logsResult.status === 'fulfilled' && logsResult.value?.isCached);

                    if (!isRefresh && hasCachedResult) {
                        console.log('[Home] Cached data detected. Refreshing in background...');
                        setTimeout(() => {
                            this.loadData(true);
                        }, 100);
                    }

                } catch (error) {
                    console.error('[Home] Error loading data:', error);
                    // エラー表示
                    this.showError('home-next-tasks', 'データの読み込みに失敗しました');
                    this.showError('home-related-history', 'データの読み込みに失敗しました');
                }
            },

            renderContent: function () {
                const container = document.getElementById('home-content');
                if (!container) return;

                // タイトルとカウントダウン部分は共通
                // 残りは4カラムグリッドで描画
                container.innerHTML = `
                    <header class="small-margin no-padding">
                        <div class="row no-margin no-padding">
                            <h2 id="home-greeting" class="small bold"></h2>
                            <div class="max"></div>
                            <span id="last-updated-home" class="small-text secondary-text"></span>
                            ${window.refreshButtonHTML}
                        </div>
                        <div class="large-text">
                            <p id="home-event-countdown"></p>
                        </div>
                    </header>

                    <div class="grid no-space">
                        <div class="s12 m6 l6 small-margin">
                            <article class="padding">
                                <nav class="">
                                    <h6 class="small bold">マイタスク</h6>
                                    <div class="max"></div>
                                    <button class="chip" onclick="App.pages.home.openMyBoardDefault()">
                                        <i>assignment</i>
                                        <span>マイボード</span>
                                    </button>
                                </nav>
                                <span class="small-text secondary-text">あなたが次に取りかかるべきタスク</span>
                                <div id="home-next-tasks" class="shimmer-loading scroll top-margin ">
                                </div>
                            </article>
                        </div>

                        <div class="s12 m6 l6 small-margin">
                           <article class="padding">
                                <nav class="">
                                        <h6 class="small bold">操作履歴</h6>
                                    <div class="max"></div>
                                        <button class="chip" disabled>直近100件</button>
                                </nav>
                                    <span class="small-text secondary-text">あなたがZARMS内で操作した履歴</span>
                                    <div id="home-related-history" class="shimmer-loading scroll top-margin ">
                                </div>
                            </article>
                        </div>
                    </div>
                `;
                this.updateHeader();
            },

            updateHeader: function () {
                const greeting = this.getGreeting();
                const daysUntilEvent = calculateDaysUntil(EVENT_CONFIG.FESTIVAL_DATE);

                const greetingEl = document.getElementById('home-greeting');
                const countdownEl = document.getElementById('home-event-countdown');

                if (greetingEl) greetingEl.textContent = `${greeting}、${activeUser.display_name}さん｡`;
                if (countdownEl && daysUntilEvent > 0) countdownEl.textContent = `リアル会場0日目(準備日)まで、残り${daysUntilEvent}日です。`;
            },

            getGreeting: function () {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 12) {
                    return 'おはようございます';
                } else if (hour >= 12 && hour < 18) {
                    return 'こんにちは';
                } else {
                    return 'こんばんは';
                }
            },

            // ---------------------------------------------------------
            // 次のタスク (Next Tasks)
            // ---------------------------------------------------------


            renderNextTasks: function (tasks) {
                const container = document.getElementById('home-next-tasks');
                if (!container) return;
                container.classList.remove('shimmer-loading');

                const userId = App.state.userId;
                const now = new Date();

                let myTasks = tasks.filter(t => {
                    const status = t.task_status_key;
                    if (status === 'TODO' || status === 'IN_PROGRESS') {
                        return t.processed_by === userId;
                    } else if (status === 'IN_REVIEW') {
                        return t.reviewed_by === userId;
                    }
                    return false;
                });

                // 日付計算用（時間を切り捨てて日付のみにする）
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

                // ソートロジック
                myTasks.sort((a, b) => {
                    const getKeys = (t) => {
                        const isTodo = t.task_status_key === 'TODO';
                        if (isTodo) {
                            return {
                                primary: t.starts_at || '9999-12-31T23:59:59',
                                secondary: t.ends_at || '9999-12-31T23:59:59'
                            };
                        } else {
                            return {
                                primary: t.ends_at || '9999-12-31T23:59:59',
                                secondary: t.starts_at || '9999-12-31T23:59:59'
                            };
                        }
                    };

                    const kA = getKeys(a);
                    const kB = getKeys(b);

                    if (kA.primary !== kB.primary) return kA.primary.localeCompare(kB.primary);
                    return kA.secondary.localeCompare(kB.secondary);
                });

                let listHtml = `
                    <table class="border small-text">
                      <thead class="fixed surface-container-low">
                        <tr>
                          <th class="left-align">タスク名</th>
                          <th class="right-align">期限</th>
                        </tr>
                      </thead>
                      <tbody>
                `;

                if (myTasks.length === 0) {
                    listHtml += `<tr><td colspan="2" class="center-align secondary-text">担当中のタスクはありません</td></tr>`;
                } else {
                    const displayTasks = myTasks; // 上限なし

                    displayTasks.forEach(t => {
                        const isTodo = t.task_status_key === 'TODO';
                        // 基準日時の決定
                        const targetDateStr = isTodo ? t.starts_at : t.ends_at;

                        let deadlineText = '-';
                        let dateClass = '';

                        if (targetDateStr) {
                            const targetDate = new Date(targetDateStr);
                            const targetDay = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());

                            // 差分日数 (target - today)
                            const diffTime = targetDay - today;
                            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

                            const suffix = isTodo ? '開始' : '終了';

                            if (diffDays === 0) {
                                deadlineText = `本日${suffix}`;
                            } else if (diffDays > 0) {
                                deadlineText = `${diffDays}日後${suffix}`;
                            } else {
                                // 過去日
                                deadlineText = `${Math.abs(diffDays)}日前${suffix}`;
                                // 期限切れ（過去）の場合のみ赤字
                                dateClass = 'error-text bold';
                            }
                        }

                        // ホームからタスクを開く: ボードをロードしてから開く
                        listHtml += `
                            <tr style="cursor: pointer;" onclick="App.pages.home.openTaskFromHome('${t.id}', '${t.board_id}')">
                                <td>
                                    <div class="column">
                                        <span>${escapeHtml(t.name)}</span>
                                        <span class="secondary-text">#${t.display_id}</span>
                                    </div>
                                </td>
                                <td class="${dateClass} right-align" style="width: 0; white-space: nowrap;">
                                    ${deadlineText}
                                </td>
                            </tr>
                        `;
                    });
                }

                listHtml += `
                      </tbody>
                    </table>
                `;
                container.innerHTML = listHtml;
            },

            /**
             * ホームページからタスクを開く
             * openRelatedTaskと異なり、モーダルが開いていない前提なのでclose()をスキップ
             */
            openTaskFromHome: async function (taskId, boardId) {
                if (!taskId) {
                    console.error('[Home] Invalid task ID');
                    return;
                }

                const targetBoardId = boardId || 'my-board';

                // マイボードの場合は新しいナビゲーションを使用
                if (targetBoardId === 'my-board') {
                    if (App.utils.navigation && App.utils.navigation.navigateToMyBoardWithTaskName) {
                        await App.utils.navigation.navigateToMyBoardWithTaskName(taskId);
                        return;
                    }
                }

                // URLパラメータを更新してボードに移動
                if (App.utils.url && App.utils.url.updateParams) {
                    const newParams = {
                        tab: 'board',
                        board_id: targetBoardId
                    };
                    App.utils.url.updateParams(newParams, false);
                }

                // ボードタブに切り替え
                if (App.utils.navigation && App.utils.navigation.switchTab) {
                    // この経路ではswitchTab側の読み込みをスキップし、tryOpenTask側のloadDataに統一する
                    await App.utils.navigation.switchTab(`board-${targetBoardId}`, false, false, true);

                    // タスクを開く処理（共通関数を使用）
                    if (App.utils.navigation && App.utils.navigation.tryOpenTask) {
                        await App.utils.navigation.tryOpenTask(taskId, targetBoardId);
                    }
                }
            },

            /**
             * マイボードをデフォルト設定（自分）で開く
             */
            openMyBoardDefault: function () {
                if (App.pages.boards) {
                    // タブ切り替え（ロードはスキップ）
                    App.utils.navigation.switchTab('board-my-board', false, false, true);

                    // フィルタを自分のみ（デフォルト）にリセット
                    App.pages.boards.initializeMyBoardFilters(true);

                    // 明示的にデータをロード
                    App.pages.boards.loadData('my-board', false);
                }
            },

            /**
             * 指定したメンバーでマイボードをフィルタして開く
             */
            openMyBoardForMember: function (userId) {
                if (App.pages.boards) {
                    // タブ切り替え（ロードはスキップ）
                    App.utils.navigation.switchTab('board-my-board', false, false, true);

                    // フィルタ設定を構成
                    const filters = {
                        members: {
                            created_by: [userId],
                            processed_by: [userId],
                            reviewed_by: [userId],
                            received_by: [userId]
                        }
                    };

                    // 最初にフィルタをリセットしてからカスタム設定を適用
                    App.pages.boards.initializeMyBoardFilters(false); // 空で初期化
                    App.pages.boards.setMyBoardFilters(filters);

                    // 明示的にデータをロード
                    App.pages.boards.loadData('my-board', false);
                }
            },

            renderRelatedHistoryForHome: function () {
                const container = document.getElementById('home-related-history');
                if (!container) return;
                container.classList.remove('shimmer-loading');

                const logs = this.cachedLogs || [];
                const visible = logs.slice(0, this.historyVisibleCount);

                if (visible.length === 0) {
                    container.innerHTML = '<div class="padding center-align secondary-text">操作履歴はありません</div>';
                    return;
                }

                const listHtml = visible.map((log) => {
                    const logId = this.getSafeDomId(log.id);
                    const tableNameKey = this.normalizeLogTableName(log.table_name);
                    const tableName = escapeHtml(this.getLogTableLabel(tableNameKey));
                    const operationLabel = escapeHtml(this.getLogOperationLabel(log.operation_type_key));
                    const timestamp = log.created_at ? formatDateTimeForDisplay(new Date(log.created_at), 'MM/dd(E) HH:mm') : '-';
                    const remarkText = this.getLogRemarkText(log);
                    const isTaskRow = this.isLogTaskRow(tableNameKey, log);
                    const isBoardRow = this.isLogBoardRow(tableNameKey, log);
                    const isClickable = isTaskRow || isBoardRow;
                    const rowAttrs = isClickable
                        ? `style="cursor: pointer;" onclick="App.pages.home.handleHistoryRowClick(event, this)"`
                        : '';
                    const tooltipHtml = this.renderLogDataTooltip(log);

                    return `
                        <tr ${rowAttrs} data-table-name="${escapeHtmlAttribute(tableNameKey)}" data-record-id="${escapeHtmlAttribute(log.record_id || '')}">
                            <td id="log-${logId}-operation" data-id="${escapeHtmlAttribute(log.id)}" style="width: 0; white-space: nowrap;"><span class="fill round left-padding right-padding">${operationLabel}</span></td>
                            <td id="log-${logId}-table" data-id="${escapeHtmlAttribute(log.id)}" style="width: 0; white-space: nowrap;">${tableName}</td>
                            <td id="log-${logId}-remark" data-id="${escapeHtmlAttribute(log.id)}">
                                <div class="row tiny-space no-margin">
                                    ${tooltipHtml}${remarkText}
                                </div>
                            </td>
                            <td id="log-${logId}-created-at" data-id="${escapeHtmlAttribute(log.id)}" class="right-align" style="width: 0; white-space: nowrap;">${escapeHtml(timestamp)}</td>
                        </tr>
                    `;
                }).join('');

                const hasMore = logs.length > visible.length;
                const moreButton = hasMore
                    ? `<div class="center-align top-margin"><button class="chip" ${this.isLoadingMoreHistory ? 'disabled' : ''} onclick="App.pages.home.loadMoreRelatedHistory()"><i>expand_more</i><span>もっと見る</span></button></div>`
                    : '';

                container.innerHTML = `
                    <table class="border small-text">
                        <thead class="fixed surface-container-low">
                            <tr>
                                <th class="left-align">種別</th>
                                <th class="left-align">場所</th>
                                <th class="left-align">内容</th>
                                <th class="right-align">日時</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${listHtml}
                        </tbody>
                    </table>
                    ${moreButton}
                `;
            },

            loadMoreRelatedHistory: function () {
                if (this.isLoadingMoreHistory) return;
                this.isLoadingMoreHistory = true;
                this.historyVisibleCount += 100;
                this.renderRelatedHistoryForHome();
                this.isLoadingMoreHistory = false;
            },

            handleHistoryRowClick: async function (event, rowEl) {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                if (!rowEl) return;

                const tableNameKey = this.normalizeLogTableName(rowEl.dataset.tableName || '');
                const recordId = String(rowEl.dataset.recordId || '');

                if (!recordId) return;

                // table_name === 'tasks' かつ record_id があれば、record_id はタスクID
                if (this.isLogTaskRow(tableNameKey, { record_id: recordId })) {
                    await this.openTaskFromHome(recordId, 'my-board');
                    return;
                }

                // table_name === 'boards' かつ record_id があれば、record_id はボードID
                if (this.isLogBoardRow(tableNameKey, { record_id: recordId })) {
                    if (App.utils.navigation && App.utils.navigation.switchTab) {
                        await App.utils.navigation.switchTab(`board-${recordId}`);
                    }
                }
            },

            getLogSummary: function (log) {
                const op = String(log.operation_type_key || '').toUpperCase();
                if (op === 'INSERT') return 'レコードが作成されました';
                if (op === 'REMOVE') return 'レコードが削除されました';

                let parsed;
                try {
                    parsed = typeof log.data === 'string' ? JSON.parse(log.data) : log.data;
                } catch (error) {
                    return '更新されました';
                }

                if (op === 'UPDATE' && parsed && parsed.set && typeof parsed.set === 'object') {
                    const keys = Object.keys(parsed.set).filter((key) => key !== 'updated_at' && key !== 'updated_by');
                    if (keys.length > 0) {
                        return `更新: ${keys.slice(0, 3).join(', ')}${keys.length > 3 ? '...' : ''}`;
                    }
                }

                return '更新されました';
            },

            getLogOperationLabel: function (operationTypeKey) {
                const key = String(operationTypeKey || '').toUpperCase();
                return LOG_OPERATION_LABELS[key] || key || '-';
            },

            getLogTableLabel: function (tableName) {
                const key = this.normalizeLogTableName(tableName);
                return TABLE_LABELS_JA[key] || tableName || '-';
            },

            normalizeLogTableName: function (tableName) {
                return String(tableName || '').toLowerCase();
            },

            isLogTaskRow: function (tableNameKey, log) {
                const key = this.normalizeLogTableName(tableNameKey);
                return (key === TABLE_NAMES.TASKS || key === TABLE_NAMES.TASK) && !!String(log?.record_id || '');
            },

            isLogBoardRow: function (tableNameKey, log) {
                const key = this.normalizeLogTableName(tableNameKey);
                return (key === TABLE_NAMES.BOARDS || key === TABLE_NAMES.BOARD) && !!String(log?.record_id || '');
            },

            getLogRemarkText: function (log) {
                const remark = log && log.remark !== undefined && log.remark !== null ? String(log.remark) : '';
                return remark ? escapeHtml(remark) : '<span class="secondary-text">-</span>';
            },

            renderLogDataTooltip: function (log) {
                const prettyJson = this.getPrettyLogData(log.data);
                return `
                    <div>
                        <button class="transparent circle" type="button" aria-label="詳細" onclick="event.stopPropagation()">
                            <i>tooltip</i>
                        </button>
                        <div class="tooltip right max">
                            <code class="inverse-surface" style="word-break: break-word;">${escapeHtml(prettyJson)}</code>
                        </div>
                    </div>
                `;
            },

            getSafeDomId: function (value) {
                return String(value || '').replace(/[^A-Za-z0-9_-]/g, '_');
            },

            getPrettyLogData: function (data) {
                if (data === null || data === undefined || data === '') return '-';

                try {
                    const parsed = typeof data === 'string' ? JSON.parse(data) : data;
                    return JSON.stringify(parsed, null, 2);
                } catch (error) {
                    return typeof data === 'string' ? data : String(data);
                }
            },

            toPlainText: function (html) {
                const div = document.createElement('div');
                div.innerHTML = html;
                return (div.textContent || div.innerText || '').trim();
            },

            showError: function (elementId, message) {
                const container = document.getElementById(elementId);
                if (container) {
                    container.classList.remove('shimmer-loading');
                    container.innerHTML = `<div class="padding error-text center-align"><i class="large">error_outline</i><p>${message}</p></div>`;
                }
            },

            applyLayoutHeight: function () {
                this.applyPanelHeights();
            },

            applyPanelHeights: function () {
                const panelIds = ['home-next-tasks', 'home-related-history'];
                try {
                    const main = document.querySelector('main');
                    if (!main) return;

                    const windowHeight = window.innerHeight;
                    const mainStyle = window.getComputedStyle(main);
                    const mainPaddingBottom = parseFloat(mainStyle.paddingBottom) || 0;
                    const mainMarginBottom = parseFloat(mainStyle.marginBottom) || 0;

                    // ウィンドウ高さからmainの余白を引いた下端位置を計算
                    const mainBottomLimit = windowHeight - mainMarginBottom - mainPaddingBottom;

                    panelIds.forEach(id => {
                        const el = document.getElementById(id);
                        if (!el) return;
                        const article = el.closest('article');
                        if (!article) return;

                        const articleRect = article.getBoundingClientRect();
                        // 記事がメインコンテナ内に収まるように利用可能な高さを計算
                        const availableHeightForArticle = mainBottomLimit - articleRect.top;

                        // 記事内の装飾要素（ヘッダー、説明文、パディング、マージン）を計測
                        const nav = article.querySelector('nav');
                        const span = article.querySelector('span.small-text');
                        const articleStyle = window.getComputedStyle(article);
                        const paddingTop = parseFloat(articleStyle.paddingTop) || 0;
                        const paddingBottom = parseFloat(articleStyle.paddingBottom) || 0;

                        // 余白やマージンのための微調整 (BeerCSSのデフォルトなどを考慮)
                        const extraBuffer = 32;

                        const decorationsHeight = (nav ? nav.offsetHeight : 0) +
                            (span ? span.offsetHeight : 0) +
                            paddingTop + paddingBottom + extraBuffer;

                        const newHeight = availableHeightForArticle - decorationsHeight;
                        if (newHeight > 0) {
                            el.style.height = `${newHeight}px`;
                        }
                    });
                } catch (e) {
                    console.error('Home panel height calculation failed:', e);
                }
            },

            setupResizeHandler: function () {
                if (this.isResizeHandlerBound) return;
                this.isResizeHandlerBound = true;

                window.addEventListener('resize', () => {
                    // Homeタブが表示されている場合のみ再計算
                    const tab = document.getElementById('tab-home');
                    if (tab && tab.style.display !== 'none') {
                        if (this.resizeRafId) cancelAnimationFrame(this.resizeRafId);
                        this.resizeRafId = requestAnimationFrame(() => {
                            this.applyPanelHeights();
                        });
                    }
                });
            }
        };
    })();
</script>
