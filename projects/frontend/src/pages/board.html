<!-- ボードページのコンテナ（動的に生成される） -->
<div id="tab-board" style="display: none;">
    <!-- 各ボードのタブが動的に生成される -->
</div>

<script>
    (function () {
        // 各ボードのページロジックを App.pages に登録
        App.pages.boards = {
            sortableInstances: {}, // SortableJS インスタンスを保持
            currentBoardId: null, // 現在表示中のボードID
            lastRenderTimes: {}, // ボードごとの最終レンダリング時刻
            cachedBoardTasks: {}, // ボードごとのタスクデータキャッシュ
            clickHandlers: {}, // ボードごとのクリックハンドラーを保持
            contextMenuHandlers: {}, // ボードごとのコンテキストメニューハンドラーを保持
            loadingPromises: {}, // ボードごとの読み込みPromiseを保持
            isResizeHandlerBound: false,
            resizeRafId: null,
            // マイボードのフィルタ設定
            myBoardFilters: {},
            // 表示モード: 'kanban' または 'list'
            viewMode: 'kanban',
            // ボードごとのリストソート状態 { boardId: { col: string, dir: 'asc'|'desc' } }
            listSortState: {},

            // ステータスキーとカラムIDのマッピング
            statusMapping: {
                'todo': 'TODO',
                'in-progress': 'IN_PROGRESS',
                'in-review': 'IN_REVIEW',
                'done': 'DONE'
            },

            // 逆マッピング（ステータスキーからボードIDへ）
            reverseStatusMapping: {
                'TODO': 'todo',
                'IN_PROGRESS': 'in-progress',
                'IN_REVIEW': 'in-review',
                'DONE': 'done'
            },

            /**
             * マイボードフィルタを初期化（初回のみ）
             */
            initializeMyBoardFilters: function (filterByActiveUser = true) {
                const userId = App.state.userId;
                if (!userId) return;

                this.myBoardFilters = {
                    title: '',
                    titleMatchMode: 'contains',
                    members: {
                        created_by: filterByActiveUser ? [userId] : [],
                        processed_by: filterByActiveUser ? [userId] : [],
                        reviewed_by: filterByActiveUser ? [userId] : [],
                        received_by: filterByActiveUser ? [userId] : []
                    },
                    dateRanges: {
                        starts_at: { from: null, to: null },
                        ends_at: { from: null, to: null }
                    },
                    boards: [],  // Array of board IDs to filter by
                    isOverdue: false,
                    ballHolderOnly: false
                };
            },

            /**
             * フィルタをリセット
             */
            resetMyBoardFilters: function () {
                this.initializeMyBoardFilters();
                this.loadData('my-board', false);
            },

            /**
             * マイボードフィルタを設定（ロードは行わない）
             */
            setMyBoardFilters: function (filters) {
                // 既存のフィルタとマージ、または上書き
                // filters構造: { members: { ... }, ... }
                // ここでは部分的な更新を想定してマージする
                if (filters.members) {
                    this.myBoardFilters.members = { ...this.myBoardFilters.members, ...filters.members };
                }
                // 必要に応じて他のフィールドもマージ処理を追加
            },

            /**
             * 指定したボードの読み込み完了を待機
             */
            waitForBoardLoad: function (boardId) {
                if (this.loadingPromises[boardId]) {
                    return this.loadingPromises[boardId];
                }
                return Promise.resolve();
            },

            /**
             * ボードページコンテナを初期化・再構築（差分更新）
             */
            initialize: function () {
                const boards = App.state.data.boards || [];
                const container = document.getElementById('tab-board');

                if (!container) return;

                // 既存のボードIDを取得
                const existingBoardIds = Array.from(container.children)
                    .filter(child => child.id && child.id.startsWith('tab-board-'))
                    .map(child => child.id.replace('tab-board-', ''));

                // 新しいボードリストのIDを取得（'my-board'を含める）
                const newBoardIds = boards.map(board => board.id);
                newBoardIds.push('my-board');

                // 削除されたボードを削除
                existingBoardIds.forEach(boardId => {
                    if (!newBoardIds.includes(boardId)) {
                        const pageDiv = document.getElementById(`tab-board-${boardId}`);
                        if (pageDiv) {
                            pageDiv.remove();
                        }
                    }
                });

                // 各ボードをループ
                boards.forEach(board => {
                    let pageDiv = document.getElementById(`tab-board-${board.id}`);
                    const headerHtml = `
                        <header class="small-margin no-padding">
                            <nav id="board-tab-header-${board.id}" class="no-margin no-padding row">
                                <div class="field transparent max no-margin bold">
                                    <input type="text" 
                                    value="${escapeHtml(board.name)}" 
                                    style="font-size: 1.75rem;" 
                                    placeholder="0000_ボード名"
                                    onfocus="if(this.value.trim() !== '') this.dataset.originalValue = this.value"
                                    onblur="App.pages.boards.updateBoardName('${board.id}', this.value, this)">
                                </div>
                                <div class="medium"></div>
                                <div class="no-margin no-padding small-round surface-container-low board-view-toggle" id="view-toggle-${board.id}" title="表示切替">
                                    <button class="square no-margin transparent view-kanban-btn" onclick="App.pages.boards.switchViewMode('${board.id}', 'kanban')" title="カンバン表示"><i>view_kanban</i></button>
                                    <button class="square no-margin transparent view-list-btn" onclick="App.pages.boards.switchViewMode('${board.id}', 'list')" title="リスト表示"><i>view_list</i></button>
                                </div>
                                <button class="circle transparent" id="btn-share-${board.id}">
                                    <i>share</i>
                                    <div class="tooltip bottom">共有</div>
                                </button>
                                <button class="circle transparent" id="btn-archive-${board.id}">
                                    <i>${board.is_active ? 'archive' : 'unarchive'}</i>
                                    <div class="tooltip bottom">${board.is_active ? 'アーカイブ' : 'アーカイブ解除'}</div>
                                </button>
                                <button class="circle transparent" id="btn-star-${board.id}">
                                    <i>star_border</i>
                                    <div class="tooltip bottom">スター</div>
                                </button>
                                <button class="circle transparent" id="btn-info-${board.id}">
                                    <i>info</i>
                                    <div class="tooltip bottom">ボードの<br>説明</div>
                                </button>
                            </nav>
                        </header>
                    `;

                    if (!pageDiv) {
                        // 新しいボード用のページコンテナを作成
                        pageDiv = document.createElement('div');
                        pageDiv.id = `tab-board-${board.id}`;
                        pageDiv.className = '';
                        pageDiv.style.display = 'none';

                        pageDiv.innerHTML = `
                            ${headerHtml}
                            <div id="kanban-canvas-${board.id}" class="top-margin"></div>
                            <div id="list-canvas-${board.id}" class="small-margin scroll surface-container-low small-round padding" style="display:none;"></div>
                        `;

                        container.appendChild(pageDiv);
                    } else {
                        // 既存のボードであってもnav要素を置換
                        const existingHeader = pageDiv.querySelector('header');
                        if (existingHeader) {
                            existingHeader.outerHTML = headerHtml;
                        }
                    }
                    // イベントを（再）登録
                    this.setupHeaderEvents(board);
                    // 現在の表示モードをトグルに反映
                    this.syncViewToggle(board.id);
                });

                // マイボード用のコンテナ生成
                this.initializeMyBoard(container);
                this.setupResizeHandler();
            },

            initializeMyBoard: function (container) {
                const boardId = 'my-board';
                let pageDiv = document.getElementById(`tab-board-${boardId}`);

                // マイボード用のヘッダー（アーカイブ・スターなし）
                const headerHtml = `
                <header class="small-margin">
                    <nav id="board-tab-header-${boardId}" class="no-padding no-margin row">
                        <h3 class="bold small">マイボード</h3>
                        <div class="max"></div>
                        <div class="no-margin no-padding small-round surface-container-low board-view-toggle" id="view-toggle-${boardId}" title="表示切替">
                            <button class="square no-margin transparent view-kanban-btn" onclick="App.pages.boards.switchViewMode('${boardId}', 'kanban')" title="カンバン表示"><i>view_kanban</i></button>
                            <button class="square no-margin transparent view-list-btn" onclick="App.pages.boards.switchViewMode('${boardId}', 'list')" title="リスト表示"><i>view_list</i></button>
                        </div>
                        <a onclick="App.pages.boards.resetMyBoardFilters()">
                            <span>デフォルトのフィルタ</span>
                            <div class="tooltip bottom">自分が担当者のタスクのみ表示</div>
                        </a>
                        <button class="circle transparent" onclick="if(App.modals.filterTask){ App.modals.filterTask.syncUI(); } ui('#modal-filter-task')">
                            <i>filter_list</i>
                            <div class="tooltip bottom">フィルタ</div>
                        </button>
                    </nav>
                </header>
                `;

                if (!pageDiv) {
                    pageDiv = document.createElement('div');
                    pageDiv.id = `tab-board-${boardId}`;
                    pageDiv.className = '';
                    pageDiv.style.display = 'none';

                    pageDiv.innerHTML = `
                        ${headerHtml}
                        <div id="kanban-canvas-${boardId}" class="top-margin"></div>
                        <div id="list-canvas-${boardId}" class="small-margin scroll surface-container-low small-round padding" style="display:none;"></div>
                    `;
                    container.appendChild(pageDiv);
                } else {
                    const existingHeader = pageDiv.querySelector('header');
                    if (existingHeader) {
                        existingHeader.outerHTML = headerHtml;
                    }
                }
                this.syncViewToggle(boardId);
            },

            loadData: async function (boardId, isRefresh = false) {
                if (!boardId) {
                    return;
                }

                if (!isRefresh || !this.currentBoardId) {
                    this.currentBoardId = boardId;
                }

                // 読み込みPromiseを作成
                let resolveLoad;
                const loadPromise = new Promise(resolve => resolveLoad = resolve);
                this.loadingPromises[boardId] = loadPromise;

                // キャンバスの表示状態とトグルUIを現在のviewModeに同期
                this.syncViewToggle(boardId);

                // 読み込み中アニメーションを表示
                if (!isRefresh) {
                    if (this.viewMode === 'list') {
                        this.renderList(boardId, true);
                    } else {
                        this.renderKanban(boardId, true);
                    }
                }

                try {
                    let tasks = [];
                    let result;

                    if (boardId === 'my-board') {
                        // マイボード: サーバーサイドでフィルタリング済みのタスクを取得
                        const filters = this.myBoardFilters || {};
                        result = await callGAS('getMyBoardTasks', App.state.userId, filters, isRefresh);
                        tasks = result?.data || result || [];
                    } else {
                        // 通常ボード: board_id で絞り込んで取得
                        const query = {
                            where: { board_id: ["=", boardId] }
                        };
                        result = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'select', query, null, isRefresh);
                        tasks = result?.data || result || [];
                    }

                    // ボード固有のタスクキャッシュに保存
                    this.cachedBoardTasks[boardId] = tasks;
                    this.mergeTasksIntoGlobalCache(tasks);

                    // 現在の表示モードで描画
                    if (this.viewMode === 'list') {
                        this.renderList(boardId, false);
                    } else {
                        this.renderKanban(boardId, false);
                    }

                    // 読み込み完了としてマーク
                    if (this.loadingPromises[boardId]) {
                        resolveLoad();
                        delete this.loadingPromises[boardId];
                    }

                    // isCachedチェック: キャッシュデータの場合はバックグラウンドで最新データを取得
                    if (result?.isCached === true) {
                        setTimeout(async () => {
                            try {
                                let freshTasks = [];
                                if (boardId === 'my-board') {
                                    const filters = this.myBoardFilters || {};
                                    const freshResult = await callGAS('getMyBoardTasks', App.state.userId, filters, true);
                                    freshTasks = freshResult?.data || freshResult || [];
                                } else {
                                    const query = {
                                        where: { board_id: ["=", boardId] }
                                    };
                                    const freshResult = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'select', query, null, true);
                                    freshTasks = freshResult?.data || freshResult || [];
                                }

                                this.cachedBoardTasks[boardId] = freshTasks;
                                this.mergeTasksIntoGlobalCache(freshTasks);

                                // 最新データで再描画（表示モードに準じる）
                                if (this.viewMode === 'list') {
                                    this.renderList(boardId, false);
                                } else {
                                    this.renderKanban(boardId, false);
                                }
                            } catch (error) {
                                console.error(`Board ${boardId} background refresh error:`, error);
                            }
                        }, 100);
                    }
                } catch (error) {
                    console.error('Error loading board tasks:', error);

                    // エラー時もPromiseを解決（待機側が進めるように）
                    if (this.loadingPromises[boardId]) {
                        resolveLoad();
                        delete this.loadingPromises[boardId];
                    }

                    App.utils.error.handle(error);
                }
            },


            renderKanban: function (boardId, isLoading = false) {
                const containerId = `kanban-canvas-${boardId}`;
                const container = document.getElementById(containerId);

                if (!container) {
                    return;
                }

                const columns = [
                    {
                        id: 'todo',
                        color: 'red',
                        title: '未着手',
                        filter: (t) => t.task_status_key === 'TODO'
                    },
                    {
                        id: 'in-progress',
                        color: 'yellow',
                        title: '進行中',
                        filter: (t) => t.task_status_key === 'IN_PROGRESS'
                    },
                    {
                        id: 'in-review',
                        color: 'purple',
                        title: '確認中',
                        filter: (t) => t.task_status_key === 'IN_REVIEW'
                    },
                    {
                        id: 'done',
                        color: 'green',
                        title: '完了',
                        filter: (t) => t.task_status_key === 'DONE'
                    }
                ];

                // 既存のSortableインスタンスを破棄（当該ボードの列のみ）
                columns.forEach(column => {
                    const listId = `kanban-${boardId}-${column.id}-list`;
                    if (this.sortableInstances && this.sortableInstances[listId]) {
                        if (typeof this.sortableInstances[listId].destroy === 'function') {
                            this.sortableInstances[listId].destroy();
                        }
                        delete this.sortableInstances[listId];
                    }
                });

                // ローカルキャッシュから取得（loadDataでJOIN済み）
                const rawBoardTasks = this.cachedBoardTasks[boardId] || [];
                // マイボードの場合はフロントエンドフィルタを適用（ballHolderOnly等）
                const boardTasks = (boardId === 'my-board' && this.myBoardFilters)
                    ? this.filterMyBoardTasks(rawBoardTasks)
                    : rawBoardTasks;

                // 最終レンダリング時刻を更新
                if (!isLoading) {
                    this.lastRenderTimes[boardId] = Date.now();
                }
                const memberMap = new Map((App.state.data.members || []).map(member => [member.id, member]));

                const html = [
                    '<div class="grid no-space">',
                    columns.map(column => {
                        let itemsHtml = '';
                        let countText = '-';

                        if (isLoading) {
                            itemsHtml = Array(4).fill(0).map((_, i) =>
                                `<article class="shimmer-loading small-margin no-elevate" style="height: 100px; animation-delay: ${i * 0.1}s; cursor: not-allowed;"></article>`
                            ).join('');
                        } else {
                            const columnTasks = boardTasks.filter(column.filter);
                            // ソート実行
                            columnTasks.sort((a, b) => {
                                if (column.id === 'done') {
                                    // 完了列の場合：ends_at、starts_atの順に降順（新しいものが上、nullは最後）
                                    if (!a.ends_at && !b.ends_at) {
                                        if (!a.starts_at && !b.starts_at) return 0;
                                        if (!a.starts_at) return 1;
                                        if (!b.starts_at) return -1;
                                        return new Date(b.starts_at) - new Date(a.starts_at);
                                    }
                                    if (!a.ends_at) return 1;
                                    if (!b.ends_at) return -1;
                                    const endsDiff = new Date(b.ends_at) - new Date(a.ends_at);
                                    if (endsDiff !== 0) return endsDiff;
                                    if (!a.starts_at && !b.starts_at) return 0;
                                    if (!a.starts_at) return 1;
                                    if (!b.starts_at) return -1;
                                    return new Date(b.starts_at) - new Date(a.starts_at);
                                } else {
                                    // その他の列：starts_at、ends_atの順に昇順（古いものが上、nullは最後）
                                    if (!a.starts_at && !b.starts_at) {
                                        // 両方nullの場合、ends_atで比較
                                        if (!a.ends_at && !b.ends_at) return 0;
                                        if (!a.ends_at) return 1;
                                        if (!b.ends_at) return -1;
                                        return new Date(a.ends_at) - new Date(b.ends_at);
                                    }
                                    if (!a.starts_at) return 1;
                                    if (!b.starts_at) return -1;

                                    const startsDiff = new Date(a.starts_at) - new Date(b.starts_at);
                                    if (startsDiff !== 0) return startsDiff;

                                    // starts_atが同じ場合、ends_atで比較（nullは最後）
                                    if (!a.ends_at && !b.ends_at) return 0;
                                    if (!a.ends_at) return 1;
                                    if (!b.ends_at) return -1;
                                    return new Date(a.ends_at) - new Date(b.ends_at);
                                }
                            });
                            itemsHtml = columnTasks.map(task => this.createTaskCard(task, memberMap)).join('');
                            countText = columnTasks.length;
                        }

                        return `
                            <div class="s12 m3 l3">
                                <div class="grid no-space">
                                    <div class="row tiny-space s12 no-round left-margin right-margin">
                                        <i class="tiny circle ${column.color}"></i>
                                        <span class="bold">${column.title}</span>
                                        <div class="max"></div>
                                        <span class="tiny">${countText}</span>
                                    </div>
                                    <div class="s12 scroll no-padding kanban-column-items" data-status-id="${column.id}" data-board-id="${boardId}" id="kanban-${boardId}-${column.id}-list">
                                        ${itemsHtml}
                                    </div>
                                </div>
                            </div>`;
                    }).join(''),
                    '</div>'
                ].join('');

                container.innerHTML = html;

                this.applyColumnHeights(boardId);

                if (!isLoading) {
                    this.bindCardEvents(container);
                    this.setupSortable(boardId);
                }
            },
            /**
             * 表示モードを切り替える（kanban ↔ list）
             */
            switchViewMode: function (boardId, mode) {
                this.viewMode = mode;

                // 全てのトグルUIと対象ボードのキャンバス表示を同期
                this.syncViewToggle(boardId);

                if (mode === 'list') {
                    this.renderList(boardId, false);
                } else {
                    this.renderKanban(boardId, false);
                }
            },

            /**
             * トグルスイッチのUI状態を viewMode に同期する
             */
            syncViewToggle: function (boardId) {
                // UI上のすべてのトグルに反映（ページ全体の共有仕様）
                document.querySelectorAll('.board-view-toggle .view-kanban-btn').forEach(btn => {
                    const isActive = this.viewMode !== 'list';
                    btn.classList.toggle('active', isActive);
                    btn.classList.toggle('fill', isActive);
                    btn.classList.toggle('transparent', !isActive);
                });
                document.querySelectorAll('.board-view-toggle .view-list-btn').forEach(btn => {
                    const isActive = this.viewMode === 'list';
                    btn.classList.toggle('active', isActive);
                    btn.classList.toggle('fill', isActive);
                    btn.classList.toggle('transparent', !isActive);
                });

                // 指定されたボードのキャンバス表示状態を切り替え
                if (boardId) {
                    const kanbanCanvas = document.getElementById(`kanban-canvas-${boardId}`);
                    const listCanvas = document.getElementById(`list-canvas-${boardId}`);
                    if (this.viewMode === 'list') {
                        if (kanbanCanvas) kanbanCanvas.style.display = 'none';
                        if (listCanvas) listCanvas.style.display = '';
                    } else {
                        if (listCanvas) listCanvas.style.display = 'none';
                        if (kanbanCanvas) kanbanCanvas.style.display = '';
                    }
                }
            },

            /**
             * リスト表示を描画する（BeerCSSのtableを使用）
             */
            renderList: function (boardId, isLoading = false) {
                const container = document.getElementById(`list-canvas-${boardId}`);
                if (!container) return;

                // ステータスの日本語変換マップ
                const statusColors = { 'TODO': 'red', 'IN_PROGRESS': 'yellow', 'IN_REVIEW': 'purple', 'DONE': 'green' };
                const statusLabels = { 'TODO': '未着手', 'IN_PROGRESS': '進行中', 'IN_REVIEW': '確認中', 'DONE': '完了' };
                // 優先度の日本語変換マップ
                const priorityLabels = { 'HIGH': '高', 'MEDIUM': '中', 'LOW': '低' };

                // カラム定義
                const columns = [
                    { key: 'display_id', label: 'タスク番号' },
                    { key: 'name', label: 'タスク名' },
                    { key: 'task_status_key', label: 'ステータス' },
                    { key: 'priority_key', label: '優先度' },
                    { key: 'starts_at', label: '開始日時' },
                    { key: 'ends_at', label: '終了日時' },
                    { key: '_members', label: '担当者', sortable: false },
                    { key: 'board_name', label: 'ボード' },
                    { key: 'updated_at', label: '最終更新' }
                ];

                // 現在のソート状態を取得（初期値は開始日時 asc, 終了日時 asc）
                if (!this.listSortState[boardId]) {
                    this.listSortState[boardId] = [
                        { col: 'starts_at', dir: 'asc' },
                        { col: 'ends_at', dir: 'asc' }
                    ];
                }
                const sortCriteria = this.listSortState[boardId];

                // タスクデータを取得・ソート
                const rawTasks = this.cachedBoardTasks[boardId] || [];
                const boardTasks = (boardId === 'my-board' && this.myBoardFilters)
                    ? this.filterMyBoardTasks(rawTasks)
                    : rawTasks;

                let sortedTasks = [...boardTasks];
                if (!isLoading && sortCriteria && sortCriteria.length > 0) {
                    sortedTasks.sort((a, b) => {
                        for (const crit of sortCriteria) {
                            if (crit.col === '_members') continue;

                            let va = a[crit.col];
                            let vb = b[crit.col];

                            // null/undefined を末尾に
                            if (va == null && vb == null) continue;
                            if (va == null) return 1;
                            if (vb == null) return -1;

                            let comparison = 0;
                            // 数値型（display_id）
                            if (!isNaN(va) && !isNaN(vb) && typeof va !== 'string' && typeof vb !== 'string') {
                                comparison = Number(va) - Number(vb);
                            } else {
                                // 文字列または日付として比較
                                const strA = String(va);
                                const strB = String(vb);
                                comparison = strA.localeCompare(strB, undefined, { numeric: true, sensitivity: 'base' });
                            }

                            if (comparison !== 0) {
                                return crit.dir === 'desc' ? -comparison : comparison;
                            }
                        }
                        return 0;
                    });
                }

                const memberMap = new Map((App.state.data.members || []).map(m => [m.id, m]));

                // ヘッダー行の生成
                const theadHtml = `<thead class="fixed"><tr>${columns.map(col => {
                    const sortable = col.sortable !== false;
                    // プライマリ（最初）のソート条件をアクティブとする
                    const primaryCrit = sortCriteria[0];
                    const isActive = primaryCrit && primaryCrit.col === col.key;
                    const sortIconHtml = isActive
                        ? (primaryCrit.dir === 'asc' ? 'expand_less' : 'expand_more')
                        : '';
                    const clickAttr = sortable
                        ? `onclick="App.pages.boards.sortList('${boardId}', '${col.key}')" style="cursor:pointer; user-select:none; white-space:nowrap;"`
                        : 'style="white-space:nowrap;"';
                    return `<th ${clickAttr}><div class="row tiny-space">${col.label}<i>${sortIconHtml}</i></div></th>`;
                }).join('')}</tr></thead>`;

                // ボディ行の生成
                let tbodyHtml;
                if (isLoading) {
                    // ローディング中：シマー行を表示
                    tbodyHtml = Array(8).fill(0).map(() =>
                        `<tr><td colspan="${columns.length}" class="shimmer-loading" style="height:1rem;"></td></tr>`
                    ).join('');
                } else if (sortedTasks.length === 0) {
                    tbodyHtml = `<tr><td colspan="${columns.length}" class="center-align secondary-text">タスクがありません</td></tr>`;
                } else {
                    // ステータスに応じたボールホルダーの opacity
                    const statusOpacityMap = {
                        'TODO': [0.4, 1.0, 0.4, 0.4],
                        'IN_PROGRESS': [0.4, 1.0, 0.4, 0.4],
                        'IN_REVIEW': [0.4, 0.4, 1.0, 0.4],
                        'DONE': [0.4, 0.4, 0.4, 1.0]
                    };
                    tbodyHtml = sortedTasks.map(task => {
                        const createdBy = memberMap.get(task.created_by);
                        const processedBy = memberMap.get(task.processed_by);
                        const reviewedBy = memberMap.get(task.reviewed_by);
                        const receivedBy = memberMap.get(task.received_by);

                        // タスク名の切り詰め（20字超で21字以降カット + …）
                        const name = task.name || '';
                        const truncatedName = name.length > 20 ? name.substring(0, 20) + '…' : name;

                        // 担当者アバターHTML（小サイズ・横並び）
                        const memberRoles = [
                            { member: createdBy, label: '作成者' },
                            { member: processedBy, label: '進行者' },
                            { member: reviewedBy, label: '確認者' },
                            { member: receivedBy, label: '受領者' }
                        ];
                        const opacities = statusOpacityMap[task.task_status_key] || [0.5, 0.5, 0.5, 0.5];
                        const membersHtml = memberRoles.map(({ member, label }, i) => {
                            const opacity = opacities[i];
                            const titleAttr = member ? `${escapeHtml(member.display_name)} (${label})` : label;
                            if (member && member.profile_photo_url) {
                                const safeUrl = sanitizeUrl(member.profile_photo_url);
                                if (safeUrl) {
                                    return `<i class="circle" style="opacity:${opacity};" title="${titleAttr}"><img src="${safeUrl}" class="responsive" alt="${escapeHtml(member.display_name)}"></i>`;
                                }
                            }
                            return `<i class="circle tertiary" style="opacity:${opacity};" title="${titleAttr}"><i>person</i></i>`;
                        }).join('');

                        // 期限超過チェック
                        const now = new Date();
                        const isEndsAtOverdue = task.ends_at && new Date(task.ends_at) < now && task.task_status_key !== 'DONE';
                        const rowClass = isEndsAtOverdue ? ' class="error-text"' : '';

                        // ボード名（JOINデータ優先）
                        const boardName = task.board_name
                            || (App.state.data.boards || []).find(b => b.id === task.board_id)?.name
                            || 'マイボード';

                        return `<tr${rowClass} style="cursor:pointer;" data-task-id="${task.id}">` +
                            `<td class="font-number"">
                                <div class="row tiny-space">
                                    <div class="list-menu-container">
                                        <button class="transparent circle list-menu-btn" data-task-id="${task.id}"><i>menu</i></button>
                                        <menu class="surface-container-lowest small-round no-line small-margin no-wrap min" id="context-menu-${task.id}">
                                            <li class="row no-margin" data-action="share">
                                                <i>share</i>
                                                <span>共有</span>
                                            </li>
                                            <li class="row no-margin" data-action="duplicate">
                                                <i>content_copy</i>
                                                <span>複製</span>
                                            </li>
                                            <li class="row no-margin" data-action="delete">
                                                <i>delete</i>
                                                <span>削除</span>
                                            </li>
                                        </menu>
                                    </div>
                                    ${escapeHtml(String(task.display_id || ''))}
                                </div>
                            </td>` +
                            `<td title="${escapeHtml(name)}">${escapeHtml(truncatedName)}</td>` +
                            `<td><div class="row tiny-space">
                                <i class="tiny circle ${statusColors[task.task_status_key] || ''}"></i>
                                ${statusLabels[task.task_status_key] || ''}
                            </div></td>` +
                            `<td>${priorityLabels[task.priority_key] || ''}</td>` +
                            `<td class="font-number">${formatDateTimeForDisplay(task.starts_at, 'MM/dd(E) HH:mm') || ''}</td>` +
                            `<td class="font-number">${formatDateTimeForDisplay(task.ends_at, 'MM/dd(E) HH:mm') || ''}</td>` +
                            `<td><div class="row tiny-space">${membersHtml}</div></td>` +
                            `<td>${escapeHtml(boardName)}</td>` +
                            `<td class="font-number">
                                ${formatDateTimeForDisplay(task.updated_at, 'MM/dd(E) HH:mm') || ''}
                            </td>` +
                            `</tr>`;
                    }).join('');
                }

                // テーブル全体のHTML（sticky thead + スクロールコンテナ）
                container.innerHTML =
                    '<div class="">' +
                    `<table class="border">${theadHtml}<tbody>${tbodyHtml}</tbody></table>` +
                    '</div>';

                // sticky thead スタイルを適用（BeerCSSにないため最小限インラインで対応）
                container.querySelectorAll('thead th').forEach(th => {
                    th.style.position = 'sticky';
                    th.style.top = '0';
                    th.style.zIndex = '1';
                });

                this.applyListHeight(boardId);

                if (!isLoading) {
                    this.bindCardEvents(container);
                }
            },

            /**
             * リスト表示のヘッダーカラムをクリックしてソートを切り替える
             */
            sortList: function (boardId, colKey) {
                if (!this.listSortState[boardId]) {
                    this.listSortState[boardId] = [
                        { col: 'starts_at', dir: 'asc' },
                        { col: 'ends_at', dir: 'asc' }
                    ];
                }
                const criteria = this.listSortState[boardId];
                const primary = criteria[0];

                if (primary && primary.col === colKey) {
                    // 同じカラムがプライマリの場合：昇順↔降順をトグル
                    primary.dir = primary.dir === 'asc' ? 'desc' : 'asc';
                } else {
                    // 別のカラム：現在のリストを先頭に追加（既存の同カラムは削除して重複を防ぐ）
                    const filtered = criteria.filter(c => c.col !== colKey);
                    this.listSortState[boardId] = [{ col: colKey, dir: 'asc' }, ...filtered];
                }
                this.renderList(boardId, false);
            },

            /**
             * リストスクロールコンテナの高さをカンバンと同じ計算式で設定する
             */
            applyListHeight: function (boardId) {
                const scrollDiv = document.querySelector(`#list-canvas-${boardId}`);
                if (!scrollDiv) return;
                try {
                    const mainElement = document.querySelector('main');
                    if (!mainElement) return;
                    const windowHeight = window.innerHeight;
                    const rect = scrollDiv.getBoundingClientRect();
                    if (rect.top <= 0) return;
                    const mainStyle = window.getComputedStyle(mainElement);
                    const marginBottom = parseFloat(mainStyle.marginBottom) || 0;
                    const paddingBottom = parseFloat(mainStyle.paddingBottom) || 0;
                    const offsetBottom = marginBottom + paddingBottom + 16;
                    const newHeight = windowHeight - rect.top - offsetBottom;
                    if (newHeight > 0) scrollDiv.style.height = `${newHeight}px`;
                } catch (e) {
                    console.error('List height calculation failed:', e);
                }
            },

            /**
             * SortableJSを初期化
             */
            setupSortable: function (boardId) {
                const container = document.getElementById(`kanban-canvas-${boardId}`);
                if (!container) return;

                const groupName = `kanban-${boardId}`;
                const columns = container.querySelectorAll('.kanban-column-items');

                columns.forEach(column => {
                    const listId = column.id;

                    if (this.sortableInstances[listId]) {
                        this.sortableInstances[listId].destroy();
                    }

                    this.sortableInstances[listId] = Sortable.create(column, {
                        group: groupName,
                        animation: 150,
                        ghostClass: 'surface-container',
                        dragClass: 'surface',
                        onEnd: (evt) => this.onDragEnd(evt, boardId)
                    });
                });
            },

            /**
             * ドラッグ終了時の処理
             */
            onDragEnd: function (evt, boardId) {
                const taskId = evt?.item?.dataset?.eid;
                const targetStatusId = evt?.to?.dataset?.statusId;
                const sourceStatusId = evt?.from?.dataset?.statusId;

                if (!taskId || !targetStatusId) {
                    return;
                }

                if (targetStatusId === sourceStatusId) {
                    return;
                }

                this.handleTaskDrop(taskId, targetStatusId, boardId, () => {
                    this.renderKanban(boardId);
                });
            },

            /**
             * カードのイベント設定（クリック、右クリック）
             */
            bindCardEvents: function (container) {
                if (!container) return;

                const containerId = container.id;
                const boardId = containerId.replace(/^(kanban|list)-canvas-/, '');

                // containerにIDがない場合は処理をスキップ
                if (!containerId) {
                    console.warn('[bindCardEvents] Container has no ID, skipping event binding');
                    return;
                }

                // 既存のハンドラーがあれば削除
                if (this.clickHandlers[containerId]) {
                    container.removeEventListener('click', this.clickHandlers[containerId]);
                }
                if (this.contextMenuHandlers[containerId]) {
                    container.removeEventListener('contextmenu', this.contextMenuHandlers[containerId]);
                }

                // 新しいハンドラーを作成
                const clickHandler = (e) => {
                    // リスト列のメニューボタンクリック処理
                    const listMenuBtn = e.target.closest('.list-menu-btn');
                    if (listMenuBtn) {
                        e.preventDefault();
                        e.stopPropagation();
                        // どこかをクリックしたら全てのメニューを閉じる処理と共通化するためまず全部閉じる
                        document.querySelectorAll('.kanban-card menu.active, tr[data-task-id] menu.active').forEach(m => m.classList.remove('active'));

                        const taskId = listMenuBtn.dataset.taskId;
                        const menu = document.getElementById(`context-menu-${taskId}`);
                        if (menu) {
                            menu.classList.add('active');
                        }
                        return;
                    }

                    // メニュー項目のクリック処理
                    const menuItem = e.target.closest('li[data-action]');
                    if (menuItem) {
                        e.stopPropagation();
                        // 親のカードを取得
                        const card = menuItem.closest('.kanban-card, tr[data-task-id]');
                        if (card) {
                            const action = menuItem.dataset.action;
                            const taskId = card.dataset.eid || card.dataset.taskId;
                            this.handleCardAction(action, taskId);

                            // メニューを閉じる
                            const menu = card.querySelector('menu');
                            if (menu) menu.classList.remove('active');
                        }
                        return;
                    }

                    // メニュー内のクリックはイベント伝播を止める（カードクリック扱いしない）
                    if (e.target.closest('menu')) {
                        e.stopPropagation();
                        return;
                    }

                    // どこかをクリックしたら全てのメニューを閉じる
                    document.querySelectorAll('.kanban-card menu.active, tr[data-task-id] menu.active').forEach(m => m.classList.remove('active'));

                    // ボタンでmousedown, メニュー項目でmouseupした場合などのクリック先がコンテナ(共通祖先)になるケースではカードを開かない
                    if (e.target.closest('.list-menu-container')) {
                        e.stopPropagation();
                        return;
                    }

                    // カードクリック処理
                    const card = e.target.closest('.kanban-card, tr[data-task-id]');
                    if (card) {
                        const taskId = card.dataset.eid || card.dataset.taskId;
                        if (taskId && App.modals.taskDetail) {
                            this.currentBoardId = boardId;
                            App.modals.taskDetail.open(taskId);
                        }
                    }
                };

                const contextMenuHandler = (e) => {
                    const card = e.target.closest('.kanban-card, tr[data-task-id]');
                    if (card) {
                        e.preventDefault();
                        e.stopPropagation(); // 他の要素のイベント発火を防ぐ

                        // 他のメニューを閉じる
                        document.querySelectorAll('.kanban-card menu.active, tr[data-task-id] menu.active').forEach(m => m.classList.remove('active'));

                        const taskId = card.dataset.eid || card.dataset.taskId;
                        const menu = document.getElementById(`context-menu-${taskId}`);
                        if (menu) {
                            menu.classList.add('active');
                        }
                    }
                };

                // ハンドラーを保存して追加
                this.clickHandlers[containerId] = clickHandler;
                this.contextMenuHandlers[containerId] = contextMenuHandler; // 保存

                container.addEventListener('click', clickHandler);
                container.addEventListener('contextmenu', contextMenuHandler);
            },

            /**
             * タスクドロップ時の処理
             */
            handleTaskDrop: function (taskId, targetStatusId, boardId, rollback) {
                if (!taskId || !targetStatusId) {
                    return;
                }

                // refreshDataが実行中の場合は中止する
                if (typeof refreshDataAbortController !== 'undefined' && refreshDataAbortController) {
                    console.log('[handleTaskDrop] refreshDataを中止します');
                    refreshDataAbortController.aborted = true;
                    refreshDataAbortController = null;
                }

                const newStatusKey = this.statusMapping[targetStatusId];
                if (!newStatusKey) {
                    if (typeof rollback === 'function') rollback();
                    return;
                }

                // 現在のタスクを取得して元のステータスを保存
                // ボード固有のデータ(this.cachedBoardTasks)を優先して検索
                const boardTasks = this.cachedBoardTasks[boardId] || [];
                const task = boardTasks.find(t => t.id === taskId);

                if (!task) {
                    console.error('Task not found in current board tasks:', taskId);
                    if (typeof rollback === 'function') rollback();
                    return;
                }

                const oldStatusKey = task.task_status_key;

                // 同じステータスへのドロップは無視
                if (oldStatusKey === newStatusKey) {
                    return;
                }

                // Optimistic UI update
                // 1. ボード固有のデータを直接更新
                task.task_status_key = newStatusKey;
                // 2. グローバルデータもあれば更新
                updateLocalData(TABLE_NAMES.TASKS, taskId, { task_status_key: newStatusKey });

                // DB更新
                callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.TASKS, 'update', {
                    where: { id: ["=", taskId] },
                    set: { task_status_key: newStatusKey }
                }, `タスクステータスを更新`)
                    .then(result => {
                        if (!result || (Array.isArray(result) && result.length === 0)) {
                            // ロールバック
                            task.task_status_key = oldStatusKey;
                            updateLocalData(TABLE_NAMES.TASKS, taskId, { task_status_key: oldStatusKey });
                            if (typeof rollback === 'function') rollback();
                            alert('ステータスの更新に失敗しました');
                        } else {
                            this.loadData(boardId, true);
                        }
                    })
                    .catch(error => {
                        // ロールバック
                        task.task_status_key = oldStatusKey;
                        updateLocalData(TABLE_NAMES.TASKS, taskId, { task_status_key: oldStatusKey });
                        if (typeof rollback === 'function') rollback();
                        App.utils.error.handle(error);
                    });
            },




            /**
             * 新しいボードを作成
             */
            createBoard: async function () {
                const promptValue = prompt('新しいボードの名前', '0000_ボード名');

                if (!promptValue) {
                    return;
                } else if (promptValue === '') {
                    alert('ボード名を入力してください');
                    return;
                }

                try {
                    showSnackBar('ボードを作成中です...');

                    const cleanItem = {
                        name: promptValue,
                        is_active: true
                    };

                    const result = await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'insert', cleanItem);
                    // insert returns the inserted object(s). If array, take first.
                    const newBoard = result?.data || null;

                    if (!newBoard || !newBoard.id) {
                        throw new Error('ボードの作成に失敗しました (No data returned)');
                    }

                    // ローカルデータを更新
                    App.state.data.boards.push(newBoard);

                    // 初期化（新しいタブのDOM作成）
                    this.initialize();

                    // ナビゲーション再描画
                    if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
                        App.utils.navigation.renderBoardsNavigation();
                    }

                    // タブ切り替え
                    if (App.utils.navigation && App.utils.navigation.switchTab) {
                        await App.utils.navigation.switchTab(`board-${newBoard.id}`);
                    }
                } catch (error) {
                    console.error('Failed to create board:', error);
                    App.utils.error.handle(error);
                }
            },

            /**
             * ボード名を更新
             */
            updateBoardName: async function (boardId, newName, inputElement) {
                if (!boardId) return;

                if (!newName || newName.trim() === "") {
                    if (inputElement && inputElement.dataset.originalValue) {
                        inputElement.value = inputElement.dataset.originalValue;
                    }
                    return;
                }

                // 見た目を更新 (Optimistic)
                const board = App.state.data.boards.find(b => b.id === boardId);
                if (board) {
                    const oldName = board.name;
                    if (oldName === newName) return; // 変更なし

                    board.name = newName;

                    // 左側のナビゲーションを再描画
                    if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
                        App.utils.navigation.renderBoardsNavigation();
                        // アクティブ状態を復元（renderBoardsNavigationの実装によってはリセットされるため）
                        const activeLink = document.querySelector(`a[data-board-id="${boardId}"]`);
                        if (activeLink) activeLink.classList.add('active');
                    }

                    try {
                        await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'update', {
                            where: { id: ["=", boardId] },
                            set: { name: newName }
                        }, 'ボード名を更新');
                    } catch (error) {
                        console.error('Failed to update board name:', error);
                        // ロールバック
                        board.name = oldName;
                        if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
                            App.utils.navigation.renderBoardsNavigation();
                        }
                        alert('ボード名の更新に失敗しました');
                    }
                }
            },

                        // 3. ナビゲーション再描画
                        if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
                            console.log('[btnStar] Re-rendering boards navigation...');
                            App.utils.navigation.renderBoardsNavigation();
                            console.log('[btnStar] Boards navigation re-rendered');
                        } else {
                            console.warn('[btnStar] App.utils.navigation.renderBoardsNavigation is not available');
                        }
                    });
                }
            },

            updateStarButton: function (boardId) {
                console.log('[updateStarButton] Called for board:', boardId);
                const btnStar = document.getElementById(`btn-star-${boardId}`);
                if (!btnStar) {
                    console.warn('[updateStarButton] Star button not found for board:', boardId);
                    return;
                }

                // 共通の getUserProperty を使用
                const starred = App.state.getUserProperty('starred_boards', []);
                console.log('[updateStarButton] Current starred_boards:', JSON.stringify(starred));
                const isStarred = starred.includes(boardId);
                console.log('[updateStarButton] Is board starred?', isStarred);

                // activeクラスの制御
                if (isStarred) {
                    btnStar.classList.add('active');
                    console.log('[updateStarButton] Added active class');
                } else {
                    btnStar.classList.remove('active');
                    console.log('[updateStarButton] Removed active class');
                }

                const icon = btnStar.querySelector('i');
                if (icon) {
                    icon.textContent = isStarred ? 'star' : 'star_border';
                    if (isStarred) {
                        icon.classList.add('fill');
                    } else {
                        icon.classList.remove('fill');
                    }
                    console.log('[updateStarButton] Icon updated to:', icon.textContent);
                }
            },

            /**
             * マイボードのタスクをフィルタリング
             */
            filterMyBoardTasks: function (tasks, lists = []) {
                // デスクトップ版では、基本的にフィルタはサーバーサイド（getMyBoardTasks）で完結させるため、
                // フロントエンドでのフィルタリングは行わず、そのままタスクを返します。
                return tasks;
            },

            createTaskCard: function (task, memberMap = null) {
                const displayId = task.display_id ? `#${task.display_id}` : '';
                const now = new Date();

                // App.state.data.members からメンバー情報を取得
                const membersById = memberMap || new Map((App.state.data.members || []).map(member => [member.id, member]));
                const createdBy = membersById.get(task.created_by);
                const processedBy = membersById.get(task.processed_by);
                const reviewedBy = membersById.get(task.reviewed_by);
                const receivedBy = membersById.get(task.received_by);

                // 1. 現在のステータスに対応する担当者がユーザーと同じ場合、ボーダーを追加
                let isCurrentUserAssignee = false;
                const currentUserId = App.state.userId;
                if (task.task_status_key === 'TODO' || task.task_status_key === 'IN_PROGRESS') {
                    isCurrentUserAssignee = task.processed_by === currentUserId;
                } else if (task.task_status_key === 'IN_REVIEW') {
                    isCurrentUserAssignee = task.reviewed_by === currentUserId;
                } else if (task.task_status_key === 'DONE') {
                    isCurrentUserAssignee = task.received_by === currentUserId;
                }

                // 2. starts_at または ends_at が超過しているかチェック
                const isStartsAtOverdue = task.starts_at && new Date(task.starts_at) < now && task.task_status_key === 'TODO';
                const isEndsAtOverdue = task.ends_at && new Date(task.ends_at) < now && task.task_status_key !== 'DONE';
                const isOverdue = isStartsAtOverdue || isEndsAtOverdue;

                // 3. 優先度アイコンの設定
                let priorityIcon = '';
                if (task.priority_key === 'HIGH') {
                    priorityIcon = `<i class="circle transparent red-text" title="優先度: 高">sprint</i>`;
                } else if (task.priority_key === 'MEDIUM') {
                    priorityIcon = `<i class="circle transparent" title="優先度: 中">directions_run</i>`;
                } else if (task.priority_key === 'LOW') {
                    priorityIcon = `<i class="circle transparent" title="優先度: 低">directions_walk</i>`;
                }

                const assigneeNames = [
                    createdBy ? createdBy.display_name : '',
                    processedBy ? processedBy.display_name : '',
                    reviewedBy ? reviewedBy.display_name : '',
                    receivedBy ? receivedBy.display_name : ''
                ];

                const assigneePhotoUrls = [
                    createdBy ? createdBy.profile_photo_url : null,
                    processedBy ? processedBy.profile_photo_url : null,
                    reviewedBy ? reviewedBy.profile_photo_url : null,
                    receivedBy ? receivedBy.profile_photo_url : null
                ];

                const assigneeLabels = ['作成者', '進行者', '確認者', '受領者'];

                const assigneeIcons = assigneePhotoUrls.map((url, index) => {
                    let opacity;
                    if (index === 1 && task.task_status_key === 'TODO') {
                        opacity = 1;
                    } else if (index === 1 && task.task_status_key === 'IN_PROGRESS') {
                        opacity = 1;
                    } else if (index === 2 && task.task_status_key === 'IN_REVIEW') {
                        opacity = 1;
                    } else if (index === 3 && task.task_status_key === 'DONE') {
                        opacity = 1;
                    } else {
                        opacity = 0.5;
                    }

                    let iconSrc;
                    if (url) {
                        // URLをサニタイズ（危険なプロトコルを除外）
                        const safeUrl = sanitizeUrl(url);
                        if (safeUrl) {
                            // URLはサニタイズ済みで安全なので、そのまま使用
                            iconSrc = `<img src="${safeUrl}" class="responsive">`;
                        } else {
                            iconSrc = `person`;
                        }
                    } else {
                        iconSrc = `person`;
                    }

                    return `
                        <i title="${assigneeNames[index]} (${assigneeLabels[index]})" class="circle tertiary" style="opacity: ${opacity};">
                            ${iconSrc}
                        </i>
                    `;
                });

                let datetimeSpan;
                if (!task.starts_at && !task.ends_at) {
                    datetimeSpan = `
                        <i class="error-text tiny">warning</i>
                        <span class="error-text">終了日時を設定してください</span>
                    `;
                } else {
                    const overdueClass = isOverdue ? ' error-text' : '';
                    datetimeSpan = `
                        <span class="${overdueClass}">${formatDateTimeForDisplay(task.starts_at, 'MM/dd(E)') || ''} - ${formatDateTimeForDisplay(task.ends_at, 'MM/dd(E) HH:mm') || ''}</span>
                    `;
                }

                let articleClasses = '';
                if (isEndsAtOverdue) {
                    articleClasses += ' error-container';
                }

                if (isCurrentUserAssignee) {
                    articleClasses += ' border error-border';
                }

                return `
                <article class="kanban-card elevate small-margin padding${articleClasses}" data-eid="${task.id}" role="button" style="cursor: move; position: relative;">
                    <div>
                        <span>${displayId} <strong>${escapeHtml(task.name || '')}</strong></span>
                    </div>
                    <div>
                        ${datetimeSpan}
                    </div>
                    <div class="tiny-space row">
                        ${priorityIcon}${assigneeIcons.join('')}
                    </div>
                    <menu class="surface-container-lowest small-round no-line small-margin no-wrap min" id="context-menu-${task.id}">
                        <li class="row no-margin" data-action="share">
                            <i>share</i>
                            <span>共有</span>
                        </li>
                        <li class="row no-margin" data-action="duplicate">
                            <i>content_copy</i>
                            <span>複製</span>
                        </li>
                        <li class="row no-margin" data-action="delete">
                            <i>delete</i>
                            <span>削除</span>
                        </li>
                    </menu>
                </article>
                `;
            },

            /**
             * ボード説明モーダルを開く
             */
            openDescriptionModal: function (boardId) {
                const board = App.state.data.boards.find(b => b.id === boardId);
                if (!board) return;

                // モーダルが既に存在する場合は削除
                const existingModal = document.getElementById(`modal-board-description-${boardId}`);
                if (existingModal) {
                    existingModal.remove();
                }

                // モーダルHTMLを生成
                const modalHtml = `
                    <dialog id="modal-board-description-${boardId}" class="modal padding no-scroll">
                        <nav class="small-padding bottom-margin">
                            <h5 class="max bold">ボードの説明</h5>
                            <button class="circle transparent" onclick="ui('#modal-board-description-${boardId}')">
                                <i>close</i>
                            </button>
                        </nav>
                        <div class="field border background scroll large-width small-padding small-round">
                            <textarea id="textarea-board-description-${boardId}" rows="10" placeholder="ここにボードの説明を入力してください。入力した内容は全員が閲覧できます。">${escapeHtml(board.description || '')}</textarea>
                        </div>
                        <nav class="right-align small-padding">
                            <button class="border" onclick="ui('#modal-board-description-${boardId}')">
                                <span>キャンセル</span>
                            </button>
                            <button onclick="App.pages.boards.saveBoardDescription('${boardId}')">
                                <span>保存</span>
                            </button>
                        </nav>
                    </dialog>
                `;

                // モーダルをDOMに追加
                document.body.insertAdjacentHTML('beforeend', modalHtml);

                // モーダルを開く
                ui(`#modal-board-description-${boardId}`);
            },

            /**
             * ボード説明を保存
             */
            saveBoardDescription: async function (boardId) {
                const textarea = document.getElementById(`textarea-board-description-${boardId}`);
                if (!textarea) return;

                const newDescription = textarea.value;
                const board = App.state.data.boards.find(b => b.id === boardId);
                if (!board) return;

                const oldDescription = board.description;

                // Optimistic UI update
                board.description = newDescription;

                // 左ナビゲーションを再描画
                if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
                    App.utils.navigation.renderBoardsNavigation();
                }

                // モーダルを閉じる
                ui(`#modal-board-description-${boardId}`);

                try {
                    await callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'update', {
                        where: { id: ["=", boardId] },
                        set: { description: newDescription }
                    }, 'ボードの説明を更新');

                    showSnackbar('ボードの説明を更新しました', 'success');
                } catch (error) {
                    console.error('Failed to update board description:', error);
                    // ロールバック
                    board.description = oldDescription;
                    if (tooltipDescription) {
                        tooltipDescription.textContent = oldDescription || 'ボードの説明を追加';
                    }
                    if (App.utils.navigation && App.utils.navigation.renderBoardsNavigation) {
                        App.utils.navigation.renderBoardsNavigation();
                    }
                    alert('ボードの説明の更新に失敗しました');
                }
            }
            ,

            handleCardAction: function (action, taskId) {
                // タスクオブジェクトを取得
                let task = this.getTaskById(taskId);
                if (!task) return;

                if (action === 'share') {
                    App.modals.taskDetail.shareTask(task);
                } else if (action === 'duplicate') {
                    App.modals.taskDetail.duplicateTask(task);
                } else if (action === 'delete') {
                    App.modals.taskDetail.deleteTask(taskId);
                }
            },

            getTaskById: function (taskId) {
                const boardId = this.currentBoardId;
                if (boardId && this.cachedBoardTasks[boardId]) {
                    const item = this.cachedBoardTasks[boardId].find(t => t.id === taskId);
                    if (item) return item;
                }
                for (const tasks of Object.values(this.cachedBoardTasks)) {
                    const item = tasks.find(t => t.id === taskId);
                    if (item) return item;
                }
                // フォールバック: グローバルキャッシュ
                if (App.state.data.tasks) {
                    return App.state.data.tasks.find(t => t.id === taskId);
                }
                return null;
            },

            setupResizeHandler: function () {
                if (this.isResizeHandlerBound) return;
                this.isResizeHandlerBound = true;

                window.addEventListener('resize', () => {
                    if (this.resizeRafId) {
                        cancelAnimationFrame(this.resizeRafId);
                    }
                    this.resizeRafId = requestAnimationFrame(() => {
                        const boardId = this.currentBoardId;
                        if (!boardId) return;
                        // 表示モードに応じて高さを再計算
                        if (this.viewMode === 'list') {
                            this.applyListHeight(boardId);
                        } else {
                            this.applyColumnHeights(boardId);
                        }
                    });
                });
            },

            applyColumnHeights: function (boardId) {
                const container = document.getElementById(`kanban-canvas-${boardId}`);
                if (!container) return;

                try {
                    const mainElement = document.querySelector('main');
                    const columnItems = container.querySelectorAll('.kanban-column-items');
                    if (!mainElement || columnItems.length === 0) return;

                    const windowHeight = window.innerHeight;
                    const mainStyle = window.getComputedStyle(mainElement);
                    const marginBottom = parseFloat(mainStyle.marginBottom) || 0;
                    const paddingBottom = parseFloat(mainStyle.paddingBottom) || 0;
                    const offsetBottom = marginBottom + paddingBottom + 16;

                    columnItems.forEach(item => {
                        const rect = item.getBoundingClientRect();
                        if (rect.top <= 0) return;
                        const newHeight = windowHeight - rect.top - offsetBottom;
                        if (newHeight > 0) {
                            item.style.height = `${newHeight}px`;
                        }
                    });
                } catch (e) {
                    console.error('Height calculation failed:', e);
                }
            },

            mergeTasksIntoGlobalCache: function (tasks) {
                if (!Array.isArray(tasks) || tasks.length === 0) return;
                if (!App.state.data) App.state.data = {};
                if (!Array.isArray(App.state.data.tasks)) App.state.data.tasks = [];

                const taskIndex = new Map(App.state.data.tasks.map((task, index) => [task.id, index]));
                tasks.forEach(task => {
                    const existingIndex = taskIndex.get(task.id);
                    if (existingIndex !== undefined) {
                        App.state.data.tasks[existingIndex] = task;
                    } else {
                        App.state.data.tasks.push(task);
                    }
                });
            }
        };
    })();
</script>
