<script>
  // グローバル変数
  const { TABLE_NAMES, KEY_LABELS, activeUser, EVENT_CONFIG, EXTERNAL_URLS } = templateVariables;

  // 本番環境（!isDevelopment）の場合、コンソール出力を抑制
  if (!templateVariables.isDevelopment) {
    const noop = () => { };
    console.log = noop;
    console.debug = noop;
    console.info = noop;
    console.warn = noop;
    // console.error も抑制したい場合は、上記と同様に noop を代入してください
  }

  // App.state の初期化
  (function () {
    App.state = {
      data: {
        boards: [],
        members: [],
        tasks: [],
        currentMember: null
      },

      userId: null,
      mobileActiveTab: 'tasks',
      userProperties: templateVariables.userProperties || {},
      isDevelopment: templateVariables.isDevelopment,

      get: function (tableName) {
        return this.data[tableName];
      },

      set: function (tableName, data) {
        this.data[tableName] = data;
      }
    };

    App.constants = Object.assign({}, App.constants || {}, {
      eventConfig: EVENT_CONFIG || {},
      externalUrls: EXTERNAL_URLS || {}
    });
  })();

  window.onload = initializeMobileApp;

  /**
   * モバイルアプリを初期化
   */
  async function initializeMobileApp() {
    console.log('[MobileApp] Initializing...');

    // ユーザーIDを設定
    if (activeUser && activeUser.id) {
      App.state.userId = activeUser.id;
    }

    setupMobileTabs();

    // ブラウザ履歴のハンドラーを設定
    setupBrowserHistoryHandlers();

    // データを読み込み（URLパラメータ復元より先にデータを確保する）
    await loadMobileData();

    // データロード完了後にURLパラメータから状態を復元
    restoreStateFromURL();

    console.log('[MobileApp] Initialization complete');
  }

  /**
   * モバイルデータを読み込み
   */
  async function loadMobileData() {
    try {
      // タブ表示に必要なデータを一括取得
      const [boardsRes, membersRes, currentMemberRes] = await Promise.all([
        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.BOARDS, 'select', {}, null, false),
        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.MEMBERS, 'select', {}, null, false),
        callGAS('handleDatabaseProcess', App.state.userId, TABLE_NAMES.MEMBERS, 'select', {
          where: { id: ['=', App.state.userId] }
        }, null, false)
      ]);

      App.state.data.boards = boardsRes?.data || boardsRes || [];
      App.state.data.members = membersRes?.data || membersRes || [];
      const currentMemberRows = currentMemberRes?.data || currentMemberRes || [];
      
      const foundMember = currentMemberRows[0]
        || (App.state.data.members || []).find(function (member) { return member.id === App.state.userId; });

      if (!foundMember) {
        ui('#modal-mobile-unauthorized');
        const helpLink = document.getElementById('unauthorized-help-link');
        if (helpLink && App.constants && App.constants.externalUrls) {
           helpLink.href = `${App.constants.externalUrls.PORTAL_SITE}/help`;
        }
        return;
      }

      App.state.data.currentMember = foundMember;

      const headerDisplayNameEl = document.getElementById('header_display_name');
      if (headerDisplayNameEl) {
        headerDisplayNameEl.textContent = foundMember.display_name || '';
      }

      // マイボードのデータを読み込み
      await App.pages.board.loadData();

      if (App.pages.attendance && typeof App.pages.attendance.loadData === 'function') {
        const isCached = currentMemberRes?.isCached || false;
        App.pages.attendance.loadData(App.state.data.currentMember, isCached);
      }

    } catch (error) {
      console.error('[MobileApp] Error loading data:', error);
      showSnackbar('データの読み込みに失敗しました');
    }
  }

  /**
   * URLパラメータから状態を復元
   */
  function restoreStateFromURL() {
    const url = new URL(window.location.href);
    const taskId = url.searchParams.get('task');
    const editor = url.searchParams.get('editor');

    if (taskId) {
      switchMobileTab('tasks');

      // データロード完了後に呼ばれるため、直接タスク詳細を開く
      App.modals.taskDetail.open(taskId);

      // エディタも開く場合（モーダル描画完了を待つために少し遅延）
      if (editor === 'description') {
        setTimeout(() => {
          App.modals.taskDetail.openQuillEditor();
        }, 300);
      }
    }
  }

  /**
   * モバイル用のタブナビゲーションを初期化
   */
  function setupMobileTabs() {
    switchMobileTab('attendance');
  }

  /**
   * モバイルタブを切り替える
   * @param {string} tabKey - tasks|attendance|manual
   */
  function switchMobileTab(tabKey) {
    const safeTabKey = ['tasks', 'attendance', 'manual'].includes(tabKey) ? tabKey : 'tasks';
    App.state.mobileActiveTab = safeTabKey;

    const pageMap = {
      tasks: '#tab-board',
      attendance: '#tab-attendance',
      manual: '#tab-manual'
    };

    ui(pageMap[safeTabKey]);

    const navLinks = document.querySelectorAll('nav.bottom a');
    navLinks.forEach(link => {
      if (link.getAttribute('nav-tab') === safeTabKey) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });

    const footer = document.querySelector('footer');
    const footerTasks = document.getElementById('footer-tasks');

    if (safeTabKey === 'tasks') {
      if (footer) footer.style.display = '';
      if (footerTasks) footerTasks.style.display = '';
    } else {
      if (footer) footer.style.display = 'none';
      if (footerTasks) footerTasks.style.display = 'none';
    }

    if (safeTabKey === 'attendance' && App.pages.attendance && typeof App.pages.attendance.refreshUIState === 'function') {
      App.pages.attendance.refreshUIState();
    }
  }

  /**
   * ブラウザ履歴のハンドラーを設定
   */
  function setupBrowserHistoryHandlers() {
    window.addEventListener('popstate', function (event) {
      console.log('[MobileApp] Popstate event:', event.state);

      const url = new URL(window.location.href);
      const taskId = url.searchParams.get('task');
      const editor = url.searchParams.get('editor');

      // エディタが開いている場合は閉じる
      const editorDialog = document.getElementById('modal-mobile-quill-editor');
      if (editorDialog && editorDialog.classList.contains('active')) {
        if (!editor) {
          App.modals.mobileQuillEditor.close();
          return;
        }
      }

      // タスク詳細が開いている場合
      const taskDialog = document.getElementById('modal-mobile-detail-task');
      if (taskDialog && taskDialog.classList.contains('active')) {
        if (!taskId) {
          // タスク詳細を閉じる
          App.modals.taskDetail.close(true);
          return;
        }
      }

      // タスクを開く
      if (taskId && (!taskDialog || !taskDialog.classList.contains('active'))) {
        App.modals.taskDetail.open(taskId);
      }
    });
  }

  /**
   * Google Apps Scriptの関数を呼び出す
   */
  async function callGAS(functionName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
      [functionName](...args);
    });
  }

  /**
   * HTMLエスケープ
   */
  function escapeHtml(text) {
    if (!text) return '';
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    };
    return String(text).replace(/[&<>"']/g, m => map[m]);
  }

  /**
   * 日時を指定形式でフォーマットします
   */
  function formatDatetimeForDisplay(dateString, format = 'yyyy/MM/dd(E) HH:mm') {
    if (!dateString) return '';
    try {
      const dt = new Date(dateString);
      if (isNaN(dt.getTime())) return '';
      const year = String(dt.getFullYear()).padStart(4, '0');
      const month = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const weekday = weekdays[dt.getDay()];
      const hours = String(dt.getHours()).padStart(2, '0');
      const minutes = String(dt.getMinutes()).padStart(2, '0');
      const seconds = String(dt.getSeconds()).padStart(2, '0');

      return format
        .replace(/yyyy/g, year)
        .replace(/MM/g, month)
        .replace(/dd/g, day)
        .replace(/E/g, weekday)
        .replace(/HH/g, hours)
        .replace(/mm/g, minutes)
        .replace(/ss/g, seconds);
    } catch (e) {
      return dateString;
    }
  }

  /**
   * input type="datetime-local" 用のフォーマット (YYYY-MM-DDThh:mm)
   */
  function formatDateTimeForInput(dateString) {
    if (!dateString) return '';
    try {
      const dt = new Date(dateString);
      if (isNaN(dt.getTime())) return '';
      const offset = dt.getTimezoneOffset() * 60000;
      const localDate = new Date(dt.getTime() - offset);
      return localDate.toISOString().slice(0, 16);
    } catch (e) {
      return '';
    }
  }

  /**
   * スナックバーを表示
   */
  function showSnackbar(message, duration = 3000) {
    const snackbar = document.getElementById('global-snackbar');
    if (!snackbar) return;

    snackbar.textContent = message;
    snackbar.classList.add('active');

    setTimeout(() => {
      snackbar.classList.remove('active');
    }, duration);
  }

  /**
   * ローディングを表示/非表示
   */
  function showLoading() {
    // モバイル版では簡易的な実装
    console.log('[MobileApp] Loading...');
  }

  function hideLoading() {
    console.log('[MobileApp] Loading complete');
  }

  /**
   * 指定ミリ秒待機する
   * @param {number} ms - 待機ミリ秒
   * @returns {Promise}
   */
  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }
</script>
