<div id="tab-board" class="page active">
  <!-- タスク一覧表示エリア -->
  <div id="tab-board-container">
    <!-- JavaScriptで動的に生成 -->
  </div>
</div>

<script>
  (function () {
    const container = document.getElementById('tab-board-container');
    if (container) {
      container.innerHTML = Array(4).fill(0).map((_, i) =>
        `<article class="shimmer-loading small-margin no-elevate" style="height: 120px; animation-delay: ${i * 0.1}s; cursor: not-allowed;"></article>`
      ).join('');
    }

    App.pages.board = {
      // データのキャッシュ
      cachedTasks: [],
      currentFilters: {
        status: ['TODO', 'IN_PROGRESS', 'IN_REVIEW'], // デフォルトでDONE以外を表示
        priority: [],
        assigneeRoles: {
          created_by: false,
          processed_by: false,
          reviewed_by: false,
          received_by: false
        },
        ballHolderOnly: false,
        boards: [] // ボードフィルタ（空の場合は全ボード）
      },

      /**
       * データを読み込んでタスク一覧を表示
       */
      loadData: async function (isRefresh = false) {
        console.log('[MobileBoard] Loading data... isRefresh:', isRefresh);

        try {
          // 読み込み中アニメーションを表示
          if (!isRefresh) {
            const container = document.getElementById('tab-board-container');
            if (container) {
              container.innerHTML = Array(4).fill(0).map((_, i) =>
                `<article class="shimmer-loading small-margin no-elevate" style="height: 120px; animation-delay: ${i * 0.1}s; cursor: not-allowed;"></article>`
              ).join('');
            }
          }

          // モバイル専用タスク取得：userId由来条件をサーバー側で強制（members指定は無視される）
          const mobileFilters = {
            title: '',
            titleMatchMode: 'contains',
            boards: this.currentFilters.boards || [],
            dateRanges: {
              starts_at: { from: null, to: null },
              ends_at: { from: null, to: null }
            },
            isOverdue: false,
            ballHolderOnly: this.currentFilters.ballHolderOnly
          };

          const tasksRes = await callGAS('getMobileUserTasks', App.state.userId, mobileFilters, isRefresh);
          const tasks = tasksRes?.data || tasksRes || [];

          // キャッシュ更新
          this.cachedTasks = tasks;

          // 描画
          this.renderTasks(tasks);

          // キャッシュヒット時の再取得（バックグラウンド）
          if (!isRefresh && tasksRes?.isCached) {
            console.log('[MobileBoard] Cached data detected. Refreshing in background...');
            setTimeout(() => {
              this.loadData(true);
            }, 100);
          }

        } catch (error) {
          console.error('[MobileBoard] Error loading data:', error);
          this.showError('データの読み込みに失敗しました');
        }
      },

      /**
       * タスク一覧を描画
       */
      renderTasks: function (tasks) {
        const container = document.getElementById('tab-board-container');
        if (!container) return;

        // フィルタリング
        let filteredTasks = this.filterTasks(tasks);

        // ソート: 期限が近い順（home.htmlのロジックを使用）
        filteredTasks = this.sortTasks(filteredTasks);

        // 描画
        let html = '';
        if (filteredTasks.length === 0) {
          html = `
            <article class="padding center-align no-elevate">
              <i class="extra secondary-text">inbox</i>
              <p class="secondary-text">タスクはありません</p>
            </article>
          `;
        } else {
          filteredTasks.forEach(task => {
            html += this.renderTaskCard(task);
          });
        }

        container.innerHTML = html;
      },

      /**
       * タスクカードを描画
       */
      renderTaskCard: function (task) {
        const statusText = (KEY_LABELS && KEY_LABELS.TASK_STATUS && KEY_LABELS.TASK_STATUS[task.task_status_key]) || task.task_status_key;
        const priorityText = (KEY_LABELS && KEY_LABELS.PRIORITY && KEY_LABELS.PRIORITY[task.priority_key]) || '-';

        // 期限情報の計算
        const deadlineInfo = this.getDeadlineInfo(task);

        // 担当者情報
        const members = App.state.data.members || [];
        const processedBy = members.find(m => m.id === task.processed_by);
        const assigneeName = processedBy ? escapeHtml(processedBy.display_name) : '未設定';

        let avatarHtml = '';
        if (processedBy && processedBy.profile_photo_url) {
          avatarHtml = `<i class="circle small no-margin"><img src="${escapeHtml(processedBy.profile_photo_url)}" class="responsive" alt="${assigneeName}"></i>`;
        } else {
          const initial = assigneeName !== '未設定' ? assigneeName.charAt(0).toUpperCase() : '?';
          avatarHtml = `<i class="circle small no-margin primary-container"><span>${initial}</span></i>`;
        }

        // task.idをエスケープ（onclick属性内で使用）
        const escapedTaskId = escapeHtml(task.id);
        const board = App.state.data.boards.find(b => b.id === task.board_id);

        return `
          <article class="no-elevate small-margin padding" onclick="App.pages.board.openTask('${escapedTaskId}')">
            <div class="row top-align">
              <div class="max">
                <h6 class="small"><span class="secondary-text font-number">#${task.display_id}</span> ${escapeHtml(task.name)}</h6>
                <span class="small-text top-margin secondary-text">${escapeHtml(board?.name || "マイボード")}</span>
              </div>
              <div>
                <span class="chip small ${deadlineInfo.class}">${deadlineInfo.text}</span>
              </div>
            </div>
          </article>
        `;
      },

      /**
       * 期限情報を取得
       */
      getDeadlineInfo: function (task) {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        const isTodo = task.task_status_key === 'TODO';
        const targetDateStr = isTodo ? task.starts_at : task.ends_at;

        let text = '-';
        let cssClass = '';

        if (targetDateStr) {
          const targetDate = new Date(targetDateStr);
          const targetDay = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());

          const diffTime = targetDay - today;
          const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

          const suffix = isTodo ? '開始' : '終了';

          if (diffDays === 0) {
            text = `本日${suffix}`;
            cssClass = 'warning-text';
          } else if (diffDays > 0) {
            text = `${diffDays}日後${suffix}`;
          } else {
            text = `${Math.abs(diffDays)}日前${suffix}`;
            cssClass = 'error-text bold';
          }
        }

        return { text, class: cssClass };
      },

      /**
       * タスクをソート
       */
      sortTasks: function (tasks) {
        return tasks.slice().sort((a, b) => {
          const getKeys = (t) => {
            const isTodo = t.task_status_key === 'TODO';
            if (isTodo) {
              return {
                primary: t.starts_at || '9999-12-31T23:59:59',
                secondary: t.ends_at || '9999-12-31T23:59:59'
              };
            } else {
              return {
                primary: t.ends_at || '9999-12-31T23:59:59',
                secondary: t.starts_at || '9999-12-31T23:59:59'
              };
            }
          };

          const kA = getKeys(a);
          const kB = getKeys(b);

          if (kA.primary !== kB.primary) return kA.primary.localeCompare(kB.primary);
          return kA.secondary.localeCompare(kB.secondary);
        });
      },

      /**
       * タスクをフィルタリング
       */
      filterTasks: function (tasks) {
        const userId = App.state.userId;
        return tasks.filter(task => {
          // ステータスフィルタ
          if (this.currentFilters.status.length > 0) {
            if (!this.currentFilters.status.includes(task.task_status_key)) {
              return false;
            }
          }

          // 優先度フィルタ
          if (this.currentFilters.priority.length > 0) {
            if (!this.currentFilters.priority.includes(task.priority_key)) {
              return false;
            }
          }

          // ボードフィルタ
          if (this.currentFilters.boards && this.currentFilters.boards.length > 0) {
            if (!this.currentFilters.boards.includes(task.board_id)) {
              return false;
            }
          }

          // 担当者ロールフィルタ
          const roles = this.currentFilters.assigneeRoles || {};
          const checkedRoles = ['created_by', 'processed_by', 'reviewed_by', 'received_by'].filter(r => roles[r]);
          if (checkedRoles.length > 0) {
            const match = checkedRoles.some(role => task[role] === userId);
            if (!match) return false;
          }

          // ボールホルダーフィルタ
          if (this.currentFilters.ballHolderOnly) {
            let ballRole;
            if (task.task_status_key === 'TODO' || task.task_status_key === 'IN_PROGRESS') {
              ballRole = 'processed_by';
            } else if (task.task_status_key === 'IN_REVIEW') {
              ballRole = 'reviewed_by';
            } else if (task.task_status_key === 'DONE') {
              ballRole = 'received_by';
            }
            if (!ballRole || task[ballRole] !== userId) return false;
          }

          return true;
        });
      },

      /**
       * タスク詳細を開く
       */
      openTask: function (taskId) {
        // URLパラメータを更新（ブラウザ履歴に追加）
        const url = new URL(window.location.href);
        url.searchParams.set('task', taskId);
        window.history.pushState({ task: taskId }, '', url.toString());

        // タスク詳細モーダルを開く
        App.modals.taskDetail.open(taskId);
      },

      /**
       * エラー表示
       */
      showError: function (message) {
        const container = document.getElementById('tab-board-container');
        if (!container) return;

        container.innerHTML = `
          <article class="padding center-align">
            <i class="extra error-text">error</i>
            <p class="error-text">${escapeHtml(message)}</p>
          </article>
        `;
      }
    };
  })();
</script>
